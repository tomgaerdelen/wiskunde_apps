<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6doTW afgeleiden semester 1</title>
<!-- Externe bibliotheken (vaste versies):
     KaTeX voor de wiskundige weergave, html2canvas + jsPDF voor het PDF-rapport,
     Patrick Hand voor de handgeschreven feedback van de leerkracht.
     Zonder internet werkt de app ook, maar dan worden formules als tekst getoond
     en kan er geen PDF gemaakt worden. -->
<link rel="stylesheet" href="lib/katex/katex.min.css">
<script src="lib/katex/katex.min.js"></script>
<link rel="stylesheet" href="lib/patrick-hand/patrick-hand.css">
<script defer src="lib/html2canvas-1.4.1.min.js"></script>
<script defer src="lib/jspdf-2.5.1.umd.min.js"></script>
<style>
    :root {
        --bg: #f1f5f9; --kaart: #ffffff; --rand: #e2e8f0; --tekst: #1e293b; --zacht: #64748b; --heel-zacht: #94a3b8;
        --blauw: #1e3a8a; --blauw-licht: #eff6ff; --blauw-rand: #bfdbfe;
        --groen: #059669; --groen-donker: #047857; --groen-licht: #ecfdf5; --groen-rand: #a7f3d0;
        --rood: #e11d48; --rood-donker: #be123c; --rood-licht: #fff1f2; --rood-rand: #fecdd3;
        --oranje-licht: #fffbeb; --oranje-rand: #fde68a; --oranje-tekst: #92400e;
        --paars: #4f46e5; --paars-licht: #eef2ff; --paars-rand: #c7d2fe;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--tekst); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.45; }
    #app { max-width: 960px; margin: 0 auto; padding: 16px 16px 56px; }
    button { font: inherit; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
    p { margin: 0 0 8px; }
    .kaart { background: var(--kaart); border: 1px solid var(--rand); border-radius: 16px; box-shadow: 0 4px 18px rgba(15, 23, 42, .06); }
    .kaart-binnen { padding: 20px; }
    .grijs { color: var(--zacht); }
    .klein { font-size: .85rem; }
    .verborgen { display: none !important; }
    .katex { font-size: 1.08em; }
    .katex-display { margin: .5em 0; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }

    /* ---------- knoppen ---------- */
    .knop { border: none; border-radius: 12px; padding: 11px 16px; font-weight: 700; transition: background .15s, transform .05s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .knop:active:not(:disabled) { transform: translateY(1px); }
    .knop-groen { background: var(--groen); color: #fff; } .knop-groen:hover:not(:disabled) { background: var(--groen-donker); }
    .knop-rood { background: var(--rood); color: #fff; } .knop-rood:hover:not(:disabled) { background: var(--rood-donker); }
    .knop-blauw { background: var(--blauw); color: #fff; } .knop-blauw:hover:not(:disabled) { background: #172554; }
    .knop-donker { background: #1e293b; color: #fff; } .knop-donker:hover:not(:disabled) { background: #0f172a; }
    .knop-licht { background: #fff; color: var(--tekst); border: 1px solid var(--rand); } .knop-licht:hover:not(:disabled) { background: #f8fafc; }
    .knop-blauw-licht { background: var(--blauw-licht); color: var(--blauw); border: 1px solid var(--blauw-rand); } .knop-blauw-licht:hover:not(:disabled) { background: #dbeafe; }
    .knop-geel { background: #fef9c3; color: #854d0e; border: 1px solid #fde047; } .knop-geel:hover:not(:disabled) { background: #fef08a; }
    .knop-groot { padding: 15px 22px; font-size: 1.08rem; }
    .knop-klein { padding: 7px 11px; font-size: .88rem; border-radius: 9px; }
    .knop-rij { display: flex; flex-wrap: wrap; gap: 10px; }
    .linkknop { background: none; border: none; padding: 0; color: #2563eb; font-weight: 600; text-decoration: underline; }

    /* ---------- menu ---------- */
    .kop { text-align: center; padding: 24px 20px 6px; }
    .kop h1 { color: var(--blauw); font-size: 1.95rem; font-weight: 800; }
    .kop p { margin: 6px 0 0; color: var(--zacht); }
    .naam-rij { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .naam-rij .veld { flex: 1 1 200px; }
    .veld { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; font-weight: 600; color: #475569; }
    .veld input, .veld select { font: inherit; font-weight: 500; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; }
    .modus-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
    .modus { border-radius: 14px; padding: 16px; border: 2px solid var(--rand); background: #fff; text-align: left; display: flex; flex-direction: column; gap: 4px; }
    .modus b { font-size: 1.08rem; }
    .modus span { font-size: .86rem; color: var(--zacht); font-weight: 500; }
    .modus.theorie { border-color: var(--paars-rand); background: var(--paars-licht); } .modus.theorie b { color: var(--paars); }
    .modus.oefen { border-color: var(--groen-rand); background: var(--groen-licht); } .modus.oefen b { color: var(--groen-donker); }
    .modus.toets { border-color: var(--rood-rand); background: var(--rood-licht); } .modus.toets b { color: var(--rood-donker); }
    .modus.aan { box-shadow: 0 0 0 3px rgba(30, 58, 138, .25); }
    .sectie-titel { font-size: 1.05rem; color: #334155; margin: 20px 0 10px; font-weight: 800; }
    .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; }
    .cat { display: flex; gap: 12px; align-items: flex-start; text-align: left; background: #fff; border: 2px solid var(--rand); border-radius: 14px; padding: 12px 14px; }
    .cat:hover { border-color: #94a3b8; }
    .cat.aan { border-color: var(--blauw); background: var(--blauw-licht); }
    .cat .ico { flex: none; width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; font-weight: 800; color: #fff; font-family: "Times New Roman", serif; font-style: italic; }
    .cat b { display: block; font-size: .98rem; }
    .cat small { display: block; color: var(--zacht); font-size: .8rem; margin-top: 2px; }
    .cat .so { display: inline-block; font-size: .7rem; font-weight: 800; color: #475569; background: #f1f5f9; border-radius: 6px; padding: 1px 6px; margin-right: 6px; vertical-align: 1px; font-style: normal; }
    .cat .stat { display: block; color: var(--groen-donker); font-size: .76rem; margin-top: 4px; font-weight: 700; }
    .keuze-rij { display: flex; flex-wrap: wrap; gap: 8px; }
    .keuze { flex: 1 1 120px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--rand); background: #fff; font-weight: 700; color: #334155; text-align: center; }
    .keuze small { display: block; font-weight: 500; color: var(--zacht); margin-top: 2px; font-size: .78rem; }
    .keuze.aan { border-color: var(--blauw); background: var(--blauw-licht); color: var(--blauw); }
    .instel { background: #f8fafc; border: 1px solid var(--rand); border-radius: 14px; padding: 14px 16px; margin-top: 14px; }
    .instel h3 { font-size: .98rem; color: #334155; margin-bottom: 8px; }
    .types-lijst { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 6px; }
    .type-optie { display: flex; gap: 8px; align-items: flex-start; font-size: .88rem; background: #fff; border: 1px solid var(--rand); border-radius: 10px; padding: 7px 10px; cursor: pointer; }
    .type-optie input { margin-top: 3px; accent-color: var(--groen); }
    .type-optie .niv { margin-left: auto; flex: none; }
    .melding { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--oranje-licht); border: 1px solid var(--oranje-rand); color: var(--oranje-tekst); font-size: .92rem; }
    .snel { display: flex; gap: 14px; }

    /* ---------- labels ---------- */
    .label { font-size: .72rem; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: #e2e8f0; color: #334155; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
    .label.n1 { background: #dcfce7; color: #166534; } .label.n2 { background: #fef9c3; color: #854d0e; } .label.n3 { background: #fee2e2; color: #991b1b; }
    .label.pt { background: #e0e7ff; color: #3730a3; }
    .label.gg { background: #e0f2fe; color: #075985; border: 1px solid #7dd3fc; text-transform: none; letter-spacing: 0; }

    /* ---------- oefen- en toetsscherm ---------- */
    .balk { display: flex; align-items: center; gap: 10px; padding: 12px 16px; color: #fff; border-radius: 16px 16px 0 0; flex-wrap: wrap; }
    .balk.oefen { background: #065f46; } .balk.toets { background: #881337; } .balk.theorie { background: #3730a3; }
    .balk h2 { font-size: 1.05rem; flex: 1 1 auto; }
    .balk .terug { background: rgba(255,255,255,.14); color: #fff; border: none; border-radius: 10px; padding: 8px 12px; font-weight: 600; }
    .balk .terug:hover { background: rgba(255,255,255,.25); }
    .teller { background: rgba(255,255,255,.14); border-radius: 999px; padding: 4px 12px; font-size: .86rem; font-weight: 600; white-space: nowrap; }
    .voortgang { height: 6px; background: #fecdd3; }
    .voortgang div { height: 100%; background: var(--rood); transition: width .3s; }
    .niveau-balk { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 16px; background: #f8fafc; border-bottom: 1px solid var(--rand); font-size: .88rem; }
    .niveau-balk .keuze { flex: 0 0 auto; padding: 5px 12px; font-size: .85rem; }
    .opgave { background: #f8fafc; border: 1px solid var(--rand); border-radius: 14px; padding: 14px 16px 16px; }
    .opgave-labels { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
    .opgave-titel { font-weight: 800; color: #334155; margin-right: 4px; }
    .opgave-tekst { font-size: 1.04rem; }
    .opgave-tekst .katex-display { text-align: left; }
    .opgave-tekst .katex-display > .katex { text-align: left; }
    .figuur { display: flex; justify-content: center; margin: 6px 0; }
    .figuur svg { max-width: 100%; height: auto; }
    .deel { margin-top: 14px; border: 1px solid var(--rand); border-radius: 14px; padding: 12px 14px; background: #fff; }
    .deel.juist { border-color: var(--groen-rand); background: #fbfffd; }
    .deel.fout { border-color: var(--rood-rand); }
    .deel-kop { display: flex; gap: 8px; align-items: baseline; margin-bottom: 8px; }
    .deel-kop .letter { font-weight: 800; color: var(--blauw); flex: none; }
    .deel-kop .vraag { flex: 1; }
    .deel-kop .ptn { flex: none; font-size: .78rem; color: var(--zacht); font-weight: 700; }
    .invoer { padding: 10px 12px; font-size: 1.05rem; font-family: ui-monospace, Consolas, monospace; border: 2px solid #cbd5e1; border-radius: 10px; outline: none; background: #fff; min-width: 0; }
    .invoer:focus { border-color: #3b82f6; }
    .invoer:disabled { background: #f1f5f9; color: var(--zacht); }
    .invoer.breed { width: 100%; }
    .invoer.co { width: 130px; text-align: center; }
    .rij { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
    .rij .lbl { font-size: 1.1rem; white-space: nowrap; }
    .rij .haak { font-size: 1.4rem; color: #475569; }
    .rij.vgl .invoer { flex: 1 1 260px; }
    .preview { min-height: 30px; margin-top: 4px; padding: 4px 10px; border: 1px dashed #cbd5e1; border-radius: 10px; background: #fcfdff; font-size: 1.02rem; overflow-x: auto; overflow-y: hidden; }
    .preview:empty { display: none; }
    .preview .lees-fout { color: #b45309; font-size: .88rem; }
    .opties { display: flex; flex-direction: column; gap: 6px; }
    .optie { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border: 2px solid var(--rand); border-radius: 10px; cursor: pointer; background: #fff; }
    .optie:hover { border-color: #94a3b8; }
    .optie input { margin-top: 4px; accent-color: var(--blauw); flex: none; }
    .optie.gekozen { border-color: var(--blauw); background: var(--blauw-licht); }
    .opties.janee { flex-direction: row; flex-wrap: wrap; }
    .opties.janee .optie { flex: 1 1 140px; }
    .feedback { margin-top: 10px; padding: 10px 14px; border-radius: 10px; display: flex; gap: 10px; align-items: flex-start; font-size: .96rem; }
    .feedback .ico { font-size: 1.15rem; line-height: 1.2; flex: none; }
    .feedback.juist { background: var(--groen-licht); border: 1px solid var(--groen-rand); color: #065f46; }
    .feedback.fout { background: var(--rood-licht); border: 1px solid var(--rood-rand); color: #9f1239; }
    .feedback.info { background: var(--oranje-licht); border: 1px solid var(--oranje-rand); color: var(--oranje-tekst); }
    .hulp { margin-top: 14px; background: var(--blauw-licht); border: 1px solid var(--blauw-rand); border-radius: 12px; padding: 12px 16px; overflow-x: auto; }
    .hulp h3 { font-size: .98rem; color: var(--blauw); margin-bottom: 6px; }
    .hulp ol { margin: 0; padding-left: 22px; }
    .hulp li { margin: 6px 0; }
    .uitwerking { margin-top: 14px; background: #fff; border: 1px solid var(--paars-rand); border-radius: 12px; padding: 12px 16px; overflow-x: auto; }
    .uitwerking h3 { font-size: .98rem; color: var(--paars); margin-bottom: 6px; }
    .stappen { margin: 0; padding-left: 0; list-style: none; }
    .stappen li { margin: 6px 0; line-height: 1.55; }
    .stappen li.sub { padding-left: 18px; }
    .stappen li.kader { border-top: 1px solid var(--paars-rand); padding-top: 8px; margin-top: 10px; font-weight: 700; color: var(--blauw); }
    .stappen .katex-display { margin: .25em 0; text-align: left; }
    .stappen .katex-display > .katex { text-align: left; }
    .actie-rij { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .actie-rij .knop { flex: 1 1 140px; }
    .werkbalk { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .werkbalk button { border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 7px; padding: 3px 9px; font-size: .9rem; font-family: ui-monospace, Consolas, monospace; color: #334155; }
    .werkbalk button:hover { background: var(--blauw-licht); }
    details.typhulp { margin-top: 14px; border: 1px solid var(--rand); border-radius: 12px; background: #fff; }
    details.typhulp summary { cursor: pointer; padding: 9px 14px; font-weight: 700; color: #334155; font-size: .92rem; }
    details.typhulp .inhoud { padding: 0 14px 12px; font-size: .88rem; }
    .typtabel { width: 100%; border-collapse: collapse; }
    .typtabel td { padding: 4px 6px; border-top: 1px solid #f1f5f9; vertical-align: middle; }
    .typtabel code { background: #f1f5f9; padding: 2px 6px; border-radius: 6px; font-size: .86rem; }
    .sessie { display: flex; gap: 6px; flex-wrap: wrap; font-size: .85rem; color: var(--zacht); margin-top: 12px; align-items: center; }
    .bolletje { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .bolletje.g { background: #10b981; } .bolletje.h { background: #f59e0b; } .bolletje.f { background: #f43f5e; }
    .toets-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .toets-nav button { width: 36px; height: 36px; border-radius: 9px; border: 2px solid var(--rand); background: #fff; font-weight: 700; color: #334155; }
    .toets-nav button.ingevuld { background: #e0e7ff; border-color: #a5b4fc; }
    .toets-nav button.huidig { border-color: var(--rood); }

    /* ---------- theorie ---------- */
    .theorie-blok { margin-top: 14px; border: 1px solid var(--rand); border-radius: 14px; padding: 14px 16px; background: #fff; overflow-x: auto; }
    .theorie-blok h3 { font-size: 1.04rem; color: var(--paars); margin-bottom: 8px; }
    .theorie-blok ul, .theorie-blok ol { margin: 4px 0 8px; padding-left: 22px; }
    .theorie-blok li { margin: 4px 0; }
    .formule-kader { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px; padding: 8px 12px; margin: 8px 0; overflow-x: auto; }
    .voorbeeld-knoppen { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .voorbeeld-vak { margin-top: 12px; border: 2px dashed var(--paars-rand); border-radius: 12px; padding: 12px 14px; background: #fafaff; }
    .th-tabel { border-collapse: collapse; margin: 6px 0; font-size: .95rem; }
    .th-tabel td, .th-tabel th { border: 1px solid var(--rand); padding: 5px 10px; text-align: left; }
    .th-tabel th { background: #f8fafc; }

    /* ---------- feedback van de leerkracht (handgeschreven stijl) ---------- */
    .leerkracht { margin-top: 12px; padding: 10px 16px 8px; border-radius: 12px; background: #fffdf4; border: 1px solid #f2e6c4; border-left: 6px solid #dc2626;
        font-family: 'Patrick Hand', 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive; color: #b91c1c; font-size: 1.15rem; line-height: 1.4; overflow-x: auto; }
    .leerkracht.goed { border-left-color: #059669; color: #047857; }
    .leerkracht p { margin: 5px 0; }
    .lk-kop { font-size: 1.3rem; font-weight: 700; }
    .lk-fout { margin: 2px 0 4px; }
    .lk-fout b { text-decoration: underline wavy #ef4444; text-underline-offset: 5px; text-decoration-thickness: 1px; }
    .lk-rij { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0; }
    .lk-wie { min-width: 96px; }
    .lk-omcirkeld { display: inline-block; border: 2px solid #ef4444; border-radius: 46% 54% 50% 50% / 60% 48% 52% 40%; padding: 6px 16px 3px; transform: rotate(-1deg); color: #1e293b; max-width: 100%; overflow-x: auto; }
    .lk-juist { display: inline-block; color: #1e293b; padding: 0 10px 2px; border-bottom: 2px solid #10b981; max-width: 100%; overflow-x: auto; }
    .leerkracht .katex-display { margin: 0; }
    .leerkracht .katex { color: #1e293b; }
    .lk-tip { color: #1d4ed8; }
    .lk-lijst { margin: 4px 0 6px; padding-left: 24px; }
    .lk-lijst li { margin: 3px 0; }
    .lk-groot { font-size: 1.2rem; margin: 16px 0 6px; }

    /* ---------- rapport ---------- */
    .rapport { line-height: 1.45; color: var(--tekst); }
    .score { display: inline-block; margin-top: 14px; padding: 10px 26px; border-radius: 999px; background: #f1f5f9; font-size: 1.45rem; font-weight: 800; }
    .score.goed { color: #047857; } .score.matig { color: #b45309; } .score.zwak { color: #be123c; }
    .rapport-info { color: var(--zacht); margin-top: 6px; font-size: .95rem; }
    .vraag-kop { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
    .vraag-kop h3 { font-size: 1rem; }
    .stempel { font-size: .75rem; font-weight: 800; padding: 3px 10px; border-radius: 6px; white-space: nowrap; }
    .juist .stempel { background: #a7f3d0; color: #065f46; } .fout .stempel { background: #fecdd3; color: #9f1239; } .deels .stempel { background: #fde68a; color: #92400e; }
    .antw-deel { background: rgba(255,255,255,.8); border-radius: 10px; padding: 8px 12px; margin-top: 8px; }
    .antw-deel .tit { font-size: .74rem; font-weight: 800; color: var(--zacht); text-transform: uppercase; letter-spacing: .04em; }
    .antw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .antw-grid > div { min-width: 0; overflow-x: auto; overflow-y: hidden; }
    .antw-deel .katex-display { margin: 2px 0; text-align: left; }
    .antw-deel .katex-display > .katex { text-align: left; }
    .antw-deel .fb { font-size: .88rem; margin-top: 4px; }
    .antw-deel .leerkracht { font-size: 1.05rem; margin-top: 8px; }
    .samenvatting-tabel { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: .92rem; }
    .samenvatting-tabel th, .samenvatting-tabel td { padding: 6px 8px; border-bottom: 1px solid var(--rand); text-align: left; }
    .samenvatting-tabel th { background: #f8fafc; }
    .vk { border-left: 8px solid #cbd5e1; background: #f8fafc; padding: 6px 16px; overflow-x: auto; overflow-y: hidden; }
    .vk.eerste { margin-top: 14px; border-top-right-radius: 12px; padding-top: 12px; }
    .vk.laatste { border-bottom-right-radius: 12px; padding-bottom: 12px; }
    .vk.juist { background: var(--groen-licht); border-color: #10b981; }
    .vk.fout { background: var(--rood-licht); border-color: #f43f5e; }
    .vk.deels { background: var(--oranje-licht); border-color: #f59e0b; }
    .vk .opgave-tekst { font-size: .98rem; }
    .vk .opgave-tekst .katex-display { margin: .3em 0; }
    .vk .tit { font-size: .74rem; font-weight: 800; color: var(--zacht); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
    .vk .stappen li { margin: 3px 0; }
    .verberg-uitw .vk-uitw { display: none; }

<!-- =====================================================================
     1. KERN: breuken, toevalsgetallen, LaTeX-hulpjes
     ===================================================================== -->
<script>
'use strict';
const L = String.raw;          // LaTeX zonder dubbele backslashes

function ggd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
class Fr {
    constructor(n, d = 1) {
        if (!Number.isInteger(n) || !Number.isInteger(d) || d === 0) throw new Error('Fr: ' + n + '/' + d);
        if (d < 0) { n = -n; d = -d; }
        const g = ggd(n, d) || 1;
        this.n = n / g; this.d = d / g;
    }
    static of(x) { if (x instanceof Fr) return x; if (Number.isInteger(x)) return new Fr(x, 1); throw new Error('Fr.of: ' + x); }
    get v() { return this.n / this.d; }
    get nul() { return this.n === 0; }
    plus(b) { b = Fr.of(b); return new Fr(this.n * b.d + b.n * this.d, this.d * b.d); }
    min(b) { return this.plus(Fr.of(b).neg()); }
    maal(b) { b = Fr.of(b); return new Fr(this.n * b.n, this.d * b.d); }
    deel(b) { b = Fr.of(b); return new Fr(this.n * b.d, this.d * b.n); }
    neg() { return new Fr(-this.n, this.d); }
    abs() { return new Fr(Math.abs(this.n), this.d); }
    gelijk(b) { b = Fr.of(b); return this.n === b.n && this.d === b.d; }
    txt() { return this.d === 1 ? String(this.n) : `${this.n}/${this.d}`; }
    tex() { return this.d === 1 ? String(this.n) : (this.n < 0 ? '-' : '') + `\\frac{${Math.abs(this.n)}}{${this.d}}`; }
}
const F = (n, d = 1) => new Fr(n, d);

// ---------- uitdrukkingen in invoer-notatie opbouwen ----------
const S = {
    // coëfficiënt vóór een uitdrukking: 1 → "", -1 → "-", 3/4 → "(3/4)"
    cf(a, rest) {
        a = Fr.of(a);
        if (!rest) return a.txt();
        if (a.nul) return '0';
        if (a.gelijk(1)) return rest;
        if (a.gelijk(-1)) return '-' + rest;
        const k = a.d === 1 ? String(Math.abs(a.n)) : `(${Math.abs(a.n)}/${a.d})`;
        return (a.n < 0 ? '-' : '') + k + (/^[0-9.]/.test(rest) ? '*' : '') + rest;
    },
    // termen samenvoegen met de juiste tekens: ['2x^2', '-5x', '1'] → '2x^2 - 5x + 1'
    som(termen) {
        const t = termen.filter(s => s !== '' && s !== '0' && s != null);
        if (!t.length) return '0';
        return t.map((s, i) => i === 0 ? s : (s[0] === '-' ? ' - ' + s.slice(1) : ' + ' + s)).join('');
    },
    poly(c, v = 'x') {
        const n = c.length - 1;
        return S.som(c.map((a, i) => {
            a = Fr.of(a); if (a.nul) return '';
            const k = n - i;
            return k === 0 ? a.txt() : S.cf(a, k === 1 ? v : `${v}^${k}`);
        }));
    },
    lin: (a, b, v = 'x') => S.poly([a, b], v),
    xm: (c, v = 'x') => S.poly([1, Fr.of(c).neg()], v),          // x - c
    plus(s, c) { c = Fr.of(c); if (c.nul) return s; return c.n > 0 ? `${s} + ${c.txt()}` : `${s} - ${c.abs().txt()}`; },
    par: s => /^[A-Za-z0-9.]+$/.test(s) ? s : `(${s})`,
    // e^k met k een breuk, als invoer-tekst: 1, e, 1/e, e^2, 1/e^2, e^(3/2)
    E(k) {
        k = Fr.of(k);
        if (k.nul) return '1';
        if (k.gelijk(1)) return 'e';
        if (k.gelijk(-1)) return '1/e';
        if (k.d === 1) return k.n > 0 ? `e^${k.n}` : `1/e^${-k.n}`;
        return k.n > 0 ? `e^(${k.txt()})` : `1/e^(${k.abs().txt()})`;
    },
};

// ---------- toevalsgetallen (met zaad, zodat oefeningen reproduceerbaar zijn) ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
class Rnd {
    constructor(seed) { this.seed = seed >>> 0; this.f = mulberry32(this.seed); }
    r() { return this.f(); }
    int(a, b) { return a + Math.floor(this.f() * (b - a + 1)); }
    nz(a, b) { let v; do { v = this.int(a, b); } while (v === 0); return v; }
    pick(arr) { return arr[Math.floor(this.f() * arr.length)]; }
    bool(p = 0.5) { return this.f() < p; }
    teken() { return this.f() < 0.5 ? 1 : -1; }
    shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(this.f() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    // k verschillende elementen
    kies(arr, k) { return this.shuffle(arr).slice(0, k); }
}
function zeker(voorwaarde, msg) { if (!voorwaarde) throw new Error('Controle mislukt: ' + msg); }

// ---------- LaTeX ----------
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
let KATEX_STRIKT = false;     // tijdens de zelftest: fouten in LaTeX melden
function kt(tex, disp = false) {
    if (window.katex) {
        try { return katex.renderToString(tex, { displayMode: disp, throwOnError: KATEX_STRIKT, strict: 'ignore' }); }
        catch (e) { if (KATEX_STRIKT) throw e; }
    }
    return `<code>${esc(tex)}</code>`;
}
// HTML met $...$ (inline) en $$...$$ (display); [[...]] = uitdrukking in invoer-notatie
// ds = true: ook formules in de tekst op ware grootte (\displaystyle), voor uitwerkingen en hints
function wis(s, ds = false) {
    if (s == null) return '';
    s = String(s).replace(/\[\[([\s\S]+?)\]\]/g, (_, e) => Ex.texVan(e));
    let out = '', i = 0;
    while (i < s.length) {
        const j = s.indexOf('$', i);
        if (j < 0) { out += s.slice(i); break; }
        out += s.slice(i, j);
        const disp = s[j + 1] === '$';
        const w = disp ? 2 : 1;
        const k = s.indexOf(disp ? '$$' : '$', j + w);
        if (k < 0) { out += s.slice(j); break; }
        out += kt((ds && !disp ? L`\displaystyle ` : '') + s.slice(j + w, k), disp);
        i = k + w;
    }
    return out;
}
</script>

<!-- =====================================================================
     2. FORMULE-LEZER: wat de leerling typt omzetten naar een rekenboom
     (dezelfde boom voor de live weergave, het nakijken en de uitwerkingen)
     ===================================================================== -->
<script>
const Ex = (() => {
    const FN = {
        sin: { tex: L`\sin`, f: Math.sin }, cos: { tex: L`\cos`, f: Math.cos }, tan: { tex: L`\tan`, f: Math.tan }, cot: { tex: L`\cot`, f: x => 1 / Math.tan(x) },
        bgsin: { tex: L`\operatorname{Bgsin}`, f: Math.asin }, bgcos: { tex: L`\operatorname{Bgcos}`, f: Math.acos },
        bgtan: { tex: L`\operatorname{Bgtan}`, f: Math.atan }, bgcot: { tex: L`\operatorname{Bgcot}`, f: x => Math.PI / 2 - Math.atan(x) },
        sinh: { tex: L`\sinh`, f: Math.sinh }, cosh: { tex: L`\cosh`, f: Math.cosh }, tanh: { tex: L`\tanh`, f: Math.tanh },
        ln: { tex: L`\ln`, f: Math.log }, log: { tex: L`\log`, f: Math.log10 }, exp: { tex: L`\exp`, f: Math.exp },
        sqrt: { tex: null, f: Math.sqrt }, abs: { tex: null, f: Math.abs },
    };
    const SYN = { arcsin: 'bgsin', asin: 'bgsin', arccos: 'bgcos', acos: 'bgcos', arctan: 'bgtan', atan: 'bgtan', bgtg: 'bgtan', arccot: 'bgcot', acot: 'bgcot', bgcotg: 'bgcot', tg: 'tan', cotg: 'cot', wortel: 'sqrt' };
    const NAMEN = [...Object.keys(FN), ...Object.keys(SYN)].sort((a, b) => b.length - a.length);
    const NAAM_TXT = { bgsin: 'Bgsin', bgcos: 'Bgcos', bgtan: 'Bgtan', bgcot: 'Bgcot' };
    const naamTxt = n => NAAM_TXT[n] || n;

    class LeesFout extends Error { constructor(m, onvolledig) { super(m); this.leesfout = true; this.onvolledig = !!onvolledig; } }

    function voorbereid(invoer) {
        return String(invoer == null ? '' : invoer)
            .replace(/[−–—‒]/g, '-').replace(/[·×∙⋅•]/g, '*').replace(/÷/g, '/').replace(/π/g, 'pi').replace(/√/g, 'sqrt').replace(/∞/g, 'inf')
            .replace(/²/g, '^2').replace(/³/g, '^3').replace(/⁴/g, '^4').replace(/\*\*/g, '^').replace(/,/g, '.')
            .replace(/[\[{]/g, '(').replace(/[\]}]/g, ')');
    }
    function tokens(s, opt) {
        const t = [];
        let i = 0, bars = 0;
        while (i < s.length) {
            const c = s[i];
            if (/\s/.test(c)) { i++; continue; }
            if (/[0-9.]/.test(c)) {
                const m = s.slice(i).match(/^(\d+\.?\d*|\.\d+)/);
                if (!m) throw new LeesFout('Er staat een los punt of een losse komma.');
                i += m[1].length;
                if (s[i] === '.') throw new LeesFout('Een getal heeft twee kommatekens.');
                t.push({ k: 'num', v: parseFloat(m[1]) });
                continue;
            }
            if ('+-*/^'.includes(c)) { t.push({ k: 'op', v: c }); i++; continue; }
            if (c === '(' || c === ')') { t.push({ k: c }); i++; continue; }
            if (c === '|') {
                const v = t[t.length - 1];
                const open = bars === 0 || !v || v.k === 'op' || v.k === '(' || v.k === 'fn';
                if (open) { t.push({ k: 'fn', v: 'abs' }); t.push({ k: '(' }); bars++; } else { t.push({ k: ')' }); bars--; }
                i++; continue;
            }
            if (/[a-zα-ω]/i.test(c)) {
                const rest = s.slice(i).toLowerCase();
                const infM = rest.match(/^(oneindig|infinity|inf|oo)/);
                if (infM) {
                    if (!opt.inf) throw new LeesFout('Hier hoort geen ∞.');
                    t.push({ k: 'const', v: 'inf' }); i += infM[1].length; continue;
                }
                const naam = NAMEN.find(n => rest.startsWith(n));
                if (naam) {
                    i += naam.length;
                    const echt = SYN[naam] || naam;
                    const tok = { k: 'fn', v: echt };
                    if (echt === 'log') {
                        let m;
                        if (s[i] === '_' && (m = s.slice(i + 1).match(/^\d+(\.\d+)?/))) { tok.grond = parseFloat(m[0]); i += 1 + m[0].length; }
                        else if ((m = s.slice(i).match(/^(\d+)\(/))) { tok.grond = parseFloat(m[1]); i += m[1].length; }
                        else if (s[i] === '_') throw new LeesFout('Schrijf het grondtal direct na log_, bijvoorbeeld log_2(x).');
                        if (tok.grond !== undefined && (tok.grond <= 0 || tok.grond === 1)) throw new LeesFout('Het grondtal van een logaritme moet positief zijn en verschillend van 1.');
                    }
                    t.push(tok);
                    continue;
                }
                if (rest.startsWith('pi')) { t.push({ k: 'const', v: 'pi' }); i += 2; continue; }
                const l = rest[0];
                if (l === 'e') { t.push({ k: 'const', v: 'e' }); i++; continue; }
                if (opt.vrij || (opt.vars || []).includes(l)) { t.push({ k: 'var', v: l }); i++; continue; }
                const woord = rest.match(/^[a-zα-ω]+/)[0];
                if (woord.length > 1) throw new LeesFout(`Ik ken «${woord}» niet. Kijk bij "Hoe typ ik mijn antwoord?" welke functies je kan gebruiken.`);
                const v = opt.vars || [];
                throw new LeesFout(v.length ? `De letter «${l}» hoort hier niet. Gebruik enkel ${v.join(' en ')}.` : `Hier hoort een getal, zonder letter «${l}».`);
            }
            if ("'’′".includes(c)) throw new LeesFout('Typ enkel het antwoord, zonder accent.');
            if (c === '=') throw new LeesFout('Er staat een =-teken te veel.');
            if (c === ';' || c === '_') throw new LeesFout(`Het teken «${c}» staat op een verkeerde plaats.`);
            throw new LeesFout(`Het teken «${c}» kan ik niet lezen.`);
        }
        return t;
    }
    function ontleed(invoer, opt = {}) {
        const s = voorbereid(invoer);
        if (!s.trim()) throw new LeesFout('Er is nog niets ingevuld.', true);
        if (s.length > 400) throw new LeesFout('Je antwoord is te lang.');
        const t = tokens(s, opt);
        let i = 0;
        const kijk = () => t[i];
        const isOp = (tk, ...ops) => !!tk && tk.k === 'op' && ops.includes(tk.v);
        const startFactor = tk => !!tk && ['num', 'var', 'const', 'fn', '('].includes(tk.k);
        function som() {
            let a = metTeken();
            while (isOp(kijk(), '+', '-')) { const o = t[i++].v; const b = metTeken(); a = { t: o === '+' ? 'add' : 'sub', a, b }; }
            return a;
        }
        function metTeken() {
            if (isOp(kijk(), '-')) { i++; return { t: 'neg', a: metTeken() }; }
            if (isOp(kijk(), '+')) { i++; return metTeken(); }
            return product();
        }
        function product() {
            let a = macht();
            for (;;) {
                const tk = kijk();
                if (isOp(tk, '*', '/')) {
                    i++;
                    let negatief = false;
                    while (isOp(kijk(), '-', '+')) { if (t[i].v === '-') negatief = !negatief; i++; }
                    let b = macht();
                    if (negatief) b = { t: 'neg', a: b };
                    a = { t: tk.v === '*' ? 'mul' : 'div', a, b };
                } else if (startFactor(tk)) { a = { t: 'mul', a, b: macht(), imp: true }; }
                else break;
            }
            return a;
        }
        function macht() {
            const grond = basis();
            if (isOp(kijk(), '^')) { i++; return { t: 'pow', a: grond, b: exponent() }; }
            return grond;
        }
        function exponent() {
            if (isOp(kijk(), '-')) { i++; return { t: 'neg', a: exponent() }; }
            if (isOp(kijk(), '+')) { i++; return exponent(); }
            return macht();
        }
        function korteExponent(naam) {
            if (isOp(kijk(), '-')) { i++; return { t: 'neg', a: korteExponent(naam) }; }
            const tk = kijk();
            if (tk && (tk.k === 'num' || tk.k === '(')) return basis();
            throw new LeesFout(`Na ${naamTxt(naam)}^ verwacht ik een getal, bijvoorbeeld ${naamTxt(naam)}^2(x).`, !tk);
        }
        function basis() {
            const tk = t[i++];
            if (!tk) throw new LeesFout('Je antwoord stopt te vroeg: er ontbreekt nog iets op het einde.', true);
            if (tk.k === 'num') return { t: 'num', v: tk.v };
            if (tk.k === 'var') return { t: 'var', n: tk.v };
            if (tk.k === 'const') return { t: 'const', v: tk.v };
            if (tk.k === '(') {
                if (kijk() && kijk().k === ')') throw new LeesFout('Er staan lege haakjes ().');
                const e = som();
                const sl = t[i++];
                if (!sl) throw new LeesFout('Er ontbreekt nog een sluitend haakje ).', true);
                if (sl.k !== ')') throw new LeesFout('Er klopt iets niet met de haakjes.');
                return e;
            }
            if (tk.k === 'fn') {
                const naam = tk.v;
                let exp = null;
                if (isOp(kijk(), '^') && naam !== 'sqrt' && naam !== 'abs') { i++; exp = korteExponent(naam); }
                if (!kijk()) throw new LeesFout(`Na ${naamTxt(naam)} moet nog iets komen, bijvoorbeeld ${naamTxt(naam)}(x).`, true);
                let arg;
                if (kijk().k === '(') arg = basis();
                else {
                    // zonder haakjes: "sin 2x" = sin(2x), "ln x" = ln(x); een volgende functie of haakje hoort er niet meer bij
                    arg = macht();
                    while (kijk() && ['num', 'var', 'const'].includes(kijk().k)) arg = { t: 'mul', a: arg, b: macht(), imp: true };
                }
                let knoop = { t: 'fn', v: naam, a: arg };
                if (tk.grond !== undefined) knoop.grond = tk.grond;
                if (exp) knoop = { t: 'pow', a: knoop, b: exp };
                return knoop;
            }
            if (tk.k === ')') throw new LeesFout('Er staat een haakje ) te veel of op een verkeerde plaats.');
            if (tk.k === 'op') throw new LeesFout(`Het teken ${tk.v} staat op een plaats waar ik een getal, een letter of een functie verwacht.`);
            throw new LeesFout('Dit kan ik niet lezen.');
        }
        const boom = som();
        if (i < t.length) {
            if (t[i].k === ')') throw new LeesFout('Er staat een haakje ) te veel.');
            throw new LeesFout('Ik begrijp je antwoord niet helemaal. Controleer de tekens.');
        }
        return boom;
    }

    // ---------- waarde berekenen ----------
    function machtWaarde(a, b) {
        if (a < 0 && !Number.isInteger(b)) {
            for (const q of [3, 5, 7, 9]) {
                const p = b * q;
                if (Math.abs(p - Math.round(p)) < 1e-9) return Math.pow(-Math.pow(-a, 1 / q), Math.round(p));
            }
            return NaN;
        }
        return Math.pow(a, b);
    }

    logregel:    { label: 'Rekenregels voor logaritmen en machten', tip: '$e^{\\ln a} = a$, $\\ln e^a = a$, $n \\ln a = \\ln a^n$, $\\ln a - \\ln b = \\ln\\frac{a}{b}$.' },

    onbepaald:   { label: 'Onbepaaldheid niet herkend', tip: '$\\frac00$, $\\frac{\\infty}{\\infty}$, $\\infty - \\infty$, $0 \\cdot \\infty$, $1^\\infty$, $0^0$ en $\\infty^0$ zijn onbepaaldheden: je kan het resultaat niet zomaar invullen.' },
    geenOnbep:   { label: "l'Hôpital gebruikt zonder onbepaaldheid", tip: "Vul eerst in. De regel van de l'Hôpital mag je enkel gebruiken bij $\\frac00$ of $\\frac{\\infty}{\\infty}$." },
    hopital:     { label: "Regel van de l'Hôpital verkeerd toegepast", tip: "Leid teller en noemer elk apart af: $\\lim \\frac{f}{g} = \\lim \\frac{f'}{g'}$. Gebruik niet de quotiëntregel." },
    eMacht:      { label: 'Bij $1^\\infty$, $0^0$ of $\\infty^0$ de $e$-macht vergeten', tip: 'Schrijf $f^g = e^{g \\ln f}$. Bereken de limiet $L$ van de exponent $g \\ln f$; de gevraagde limiet is dan $e^L$, niet $L$.' },
    groei:       { label: 'Groeisnelheden van functies', tip: 'Voor $x \\to +\\infty$ groeit $e^x$ sneller dan elke macht $x^n$, en $x^n$ sneller dan $\\ln x$.' },
    oneindig:    { label: 'Eindige limiet of oneindig?', tip: 'Kijk na de laatste stap goed of de teller of de noemer naar 0 gaat, en bepaal bij $\\frac{c}{0}$ het teken met een tekentabel.' },
    omgekeerd:   { label: 'Teller en noemer verwisseld', tip: 'Controleer welke uitdrukking in de teller en welke in de noemer hoort.' },
    domein:      { label: 'Domein', tip: 'Noemer $\\neq 0$, argument van $\\ln$ en $\\log$ $> 0$, uitdrukking onder een vierkantswortel $\\geq 0$, argument van $\\mathrm{Bgsin}$ en $\\mathrm{Bgcos}$ tussen $-1$ en $1$.' },
    grenzen:     { label: 'Open of gesloten grens', tip: 'Een grens die niet tot het domein behoort (bv. een nulwaarde van de noemer) krijgt een open haak $]$ of $[$. Bij $\\pm\\infty$ staat altijd een open haak.' },
    asymptoot:   { label: 'Asymptoot', tip: 'V.A. $x = a$: $\\lim_{x \\to a} f(x) = \\pm\\infty$. H.A. $y = b$: $\\lim_{x \\to \\pm\\infty} f(x) = b$. S.A. $y = ax + b$: $a = \\lim \\frac{f(x)}{x}$, $b = \\lim (f(x) - ax)$.' },
    extremum:    { label: 'Extremum', tip: 'Zoek de nulwaarden van $f\'$, maak een tekentabel van $f\'$ en bereken de functiewaarde in de $x$-waarden waar $f\'$ van teken wisselt.' },
    buigpunt:    { label: 'Buigpunt', tip: 'Een buigpunt ligt waar $f\'\'$ van teken wisselt (niet alleen waar $f\'\' = 0$). Bereken ook de functiewaarde.' },
    functiewaarde:{ label: 'Functiewaarde (y-coördinaat) fout berekend', tip: 'De $y$-coördinaat van een punt van de grafiek vind je door de $x$-waarde in te vullen in $f(x)$ (niet in $f\'(x)$).' },
    coordinaat:  { label: 'Coördinaten verwisseld', tip: 'Een punt noteer je als $(x, y)$: eerst de $x$-coördinaat, dan de $y$-coördinaat.' },
    rico:        { label: 'Richtingscoëfficiënt van de raaklijn', tip: 'De rico van de raaklijn in $x = a$ is $f\'(a)$. Gebruik $t \\leftrightarrow y - f(a) = f\'(a)(x - a)$.' },
    raakpunt:    { label: 'Raaklijn gaat niet door het raakpunt', tip: 'De raaklijn gaat door het punt $(a, f(a))$: $y - f(a) = f\'(a)(x - a)$.' },
    ontbreekt:   { label: 'Niet alle oplossingen gevonden', tip: 'Zoek alle oplossingen in het onderzoeksinterval en controleer of je geen geval vergeten bent (bv. beide factoren van een product nul stellen).' },
    teveel:      { label: 'Er staan oplossingen bij die niet kloppen', tip: 'Controleer elke oplossing: ligt ze in het domein of het onderzoeksinterval, en verandert er echt iets van teken?' },
    periode:     { label: 'Periode', tip: 'Periode van $\\sin(bx)$ en $\\cos(bx)$: $\\frac{2\\pi}{|b|}$; van $\\tan(bx)$ en $\\cot(bx)$: $\\frac{\\pi}{|b|}$. Bij een som neem je het kgv van de perioden.' },
    goniolim:    { label: 'Standaardlimiet $\\lim\\limits_{t \\to 0} \\frac{\\sin t}{t} = 1$', tip: 'Zorg dat onder $\\sin(mx)$ precies $mx$ staat: vermenigvuldig en deel door dezelfde factor.' },
    goniowaarde: { label: 'Goniometrische waarde of vergelijking', tip: 'Gebruik de goniometrische cirkel: $\\sin x = \\sin\\alpha \\Leftrightarrow x = \\alpha + k2\\pi \\vee x = \\pi - \\alpha + k2\\pi$.' },
    cyclobereik: { label: 'Bereik van een cyclometrische functie', tip: '$\\mathrm{Bgsin}$ en $\\mathrm{Bgtan}$ liggen tussen $-\\frac{\\pi}{2}$ en $\\frac{\\pi}{2}$; $\\mathrm{Bgcos}$ en $\\mathrm{Bgcot}$ liggen tussen $0$ en $\\pi$.' },
    cycloafg:    { label: 'Afgeleide van een cyclometrische functie', tip: '$D\\,\\mathrm{Bgsin}\\,u = \\frac{u\'}{\\sqrt{1-u^2}}$, $D\\,\\mathrm{Bgcos}\\,u = \\frac{-u\'}{\\sqrt{1-u^2}}$, $D\\,\\mathrm{Bgtan}\\,u = \\frac{u\'}{1+u^2}$, $D\\,\\mathrm{Bgcot}\\,u = \\frac{-u\'}{1+u^2}$.' },
    impliciet:   { label: 'Impliciet afleiden: de factor $\\frac{dy}{dx}$ vergeten', tip: 'Leid links en rechts af naar $x$. Elke term met $y$ krijgt de factor $\\frac{dy}{dx}$ (kettingregel), bv. $D(y^2) = 2y\\frac{dy}{dx}$ en $D(xy) = y + x\\frac{dy}{dx}$.' },
    param:       { label: 'Afgeleide van een parameterkromme', tip: '$\\frac{dy}{dx} = \\frac{dy/dt}{dx/dt}$: de afgeleide van $y$ staat in de teller. Horizontale raaklijn: $\\frac{dy}{dt} = 0$; verticale: $\\frac{dx}{dt} = 0$.' },
    dv:          { label: 'Groei of verval ($f\' = k \\cdot f$)', tip: '$f\'(t) = k \\cdot f(t) \\Rightarrow f(t) = b \\cdot e^{kt}$ met $b = f(0)$. Halverings- of verdubbelingstijd: los $e^{kt} = \\frac12$ of $e^{kt} = 2$ op met $\\ln$.' },
    exact:       { label: 'Exacte waarde gevraagd', tip: 'Geef een exacte waarde, bijvoorbeeld $\\ln 1000$, $e^{-2}$ of $\\frac{\\pi}{3}$, en geen afgerond kommagetal.' },
    afronding:   { label: 'Te ruw afgerond', tip: 'Rond pas op het einde af en gebruik tussendoor de exacte waarden (of de exacte waarden in GeoGebra).' },
    rekenfout:   { label: 'Reken- of vereenvoudigingsfout', tip: 'Werk stap voor stap en controleer elke stap. Vergelijk je berekening met de uitwerking.' },
    inzicht:     { label: 'Inzicht', tip: 'Lees de uitleg bij de juiste keuze en bekijk de theorie van dit hoofdstuk nog eens.' },
    onbekend:    { label: 'Fout antwoord', tip: 'Vergelijk je berekening stap voor stap met de uitwerking en zoek waar het verschil begint.' },

const foutSoort = c => FOUT[c] || FOUT.onbekend;

// ===================== TYPES VAN DEELVRAGEN =====================
const TYPES = {};

// ---------- uitdrukking (afgeleide, voorschrift, dy/dx, ...) ----------
TYPES.uitdr = {
    velden: d => [{ soort: 'tekst', key: 'u', label: d.label || '', ph: d.ph || (d.vars.includes('y') ? 'bv. -x/y' : `bv. 2${d.vars[0]}*e^(${d.vars[0]}^2)`), vars: d.vars }],
    controleer(d, w) {
        const s = naGelijk(w.u);
        if (!s.trim()) throw new LeesFout('Vul je antwoord in.');
        const n = Ex.ontleed(s, { vars: d.vars });
        const envs = envsVan(d);
        const nj = Ex.ontleed(d.juist, { vars: d.vars });
        const c = vergelijk(n, nj, envs);
        if (c.gelijk) return OK();
        for (const f of d.fouten || []) {
            try { if (vergelijk(n, Ex.ontleed(f.w, { vars: d.vars }), envs).gelijk) return NOK(f.msg, { soort: f.soort || 'onbekend' }); } catch (e) { /* foute fout */ }
        }
        if (d.f) { try { if (vergelijk(n, Ex.ontleed(d.f, { vars: d.vars }), envs).gelijk) return NOK('Je schreef de functie zelf over. Gevraagd wordt de afgeleide.', { soort: 'onbekend' }); } catch (e) { /* */ } }
        if (c.geldig >= 4 && c.ongeldig === 0) {
            const r = constanteFactor(c.ratios);
            if (r !== null) {
                if (Math.abs(r + 1) < 1e-6) return NOK('Je antwoord is het tegengestelde van het juiste antwoord: ergens staat een minteken verkeerd.', { soort: 'teken' });
                for (const a of [2, 3, 5, 7, 10]) { const l = Math.log(a); if (Math.abs(r - l) < 1e-6 * l || Math.abs(r - 1 / l) < 1e-6 / l || Math.abs(r + l) < 1e-6 * l || Math.abs(r + 1 / l) < 1e-6 / l) return NOK(`Je antwoord verschilt een factor $\\ln ${a}$ van het juiste antwoord.`, { soort: 'lna' }); }
                return NOK(`Je antwoord is ${fmtFactor(r)} keer het juiste antwoord: er ontbreekt een constante factor (of er staat er één te veel).`, { soort: d.factorSoort || 'factor' });
            }
        }
        if (c.geldig < 4) return NOK('Je antwoord kon niet goed vergeleken worden: het is niet gedefinieerd waar het juiste antwoord bestaat.', { soort: 'onbekend' });
        return NOK(d.tip || 'Dit is niet juist.', { soort: d.soort || 'onbekend' });
    },
    toon: (d, w) => (d.label ? d.label + ' ' : '') + Ex.tex(Ex.ontleed(naGelijk(w.u), { vars: d.vars })),
    invoer: d => ({ u: d.juist }),
};

// ---------- getal (exact; bij vraagstukken mag afgerond) ----------
TYPES.getal = {
    velden: d => [{ soort: 'tekst', key: 'g', label: d.label || '', ph: d.ph || (d.benadering ? 'bv. 3,05' : 'bv. 1/2 of ln(5) of e^(-2) of -inf'), getal: true }],
    controleer(d, w) {
        const g = leesGetal(w.g);
        const st = getalStatus(g, d.juist, d);
        if (st === 'exact') return OK();
        if (st === 'afgerond') return OK(`Juist${d.benadering ? '' : ' (afgerond)'}. ${d.benadering ? 'Nauwkeuriger' : 'Exact'}: $${d.juistKort}$`);
        if (st === 'benaderd') return NOK('Je afgeronde waarde klopt, maar hier wordt de exacte waarde gevraagd.', { soort: 'exact', score: d.punten / 2 });
        if (st === 'ruw') return NOK(`Bijna, maar te ruw afgerond. Rond af op ${d.minDec ?? 2} decimalen.`, { soort: 'afronding', score: d.punten / 2 });
        for (const f of d.fouten || []) if (getalStatus(g, f.v, { benadering: d.benadering, minDec: 1 }) && getalStatus(g, f.v, { benadering: d.benadering, minDec: 1 }) !== 'ruw') return NOK(f.msg, { soort: f.soort || 'onbekend' });
        if (!Number.isFinite(d.juist)) {
            if (!Number.isFinite(g.v)) return NOK('Het teken van $\\infty$ klopt niet.', { soort: 'teken' });
            return NOK('De limiet is niet eindig. Kijk na of de teller of de noemer naar 0 gaat.', { soort: 'oneindig' });
        }
        if (!Number.isFinite(g.v)) return NOK('De limiet is een reëel getal, niet $\\infty$.', { soort: 'oneindig' });
        if (Math.abs(d.juist) > 1e-12 && dicht(g.v, -d.juist, 1e-6)) return NOK('Je antwoord heeft het verkeerde teken.', { soort: 'teken' });
        if (Math.abs(d.juist) > 1e-12 && Math.abs(d.juist - 1) > 1e-9 && Math.abs(g.v) > 1e-12 && dicht(g.v, 1 / d.juist, 1e-6)) return NOK('Je antwoord is het omgekeerde van het juiste antwoord.', { soort: 'omgekeerd' });
        return NOK(d.tip || 'Dit is niet juist.', { soort: d.soort || 'onbekend' });
    },
    toon: (d, w) => (d.label ? d.label + ' ' : '') + leesGetal(w.g).tex,
    invoer: d => ({ g: d.juistTxt }),
};

// ---------- meerdere getallen (volgorde maakt niet uit) ----------
TYPES.getallen = {
    velden: d => [{ soort: 'tekst', key: 'g', label: d.label || '', ph: d.ph || 'bv. 2 ; 6', lijst: true }],
    controleer(d, w) {
        const g = leesLijst(w.g);
        const vrij = d.waarden.map(() => true);
        let juist = 0, extra = 0;
        g.forEach(x => { const k = d.waarden.findIndex((v, i) => vrij[i] && getalStatus(x, v, d)); if (k >= 0) { vrij[k] = false; juist++; } else extra++; });
        const n = d.waarden.length;
        if (juist === n && extra === 0) return OK(n > 1 ? 'Juist! Je vond alle oplossingen.' : 'Juist!');
        for (const f of d.fouten || []) if (f.v.length === g.length && f.v.every(v => g.some(x => getalStatus(x, v, d)))) return NOK(f.msg, { soort: f.soort || 'onbekend' });
        const score = Math.max(0, juist - extra) / n * d.punten;
        if (juist === n) return NOK(`Je vond alle oplossingen, maar er ${extra === 1 ? 'staat' : 'staan'} ook ${extra} foute bij.`, { soort: d.teveelSoort || 'teveel', score });
        if (juist > 0 && extra === 0) return NOK(`Je vond ${juist} van de ${n} oplossingen.`, { soort: 'ontbreekt', score });
        if (juist > 0) return NOK(`${juist} van je antwoorden ${juist === 1 ? 'is' : 'zijn'} juist, maar er ontbreken er en er staan foute bij.`, { soort: 'ontbreekt', score });
        return NOK(d.tip || 'Geen van je antwoorden is juist.', { soort: d.soort || 'onbekend' });
    },
    toon: (d, w) => (d.label ? d.label + ' ' : '') + leesLijst(w.g).map(x => x.tex).join(L`\;;\; `),
    invoer: d => ({ g: d.txts.join(' ; ') }),
};

// ---------- één punt (x ; y) ----------
TYPES.punt = {
    velden: d => [{ soort: 'pt', naam: d.naam || '' }],
    controleer(d, w) {
        const gx = leesGetal(w.px, false), gy = leesGetal(w.py, false);
        const sx = getalStatus(gx, d.juist[0], d), sy = getalStatus(gy, d.juist[1], d);
        const goed = s => s === 'exact' || s === 'afgerond';
        if (goed(sx) && goed(sy)) return OK();
        if ((sx === 'benaderd' || goed(sx)) && (sy === 'benaderd' || goed(sy))) return NOK('Je afgeronde waarden kloppen, maar hier wordt de exacte coördinaat gevraagd.', { soort: 'exact', score: d.punten / 2 });
        for (const f of d.fouten || []) if (getalStatus(gx, f.v[0], d) && getalStatus(gy, f.v[1], d)) return NOK(f.msg, { soort: f.soort || 'onbekend' });
        if (getalStatus(gx, d.juist[1], d) && getalStatus(gy, d.juist[0], d)) return NOK('Je verwisselde de $x$- en de $y$-coördinaat.', { soort: 'coordinaat', score: d.punten / 2 });
        if (goed(sx)) return NOK(d.tipY || 'De $x$-coördinaat klopt, de $y$-coördinaat niet. Vul de $x$-waarde in in het voorschrift van $f$.', { soort: 'functiewaarde', score: d.punten / 2 });
        return NOK(d.tip || 'De $x$-coördinaat klopt niet.', { soort: d.soort || 'onbekend' });
    },
    toon: (d, w) => puntTex(d.naam, leesGetal(w.px, false).tex, leesGetal(w.py, false).tex),
    invoer: d => ({ px: d.txt[0], py: d.txt[1] }),
};

// ---------- meerdere punten (volgorde maakt niet uit) ----------
TYPES.punten = {
    velden: d => [{ soort: 'tekst', key: 'p', label: d.label || '', ph: d.ph || 'bv. (pi/2 ; -6), (3pi/2 ; 2)', punten: true }],
    controleer(d, w) {
        const g = leesPunten(w.p);
        const past = (p, J) => getalStatus(p[0], J[0], d) && getalStatus(p[1], J[1], d);
        const vrij = d.lijst.map(() => true);
        let juist = 0, extra = 0, alleenX = 0;
        g.forEach(p => {
            const k = d.lijst.findIndex((J, i) => vrij[i] && past(p, J));
            if (k >= 0) { vrij[k] = false; juist++; }
            else { extra++; if (d.lijst.some(J => getalStatus(p[0], J[0], d))) alleenX++; }
        });
        const n = d.lijst.length;
        if (juist === n && extra === 0) return OK(n > 1 ? 'Juist! Je vond alle punten.' : 'Juist!');
        const score = Math.max(0, juist - extra) / n * d.punten;
        if (alleenX && alleenX === extra) return NOK(`${juist ? `${juist} van de ${n} punten ${juist === 1 ? 'is' : 'zijn'} juist. ` : ''}Bij ${alleenX === 1 ? 'een punt klopt' : alleenX + ' punten klopt'} de $x$-coördinaat, maar de $y$-coördinaat niet.`, { soort: 'functiewaarde', score });
        if (juist === n) return NOK(`Je vond alle punten, maar er ${extra === 1 ? 'staat' : 'staan'} ook ${extra} foute bij.`, { soort: 'teveel', score });
        if (juist > 0 && extra === 0) return NOK(`Je vond ${juist} van de ${n} punten.`, { soort: 'ontbreekt', score });
        if (juist > 0) return NOK(`${juist} van de ${n} punten ${juist === 1 ? 'is' : 'zijn'} juist, maar er staan ook foute punten bij.`, { soort: 'ontbreekt', score });
        return NOK(d.tip || 'Geen van de punten is juist.', { soort: d.soort || 'onbekend' });
    },
    toon: (d, w) => leesPunten(w.p).map(p => puntTex('', p[0].tex, p[1].tex)).join(L`,\quad `),
    invoer: d => ({ p: d.txts.map(([x, y]) => `(${x} ; ${y})`).join(', ') }),
};

// ---------- rechte ----------
TYPES.rechte = {
    velden: d => [{ soort: 'tekst', key: 'r', label: d.label || '', ph: d.ph || 'bv. y = 2x - 3', rechte: true }],
    controleer(d, w) {
        const s = leesRechte(w.r);
        if (zelfdeRechte(s, d.R)) return OK();
        for (const f of d.fouten || []) if (zelfdeRechte(s, f.R)) return NOK(f.msg, { soort: f.soort || 'onbekend' });
        if (d.raak) {
            if (evenwijdig(s, d.R)) return NOK('De richtingscoëfficiënt klopt, maar je rechte gaat niet door het raakpunt.', { soort: 'raakpunt', score: d.punten / 2 });
            const [x0, y0] = d.raak;
            if (Math.abs(s.A * x0 + s.B * y0 + s.C) <= 1e-7 * (1 + Math.abs(s.A * x0) + Math.abs(s.B * y0) + Math.abs(s.C))) return NOK('Je rechte gaat door het raakpunt, maar de richtingscoëfficiënt klopt niet.', { soort: 'rico', score: d.punten / 2 });
        }
        if (evenwijdig(s, d.R)) return NOK(d.tipEv || 'Je rechte is evenwijdig met de juiste rechte, maar valt er niet mee samen.', { soort: d.soort || 'onbekend' });
        return NOK(d.tip || 'Dit is niet de juiste rechte.', { soort: d.soort || 'onbekend' });
    },
    toon: (d, w) => leesRechte(w.r).tex,
    invoer: d => ({ r: d.juistTxt }),
};
TYPES.rechten = {
    velden: d => [{ soort: 'tekst', key: 'r', label: d.label || '', ph: d.ph || 'bv. y = 2x - 8 ; y = -2x + 8', rechten: true }],
    controleer(d, w) {
        const g = leesRechten(w.r);
        const vrij = d.lijst.map(() => true);
        let juist = 0, extra = 0;
        g.forEach(s => { const k = d.lijst.findIndex((R, i) => vrij[i] && zelfdeRechte(s, R)); if (k >= 0) { vrij[k] = false; juist++; } else extra++; });
        const n = d.lijst.length;
        if (juist === n && extra === 0) return OK();
        const score = Math.max(0, juist - extra) / n * d.punten;
        if (juist > 0) return NOK(`${juist} van de ${n} rechten ${juist === 1 ? 'is' : 'zijn'} juist${extra ? ', maar er staan ook foute bij' : ''}.`, { soort: extra ? 'teveel' : 'ontbreekt', score });
        return NOK(d.tip || 'Geen van de rechten is juist.', { soort: d.soort || 'onbekend' });
    },
    toon: (d, w) => leesRechten(w.r).map(s => s.tex).join(L`\quad\text{en}\quad `),
    invoer: d => ({ r: d.txts.join(' ; ') }),
};

// ---------- interval of unie van intervallen ----------
TYPES.interval = {
    velden: d => [{ soort: 'tekst', key: 'i', label: d.label || '', ph: d.ph || 'bv. ]-1 ; +inf[  of  [0 ; 1/2] U [2 ; 5/2]', interval: true }],
    controleer(d, w) {
        const s = leesVerzameling(w.i);
        const v = verzVergelijk(s, d.verz);
        if (v === 'gelijk') return OK();
        if (v === 'grenzen' && d.vrijeGrenzen) return OK('Juist! (In het extremum zelf mag je de grens open of gesloten nemen.)');
        if (v === 'grenzen') return NOK('De grenzen kloppen, maar kijk nog eens welke grenzen open en welke gesloten zijn.', { soort: 'grenzen', score: d.punten / 2 });
        for (const f of d.fouten || []) if (verzVergelijk(s, f.verz)) return NOK(f.msg, { soort: f.soort || 'domein' });
        return NOK(d.tip || 'Dit is niet juist.', { soort: d.soort || 'domein' });
    },
    toon: (d, w) => (d.label ? d.label + ' ' : '') + verzTex(leesVerzameling(w.i)),
    invoer: d => ({ i: d.juistTxt }),
};

// ---------- meerkeuze ----------
TYPES.keuze = {
    velden: d => [{ soort: 'keuze', key: 'k', opties: d.opties, janee: d.janee }],
    controleer(d, w) {
        if (w.k === undefined || w.k === '') throw new LeesFout('Kies een antwoord.');
        const k = +w.k;
        if (k === d.juist) return OK(d.opties[k].uitleg ? 'Juist! ' + d.opties[k].uitleg : 'Juist!');
        const o = d.opties[k];
        return NOK(o && o.uitleg ? o.uitleg : (d.tip || 'Dit is niet de juiste keuze.'), { soort: (o && o.soort) || d.soort || 'inzicht' });
    },
    toon: () => null,
    toonHtml: (d, w) => wis(d.opties[+w.k].t),
    invoer: d => ({ k: String(d.juist) }),
};

// ===================== BOUWERS VOOR DEELVRAGEN =====================
const D = {
    // uitdrukking in de veranderlijke(n) vars, nagekeken op dom (of op de punten envs)
    uitdr(vraag, label, juist, opt = {}) {
        const d = { type: 'uitdr', vraag, label, juist, vars: ['x'], dom: [-2, 2], punten: 1, ...opt };
        d.juistTex = opt.juistTex || ((label ? label + ' ' : '') + tx(juist));
        return d;
    },
    afg(vraag, f, juist, dom, opt = {}) { return D.uitdr(vraag, opt.label || "f'(x) =", juist, { f, dom, ...opt }); },
    getal(vraag, juist, opt = {}) {
        const g = leesGetal(String(juist), false);
        const d = { type: 'getal', vraag, juistTxt: String(juist), juist: g.v, juistKort: opt.kortTex || g.tex, punten: 1, ...opt };
        if (!d.gg && d.benadering) d.gg = 'rekenwerk';   // afgerond antwoord: niet uit het hoofd te berekenen
        if (d.benadering && Number.isFinite(g.v) && !opt.kortTex) d.juistKort = (/^-?\d+(\.\d+)?$/.test(String(juist).trim()) ? '' : g.tex + L` \approx `) + String(+g.v.toFixed(d.minDec ?? 2)).replace('.', '{,}');
        d.juistTex = (opt.label ? opt.label + ' ' : '') + (opt.juistTex || d.juistKort);
        d.fouten = (opt.fouten || []).map(f => ({ ...f, v: typeof f.w === 'number' ? f.w : leesGetal(String(f.w), false).v }));
        return d;
    },
    getallen(vraag, lijst, opt = {}) {
        const g = lijst.map(x => leesGetal(String(x), false));
        const d = { type: 'getallen', vraag, txts: lijst.map(String), waarden: g.map(x => x.v), punten: 1, ...opt };
        d.juistTex = (opt.label ? opt.label + ' ' : '') + g.map(x => x.tex).join(L`\;\text{ of }\; `);
        d.fouten = (opt.fouten || []).map(f => ({ ...f, v: f.w.map(x => leesGetal(String(x), false).v) }));
        return d;
    },
    punt(vraag, naam, [xs, ys], opt = {}) {
        const gx = leesGetal(String(xs), false), gy = leesGetal(String(ys), false);
        const d = { type: 'punt', vraag, naam, txt: [String(xs), String(ys)], juist: [gx.v, gy.v], punten: 1, ...opt };
        d.juistTex = puntTex(naam, gx.tex, gy.tex);
        d.fouten = (opt.fouten || []).map(f => ({ ...f, v: f.w.map(x => leesGetal(String(x), false).v) }));
        return d;
    },
    punten(vraag, lijst, opt = {}) {
        const g = lijst.map(([x, y]) => [leesGetal(String(x), false), leesGetal(String(y), false)]);
        const d = { type: 'punten', vraag, txts: lijst.map(([x, y]) => [String(x), String(y)]), lijst: g.map(([x, y]) => [x.v, y.v]), punten: 1, ...opt };
        d.juistTex = g.map(([x, y]) => puntTex('', x.tex, y.tex)).join(L`,\quad `);
        return d;
    },
    rechte(vraag, vgl, opt = {}) {
        const R = leesRechte(vgl);
        const d = { type: 'rechte', vraag, juistTxt: vgl, R, punten: 1, ...opt };
        d.juistTex = (opt.naamTex ? opt.naamTex + L` \leftrightarrow ` : '') + (opt.vglTex || R.tex);
        d.fouten = (opt.fouten || []).map(f => ({ ...f, R: leesRechte(f.w) }));
        return d;
    },
    rechten(vraag, lijst, opt = {}) {
        const R = lijst.map(leesRechte);
        return { type: 'rechten', vraag, txts: lijst, lijst: R, juistTex: R.map(x => x.tex).join(L`\quad\text{en}\quad `), punten: 1, ...opt };
    },
    interval(vraag, str, opt = {}) {
        const verz = leesVerzameling(str);
        const d = { type: 'interval', vraag, juistTxt: str, verz, punten: 1, ...opt };
        d.juistTex = (opt.label ? opt.label + ' ' : '') + verzTex(verz);
        d.fouten = (opt.fouten || []).map(f => ({ ...f, verz: leesVerzameling(f.w) }));
        return d;
    },
    keuze(vraag, opties, juist, opt = {}) { return { type: 'keuze', vraag, opties, juist, juistTex: null, juistHtml: wis(opties[juist].t), punten: 1, ...opt }; },
    // keuze met de juiste optie eerst, in willekeurige volgorde
    keuzeR(r, vraag, juisteOptie, andere, opt = {}) {
        const alle = r.shuffle([{ ...juisteOptie, _j: true }, ...andere]);
        return D.keuze(vraag, alle, alle.findIndex(o => o._j), opt);
    },
};

// ---------- oefeningenbank ----------
const GEN = [];
function regGen(g) { GEN.push(g); }
// veelgebruikte LaTeX
const H00 = L`\overset{\frac{0}{0}}{\underset{H}{=}}`, HOO = L`\overset{\frac{\infty}{\infty}}{\underset{H}{=}}`;
function limT(naar, kant = '', v = 'x') {
    return kant ? L`\lim\limits_{\substack{${v} \to ${naar} \\ ${kant === '+' ? '>' : '<'}}}` : L`\lim\limits_{${v} \to ${naar}}`;
}
</script>

<!-- =====================================================================
     4. OEFENINGEN — afgeleiden van inverse, exponentiële en logaritmische functies (SO 1)
     ===================================================================== -->
<script>
const GRONDT = [2, 3, 5, 7, 10];
const logS = a => a === 10 ? 'log' : `log_${a}`;          // invoer-notatie
const logL = a => a === 10 ? L`\log` : L`\log_{${a}}`;     // LaTeX
const fOpg = (f, naam = 'f') => L`$$${naam}(x) = [[${f}]]$$`;
const afgVraag = (naam = 'f') => L`Bereken de afgeleide $${naam}'(x)$.`;

regGen({ id: 'el_inverse', cat: 'explog', niveau: 1, titel: 'Afgeleide van een inverse functie', maak(r) {
    const v = r.int(0, 5);
    let f, fi, dfx, dfi, dom, uitleg, st = [], fA = [], fB = [];
    if (v === 0) {
        const a = r.pick(GRONDT.filter(g => g !== 3)); // 3^x = SO 1
        f = `${a}^x`; fi = `${logS(a)}(x)`; dfx = `${a}^x ln(${a})`; dfi = `1/(x ln(${a}))`; dom = [0.3, 6];
        uitleg = L`$y = ${a}^x \Leftrightarrow x = ${logL(a)}\, y$. Verwissel $x$ en $y$: $f^{-1}(x) = ${logL(a)}\, x$.`;
        st = [L`$Df(x) = ${a}^x \ln ${a}$`, L`$Df^{-1}(x) = \dfrac{1}{${a}^{${logL(a)} x} \cdot \ln ${a}}$`, L`Omdat $${a}^{${logL(a)} x} = x$ is $Df^{-1}(x) = \dfrac{1}{x \ln ${a}}$.`];
        fA = [{ w: `1/${a}^x`, soort: 'inverse', msg: L`$f^{-1}$ is de inverse functie, niet $\frac{1}{f}$. Los $y = ${a}^x$ op naar $x$.` }];
        fB = [{ w: '1/x', soort: 'lna', msg: L`Je vergat de factor $\ln ${a}$: $D(${a}^x) = ${a}^x \ln ${a}$.` },
            { w: `1/(${a}^x ln(${a}))`, soort: 'inverse', msg: L`Je vulde $x$ in in $Df$. In de formule moet je $f^{-1}(x) = ${logL(a)}\, x$ invullen.` },
            { w: `x ln(${a})`, soort: 'inverse', msg: L`Je vergat het omgekeerde te nemen: $Df^{-1}(x) = \frac{1}{Df(f^{-1}(x))}$.` }];
    } else if (v === 1) {
        const k = r.pick([2, 3, 5, -1, -2]);
        const kx = S.cf(k, 'x');
        f = `e^(${kx})`; fi = k > 0 ? `ln(x)/${k}` : k === -1 ? '-ln(x)' : `-ln(x)/${-k}`;
        dfx = S.cf(k, `e^(${kx})`); dfi = k === -1 ? '-1/x' : k > 0 ? `1/(${k}x)` : `-1/(${-k}x)`; dom = [0.3, 6];
        uitleg = L`$y = e^{${tx(kx)}} \Leftrightarrow ${tx(kx)} = \ln y \Leftrightarrow x = [[${fi.replace(/x\)/, 'y)')}]]$. Verwissel $x$ en $y$: $f^{-1}(x) = [[${fi}]]$.`;
        st = [L`$Df(x) = [[${dfx}]]$`, L`$Df^{-1}(x) = \dfrac{1}{Df\left(f^{-1}(x)\right)} = \dfrac{1}{${k === -1 ? '-' : k}\, e^{${k} \cdot \left([[${fi}]]\right)}} = \dfrac{1}{${k === -1 ? '-' : k}\, e^{\ln x}}$`, L`Omdat $e^{\ln x} = x$ is $Df^{-1}(x) = [[${dfi}]]$.`];
        fB = [{ w: `1/(${dfx})`, soort: 'inverse', msg: L`Je vulde $x$ in in $Df$. In de formule moet je $f^{-1}(x)$ invullen.` }];
    } else if (v === 2) {
        const a = r.pick([2, 3, 5, 10]);
        f = `${logS(a)}(x)`; fi = `${a}^x`; dfx = `1/(x ln(${a}))`; dfi = `${a}^x ln(${a})`; dom = [-2, 2];
        uitleg = L`$y = ${logL(a)}\, x \Leftrightarrow x = ${a}^y$. Verwissel $x$ en $y$: $f^{-1}(x) = ${a}^x$.`;
        st = [L`$Df(x) = \dfrac{1}{x \ln ${a}}$`, L`$Df^{-1}(x) = \dfrac{1}{\frac{1}{${a}^x \ln ${a}}} = ${a}^x \ln ${a}$`];
        fA = [{ w: `1/(${logS(a)}(x))`, soort: 'inverse', msg: L`$f^{-1}$ is de inverse functie, niet $\frac{1}{f}$.` }];
        fB = [{ w: `${a}^x`, soort: 'lna', msg: L`Je vergat de factor $\ln ${a}$.` }, { w: `1/(${a}^x ln(${a}))`, soort: 'inverse', msg: L`Je vergat het omgekeerde te nemen: $Df^{-1}(x) = \frac{1}{Df(f^{-1}(x))}$.` }];
    } else if (v === 3) {
        const c = r.nz(-6, 6);
        f = S.plus('x^3', c); fi = `(${S.xm(c)})^(1/3)`; dfx = '3x^2'; dfi = `1/(3(${S.xm(c)})^(2/3))`; dom = [c + 0.4, c + 6];
        uitleg = L`$y = [[${f}]] \Leftrightarrow x^3 = [[${S.xm(c, 'y')}]] \Leftrightarrow x = \sqrt[3]{[[${S.xm(c, 'y')}]]}$. Verwissel $x$ en $y$.`;
        st = [L`$Df(x) = 3x^2$`, L`$Df^{-1}(x) = \dfrac{1}{3\left(\sqrt[3]{[[${S.xm(c)}]]}\right)^2} = \dfrac{1}{3\sqrt[3]{([[${S.xm(c)}]])^2}}$`];
        fB = [{ w: '1/(3x^2)', soort: 'inverse', msg: L`Je vulde $x$ in in $Df$. In de formule moet je $f^{-1}(x) = \sqrt[3]{[[${S.xm(c)}]]}$ invullen.` }];
    } else if (v === 4) {
        const c = r.nz(-5, 5);
        f = S.plus('e^x', c); fi = `ln(${S.xm(c)})`; dfx = 'e^x'; dfi = `1/(${S.xm(c)})`; dom = [c + 0.3, c + 6];
        uitleg = L`$y = [[${f}]] \Leftrightarrow e^x = [[${S.xm(c, 'y')}]] \Leftrightarrow x = \ln([[${S.xm(c, 'y')}]])$. Verwissel $x$ en $y$.`;
        st = [L`$Df(x) = e^x$`, L`$Df^{-1}(x) = \dfrac{1}{e^{\ln([[${S.xm(c)}]])}} = [[${dfi}]]$`];
        fB = [{ w: '1/e^x', soort: 'inverse', msg: L`Je vulde $x$ in in $Df$. In de formule moet je $f^{-1}(x)$ invullen.` }];
    } else {
        const c = r.nz(-5, 5);
        f = S.plus('ln(x)', c); fi = `e^(${S.xm(c)})`; dfx = '1/x'; dfi = `e^(${S.xm(c)})`; dom = [-2, 3];
        uitleg = L`$y = [[${f}]] \Leftrightarrow \ln x = [[${S.xm(c, 'y')}]] \Leftrightarrow x = e^{[[${S.xm(c, 'y')}]]}$. Verwissel $x$ en $y$.`;
        st = [L`$Df(x) = \dfrac{1}{x}$`, L`$Df^{-1}(x) = \dfrac{1}{\frac{1}{e^{[[${S.xm(c)}]]}}} = e^{[[${S.xm(c)}]]}$`];
        fB = [{ w: `1/e^(${S.xm(c)})`, soort: 'inverse', msg: L`Je vergat het omgekeerde te nemen: $Df^{-1}(x) = \frac{1}{Df(f^{-1}(x))}$.` }];
    }
    return {
        opgave: L`Gegeven is de functie $f$ met voorschrift ${fOpg(f)}`,
        delen: [D.uitdr('Bepaal het voorschrift van de inverse functie $f^{-1}$.', 'f^{-1}(x) =', fi, { dom, fouten: fA, soort: 'inverse', tip: 'Stel $y = f(x)$, los op naar $x$ en verwissel dan $x$ en $y$.' }),
            D.uitdr('Bepaal de afgeleide van $f^{-1}$ met de formule voor de afgeleide van een inverse functie. Vereenvoudig.', 'Df^{-1}(x) =', dfi, { dom, fouten: fB, soort: 'inverse' })],
        hints: ['Stel $y = f(x)$ en los op naar $x$. Verwissel daarna $x$ en $y$.', L`Formule: $Df^{-1}(x) = \dfrac{1}{Df\left(f^{-1}(x)\right)}$.`, L`$Df(x) = [[${dfx}]]$. Vul daarin $f^{-1}(x)$ in en vereenvoudig.`],
        stappen: [uitleg, L`Formule: $Df^{-1}(x) = \dfrac{1}{Df\left(f^{-1}(x)\right)}$`, ...st, L`!$f^{-1}(x) = [[${fi}]] \qquad Df^{-1}(x) = [[${dfi}]]$`],
    };
} });

regGen({ id: 'el_inverse_punt', cat: 'explog', niveau: 2, titel: 'Afgeleide van de inverse in een punt', maak(r) {
    const v = r.int(0, 3);
    let f, df, x0, motivering, xdom = L`$x \in \mathbb{R}$`;
    if (v === 0) { const p = r.int(1, 5), q = r.int(-4, 4); x0 = r.pick([1, 2, -1]); f = S.som(['x^3', S.cf(p, 'x'), String(q)]); df = `3x^2 + ${p}`; }
    else if (v === 1) { const p = r.int(1, 4), q = r.int(-4, 4); x0 = r.pick([1, -1]); f = S.som(['x^5', S.cf(p, 'x'), String(q)]); df = `5x^4 + ${p}`; }
    else if (v === 2) { const p = r.int(1, 3); x0 = 0; f = `e^x + ${S.cf(p, 'x')}`; df = `e^x + ${p}`; }
    else { const p = r.int(1, 3); x0 = 1; f = `${S.cf(p, 'x')} + ln(x)`; df = `${p} + 1/x`; xdom = L`$x > 0$`; }
    const y0 = Math.round(Ex.waarde(Ex.ontleed(f, { vars: ['x'] }), { x: x0 }));
    const dfx0 = Math.round(Ex.waarde(Ex.ontleed(df, { vars: ['x'] }), { x: x0 }));
    const gp = F(1, dfx0);
    motivering = L`$f'(x) = [[${df}]] > 0$ voor elke ${xdom}, dus $f$ is strikt stijgend en dus inverteerbaar.`;
    const fy0 = Ex.waarde(Ex.ontleed(df, { vars: ['x'] }), { x: y0 });
    const foutC = [{ w: dfx0, soort: 'inverse', msg: L`Je moet het omgekeerde nemen: $g'(${y0}) = \frac{1}{f'(g(${y0}))} = \frac{1}{f'(${x0})}$.` }];
    if (Number.isFinite(fy0) && Math.abs(1 / fy0 - gp.v) > 1e-6) foutC.push({ w: 1 / fy0, soort: 'inverse', msg: L`Je berekende $\frac{1}{f'(${y0})}$. Je moet $f'$ berekenen in $g(${y0}) = ${x0}$.` });
    const delen = [
        D.keuzeR(r, 'Waarom is $f$ inverteerbaar?', { t: motivering }, [
            { t: 'Omdat $f$ continu is.', uitleg: 'Continu zijn is niet genoeg: een continue functie kan eerst stijgen en dan dalen (denk aan $x^2$).' },
            { t: L`Omdat $f(${x0}) = ${y0}$.`, uitleg: 'Eén functiewaarde zegt niets over de inverteerbaarheid.' },
            { t: L`Omdat $f'(x) = 0$ een oplossing heeft.`, uitleg: "Integendeel: als $f'$ van teken wisselt, is $f$ niet inverteerbaar." }]),
        D.getal(L`Noem $g$ de inverse functie van $f$. Bepaal $g(${y0})$.`, x0, { label: L`g(${y0}) =`, tip: L`$g(${y0}) = a \Leftrightarrow f(a) = ${y0}$.` }),
        D.getal(L`Bereken $g'(${y0})$.`, gp.txt(), { label: L`g'(${y0}) =`, fouten: foutC, soort: 'inverse' }),
    ];
    const metRaak = r.bool(0.5);
    if (metRaak) {
        const q = F(x0).min(gp.maal(y0));
        delen.push(D.rechte(L`Stel een vergelijking op van de raaklijn aan de grafiek van $g$ in het punt $(${y0}, ${x0})$.`, `y = ${S.lin(gp, q)}`, { raak: [y0, x0] }));
    }
    return {
        opgave: L`Gegeven is de functie $f$ met voorschrift ${fOpg(f)} Je weet dat $f(${x0}) = ${y0}$.`,
        delen,
        hints: [L`Bereken $f'(x)$ en kijk naar het teken.`, L`$g(${y0}) = ${x0}$ want $f(${x0}) = ${y0}$.`, L`$g'(${y0}) = \dfrac{1}{f'\left(g(${y0})\right)} = \dfrac{1}{f'(${x0})}$.`],
        stappen: [L`$f'(x) = [[${df}]]$`, motivering, L`$f(${x0}) = ${y0}$, dus $g(${y0}) = ${x0}$.`,
            L`$g'(${y0}) = \dfrac{1}{f'\left(g(${y0})\right)} = \dfrac{1}{f'(${x0})} = \dfrac{1}{${dfx0}}$`,
            ...(metRaak ? [L`Raaklijn aan de grafiek van $g$ in $(${y0}, ${x0})$: $${raakVgl(String(x0), gp.txt(), String(y0))}$`] : []),
            L`!$g'(${y0}) = ${gp.tex()}$${metRaak ? L` en de raaklijn is $${delen[3].juistTex}$` : ''}`],
    };
} });

// ---------- kettingregel (herhaling) ----------
regGen({ id: 'el_ketting1', cat: 'explog', niveau: 1, titel: 'Kettingregel (herhaling)', maak(r) {
    const t = r.int(0, 3);
    let f, d, dom = [-2, 2], u, ud, buiten, fouten = [];
    if (t === 0) {
        const a = r.pick([2, 3, 4, 5, -2, -3]), b = r.nz(-7, 7), n = r.pick([3, 4, 5, 6]);
        u = S.lin(a, b); ud = String(a);
        f = `(${u})^${n}`; d = `${n * a}(${u})^${n - 1}`; buiten = L`$D(u^{${n}}) = ${n}${n === 2 ? "u" : "u^{" + (n - 1) + "}"} \cdot u'$`;
        fouten = [{ w: `${n}(${u})^${n - 1}`, soort: 'ketting', msg: L`Je vergat te vermenigvuldigen met de afgeleide van $[[${u}]]$, namelijk $${a}$.` }];
    } else if (t === 1) {
        const p = r.pick([1, 2, 3, -1]), n = r.pick([3, 4, -1, -2]);
        const q = n < 0 ? r.int(1, 5) * (p > 0 ? 1 : -1) : r.nz(-5, 5);
        u = S.poly([p, 0, q]); ud = S.cf(2 * p, 'x');
        if (n > 0) { f = `(${u})^${n}`; d = `${S.cf(2 * p * n, 'x')}(${u})^${n - 1}`; fouten = [{ w: `${n}(${u})^${n - 1}`, soort: 'ketting', msg: L`Je vergat te vermenigvuldigen met $u' = [[${ud}]]$.` }]; buiten = L`$D(u^{${n}}) = ${n}${n === 2 ? "u" : "u^{" + (n - 1) + "}"} \cdot u'$`; }
        else { f = `1/(${u})^${-n}`; d = `${S.cf(2 * p * n, 'x')}/(${u})^${1 - n}`; fouten = [{ w: `${n}/(${u})^${1 - n}`, soort: 'ketting', msg: L`Je vergat te vermenigvuldigen met $u' = [[${ud}]]$.` }]; buiten = L`$\frac{1}{u^{${-n}}} = u^{${n}}$, dus $D(u^{${n}}) = ${n}${n === 2 ? "u" : "u^{" + (n - 1) + "}"} \cdot u'$`; }
    } else if (t === 2) {
        const p = r.int(1, 3), q = r.int(-4, 4), c = Math.ceil((q * q + 1) / (4 * p)) + r.int(0, 4);
        u = S.poly([p, q, c]); ud = S.lin(2 * p, q);
        f = `sqrt(${u})`; d = `(${ud})/(2sqrt(${u}))`; buiten = L`$D\sqrt{u} = \dfrac{1}{2\sqrt{u}} \cdot u'$`;
        fouten = [{ w: `1/(2sqrt(${u}))`, soort: 'ketting', msg: L`Je vergat te vermenigvuldigen met de afgeleide van de uitdrukking onder de wortel: $u' = [[${ud}]]$.` }];
    } else {
        const a = r.pick([2, 3, 6]), b = r.int(1, 5);
        u = S.lin(a, b); ud = String(a); dom = [0, 3];
        const c = F(a, 3);
        f = `(${u})^(1/3)`; d = c.d === 1 ? `${c.n}/(${u})^(2/3)` : `${c.n}/(${c.d}(${u})^(2/3))`; buiten = L`$\sqrt[3]{u} = u^{\frac13}$, dus $D\left(u^{\frac13}\right) = \frac13 u^{-\frac23} \cdot u'$`;
        fouten = [{ w: `1/(3(${u})^(2/3))`, soort: 'ketting', msg: L`Je vergat te vermenigvuldigen met $u' = ${a}$.` }];
    }
    return {

        st = [L`$f'(x) = \dfrac{\frac{1}{x} \cdot x - \ln(${p === 1 ? '' : p}x) \cdot 1}{x^2}$`, L`!$f'(x) = [[${d}]]$`];
        fouten = [{ w: p === 1 ? '(ln(x) - 1)/x^2' : `(ln(${p}x) - 1)/x^2`, soort: 'quotient', msg: 'Let op de volgorde in de teller: $u\'v - uv\'$.' }];

        hints = [L`Herschrijf: $\log_{${a}} \frac1x = -\log_{${a}} x$.`, L`$D(\log x) = \frac{1}{x \ln 10}$ en $D(\log_{${a}} x) = \frac{1}{x \ln ${a}}$.`];

        st = [L`$f(x) = \ln(x + ${a}) - \ln(x - ${a})$ (voor $x > ${a}$)`, L`$f'(x) = \dfrac{1}{x + ${a}} - \dfrac{1}{x - ${a}} = \dfrac{(x - ${a}) - (x + ${a})}{x^2 - ${a * a}}$`, L`!$f'(x) = [[${d}]]$`];

    else if (t === 1) { const p = r.pick([1, 2, 3]), q = r.int(-2, 3); u = 'x'; v = S.lin(p, q); f = `x^(${v})`; exp = `(${v})ln(x)`; dexp = `${p}ln(x) + (${v})/x`; d = `x^(${v})(${p}ln(x) + (${v})/x)`; }
    else if (t === 2) { u = 'x'; v = 'x'; f = 'x^x'; exp = 'x ln(x)'; dexp = 'ln(x) + 1'; d = 'x^x(ln(x) + 1)'; }

    else if (t === 4) { u = 'ln(x)'; v = 'x'; f = 'ln(x)^x'; exp = 'x ln(ln(x))'; dexp = 'ln(ln(x)) + 1/ln(x)'; d = 'ln(x)^x(ln(ln(x)) + 1/ln(x))'; dom = [1.3, 5]; }
    else if (t === 5) { u = 'log(x)'; v = 'ln(x)'; f = 'log(x)^(ln(x))'; exp = 'ln(x) ln(log(x))'; dexp = '(ln(log(x)) + 1)/x'; d = 'log(x)^(ln(x))(ln(log(x)) + 1)/x'; dom = [1.6, 6]; }
    else { u = 'x'; v = 'sqrt(x)'; f = 'x^(sqrt(x))'; exp = 'sqrt(x) ln(x)'; dexp = '(ln(x) + 2)/(2sqrt(x))'; d = 'x^(sqrt(x))(ln(x) + 2)/(2sqrt(x))'; }

        stappen: [L`$f(x) = e^{\ln f(x)} = e^{${tx(exp)}}$`, L`$f'(x) = e^{${tx(exp)}} \cdot D\left(${tx(exp)}\right)$`, L`$D\left(${tx(exp)}\right) = [[${dexp}]]$ (productregel)`, L`!$f'(x) = [[${d}]]$`],

        const k = r.pick([1, 2, -1]); f = `x e^(${S.cf(k, 'x')})`; df = `(${S.som(['1', S.cf(k, 'x')])})e^(${S.cf(k, 'x')})`;
        if (r.bool()) { [a, aTex, fa, dfa, rl] = ['0', '0', '0', '1', 'y = x']; }

        f = 'x^2 ln(x)'; df = '2x ln(x) + x';
        [a, aTex, fa, dfa, rl] = r.pick([['e', 'e', 'e^2', '3e', 'y = 3e x - 2e^2'], ['1', '1', '0', '1', 'y = x - 1']]);
    } else if (t === 3) {
        const p = r.pick([2, 3, -1, -2]), q = r.int(-3, 3);
        f = S.plus(`e^(${S.cf(p, 'x')})`, q); df = S.cf(p, `e^(${S.cf(p, 'x')})`);

    }
    const av = leesGetal(a, false).v, fav = leesGetal(fa, false).v;
    return {
        opgave: L`Gegeven is de functie $f$ met voorschrift ${fOpg(f)} Bepaal de vergelijking van de raaklijn $t$ aan de grafiek van $f$ in het punt met $x = ${aTex}$.`,
        delen: [D.getal(L`Bereken $f(${aTex})$.`, fa, { label: L`f(${aTex}) =`, soort: 'functiewaarde' }),
            D.getal(L`Bereken $f'(${aTex})$.`, dfa, { label: L`f'(${aTex}) =`, soort: 'rico', fouten: [{ w: fa, soort: 'rico', msg: 'Dit is $f(a)$; de richtingscoëfficiënt is $f\'(a)$.' }] }),
            D.rechte('Geef de vergelijking van de raaklijn $t$.', rl, { naamTex: 't', raak: [av, fav], raakF: { f, a: av } })],
        hints: [L`$t \leftrightarrow y - f(a) = f'(a)(x - a)$ met $a = ${aTex}$.`, L`$f'(x) = [[${df}]]$`],
        stappen: [L`$f(${aTex}) = [[${fa}]]$`, L`$f'(x) = [[${df}]]$, dus $f'(${aTex}) = [[${dfa}]]$`, L`$t \leftrightarrow ${raakVgl(fa, dfa, a)}$`, L`!$t \leftrightarrow ${leesRechte(rl).tex}$`],
    };
} });

    else if (t === 4) { const a = r.int(1, 3); f = `(x + ${a})^(x^3 - 1)`; d = `(x + ${a})^(x^3 - 1)(3x^2 ln(x + ${a}) + (x^3 - 1)/(x + ${a}))`; dom = [-0.5, 1.5]; h = L`Schrijf $f(x) = e^{(x^3 - 1)\ln(x + ${a})}$.`; }
