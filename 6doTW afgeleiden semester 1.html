<!-- =====================================================================
     5. OEFENINGEN — regel van de l'Hôpital (SO 2)
     ===================================================================== -->
<script>
const eM = k => { k = Fr.of(k); return k.nul ? '1' : k.gelijk(1) ? 'e' : `e^(${k.txt()})`; };
const ONB = { q00: L`$\frac{0}{0}$`, qoo: L`$\frac{\infty}{\infty}$`, min: L`$\infty - \infty$`, maal: L`$0 \cdot \infty$`, e1: L`$1^{\infty}$`, e00: L`$0^{0}$`, eoo: L`$\infty^{0}$`, geen: 'geen onbepaaldheid' };
function onbDeel(r, juist) {
    const andere = r.kies(Object.keys(ONB).filter(k => k !== juist), 3);
    const uitleg = juist === 'geen' ? 'Vul in: je krijgt meteen een reëel getal, er is geen onbepaaldheid.' : `Vul de grenswaarde in in elk deel van de uitdrukking: je krijgt ${ONB[juist]}.`;
    return D.keuzeR(r, 'Welke onbepaaldheid krijg je als je invult?', { t: ONB[juist] }, andere.map(k => ({ t: ONB[k], uitleg, soort: 'onbepaald' })), { janee: true });
}
const OO = L`+\infty`;
// o: { f, a (getal, ±Infinity), aTex, kant, onb, L, st, hints, fouten, punten }
function limOef(r, o) {
    const delen = [];
    if (o.onb) delen.push(onbDeel(r, o.onb));
    delen.push(D.getal('Bereken de limiet.', o.L, { label: L`\text{limiet} =`, fouten: o.fouten || [], soort: o.soort || 'hopital', lim: { f: o.f, a: o.a, kant: o.kant || '' }, punten: o.punten || 1 }));
    const kop = L`${limT(o.aTex, o.kant)} ${o.fTex || tx(o.f)}`;
    return { opgave: L`Bereken: $$${kop}$$`, delen, hints: o.hints, stappen: [...o.st, L`!$${kop} = [[${o.L}]]$`] };
}
const HINT_H = L`Regel van de l'Hôpital: $\lim \dfrac{f(x)}{g(x)} = \lim \dfrac{f'(x)}{g'(x)}$. Leid teller en noemer elk apart af (geen quotiëntregel!).`;

regGen({ id: 'hop_00', cat: 'hopital', niveau: 1, titel: "l'Hôpital bij 0/0", maak(r) {
    const t = r.int(0, 8);
    let f, a = 0, Lw, st, fouten = [];
    if (t === 0) {
        const p = r.pick([2, 3, 4, 5, -2, -3]), b = r.int(1, 6), px = S.cf(p, 'x');
        f = `(e^(${px}) - 1)/(${S.cf(b, 'x')})`; Lw = F(p, b).txt();
        st = [L`$${limT(0)} [[${f}]] ${H00} ${limT(0)} \dfrac{[[${S.cf(p, `e^(${px})`)}]]}{${b}} = [[${Lw}]]$`];
        fouten = [{ w: F(1, b).txt(), soort: 'ketting', msg: L`$D\left(e^{${tx(px)}}\right) = ${p}e^{${tx(px)}}$ (kettingregel).` }];
    } else if (t === 1) {
        const c = r.pick([2, 3, 5, 7, 10]);
        f = `(${c}^x - 1)/x`; Lw = `ln(${c})`;
        st = [L`$${limT(0)} [[${f}]] ${H00} ${limT(0)} \dfrac{${c}^x \ln ${c}}{1} = \ln ${c}$`];
        fouten = [{ w: c, soort: 'lna', msg: L`$D(${c}^x) = ${c}^x \ln ${c}$; in $x = 0$ blijft $\ln ${c}$ over.` }, { w: 1, soort: 'lna', msg: L`Je vergat de factor $\ln ${c}$ in $D(${c}^x)$.` }];
    } else if (t === 2) {
        const [c, d, q] = r.pick([[8, 2, 4], [9, 3, 3], [6, 2, 3], [10, 2, 5], [12, 3, 4], [4, 2, 2]]), k = r.int(1, 4);
        f = `(${c}^x - ${d}^x)/(${S.cf(k, 'x')})`; Lw = k === 1 ? `ln(${q})` : `ln(${q})/${k}`;
        st = [L`$${limT(0)} [[${f}]] ${H00} ${limT(0)} \dfrac{${c}^x \ln ${c} - ${d}^x \ln ${d}}{${k}} = \dfrac{\ln ${c} - \ln ${d}}{${k}} = [[${Lw}]]$`];
    } else if (t === 3) {
        const p = r.pick([2, 3, 5, -1, -2]), b = r.int(1, 5);
        f = `ln(${S.som(['1', S.cf(p, 'x')])})/(${S.cf(b, 'x')})`; Lw = F(p, b).txt();
        st = [L`$${limT(0)} [[${f}]] ${H00} ${limT(0)} \dfrac{\frac{${p}}{[[${S.som(['1', S.cf(p, 'x')])}]]}}{${b}} = [[${Lw}]]$`];
    } else if (t === 4) {
        const rr = r.pick([1, 2, 3, -1, -2]); let s; do { s = r.int(-3, 4); } while (s === rr || s === -rr);
        a = rr; f = `(${S.poly([1, -(rr + s), rr * s])})/(${S.poly([1, 0, -rr * rr])})`; Lw = F(rr - s, 2 * rr).txt();
        st = [L`$${limT(rr)} [[${f}]] ${H00} ${limT(rr)} \dfrac{[[${S.lin(2, -(rr + s))}]]}{2x} = \dfrac{${2 * rr} ${-(rr + s) < 0 ? '-' : '+'} ${Math.abs(rr + s)}}{${2 * rr}} = [[${Lw}]]$`, L`(Je kan ook ontbinden: $\dfrac{(x - ${rr})(${tx(S.xm(s))})}{(x - ${rr})(${tx(S.xm(-rr))})}$ en vereenvoudigen.)`.replace(/x - -/g, 'x + ')];
    } else if (t === 5) {
        const n = r.pick([3, 4]), rr = r.pick([1, 2, -1]);
        a = rr; f = `(${S.som(['x^' + n, String(-Math.pow(rr, n))])})/(${S.xm(rr)})`; Lw = String(n * Math.pow(rr, n - 1));
        st = [L`$${limT(rr)} [[${f}]] ${H00} ${limT(rr)} \dfrac{${n}x^{${n - 1}}}{1} = ${n} \cdot (${rr})^{${n - 1}} = ${Lw}$`];
    } else if (t === 6) {
        const p = r.int(2, 5);
        a = p; f = `ln(x/${p})/(x - ${p})`; Lw = `1/${p}`;
        st = [L`$D\left(\ln\frac{x}{${p}}\right) = \dfrac{\frac{1}{${p}}}{\frac{x}{${p}}} = \dfrac1x$`, L`$${limT(p)} [[${f}]] ${H00} ${limT(p)} \dfrac{\frac1x}{1} = \dfrac{1}{${p}}$`];
        fouten = [{ w: p, soort: 'omgekeerd', msg: 'Je vergat het omgekeerde: $\\frac{1/x}{1}$ wordt in $x = ' + p + '$ gelijk aan $\\frac{1}{' + p + '}$.' }];
    } else if (t === 7) {
        const p = r.pick([1, 2, 3, -1, -2]);
        a = p; f = `(e^(${S.xm(p)}) - 1)/(${S.poly([1, 0, -p * p])})`; Lw = F(1, 2 * p).txt();
        st = [L`$${limT(p)} [[${f}]] ${H00} ${limT(p)} \dfrac{e^{${tx(S.xm(p))}}}{2x} = \dfrac{e^0}{${2 * p}} = [[${Lw}]]$`];
    } else {
        const m = r.pick([2, 3, 4]), p = r.pick([-1, 1, 2, 0]), q = m * m - p;
        a = p; f = `(${S.xm(p)})/(sqrt(${S.plus('x', q)}) - ${m})`; Lw = String(2 * m);
        st = [L`$${limT(p)} [[${f}]] ${H00} ${limT(p)} \dfrac{1}{\frac{1}{2\sqrt{[[${S.plus('x', q)}]]}}} = ${limT(p)} 2\sqrt{[[${S.plus('x', q)}]]} = 2\sqrt{${m * m}} = ${2 * m}$`];
        fouten = [{ w: F(1, 2 * m).txt(), soort: 'omgekeerd', msg: 'Delen door een breuk is vermenigvuldigen met het omgekeerde.' }];
    }
    return limOef(r, { f, a, aTex: String(a), onb: 'q00', L: Lw, st: [L`Invullen geeft $\frac00$: de regel van de l'Hôpital mag.`, ...st], fouten,
        hints: [L`Vul in: je krijgt $\frac00$.`, HINT_H] });
} });

regGen({ id: 'hop_oo', cat: 'hopital', niveau: 1, titel: "l'Hôpital bij ∞/∞", maak(r) {

regGen({ id: 'hop_00_2', cat: 'hopital', niveau: 2, titel: "l'Hôpital: meerdere keren of met een logaritme", maak(r) {

    } else if (t === 3) {

regGen({ id: 'hop_verschil', cat: 'hopital', niveau: 2, titel: "l'Hôpital bij ∞ − ∞", maak(r) {

<script>
// a·e^k als invoer-tekst (a, k breuken)
S.mE = (a, k) => {
    a = Fr.of(a); k = Fr.of(k);
    if (a.nul) return '0';
    if (k.nul) return a.txt();
    const ka = k.abs(), ek = ka.gelijk(1) ? 'e' : ka.d === 1 ? `e^${ka.n}` : `e^(${ka.txt()})`;
    if (k.n > 0) return S.cf(a, ek);
    return `${a.n}/${a.d === 1 ? ek : `(${a.d}${ek})`}`;
};
// kies n deelvragen; deelvragen met vast: true zitten er altijd in; de volgorde blijft behouden
function kiesDelen(r, kand, n) {
    const vast = kand.filter(k => k.vast).length;
    const opt = kand.map((k, i) => i).filter(i => !kand[i].vast);
    const kies = new Set(r.kies(opt, Math.max(0, Math.min(opt.length, n - vast))));
    return kand.filter((k, i) => k.vast || kies.has(i)).map(k => k.d);
}
const MAXMIN = (r, juistMax, extra = '') => D.keuze(`Is dat extremum een maximum of een minimum?${extra}`, [{ t: 'maximum', uitleg: "Kijk naar de tekentabel van $f'$: van $-$ naar $+$ geeft een minimum.", soort: 'extremum' }, { t: 'minimum', uitleg: "Kijk naar de tekentabel van $f'$: van $+$ naar $-$ geeft een maximum.", soort: 'extremum' }], juistMax ? 0 : 1, { janee: true });

regGen({ id: 've_lnquot', cat: 'verloopexp', niveau: 2, titel: 'Verloop van (p + ln u)/u', maak(r) {

    const u = S.xm(c), U = c === 0 ? 'x' : `(${u})`, ln = `ln(${u})`;
    const tel = p === 0 ? ln : `${p} + ${ln}`;
    const f = `(${tel})/${U}`;
    const xn = S.plus(S.E(-p), c), xm = S.plus(S.E(1 - p), c), ym = S.E(p - 1);
    const kb = F(3 - 2 * p, 2), xb = S.plus(S.E(kb), c);

        { d: D.punt('Bepaal het snijpunt met de $x$-as.', 'S_x', [xn, 0], { tip: L`Nulwaarde van de teller: $[[${tel}]] = 0$.`, soort: 'logregel' }) },
        ...(c < 0 ? [{ d: D.punt('Bepaal het snijpunt met de $y$-as.', 'S_y', [0, ys], { tip: 'Bereken $f(0)$.' }) }] : []),
        { d: D.interval('Waar is $f(x) > 0$?', `]${xn} ; +inf[`, { tip: 'Maak een tekentabel van teller en noemer.' }) },
        { d: D.rechte('Geef de vergelijking van de verticale asymptoot.', `x = ${c}`, { soort: 'asymptoot', tip: L`Bereken $${limT(c, '+')} f(x)$.` }) },
        { d: D.rechte('Geef de vergelijking van de horizontale asymptoot (voor $x \\to +\\infty$).', 'y = 0', { soort: 'asymptoot' }) },
        { d: D.afg("Bereken $f'(x)$ en vereenvoudig.", f, df, [c + 0.3, c + 6]) },

        stappen: [

            L`$f''(x) = [[${d2}]]$ wisselt van teken als $\ln([[${u}]]) = ${kb.tex()}$, dus in $x = [[${xb}]]$: buigpunt $\left([[${xb}]], [[${yb}]]\right)$.`,

<script>
// k·π als invoer-tekst (k een breuk)
const piS = k => { k = Fr.of(k); if (k.nul) return '0'; return `${k.n === 1 ? '' : k.n === -1 ? '-' : k.n}pi${k.d === 1 ? '' : '/' + k.d}`; };
const kgvFr = (a, b) => { a = Fr.of(a); b = Fr.of(b); const n = Math.abs(a.n) / ggd(a.n, b.n) * Math.abs(b.n); return F(n, ggd(a.d, b.d)); };
const STD = L`\lim\limits_{t \to 0} \frac{\sin t}{t} = 1`;

    const t = r.int(0, 7);
    let a, b; do { [a, b] = r.kies([2, 3, 4, 5, 6, 7], 2); } while (t === 1 && a === 5 && b === 3); // sin 5x/sin 3x = SO 4
    let f, Lw, st, fouten = [];
    const ax = `${a}x`, bx = `${b}x`;

    if (r.bool(0.4)) items[2] = r.pick([{ e: 'cos(bgsin(3/5))', v: '4/5' }, { e: 'tan(bgcos(3/5))', v: '4/3' }, { e: 'sin(bgtan(3/4))', v: '3/5' }, { e: 'bgsin(sin(5pi/6))', v: 'pi/6' }, { e: 'bgcos(cos(7pi/6))', v: '5pi/6' }, { e: 'bgtan(tan(3pi/4))', v: '-pi/4' }]);
    return {
        opgave: 'Bereken zonder rekenmachine (exacte waarde).',
        delen: items.map(o => {
            const e = o.e || `${o.fn}(${o.x})`;
            const fouten = o.fn ? ALT[o.fn](o.v).map(w => ({ w, soort: 'cyclobereik', msg: `Die hoek heeft de juiste goniometrische waarde, maar ligt niet in het bereik van ${o.fn.replace('bg', 'Bg')}.` })) : [];
            return D.getal('Bereken.', o.v, { label: tx(e) + ' =', fouten, soort: 'cyclobereik' });
        }),

regGen({ id: 'cy_domein', cat: 'cyclo', niveau: 2, titel: 'Domein van een cyclometrische functie', maak(r) {
    const t = r.int(0, 3);
    let f, iv, st;
    if (t === 0) {
        const p = r.pick([2, 3, -2, -3]), q = r.int(-2, 2);
        const u = S.som([String(q), S.cf(p, 'x')]);
        const g1 = F(-1 - q, p), g2 = F(1 - q, p), lo = p > 0 ? g1 : g2, hi = p > 0 ? g2 : g1;

    } else {
        const o = r.pick([
            { q: '2x^2 - 7x + 4', a: '2x^2 - 7x + 5 = (2x - 5)(x - 1)', b: '2x^2 - 7x + 3 = (2x - 1)(x - 3)', iv: '[1/2 ; 1] U [5/2 ; 3]', ivx: '[1/2 ; 1] U [5/2 ; 3]' },
            { q: 'x^2 - 3x + 1', a: 'x^2 - 3x + 2 = (x - 1)(x - 2)', b: 'x^2 - 3x = x(x - 3)', iv: '[0 ; 1] U [2 ; 3]', ivx: ']0 ; 1] U [2 ; 3]' },
            { q: 'x^2 - 5x + 5', a: 'x^2 - 5x + 6 = (x - 2)(x - 3)', b: 'x^2 - 5x + 4 = (x - 1)(x - 4)', iv: '[1 ; 2] U [3 ; 4]', ivx: '[1 ; 2] U [3 ; 4]' },
            { q: 'x^2 + x - 1', a: 'x^2 + x = x(x + 1)', b: 'x^2 + x - 2 = (x + 2)(x - 1)', iv: '[-2 ; -1] U [0 ; 1]', ivx: '[-2 ; -1] U ]0 ; 1]' },
            { q: '2x^2 - 1', a: '2x^2 \\geq 0', b: '2x^2 - 2 = 2(x - 1)(x + 1)', iv: '[-1 ; 1]', ivx: '[-1 ; 0[ U ]0 ; 1]' }]);
        const deel = t === 3;
        f = deel ? `bgsin(${o.q})/x` : `bgsin(${o.q})`; iv = deel ? o.ivx : o.iv;
        st = [L`$-1 \leq [[${o.q}]] \leq 1$`, L`$[[${o.q}]] \geq -1 \Leftrightarrow ${o.a.replace(/ = .*/, '')} \geq 0$ met $${o.a}$`.replace('\\geq 0 \\geq 0$ met $2x^2 \\geq 0', '\\geq 0$ (altijd waar'), L`$[[${o.q}]] \leq 1 \Leftrightarrow ${o.b.replace(/ = .*/, '')} \leq 0$ met $${o.b}$`, L`Tekentabellen: $[[${o.q}]] \in [-1, 1]$ voor $x \in ${verzTex(leesVerzameling(o.iv))}$`, ...(deel ? [L`Bovendien $x \neq 0$ (noemer).`] : [])];
    }
    return {
        opgave: L`Bepaal het domein van de functie met voorschrift ${fOpg(f)}`,
        delen: [D.interval('Geef het domein.', iv, { label: L`\text{dom}\, f =`, punten: t >= 2 ? 2 : 1, tip: L`Het argument van $\operatorname{Bgsin}$ en $\operatorname{Bgcos}$ moet tussen $-1$ en $1$ liggen.` })],
        hints: [L`$\text{dom}\operatorname{Bgsin} = \text{dom}\operatorname{Bgcos} = [-1, 1]$, $\text{dom}\operatorname{Bgtan} = \text{dom}\operatorname{Bgcot} = \mathbb{R}$.`, 'Los de dubbele ongelijkheid op als twee ongelijkheden en neem de doorsnede.', ...(t === 3 ? ['Vergeet de noemer niet: $x \\neq 0$.'] : [])],
        stappen: [...st, L`!$\text{dom}\, f = ${verzTex(leesVerzameling(iv))}$`],
    };
} });

const CY1 = [
    r => { const p = r.pick([2, 3, 5]), q = r.int(-2, 2); const u = S.lin(p, q); return { f: `bgsin(${u})`, d: `${p}/sqrt(1 - (${u})^2)`, dom: [(-0.9 - q) / p, (0.9 - q) / p], h: L`$D\operatorname{Bgsin} u = \dfrac{u'}{\sqrt{1 - u^2}}$ met $u = [[${u}]]$.` }; },
    () => ({ f: 'bgcos(x^2)', d: '-2x/sqrt(1 - x^4)', dom: [-0.9, 0.9], h: L`$D\operatorname{Bgcos} u = \dfrac{-u'}{\sqrt{1 - u^2}}$ met $u = x^2$.`, fouten: [{ w: '2x/sqrt(1 - x^4)', soort: 'cycloafg', msg: L`$D\operatorname{Bgcos} u = \frac{-u'}{\sqrt{1 - u^2}}$: er staat een minteken.` }] }),

    r => { const n = r.pick([2, 3]); return { f: `bgcos(x)^${n}`, d: `-${n}bgcos(x)^${n - 1}/sqrt(1 - x^2)`.replace('^1/', '/'), dom: [-0.9, 0.9], h: L`$(\operatorname{Bgcos} x)^{${n}}$: kettingregel met $u = \operatorname{Bgcos} x$, $u' = \frac{-1}{\sqrt{1 - x^2}}$.` }; },

    () => ({ f: 'x^2 bgtan(x)', d: '2x bgtan(x) + x^2/(1 + x^2)', dom: [-2, 2], h: 'Productregel met $D\\operatorname{Bgtan} x = \\frac{1}{1 + x^2}$.' }),
    () => ({ f: 'bgtan(e^x)', d: 'e^x/(1 + e^(2x))', dom: [-2, 2], h: L`$\dfrac{1}{1 + (e^x)^2} \cdot e^x$.` }),
    r => { const p = r.pick([2, 3]); return { f: `bgcot(${p}x)`, d: `-${p}/(1 + ${p * p}x^2)`, dom: [-2, 2], h: L`$D\operatorname{Bgcot} u = \dfrac{-u'}{1 + u^2}$.` }; },
];
regGen({ id: 'cy_afg1', cat: 'cyclo', niveau: 1, titel: 'Afgeleiden van cyclometrische functies', maak(r) {
    const o = r.pick(CY1)(r);
    return { opgave: L`Bereken de afgeleide van ${fOpg(o.f)}`, delen: [D.afg(afgVraag(), o.f, o.d, o.dom, { fouten: o.fouten || [], soort: 'cycloafg' })],
        hints: [L`$D\operatorname{Bgsin} x = \frac{1}{\sqrt{1 - x^2}}$, $D\operatorname{Bgcos} x = \frac{-1}{\sqrt{1 - x^2}}$, $D\operatorname{Bgtan} x = \frac{1}{1 + x^2}$, $D\operatorname{Bgcot} x = \frac{-1}{1 + x^2}$.`, o.h], stappen: [o.h, L`!$f'(x) = [[${o.d}]]$`] };
} });

const CY2 = [
    r => { const p = r.pick([2, 3]), q = r.int(1, 4); const u = S.lin(p, q); return { f: `bgcot(sqrt(${u}))`, d: `-${p}/(2(${S.lin(p, q + 1)})sqrt(${u}))`, dom: [0.2, 4], h: L`$\dfrac{-1}{1 + (\sqrt{${tx(u)}})^2} \cdot \dfrac{${p}}{2\sqrt{${tx(u)}}}$ en $1 + (${tx(u)}) = ${tx(S.lin(p, q + 1))}$.` }; },

    () => ({ f: 'bgcos((x + 1)/sqrt(2))', d: '-1/sqrt(1 - 2x - x^2)', dom: [-2, 0.3], h: L`$\dfrac{-1}{\sqrt{1 - \frac{(x + 1)^2}{2}}} \cdot \dfrac{1}{\sqrt2} = \dfrac{-1}{\sqrt{2 - (x + 1)^2}}$.` }),
    () => ({ f: 'x bgsin(x) + sqrt(1 - x^2)', d: 'bgsin(x)', dom: [-0.9, 0.9], h: L`Productregel: $\operatorname{Bgsin} x + \frac{x}{\sqrt{1 - x^2}}$ en $D\sqrt{1 - x^2} = \frac{-x}{\sqrt{1 - x^2}}$.` }),
    () => ({ f: 'bgsin(sqrt(x))', d: '1/(2sqrt(x)sqrt(1 - x))', dom: [0.1, 0.9], h: L`$\dfrac{1}{\sqrt{1 - x}} \cdot \dfrac{1}{2\sqrt x}$.` }),
    r => { const n = r.pick([2, 3]); return { f: `bgsin(x)^${n}`, d: `${n}bgsin(x)^${n - 1}/sqrt(1 - x^2)`.replace('^1/', '/'), dom: [-0.9, 0.9], h: L`Kettingregel met $u = \operatorname{Bgsin} x$.` }; },

    () => ({ f: 'bgcos(2 - x)', d: '1/sqrt(1 - (2 - x)^2)', dom: [1.1, 2.9], h: L`$\dfrac{-1}{\sqrt{1 - (2 - x)^2}} \cdot (-1)$.` }),

regGen({ id: 'cy_afg2', cat: 'cyclo', niveau: 2, titel: 'Cyclometrische afgeleiden met kettingregel', maak(r) {

regGen({ id: 'cy_raaklijn', cat: 'cyclo', niveau: 2, titel: 'Raaklijn aan een cyclometrische grafiek', maak(r) {
    const t = r.int(0, 3);
    let f, a, fa, dfa, rl, df;
    if (t === 0) {
        let c, p; do { c = r.pick([1, 2, 3]); p = r.pick([1, 2, -1]); } while (c === 2 && p === 1); // niet de SO 5-functie
        f = `${S.cf(c, `bgcos(${S.poly([1, -2 * p, p * p])})`)} + x`; df = `${-2 * c}(x - ${p})/sqrt(1 - (${S.poly([1, -2 * p, p * p])})^2) + 1`.replace('- -1', '+ 1');
        a = String(p); fa = S.plus(piS(F(c, 2)), p); dfa = '1'; rl = `y = x + ${piS(F(c, 2))}`;
    } else if (t === 1) {
        const A = r.pick([1, 2, 3, -1]), B = r.pick([2, 4, -2, -4]);
        const [x0, bg, n] = r.pick([['0', '0', 1], ['1', 'pi/4', 2], ['-1', '-pi/4', 2], ['sqrt(3)', 'pi/3', 4]]);
        f = `${S.cf(A, 'x')} + ${S.cf(B, 'bgtan(x)')}`.replace('+ -', '- '); df = `${A} + ${B}/(1 + x^2)`;
        a = x0; const m = F(A).plus(F(B, n)); dfa = m.txt(); fa = x0 === '0' ? '0' : `${S.cf(A, x0 === '-1' ? '(-1)' : x0)} + ${B}*(${bg})`;
        rl = x0 === '0' ? `y = ${S.cf(m, 'x')}` : `y = ${m.txt()}(x - ${x0 === '-1' ? '(-1)' : x0}) + ${fa}`;
        if (m.nul) rl = `y = ${fa}`;
    } else if (t === 2) {
        const c = r.pick([2, 4, 6]);
        f = `bgsin(x/${c})`; df = `1/sqrt(${c * c} - x^2)`; a = String(c / 2); fa = 'pi/6'; dfa = `2/(${c}sqrt(3))`; rl = `y = 2/(${c}sqrt(3)) (x - ${c / 2}) + pi/6`;
    } else {
        f = 'x bgtan(x)'; df = 'bgtan(x) + x/(1 + x^2)'; a = '1'; fa = 'pi/4'; dfa = 'pi/4 + 1/2'; rl = 'y = (pi/4 + 1/2)(x - 1) + pi/4';
    }
    const aT = tx(a), av = leesGetal(a, false).v;
    return {
        opgave: L`Gegeven is de functie $f$ met voorschrift ${fOpg(f)} Bepaal de vergelijking van de raaklijn $t$ aan de grafiek in het punt met $x = ${aT}$.`,
        delen: [D.getal(L`Bereken $f(${aT})$.`, fa, { label: L`f(${aT}) =`, soort: 'functiewaarde' }), D.getal(L`Bereken $f'(${aT})$.`, dfa, { label: L`f'(${aT}) =`, soort: 'rico' }),
            D.rechte('Geef de vergelijking van de raaklijn $t$.', rl, { naamTex: 't', raak: [av, leesGetal(fa, false).v], raakF: { f, a: av } })],
        hints: [L`$t \leftrightarrow y - f(a) = f'(a)(x - a)$.`, L`$f'(x) = [[${df}]]$`],
        stappen: [L`$f(${aT}) = [[${fa}]]$`, L`$f'(x) = [[${df}]]$, dus $f'(${aT}) = [[${dfa}]]$`, L`$t \leftrightarrow ${raakVgl(fa, dfa, a)}$`, L`!$t \leftrightarrow ${leesRechte(rl).tex}$`],
    };
} });

regGen({ id: 'cy_verloop', cat: 'cyclo', niveau: 3, titel: 'Verloop van cyclometrische functies', maak(r) {
    const v = r.int(0, 3);
    if (v === 0) {
        const a = r.pick([2, 3]); // a = 1 = SO 5
        const u = S.som([S.cf(a, 'x^2'), '-1']), f = `bgtan(${u})`;
        const xs = a === 1 ? '1' : `1/sqrt(${a})`;
        return {

            delen: [D.afg("Bereken $\\alpha'(x)$.", `bgtan(${h2}/x) - bgtan(${h1}/x)`, `-${h2}/(x^2 + ${h2 * h2}) + ${h1}/(x^2 + ${h1 * h1})`, [1, 10], { label: "\\alpha'(x) =", soort: 'cycloafg' }),

            hints: [L`$D\operatorname{Bgtan}\frac{c}{x} = \frac{1}{1 + \frac{c^2}{x^2}} \cdot \frac{-c}{x^2} = \frac{-c}{x^2 + c^2}$.`, L`$\alpha'(x) = 0 \Leftrightarrow ${h1}(x^2 + ${h2 * h2}) = ${h2}(x^2 + ${h1 * h1})$.`],
            stappen: [L`$\alpha'(x) = \dfrac{-${h2}}{x^2 + ${h2 * h2}} + \dfrac{${h1}}{x^2 + ${h1 * h1}}$`, L`$\alpha'(x) = 0 \Leftrightarrow ${h2 - h1}x^2 = ${h1 * h2 * (h2 - h1)} \Leftrightarrow x^2 = ${h1 * h2}$; $\alpha'$ wisselt van $+$ naar $-$: maximum`, L`$\alpha([[${xs}]]) \approx ${hoek.toFixed(2).replace('.', '{,}')}^\circ$ (met GeoGebra, in graden)`, L`!$x = [[${xs}]]$ m`] };
    }

        hints: [L`$\alpha'(x) = \dfrac{-${h2}}{x^2 + ${h2 * h2}} + \dfrac{${h}}{x^2 + ${h * h}}$.`, 'Stel $\\alpha\'(x) = 0$ en los op naar $x > 0$.'],
        stappen: [L`$\alpha'(x) = 0 \Leftrightarrow ${h}(x^2 + ${h2 * h2}) = ${h2}(x^2 + ${h * h}) \Leftrightarrow x^2 = ${h * h2}$`, L`$x = ${x}$ (maximum)`, L`$\alpha(${x}) = \operatorname{Bgtan}\frac{${h2}}{${x}} - \operatorname{Bgtan}\frac{${h}}{${x}} \approx ${hoek.toFixed(2).replace('.', '{,}')}^\circ$`, L`!$x = ${x}$ m`] };

<script>
// punten (x, y) op de kromme F(x, y) = 0 zoeken: voor elke x de nulwaarden in y (tekenwissel + bisectie)
function kromPunten(Fs, xs, yr, max = 14) {
    const g = Ex.ontleed(Fs, { vars: ['x', 'y'] });
    const w = (x, y) => Ex.waarde(g, { x, y });
    const out = [];
    for (const x of xs) {
        const N = 300; let y0 = yr[0], f0 = w(x, y0);
        for (let i = 1; i <= N; i++) {
            const y1 = yr[0] + (yr[1] - yr[0]) * i / N, f1 = w(x, y1);
            if (Number.isFinite(f0) && Number.isFinite(f1) && f0 * f1 < 0) {
                let a = y0, b = y1, fa = f0;
                for (let k = 0; k < 60; k++) { const m = (a + b) / 2, fm = w(x, m); if (fa * fm <= 0) b = m; else { a = m; fa = fm; } }
                const ym = (a + b) / 2;
                if (Math.abs(w(x, ym)) < 1e-7 * (1 + Math.abs(f0) + Math.abs(f1))) out.push({ x, y: ym });
            }
            y0 = y1; f0 = f1;
        }
    }
    const stap = Math.max(1, Math.floor(out.length / max));
    return out.filter((p, i) => i % stap === 0).slice(0, max);
}
const lijnX = (a, b, n = 9) => Array.from({ length: n }, (_, i) => a + (b - a) * (i + 0.37) / n);
const IMPL_HINT = L`Leid links en rechts af naar $x$. Elke term met $y$ krijgt de factor $\frac{dy}{dx}$: $D(y^n) = ny^{n-1}\frac{dy}{dx}$ en $D(xy) = y + x\frac{dy}{dx}$.`;

regGen({ id: 'im_dydx', cat: 'impl', niveau: 1, titel: 'Impliciet afleiden', maak(r) {
    const t = r.int(0, 8);
    let vgl, dydx, envs, st, niv = 1;
    if (t === 0) { const R = r.int(2, 6); vgl = L`x^2 + y^2 = ${R * R}`; dydx = '-x/y'; envs = lijnX(-R + 0.3, R - 0.3).flatMap(x => [{ x, y: Math.sqrt(R * R - x * x) }, { x, y: -Math.sqrt(R * R - x * x) }]); st = [L`$2x + 2y\dfrac{dy}{dx} = 0$`]; }
    else if (t === 1) { const a = r.int(2, 4), c = r.int(1, 6); const x0 = Math.sqrt(c / a); vgl = L`${a}x^2 - y^2 = ${c}`; dydx = `${a}x/y`; envs = lijnX(x0 + 0.2, x0 + 3).flatMap(x => [{ x, y: Math.sqrt(a * x * x - c) }, { x: -x, y: -Math.sqrt(a * x * x - c) }]); st = [L`$${2 * a}x - 2y\dfrac{dy}{dx} = 0$`]; }
    else if (t === 2) { const a = r.int(1, 3); vgl = L`x = \cos(${a === 1 ? '' : a}y)`; dydx = `-1/(${a}sin(${a}y))`; envs = lijnX(0.15, Math.PI / a - 0.15).map(y => ({ x: Math.cos(a * y), y })); st = [L`$1 = -${a === 1 ? '' : a}\sin(${a === 1 ? '' : a}y)\dfrac{dy}{dx}$`]; }
    else if (t === 3) { const c = r.pick([2, 3, 5, 6, -4]); vgl = L`xy = ${c}`; dydx = '-y/x'; envs = [...lijnX(0.3, 4), ...lijnX(-4, -0.3)].map(x => ({ x, y: c / x })); st = [L`$y + x\dfrac{dy}{dx} = 0$ (productregel)`]; }
    else if (t === 4) { const c = r.int(2, 9); const m = Math.sqrt(4 * c / 3); vgl = L`x^2 + xy + y^2 = ${c}`; dydx = '-(2x + y)/(x + 2y)'; envs = lijnX(-m + 0.2, m - 0.2).flatMap(x => { const D0 = Math.sqrt(4 * c - 3 * x * x); return [{ x, y: (-x + D0) / 2 }, { x, y: (-x - D0) / 2 }]; }); st = [L`$2x + y + x\dfrac{dy}{dx} + 2y\dfrac{dy}{dx} = 0$`]; niv = 2; }
    else if (t === 5) { vgl = L`2xy + y^2 = x + y`; dydx = '(1 - 2y)/(2x + 2y - 1)'; envs = [...lijnX(-2, 0.4), ...lijnX(0.6, 3)].map(y => ({ x: (y - y * y) / (2 * y - 1), y })); st = [L`$2y + 2x\dfrac{dy}{dx} + 2y\dfrac{dy}{dx} = 1 + \dfrac{dy}{dx}$`]; niv = 2; }
    else if (t === 6) { vgl = L`(x - 2)y^3 = x + 2`; dydx = '(1 - y^3)/(3(x - 2)y^2)'; envs = [...lijnX(1.3, 3), ...lijnX(-3, 0.7)].map(y => ({ x: 2 * (y ** 3 + 1) / (y ** 3 - 1), y })); st = [L`$y^3 + (x - 2) \cdot 3y^2\dfrac{dy}{dx} = 1$`]; niv = 2; }
    else if (t === 7) { vgl = L`\operatorname{Bgtan}(x + y) = x`; dydx = '(x + y)^2'; envs = lijnX(-1.3, 1.3).map(x => ({ x, y: Math.tan(x) - x })); st = [L`$\dfrac{1}{1 + (x + y)^2}\left(1 + \dfrac{dy}{dx}\right) = 1$`, L`$1 + \dfrac{dy}{dx} = 1 + (x + y)^2$`]; niv = 2; }
    else { const k = r.pick([3, 6, 9, 12]); vgl = L`x^3 + y^3 = ${k}xy`; dydx = `(${k}y - 3x^2)/(3y^2 - ${k}x)`; envs = lijnX(0.2, 3.5).map(s => ({ x: 3 * k * s / (1 + s ** 3), y: 3 * k * s * s / (1 + s ** 3) })); st = [L`$3x^2 + 3y^2\dfrac{dy}{dx} = ${k}y + ${k}x\dfrac{dy}{dx}$ (productregel rechts)`]; niv = 2; }
    return {
        opgave: L`Bereken $\dfrac{dy}{dx}$ door impliciet af te leiden: $$${vgl}$$`,
        delen: [D.uitdr('Geef $\\frac{dy}{dx}$ in functie van $x$ en $y$.', L`\dfrac{dy}{dx} =`, dydx, { vars: ['x', 'y'], envs, soort: 'impliciet', punten: niv })],
        hints: [IMPL_HINT, 'Breng alle termen met $\\frac{dy}{dx}$ naar één kant en zonder $\\frac{dy}{dx}$ af.'],
        stappen: [L`Leid beide leden af naar $x$:`, ...st, L`!$\dfrac{dy}{dx} = [[${dydx}]]$`],
    };
} });

regGen({ id: 'im_raaklijn', cat: 'impl', niveau: 2, titel: 'Raaklijn aan een impliciet gegeven kromme', maak(r) {
    if (r.bool(0.25)) {
        const k = r.pick([4, 6, 8, 12]);
        const envs = lijnX(0.2, 3.5).map(s => ({ x: 3 * k * s / (1 + s ** 3), y: 3 * k * s * s / (1 + s ** 3) }));
        return {
            opgave: L`Gegeven is het folium van Descartes $$x^3 + y^3 = ${k}xy$$ Het punt $P(${k / 2}, ${k / 2})$ ligt op de kromme.`,
            delen: [D.uitdr('Bereken $\\frac{dy}{dx}$.', L`\dfrac{dy}{dx} =`, `(${k}y - 3x^2)/(3y^2 - ${k}x)`, { vars: ['x', 'y'], envs, soort: 'impliciet' }),
                D.getal('Bereken de helling van de kromme in $P$.', -1, { label: L`\left.\frac{dy}{dx}\right|_P =`, soort: 'rico' }),
                D.rechte('Geef de vergelijking van de raaklijn in $P$.', `y = -x + ${k}`, { raak: [k / 2, k / 2] })],
            hints: [IMPL_HINT, L`Vul $x = y = ${k / 2}$ in in $\frac{dy}{dx}$.`],
            stappen: [L`$3x^2 + 3y^2\dfrac{dy}{dx} = ${k}y + ${k}x\dfrac{dy}{dx} \Leftrightarrow \dfrac{dy}{dx} = \dfrac{${k}y - 3x^2}{3y^2 - ${k}x}$`, L`In $P$: $\dfrac{${k * k / 2} - ${3 * k * k / 4}}{${3 * k * k / 4} - ${k * k / 2}} = -1$`, L`!$t \leftrightarrow y = -x + ${k}$`],
        };
    }
    let A, B, C, Dd, E, x0, y0, Fy, Fx;
    do {
        A = r.int(1, 3); B = r.int(-2, 2); C = r.int(1, 2); Dd = r.int(-3, 3); E = r.int(-3, 3); x0 = r.nz(-3, 3); y0 = r.nz(-3, 3);
        Fx = 2 * A * x0 + B * y0 + Dd; Fy = B * x0 + 2 * C * y0 + E;
    } while (Fy === 0 || Math.abs(Fx) > 12 || B * B - 4 * A * C >= 0 && r.bool(0.5));
    const G = -(A * x0 * x0 + B * x0 * y0 + C * y0 * y0 + Dd * x0 + E * y0);
    const lhs = S.som([S.cf(A, 'x^2'), S.cf(B, 'xy'), S.cf(C, 'y^2'), S.cf(Dd, 'x'), S.cf(E, 'y')]);
    const tel = S.som([S.cf(2 * A, 'x'), S.cf(B, 'y'), String(Dd)]), noem = S.som([S.cf(B, 'x'), S.cf(2 * C, 'y'), String(E)]);
    const dydx = `-(${tel})/(${noem})`;
    const m = F(-Fx, Fy);
    const envs = [];
    for (const x of lijnX(x0 - 1.5, x0 + 1.5, 13)) {
        const a = C, b = B * x + E, c = A * x * x + Dd * x + G, D0 = b * b - 4 * a * c;
        if (D0 > 1e-6) { envs.push({ x, y: (-b + Math.sqrt(D0)) / (2 * a) }); envs.push({ x, y: (-b - Math.sqrt(D0)) / (2 * a) }); }
    }
    if (envs.length < 6) throw new Error('te weinig punten op de kromme');
    return {
        opgave: L`Gegeven is de kromme $k$ met vergelijking $$${tx(lhs)} = ${-G}$$ Het punt $P(${x0}, ${y0})$ ligt op $k$.`,
        delen: [D.uitdr('Bereken $\\frac{dy}{dx}$ in functie van $x$ en $y$.', L`\dfrac{dy}{dx} =`, dydx, { vars: ['x', 'y'], envs, soort: 'impliciet' }),
            D.getal('Bereken de helling van $k$ in $P$.', m.txt(), { label: L`\left.\frac{dy}{dx}\right|_P =`, soort: 'rico' }),
            D.rechte('Geef de vergelijking van de raaklijn in $P$.', `y = ${S.lin(m, F(y0).min(m.maal(x0)))}`, { raak: [x0, y0] })],
        hints: [IMPL_HINT, L`Vul $x = ${x0}$ en $y = ${y0}$ in in $\frac{dy}{dx}$.`, L`$t \leftrightarrow y - y_1 = m(x - x_1)$.`],
        stappen: [L`$[[${tel}]] + ([[${noem}]])\dfrac{dy}{dx} = 0$`, L`$\dfrac{dy}{dx} = [[${dydx}]]$`, L`In $P(${x0}, ${y0})$: $\dfrac{dy}{dx} = -\dfrac{${Fx}}{${Fy}} = ${m.tex()}$`, L`!$t \leftrightarrow ${raakVgl(String(y0), m.txt(), String(x0))}$`],
    };
} });

regGen({ id: 'im_HR', cat: 'impl', niveau: 3, titel: 'Horizontale raaklijnen aan een kromme', maak(r) {
    if (r.bool(0.3)) {
        return {
            opgave: L`Stel exacte vergelijkingen op van de horizontale raaklijnen aan de kromme $k$ met vergelijking $$y^3 = 4(y - x^2 - xy)$$`,
            delen: [D.rechten('Geef alle horizontale raaklijnen (gescheiden door ;).', ['y = 0', 'y = (1 - sqrt(17))/2', 'y = (1 + sqrt(17))/2'], { punten: 3, soort: 'ontbreekt' })],
            hints: [IMPL_HINT, L`Horizontale raaklijn: $\frac{dy}{dx} = 0$, dus de teller is $0$: $-8x - 4y = 0 \Leftrightarrow y = -2x$.`, 'Vul $y = -2x$ in in de vergelijking van $k$.'],
            stappen: [L`$3y^2\dfrac{dy}{dx} = 4\left(\dfrac{dy}{dx} - 2x - y - x\dfrac{dy}{dx}\right) \Leftrightarrow \dfrac{dy}{dx} = \dfrac{-8x - 4y}{3y^2 - 4 + 4x}$`, L`$\dfrac{dy}{dx} = 0 \Leftrightarrow y = -2x$`, L`$(-2x)^3 = 4(-2x - x^2 + 2x^2) \Leftrightarrow -8x^3 - 4x^2 + 8x = 0 \Leftrightarrow -4x(2x^2 + x - 2) = 0$`, L`$x = 0$ of $x = \frac{-1 \pm \sqrt{17}}{4}$, dus $y = 0$ of $y = \frac{1 \mp \sqrt{17}}{2}$`, L`!$y = 0$, $y = \frac{1 - \sqrt{17}}{2}$ en $y = \frac{1 + \sqrt{17}}{2}$`],
        };
    }
    let A, B, C, Dd, y1, y2, E, G, x1, x2;
    for (let poging = 0; poging < 200; poging++) {
        A = 1; B = r.pick([2, -2, 4]); C = r.pick([1, 2, 3, -1]); Dd = 2 * r.int(-2, 2);
        [y1, y2] = r.kies([-3, -2, -1, 1, 2, 3], 2);
        x1 = -(B * y1 + Dd) / (2 * A); x2 = -(B * y2 + Dd) / (2 * A);
        if (C * 4 * A === B * B) continue;
        const Q = (x, y) => A * x * x + B * x * y + C * y * y + Dd * x;
        const e = -(Q(x1, y1) - Q(x2, y2)) / (y1 - y2);
        if (!Number.isInteger(e) || Math.abs(e) > 20) continue;
        E = e; G = -(Q(x1, y1) + E * y1);
        if (B * x1 + 2 * C * y1 + E === 0 || B * x2 + 2 * C * y2 + E === 0) continue;
        break;
    }
    zeker(E !== undefined && Number.isInteger(E), 'kromme met twee horizontale raaklijnen');
    const lhs = S.som([S.cf(A, 'x^2'), S.cf(B, 'xy'), S.cf(C, 'y^2'), S.cf(Dd, 'x'), S.cf(E, 'y')]);
    const tel = S.som([S.cf(2 * A, 'x'), S.cf(B, 'y'), String(Dd)]);
    return {
        opgave: L`Bepaal de punten van de kromme $k$ met vergelijking $$${tx(lhs)} = ${-G}$$ waarin de raaklijn horizontaal is.`,
        delen: [D.punten('Geef alle punten met een horizontale raaklijn.', [[x1, y1], [x2, y2]], { punten: 3, soort: 'impliciet' })],
        hints: [IMPL_HINT, L`Horizontale raaklijn: $\frac{dy}{dx} = 0$, dus de teller $[[${tel}]] = 0$.`, L`Druk $x$ uit in $y$ (of omgekeerd) en vul in in de vergelijking van $k$.`],
        stappen: [L`$\dfrac{dy}{dx} = -\dfrac{[[${tel}]]}{[[${S.som([S.cf(B, 'x'), S.cf(2 * C, 'y'), String(E)])}]]}$`, L`$\dfrac{dy}{dx} = 0 \Leftrightarrow [[${tel}]] = 0 \Leftrightarrow x = [[${S.lin(F(-B, 2 * A), F(-Dd, 2 * A), 'y')}]]$`, L`Invullen in de vergelijking van $k$ geeft een vierkantsvergelijking in $y$ met oplossingen $y = ${y1}$ en $y = ${y2}$.`, L`!$(${x1}, ${y1})$ en $(${x2}, ${y2})$ (de noemer is daar niet $0$)`],
    };
} });

const PARAM = [
    r => { const a = r.int(2, 5), b = r.int(2, 5); return { x: `${a}cos(t)`, y: `${b}sin(t)`, dx: `-${a}sin(t)`, dy: `${b}cos(t)`, d: `-${b}cos(t)/(${a}sin(t))` }; },

    r => { const c = r.int(1, 5); return { x: 't^2', y: S.som(['t^3', S.cf(-c, 't')]), dx: '2t', dy: `3t^2 - ${c}`, d: `(3t^2 - ${c})/(2t)` }; },
    () => ({ x: 'e^t', y: 'e^(2t) - t', dx: 'e^t', dy: '2e^(2t) - 1', d: '(2e^(2t) - 1)/e^t' }),

    r => { const [a, b] = r.kies([1, 2, 3, 4], 2); return { x: `sin(${S.cf(a, 't')})`, y: `sin(${S.cf(b, 't')})`, dx: S.cf(a, `cos(${S.cf(a, 't')})`), dy: S.cf(b, `cos(${S.cf(b, 't')})`), d: `${b}cos(${S.cf(b, 't')})/(${a}cos(${S.cf(a, 't')}))` }; },

];
const PARAM_HINT = L`$\dfrac{dy}{dx} = \dfrac{\;\frac{dy}{dt}\;}{\frac{dx}{dt}}$ (als $\frac{dx}{dt} \neq 0$).`;
regGen({ id: 'pa_afgeleide', cat: 'impl', niveau: 1, titel: 'Afgeleide van een parameterkromme', maak(r) {

regGen({ id: 'pa_raaklijn', cat: 'impl', niveau: 2, titel: 'Raaklijn aan een parameterkromme', maak(r) {

            delen: [D.getallen('Voor welke waarden van $t$ ligt de kromme in $P$?', [k, -k], { label: 't =' }), D.rechten('Geef de vergelijkingen van de twee raaklijnen in $P$ (gescheiden door ;).', [`y = ${k}x - ${k * c}`, `y = -${k}x + ${k * c}`].map(s => s.replace(' 1x', ' x').replace('-1x', '-x')), { punten: 2, soort: 'param' })],
            hints: [L`$t^2 = ${c}$ en $${tx(S.som(['t^3', S.cf(-c, 't')]))} = 0$.`, PARAM_HINT, L`$\frac{dy}{dx} = \frac{3t^2 - ${c}}{2t}$; bereken die voor elke $t$.`],
            stappen: [L`$t^2 = ${c} \Leftrightarrow t = \pm ${k}$ en dan is ook $t(t^2 - ${c}) = 0$.`, L`$\dfrac{dy}{dx} = \dfrac{3t^2 - ${c}}{2t}$: voor $t = ${k}$ is dat $${k}$, voor $t = -${k}$ is dat $-${k}$.`, L`!$y = ${k}(x - ${c})$ en $y = -${k}(x - ${c})$`.replace(/= 1\(/, '= (').replace('-1(', '-(')],
        };

        t0T = String(t0); P = [t0 * t0, t0 ** 3 - c * t0]; m = F(3 * t0 * t0 - c, 2 * t0);

        const maal = (k, s) => s === '1/2' ? F(k, 2).txt() : k % 2 === 0 ? S.cf(k / 2, s.replace('/2', '')) : `${k}${s.replace('/2', '')}/2`;
        xs = `${a}cos(t)`; ys = `${b}sin(t)`; d = `-${b}cos(t)/(${a}sin(t))`; t0T = tt; P = [maal(a, cs), maal(b, sn)]; m = mm;
    } else if (t === 2) {
        xs = 't sin(t)'; ys = 't cos(t)'; d = '(cos(t) - t sin(t))/(sin(t) + t cos(t))'; metT = true;
        if (r.bool()) { t0T = 'pi'; P = [0, '-pi']; m = '1/pi'; } else { t0T = 'pi/2'; P = ['pi/2', 0]; m = '-2/pi'; }

        xs = 'sin(2t)'; ys = 'sin(3t)'; d = '3cos(3t)/(2cos(2t))'; t0T = 'pi/3'; P = ['sqrt(3)/2', 0]; m = '3';

    const vglT = raakVgl(String(P[1]), mS, String(P[0]));

regGen({ id: 'pa_HRVR', cat: 'impl', niveau: 2, titel: 'Horizontale en verticale raaklijnen, uiterste punten', maak(r) {

            opgave: L`Gegeven is de kromme ${kromT(`${a}cos(t)`, `${b}sin(2t)`, L`[0, 2\pi[`)}`,

            delen: [D.punten('Bepaal de punten met een horizontale raaklijn.', [[k * k, -2 * k ** 3], [k * k, 2 * k ** 3]], { punten: 2, soort: 'param' }), D.punten('Bepaal de punten met een verticale raaklijn.', [[0, 0]], { soort: 'param' })],
            hints: [L`$\frac{dy}{dt} = 3t^2 - ${c} = 0$.`, L`$\frac{dx}{dt} = 2t = 0$.`],
            stappen: [L`$3t^2 - ${c} = 0 \Leftrightarrow t = \pm ${k}$: $(${k * k}, ${-2 * k ** 3})$ en $(${k * k}, ${2 * k ** 3})$`, L`$2t = 0 \Leftrightarrow t = 0$: $(0, 0)$`, L`!H.R. in $(${k * k}, \pm ${2 * k ** 3})$, V.R. in $(0, 0)$`],
        };
    }
    if (t === 2) {
        let p, q, s; do { p = r.int(1, 3); q = r.int(1, 3); s = r.int(2, 4); } while (p === 2 && q === 2 && s === 3); // niet de SO 6-kromme
        return {
            opgave: L`Gegeven is de kromme ${kromT(`${p} + ${q}sin(t/2)`, `${s}sin(2t)`, L`[0, 4\pi]`)} Bepaal algebraïsch (zonder grafiek) de meest linkse en de meest rechtse punten.`,
            delen: [D.punt('Het meest rechtse punt:', 'R', [p + q, 0], { soort: 'extremum' }), D.punt('Het meest linkse punt:', 'L', [p - q, 0], { soort: 'extremum' })],
            hints: [L`Meest links/rechts: $x(t)$ is minimaal/maximaal, dus $x'(t) = \frac{${q}}{2}\cos\frac t2 = 0$.`, L`In $[0, 4\pi]$: $\frac t2 = \frac{\pi}{2}$ of $\frac t2 = \frac{3\pi}{2}$.`],
            stappen: [L`$x'(t) = \frac{${q}}{2}\cos\frac t2 = 0 \Leftrightarrow t = \pi \vee t = 3\pi$`, L`$t = \pi$: $x = ${p + q}$, $y = ${s}\sin 2\pi = 0$ (maximum van $x$); $t = 3\pi$: $x = ${p - q}$, $y = 0$ (minimum)`, L`!rechts $(${p + q}, 0)$, links $(${p - q}, 0)$`],
        };

    return {
        opgave: L`Gegeven is de kromme ${kromT('cos(2t) + 2sin(t)', 'cos(t)', L`[0, 2\pi]`)} Bepaal de coördinaten van de meest rechtse punten.`,

        h = [L`Leid $pV = c$ af naar $t$ met de productregel.`, L`$\frac{dp}{dt}V + p\frac{dV}{dt} = 0$`]; st = [L`$\dfrac{dp}{dt}V + p\dfrac{dV}{dt} = 0 \Rightarrow \dfrac{dV}{dt} = -\dfrac{V}{p}\dfrac{dp}{dt} = -\dfrac{${V0} \cdot ${s}}{${p0}}$`, 'Het volume neemt dus af (negatieve snelheid).']; }
    else if (t === 3) { const [Ll, x0, y0] = r.pick([[5, 3, 4], [10, 6, 8], [13, 5, 12]]), v = r.pick([1, 2, 0.5]); opg = L`Een ladder van $${Ll}$ m staat tegen een muur. De onderkant schuift weg van de muur met $${String(v).replace('.', '{,}')}$ m/s.`; vr = L`Met welke snelheid (in m/s) zakt de bovenkant op het moment dat de onderkant $${x0}$ m van de muur staat? (Geef $\frac{dy}{dt}$, dus negatief.)`; juist = String(-x0 * v / y0); lab = L`\frac{dy}{dt} =`; exact = true;
        h = [L`$x^2 + y^2 = ${Ll * Ll}$; leid af naar $t$.`, L`$2x\frac{dx}{dt} + 2y\frac{dy}{dt} = 0$ en $y = ${y0}$ als $x = ${x0}$.`]; st = [L`$\dfrac{dy}{dt} = -\dfrac{x}{y}\dfrac{dx}{dt} = -\dfrac{${x0}}{${y0}} \cdot ${String(v).replace('.', '{,}')}$`]; }

        h = [L`$s^2 = x^2 + ${hh * hh}$; leid af naar $t$.`, L`$x = \sqrt{${s * s} - ${hh * hh}}$ op dat moment.`]; st = [L`$2s\dfrac{ds}{dt} = 2x\dfrac{dx}{dt} \Rightarrow \dfrac{ds}{dt} = \dfrac{x}{s} \cdot ${v} = \dfrac{\sqrt{${s * s - hh * hh}}}{${s}} \cdot ${v}$`]; }

<script>
const fmtD = (v, d = 2) => String(+v.toFixed(d)).replace('.', '{,}');
regGen({ id: 'dv_groei', cat: 'dv', niveau: 1, titel: "Groei en verval: f' = k·f", maak(r) {
    const verval = r.bool(0.65);
    if (verval) {
        const [naam, k, eenh] = r.pick([['lood-214', 0.0259, 'min'], ['radon-222', 0.181, 'dagen'], ['jodium-131', 0.0862, 'dagen'], ['cesium-137', 0.0231, 'jaar'], ['radium-228', 0.121, 'jaar']]);
        const m0 = r.pick([20, 50, 80, 100, 250]), p = r.pick([10, 20, 25, 5]), t1 = r.pick([2, 5, 10, 20]);
        const kand = [
            { vast: true, d: D.uitdr(L`Geef het voorschrift van $m(t)$ als $m(0) = ${m0}$ mg.`, 'm(t) =', `${m0}e^(-${k}t)`, { vars: ['t'], dom: [0, 10], soort: 'dv', fouten: [{ w: `${m0}e^(${k}t)`, soort: 'dv', msg: 'Bij verval is $k$ negatief: $m(t) = b \\cdot e^{-' + String(k).replace('.', '{,}') + 't}$.' }] }) },
            { d: D.getal(L`Bereken de halveringstijd (in ${eenh}, op 2 decimalen).`, `ln(2)/${k}`, { label: 'T \\approx', benadering: true, soort: 'dv' }) },
            { d: D.getal(L`Na hoeveel ${eenh} is er nog maar ${p}% over? (op 2 decimalen)`, `ln(${100 / p})/${k}`, { label: 't \\approx', benadering: true, soort: 'dv' }) },
            { d: D.getal(L`Hoeveel mg is er nog over na ${t1} ${eenh}? (op 2 decimalen)`, `${m0}e^(-${k * t1})`, { label: L`m(${t1}) \approx`, benadering: true, soort: 'dv' }) },
            { d: D.getal(L`Bereken de vervalsnelheid $m'(${t1})$ (in mg per ${eenh.replace(/en$/, '')}, op 2 decimalen).`, `-${k}*${m0}e^(-${k * t1})`, { label: L`m'(${t1}) \approx`, benadering: true, soort: 'dv' }) },
        ];
        return {
            opgave: L`Het verval van ${naam} verloopt volgens de differentiaalvergelijking $$\frac{dm}{dt} = -${String(k).replace('.', '{,}')}\,m$$ met $t$ de tijd in ${eenh} en $m$ de massa in mg.`,

<script>
const KADER = t => `<div class="formule-kader">${t}</div>`;
const THEORIE = {
    explog: [
        { titel: 'De kettingregel', gens: ['el_ketting1', 'el_ketting2'], html:
            L`<p>Een samengestelde functie $(f \circ g)(x) = f(g(x))$ lees je als "$f$ na $g$": eerst $g$, dan $f$. Bijvoorbeeld met $f(x) = \sin x$ en $g(x) = 3x$ is $(f \circ g)(x) = \sin(3x)$ en $(g \circ f)(x) = 3\sin x$.</p>`
            + KADER(L`Kettingregel: $\quad D(f \circ g)(x) = D\left[f(g(x))\right] = f'(g(x)) \cdot g'(x)$`)
            + L`<p>Werkwijze: noem de binnenste functie $u$, leid de buitenste functie af (met $u$ erin) en vermenigvuldig met $u'$. Voorbeeld: $D\left(2x^4 - 3x + 5\right)^4 = 4\left(2x^4 - 3x + 5\right)^3 \cdot (8x^3 - 3)$.</p>` },
        { titel: 'Afgeleide van een inverse functie', gens: ['el_inverse', 'el_inverse_punt', 'go_inverse'], html:
            L`<p>Als een inverteerbare functie $f$ afleidbaar is in $a$ en $f'(a) \neq 0$, dan is $f^{-1}$ afleidbaar in $f(a)$. (De grafiek van $f^{-1}$ is het spiegelbeeld van de grafiek van $f$ om $y = x$.)</p>`
            + L`<p>Afleiding: $f\left(f^{-1}(x)\right) = x$. Leid links en rechts af met de kettingregel: $f'\left(f^{-1}(x)\right) \cdot Df^{-1}(x) = 1$.</p>`
            + KADER(L`$Df^{-1}(x) = \dfrac{1}{Df\left(f^{-1}(x)\right)}$`)
            + L`<p>Voorbeeld: $f(x) = x^3$, $f^{-1}(x) = \sqrt[3]{x}$: $Df^{-1}(x) = \frac{1}{3\left(\sqrt[3]{x}\right)^2} = \frac{1}{3\sqrt[3]{x^2}}$. Dat klopt met $D\,x^{\frac13} = \frac13 x^{-\frac23}$.</p><p>Opgelet: is $f'(a) = 0$ (horizontale raaklijn), dan heeft $f^{-1}$ in $f(a)$ een verticale raaklijn en is $f^{-1}$ daar niet afleidbaar.</p>` },
        { titel: 'Herhaling: exponentiële functies en logaritmen', gens: ['el_rekenregels', 'el_vgl1', 'el_vgl2'], html:
            L`<p>Voor $a \in \mathbb{R}_0^+ \setminus \{1\}$ is $f(x) = a^x$ de exponentiële functie met grondtal $a$ (stijgend als $a > 1$, dalend als $0 < a < 1$) en $f(x) = \log_a x$ de logaritmische functie: de inverse functie.</p>`
            + KADER(L`$\log_a x = y \Leftrightarrow x = a^y \qquad \log_a a^y = y \qquad a^{\log_a x} = x$`)
            + L`<table class="th-tabel"><tr><td>$\log_a(x_1 x_2) = \log_a x_1 + \log_a x_2$</td><td>$\log_a \frac{x_1}{x_2} = \log_a x_1 - \log_a x_2$</td></tr><tr><td>$\log_a x^n = n \log_a x$</td><td>$\log_b x = \dfrac{\log_a x}{\log_a b}$ en $\log_b a = \dfrac{1}{\log_a b}$</td></tr></table>`
            + L`<p>Het getal $e = \lim\limits_{h \to 0}(1 + h)^{\frac1h} \approx 2{,}718281828$ is het enige grondtal waarvoor de afgeleide van $a^x$ de functie zelf is. De natuurlijke logaritme is $\ln x = \log_e x$: $e^{\ln x} = x$ en $\ln e^y = y$.</p>` },
        { titel: 'Afgeleiden van exponentiële en logaritmische functies', gens: ['el_exp1', 'el_exp2', 'el_log1', 'el_log2'], html:
            L`<table class="th-tabel"><tr><th>exponentieel</th><th>logaritmisch</th></tr><tr><td>$D(e^x) = e^x$</td><td>$D(\ln|x|) = \dfrac1x$</td></tr><tr><td>$D\left(e^{f(x)}\right) = e^{f(x)} \cdot f'(x)$</td><td>$D(\ln|f(x)|) = \dfrac{f'(x)}{f(x)}$</td></tr><tr><td>$D(a^x) = a^x \ln a$</td><td>$D(\log_a x) = \dfrac{1}{x \ln a}$</td></tr><tr><td>$D\left(a^{f(x)}\right) = a^{f(x)} \ln a \cdot f'(x)$</td><td>$D(\log_a f(x)) = \dfrac{f'(x)}{f(x) \ln a}$</td></tr></table>`
            + L`<p>Bewijs van $D(a^x)$: $a^x = e^{\ln a^x} = e^{x \ln a}$, dus $D(a^x) = e^{x\ln a} \cdot \ln a = a^x \ln a$. Bewijs van $D(\ln x)$: uit $y = \ln x \Leftrightarrow e^y = x$ volgt $e^y \cdot y' = 1$, dus $y' = \frac{1}{e^y} = \frac1x$.</p>`
            + L`<p>Handige formule: $D\ln\left|x + \sqrt{x^2 + k}\right| = \dfrac{1}{\sqrt{x^2 + k}}$.</p>` },
        { titel: 'Functie tot een functiemacht', gens: ['el_functiemacht', 'el_extra'], html:
            L`<p>Hangen grondtal én exponent af van $x$, dan mag je noch de machtsregel noch de regel voor $a^x$ gebruiken.</p>` + KADER(L`$f(x)^{g(x)} = e^{\ln f(x)^{g(x)}} = e^{g(x) \ln f(x)}$`)
            + L`<p>Voorbeeld: $x^{\ln x} = e^{\ln x \cdot \ln x} = e^{\ln^2 x}$, dus $D\left(x^{\ln x}\right) = e^{\ln^2 x} \cdot \frac{2\ln x}{x} = \frac{2\ln x \cdot x^{\ln x}}{x}$.</p>` },
        { titel: 'Raaklijn aan een grafiek', gens: ['el_raaklijn'], html: KADER(L`Raaklijn in het punt met $x = a$: $\quad t \leftrightarrow y - f(a) = f'(a)(x - a)$`) + '<p>De richtingscoëfficiënt van de raaklijn is $f\'(a)$; de raaklijn gaat door het raakpunt $(a, f(a))$.</p>' },
    ],
    hopital: [
        { titel: 'Basislimieten van exponentiële en logaritmische functies', gens: [], html:
            L`<table class="th-tabel"><tr><th></th><th>$0 < a < 1$ (dalend)</th><th>$a > 1$ (stijgend)</th></tr><tr><td>$a^x$ (H.A. $y = 0$)</td><td>$\lim\limits_{x \to -\infty} a^x = +\infty$, $\lim\limits_{x \to +\infty} a^x = 0$</td><td>$\lim\limits_{x \to -\infty} a^x = 0$, $\lim\limits_{x \to +\infty} a^x = +\infty$</td></tr><tr><td>$\log_a x$ (V.A. $x = 0$)</td><td>$\lim\limits_{x \to 0^+} \log_a x = +\infty$, $\lim\limits_{x \to +\infty} \log_a x = -\infty$</td><td>$\lim\limits_{x \to 0^+} \log_a x = -\infty$, $\lim\limits_{x \to +\infty} \log_a x = +\infty$</td></tr></table><p>Dat geldt ook voor $e^x$ en $\ln x$ (grondtal $e > 1$).</p>` },
        { titel: "Eerste regel van de l'Hôpital: $\\frac00$", gens: ['hop_00', 'hop_00_2', 'hop_inzicht'], html:
            KADER(L`Als $f(a) = g(a) = 0$, $f$ en $g$ afleidbaar zijn en $g'(x) \neq 0$ in de buurt van $a$, dan is $\quad\lim\limits_{x \to a} \dfrac{f(x)}{g(x)} ${H00} \lim\limits_{x \to a} \dfrac{f'(x)}{g'(x)}$`)
            + L`<p>Voorbeeld: $\lim\limits_{x \to 0} \dfrac{e^x - 1}{3x} ${H00} \lim\limits_{x \to 0} \dfrac{e^x}{3} = \dfrac13$.</p><p><b>Opgelet:</b> leid teller en noemer <b>apart</b> af (geen quotiëntregel!) en controleer telkens eerst of je echt $\frac00$ of $\frac{\infty}{\infty}$ hebt. Soms moet je de regel meerdere keren toepassen.</p>` },
        { titel: "Tweede regel van de l'Hôpital: $\\frac{\\infty}{\\infty}$", gens: ['hop_oo'], html:
            KADER(L`Als $\lim \dfrac{f(x)}{g(x)}$ de vorm $\dfrac{\infty}{\infty}$ heeft (ook voor $x \to \pm\infty$), dan is $\quad\lim \dfrac{f(x)}{g(x)} ${HOO} \lim \dfrac{f'(x)}{g'(x)}$`)
            + L`<p>Groeisnelheden voor $x \to +\infty$: $e^x$ groeit sneller dan elke macht $x^n$, en $x^n$ sneller dan $\ln x$. Dus $\lim\limits_{x \to +\infty} \frac{x^n}{e^x} = 0$ en $\lim\limits_{x \to +\infty} \frac{\ln x}{x^n} = 0$.</p>` },
        { titel: 'Andere onbepaaldheden: $\\infty - \\infty$ en $0 \\cdot \\infty$', gens: ['hop_verschil', 'hop_nulmaal'], html:
            L`<ul><li>$\infty - \infty$: schrijf het verschil als één breuk, bv. $\frac1a - \frac1b = \frac{b - a}{ab}$. Dan krijg je meestal $\frac00$.</li><li>$0 \cdot \infty$: schrijf het product als een breuk, $f \cdot g = \dfrac{f}{\frac1g}$ of $\dfrac{g}{\frac1f}$.</li></ul>`
            + L`<p>Voorbeeld: $\lim\limits_{x \to 0^+} x \ln x = \lim\limits_{x \to 0^+} \dfrac{\ln x}{\frac1x} ${HOO} \lim\limits_{x \to 0^+} \dfrac{\frac1x}{-\frac{1}{x^2}} = \lim\limits_{x \to 0^+} (-x) = 0$.</p>` },
        { titel: 'Onbepaaldheden $1^\\infty$, $0^0$ en $\\infty^0$', gens: ['hop_macht1', 'hop_macht2', 'hop_param'], html:
            KADER(L`$f(x)^{g(x)} = e^{g(x) \ln f(x)} \qquad\Rightarrow\qquad \lim f(x)^{g(x)} = e^{\lim g(x) \ln f(x)}$`)
            + L`<p>Bereken eerst de limiet $L$ van de exponent $g \ln f$ (meestal $0 \cdot \infty$); het antwoord is $e^L$. Voorbeeld: $\lim\limits_{x \to +\infty}\left(1 + \frac3x\right)^x = e^{\lim x \ln\left(1 + \frac3x\right)} = e^{3}$.</p><p>$0^0$ wordt vaak per definitie gelijkgesteld aan $1$, maar bij limieten is het een onbepaaldheid.</p>` },
    ],
    verloopexp: [
        { titel: 'Stappenplan van een functieonderzoek', gens: ['ve_basis', 've_lnquot', 've_expquot'], html:
            L`<ol><li><b>Domein</b>: noemer $\neq 0$, argument van $\ln > 0$, onder een wortel $\geq 0$.</li><li><b>Tekenverloop</b> en <b>snijpunten met de assen</b>: nulwaarden van teller ($T$) en noemer ($N$) in een tekentabel.</li><li><b>V.A.</b> $x = a$ als $\lim\limits_{x \to a} f(x) = \pm\infty$ (bereken linker- en rechterlimiet).</li><li><b>H.A.</b> $y = b$ als $\lim\limits_{x \to \pm\infty} f(x) = b$.</li><li><b>S.A.</b> $y = ax + b$ met $a = \lim\limits_{x \to \pm\infty} \frac{f(x)}{x} \in \mathbb{R}_0$ en $b = \lim\limits_{x \to \pm\infty}\left(f(x) - ax\right)$.</li><li><b>$f'$</b>: tekentabel, stijgen/dalen, extrema (bereken de functiewaarde).</li><li><b>$f''$</b>: hol ($\cup$, $f'' > 0$) en bol ($\cap$, $f'' < 0$), buigpunten waar $f''$ van teken wisselt, buigraaklijn $y - f(a) = f'(a)(x - a)$.</li></ol>` },
        { titel: 'Limieten en asymptoten bij exp en log', gens: ['ve_3ln', 've_e1x', 've_ln_eax'], html:
            L`<ul><li>$e^{-\infty} = \frac{1}{e^{+\infty}} = 0$, $e^{+\infty} = +\infty$, $\ln(0^+) = -\infty$, $\ln(+\infty) = +\infty$.</li><li>Schrijf een limiet als het product van twee limieten als dat helpt: $\lim\limits_{x \to -1^+} \frac{1 + \ln(1 + x)}{x + 1} = \lim\left(1 + \ln(1 + x)\right) \cdot \lim \frac{1}{x + 1} = (-\infty)(+\infty) = -\infty$.</li><li>Bij $\infty \cdot 0$ of $\frac{\infty}{\infty}$: gebruik l'Hôpital.</li><li>$\ln(e^x + 1) - x = \ln\frac{e^x + 1}{e^x} \to \ln 1 = 0$ voor $x \to +\infty$.</li><li>Geperforeerd punt: een linker- of rechterlimiet die eindig is in een punt dat niet tot het domein behoort.</li></ul>` },
        { titel: 'Extrema en buigpunten', gens: ['ve_xexp', 've_lnx2'], html:
            L`<p>Extremum: $f'$ wisselt van teken ($+ \to -$: maximum, $- \to +$: minimum). Buigpunt: $f''$ wisselt van teken. Een nulwaarde van $f'$ waar $f'$ niet van teken wisselt, is een buigpunt met horizontale raaklijn.</p><p>Voorbeeld: $f(x) = \frac{\ln x}{x}$: $f'(x) = \frac{1 - \ln x}{x^2}$ (maximum $\left(e, \frac1e\right)$) en $f''(x) = \frac{2\ln x - 3}{x^3}$ (buigpunt in $x = \sqrt{e^3}$).</p>` },
        { titel: 'Parameters bepalen', gens: ['ve_buigpar', 've_parasym'], html:
            L`<ul><li>Buigpunt in $x = a$: $f''(a) = 0$ (en $f''$ wisselt daar van teken).</li><li>Buigpunt met horizontale raaklijn: $f'$ heeft een dubbele nulwaarde (discriminant $= 0$).</li><li>Gegeven asymptoten: schrijf de definitie van de asymptoot uit met de parameters en los op.</li></ul>` },
    ],
    gonio: [
        { titel: 'Herhaling: periode en goniometrische vergelijkingen', gens: ['go_periode', 'go_vgl'], html:
            L`<p>$f(x) = a\sin(b(x - c)) + d$ heeft periode $p = \frac{2\pi}{|b|}$; ook $\cos(bx)$ heeft periode $\frac{2\pi}{|b|}$, terwijl $\tan(bx)$ en $\cot(bx)$ periode $\frac{\pi}{|b|}$ hebben. De periode van een som is het kgv van de perioden: $\sin 2x + \sin 3x$ heeft periode $\text{kgv}\left(\pi, \frac{2\pi}{3}\right) = 2\pi$.</p>`
            + KADER(L`$\sin x = \sin\alpha \Leftrightarrow x = \alpha + k2\pi \vee x = \pi - \alpha + k2\pi \qquad \cos x = \cos\alpha \Leftrightarrow x = \pm\alpha + k2\pi \qquad \tan x = \tan\alpha \Leftrightarrow x = \alpha + k\pi$`) },
        { titel: 'Formularium (de belangrijkste formules)', gens: [], html:
            L`<table class="th-tabel"><tr><th></th><th>$0$</th><th>$\frac{\pi}{6}$</th><th>$\frac{\pi}{4}$</th><th>$\frac{\pi}{3}$</th><th>$\frac{\pi}{2}$</th></tr><tr><td>$\sin$</td><td>$0$</td><td>$\frac12$</td><td>$\frac{\sqrt2}{2}$</td><td>$\frac{\sqrt3}{2}$</td><td>$1$</td></tr><tr><td>$\cos$</td><td>$1$</td><td>$\frac{\sqrt3}{2}$</td><td>$\frac{\sqrt2}{2}$</td><td>$\frac12$</td><td>$0$</td></tr><tr><td>$\tan$</td><td>$0$</td><td>$\frac{\sqrt3}{3}$</td><td>$1$</td><td>$\sqrt3$</td><td>/</td></tr></table>`
            + KADER(L`$\sin^2\alpha + \cos^2\alpha = 1 \qquad \sin 2\alpha = 2\sin\alpha\cos\alpha \qquad \cos 2\alpha = \cos^2\alpha - \sin^2\alpha = 2\cos^2\alpha - 1 = 1 - 2\sin^2\alpha$`)
            + L`<p>$1 + \tan^2\alpha = \frac{1}{\cos^2\alpha}$; Carnot: $\cos^2\alpha = \frac{1 + \cos 2\alpha}{2}$, $\sin^2\alpha = \frac{1 - \cos 2\alpha}{2}$; Simpson: $\sin\alpha - \sin\beta = 2\sin\frac{\alpha - \beta}{2}\cos\frac{\alpha + \beta}{2}$.</p>` },
        { titel: 'Limieten van goniometrische functies', gens: ['go_lim', 'go_lim_direct', 'go_insluiting'], html:
            KADER(L`$\lim\limits_{x \to 0} \dfrac{\sin x}{x} = 1 \qquad \lim\limits_{mx \to 0} \dfrac{\sin mx}{mx} = 1 \qquad \lim\limits_{mx \to 0} \dfrac{\tan mx}{mx} = 1$`)
            + L`<p>Voorbeeld: $\lim\limits_{x \to 0} \dfrac{2x}{\sin 3x} = \dfrac{2}{3} \cdot \dfrac{1}{\lim\limits_{3x \to 0} \frac{\sin 3x}{3x}} = \dfrac23$.</p><p><b>Insluitingsstelling</b>: als $f(x) \leq g(x) \leq h(x)$ in de buurt van $a$ en $\lim f = \lim h = b$, dan is ook $\lim g = b$. Voorbeeld: $-x^2 \leq x^2\sin\frac{\pi}{x} \leq x^2$, dus $\lim\limits_{x \to 0} x^2\sin\frac{\pi}{x} = 0$.</p>` },
        { titel: 'Afgeleiden van goniometrische functies', gens: ['go_afg1', 'go_afg2', 'go_afg3', 'go_inverse'], html:
            KADER(L`$D(\sin x) = \cos x \qquad D(\cos x) = -\sin x \qquad D(\tan x) = \dfrac{1}{\cos^2 x} \qquad D(\cot x) = \dfrac{-1}{\sin^2 x}$`)
            + L`<p>Met de kettingregel: $D\sin u = u'\cos u$, $D\cos u = -u'\sin u$, $D\tan u = \frac{u'}{\cos^2 u}$, $D\cot u = \frac{-u'}{\sin^2 u}$.</p><p>Bewijs van $D\sin x$: $\lim\limits_{x \to a}\dfrac{\sin x - \sin a}{x - a} = \lim\limits_{x \to a}\dfrac{2\sin\frac{x - a}{2}\cos\frac{x + a}{2}}{x - a} = 1 \cdot \cos a$. Uit $\tan x = \frac{\sin x}{\cos x}$ volgt met de quotiëntregel $D\tan x = \frac{\cos^2 x + \sin^2 x}{\cos^2 x} = \frac{1}{\cos^2 x}$.</p>` },
        { titel: 'Verloop van goniometrische functies', gens: ['go_extrema', 'go_raaklijn', 'go_optimalisatie'], html:
            L`<ol><li>Domein (bij $\tan$ en $\cot$!) en periode: kies een <b>onderzoeksinterval</b> van één periode $p$, dus $[0, p]$. Bv. $[0, 2\pi]$ voor $\sin 2x + 2\cos x$ (periode $2\pi$), maar $[0, \pi]$ voor $\tan x + \cot x$ (periode $\pi$) en $\left[0, \frac{2\pi}{3}\right]$ voor $\sin 3x$.</li><li>Nulwaarden: los goniometrische vergelijkingen op in het onderzoeksinterval (ontbind in factoren, gebruik $\sin 2x = 2\sin x\cos x$).</li><li>$f'$ en $f''$: tekentabellen, extrema, buigpunten (exacte coördinaten met de tabel van bekende hoeken).</li></ol><p>Optimalisatieproblemen: druk de grootheid uit in functie van een hoek, stel de afgeleide gelijk aan $0$ en controleer met een tekentabel dat het een maximum (of minimum) is.</p>` },
    ],
    cyclo: [
        { titel: 'Definities van de cyclometrische functies', gens: ['cy_waarden'], html:
            L`<table class="th-tabel"><tr><th>functie</th><th>definitie</th><th>domein</th><th>bereik</th></tr><tr><td>$\operatorname{Bgsin}$</td><td>$y = \operatorname{Bgsin} x \Leftrightarrow x = \sin y$</td><td>$[-1, 1]$</td><td>$\left[-\frac{\pi}{2}, \frac{\pi}{2}\right]$</td></tr><tr><td>$\operatorname{Bgcos}$</td><td>$y = \operatorname{Bgcos} x \Leftrightarrow x = \cos y$</td><td>$[-1, 1]$</td><td>$[0, \pi]$</td></tr><tr><td>$\operatorname{Bgtan}$</td><td>$y = \operatorname{Bgtan} x \Leftrightarrow x = \tan y$</td><td>$\mathbb{R}$</td><td>$\left]-\frac{\pi}{2}, \frac{\pi}{2}\right[$</td></tr><tr><td>$\operatorname{Bgcot}$</td><td>$y = \operatorname{Bgcot} x \Leftrightarrow x = \cot y$</td><td>$\mathbb{R}$</td><td>$]0, \pi[$</td></tr></table>`
            + L`<p>Voorbeelden: $\operatorname{Bgsin}\left(-\frac12\right) = -\frac{\pi}{6}$, $\operatorname{Bgcos}\left(-\frac12\right) = \frac{2\pi}{3}$, $\operatorname{Bgtan}(-1) = -\frac{\pi}{4}$, $\operatorname{Bgcot}(-1) = \frac{3\pi}{4}$. In GeoGebra (waar Bgcot niet bestaat): $\operatorname{Bgcot} x = \frac{\pi}{2} - \operatorname{Bgtan} x$.</p><p>Opgelet: $\sin(\operatorname{Bgsin} x) = x$, maar $\operatorname{Bgsin}(\sin x) = x$ enkel als $x \in \left[-\frac{\pi}{2}, \frac{\pi}{2}\right]$; bv. $\operatorname{Bgsin}\left(\sin\frac{5\pi}{6}\right) = \frac{\pi}{6}$.</p>` },
        { titel: 'Afgeleiden van cyclometrische functies', gens: ['cy_afg1', 'cy_afg2', 'cy_afg3'], html:
            KADER(L`$D\operatorname{Bgsin} x = \dfrac{1}{\sqrt{1 - x^2}} \qquad D\operatorname{Bgcos} x = \dfrac{-1}{\sqrt{1 - x^2}} \qquad D\operatorname{Bgtan} x = \dfrac{1}{1 + x^2} \qquad D\operatorname{Bgcot} x = \dfrac{-1}{1 + x^2}$`)
            + L`<p>Bewijs: stel $y = \operatorname{Bgsin} x$, dan $\sin y = x$; afleiden geeft $\cos y \cdot \frac{dy}{dx} = 1$, dus $\frac{dy}{dx} = \frac{1}{\cos y} = \frac{1}{\sqrt{1 - x^2}}$ (met $+$ omdat $\cos y \geq 0$ voor $y \in \left[-\frac{\pi}{2}, \frac{\pi}{2}\right]$).</p><p>Met de kettingregel: $D\operatorname{Bgsin} u = \frac{u'}{\sqrt{1 - u^2}}$, $D\operatorname{Bgtan} u = \frac{u'}{1 + u^2}$, …</p>` },
        { titel: 'Domein van een cyclometrische functie', gens: ['cy_domein'], html:
            L`<p>Bij $\operatorname{Bgsin} f(x)$ en $\operatorname{Bgcos} f(x)$ moet $-1 \leq f(x) \leq 1$. Los de twee ongelijkheden apart op (tekentabel) en neem de doorsnede; houd daarna rekening met noemers en wortels.</p><p>Voorbeeld: $\operatorname{Bgcos}(x^2 - 8)$: $7 \leq x^2 \leq 9$, dus $\text{dom} = \left[-3, -\sqrt7\right] \cup \left[\sqrt7, 3\right]$.</p>` },
        { titel: 'Verloop van cyclometrische functies', gens: ['cy_verloop', 'cy_raaklijn', 'cy_kijkhoek'], html:
            L`<ul><li>$\lim\limits_{x \to \pm\infty}\operatorname{Bgtan} x = \pm\frac{\pi}{2}$: H.A. of een bijdrage aan een S.A.</li><li>Een <b>hoekpunt</b>: de linker- en rechterlimiet van $f'$ zijn verschillend. Let op: $\sqrt{x^2} = |x|$ (dus $-x$ voor $x < 0$).</li><li>Een verticale raaklijn waar $f'(x) \to \pm\infty$, bv. aan de rand van het domein van $\operatorname{Bgsin}$ of $\operatorname{Bgcos}$.</li></ul>` },
        { titel: "Limieten met de regel van de l'Hôpital", gens: ['cy_hop1', 'cy_hop2', 'cy_param'], html:
            L`<p>De regel van de l'Hôpital werkt ook met goniometrische en cyclometrische functies. Voorbeelden: $\lim\limits_{x \to 0}\dfrac{\tan x - x}{x^3} ${H00} \lim\dfrac{\frac{1}{\cos^2 x} - 1}{3x^2} = \lim\dfrac{\tan^2 x}{3x^2} = \dfrac13$ en $\lim\limits_{x \to 0}\left(\dfrac{1}{\sin x} - \dfrac{1}{\tan x}\right) = \lim\dfrac{1 - \cos x}{\sin x} ${H00} \lim\dfrac{\sin x}{\cos x} = 0$.</p><p>Parameters bepalen: vul eerst in. Is de teller $0$, dan moet de noemer ook $0$ worden (anders is de limiet $0$ of $\pm\infty$).</p>` },
    ],
    impl: [
        { titel: 'Impliciet afleiden', gens: ['im_dydx', 'im_raaklijn'], html:
            L`<p>Een kromme is soms gegeven door een vergelijking in $x$ en $y$ die je niet (eenvoudig) naar $y$ kunt oplossen. Je leidt dan beide leden af naar $x$, waarbij $y$ een functie van $x$ is.</p>`
            + KADER(L`$D(y^n) = n\,y^{n-1}\dfrac{dy}{dx} \qquad D(xy) = y + x\dfrac{dy}{dx} \qquad D(\sin y) = \cos y\,\dfrac{dy}{dx}$`)
            + L`<p>Voorbeeld: $x^2 + y^2 = 5 \Rightarrow 2x + 2y\frac{dy}{dx} = 0 \Rightarrow \frac{dy}{dx} = -\frac{x}{y}$; in $P(2, 1)$ is de helling $-2$. Raaklijn: $y - y_1 = m(x - x_1)$.</p>` },
        { titel: 'Horizontale en verticale raaklijnen', gens: ['im_HR'], html:
            L`<p>Is $\frac{dy}{dx} = \frac{T(x, y)}{N(x, y)}$, dan is de raaklijn horizontaal als $T = 0$ (en $N \neq 0$) en verticaal als $N = 0$ (en $T \neq 0$). Combineer die voorwaarde met de vergelijking van de kromme (stelsel) om de punten te vinden.</p>` },
        { titel: 'Parameterkrommen', gens: ['pa_afgeleide', 'pa_raaklijn', 'pa_HRVR'], html:
            L`<p>Als $t$ een parameter is, noemen we $x = f(t)$ en $y = g(t)$ parametervergelijkingen; de punten $P(f(t), g(t))$ vormen een parameterkromme (bv. een Lissajousfiguur $x = \sin 2t$, $y = \sin 3t$).</p>`
            + KADER(L`$\dfrac{dy}{dx} = \dfrac{\;\frac{dy}{dt}\;}{\frac{dx}{dt}} \quad \left(\tfrac{dx}{dt} \neq 0\right) \qquad$ horizontale raaklijn: $\dfrac{dy}{dt} = 0 \qquad$ verticale raaklijn: $\dfrac{dx}{dt} = 0$`)

        { titel: 'Parameter elimineren', gens: ['pa_expliciet'], html: L`<p>Soms kun je $t$ elimineren en een expliciet voorschrift $y = f(x)$ vinden, bv. $x = \cos t$, $y = \cos 4t - 1$: met $\cos 2\alpha = 2\cos^2\alpha - 1$ (twee keer) vind je $y = 8x^4 - 8x^2$ met $x \in [-1, 1]$.</p>` },
        { titel: 'Verwante snelheden', gens: ['im_snelheden'], html:
            L`<p>Hangen twee grootheden $x$ en $y$ samen en veranderen ze allebei in de tijd, dan vind je het verband tussen $\frac{dx}{dt}$ en $\frac{dy}{dt}$ door het verband tussen $x$ en $y$ af te leiden naar $t$. Voorbeeld (ballon): $V = \frac43\pi r^3 \Rightarrow \frac{dV}{dt} = 4\pi r^2\frac{dr}{dt}$. Vul de waarden van dat moment pas op het einde in.</p>` },
    ],
    dv: [
        { titel: 'Differentiaalvergelijkingen', gens: ['dv_oplossing'], html:
            L`<p>Een differentiaalvergelijking is een vergelijking waarin afgeleiden van een functie voorkomen. Een oplossing is een functie die aan de vergelijking voldoet: vul de functie en haar afgeleiden in en controleer (of bepaal zo de onbekende constanten).</p><p>Voorbeeld: $y = A\sin x + B\cos x$ is een oplossing van $y'' + y = 0$, want $y'' = -A\sin x - B\cos x = -y$.</p>` },
        { titel: "Groei en verval: $f' = k \\cdot f$", gens: ['dv_groei'], html:
            KADER(L`Stelling: als $f'(x) = k \cdot f(x)$, dan is $f(x) = b \cdot e^{kx}$ met $b = f(0)$ (beginwaarde).`)
            + L`<p>Bewijs: $\frac{f'(x)}{f(x)} = k \Leftrightarrow D\ln f(x) = D(kx + c) \Leftrightarrow \ln f(x) = kx + c' \Leftrightarrow f(x) = e^{c'} e^{kx}$.</p><p>$k > 0$: groei, verdubbelingstijd $\frac{\ln 2}{k}$. $k < 0$: verval, halveringstijd $\frac{\ln 2}{|k|}$ (los $e^{kt} = \frac12$ op).</p>` },
        { titel: 'Afkoelingswet van Newton', gens: ['dv_newton'], html:

        { titel: 'Kettinglijn en hyperbolische functies', gens: ['dv_kettinglijn', 'dv_hyperbolisch'], html:

function typhulpHtml() {

function werkPreviewBij(inp) {

        const vak = deel.querySelector('[data-prev="pt"]');

        catch (e) { vak.innerHTML = `<span class="lees-fout">${esc(e.leesfout ? e.message : 'Kan dit niet lezen.')}</span>`; }
        return;
    }
    const vak = deel.querySelector(`[data-prev="${inp.dataset.k}"]`);
    if (!vak) return;
    const s = inp.value, kind = inp.dataset.kind, lab = inp.dataset.label ? inp.dataset.label + ' ' : '';

        } else if (kind === 'getal') {
            const v = Ex.leesVoorbeeld(naGelijk(s), { vars: [], inf: true });
            if (v.fout) throw new LeesFout(v.fout);
            t = lab + Ex.tex(v.boom) + (v.bezig ? L`\;\ldots` : '');
        } else if (kind === 'lijst') t = lab + leesLijst(s).map(x => x.tex).join(L`\;;\; `);
        else if (kind === 'punten') t = leesPunten(s).map(p => puntTex('', p[0].tex, p[1].tex)).join(L`,\quad `);
        else if (kind === 'rechte') t = leesRechte(s).tex;

        else if (kind === 'interval') t = lab + verzTex(leesVerzameling(s));

}

function gewogenKeuze(r, lijst, gewicht) {
    const w = lijst.map(gewicht), som = w.reduce((a, b) => a + b, 0);
    let x = r.r() * som;
    for (let i = 0; i < lijst.length; i++) { x -= w[i]; if (x <= 0) return lijst[i]; }
    return lijst[lijst.length - 1];
}
function kiesToets(cats, totaal, niveau, seed) {
    const r = new Rnd(seed);
    const vragen = [], gebruikt = new Set(), perCat = {};
    let rest = totaal;
    const GEWICHT = { 1: 0.3, 2: 0.45, 3: 0.25 };
    for (let poging = 0; rest > 0 && poging < 3000; poging++) {
        let pool = GEN.filter(g => cats.includes(g.cat) && !gebruikt.has(g.id));
        if (niveau) { const p = pool.filter(g => g.niveau === niveau); if (p.length) pool = p; }
        if (!pool.length) { gebruikt.clear(); continue; }
        if (cats.length > 1) { const min = Math.min(...cats.map(c => perCat[c] || 0)); const p = pool.filter(g => (perCat[g.cat] || 0) === min); if (p.length) pool = p; }
        const g = gewogenKeuze(r, pool, x => niveau ? 1 : GEWICHT[x.niveau] / Math.max(1, pool.filter(y => y.niveau === x.niveau).length));
        let o;
        try { o = maakOefening(g, r.int(1, 2147483646)); } catch (e) { gebruikt.add(g.id); continue; }
        if (o.punten > rest) { gebruikt.add(g.id); continue; }
        vragen.push(o); rest -= o.punten; gebruikt.add(g.id);
        perCat[g.cat] = (perCat[g.cat] || 0) + 1;
    }
    vragen.sort((a, b) => CATS.findIndex(c => c.id === a.gen.cat) - CATS.findIndex(c => c.id === b.gen.cat) || a.gen.niveau - b.gen.niveau);
    return vragen;
}
function startToets() {
    const cats = ST.toetsCat === 'mix' ? CATS.map(c => c.id) : [ST.toetsCat];
    const vragen = kiesToets(cats, ST.toetsPunten, ST.toetsNiveau, nieuwZaad());
    const totaal = vragen.reduce((s, v) => s + v.punten, 0);
    ST.toets = { vragen, waarden: vragen.map(v => v.delen.map(() => ({}))), huidig: 0, cat: ST.toetsCat, totaal, niveau: ST.toetsNiveau, start: new Date(), klaar: false, toonUitw: true };
    ST.scherm = 'toets';
    render();
}

}

        <div class="voortgang"><div style="width:${Math.round((i + 1) / n * 100)}%"></div></div><div class="kaart-binnen">`;

const PDF_BREEDTE_PX = 700, PDF_BREEDTE_MM = 186, PDF_MARGE_MM = 12, PDF_NUTTIG_MM = 268;
async function downloadPdf(blokken, bestandsnaam, verbergUitw = false) {
    const status = document.getElementById('pdf-status');
    const knoppen = [...APP.querySelectorAll('[data-act="toetsrapport"],[data-act="oefenrapport"]')];
    const zet = t => { if (status) status.textContent = t; };
    if (!window.html2canvas || !window.jspdf) { zet('Het PDF-rapport kan niet gemaakt worden: de PDF-bibliotheek is niet geladen. Controleer je internetverbinding en herlaad de pagina.'); return; }
    if (verbergUitw) blokken = blokken.filter(b => !b.uitw);
    knoppen.forEach(k => { k.disabled = true; });
    const bron = document.getElementById('pdf-bron');
    try {
        zet('Rapport wordt gemaakt…');
        bron.className = 'pdf-bron rapport';
        bron.innerHTML = blokken.map((b, i) => `<div class="u" data-i="${i}">${b.html}</div>`).join('');
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        const eenheden = [...bron.children];
        const hoogtes = eenheden.map(u => u.getBoundingClientRect().height);
        const maxPx = Math.floor(PDF_NUTTIG_MM * PDF_BREEDTE_PX / PDF_BREEDTE_MM);
        const brokken = [];
        let huidig = [];
        eenheden.forEach((u, i) => { huidig.push(i); if (!blokken[i].vast) { brokken.push(huidig); huidig = []; } });
        if (huidig.length) brokken.push(huidig);
        const paginas = [];
        let pagina = [], h = 0;
        brokken.forEach(b => {
            const bh = b.reduce((s, i) => s + hoogtes[i], 0);
            if (pagina.length && h + bh > maxPx) { paginas.push(pagina); pagina = []; h = 0; }
            pagina.push(...b); h += bh;
        });
        if (pagina.length) paginas.push(pagina);
        const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
        for (let p = 0; p < paginas.length; p++) {
            zet(`Rapport wordt gemaakt… (pagina ${p + 1} van ${paginas.length})`);
            const pg = document.createElement('div');
            pg.className = 'pdf-pagina rapport';
            paginas[p].forEach(i => pg.appendChild(eenheden[i].cloneNode(true)));
            document.body.appendChild(pg);
            let canvas;
            try { canvas = await window.html2canvas(pg, { scale: 2, backgroundColor: '#ffffff', logging: false, x: 0, y: 0, scrollX: 0, scrollY: 0, ignoreElements: n => n.parentNode === document.body && n !== pg }); }
            finally { document.body.removeChild(pg); }
            let b = PDF_BREEDTE_MM, hh = canvas.height / canvas.width * b;
            if (hh > PDF_NUTTIG_MM) { b *= PDF_NUTTIG_MM / hh; hh = PDF_NUTTIG_MM; }
            if (p > 0) pdf.addPage();
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', PDF_MARGE_MM, PDF_MARGE_MM, b, hh);
            pdf.setFontSize(8); pdf.setTextColor(113, 128, 150);
            pdf.text(`Pagina ${p + 1} van ${paginas.length}`, 105, 290, { align: 'center' });
            pdf.text('© T. Gaerdelen', 198, 290, { align: 'right' });
            if (leerlingCode()) pdf.text(leerlingCode(), 12, 290);
        }
        pdf.save(bestandsnaam);
        zet('Het rapport is gedownload (kijk bij je downloads).');
    } catch (e) {
        console.error(e);
        zet('Het rapport kon niet gemaakt worden. Probeer het opnieuw (controleer je internetverbinding).');
    } finally {
        bron.innerHTML = '';
        knoppen.forEach(k => { k.disabled = false; });
    }
}

        case 'vorige': bewaarToetsWaarden(); ST.toets.huidig--; render(); window.scrollTo({ top: 0 }); break;
        case 'volgendevraag': bewaarToetsWaarden(); ST.toets.huidig++; render(); window.scrollTo({ top: 0 }); break;
        case 'gaNaar': bewaarToetsWaarden(); ST.toets.huidig = +b.dataset.i; render(); window.scrollTo({ top: 0 }); break;
        case 'inleveren': {
            bewaarToetsWaarden();
            const t = ST.toets;
            const leeg = t.vragen.reduce((s, v, qi) => s + v.delen.filter((d, di) => isLeeg(t.waarden[qi][di])).length, 0);
            if (leeg && !window.confirm(`Je hebt nog ${leeg} deelvra${leeg === 1 ? 'ag' : 'gen'} niet ingevuld. Wil je toch inleveren?`)) break;
            nakijkenToets(); break;
        }
        case 'stoptoets': if (window.confirm('Wil je de toets stoppen? Je antwoorden gaan verloren.')) { ST.scherm = 'menu'; ST.toets = null; render(); } break;
        case 'opnieuwtoets': ST.scherm = 'menu'; ST.modus = 'toets'; render(); break;
        case 'tvoorbeeld': {
            const g = GEN.find(x => x.id === b.dataset.id);
            ST.tvb = { b: +b.dataset.b, inst: maakOefening(g, nieuwZaad()) };
            renderTheorie();
            const v = APP.querySelector('.voorbeeld-vak'); if (v) v.scrollIntoView({ behavior: 'smooth', block: 'start' });
            break;
        }
        case 'tvoorbeeld-opnieuw': ST.tvb.inst = maakOefening(ST.tvb.inst.gen, nieuwZaad()); renderTheorie(); { const v = APP.querySelector('.voorbeeld-vak'); if (v) v.scrollIntoView({ block: 'start' }); } break;
        case 'oefen-cat': ST.modus = 'oefen'; startOefen(b.dataset.cat); break;
        case 'oefen-gen': { const g = GEN.find(x => x.id === b.dataset.id); ST.modus = 'oefen'; startOefen(g.cat, g.id); break; }
    }
});
window.addEventListener('beforeunload', e => { if (ST.scherm === 'toets' && ST.toets && !ST.toets.klaar) { e.preventDefault(); e.returnValue = ''; } });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => render()); else render();
</script>

<!-- =====================================================================
     13. ZELFTEST (in de console: APPTEST.zelftest())
     Maakt van elk oefentype veel exemplaren en controleert: LaTeX zonder fouten, het juiste
     antwoord wordt goedgekeurd, foute varianten worden afgekeurd, afgeleiden kloppen numeriek,
     limieten kloppen numeriek en raaklijnen raken echt.
     ===================================================================== -->
<script>
const APPTEST = (() => {
    function numAfg(fs, v, x) {
        const n = Ex.ontleed(fs, { vars: [v] }); const h = 1e-5 * Math.max(1, Math.abs(x));
        return (Ex.waarde(n, { [v]: x + h }) - Ex.waarde(n, { [v]: x - h })) / (2 * h);
    }
    function numLim(fs, a, kant) {
        const n = Ex.ontleed(fs, { vars: ['x'] }), f = x => Ex.waarde(n, { x });
        if (!Number.isFinite(a)) { const s = Math.sign(a); const w = [50, 200, 1e3, 1e4, 1e5].map(X => f(s * X)).filter(Number.isFinite); return w; }
        const zij = kant === '-' ? [-1] : kant === '+' ? [1] : [1, -1];
        return zij.flatMap(z => [1e-3, 1e-4].map(h => f(a + z * h * Math.max(1, Math.abs(a))))).filter(Number.isFinite);
    }
    function variaties(d) {
        const goed = [], fout = [];
        switch (d.type) {
            case 'uitdr': fout.push({ u: `(${d.juist}) + 1` }); fout.push({ u: `2*(${d.juist}) + ${d.vars[0]}` }); break;
            case 'getal': if (Number.isFinite(d.juist)) { fout.push({ g: String(d.juist + 1.37) }); if (Math.abs(d.juist) > 1e-9) fout.push({ g: String(-d.juist - 0.37) }); if (!d.benadering && Math.abs(d.juist) < 1e4 && Math.abs(+d.juist.toFixed(4) - d.juist) > 1e-9) fout.push({ g: d.juist.toFixed(4) }); else if (d.benadering) goed.push({ g: d.juist.toFixed(5) }); } else fout.push({ g: '0' }); break;
            case 'getallen': fout.push({ g: d.txts.slice(1).join(' ; ') || '12345' }); fout.push({ g: [...d.txts, '17'].join(' ; ') }); if (d.txts.length > 1) goed.push({ g: [...d.txts].reverse().join(' ; ') }); break;
            case 'punt': fout.push({ px: d.txt[0], py: `(${d.txt[1]}) + 1` }); break;
            case 'punten': fout.push({ p: d.txts.slice(1).map(([x, y]) => `(${x} ; ${y})`).join(', ') || '(17 ; 3)' }); if (d.txts.length > 1) goed.push({ p: [...d.txts].reverse().map(([x, y]) => `(${x} ; ${y})`).join(', ') }); break;
            case 'rechte': fout.push({ r: d.juistTxt.replace('=', '= 1 +') }); break;
            case 'rechten': fout.push({ r: d.txts.slice(1).join(' ; ') || 'y = 12345' }); break;
            case 'interval': fout.push({ i: ']-17 ; 17[' }); break;
            case 'keuze': d.opties.forEach((o, i) => { if (i !== d.juist) fout.push({ k: String(i) }); }); break;
        }
        return { goed, fout };
    }
    function zelftest(n = 25, filter = null) {
        KATEX_STRIKT = true;
        const fouten = [], tellers = {};
        const t0 = performance.now();
        for (const g of GEN) {
            if (filter && !g.id.includes(filter) && g.cat !== filter) continue;
            tellers[g.id] = 0;
            for (let s = 1; s <= n; s++) {
                const seed = (hashTekst(g.id) + s * 7919) >>> 0;
                let o;
                try { o = maakOefening(g, seed); } catch (e) { fouten.push([g.id, seed, 'maak', e.message]); continue; }
                tellers[g.id]++;
                try { wis(o.opgave); o.hints.forEach(h => wis(h)); o.stappen.forEach(x => wis(String(x).replace(/^[!>]/, ''))); o.delen.forEach(d => { wis(d.vraag); if (d.juistTex) kt(d.juistTex, true); if (d.label) kt(d.label); (d.opties || []).forEach(op => { wis(op.t); wis(op.uitleg); }); }); }
                catch (e) { fouten.push([g.id, seed, 'latex', e.message]); }
                o.delen.forEach((d, j) => {
                    const proef = (w, moet, wat) => {
                        let res;
                        try { res = TYPES[d.type].controleer(d, w); } catch (e) { res = { ok: false, msg: 'FOUT: ' + e.message }; }
                        if (res.ok !== moet) fouten.push([g.id, seed, `${wat} deel ${j} (${d.type})`, res.msg, JSON.stringify(w)]);
                        if (res.ok && moet) { try { const t = TYPES[d.type].toon(d, w); if (t) kt(t); else TYPES[d.type].toonHtml(d, w); } catch (e) { fouten.push([g.id, seed, 'toon' + j, e.message]); } }
                    };
                    proef(TYPES[d.type].invoer(d), true, 'juist');
                    const v = variaties(d);
                    v.goed.forEach(w => proef(w, true, 'variant-juist'));
                    v.fout.forEach(w => proef(w, false, 'variant-fout'));
                    try {
                        if (d.type === 'uitdr' && d.f) {
                            const nj = Ex.ontleed(d.juist, { vars: d.vars }), vv = d.vars[0];
                            let goed = 0, getest = 0;
                            envsVan(d).forEach(env => { const x = env[vv]; const a = numAfg(d.f, vv, x), b = Ex.waarde(nj, env); if (Number.isFinite(a) && Number.isFinite(b) && Math.abs(b) < 1e6) { getest++; if (Math.abs(a - b) <= 1e-4 * Math.max(1, Math.abs(b))) goed++; } });
                            if (getest < 4 || goed < getest) fouten.push([g.id, seed, 'afgeleide klopt niet ' + j, `${goed}/${getest}`, d.f + ' → ' + d.juist]);
                        }
                        if (d.type === 'getal' && d.lim && !/^\(e\^\(\d*x\) - 1\)\^\(1\/ln\(x\)\)$|^x\^\(-?\d+\/\(1 \+ ln\(x\)\)\)$/.test(d.lim.f)) {   // deze limieten convergeren (logaritmisch) te traag om numeriek te testen
                            const w = numLim(d.lim.f, d.lim.a, d.lim.kant);
                            const J = d.juist;
                            const ok = w.length && (Number.isFinite(J) ? Math.abs(w[w.length - 1] - J) <= 2e-2 * Math.max(1, Math.abs(J)) : (Math.sign(w[w.length - 1]) === Math.sign(J) && (Math.abs(w[w.length - 1]) > 50 || (w.length >= 3 && w.every((x, i) => i === 0 || Math.abs(x) > Math.abs(w[i - 1]))))));
                            if (!ok) fouten.push([g.id, seed, 'limiet klopt niet ' + j, JSON.stringify(w.map(x => +x.toPrecision(5))), d.lim.f + ' → ' + d.juistTxt]);
                        }
                        if (d.type === 'rechte' && d.raakF) {
                            const { f, a } = d.raakF, m = numAfg(f, 'x', a), y0 = Ex.waarde(Ex.ontleed(f, { vars: ['x'] }), { x: a });
                            const R = d.R, mR = -R.A / R.B, yR = -(R.A * a + R.C) / R.B;
                            if (!(Math.abs(mR - m) < 1e-4 * Math.max(1, Math.abs(m)) && Math.abs(yR - y0) < 1e-6 * Math.max(1, Math.abs(y0)))) fouten.push([g.id, seed, 'raaklijn klopt niet ' + j, `rico ${m} vs ${mR}, y ${y0} vs ${yR}`]);
                        }
                    } catch (e) { fouten.push([g.id, seed, 'numerieke controle ' + j, e.message]); }
                });
            }
        }
        KATEX_STRIKT = false;
        const tijd = Math.round(performance.now() - t0);
        console.log(`Zelftest: ${GEN.length} oefentypes, ${Object.values(tellers).reduce((a, b) => a + b, 0)} oefeningen, ${fouten.length} problemen (${tijd} ms)`);
        if (fouten.length) console.table(fouten.slice(0, 200));
        return { fouten, tellers, tijd };
    }
    return { zelftest };
})();
</script>
