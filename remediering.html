<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remediëring</title>
<link rel="stylesheet" href="lib/katex/katex.min.css">

<style>
  :root { --blauw:#1e3a8a; --blauw2:#172554; --tekst:#1e293b; --grijs:#64748b; --rand:#e2e8f0; --achter:#f1f5f9;
          --goed:#15803d; --fout:#b91c1c; --half:#b45309; --tip:#a16207; --opl:#10309e; }
  * { box-sizing: border-box; }
  body { margin:0; padding:18px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--achter); color: var(--tekst); }
  button, input, select, textarea { font-family: inherit; font-size: 1rem; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.75rem; margin: .2rem 0 .3rem; font-weight: 800; }
  h2 { font-size: 1.2rem; margin: 0 0 .6rem; }
  .sub { color: var(--grijs); margin: 0 0 1rem; }
  .kaart { background:#fff; border:1px solid var(--rand); border-radius:16px; box-shadow:0 4px 18px rgba(15,23,42,.06); padding:18px 20px; margin-bottom:16px; }
  .kaart.accent { border-top:6px solid var(--blauw); }
  .rij { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .knop { background: var(--blauw); color:#fff; border:none; border-radius:10px; padding:10px 18px; font-weight:700; cursor:pointer; text-decoration:none; display:inline-block; }
  .knop:hover { background: var(--blauw2); }
  .knop.licht { background:#fff; color: var(--blauw); border:1px solid #bfdbfe; }
  .knop.licht:hover { background:#eff6ff; }
  .knop.klein { padding:6px 12px; font-size:.9rem; }
  .knop.groen { background: var(--goed); } .knop.groen:hover { background:#166534; }
  .knop:disabled { opacity:.45; cursor:default; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:.8rem; font-weight:700; background:#eff6ff; color:var(--blauw); border:1px solid #bfdbfe; }
  .badge.gg { background:#fef3c7; color:#92400e; border-color:#fde68a; }
  .badge.ok { background:#ecfdf3; color:var(--goed); border-color:#bbf7d0; }
  .badge.bezig { background:#fff7ed; color:#c2410c; border-color:#fed7aa; }
  .lijst-item { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 0; border-top:1px solid var(--rand); flex-wrap:wrap; }
  .lijst-item:first-of-type { border-top:none; }
  .lijst-item .titel { font-weight:800; font-size:1.05rem; }
  .lijst-item .info { color:var(--grijs); font-size:.92rem; margin-top:3px; }
  .leeg { color:var(--grijs); padding:10px 0; }
  .klaskeuze { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  /* vraagscherm */
  .navbollen { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 14px; }
  .navbol { width:34px; height:34px; border-radius:50%; border:2px solid #cbd5e1; background:#fff; font-weight:700; cursor:pointer; color:var(--tekst); }
  .navbol.ingevuld { background:#dbeafe; border-color:#93c5fd; }
  .navbol.actief { border-color: var(--blauw); box-shadow:0 0 0 3px #bfdbfe; }
  .vraagkop { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .vraagkop .nr { font-weight:800; color:var(--blauw); font-size:1.05rem; }
  .opgave { font-size:1.08rem; line-height:1.6; margin-bottom:12px; }
  .figuur { text-align:center; margin: 6px 0 12px; }
  .figuur svg { max-width:100%; height:auto; }
  .veld-blok { margin: 12px 0; padding:10px 12px; background:#f8fafc; border:1px solid var(--rand); border-radius:12px; }
  .veld-label { font-weight:600; margin-bottom:6px; line-height:1.5; }
  input.tekstveld { width:100%; max-width:520px; padding:8px 10px; border:2px solid #cbd5e1; border-radius:8px; font-size:1.05rem; }
  input.tekstveld:focus, select:focus, textarea:focus { outline:none; border-color:#60a5fa; }
  .voorbeeld { min-height:1.6em; margin-top:6px; color:#334155; font-size:1.05rem; }
  .voorbeeld .fout-melding { color:#b45309; font-size:.88rem; }
  .hulp { color:var(--grijs); font-size:.85rem; margin-top:4px; }
  .symbolen { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
  .symbolen button { border:1px solid #cbd5e1; background:#fff; border-radius:6px; padding:3px 9px; cursor:pointer; font-size:.95rem; }
  .symbolen button:hover { background:#eff6ff; }
  .opties { display:grid; gap:8px; }
  .optie { text-align:left; background:#fff; border:2px solid #cbd5e1; border-radius:10px; padding:9px 12px; cursor:pointer; line-height:1.5; color:var(--tekst); }
  .optie:hover { border-color:#93c5fd; }
  .optie.gekozen { border-color: var(--blauw); background:#eff6ff; }
  select.keuze { padding:6px 8px; border:2px solid #cbd5e1; border-radius:8px; background:#fff; }
  table.tt { border-collapse:collapse; margin-top:4px; }
  table.tt td { border:1px solid #cbd5e1; padding:4px 6px; text-align:center; min-width:42px; background:#fff; }
  table.tt td.kop { font-weight:700; background:#f1f5f9; }
  table.tt select { padding:3px 2px; border:1px solid #cbd5e1; border-radius:6px; background:#fff; font-size:1rem; }
  .zeker { margin-top:12px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:.92rem; color:var(--grijs); }
  .zeker button { border:1px solid var(--rand); background:#fff; border-radius:8px; padding:4px 10px; cursor:pointer; }
  .zeker button.aan { border-color:#93c5fd; background:#eff6ff; color:var(--blauw); font-weight:700; }
  .tipvak { margin-top:10px; background:#fefce8; border:1px solid #fde68a; color:#713f12; border-radius:10px; padding:10px 12px; line-height:1.5; }
  .knoppenrij { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:16px; }
  textarea.reflectie { width:100%; min-height:70px; padding:8px 10px; border:2px solid #cbd5e1; border-radius:8px; }
  .waarschuwing { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; border-radius:10px; padding:10px 12px; margin:10px 0; }
  .wacht { position:fixed; inset:0; background:rgba(241,245,249,.97); display:flex; align-items:center; justify-content:center; z-index:100; font-size:1.2rem; font-weight:700; color:var(--blauw); text-align:center; padding:20px; }
  /* rapport */
  #rapport-buiten { position:absolute; left:-10000px; top:0; width:780px; }
  .rapport { background:#fff; color:var(--tekst); }
  .rapport .pdf-blok { padding:10px 18px; background:#fff; }
  .rapport h1 { font-size:1.5rem; margin:0 0 4px; }
  .r-kop { border-bottom:3px solid var(--blauw); padding-bottom:10px; }
  .r-meta { color:var(--grijs); font-size:.92rem; }
  .r-score { font-size:2.2rem; font-weight:800; color:var(--blauw); }
  table.r-tabel { width:100%; border-collapse:collapse; font-size:.92rem; }
  table.r-tabel th, table.r-tabel td { border-bottom:1px solid var(--rand); padding:5px 6px; text-align:left; vertical-align:top; }
  table.r-tabel th { background:#f1f5f9; }
  .r-vraag { border:1px solid var(--rand); border-left:6px solid #cbd5e1; border-radius:10px; padding:10px 14px; }
  .r-vraag.goed { border-left-color:#22c55e; } .r-vraag.fout { border-left-color:#ef4444; } .r-vraag.half { border-left-color:#f59e0b; }
  .r-vraag .kopregel { display:flex; justify-content:space-between; gap:8px; font-weight:800; margin-bottom:6px; }
  .r-antw { margin:6px 0; line-height:1.6; }
  .r-antw .lbl { color:var(--grijs); font-size:.85rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
  .r-twee { display:flex; gap:12px; align-items:flex-start; } .r-links { flex:1; min-width:0; } .r-fig { flex:0 0 250px; margin:0; }
  @media (max-width:600px) { .r-twee { flex-direction:column; } .r-fig { flex-basis:auto; } }
  .r-uitw { margin-top:8px; padding:8px 12px; background:#f8fafc; border-radius:8px; color:var(--opl); line-height:1.7; }
  .pen { font-family: "Patrick Hand", "Segoe Print", cursive; color:#be123c; font-size:1.1rem; }
  .ok-kleur { color:var(--goed); font-weight:700; } .fout-kleur { color:var(--fout); font-weight:700; } .half-kleur { color:var(--half); font-weight:700; }
  .naam-app { position:fixed; right:12px; bottom:8px; font-size:11px; color:#94a3b8; }
  @media (max-width: 600px) {
    body { padding:10px; } .kaart { padding:14px; } h1 { font-size:1.4rem; }
    .navbol { width:30px; height:30px; } .opgave { font-size:1rem; }
    table.tt td { min-width:30px; padding:3px; } .knoppenrij .knop { flex:1; text-align:center; }
  }
  @media print { .naam-app, .knoppenrij, .navbollen { display:none !important; } body { background:#fff; } }
</style>

<!-- PORTAAL-KOPPELING (zelfde blok in elke app): terug naar het portaal en de leerlingcode.
     De apps vragen of bewaren geen naam; enkel de anonieme code van het portaal wordt getoond. -->
<style>
    .portaal-terug { display: inline-block; margin: 0 0 12px; padding: 6px 14px; border: 1px solid #cbd5e1; border-radius: 999px; background: #fff; color: #475569; font: 600 .85rem system-ui, -apple-system, 'Segoe UI', sans-serif; text-decoration: none; }
    .portaal-terug:hover { background: #f1f5f9; color: #1e293b; }
    .portaal-terug-rij { text-align: left; }
    .leerling-code { position: fixed; left: 14px; bottom: 10px; font: 11px system-ui, -apple-system, 'Segoe UI', sans-serif; color: #94a3b8; background: rgba(255,255,255,.85); padding: 2px 8px; border-radius: 6px; pointer-events: none; z-index: 50; }
    @media print { .portaal-terug-rij, .leerling-code { display: none !important; } }
</style>
<script>
    // Anonieme leerlingcode en klas, zoals ingesteld in het portaal (index.html)
    function leerlingCode() {
        try { return (localStorage.getItem('wisk_leerling_code') || '').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '').slice(0, 20); } catch (e) { return ''; }
    }
    function portaalKlas() {
        try { const k = (localStorage.getItem('wisk_leerling_klas') || '').trim(); return k === 'alle klassen' ? '' : k.replace(/[^\p{L}\p{N} _-]/gu, '').slice(0, 20); } catch (e) { return ''; }
    }
    // Resultaten doorgeven aan het dashboard (via tracker.js). Bewaart nooit wat de leerling intypte:
    // enkel welke oefening, juist of fout, en de soort fout.
    function portaalLogOpgave(juist, module, fout, details) {
        try { if (window.WiskundeTracker) WiskundeTracker.logOpgave({ isCorrect: !!juist, moduleId: module, foutCategorie: fout || null, details: details || {} }); } catch (e) { /* loggen mag de app nooit storen */ }
    }
    function portaalLogToets(procent, duur, module, details) {
        try { if (window.WiskundeTracker) WiskundeTracker.logToets({ scoreProcent: procent, duurSeconden: duur || 0, moduleId: module, details: details || {} }); } catch (e) { /* loggen mag de app nooit storen */ }
    }
    window.addEventListener('DOMContentLoaded', () => {
        const code = leerlingCode();
        if (!code || window.WiskundeTracker) return; // de tracker toont de code al zelf
        const el = document.createElement('div');
        el.className = 'leerling-code';
        el.setAttribute('data-html2canvas-ignore', '');
        el.textContent = code;
        document.body.appendChild(el);
    });
</script>

<script>
'use strict';
/* =====================================================================
   Remediëring per toets (alle klassen).
   - remediering/lijst.js: welke remediëringen open staan per klas (REM_LIJST).
     Enkel wat in die lijst staat, staat online; voorbereide remediëringen blijven lokaal.
   - remediering/<klas>_<id>.js: de 10 oefeningen van één toets (REM_REGISTREER({...})).
   - De leerling ziet tijdens het maken geen juist/fout (wel tips). Het resultaat verschijnt
     pas nadat het pdf-rapport gemaakt is; dat rapport stuurt de leerling door (Smartschool/Teams).
   Logs: appId 'remediering', module '<klas>_<id>', oefening-id '<klas>_<id>_<vraag-id>'.
   ===================================================================== */
const APP_ID = 'remediering';
const scherm = () => document.getElementById('scherm');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KLASSEN = ['5duHT', '5doSW', '6doSW', '6doTW'];

/* ---------------- tekst met formules: $...$ en $$...$$ ---------------- */
function kt(tex, display) {
  try { return katex.renderToString(tex, { throwOnError: false, displayMode: !!display, trust: false }); } catch (e) { return esc(tex); }
}
function tx(s) {
  if (s == null) return '';
  const delen = String(s).split(/(\$\$[\s\S]+?\$\$|\$[^$]+\$)/g);
  return delen.map(d => {
    if (d.startsWith('$$')) return kt(d.slice(2, -2), true);
    if (d.startsWith('$') && d.length > 1) return kt(d.slice(1, -1), false);
    return esc(d).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
  }).join('');
}
const fmt = v => {
  if (!isFinite(v)) return v > 0 ? '+\\infty' : '-\\infty';
  let r = Math.round(v * 1e6) / 1e6;
  return String(r).replace('.', '{,}');
};
const fmtPt = v => String(Math.round(v * 100) / 100).replace('.', ',');

/* =====================================================================
   W: formule-lezer (uitdrukkingen intypen, nakijken door invullen, terug naar LaTeX)
   ===================================================================== */
const W = (() => {
  const FN = ['arcsin', 'arccos', 'arctan', 'bgsin', 'bgcos', 'bgtan', 'bgcot', 'sinh', 'cosh', 'tanh', 'asin', 'acos', 'atan', 'sqrt', 'sin', 'cos', 'tan', 'cot', 'exp', 'abs', 'ln', 'log'];
  const NAMEN = FN.concat(['pi', 'inf']).sort((a, b) => b.length - a.length);
  const F = {
    sin: Math.sin, cos: Math.cos, tan: Math.tan, cot: x => 1 / Math.tan(x),
    asin: Math.asin, arcsin: Math.asin, bgsin: Math.asin, acos: Math.acos, arccos: Math.acos, bgcos: Math.acos,
    atan: Math.atan, arctan: Math.atan, bgtan: Math.atan, bgcot: x => Math.PI / 2 - Math.atan(x),
    sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh, sqrt: Math.sqrt, exp: Math.exp, ln: Math.log, log: Math.log10, abs: Math.abs
  };
  const TEXNAAM = { sin: '\\sin', cos: '\\cos', tan: '\\tan', cot: '\\cot', asin: '\\text{Bgsin}', arcsin: '\\text{Bgsin}', bgsin: '\\text{Bgsin}', acos: '\\text{Bgcos}', arccos: '\\text{Bgcos}', bgcos: '\\text{Bgcos}', atan: '\\text{Bgtan}', arctan: '\\text{Bgtan}', bgtan: '\\text{Bgtan}', bgcot: '\\text{Bgcot}', sinh: '\\sinh', cosh: '\\cosh', tanh: '\\tanh', exp: '\\exp', ln: '\\ln', log: '\\log' };
  function norm(s) {
    return String(s).replace(/[−–—]/g, '-').replace(/[·×∙⋅]/g, '*').replace(/÷/g, '/').replace(/√/g, 'sqrt').replace(/π/g, 'pi')
      .replace(/∞/g, 'inf').replace(/²/g, '^2').replace(/³/g, '^3').replace(/⁴/g, '^4').replace(/\*\*/g, '^').replace(/,/g, '.')
      .replace(/[\[{]/g, '(').replace(/[\]}]/g, ')').replace(/\s+/g, '');
  }
  function tokens(str) {
    const s = norm(str), t = []; let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (/[0-9.]/.test(c)) { let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++; const st = s.slice(i, j); if ((st.match(/\./g) || []).length > 1 || st === '.') throw new Error('Getal niet duidelijk: ' + st); t.push({ t: 'num', v: parseFloat(st), s: st }); i = j; continue; }
      if (/[a-zA-Z]/.test(c)) {
        let j = i; while (j < s.length && /[a-zA-Z]/.test(s[j])) j++;
        const w = s.slice(i, j).toLowerCase(); let k = 0;
        while (k < w.length) {
          const n = NAMEN.find(n => w.startsWith(n, k));
          if (n) { t.push(FN.includes(n) ? { t: 'fn', v: n } : { t: 'id', v: n }); k += n.length; }
          else { t.push({ t: 'id', v: w[k] }); k++; }
        }
        i = j; continue;
      }
      if ('+-*/^()|_'.includes(c)) { t.push({ t: c }); i++; continue; }
      throw new Error('Onbekend teken: ' + c);
    }
    return t;
  }
  function parse(str, vars) {
    vars = vars || ['x'];
    const T = tokens(str); let p = 0;
    if (!T.length) throw new Error('Leeg');
    const peek = () => T[p], eat = x => { if (T[p] && T[p].t === x) { p++; return true; } return false; };
    const start = tk => tk && (tk.t === 'num' || tk.t === 'id' || tk.t === 'fn' || tk.t === '(');
    const startZonderFn = tk => tk && (tk.t === 'num' || tk.t === 'id');
    function expr() { let a = term(); while (peek() && (peek().t === '+' || peek().t === '-')) { const op = T[p++].t; const b = term(); a = { k: op === '+' ? 'add' : 'sub', a, b }; } return a; }
    function term() {
      let a = unary();
      for (;;) {
        const tk = peek(); if (!tk) break;
        if (tk.t === '*') { p++; a = { k: 'mul', a, b: unary() }; }
        else if (tk.t === '/') { p++; a = { k: 'div', a, b: unary() }; }
        else if (start(tk)) { a = { k: 'mul', a, b: power(), imp: true }; }
        else break;
      }
      return a;
    }
    function unary() { if (eat('-')) return { k: 'neg', a: unary() }; if (eat('+')) return unary(); return power(); }
    function power() { const b = primary(); if (eat('^')) return { k: 'pow', a: b, b: unary() }; return b; }
    function primary() {
      const tk = T[p++]; if (!tk) throw new Error('Onvolledige uitdrukking');
      if (tk.t === 'num') return { k: 'num', v: tk.v, s: tk.s };
      if (tk.t === 'id') {
        if (tk.v === 'e') return { k: 'num', v: Math.E, s: 'e' };
        if (tk.v === 'pi') return { k: 'num', v: Math.PI, s: '\\pi' };
        if (tk.v === 'inf') return { k: 'num', v: Infinity, s: '\\infty' };
        if (!vars.includes(tk.v)) throw new Error('Onbekende letter: ' + tk.v);
        return { k: 'var', v: tk.v };
      }
      if (tk.t === '(') { const a = expr(); if (!eat(')')) throw new Error('Er ontbreekt een haakje )'); return { k: 'par', a }; }
      if (tk.t === '|') { const a = expr(); if (!eat('|')) throw new Error('Er ontbreekt een |'); return { k: 'fn', f: 'abs', a }; }
      if (tk.t === 'fn') {
        let base = null, macht = null;
        if (tk.v === 'log' && eat('_')) base = primary();
        if (eat('^')) { if (eat('-')) macht = { k: 'neg', a: primary() }; else macht = primary(); }
        let arg;
        if (peek() && peek().t === '(') { p++; arg = expr(); if (!eat(')')) throw new Error('Er ontbreekt een haakje )'); }
        else { if (!startZonderFn(peek()) && !(peek() && peek().t === 'fn')) throw new Error('Na ' + tk.v + ' ontbreekt iets'); arg = power(); while (startZonderFn(peek())) arg = { k: 'mul', a: arg, b: power(), imp: true }; }
        let n = { k: 'fn', f: tk.v, a: arg, base };
        if (macht) n = { k: 'pow', a: n, b: macht, fnMacht: true };
        return n;
      }
      throw new Error('Onverwacht teken: ' + tk.t);
    }
    const r = expr();
    if (p < T.length) throw new Error('Onverwacht teken: ' + (T[p].v || T[p].t));
    return r;
  }
  function machtReeel(b, e) {
    if (b >= 0 || Number.isInteger(e)) return Math.pow(b, e);
    for (const q of [3, 5, 7, 9]) { const pq = e * q; if (Math.abs(pq - Math.round(pq)) < 1e-9) { const pp = Math.round(pq); return (pp % 2 ? -1 : 1) * Math.pow(-b, e); } }
    return NaN;
  }
  function ev(n, env) {
    switch (n.k) {
      case 'num': return n.v;
      case 'var': return env[n.v];
      case 'par': return ev(n.a, env);
      case 'neg': return -ev(n.a, env);
      case 'add': return ev(n.a, env) + ev(n.b, env);
      case 'sub': return ev(n.a, env) - ev(n.b, env);
      case 'mul': return ev(n.a, env) * ev(n.b, env);
      case 'div': return ev(n.a, env) / ev(n.b, env);
      case 'pow': return machtReeel(ev(n.a, env), ev(n.b, env));
      case 'fn': { const v = ev(n.a, env); if (n.f === 'log' && n.base) return Math.log(v) / Math.log(ev(n.base, env)); return F[n.f](v); }
    }
    return NaN;

function voegIn(id, sb) {

async function maakPdf(bestandsnaam) {
  const buiten = document.getElementById('rapport-buiten');
  const blokken = [...buiten.querySelectorAll('.pdf-blok')];
  const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
  const marge = 12, breedte = 186, onder = 297 - 16; let y = marge;
  for (const b of blokken) {
    const c = await html2canvas(b, { scale: 2, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0, windowWidth: 1000 });
    const mmPerPx = breedte / c.width; let h = c.height * mmPerPx;
    if (h <= onder - marge) {
      if (y + h > onder) { pdf.addPage(); y = marge; }
      pdf.addImage(c.toDataURL('image/jpeg', 0.9), 'JPEG', marge, y, breedte, h); y += h + 2;
    } else {
      // te hoog voor één blad: in stukken snijden
      let bron = 0; const pxPerPagina = Math.floor((onder - marge) / mmPerPx);
      while (bron < c.height) {
        if (y > marge + 1) { pdf.addPage(); y = marge; }
        const hp = Math.min(pxPerPagina, c.height - bron), stuk = document.createElement('canvas');
        stuk.width = c.width; stuk.height = hp; stuk.getContext('2d').drawImage(c, 0, bron, c.width, hp, 0, 0, c.width, hp);
        pdf.addImage(stuk.toDataURL('image/jpeg', 0.9), 'JPEG', marge, y, breedte, hp * mmPerPx); y += hp * mmPerPx + 2; bron += hp;
      }
    }
  }
  const n = pdf.getNumberOfPages(), code = leerlingCode() || 'zonder code';
  for (let i = 1; i <= n; i++) {
    pdf.setPage(i); pdf.setFontSize(8); pdf.setTextColor(148, 163, 184);
    pdf.text(`Remediëring ${SET.klas} ${SET.titel} · code ${code} · blz. ${i}/${n}`, marge, 291);
    pdf.text('© T. Gaerdelen', 210 - marge, 291, { align: 'right' });
  }
  pdf.save(bestandsnaam);
}
const bestandsnaam = () => `Remediering ${SET.klas} ${SET.titel.split(' ').slice(0, 2).join(' ')} ${leerlingCode() || 'zonder-code'}.pdf`.replace(/[\\/:*?"<>|]/g, '');

  </div><div class="kaart">${rapportHtml(res, ST.ingediend.score).replace('id="rapport"', '')}</div>`;
  window.scrollTo(0, 0);
}
async function herdownload() {
  const res = SET.vragen.map((v, j) => ({ v, pt: ST.ingediend.per[j], per: v.velden.map((f, i) => puntenVeld(f, (ST.antw[v.id] || {})[i])) }));
  document.getElementById('rapport-buiten').innerHTML = rapportHtml(res, ST.ingediend.score);
  try { await maakPdf(bestandsnaam()); } catch (e) { alert('Er liep iets mis bij het maken van de pdf.'); }
}
function opnieuw() {
  if (!confirm('Opnieuw beginnen? Je vorige antwoorden worden gewist (je pdf heb je al). Het nieuwe rapport vermeldt "poging ' + ((ST.poging || 1) + 1) + '".')) return;
  ST = { antw: {}, zeker: {}, tips: {}, poging: (ST.poging || 1) + 1, start: Date.now(), reflectie: '' };
  bewaar(); HUIDIG = 0; toonVraag();
}

/* =====================================================================
   ZELFTEST (voor de leerkracht, in de console): REM_ZELFTEST() na het openen van een remediëring,
   of REM_ZELFTEST_ALLES() op het lijstscherm. Controleert de sleutels wiskundig.
   ===================================================================== */
function zelftestSet(set) {
  const fouten = [], meld = (v, t) => fouten.push(`${set.klas} ${set.id} ${v.id}: ${t}`);
  if (set.vragen.length !== 10) fouten.push(`${set.klas} ${set.id}: ${set.vragen.length} vragen in plaats van 10`);
  const ids = new Set();
  set.vragen.forEach(v => {
    if (ids.has(v.id)) meld(v, 'dubbel id'); ids.add(v.id);
    if (!v.uitwerking) meld(v, 'geen uitwerking');
    try { tx(v.opgave); if (v.fig) grafiek(v.fig); } catch (e) { meld(v, 'opgave/figuur: ' + e.message); }
    v.velden.forEach((f, i) => {
      let juist = f.type === 'teken' ? f.ok.split('') : f.type === 'verz' ? (f.ok.length ? f.ok.join(' ; ') : '∅') : f.ok;
      if (f.type === 'mc') { if (!(f.ok >= 0 && f.ok < f.opties.length)) meld(v, 'mc zonder juist antwoord'); }
      else if (puntenVeld(f, juist) !== 1) meld(v, `veld ${i}: het juiste antwoord wordt niet aanvaard (${juist})`);
      if (f.type === 'kies' && !f.opties.includes(f.ok)) meld(v, `veld ${i}: ok niet in opties`);
      if (f.type === 'kies' && f.opties.some(o => /[$\\]/.test(o))) meld(v, `veld ${i}: formule in een keuzelijst (kan niet getoond worden)`);
      try {
        const c = f.check || {};
        if (c.afgVan) { // expr = afgeleide van c.afgVan
          const A = W.parse(c.afgVan, ['x']), B = W.parse(f.ok, ['x']); const d = f.dom || [-3, 3]; let n = 0;
          for (let k = 1; k < 30; k++) { const x = d[0] + (d[1] - d[0]) * k / 30, h = 1e-5; const num = (W.ev(A, { x: x + h }) - W.ev(A, { x: x - h })) / (2 * h), b = W.ev(B, { x }); if (!isFinite(num) || !isFinite(b)) continue; n++; if (Math.abs(num - b) > 1e-4 * Math.max(1, Math.abs(b))) { meld(v, `veld ${i}: afgeleide klopt niet in x=${x.toFixed(3)} (${num} ≠ ${b})`); break; } }
          if (n < 5) meld(v, `veld ${i}: te weinig punten om de afgeleide te testen`);
        }
        if (c.gelijk) { const A = W.parse(c.gelijk, f.vars || ['x']), B = W.parse(f.ok, f.vars || ['x']); for (let k = 1; k < 20; k++) { const x = -2.7 + 5.3 * k / 20, a = W.ev(A, { x }), b = W.ev(B, { x }); if (isFinite(a) && isFinite(b) && Math.abs(a - b) > 1e-6 * Math.max(1, Math.abs(b))) { meld(v, `veld ${i}: niet gelijk aan ${c.gelijk}`); break; } } }
        if (c.waarde) { const a = W.waarde(c.waarde, {}, []), b = getalUit(f.ok); if (!gelijkGetal(a, b, f.tol != null ? f.tol : 1e-6)) meld(v, `veld ${i}: ${c.waarde} = ${a}, sleutel ${b}`); }
        if (c.lim) { const A = W.parse(c.lim.f, ['x']); const a = c.lim.a; let val; if (a === 'inf') val = W.ev(A, { x: 1e7 }); else if (a === '-inf') val = W.ev(A, { x: -1e7 }); else val = W.ev(A, { x: a + (c.lim.kant === '-' ? -1 : 1) * 1e-5 }); const b = getalUit(f.ok); if (!(Math.abs(val - b) < 1e-2 * Math.max(1, Math.abs(b)) || (!isFinite(b) && Math.abs(val) > 1e3 && Math.sign(val) === Math.sign(b)))) meld(v, `veld ${i}: limiet numeriek ${val}, sleutel ${b}`); }
        if (c.vgl) { const [l, r] = c.vgl.split('='); const L = W.parse(l, ['x']), R = W.parse(r, ['x']); f.ok.forEach(o => { const x = getalUit(o), d = W.ev(L, { x }) - W.ev(R, { x }); if (!(Math.abs(d) < (f.tol ? 0.05 : 1e-6) * Math.max(1, Math.abs(W.ev(R, { x }))))) meld(v, `veld ${i}: ${o} voldoet niet aan ${c.vgl} (${d})`); });
          if (c.bereik) { // tel de nulwaarden (tekenwissel of raken) en vergelijk met het aantal oplossingen
            const [a0, b0] = c.bereik; let tel = 0, vorig = null; const N = 20000; const g = x => W.ev(L, { x }) - W.ev(R, { x });
            for (let k = 0; k <= N; k++) { const x = a0 + (b0 - a0) * k / N, y = g(x); if (!isFinite(y)) { vorig = null; continue; } if (Math.abs(y) < 1e-9) continue; if (vorig != null && (Math.sign(y) !== Math.sign(vorig) && y !== 0)) tel++; vorig = y; }
            const dubbel = f.ok.filter(o => { const x = getalUit(o); return Math.sign(g(x - 1e-3)) === Math.sign(g(x + 1e-3)); }).length;
            if (tel + dubbel !== f.ok.length) meld(v, `veld ${i}: ${tel} tekenwissels + ${dubbel} raakpunten, sleutel heeft ${f.ok.length} oplossingen`);
          } }
        if (c.teken) { // interval = {x | f(x) rel 0}
          const A = W.parse(c.teken.f, ['x']), L = leesIntervallen(f.ok), rel = c.teken.rel;
          for (let k = 0; k <= 4000; k++) { const x = -20 + 40 * k / 4000 + 0.00123, y = W.ev(A, { x }); const zou = !isFinite(y) ? false : rel === '<0' ? y < 0 : rel === '<=0' ? y <= 1e-12 : rel === '>0' ? y > 0 : y >= -1e-12; const zit = L.some(I => (x > I.a || (I.ac && x === I.a)) && (x < I.b || (I.bc && x === I.b))); if (zou !== zit && Math.abs(y) > 1e-6) { meld(v, `veld ${i}: interval klopt niet in x=${x.toFixed(3)}`); break; } }
        }
        if (c.tekenVan) { // tekentabel: tekens tussen de nulwaarden
          const A = W.parse(c.tekenVan, ['x']); const xs = f.x.map(getalUit), ok = f.ok.split('');
          const pts = [xs[0] - 1].concat(xs.slice(0, -1).map((x, k) => (x + xs[k + 1]) / 2), [xs[xs.length - 1] + 1]);
          pts.forEach((x, k) => { const y = W.ev(A, { x }); const t = !isFinite(y) ? '/' : y > 0 ? '+' : '-'; if (ok[2 * k] !== t) meld(v, `veld ${i}: teken in x=${x} is ${t}, sleutel ${ok[2 * k]}`); });
          xs.forEach((x, k) => { const y = W.ev(A, { x }); const t = !isFinite(y) ? '/' : Math.abs(y) < 1e-9 ? '0' : '?'; if (ok[2 * k + 1] !== t) meld(v, `veld ${i}: in x=${x} sleutel ${ok[2 * k + 1]}, berekend ${t}`); });
        }
      } catch (e) { meld(v, `veld ${i}: controle mislukt: ${e.message}`); }
    });
  });
  return fouten;
}
window.REM_ZELFTEST = () => SET ? zelftestSet(SET) : 'Open eerst een remediëring';
window.REM_ZELFTEST_ALLES = async () => {
  const uit = {}; const lijst = window.REM_LIJST || {};
  for (const k of Object.keys(lijst)) for (const it of lijst[k]) { try { const s = await laadSet(k, it); uit[k + ' ' + it.id] = zelftestSet(s); } catch (e) { uit[k + ' ' + it.id] = ['laden mislukt']; } }
  return uit;
};

toonLijst();
</script>
