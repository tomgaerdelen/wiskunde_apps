<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5doSW semester 1</title>
<!-- Externe bibliotheken (vaste versies):
     KaTeX voor de wiskundige weergave, html2canvas + jsPDF voor het PDF-rapport,
     Patrick Hand (Google Fonts) voor de handgeschreven feedback van de leerkracht.
     Zonder internet werkt de app ook, maar dan worden formules als tekst getoond
     en kan het PDF-rapport niet gemaakt worden. -->
<link rel="stylesheet" href="lib/katex/katex.min.css">
<script src="lib/katex/katex.min.js"></script>
<script defer src="lib/html2canvas-1.4.1.min.js"></script>
<script defer src="lib/jspdf-2.5.1.umd.min.js"></script>
<link rel="stylesheet" href="lib/patrick-hand/patrick-hand.css">
<style>
    :root {
        --bg: #f1f5f9; --kaart: #ffffff; --rand: #e2e8f0; --tekst: #1e293b; --zacht: #64748b; --heel-zacht: #94a3b8;
        --blauw: #1e3a8a; --blauw-licht: #eff6ff; --blauw-rand: #bfdbfe;
        --groen: #059669; --groen-donker: #047857; --groen-licht: #ecfdf5; --groen-rand: #a7f3d0;
        --rood: #e11d48; --rood-donker: #be123c; --rood-licht: #fff1f2; --rood-rand: #fecdd3;
        --oranje-licht: #fffbeb; --oranje-rand: #fde68a; --oranje-tekst: #92400e;
        --paars: #4f46e5; --paars-licht: #eef2ff; --paars-rand: #c7d2fe;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--tekst); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.45; }
    #app { max-width: 960px; margin: 0 auto; padding: 16px 16px 56px; }
    button { font: inherit; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
    p { margin: 0 0 8px; }
    .kaart { background: var(--kaart); border: 1px solid var(--rand); border-radius: 16px; box-shadow: 0 4px 18px rgba(15, 23, 42, .06); }
    .kaart-binnen { padding: 20px; }
    .grijs { color: var(--zacht); }
    .klein { font-size: .85rem; }
    .verborgen { display: none !important; }
    .katex { font-size: 1.08em; }
    .katex-display { margin: .5em 0; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }

    /* ---------- knoppen ---------- */
    .knop { border: none; border-radius: 12px; padding: 11px 16px; font-weight: 700; transition: background .15s, transform .05s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .knop:active:not(:disabled) { transform: translateY(1px); }
    .knop-groen { background: var(--groen); color: #fff; } .knop-groen:hover:not(:disabled) { background: var(--groen-donker); }
    .knop-rood { background: var(--rood); color: #fff; } .knop-rood:hover:not(:disabled) { background: var(--rood-donker); }
    .knop-blauw { background: var(--blauw); color: #fff; } .knop-blauw:hover:not(:disabled) { background: #172554; }
    .knop-donker { background: #1e293b; color: #fff; } .knop-donker:hover:not(:disabled) { background: #0f172a; }
    .knop-licht { background: #fff; color: var(--tekst); border: 1px solid var(--rand); } .knop-licht:hover:not(:disabled) { background: #f8fafc; }
    .knop-blauw-licht { background: var(--blauw-licht); color: var(--blauw); border: 1px solid var(--blauw-rand); } .knop-blauw-licht:hover:not(:disabled) { background: #dbeafe; }
    .knop-geel { background: #fef9c3; color: #854d0e; border: 1px solid #fde047; } .knop-geel:hover:not(:disabled) { background: #fef08a; }
    .knop-groot { padding: 15px 22px; font-size: 1.08rem; }
    .knop-klein { padding: 7px 11px; font-size: .88rem; border-radius: 9px; }
    .knop-rij { display: flex; flex-wrap: wrap; gap: 10px; }
    .linkknop { background: none; border: none; padding: 0; color: #2563eb; font-weight: 600; text-decoration: underline; }

    /* ---------- menu ---------- */
    .kop { text-align: center; padding: 24px 20px 6px; }
    .kop h1 { color: var(--blauw); font-size: 1.95rem; font-weight: 800; }
    .kop p { margin: 6px 0 0; color: var(--zacht); }
    .naam-rij { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .naam-rij .veld { flex: 1 1 200px; }
    .veld { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; font-weight: 600; color: #475569; }
    .veld input, .veld select { font: inherit; font-weight: 500; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; }
    .modus-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
    .modus { border-radius: 14px; padding: 16px; border: 2px solid var(--rand); background: #fff; text-align: left; display: flex; flex-direction: column; gap: 4px; }
    .modus b { font-size: 1.08rem; }
    .modus span { font-size: .86rem; color: var(--zacht); font-weight: 500; }
    .modus.theorie { border-color: var(--paars-rand); background: var(--paars-licht); } .modus.theorie b { color: var(--paars); }
    .modus.oefen { border-color: var(--groen-rand); background: var(--groen-licht); } .modus.oefen b { color: var(--groen-donker); }
    .modus.toets { border-color: var(--rood-rand); background: var(--rood-licht); } .modus.toets b { color: var(--rood-donker); }
    .modus.aan { box-shadow: 0 0 0 3px rgba(30, 58, 138, .25); }
    /* examentraining en actief leren (2026-11-25) */
    .modus-grid.vier { grid-template-columns: repeat(4, 1fr); }
    .modus.examen { border-color: #fcd34d; background: #fffbeb; } .modus.examen b { color: #b45309; }
    .dagdoel { margin-top: 12px; font-size: .9rem; color: #334155; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .klaar { display: flex; align-items: center; gap: 6px; font-size: .75rem; color: #475569; margin-top: 4px; }
    .klaar-balk { display: inline-block; width: 70px; height: 7px; background: #e2e8f0; border-radius: 4px; overflow: hidden; vertical-align: middle; }
    .klaar-balk.groot { width: 140px; height: 9px; }
    .klaar-balk > span { display: block; height: 100%; }
    .nakerst { display: block; margin-top: 10px; }
    .examen-blok { margin-top: 18px; }
    .ex-uitleg { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 12px; padding: 12px 16px; }
    .ex-uitleg ol { margin: 6px 0; padding-left: 20px; }
    .ex-h { margin: 20px 0 6px; font-size: 1.05rem; }
    table.doelen { width: 100%; border-collapse: collapse; font-size: .9rem; }
    table.doelen td { padding: 7px 6px; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
    td.doel-z { white-space: nowrap; }
    td.doel-r { min-width: 150px; }
    button.zelf { font-size: 1.15rem; padding: 2px 5px; border-radius: 8px; border: 2px solid transparent; background: #f1f5f9; opacity: .55; cursor: pointer; }
    button.zelf.aan { opacity: 1; border-color: #2563eb; background: #dbeafe; }
    .doel-res { display: inline-block; margin: 4px 0 0 6px; padding: 1px 7px; border-radius: 6px; font-size: .78rem; font-weight: 700; }
    .doel-res.goed { background: #dcfce7; color: #166534; } .doel-res.matig { background: #fef3c7; color: #92400e; } .doel-res.zwak { background: #fee2e2; color: #991b1b; }
    .doel-tip { display: block; font-size: .78rem; color: #b91c1c; margin-top: 2px; } .doel-tip.goed { color: #166534; }
    .zeker-rij { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 14px; font-size: .9rem; color: #334155; }
    .zeker-fb { margin-top: 12px; padding: 8px 12px; border-radius: 10px; background: #fef2f2; border: 1px solid #fecaca; font-size: .9rem; }
    .zeker-fb.goed { background: var(--groen-licht); border-color: var(--groen-rand); }
    .sectie-titel { font-size: 1.05rem; color: #334155; margin: 20px 0 10px; font-weight: 800; }
    .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .cat { display: flex; gap: 12px; align-items: flex-start; text-align: left; background: #fff; border: 2px solid var(--rand); border-radius: 14px; padding: 12px 14px; }
    .cat:hover { border-color: #94a3b8; }
    .cat.aan { border-color: var(--blauw); background: var(--blauw-licht); }
    .cat .ico { flex: none; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; font-weight: 800; color: #fff; }
    .cat b { display: block; font-size: .98rem; }
    .cat small { display: block; color: var(--zacht); font-size: .8rem; margin-top: 2px; }
    .cat .stat { display: block; color: var(--groen-donker); font-size: .76rem; margin-top: 4px; font-weight: 700; }
    .keuze-rij { display: flex; flex-wrap: wrap; gap: 8px; }
    .keuze { flex: 1 1 120px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--rand); background: #fff; font-weight: 700; color: #334155; text-align: center; }
    .keuze small { display: block; font-weight: 500; color: var(--zacht); margin-top: 2px; font-size: .78rem; }
    .keuze.aan { border-color: var(--blauw); background: var(--blauw-licht); color: var(--blauw); }
    .instel { background: #f8fafc; border: 1px solid var(--rand); border-radius: 14px; padding: 14px 16px; margin-top: 14px; }
    .instel h3 { font-size: .98rem; color: #334155; margin-bottom: 8px; }
    .types-lijst { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 6px; }
    .type-optie { display: flex; gap: 8px; align-items: flex-start; font-size: .88rem; background: #fff; border: 1px solid var(--rand); border-radius: 10px; padding: 7px 10px; cursor: pointer; }
    .type-optie input { margin-top: 3px; accent-color: var(--groen); }
    .type-optie .niv { margin-left: auto; flex: none; }
    .melding { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--oranje-licht); border: 1px solid var(--oranje-rand); color: var(--oranje-tekst); font-size: .92rem; }

    /* ---------- labels ---------- */
    .label { font-size: .72rem; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: #e2e8f0; color: #334155; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
    .label.n1 { background: #dcfce7; color: #166534; } .label.n2 { background: #fef9c3; color: #854d0e; } .label.n3 { background: #fee2e2; color: #991b1b; }
    .label.pt { background: #e0e7ff; color: #3730a3; }
    .label.ict { background: #f1f5f9; color: #475569; text-transform: none; }
    .label.gg { background: #ede9fe; color: #5b21b6; border: 1px solid #c4b5fd; text-transform: none; }

    /* ---------- oefen- en toetsscherm ---------- */
    .balk { display: flex; align-items: center; gap: 10px; padding: 12px 16px; color: #fff; border-radius: 16px 16px 0 0; flex-wrap: wrap; }
    .balk.oefen { background: #065f46; } .balk.toets { background: #881337; } .balk.theorie { background: #3730a3; }
    .balk h2 { font-size: 1.05rem; flex: 1 1 auto; }
    .balk .terug { background: rgba(255,255,255,.14); color: #fff; border: none; border-radius: 10px; padding: 8px 12px; font-weight: 600; }
    .balk .terug:hover { background: rgba(255,255,255,.25); }
    .teller { background: rgba(255,255,255,.14); border-radius: 999px; padding: 4px 12px; font-size: .86rem; font-weight: 600; white-space: nowrap; }
    .voortgang { height: 6px; background: #fecdd3; }
    .voortgang div { height: 100%; background: var(--rood); transition: width .3s; }
    .niveau-balk { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 16px; background: #f8fafc; border-bottom: 1px solid var(--rand); font-size: .88rem; }
    .niveau-balk .keuze { flex: 0 0 auto; padding: 5px 12px; font-size: .85rem; }
    .opgave { background: #f8fafc; border: 1px solid var(--rand); border-radius: 14px; padding: 14px 16px 16px; }
    .opgave-labels { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
    .opgave-titel { font-weight: 800; color: #334155; margin-right: 4px; }
    .opgave-tekst { font-size: 1.04rem; }
    .opgave-tekst .katex-display { text-align: left; }
    .opgave-tekst .katex-display > .katex { text-align: left; }
    .figuur { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; margin: 8px 0; }
    .figuur svg { max-width: 100%; height: auto; }
    .f-lijst { display: flex; flex-wrap: wrap; gap: 10px 30px; margin: 10px 0; align-items: center; }
    .f-lijst > span { white-space: nowrap; }
    .fig-item { display: flex; flex-direction: column; align-items: center; gap: 2px; max-width: 100%; }
    .fig-item .fig-titel { font-weight: 800; color: #334155; font-size: .9rem; }
    .deel { margin-top: 14px; border: 1px solid var(--rand); border-radius: 14px; padding: 12px 14px; background: #fff; }
    .deel.juist { border-color: var(--groen-rand); background: #fbfffd; }
    .deel.fout { border-color: var(--rood-rand); }
    .deel-kop { display: flex; gap: 8px; align-items: baseline; margin-bottom: 8px; }
    .deel-kop .letter { font-weight: 800; color: var(--blauw); flex: none; }
    .deel-kop .vraag { flex: 1; min-width: 0; }
    .deel-kop .ptn { flex: none; font-size: .78rem; color: var(--zacht); font-weight: 700; }
    .invoer { padding: 10px 12px; font-size: 1.05rem; font-family: ui-monospace, Consolas, monospace; border: 2px solid #cbd5e1; border-radius: 10px; outline: none; background: #fff; min-width: 0; }
    .invoer:focus { border-color: #3b82f6; }
    .invoer:disabled { background: #f1f5f9; color: var(--zacht); }
    .invoer.breed { width: 100%; }
    .invoer.co { width: 92px; text-align: center; }
    select.invoer { font-family: inherit; font-size: .98rem; padding: 7px 10px; }
    .rij { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
    .rij .lbl { font-family: "Times New Roman", serif; font-style: italic; font-size: 1.15rem; font-weight: 700; white-space: nowrap; min-width: 34px; }
    .rij .lbl.normaal { font-style: normal; font-family: inherit; font-size: .95rem; min-width: 0; font-weight: 600; color: #334155; white-space: normal; }
    .rij .haak { font-size: 1.4rem; color: #475569; }
    .rij.vgl .invoer { flex: 1 1 260px; }
    .preview { min-height: 30px; margin-top: 4px; padding: 4px 10px; border: 1px dashed #cbd5e1; border-radius: 10px; background: #fcfdff; font-size: 1.02rem; overflow-x: auto; overflow-y: hidden; }
    .preview:empty { display: none; }
    .preview .lees-fout { color: #b45309; font-size: .88rem; }
    .opties { display: flex; flex-direction: column; gap: 6px; }
    .optie { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border: 2px solid var(--rand); border-radius: 10px; cursor: pointer; background: #fff; }
    .optie:hover { border-color: #94a3b8; }
    .optie input { margin-top: 4px; accent-color: var(--blauw); flex: none; }
    .optie.gekozen { border-color: var(--blauw); background: var(--blauw-licht); }
    .opties.janee { flex-direction: row; flex-wrap: wrap; }
    .opties.janee .optie { flex: 1 1 140px; }
    .koppel-tabel { border-collapse: collapse; width: 100%; }
    .koppel-tabel td { padding: 6px 8px; border-top: 1px solid #f1f5f9; vertical-align: middle; }
    .koppel-tabel td:last-child { width: 1%; white-space: nowrap; }
    .transfo-blok .rij { margin: 8px 0; }
    .transfo-blok .opties.janee { flex: 0 1 260px; }
    .transfo-blok .opties.janee .optie { flex: 1 1 90px; padding: 6px 10px; }
    /* ---------- invultabel voor tekentabel en verloopschema ---------- */
    .tt-blok { margin: 6px 0 2px; }
    .tt-scroll { overflow-x: auto; padding-bottom: 2px; }
    .tt-tabel { border-collapse: collapse; margin: 2px 0; }
    .tt-tabel th { font-family: "Times New Roman", serif; font-style: italic; font-size: 1.15rem; font-weight: 700; padding: 6px 12px 6px 6px; border-right: 2px solid #334155; white-space: nowrap; }
    .tt-tabel tr:first-child > * { border-bottom: 2px solid #334155; }
    .tt-tabel td { padding: 5px 3px; text-align: center; vertical-align: middle; }
    .tt-cel { width: 46px; height: 38px; border: 2px dashed #cbd5e1; border-radius: 9px; background: #f8fafc; font-size: 1.3rem; font-weight: 800; color: #1e293b; line-height: 1; padding: 0; }
    .tt-cel:hover:not(:disabled) { border-color: #3b82f6; background: var(--blauw-licht); }
    .tt-cel.gevuld { border-style: solid; border-color: #93c5fd; background: #fff; }
    .tt-cel.pt { width: 38px; }
    .tt-tabel .invoer.tt-x { width: 70px; padding: 6px 4px; text-align: center; font-size: 1rem; }
    .tt-knoppen { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
    .feedback { margin-top: 10px; padding: 10px 14px; border-radius: 10px; display: flex; gap: 10px; align-items: flex-start; font-size: .96rem; }
    .feedback .ico { font-size: 1.15rem; line-height: 1.2; flex: none; }
    .feedback.juist { background: var(--groen-licht); border: 1px solid var(--groen-rand); color: #065f46; }
    .feedback.fout { background: var(--rood-licht); border: 1px solid var(--rood-rand); color: #9f1239; }
    .feedback.info { background: var(--oranje-licht); border: 1px solid var(--oranje-rand); color: var(--oranje-tekst); }
    .hulp { margin-top: 14px; background: var(--blauw-licht); border: 1px solid var(--blauw-rand); border-radius: 12px; padding: 12px 16px; overflow-x: auto; }
    .hulp h3 { font-size: .98rem; color: var(--blauw); margin-bottom: 6px; }
    .hulp ol { margin: 0; padding-left: 22px; }
    .hulp li { margin: 6px 0; }
    .uitwerking { margin-top: 14px; background: #fff; border: 1px solid var(--paars-rand); border-radius: 12px; padding: 12px 16px; overflow-x: auto; }
    .uitwerking h3 { font-size: .98rem; color: var(--paars); margin-bottom: 6px; }
    .stappen { margin: 0; padding-left: 0; list-style: none; }
    .stappen li { margin: 6px 0; line-height: 1.55; }
    .stappen li.sub { padding-left: 18px; }
    .stappen li.kader { border-top: 1px solid var(--paars-rand); padding-top: 8px; margin-top: 10px; font-weight: 700; color: var(--blauw); }
    .stappen .katex-display { margin: .25em 0; text-align: left; }
    .stappen .katex-display > .katex { text-align: left; }
    .actie-rij { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .actie-rij .knop { flex: 1 1 140px; }
    .werkbalk { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .werkbalk button { border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 7px; padding: 3px 9px; font-size: .9rem; font-family: ui-monospace, Consolas, monospace; color: #334155; }
    .werkbalk button:hover { background: var(--blauw-licht); }
    details.typhulp { margin-top: 14px; border: 1px solid var(--rand); border-radius: 12px; background: #fff; }
    details.typhulp summary { cursor: pointer; padding: 9px 14px; font-weight: 700; color: #334155; font-size: .92rem; }
    details.typhulp .inhoud { padding: 0 14px 12px; font-size: .88rem; }
    .typtabel { width: 100%; border-collapse: collapse; }
    .typtabel td { padding: 4px 6px; border-top: 1px solid #f1f5f9; vertical-align: middle; }
    .typtabel code { background: #f1f5f9; padding: 2px 6px; border-radius: 6px; font-size: .86rem; }
    .sessie { display: flex; gap: 6px; flex-wrap: wrap; font-size: .85rem; color: var(--zacht); margin-top: 12px; align-items: center; }
    .bolletje { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .bolletje.g { background: #10b981; } .bolletje.h { background: #f59e0b; } .bolletje.f { background: #f43f5e; }
    .toets-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .toets-nav button { width: 36px; height: 36px; border-radius: 9px; border: 2px solid var(--rand); background: #fff; font-weight: 700; color: #334155; }
    .toets-nav button.ingevuld { background: #e0e7ff; border-color: #a5b4fc; }
    .toets-nav button.huidig { border-color: var(--rood); }

    /* ---------- feedback van de leerkracht (handgeschreven stijl) ---------- */
    .leerkracht { margin-top: 10px; padding: 10px 16px 8px; border-radius: 12px; background: #fffdf4; border: 1px solid #f2e6c4; border-left: 6px solid #dc2626;
        font-family: 'Patrick Hand', 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive; color: #b91c1c; font-size: 1.15rem; line-height: 1.4; overflow-x: auto; }
    .leerkracht.goed { border-left-color: #059669; color: #047857; }
    .leerkracht p { margin: 4px 0; }
    .lk-kop { font-size: 1.3rem; font-weight: 700; }
    .lk-fout { margin: 2px 0 4px; }
    .lk-fout b { text-decoration: underline wavy #ef4444; text-underline-offset: 5px; text-decoration-thickness: 1px; }
    .lk-rij { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0; }

    const delen = lin.map(({ r, m }) => macht(xmrH(r, v), m)).concat(kw.map(p => L`(${p.tex(v)})`));
    if (!delen.length) return Fr.of(a).tex();
    return coefTex(a) + delen.join('');
}
function factTxt(a, lin, kw = [], v = 'x') {
    const delen = lin.map(({ r, m }) => { const b = Fr.of(r).nul ? v : `(${xmrTxt(r, v)})`; return m === 1 ? b : `${b}^${m}`; }).concat(kw.map(p => `(${p.txt(v)})`));
    if (!delen.length) return Fr.of(a).txt();
    return coefTxt(a) + delen.join('*');
}
function factPoly(a, lin, kw = []) {
    let p = new Poly([Fr.of(a)]);
    lin.forEach(({ r, m }) => { p = p.maal(Poly.xMin(r).macht(m)); });
    kw.forEach(q => { p = p.maal(q); });
    return p;
}
const plusT = (a, b) => `${Fr.of(a).tex()} + ${Fr.of(b).texH()}`;
const minT = (a, b) => `${Fr.of(a).tex()} - ${Fr.of(b).texH()}`;
const maalT = (a, b) => L`${Fr.of(a).tex()} \cdot ${Fr.of(b).texH()}`;
// lijst getallen als tekst voor de invoer
const lijstTxt = arr => arr.length ? arr.map(x => (x instanceof Fr ? x.txt() : String(x))).join(' ; ') : 'geen';
const lijstTex = arr => arr.length ? arr.map(x => (x instanceof Fr ? x.tex() : mooi(x))).join(' ;\\ ') : L`\text{geen}`;

// ---------- tekentabellen en verloopschema's ----------
const TT_TEX = { '+': '+', '-': '-', '0': '0', '|': L`\big|`, '/': L`\text{/\!/\!/}` };
// tokens: '+', '-', '0', '|', '/' ; xs: tex van de x-waarden
function ttTex(xs, rijen) {
    const n = xs.length;
    const kop = ['x', ...xs.flatMap(x => ['', x]), ''].join(' & ');
    const r = rijen.map(({ label, tokens }) => [label, ...tokens.map(t => TT_TEX[t] || t)].join(' & '));
    return L`\begin{array}{c|${'c'.repeat(2 * n + 1)}} ${kop} \\ \hline ${r.join(L` \\ `)} \end{array}`;
}
// teken van een (numerieke) functie op elk interval tussen de kritieke x-waarden; op de x-waarden het opgegeven symbool
function tekenTokens(f, xs, symbolen) {
    const t = [];
    const xv = xs.map(x => (x instanceof Fr ? x.v : x));
    const proef = i => {
        if (!xv.length) return 0;
        if (i === 0) return xv[0] - 1;
        if (i === xv.length) return xv[xv.length - 1] + 1;
        return (xv[i - 1] + xv[i]) / 2;
    };
    for (let i = 0; i <= xv.length; i++) {
        const y = +f(proef(i));
        t.push(Number.isFinite(y) ? (y > 0 ? '+' : '-') : '/');
        if (i < xv.length) t.push(symbolen[i]);
    }
    return t;
}
const PIJL = { up: L`\nearrow`, down: L`\searrow` };
// verloopschema: tokens afwisselend pijl ('up'/'down') en waarde (tex) of '|'
function verloopTex(xs, tokens, fnaam = 'f(x)', extra = null) {
    const n = xs.length;
    const kop = ['x', ...xs.flatMap(x => ['', x]), ''].join(' & ');
    const rij = [fnaam, ...tokens.map(t => PIJL[t] || (t === '|' ? L`\big|` : t))].join(' & ');
    const r3 = extra ? L` \\ & ${extra.join(' & ')}` : '';
    return L`\begin{array}{c|${'c'.repeat(2 * n + 1)}} ${kop} \\ \hline ${rij}${r3} \end{array}`;
}

// ---------- Horner en staartdeling in de uitwerking ----------
function hornerTex(h) {
    const n = h.rij1.length;
    const r1 = ['', ...h.rij1.map(x => x.tex())].join(' & ');
    const r2 = [h.a.tex(), L`\downarrow`, ...h.rij2.slice(1).map(x => x.tex())].join(' & ');
    const r3 = ['', ...h.rij3.slice(0, -1).map(x => x.tex()), h.r.tex()].join(' & ');
    return L`\begin{array}{r|${'r'.repeat(n - 1)}|r} ${r1} \\ ${r2} \\ \hline ${r3} \end{array}`;
}
// staartdeling als tabel met een kolom per macht
function staartdelingTex(f, d, res) {
    const g = f.graad;
    const kol = k => g - k;               // kolomindex van x^k
    const term = (c, k, eerste) => {
        c = Fr.of(c);
        const neg = c.n < 0, a = c.abs();
        const xs = k === 0 ? '' : k === 1 ? 'x' : `x^{${k}}`;
        const body = k === 0 ? a.tex() : (a.gelijk(1) ? xs : a.tex() + xs);
        return (eerste ? (neg ? '-' : '') : (neg ? '-' : '+')) + body;
    };
    // alle termen (≠ 0) van p in hun kolom; bij een productrij een doorlopende streep eronder
    const cellen = (p, onder = false) => {
        const cel = Array(g + 1).fill('');
        if (p.isNul) { cel[g] = '0'; return cel; }
        let eerste = true;
        for (let k = p.graad; k >= 0; k--) { const c = p.co(k); if (c.nul) continue; cel[kol(k)] = term(c, k, eerste); eerste = false; }
        if (!onder) return cel;
        const van = kol(p.graad), tot = Math.max(...cel.map((x, j) => x ? j : -1));
        return cel.map((x, j) => j >= van && j <= tot ? L`\underline{${x || L`\phantom{+0}`}}` : x);
    };
    const rijen = [['', ...cellen(f), L`\;\big|\;\; ${d.tex()}`]];
    res.st.forEach((s, i) => {
        rijen.push(['-', ...cellen(s.prod, true), i === 0 ? L`\;\big|\;\; \overline{${res.q.tex()}}` : '']);
        rijen.push(['', ...cellen(s.na), '']);
    });
    return L`\begin{array}{c${'r'.repeat(g + 1)}l} ${rijen.map(r => r.join(' & ')).join(L` \\ `)} \end{array}`;
}

// ---------- HTML en KaTeX ----------
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
let KATEX_STRIKT = false;     // tijdens de zelftest: fouten in LaTeX melden
function kt(tex, disp = false) {
    if (window.katex) {
        try { return katex.renderToString(tex, { displayMode: disp, throwOnError: KATEX_STRIKT, strict: 'ignore' }); }
        catch (e) { if (KATEX_STRIKT) throw e; }
    }
    return `<code>${esc(tex)}</code>`;
}
// HTML met $...$ (inline) en $$...$$ (display) omzetten naar KaTeX
function wis(s) {
    if (s == null) return '';
    s = String(s);
    let out = '', i = 0;
    while (i < s.length) {
        const j = s.indexOf('$', i);
        if (j < 0) { out += s.slice(i); break; }
        out += s.slice(i, j);
        const disp = s[j + 1] === '$';
        const w = disp ? 2 : 1;
        const k = s.indexOf(disp ? '$$' : '$', j + w);
        if (k < 0) { out += s.slice(j); break; }
        out += kt(s.slice(j + w, k), disp);
        i = k + w;
    }
    return out;
}

// ---------- grafieken (SVG) ----------
let SVG_TELLER = 0;
// o: { xmin, xmax, ymin, ymax, b (breedte px), h, gx, gy (rasterstap), lx, ly (stap getallen),
//      krommen: [{ f | pts | param, van, tot, kleur, stippel, naam }], punten: [{x, y, open, kleur}],
//      va: [x...], ha: [y...] (asymptoten in stippellijn), asLabels: true }
function svgGrafiek(o) {
    const id = 'clip' + (++SVG_TELLER);
    const { xmin, xmax, ymin, ymax } = o;
    const W = o.b || 300;
    const sx = W / (xmax - xmin);
    const H = o.h || Math.round((ymax - ymin) * sx);
    const sy = H / (ymax - ymin);
    const X = x => +((x - xmin) * sx).toFixed(2), Y = y => +((ymax - y) * sy).toFixed(2);
    const gx = o.gx || 1, gy = o.gy || 1, lx = o.lx || (gx * Math.max(1, Math.ceil(26 / (gx * sx)))), ly = o.ly || (gy * Math.max(1, Math.ceil(18 / (gy * sy))));
    const pl = 22, pr = 14, pt = 14, pb = 20;
    let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-pl} ${-pt} ${W + pl + pr} ${H + pt + pb}" width="${W + pl + pr}" height="${H + pt + pb}" font-family="Arial, Helvetica, sans-serif" role="img">`;
    s += `<defs><clipPath id="${id}"><rect x="0" y="0" width="${W}" height="${H}"/></clipPath></defs>`;
    s += `<rect x="0" y="0" width="${W}" height="${H}" fill="#ffffff" stroke="#cbd5e1"/>`;
    for (let x = Math.ceil(xmin / gx - 1e-9) * gx; x <= xmax + 1e-9; x += gx) s += `<line x1="${X(x)}" y1="0" x2="${X(x)}" y2="${H}" stroke="#e2e8f0" stroke-width="1"/>`;
    for (let y = Math.ceil(ymin / gy - 1e-9) * gy; y <= ymax + 1e-9; y += gy) s += `<line x1="0" y1="${Y(y)}" x2="${W}" y2="${Y(y)}" stroke="#e2e8f0" stroke-width="1"/>`;
    const ax = ymin <= 0 && ymax >= 0 ? Y(0) : (ymin > 0 ? H : 0);
    const ay = xmin <= 0 && xmax >= 0 ? X(0) : (xmin > 0 ? 0 : W);
    s += `<line x1="0" y1="${ax}" x2="${W + 8}" y2="${ax}" stroke="#334155" stroke-width="1.4"/><path d="M ${W + 8} ${ax} l -6 -3.5 v 7 z" fill="#334155"/>`;
    s += `<line x1="${ay}" y1="${H}" x2="${ay}" y2="-8" stroke="#334155" stroke-width="1.4"/><path d="M ${ay} -8 l -3.5 6 h 7 z" fill="#334155"/>`;
    s += `<text x="${W + 4}" y="${ax - 6}" font-size="12" font-style="italic" fill="#334155">${esc(o.xNaam || 'x')}</text><text x="${ay + 6}" y="-2" font-size="12" font-style="italic" fill="#334155">${esc(o.yNaam || 'y')}</text>`;
    const fmt = v => String(+v.toFixed(6)).replace('.', ',').replace('-', '−');
    for (let x = Math.ceil(xmin / lx - 1e-9) * lx; x <= xmax + 1e-9; x += lx) if (Math.abs(x) > 1e-9 && X(x) < W - 4) s += `<text x="${X(x)}" y="${ax + 13}" font-size="10.5" text-anchor="middle" fill="#475569">${fmt(x)}</text>`;
    for (let y = Math.ceil(ymin / ly - 1e-9) * ly; y <= ymax + 1e-9; y += ly) if (Math.abs(y) > 1e-9 && Y(y) > 6) s += `<text x="${ay - 4}" y="${Y(y) + 3.5}" font-size="10.5" text-anchor="end" fill="#475569">${fmt(y)}</text>`;
    if (xmin <= 0 && xmax >= 0 && ymin <= 0 && ymax >= 0) s += `<text x="${ay - 4}" y="${ax + 13}" font-size="10.5" text-anchor="end" fill="#475569">0</text>`;
    (o.va || []).forEach(x => { s += `<line x1="${X(x)}" y1="0" x2="${X(x)}" y2="${H}" stroke="${o.asKleur || '#f97316'}" stroke-width="1.6" stroke-dasharray="6 4"/>`; });
    (o.ha || []).forEach(y => { s += `<line x1="0" y1="${Y(y)}" x2="${W}" y2="${Y(y)}" stroke="${o.asKleur || '#f97316'}" stroke-width="1.6" stroke-dasharray="6 4"/>`; });
    const KL = ['#16a34a', '#2563eb', '#dc2626', '#9333ea'];
    const rng = ymax - ymin;
    (o.krommen || []).forEach((k, ki) => {
        const kleur = k.kleur || KL[ki % KL.length];
        let d = '';
        const voeg = (pts) => {
            let pen = false, vorige = null;
            for (const p of pts) {
                const ok = p && Number.isFinite(p[0]) && Number.isFinite(p[1]) && Math.abs(p[1]) < 1e7;
                if (!ok) { pen = false; vorige = null; continue; }
                let [x, y] = p;
                if (vorige && ((vorige[1] > ymax + rng && y < ymin - rng) || (vorige[1] < ymin - rng && y > ymax + rng))) pen = false;
                const yc = Math.max(ymin - 3 * rng, Math.min(ymax + 3 * rng, y));
                d += (pen ? ' L ' : ' M ') + X(x) + ' ' + Y(yc);
                pen = true; vorige = [x, y];
            }
        };
        if (k.f) {
            const a = k.van ?? xmin, b = k.tot ?? xmax, N = k.N || 600;
            const pts = [];
            for (let i = 0; i <= N; i++) { const x = a + (b - a) * i / N; let y; try { y = +k.f(x); } catch (e) { y = NaN; } pts.push([x, y]); }
            voeg(pts);
        } else if (k.param) {
            const N = k.N || 400, pts = [];
            for (let i = 0; i <= N; i++) { const t = k.t0 + (k.t1 - k.t0) * i / N; pts.push(k.param(t)); }
            voeg(pts);
        } else if (k.pts) voeg(k.pts);
        s += `<path d="${d.trim()}" fill="none" stroke="${kleur}" stroke-width="${k.dik || 2.3}" stroke-linejoin="round" stroke-linecap="round" ${k.stippel ? 'stroke-dasharray="6 4"' : ''} clip-path="url(#${id})"/>`;
        if (k.naam) {
            const lx0 = k.naamX ?? (k.tot ?? xmax) - 0.4;
            let ly0 = k.naamY;
            if (ly0 === undefined && k.f) { try { ly0 = +k.f(lx0); } catch (e) { ly0 = 0; } }
            if (Number.isFinite(ly0)) s += `<text x="${X(Math.min(xmax - 0.2, lx0))}" y="${Math.max(10, Math.min(H - 4, Y(ly0) - 6))}" font-size="13" font-weight="bold" font-style="italic" fill="${kleur}" text-anchor="end">${esc(k.naam)}</text>`;
        }
    });
    (o.punten || []).forEach(p => {
        const kleur = p.kleur || '#16a34a';
        if (p.x < xmin - 1e-9 || p.x > xmax + 1e-9 || p.y < ymin - 1e-9 || p.y > ymax + 1e-9) return;
        s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${p.r || 3.8}" fill="${p.open ? '#ffffff' : kleur}" stroke="${kleur}" stroke-width="1.8"/>`;
        if (p.label) s += `<text x="${X(p.x) + 6}" y="${Y(p.y) - 6}" font-size="11.5" font-weight="bold" fill="#1e293b">${esc(p.label)}</text>`;
    });
    return s + '</svg>';
}
// rasterstap kiezen zodat er ongeveer 'doel' lijnen zijn
function mooieStap(bereik, doel = 8) {
    const ruw = bereik / doel;
    for (const s of [0.5, 1, 2, 5, 10, 20, 25, 50, 100, 200, 500]) if (s >= ruw) return s;
    return 1000;
}
// formules (of tabellen) naast elkaar die op een smal scherm naar de volgende regel gaan
const fLijst = items => `<div class="f-lijst">${items.map(t => `<span>$\\displaystyle ${t}$</span>`).join('')}</div>`;
// figuren naast elkaar met een titel
function figRij(items) { return items.map(it => `<div class="fig-item">${it.titel ? `<div class="fig-titel">${it.titel}</div>` : ''}${it.svg}</div>`).join(''); }
</script>

     ===================================================================== -->
<script>
const Ontleder = (() => {
    class LeesFout extends Error { constructor(m) { super(m); this.leesfout = true; } }
    class DelingDoorNul extends Error { constructor() { super('deling door 0'); this.deling = true; } }

    function normaliseer(s) {
        return String(s)
            .replace(/[−–—‒]/g, '-')
            .replace(/\*\*/g, '^')
            .replace(/[·×⋅∙•]/g, '*')
            .replace(/[÷:]/g, '/')
            .replace(/(root|wortel)\s*\(\s*([^,;()]+?)\s*[,;]/gi, (m, f, n) => ` root ( ${n} # `)
            .replace(/∛/g, ' rootdrie ').replace(/∜/g, ' rootvier ')

            .replace(/[\[{]/g, '(').replace(/[\]}]/g, ')')
            .replace(/[A-Z]/g, c => c.toLowerCase());

            if ((m = /^rootdrie/.exec(rest))) { out.push({ t: 'fn', k: 3 }); i += m[0].length; continue; }
            if ((m = /^rootvier/.exec(rest))) { out.push({ t: 'fn', k: 4 }); i += m[0].length; continue; }
            if ((m = /^root/.exec(rest))) { out.push({ t: 'rootn' }); i += m[0].length; continue; }
            if ((m = /^(sqrt|wortel|wrt)/.exec(rest))) { out.push({ t: 'fn', k: 2 }); i += m[0].length; continue; }

            let a = term();
            while (kijk() && (kijk().t === '+' || kijk().t === '-')) {

            }

        }

                if (k.t === '*' || k.t === '/') { neem(); const b = unair(); a = { t: k.t === '*' ? 'mul' : 'div', a, b }; continue; }

        const delen = [expr()];
        while (kijk() && kijk().t === '=') {
            neem();
            if (!kijk()) throw new LeesFout('Er staat niets na het =-teken.');
            delen.push(expr());
        }
        if (p < tk.length) {
            const k = kijk();
            throw new LeesFout(k.t === ')' ? 'Er staat een haakje ")" te veel.' : `Het teken "${k.t === 'num' ? k.s : (k.v || k.t)}" staat op een verkeerde plaats.`);
        }
        return delen;
    }
    function letters(n, set = new Set()) {
        if (n.t === 'var') set.add(n.n);
        if (n.a) letters(n.a, set);
        if (n.b) letters(n.b, set);
        if (n.k) letters(n.k, set);
        return set;
    }

function strip(s) { return String(s ?? '').replace(/^\s*(?:[a-zA-Z](?:_?[a-zA-Z0-9]{1,2})?\s*\(\s*[a-zA-Z0-9]{1,2}\s*\)|[a-zA-Z](?:_?\d)?|y)\s*=(?!=)\s*/, ''); }
// getal zoals een leerling het typt: zonder %, €, "euro" en met duizendtallen (13 439,16 of 16.971,12)
function schoonGetal(s) {
    s = strip(String(s ?? '')).replace(/%|€|\beuro\b|\beur\b/gi, '').trim();
    if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '');
    return s.replace(/(\d)\s+(?=\d{3}(?!\d))/g, '$1');
}
function leesUitdr(str, vars = ['x']) {
    const s = strip(str);

    const d = Ontleder.ontleed(s);
    if (d.length !== 1) throw new LeesFout('Typ enkel de uitdrukking, zonder extra =-teken.');
    const vreemd = [...Ontleder.letters(d[0])].filter(l => !vars.includes(l));
    if (vreemd.length) throw new LeesFout(`De letter${vreemd.length > 1 ? 's' : ''} ${vreemd.join(', ')} ${vreemd.length > 1 ? 'horen' : 'hoort'} hier niet. Gebruik enkel ${vars.join(', ')}.`);
    return d[0];
}
function numF(ast, vars = ['x']) {
    return (...args) => {

        try { const y = Ontleder.waarde(ast, env); return Number.isFinite(y) ? y : NaN; }
        catch (e) { if (e.leesfout) throw e; return NaN; }
    };
}
const TESTX = [-7.3, -5.6, -3.37, -2.21, -1.43, -0.71, 0.53, 1.27, 2.09, 2.83, 3.61, 4.47, 5.3, 6.7, 8.2, 9.9, 12.4];
const TESTX_POS = [0.37, 0.81, 1.33, 2.17, 3.71, 5.13, 7.9];
function gelijkwaardig(fa, fb, d) {
    const vars = d.vars || ['x'];
    const pts = vars.length === 1 ? (d.testx || (d.positief ? TESTX_POS : TESTX)).map(x => [x]) : [[0.37, 1.61], [1.33, 0.71], [2.17, 3.07], [0.83, 2.41], [3.71, 1.19]];
    let geldig = 0;
    for (const p of pts) {
        const b = fb(...p);
        if (!Number.isFinite(b)) continue;
        const a = fa(...p);
        if (!Number.isFinite(a) || Math.abs(a - b) > (d.reltol || 1e-7) * Math.max(1, Math.abs(b))) return false;

// lijst van factoren van een product (met hun exponent)

    switch (n.t) {
        case 'par': return factorLijst(n.a, m, out);
        case 'neg': out.push({ c: true }); return factorLijst(n.a, m, out);
        case 'mul': factorLijst(n.a, m, out); factorLijst(n.b, m, out); return out;
        case 'pow': if (Ontleder.letters(n.b).size === 0) { const e = Ontleder.waarde(n.b, {}); if (Number.isInteger(e) && e >= 1) return factorLijst(n.a, m * e, out); } break;
        case 'div': if (Ontleder.letters(n.b).size === 0) { out.push({ c: true }); return factorLijst(n.a, m, out); } break;
    }
    if (Ontleder.letters(n).size === 0) { out.push({ c: true }); return out; }

// graad van een veelterm (numeriek met differenties), null als het geen veelterm is
function graadVan(f) {

    let rij = y, g = 0, schaal = Math.max(1, ...y.map(Math.abs));

        rij = rij.slice(1).map((v, i) => v - rij[i]);
        if (rij.every(v => Math.abs(v) <= 1e-7 * schaal)) return g;
        g = k;

}
function vormControle(d, ast) {
    const v = d.vorm;
    if (!v) return null;
    if (v === 'ontbonden') {
        let lin = 0;
        for (const f of factorLijst(ast)) {
            if (f.c) continue;
            const fn = numF(f.ast, d.vars || ['x']);
            const g = graadVan(fn);
            if (g === null || g > 2) return { msg: 'Je antwoord is juist, maar nog niet volledig ontbonden: er staat nog een factor van de derde graad of hoger in.' };
            if (g === 1) lin += f.m;
            if (g === 2) {
                const y0 = fn(0), y1 = fn(1), y2 = fn(2), a = (y2 - 2 * y1 + y0) / 2, b = y1 - y0 - a, c = y0;
                if (b * b - 4 * a * c >= -1e-9) return { msg: L`Je antwoord is juist, maar nog niet volledig ontbonden: de factor $${Ontleder.tex(f.ast)}$ heeft nulwaarden ($D \ge 0$) en kan je dus nog ontbinden.` };
            }

        if (lin < (d.lin || 0)) return { msg: 'Je antwoord is juist, maar nog niet volledig ontbonden.' };
        return null;
    }
    if (v === 'eenvoudig') {
        for (const x of d.vars || ['x']) {

        const fractExp = (function z(k) { if (k.t === 'pow' && Ontleder.letters(k.b).size === 0) { const e = Ontleder.waarde(k.b, {}); if (!Number.isInteger(e)) return true; } return !!((k.a && z(k.a)) || (k.b && z(k.b)) || (k.k && z(k.k))); })(ast);

        if (Ontleder.bevatSoort(ast, ['root', 'sqrt'])) return { msg: 'Je antwoord is juist, maar noteer het als een macht met een rationale exponent, zonder wortelteken.' };

// homografische functie? (ax + b)/(x + d) passen door 3 punten en controleren op andere punten
function homografischFit(f) {
    const xs = [-2.7, -1.3, 0.6, 1.9, 3.4, 4.8, -4.1, 5.9].map(x => [x, f(x)]).filter(p => Number.isFinite(p[1]));
    if (xs.length < 6) return null;
    const [p1, p2, p3] = xs;
    // a x + b - d y = x y
    const M = [p1, p2, p3].map(([x, y]) => [x, 1, -y]), R = [p1, p2, p3].map(([x, y]) => x * y);
    const det = m => m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1]) - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0]) + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
    const D0 = det(M);
    if (Math.abs(D0) < 1e-12) return null;
    const sol = [0, 1, 2].map(j => det(M.map((r, i) => r.map((v, k) => (k === j ? R[i] : v)))) / D0);
    const [a, b, dd] = sol;
    for (const [x, y] of xs.slice(3)) { const z = (a * x + b) / (x + dd); if (!Number.isFinite(z) || Math.abs(z - y) > 1e-6 * Math.max(1, Math.abs(y))) return null; }
    if (Math.abs(a * dd - b) < 1e-9) return null;
    return { a, b, c: 1, d: dd };

function wortelIndex(f, c) {
    const y1 = f(c + 1);
    if (!Number.isFinite(y1) || Math.abs(y1) < 1e-12) return null;
    if (!(Math.abs(f(c)) < 1e-9)) return null;
    for (let n = 2; n <= 9; n++) {
        const ok = [16, 81, 0.25, 7].every(t => bijna(f(c + t), y1 * Math.pow(t, 1 / n), 1e-7));
        if (!ok) continue;
        if (n % 2 && !bijna(f(c - 8), -y1 * Math.pow(8, 1 / n), 1e-7)) continue;
        if (n % 2 === 0 && Number.isFinite(f(c - 1))) continue;
        return n;
    }
    return null;
}

const TYPES = {};

// ---------- getal (exact of voldoende nauwkeurig afgerond), eventueel "bestaat niet" ----------
TYPES.getal = {
    velden: d => [{ soort: 'tekst', key: 'g', label: d.label || '', ph: d.ph || (d.kanNiet ? 'bv. -3, 2/5 of "bestaat niet"' : 'bv. -3, 2/5 of 1,732'), pv: 'getal', smal: true }],
    controleer(d, w) {
        const s = String(w.g ?? '').trim();
        if (!s) throw new LeesFout('Vul een antwoord in.');
        if (d.kanNiet && NIET_BESTAAN.test(s)) {
            if (d.juist === null) return OK('Juist! ' + (d.nietUitleg || ''));
            return NOK(d.welBestaanMsg || 'Dit bestaat wel: bereken de waarde.', d.welBestaanCode || 'wortel_even');
        }
        const g = leesGetal(schoonGetal(s));
        if (d.juist === null) return NOK(d.nietMsg || 'Dit bestaat niet in $\\mathbb{R}$.', d.nietCode || 'wortel_even');
        // juist, of een andere aanvaarde waarde (bv. gerekend met een afgeronde groeifactor); tol = toegelaten afwijking
        for (const j of [d.juist, ...(d.ookOK || [])]) {
            const st = getalOK(g, j);
            if (st === 'exact') return OK('Juist!');
            const binnen = d.tol !== undefined && Math.abs(g.v - j) <= d.tol + 1e-12;
            if (st === 'afgerond' || binnen) {
                if (d.dec && g.dec < d.dec) return NOK(`Bijna: rond af op ${d.dec} decimalen.`, 'afronding', { score: d.punten / 2 });
                return OK(`Juist (afgerond). Exacte waarde: $${d.juistTexKaal}$`);
            }
        }
        if (d.bereik && g.v >= d.bereik[0] - 1e-9 && g.v <= d.bereik[1] + 1e-9) return OK('Juist!');
        for (const f of d.fouten || []) if (getalOK(g, f.w)) return NOK(f.msg, f.code || 'rekenfout');
        if (g.dec >= 1 && Math.abs(g.v - d.juist) < Math.pow(10, -g.dec)) return NOK(`Bijna, maar niet nauwkeurig genoeg. Geef de exacte waarde of rond af op ${d.dec || 3} decimalen.`, 'afronding');
        if (Math.abs(d.juist) > 1e-12 && bijna(g.v, -d.juist)) return NOK('Bijna: het teken is niet juist.', 'teken');
        return NOK('Niet juist.' + (d.tip ? ' ' + d.tip : ''), d.code || 'rekenfout');
    },
    toon: (d, w) => (d.label ? d.label + ' ' : '') + (d.kanNiet && NIET_BESTAAN.test(String(w.g)) ? L`\text{bestaat niet}` : leesGetal(schoonGetal(w.g)).tex + (d.na || '')),
    invoer: d => ({ g: d.juistTxt }),
};

// ---------- verzameling getallen (nulwaarden, oplossingen) ----------
TYPES.getallen = {
    velden: d => [{ soort: 'tekst', key: 'g', label: d.label || '', ph: d.ph || 'bv. -2 ; 3 ; 1/2   (of: geen)', pv: 'lijst' }],
    controleer(d, w) {
        const l = leesLijst(w.g);
        const uniek = []; l.forEach(g => { if (!uniek.some(u => bijna(u.v, g.v, 1e-10))) uniek.push(g); });
        const J = d.juist;
        const pas = (g, j) => getalOK(g, j);

        }

            const fw = f.w.map(x => (x instanceof Fr ? x.v : x));

        if (J.length === uniek.length && J.every(j => uniek.some(g => bijna(g.v, -j, 1e-9))) && J.some(j => Math.abs(j) > 1e-9)) return NOK('Je tekens zijn omgekeerd. Bij een factor $(x - a)$ hoort de nulwaarde $a$: bij $(x + 3)$ is dat $-3$.', 'teken');

        const score = d.deelscore === false ? 0 : Math.max(0, d.punten * (gevonden.length - extra.length) / J.length);
        const teVeel = extra.length === 1 ? 'staat één getal te veel' : `staan ${extra.length} getallen te veel`;
        let msg;
        if (gevonden.length === J.length) msg = `Alle ${d.wat || 'getallen'} staan erbij, maar er ${teVeel}.`;
        else if (J.length === 1) msg = 'Niet juist.' + (extra.length > 1 ? ' Er hoort maar één getal.' : '');
        else msg = `${gevonden.length} van de ${J.length} ${d.wat || 'getallen'} ${gevonden.length === 1 ? 'is' : 'zijn'} juist${extra.length ? ` en er ${teVeel}` : ''}.`;
        return NOK(msg + (d.tip ? ' ' + d.tip : ''), d.code || 'rekenfout', { score: Math.round(score * 2) / 2 });
    },
    toon: (d, w) => { const l = leesLijst(w.g); return (d.label ? d.label + ' ' : '') + (l.length ? l.map(g => g.tex).join(' ;\\ ') : L`\text{geen}`); },
    invoer: d => ({ g: d.juistTxt }),
};

// ---------- uitdrukking / voorschrift (gelijkwaardig + eventueel een vorm) ----------
TYPES.uitdr = {
    velden: d => [{ soort: 'tekst', key: 'u', label: d.label || '', ph: d.ph || 'bv. 3x^2 - 2x + 1', pv: 'uitdr' }],
    controleer(d, w) {
        const vars = d.vars || ['x'];
        const ast = leesUitdr(w.u, vars);
        const fs = numF(ast, vars);
        const fj = d._fj || (d._fj = numF(Ontleder.ontleed(d.juistTxt)[0], vars));
        if (gelijkwaardig(fs, fj, d)) {
            const v = vormControle(d, ast);
            if (v) return NOK(v.msg, d.vormCode || (d.vorm === 'ontbonden' ? 'ontbinding' : d.vorm === 'eenvoudig' ? 'vereenvoudig' : 'vorm'), { score: d.punten / 2 });
            return OK(d.okMsg || 'Juist!');
        }
        for (const t of d.alt || []) if (gelijkwaardig(fs, numF(Ontleder.ontleed(t)[0], vars), d)) return OK(d.okMsg || 'Juist!');
        for (const f of d.fouten || []) {
            const ff = f._f || (f._f = numF(Ontleder.ontleed(f.txt)[0], vars));
            if (gelijkwaardig(fs, ff, d)) return NOK(f.msg, f.code || 'rekenfout', { score: f.score ? f.score * d.punten : 0 });
        }
        if (gelijkwaardig(fs, (...a) => -fj(...a), d)) return NOK('Bijna: het teken van je antwoord is omgekeerd.', 'teken');
        return NOK('Niet juist.' + (d.tip ? ' ' + d.tip : ''), d.code || 'rekenfout');
    },
    toon: (d, w) => (d.label ? d.label + ' ' : '') + Ontleder.tex(leesUitdr(w.u, d.vars || ['x'])),
    invoer: d => ({ u: d.juistTxt }),
};

// ---------- vrij voorschrift dat aan voorwaarden moet voldoen ----------
TYPES.vrij = {
    velden: d => [{ soort: 'tekst', key: 'u', label: d.label || 'f(x) =', ph: d.ph || 'bv. (2x - 2)/(x + 4)', pv: 'uitdr' }],
    controleer(d, w) {
        const ast = leesUitdr(w.u, ['x']);
        const f = numF(ast, ['x']);
        if (d.vorm === 'homografisch' && !homografischFit(f)) return NOK(L`Dit is geen homografische functie: het voorschrift moet de vorm $\frac{ax + b}{cx + d}$ hebben (met $c \neq 0$ en $ad - bc \neq 0$).`, 'homografisch');
        if (d.vorm === 'wortel' && !wortelIndex(f, d.c)) return NOK(L`Dit voorschrift heeft niet de gevraagde vorm $a \cdot \sqrt[n]{x - c}$.`, 'vorm');
        const mis = d.checks.filter(ch => { try { return !ch.test(f); } catch (e) { return true; } });
        if (!mis.length) return OK(d.okMsg || 'Juist! Je voorschrift voldoet aan alle voorwaarden.');
        const score = Math.floor(2 * d.punten * (d.checks.length - mis.length) / d.checks.length) / 2;
        return NOK('Je voorschrift voldoet niet aan alle voorwaarden. ' + mis.map(m => m.msg).join(' '), mis[0].code || 'voorwaarde', { score });
    },
    toon: (d, w) => (d.label ? d.label + ' ' : 'f(x) = ') + Ontleder.tex(leesUitdr(w.u, ['x'])),
    invoer: d => ({ u: d.voorbeeldTxt }),
};

// ---------- verzameling (domein, bereik, oplossing van een ongelijkheid) ----------
TYPES.verz = {
    velden: d => [{ soort: 'tekst', key: 'v', label: d.label || '', ph: d.ph || 'bv. ]-inf, 2] U [3, +inf[   of   IR \\ {1}', pv: 'verz' }],
    controleer(d, w) {
        const S = leesVerz(w.v);
        const J = d._J || (d._J = leesVerz(d.juistTxt));
        const v = vzVergelijk(S, J);
        if (v.gelijk) return OK('Juist!');
        for (const f of d.fouten || []) {
            const Fv = f._v || (f._v = leesVerz(f.txt));
            if (vzVergelijk(S, Fv).gelijk) return NOK(f.msg, f.code || 'interval', { score: f.score ? f.score * d.punten : 0 });
        }
        const U = d._U || (d._U = d.universum ? leesVerz(d.universum) : VZ.iv(-Infinity, Infinity, false, false, '', ''));
        const comp = vzVergelijk(S, VZ.dif(U, J));
        if ((comp.gelijk || comp.alleenGrenzen) && !vzVergelijk(J, VZ.leeg()).gelijk) return NOK('Je hebt precies de andere intervallen genomen. Kijk goed naar het gevraagde teken (en naar het teken van de hoogstegraadscoëfficiënt).', 'teken_omgekeerd');
        if (v.alleenGrenzen) {
            const uit = (d.uitgesloten || []).map(x => (x instanceof Fr ? x.v : x));
            const extraUit = v.extra.filter(p => uit.some(u => bijna(u, p.x, 1e-10)));
            if (extraUit.length && extraUit.length === v.extra.length && !v.mis.length) return NOK(d.uitMsg || `Je vergat $${extraUit.map(p => mooi(p.x)).join(';\\ ')}$ uit te sluiten (daar bestaat de functie niet).`, d.uitCode || 'nulw_noemer', { score: d.punten / 2 });
            const delen = [];
            if (v.mis.length) delen.push(`$${v.mis.map(p => mooi(p.x)).join(';\\ ')}$ hoort er wel bij`);
            if (v.extra.length) delen.push(`$${v.extra.map(p => mooi(p.x)).join(';\\ ')}$ hoort er niet bij`);
            return NOK('Bijna! Kijk nog eens naar de grenzen: ' + delen.join(' en ') + '.', 'haakjes', { score: d.punten / 2 });
        }
        return NOK('Niet juist.' + (d.tip ? ' ' + d.tip : ''), d.code || 'interval');
    },
    toon: (d, w) => (d.label ? d.label + ' ' : '') + vzTex(leesVerz(w.v)),
    invoer: d => ({ v: d.juistTxt }),
};

// ---------- tekentabel ----------
TYPES.tt = {
    velden: d => [{ soort: 'ttabel', modus: 'tt', fnaam: d.fnaam || 'f(x)', metNiet: d.metNiet }],
    controleer(d, w) {
        if (!String(w.x ?? '').trim() && !String(w.t ?? '').trim()) throw new LeesFout('Vul de tabel in.');
        if (/\?/.test(w.x ?? '')) throw new LeesFout('Vul alle x-waarden bovenaan de tabel in (of verwijder een kolom).');
        if (/\?/.test(w.t ?? '')) throw new LeesFout('Vul alle vakjes van de tekenrij in: klik op een vakje om + of − te kiezen, onder een x-waarde 0 of |.');
        const xs = leesXwaarden(w.x);
        const t = leesTekenrij(w.t);
        const J = d.xs.map(x => (x instanceof Fr ? x.v : x));
        const okX = xs.length === J.length && xs.every((g, i) => getalOK(g, J[i]));
        if (!okX) {
            const mist = J.filter(j => !xs.some(g => getalOK(g, j)));
            const teveel = xs.filter(g => !J.some(j => getalOK(g, j)));
            const pol = (d.polen || []).map(x => (x instanceof Fr ? x.v : x));
            if (mist.length && mist.every(m => pol.some(p => bijna(p, m))) && !teveel.length) return NOK('In de tabel ontbreken de nulwaarden van de noemer: daar zet je een streep |.', 'tt_x');
            return NOK(`De x-waarden in je tabel zijn niet juist${mist.length ? ` (er ${mist.length === 1 ? 'ontbreekt er één' : `ontbreken er ${mist.length}`})` : ''}${teveel.length ? ` (${teveel.length} te veel)` : ''}. In de tabel komen alle nulwaarden${pol.length ? ' van teller en noemer' : ''}.`, 'tt_x');
        }
        if (t.length !== 2 * J.length + 1) throw new LeesFout(`Je tekenrij moet ${2 * J.length + 1} symbolen hebben: een teken op elk interval en onder elke x-waarde een 0 of een |.`);
        const T = d.tokens;
        if (t.every((c, i) => c === T[i])) return OK('Juist!');
        const half = { score: d.punten / 2 };
        const oneven = i => i % 2 === 1;
        if (t.some((c, i) => oneven(i) && ((c === '0' && T[i] === '|') || (c === '|' && T[i] === '0')))) return NOK('Bijna: onder een nulwaarde van de teller zet je 0, onder een nulwaarde van de noemer een streep | (daar bestaat de functie niet).', 'pool', half);
        const tekensS = t.filter((c, i) => !oneven(i)), tekensJ = T.filter((c, i) => !oneven(i));
        if (tekensS.every((c, i) => (c === '+' && tekensJ[i] === '-') || (c === '-' && tekensJ[i] === '+') || c === tekensJ[i] && c === '/')) return NOK('Al je tekens zijn omgekeerd. Kijk naar het teken van de hoogstegraadscoëfficiënt (de factor $a$).', 'teken_omgekeerd', half);
        if (d.dubbel && d.dubbel.length) return NOK('Niet alle tekens zijn juist. Opgelet: bij een dubbele nulwaarde verandert het teken niet.', 'dubbel_nulpunt', half);
        return NOK('De x-waarden zijn juist, maar niet alle tekens. Bepaal het teken op elk interval, bv. door een getal in te vullen.', 'teken', half);
    },
    toon: (d, w) => ttTex(leesXwaarden(w.x).map(g => g.tex), [{ label: d.fnaam || 'f(x)', tokens: leesTekenrij(w.t) }]),
    invoer: d => ({ x: lijstTxt(d.xs), t: d.tokens.join(' ') }),
};

// ---------- verloopschema ----------
TYPES.verloop = {
    velden: d => [{ soort: 'ttabel', modus: 'vl', fnaam: d.fnaam || 'f(x)' }],
    controleer(d, w) {
        if (!String(w.x ?? '').trim() && !String(w.v ?? '').trim()) throw new LeesFout('Vul de tabel in.');
        if (/\?/.test(w.x ?? '')) throw new LeesFout('Vul alle x-waarden bovenaan de tabel in (of verwijder een kolom).');
        if (/\?/.test(w.v ?? '')) throw new LeesFout('Vul alle vakjes in: klik tussen de x-waarden op ↗ of ↘ en typ onder elke x-waarde de functiewaarde.');
        const xs = leesXwaarden(w.x);
        const t = leesVerloopRij(w.v);
        const J = d.xs.map(x => (x instanceof Fr ? x.v : x));
        if (!(xs.length === J.length && xs.every((g, i) => getalOK(g, J[i])))) return NOK('De x-waarden van de extrema zijn niet juist. Zoek de toppen en de dalen van de grafiek.', 'verloop');
        if (t.length !== 2 * J.length + 1) throw new LeesFout(`Schrijf ${J.length + 1} pijlen, met tussen twee pijlen de functiewaarde van het extremum.`);
        const pijlS = t.filter((c, i) => i % 2 === 0), pijlJ = d.tokens.filter((c, i) => i % 2 === 0);
        if (pijlS.some(p => p !== 'up' && p !== 'down')) throw new LeesFout('Op de oneven plaatsen staan de pijlen ↗ of ↘, ertussen de functiewaarden.');
        const okP = pijlS.every((p, i) => p === pijlJ[i]);
        const waardenS = t.filter((c, i) => i % 2 === 1), waardenJ = d.waarden;
        const okW = waardenS.every((g, i) => waardenJ[i] === '|' ? g === '|' : g !== '|' && getalOK(g, waardenJ[i]));
        if (okP && okW) return OK('Juist!');
        if (!okP) return NOK('De pijlen (stijgen ↗ en dalen ↘) zijn niet juist. Lees van links naar rechts: gaat de grafiek omhoog of omlaag?', 'verloop', { score: okW ? d.punten / 2 : 0 });
        return NOK('De pijlen zijn juist, maar niet alle functiewaarden van de extrema.', 'aflezen', { score: d.punten / 2 });
    },
    toon: (d, w) => verloopTex(leesXwaarden(w.x).map(g => g.tex), leesVerloopRij(w.v).map(t => (typeof t === 'string' ? t : t.tex)), d.fnaam || 'f(x)'),
    invoer: d => ({ x: lijstTxt(d.xs), v: d.tokens.map(t => (t === 'up' ? '↗' : t === 'down' ? '↘' : t)).join(' ') }),
};

// ---------- transformaties t.o.v. f: uitrekking, spiegeling, vector ----------
TYPES.transfo = {
    velden: d => [{ soort: 'transfo' }],
    controleer(d, w) {
        const opt = (s, def) => (s == null || !String(s).trim()) ? def : leesGetal(s).v;
        if (w.s === undefined || w.s === '') throw new LeesFout('Duid aan of er een spiegeling om de x-as is.');
        const k = opt(w.k, 1), sp = w.s === '0', c = opt(w.c, 0), dd = opt(w.d, 0);
        if (k <= 0) return NOK('Een uitrekkingsfactor is altijd positief. Een minteken voor het voorschrift betekent een spiegeling om de $x$-as.', 'spiegeling');
        const fouten = [];
        if (!bijna(k, d.k)) fouten.push({ code: 'factor_k', msg: bijna(k, 1 / d.k) ? 'Je factor van de uitrekking is het omgekeerde van de juiste.' : 'De factor van de verticale uitrekking is niet juist. Schrijf het voorschrift eerst in de vorm $a \\cdot f(x - c) + d$: de factor is $|a|$.' });
        if (sp !== d.s) fouten.push({ code: 'spiegeling', msg: d.s ? 'Er is wel een spiegeling om de $x$-as: in de vorm $a \\cdot f(x - c) + d$ is $a$ negatief.' : 'Er is geen spiegeling: in de vorm $a \\cdot f(x - c) + d$ is $a$ positief.' });
        if (!bijna(c, d.c)) fouten.push({ code: 'vector_c', msg: bijna(c, -d.c) ? 'Let op het teken van de eerste coördinaat van de vector: $f(x - c)$ verschuift naar rechts als $c > 0$; $(x + 3)$ betekent $c = -3$.' : 'De horizontale verschuiving (eerste coördinaat van de vector) is niet juist.' });
        if (!bijna(dd, d.d)) fouten.push({ code: 'vector_d', msg: bijna(dd, -d.d) ? 'Let op het teken van de verticale verschuiving (tweede coördinaat van de vector).' : 'De verticale verschuiving (tweede coördinaat van de vector) is niet juist.' + (d.dTip ? ' ' + d.dTip : '') });
        if (!fouten.length) return OK('Juist! ' + (d.okMsg || ''));
        const score = Math.floor(2 * d.punten * (4 - fouten.length) / 4) / 2;
        return NOK(fouten.map(f => f.msg).join(' '), fouten[0].code, { score, codes: fouten.map(f => f.code) });
    },
    toon: (d, w) => { const g = (s, def) => (s == null || !String(s).trim()) ? def : leesGetal(s).tex; return transfoTex(g(w.k, '1'), w.s === '0', g(w.c, '0'), g(w.d, '0')); },
    invoer: d => ({ k: d.kTxt, s: d.s ? '0' : '1', c: d.cTxt, d: d.dTxt }),
};
function transfoTex(k, s, c, d) {
    const delen = [];
    if (String(k) !== '1') delen.push(L`\text{verticale uitrekking met factor } ${k}`);
    if (s) delen.push(L`\text{spiegeling om de } x\text{-as}`);
    if (String(c) !== '0' || String(d) !== '0') delen.push(L`\text{verschuiving volgens } \vec v\left(${c},\, ${d}\right)`);
    return delen.length ? delen.join(L`;\ `) : L`\text{geen transformatie}`;
}

// ---------- punt (x, y) in het vlak ----------
TYPES.punt2 = {
    velden: d => [{ soort: 'punt2', naam: d.naam || 'P' }],
    controleer(d, w) {
        const x = leesGetal(w.px), y = leesGetal(w.py);
        const ox = getalOK(x, d.juist[0]), oy = getalOK(y, d.juist[1]);
        if (ox && oy) return OK('Juist!');
        if (getalOK(x, d.juist[1]) && getalOK(y, d.juist[0])) return NOK('Je verwisselde de coördinaten: eerst de $x$-coördinaat, dan de $y$-coördinaat.', d.code || 'rekenfout', { score: d.punten / 2 });
        return NOK(`De ${!ox && !oy ? 'beide coördinaten zijn' : !ox ? 'x-coördinaat is' : 'y-coördinaat is'} niet juist.` + (d.tip ? ' ' + d.tip : ''), d.code || 'rekenfout', { score: (ox || oy) ? d.punten / 2 : 0 });
    },
    toon: (d, w) => `${d.naam || 'P'}\\left(${leesGetal(w.px).tex},\\, ${leesGetal(w.py).tex}\\right)`,
    invoer: d => ({ px: d.juistTxt[0], py: d.juistTxt[1] }),
};

// ---------- meerkeuze, ja/nee, waar/onwaar ----------
TYPES.keuze = {
    velden: d => [{ soort: 'keuze', key: 'k', opties: d.opties, janee: d.janee }],
    controleer(d, w) {
        if (w.k === undefined || w.k === null || w.k === '') throw new LeesFout('Kies een antwoord.');
        const i = +w.k;
        if (i === d.juist) return OK('Juist! ' + (d.opties[i].uitleg || d.uitlegJuist || ''));
        return NOK('Niet juist. ' + (d.opties[i].uitleg || d.uitlegFout || ''), d.opties[i].code || d.code || 'keuze');
    },
    toon: () => null,
    toonHtml: (d, w) => wis(d.opties[+w.k].t),
    invoer: d => ({ k: String(d.juist) }),
};

// ---------- koppelen (per rij een keuzelijst) ----------
TYPES.koppel = {
    velden: d => [{ soort: 'koppel', rijen: d.rijen, opties: d.opties }],
    controleer(d, w) {
        const k = d.rijen.map((r, i) => w['r' + i]);
        if (k.every(x => x === undefined || x === '')) throw new LeesFout('Maak een keuze in elke rij.');
        const ok = d.rijen.map((r, i) => String(k[i]) === String(r.juist));
        const n = ok.filter(Boolean).length;
        if (n === d.rijen.length) return OK('Juist! Alles is correct.');
        const fout = d.rijen.filter((r, i) => !ok[i]).map(r => r.kort);
        return NOK(`${n} van de ${d.rijen.length} juist. Kijk nog eens naar: ${fout.join(', ')}.` + (d.tip ? ' ' + d.tip : ''), d.code || 'keuze', { score: Math.floor(2 * d.punten * n / d.rijen.length) / 2 });
    },
    toon: () => null,
    toonHtml: (d, w) => d.rijen.map((r, i) => `${wis(r.kort)} → ${w['r' + i] !== undefined && w['r' + i] !== '' ? wis(d.opties[+w['r' + i]]) : '—'}`).join('<br>'),
    invoer: d => Object.fromEntries(d.rijen.map((r, i) => ['r' + i, String(r.juist)])),
};

// ---------- bouwers voor deelvragen ----------
const alsGetal = x => (x instanceof Fr ? x.v : x);
const alsTex = x => (x instanceof Fr ? x.tex() : mooi(x));
const alsTxt = x => (x instanceof Fr ? x.txt() : (Number.isInteger(x) ? String(x) : x.toFixed(6)));
const D = {
    getal(vraag, juist, opt = {}) {
        const tex = opt.tex || (juist === null ? L`\text{bestaat niet}` : alsTex(juist));
        return { type: 'getal', vraag, juist: juist === null ? null : alsGetal(juist), juistTexKaal: tex, juistTex: (opt.label ? opt.label + ' ' : '') + tex + (opt.na || ''), juistTxt: opt.txt || (juist === null ? 'bestaat niet' : alsTxt(juist)), punten: 1, ...opt };
    },
    getallen(vraag, lijst, opt = {}) {
        const tex = opt.tex || lijstTex(lijst);
        return { type: 'getallen', vraag, juist: lijst.map(alsGetal), juistTexKaal: tex, juistTex: (opt.label ? opt.label + ' ' : '') + tex, juistTxt: opt.txt || lijstTxt(lijst.map(x => (x instanceof Fr ? x : x))), punten: 1, ...opt };
    },
    uitdr(vraag, txt, tex, opt = {}) { return { type: 'uitdr', vraag, juistTxt: txt, juistTex: (opt.label ? opt.label + ' ' : '') + tex, punten: 1, ...opt }; },
    vrij(vraag, voorbeeldTxt, voorbeeldTex, checks, opt = {}) { return { type: 'vrij', vraag, voorbeeldTxt, checks, juistTex: (opt.label || 'f(x) =') + ' ' + voorbeeldTex + L`\quad\text{(bijvoorbeeld)}`, punten: 1, ...opt }; },
    verz(vraag, txt, opt = {}) { const tex = opt.tex || vzTex(leesVerz(txt)); return { type: 'verz', vraag, juistTxt: txt, juistTex: (opt.label ? opt.label + ' ' : '') + tex, punten: 1, ...opt }; },
    tt(vraag, xs, tokens, opt = {}) { return { type: 'tt', vraag, xs, tokens, juistTex: ttTex(xs.map(alsTex), [{ label: opt.fnaam || 'f(x)', tokens }]), punten: 2, ...opt }; },
    verloop(vraag, xs, pijlen, waarden, opt = {}) {
        const tokens = []; pijlen.forEach((p, i) => { tokens.push(p); if (i < waarden.length) tokens.push(waarden[i] === '|' ? '|' : alsTxt(waarden[i])); });
        const texT = []; pijlen.forEach((p, i) => { texT.push(p); if (i < waarden.length) texT.push(waarden[i] === '|' ? '|' : alsTex(waarden[i])); });
        return { type: 'verloop', vraag, xs, tokens, waarden: waarden.map(x => (x === '|' ? '|' : alsGetal(x))), juistTex: verloopTex(xs.map(alsTex), texT, opt.fnaam || 'f(x)'), punten: 2, ...opt };
    },
    transfo(vraag, { k, s, c, d }, opt = {}) {
        return { type: 'transfo', vraag, k: alsGetal(k), s, c: alsGetal(c), d: alsGetal(d), kTxt: alsTxt(k), cTxt: alsTxt(c), dTxt: alsTxt(d), juistTex: transfoTex(alsTex(k), s, alsTex(c), alsTex(d)), punten: 2, ...opt };
    },
    punt2(vraag, naam, x, y, opt = {}) { return { type: 'punt2', vraag, naam, juist: [alsGetal(x), alsGetal(y)], juistTxt: [alsTxt(x), alsTxt(y)], juistTex: `${naam}\\left(${alsTex(x)},\\, ${alsTex(y)}\\right)`, punten: 1, ...opt }; },
    keuze(vraag, opties, juist, opt = {}) { return { type: 'keuze', vraag, opties, juist, juistTex: null, juistHtml: wis(opties[juist].t), punten: 1, ...opt }; },

<script>
// ===================== algemene hulpfuncties voor alle hoofdstukken =====================
const INF = Infinity;
const grensTxt = v => v === INF ? '+inf' : v === -INF ? '-inf' : (v instanceof Fr ? v.txt() : String(v));
function ivTxt(a, b, ai, bi) { return `${ai ? '[' : ']'}${grensTxt(a)} ; ${grensTxt(b)}${bi ? ']' : '['}`; }
// oplossing van f(x) op 0 uit een tekentabel (xs: Fr's, tokens: zoals in de tabel)
function ttNaarVerz(xs, tokens, op) {
    const wil = op[0] === '>' ? '+' : '-', metNul = op.length === 2;
    const n = xs.length, stukken = [], punten = [];
    for (let i = 0; i <= n; i++) {
        if (tokens[2 * i] !== wil) continue;
        stukken.push({ a: i === 0 ? -INF : xs[i - 1], b: i === n ? INF : xs[i], ai: i > 0 && metNul && tokens[2 * i - 1] === '0', bi: i < n && metNul && tokens[2 * i + 1] === '0', ia: i, ib: i });
    }
    // aaneensluitende stukken samenvoegen (via een nulwaarde die erbij hoort)
    const sam = [];
    stukken.forEach(s => { const v = sam[sam.length - 1]; if (v && v.ib === s.ia - 1 && v.bi && s.ai) { v.b = s.b; v.bi = s.bi; v.ib = s.ib; } else sam.push({ ...s }); });
    if (metNul) for (let i = 0; i < n; i++) if (tokens[2 * i + 1] === '0' && tokens[2 * i] !== wil && tokens[2 * i + 2] !== wil) punten.push(xs[i]);
    const delen = [];
    // punten op hun plaats tussen de intervallen zetten
    const alle = [...sam.map(s => ({ x: s.a === -INF ? -1e18 : alsGetal(s.a), s })), ...punten.map(p => ({ x: alsGetal(p), p }))].sort((u, v) => u.x - v.x);
    alle.forEach(e => {
        if (e.s) { const s = e.s; delen.push(s.a === -INF && s.b === INF ? 'R' : ivTxt(s.a, s.b, s.ai, s.bi)); }
        else delen.push(`{${e.p.txt()}}`);
    });
    return delen.length ? delen.join(' U ') : 'geen';
}
const OP_TEX = { '>': '>', '>=': L`\geq`, '<': '<', '<=': L`\leq` };
const OP_WOORD = { '>': 'strikt positief', '>=': 'positief of nul', '<': 'strikt negatief', '<=': 'negatief of nul' };
// mooi venster rond een (numerieke) functie
function venster(f, xl, xr, marge = 1.15, minH = 4) {
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i <= 200; i++) { const y = +f(xl + (xr - xl) * i / 200); if (Number.isFinite(y)) { lo = Math.min(lo, y); hi = Math.max(hi, y); } }
    lo = Math.min(lo, 0); hi = Math.max(hi, 0);
    const st = mooieStap(Math.max(minH, (hi - lo) * marge), 8);
    return { ymin: Math.floor(lo * marge / st) * st - (lo >= 0 ? st : 0), ymax: Math.ceil(hi * marge / st) * st + (hi <= 0 ? st : 0), gy: st };
}
const rondAf = (x, n = 6) => Math.round(x * Math.pow(10, n)) / Math.pow(10, n);

// ---------- basisfuncties voor transformaties ----------
const BASIS = {
    kw: { naam: 'x^2', tex: a => a === 'x' ? 'x^{2}' : L`\left(${a}\right)^{2}`, txt: a => `(${a})^2`, f: x => x * x },
    kub: { naam: 'x^3', tex: a => a === 'x' ? 'x^{3}' : L`\left(${a}\right)^{3}`, txt: a => `(${a})^3`, f: x => x * x * x },
    wrt: { naam: L`\sqrt{x}`, tex: a => L`\sqrt{${a}}`, txt: a => `sqrt(${a})`, f: x => Math.sqrt(x) },
    dwrt: { naam: L`\sqrt[3]{x}`, tex: a => L`\sqrt[3]{${a}}`, txt: a => `root(3, ${a})`, f: x => Math.cbrt(x) },
    inv: { naam: L`\frac{1}{x}`, breuk: true, tex: a => L`\frac{1}{${a}}`, num: a => a, txt: a => `1/(${a})`, f: x => 1 / x },
    inv2: { naam: L`\frac{1}{x^2}`, breuk: true, tex: a => a === 'x' ? L`\frac{1}{x^{2}}` : L`\frac{1}{\left(${a}\right)^{2}}`, txt: a => `1/(${a})^2`, f: x => 1 / (x * x) },
};
// g(x) = a·f(x - c) + d als tex en als invoertekst
function transTex(B, a, c, d) {
    a = Fr.of(a); c = Fr.of(c); d = Fr.of(d);
    const arg = xmr(c);
    let s;
    if (B.breuk) {
        const nm = B.tex(arg).replace(L`\frac{1}`, L`\frac{${a.abs().tex()}}`);
        s = (a.n < 0 ? '-' : '') + (a.abs().geheel ? nm : L`${a.abs().tex()} \cdot ${B.tex(arg)}`);
    } else s = (a.gelijk(1) ? '' : a.gelijk(-1) ? '-' : a.tex() + (B.naam.startsWith('x') ? '' : L` \cdot `)) + B.tex(arg);
    if (!d.nul) s += d.n < 0 ? ` - ${d.abs().tex()}` : ` + ${d.tex()}`;
    return s;
}
function transTxt(B, a, c, d) {
    a = Fr.of(a); c = Fr.of(c); d = Fr.of(d);
    let s = coefTxt(a) + B.txt(xmrTxt(c));
    if (!d.nul) s += d.n < 0 ? ` - ${d.abs().txt()}` : ` + ${d.txt()}`;
    return s;
}

// veelterm met gehele nulwaarden voor grafiek-oefeningen
function veeltermGrafiek(r, graadMax = 4) {
    for (let p = 0; p < 200; p++) {
        const n = r.int(2, 3);
        const wortels = r.verschillend(n, -4, 4).sort((a, b) => a - b);
        const lin = wortels.map(w => ({ r: F(w), m: 1 }));
        if (r.bool(0.55)) { const i = r.int(0, n - 1); lin[i].m = 2; }
        const g = lin.reduce((s, l) => s + l.m, 0);
        if (g > graadMax) continue;
        const a = r.pick([1, -1]) * r.pick(g >= 4 ? [0.25, 0.5] : [0.5, 1]);
        const P = factPoly(F(Math.round(a * 4), 4), lin);
        const f = x => P.w(x);
        const xl = Math.min(-5, wortels[0] - 1.3), xr = Math.max(5, wortels[n - 1] + 1.3);
        const vs = venster(f, wortels[0] - 0.9, wortels[n - 1] + 0.9);
        if (vs.ymax - vs.ymin > 60) continue;
        return { lin, a: F(Math.round(a * 4), 4), P, f, wortels, xl, xr, vs };
    }
    throw new Error('veelterm');
}

regGen({ id: 'h1_verloop', cat: 'h1', niveau: 2, titel: 'Verloopschema uit een grafiek', par: '1.2 Extrema en verloop', maak(r) {
    const v = r.r();
    let f, xs, pijlen, waarden, xl, xr, vs, extra = [];
    if (v < 0.55) {
        let x1, x2, y1, y2;
        do { x1 = r.int(-3, 1); x2 = x1 + r.pick([2, 3]); y1 = r.int(-4, 4); y2 = r.int(-4, 4); } while (y1 === y2 || x2 > 3);
        const A = (y2 - y1) / Math.pow(x1 - x2, 3);
        const h = x => 2 * x * x * x - 3 * (x1 + x2) * x * x + 6 * x1 * x2 * x;
        const C = y1 - A * h(x1);
        f = x => A * h(x) + C;
        xs = [F(x1), F(x2)]; waarden = [F(y1), F(y2)];
        pijlen = y1 > y2 ? ['up', 'down', 'up'] : ['down', 'up', 'down'];
        xl = x1 - 2; xr = x2 + 2; vs = { ymin: Math.min(y1, y2) - 3, ymax: Math.max(y1, y2) + 3, gy: 1 };
        const mx = y1 > y2 ? [x1, y1] : [x2, y2];
        extra = [D.getal('Wat is het relatief maximum van $f$?', mx[1], { code: 'aflezen', fouten: [{ w: mx[0], msg: 'Je gaf de $x$-waarde waar het maximum bereikt wordt. Het maximum zelf is de functiewaarde ($y$-coördinaat).', code: 'aflezen' }] })];
    } else if (v < 0.75) {
        const p = r.int(-3, 3), q = r.int(-3, 3), s = r.pick([1, -1, 0.5, -0.5]);
        f = x => s * (x - p) * (x - p) + q;
        xs = [F(p)]; waarden = [F(q)]; pijlen = s > 0 ? ['down', 'up'] : ['up', 'down'];
        xl = -6; xr = 6; vs = { ymin: -6, ymax: 6, gy: 1 };
    } else {
        const p = r.int(-2, 2), q = r.int(-3, 1), A = r.pick([1, 2, -1, -2]);
        f = x => A * Math.pow((x - p) * (x - p) - 1, 2) + q;
        xs = [F(p - 1), F(p), F(p + 1)]; waarden = [F(q), F(q + A), F(q)];
        pijlen = A > 0 ? ['down', 'up', 'down', 'up'] : ['up', 'down', 'up', 'down'];
        xl = p - 3; xr = p + 3; vs = { ymin: Math.min(q, q + A) - 3, ymax: Math.max(q, q + A) + 3, gy: 1 };
    }
    const svg = svgGrafiek({ xmin: Math.min(xl, -2), xmax: Math.max(xr, 2), ymin: Math.min(vs.ymin, -1), ymax: Math.max(vs.ymax, 1), b: 330, krommen: [{ f }] });
    const naam = w => (w === 'up' ? 'stijgt' : 'daalt');
    return {
        opgave: 'Gegeven is de grafiek van een functie $f$. Maak een verloopschema van $f$ (met de extrema en hun functiewaarden).',
        figuur: svg,
        delen: [D.verloop('Het verloopschema:', xs, pijlen, waarden), ...extra],
        hints: ['Zoek de toppen (maxima) en de dalen (minima) van de grafiek: hun $x$-waarden komen bovenaan in het schema.', 'Schrijf telkens een pijl: ↗ waar de grafiek stijgt, ↘ waar ze daalt (van links naar rechts lezen).', 'Tussen twee pijlen noteer je de functiewaarde van het extremum ($y$-coördinaat).'],
        stappen: [L`Extrema in $x = ${xs.map(x => x.tex()).join(';\\ ')}$ met functiewaarden $${waarden.map(x => x.tex()).join(';\\ ')}$.`,
            'Van links naar rechts: ' + pijlen.map(naam).join(', ') + '.',
            L`!$${verloopTex(xs.map(x => x.tex()), pijlen.flatMap((p, i) => (i < waarden.length ? [p, waarden[i].tex()] : [p])), 'f(x)', pijlen.slice(0, -1).flatMap((p, i) => ['', p === 'up' ? L`\text{max}` : L`\text{min}`]).concat(['']))}$`],
    };

function kiesTransfo(r, basisLijst) {
    for (;;) {
        const sleutel = r.pick(basisLijst), B = BASIS[sleutel];
        const a = r.pick([F(1), F(-1), F(2), F(-2), F(3), F(-3), F(1, 2), F(-1, 2), F(4)]);
        const c = F(r.int(-5, 5)), d = F(r.int(-5, 5));
        const aantal = (a.gelijk(1) ? 0 : 1) + (c.nul ? 0 : 1) + (d.nul ? 0 : 1);
        if (aantal >= 2) return { B, sleutel, a, c, d };
    }
}
function transfoStappen(B, a, c, d) {
    const st = [L`$g(x) = a \cdot f(x - c) + d$ met $a = ${a.tex()}$, $c = ${c.tex()}$, $d = ${d.tex()}$.`];
    if (!a.abs().gelijk(1)) st.push(L`$|a| = ${a.abs().tex()}$: verticale uitrekking met factor $${a.abs().tex()}$.`);
    if (a.n < 0) st.push('$a < 0$: spiegeling om de $x$-as.');
    if (!c.nul || !d.nul) st.push(L`Verschuiving volgens $\vec v(${c.tex()},\, ${d.tex()})$: ${c.nul ? '' : `${c.abs().tex()} eenheden naar ${c.n > 0 ? 'rechts' : 'links'}`}${!c.nul && !d.nul ? ' en ' : ''}${d.nul ? '' : `${d.abs().tex()} eenheden naar ${d.n > 0 ? 'boven' : 'onder'}`}.`);
    return st;
}
regGen({ id: 'h1_transfo_besch', cat: 'h1', niveau: 1, titel: 'Transformaties herkennen', par: '1.4 Transformaties', maak(r) {
    const { B, a, c, d } = kiesTransfo(r, ['kw', 'kub', 'wrt', 'inv']);
    return {
        opgave: L`Welke transformaties moet je uitvoeren op de grafiek van $f(x) = ${B.naam}$ om de grafiek van $$g(x) = ${transTex(B, a, c, d)}$$ te krijgen?`,
        delen: [D.transfo('Vul in (factor 1 = geen uitrekking; vector (0, 0) = geen verschuiving):', { k: a.abs(), s: a.n < 0, c, d })],
        hints: [L`Schrijf $g(x)$ in de vorm $a \cdot f(x - c) + d$ en lees $a$, $c$ en $d$ af.`, L`$|a|$ is de factor van de verticale uitrekking; is $a < 0$, dan is er ook een spiegeling om de $x$-as.`, L`De verschuiving gebeurt volgens de vector $\vec v(c, d)$. Opgelet: $(x + 3)$ betekent $c = -3$.`],
        stappen: [...transfoStappen(B, a, c, d), L`!$${transfoTex(a.abs().tex(), a.n < 0, c.tex(), d.tex())}$`],
    };

// transformaties in een gegeven volgorde: (a, c, d) bijhouden
function voerUit(stappen) {
    let a = F(1), c = F(0), d = F(0);
    for (const s of stappen) {
        if (s.t === 'S') { a = a.neg(); d = d.neg(); }
        else if (s.t === 'U') { a = a.maal(s.k); d = d.maal(s.k); }
        else { c = c.plus(s.c); d = d.plus(s.d); }
    }
    return { a, c, d };
}
const stapTekst = s => s.t === 'S' ? 'spiegelen om de $x$-as' : s.t === 'U' ? L`verticaal uitrekken met factor $${s.k.tex()}$` : L`verschuiven volgens de vector $\vec v(${s.c.tex()},\, ${s.d.tex()})$`;
function transfoVoorschriftGen(r, sleutels, basisTex = null) {
    for (;;) {
        const sleutel = r.pick(sleutels), B = BASIS[sleutel];
        const S = { t: 'S' }, U = { t: 'U', k: r.pick([F(2), F(3), F(4), F(1, 2)]) }, Vv = { t: 'V', c: F(r.nz(-5, 5)), d: F(r.nz(-5, 5)) };
        const keuze = r.pick([[S, U, Vv], [Vv, S, U], [U, Vv], [Vv, U], [S, Vv], [Vv, S], [Vv, U, S], [U, S, Vv]]);
        const res = voerUit(keuze);
        const std = voerUit([...keuze.filter(s => s.t !== 'V'), ...keuze.filter(s => s.t === 'V')]);
        let a = F(1), c = F(0), d = F(0);
        const st = [];
        keuze.forEach((s, i) => {
            const v = voerUit(keuze.slice(0, i + 1));
            const vorig = i === 0 ? 'f' : `f_{${i}}`;
            const fi = `f_{${i + 1}}(x)`;
            const def = s.t === 'S' ? L`-${vorig}(x)` : s.t === 'U' ? L`${s.k.tex()}\, ${vorig}(x)` : L`${vorig}(${xmr(s.c)}) ${s.d.n < 0 ? '-' : '+'} ${s.d.abs().tex()}`;
            st.push(L`${stapTekst(s)}: $\;${fi} = ${def} = ${transTex(B, v.a, v.c, v.d)}$`);
            a = v.a; c = v.c; d = v.d;
        });
        return { B, keuze, res, std, st, verschilt: !(std.a.gelijk(res.a) && std.c.gelijk(res.c) && std.d.gelijk(res.d)) };
    }
}

    const T = transfoVoorschriftGen(r, ['kw', 'wrt', 'kub', 'inv']);
