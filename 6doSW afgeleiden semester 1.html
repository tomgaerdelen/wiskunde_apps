<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6doSW afgeleiden semester 1</title>
<!-- Externe bibliotheken (vaste versies):
     KaTeX voor de wiskundige weergave, html2canvas + jsPDF voor het PDF-rapport,
     Patrick Hand voor de (handgeschreven) feedback van de leerkracht.
     Zonder internet werkt de app ook, maar dan worden formules als tekst getoond
     en kan het rapport niet als PDF gedownload worden. -->
<link rel="stylesheet" href="lib/katex/katex.min.css">
<link rel="stylesheet" href="lib/patrick-hand/patrick-hand.css">
<script src="lib/katex/katex.min.js"></script>
<script defer src="lib/html2canvas-1.4.1.min.js"></script>
<script defer src="lib/jspdf-2.5.1.umd.min.js"></script>
<style>
    :root {
        --bg: #f1f5f9; --kaart: #ffffff; --rand: #e2e8f0; --tekst: #1e293b; --zacht: #64748b; --heel-zacht: #94a3b8;
        --blauw: #1e3a8a; --blauw-licht: #eff6ff; --blauw-rand: #bfdbfe;
        --groen: #059669; --groen-donker: #047857; --groen-licht: #ecfdf5; --groen-rand: #a7f3d0;
        --rood: #e11d48; --rood-donker: #be123c; --rood-licht: #fff1f2; --rood-rand: #fecdd3;
        --oranje-licht: #fffbeb; --oranje-rand: #fde68a; --oranje-tekst: #92400e;
        --paars: #4f46e5; --paars-licht: #eef2ff; --paars-rand: #c7d2fe;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--tekst); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.45; }
    #app { max-width: 960px; margin: 0 auto; padding: 16px 16px 56px; }
    button { font: inherit; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
    p { margin: 0 0 8px; }
    .kaart { background: var(--kaart); border: 1px solid var(--rand); border-radius: 16px; box-shadow: 0 4px 18px rgba(15, 23, 42, .06); }
    .kaart-binnen { padding: 20px; }
    .grijs { color: var(--zacht); }
    .klein { font-size: .85rem; }
    .verborgen { display: none !important; }
    .katex { font-size: 1.08em; }
    .katex-display { margin: .5em 0; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }

    /* ---------- knoppen ---------- */
    .knop { border: none; border-radius: 12px; padding: 11px 16px; font-weight: 700; transition: background .15s, transform .05s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .knop:active:not(:disabled) { transform: translateY(1px); }
    .knop-groen { background: var(--groen); color: #fff; } .knop-groen:hover:not(:disabled) { background: var(--groen-donker); }
    .knop-rood { background: var(--rood); color: #fff; } .knop-rood:hover:not(:disabled) { background: var(--rood-donker); }
    .knop-blauw { background: var(--blauw); color: #fff; } .knop-blauw:hover:not(:disabled) { background: #172554; }
    .knop-donker { background: #1e293b; color: #fff; } .knop-donker:hover:not(:disabled) { background: #0f172a; }
    .knop-licht { background: #fff; color: var(--tekst); border: 1px solid var(--rand); } .knop-licht:hover:not(:disabled) { background: #f8fafc; }
    .knop-blauw-licht { background: var(--blauw-licht); color: var(--blauw); border: 1px solid var(--blauw-rand); } .knop-blauw-licht:hover:not(:disabled) { background: #dbeafe; }
    .knop-paars-licht { background: var(--paars-licht); color: var(--paars); border: 1px solid var(--paars-rand); } .knop-paars-licht:hover:not(:disabled) { background: #e0e7ff; }
    .knop-geel { background: #fef9c3; color: #854d0e; border: 1px solid #fde047; } .knop-geel:hover:not(:disabled) { background: #fef08a; }
    .knop-groot { padding: 15px 22px; font-size: 1.08rem; }
    .knop-klein { padding: 7px 11px; font-size: .88rem; border-radius: 9px; }
    .knop-rij { display: flex; flex-wrap: wrap; gap: 10px; }
    .linkknop { background: none; border: none; padding: 0; color: #2563eb; font-weight: 600; text-decoration: underline; }

    /* ---------- menu ---------- */
    .kop { text-align: center; padding: 24px 20px 6px; }
    .kop h1 { color: var(--blauw); font-size: 1.95rem; font-weight: 800; }
    .kop p { margin: 6px 0 0; color: var(--zacht); }
    .naam-rij { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .naam-rij .veld { flex: 1 1 200px; }
    .veld { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; font-weight: 600; color: #475569; }
    .veld input, .veld select { font: inherit; font-weight: 500; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; }
    .modus-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
    .modus { border-radius: 14px; padding: 16px; border: 2px solid var(--rand); background: #fff; text-align: left; display: flex; flex-direction: column; gap: 4px; }
    .modus b { font-size: 1.08rem; }
    .modus span { font-size: .86rem; color: var(--zacht); font-weight: 500; }
    .modus.theorie { border-color: var(--paars-rand); background: var(--paars-licht); } .modus.theorie b { color: var(--paars); }
    .modus.oefen { border-color: var(--groen-rand); background: var(--groen-licht); } .modus.oefen b { color: var(--groen-donker); }
    .modus.toets { border-color: var(--rood-rand); background: var(--rood-licht); } .modus.toets b { color: var(--rood-donker); }
    .modus.aan { box-shadow: 0 0 0 3px rgba(30, 58, 138, .25); }
    .sectie-titel { font-size: 1.05rem; color: #334155; margin: 20px 0 6px; font-weight: 800; }
    .cat-groep { font-size: .78rem; font-weight: 800; color: var(--zacht); text-transform: uppercase; letter-spacing: .05em; margin: 14px 0 6px; }
    .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .cat { display: flex; gap: 12px; align-items: flex-start; text-align: left; background: #fff; border: 2px solid var(--rand); border-radius: 14px; padding: 12px 14px; }
    .cat:hover { border-color: #94a3b8; }
    .cat.aan { border-color: var(--blauw); background: var(--blauw-licht); }
    .cat .ico { flex: none; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; font-weight: 800; color: #fff; }
    .cat b { display: block; font-size: .98rem; }
    .cat small { display: block; color: var(--zacht); font-size: .8rem; margin-top: 2px; }
    .cat .stat { display: block; color: var(--groen-donker); font-size: .76rem; margin-top: 4px; font-weight: 700; }
    .keuze-rij { display: flex; flex-wrap: wrap; gap: 8px; }
    .keuze { flex: 1 1 120px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--rand); background: #fff; font-weight: 700; color: #334155; text-align: center; }
    .keuze small { display: block; font-weight: 500; color: var(--zacht); margin-top: 2px; font-size: .78rem; }
    .keuze.aan { border-color: var(--blauw); background: var(--blauw-licht); color: var(--blauw); }
    .instel { background: #f8fafc; border: 1px solid var(--rand); border-radius: 14px; padding: 14px 16px; margin-top: 14px; }
    .instel h3 { font-size: .98rem; color: #334155; margin-bottom: 8px; }
    .types-lijst { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 6px; }
    .type-optie { display: flex; gap: 8px; align-items: flex-start; font-size: .88rem; background: #fff; border: 1px solid var(--rand); border-radius: 10px; padding: 7px 10px; cursor: pointer; }
    .type-optie input { margin-top: 3px; accent-color: var(--groen); }
    .type-optie .niv { margin-left: auto; flex: none; }
    .snel { display: flex; gap: 6px; align-items: center; }
    .melding { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--oranje-licht); border: 1px solid var(--oranje-rand); color: var(--oranje-tekst); font-size: .92rem; }

    /* ---------- labels ---------- */
    .label { font-size: .72rem; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: #e2e8f0; color: #334155; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
    .label.n1 { background: #dcfce7; color: #166534; } .label.n2 { background: #fef9c3; color: #854d0e; } .label.n3 { background: #fee2e2; color: #991b1b; }
    .label.pt { background: #e0e7ff; color: #3730a3; }
    .label.gg { background: #e0f2fe; color: #075985; border: 1px solid #7dd3fc; text-transform: none; letter-spacing: 0; }

    /* ---------- oefen- en toetsscherm ---------- */
    .balk { display: flex; align-items: center; gap: 10px; padding: 12px 16px; color: #fff; border-radius: 16px 16px 0 0; flex-wrap: wrap; }
    .balk.oefen { background: #065f46; } .balk.toets { background: #881337; } .balk.theorie { background: #3730a3; }
    .balk h2 { font-size: 1.05rem; flex: 1 1 auto; }
    .balk .terug { background: rgba(255,255,255,.14); color: #fff; border: none; border-radius: 10px; padding: 8px 12px; font-weight: 600; }
    .balk .terug:hover { background: rgba(255,255,255,.25); }
    .teller { background: rgba(255,255,255,.14); border-radius: 999px; padding: 4px 12px; font-size: .86rem; font-weight: 600; white-space: nowrap; }
    .voortgang { height: 6px; background: #fecdd3; }
    .voortgang div { height: 100%; background: var(--rood); transition: width .3s; }
    .niveau-balk { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 16px; background: #f8fafc; border-bottom: 1px solid var(--rand); font-size: .88rem; }
    .niveau-balk .keuze { flex: 0 0 auto; padding: 5px 12px; font-size: .85rem; }
    .opgave { background: #f8fafc; border: 1px solid var(--rand); border-radius: 14px; padding: 14px 16px 16px; }
    .opgave-labels { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
    .opgave-titel { font-weight: 800; color: #334155; margin-right: 4px; }
    .opgave-tekst { font-size: 1.04rem; }
    .opgave-tekst .katex-display { text-align: left; }
    .opgave-tekst .katex-display > .katex { text-align: left; }
    .figuur { display: flex; justify-content: center; margin: 8px 0 2px; flex-wrap: wrap; gap: 10px; }
    .grafiek { max-width: 100%; height: auto; }
    .deel { margin-top: 14px; border: 1px solid var(--rand); border-radius: 14px; padding: 12px 14px; background: #fff; }
    .deel.juist { border-color: var(--groen-rand); background: #fbfffd; }
    .deel.fout { border-color: var(--rood-rand); }
    .deel-kop { display: flex; gap: 8px; align-items: baseline; margin-bottom: 8px; }
    .deel-kop .letter { font-weight: 800; color: var(--blauw); flex: none; }
    .deel-kop .vraag { flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; }
    .deel-kop .ptn { flex: none; font-size: .78rem; color: var(--zacht); font-weight: 700; }
    .invoer { padding: 10px 12px; font-size: 1.05rem; font-family: ui-monospace, Consolas, monospace; border: 2px solid #cbd5e1; border-radius: 10px; outline: none; background: #fff; min-width: 0; }
    .invoer:focus { border-color: #3b82f6; }
    .invoer:disabled { background: #f1f5f9; color: var(--zacht); }
    .invoer.breed { width: 100%; }
    .invoer.co { width: 110px; text-align: center; }
    .rij { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
    .rij .lbl { font-size: 1.05rem; white-space: nowrap; }
    .rij .haak { font-size: 1.4rem; color: #475569; }
    .rij.vgl .invoer { flex: 1 1 260px; }
    .preview { min-height: 30px; margin-top: 4px; padding: 4px 10px; border: 1px dashed #cbd5e1; border-radius: 10px; background: #fcfdff; font-size: 1.02rem; overflow-x: auto; overflow-y: hidden; }
    .preview:empty { display: none; }
    .preview .lees-fout { color: #b45309; font-size: .88rem; }
    .opties { display: flex; flex-direction: column; gap: 6px; }
    .optie { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border: 2px solid var(--rand); border-radius: 10px; cursor: pointer; background: #fff; overflow-x: auto; }
    .optie:hover { border-color: #94a3b8; }
    .optie input { margin-top: 4px; accent-color: var(--blauw); flex: none; }
    .optie.gekozen { border-color: var(--blauw); background: var(--blauw-licht); }
    .opties.janee { flex-direction: row; flex-wrap: wrap; }
    .opties.janee .optie { flex: 1 1 140px; }
    .opties.raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    .opties.raster .optie { justify-content: center; }
    .feedback { margin-top: 10px; padding: 10px 14px; border-radius: 10px; display: flex; gap: 10px; align-items: flex-start; font-size: .96rem; }
    .feedback .ico { font-size: 1.15rem; line-height: 1.2; flex: none; }
    .feedback.juist { background: var(--groen-licht); border: 1px solid var(--groen-rand); color: #065f46; }
    .feedback.fout { background: var(--rood-licht); border: 1px solid var(--rood-rand); color: #9f1239; }
    .feedback.info { background: var(--oranje-licht); border: 1px solid var(--oranje-rand); color: var(--oranje-tekst); }
    .hulp { margin-top: 14px; background: var(--blauw-licht); border: 1px solid var(--blauw-rand); border-radius: 12px; padding: 12px 16px; overflow-x: auto; }
    .hulp h3 { font-size: .98rem; color: var(--blauw); margin-bottom: 6px; }
    .hulp ol { margin: 0; padding-left: 22px; }
    .hulp li { margin: 6px 0; }
    .uitwerking { margin-top: 14px; background: #fff; border: 1px solid var(--paars-rand); border-radius: 12px; padding: 12px 16px; overflow-x: auto; }
    .uitwerking h3 { font-size: .98rem; color: var(--paars); margin-bottom: 6px; }
    .stappen { margin: 0; padding-left: 0; list-style: none; }
    .stappen li { margin: 6px 0; line-height: 1.55; }
    .stappen li.sub { padding-left: 18px; }
    .stappen li.kader { border-top: 1px solid var(--paars-rand); padding-top: 8px; margin-top: 10px; font-weight: 700; color: var(--blauw); }
    .stappen .katex-display { margin: .25em 0; text-align: left; }
    .stappen .katex-display > .katex { text-align: left; }
    .actie-rij { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .actie-rij .knop { flex: 1 1 140px; }
    .werkbalk { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .werkbalk button { border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 7px; padding: 3px 9px; font-size: .9rem; font-family: ui-monospace, Consolas, monospace; color: #334155; }
    .werkbalk button:hover { background: var(--blauw-licht); }
    .werkbalk button.woord { font-family: inherit; }
    details.typhulp { margin-top: 14px; border: 1px solid var(--rand); border-radius: 12px; background: #fff; }
    details.typhulp summary { cursor: pointer; padding: 9px 14px; font-weight: 700; color: #334155; font-size: .92rem; }
    details.typhulp .inhoud { padding: 0 14px 12px; font-size: .88rem; }
    .typtabel { width: 100%; border-collapse: collapse; }
    .typtabel td { padding: 4px 6px; border-top: 1px solid #f1f5f9; vertical-align: middle; }
    .typtabel code { background: #f1f5f9; padding: 2px 6px; border-radius: 6px; font-size: .86rem; }
    .sessie { display: flex; gap: 6px; flex-wrap: wrap; font-size: .85rem; color: var(--zacht); margin-top: 12px; align-items: center; }
    .bolletje { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .bolletje.g { background: #10b981; } .bolletje.h { background: #f59e0b; } .bolletje.f { background: #f43f5e; }
    .toets-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .toets-nav button { width: 36px; height: 36px; border-radius: 9px; border: 2px solid var(--rand); background: #fff; font-weight: 700; color: #334155; }
    .toets-nav button.ingevuld { background: #e0e7ff; border-color: #a5b4fc; }
    .toets-nav button.huidig { border-color: var(--rood); }

    /* ---------- feedback van de leerkracht (handgeschreven stijl) ---------- */
    .leerkracht { margin-top: 10px; padding: 10px 16px 8px; border-radius: 12px; background: #fffdf4; border: 1px solid #f2e6c4; border-left: 6px solid #dc2626;
        font-family: 'Patrick Hand', 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive; color: #b91c1c; font-size: 1.12rem; line-height: 1.4; overflow-x: auto; }
    .leerkracht.goed { border-left-color: #059669; color: #047857; }
    .leerkracht p { margin: 4px 0; }
    .lk-kop { font-size: 1.28rem; font-weight: 700; }
    .lk-fout { margin: 2px 0 4px; }
    .lk-fout b { text-decoration: underline wavy #ef4444; text-underline-offset: 5px; text-decoration-thickness: 1px; }
    .lk-rij { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0; }
    .lk-wie { min-width: 90px; }
    .lk-omcirkeld { display: inline-block; border: 2px solid #ef4444; border-radius: 46% 54% 50% 50% / 60% 48% 52% 40%; padding: 6px 16px 3px; transform: rotate(-1deg); color: #1e293b; max-width: 100%; overflow-x: auto; }
    .lk-juist { display: inline-block; color: #1e293b; padding: 0 10px 2px; border-bottom: 2px solid #10b981; max-width: 100%; overflow-x: auto; }
    .leerkracht .katex-display { margin: 0; }
    .leerkracht .katex { color: #1e293b; font-size: 1em; }
    .lk-tip { color: #1d4ed8; }
    .lk-lijst { margin: 4px 0 6px; padding-left: 24px; }
    .lk-lijst li { margin: 3px 0; }
    .lk-groot { font-size: 1.2rem; margin: 16px 0 4px; }
    .lk-mini { font-size: 1.02rem; padding: 6px 12px 5px; margin-top: 6px; }
    .lk-mini .lk-kop { font-size: 1.08rem; }

    /* ---------- theorie ---------- */
    .theorie-blok { margin-top: 14px; border: 1px solid var(--rand); border-radius: 14px; padding: 14px 16px; background: #fff; overflow-x: auto; }
    .theorie-blok h3 { font-size: 1.04rem; color: var(--paars); margin-bottom: 8px; }
    .theorie-blok ul, .theorie-blok ol { margin: 4px 0 8px; padding-left: 22px; }
    .theorie-blok li { margin: 4px 0; }
    .formule-kader { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px; padding: 8px 12px; margin: 8px 0; overflow-x: auto; }
    .formule-kader .katex-display { margin: .2em 0; }
    .voorbeeld-knoppen { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .voorbeeld-vak { margin-top: 12px; border: 2px dashed var(--paars-rand); border-radius: 12px; padding: 12px 14px; background: #fafaff; }
    .th-inhoud { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

    /* ---------- rapport ---------- */
    .rapport-kop { text-align: center; }
    .rapport-info { color: var(--zacht); margin-top: 6px; font-size: .95rem; }
    .score { display: inline-block; margin-top: 14px; padding: 10px 26px; border-radius: 999px; background: #f1f5f9; font-size: 1.45rem; font-weight: 800; }
    .score.goed { color: #047857; } .score.matig { color: #b45309; } .score.zwak { color: #be123c; }
    .vraag-kop { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
    .vraag-kop h3 { font-size: 1rem; }
    .stempel { font-size: .75rem; font-weight: 800; padding: 3px 10px; border-radius: 6px; white-space: nowrap; }
    .juist .stempel { background: #a7f3d0; color: #065f46; } .fout .stempel { background: #fecdd3; color: #9f1239; } .deels .stempel { background: #fde68a; color: #92400e; } .neutraal .stempel { background: #e2e8f0; color: #334155; }
    .antw-deel { background: rgba(255,255,255,.8); border-radius: 10px; padding: 8px 12px; margin-top: 8px; }
    .antw-deel .tit { font-size: .74rem; font-weight: 800; color: var(--zacht); text-transform: uppercase; letter-spacing: .04em; }
    .antw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .antw-grid > div { min-width: 0; overflow-x: auto; overflow-y: hidden; }
    .antw-deel .katex-display { margin: 2px 0; text-align: left; }
    .antw-deel .katex-display > .katex { text-align: left; }
    .antw-deel .fb { font-size: .88rem; margin-top: 4px; }
    .samenvatting-tabel { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: .92rem; }
    .samenvatting-tabel th, .samenvatting-tabel td { padding: 6px 8px; border-bottom: 1px solid var(--rand); text-align: left; }
    .samenvatting-tabel th { background: #f8fafc; }

    /* ---------- rapportblokken (scherm en PDF) ---------- */
    .rapport { line-height: 1.45; color: var(--tekst); }
    .vk { border-left: 8px solid #cbd5e1; background: #f8fafc; padding: 6px 16px; overflow-x: auto; overflow-y: hidden; }
    .vk.eerste { margin-top: 14px; border-top-right-radius: 12px; padding-top: 12px; }
    .vk.laatste { border-bottom-right-radius: 12px; padding-bottom: 12px; }

// testpunten in een interval (geen randen, geen ronde getallen)
function testPunten(dom, n = 13) {
    const [a, b] = dom;
    return Array.from({ length: n }, (_, i) => a + (b - a) * (i + 0.5 + 0.3 * Math.sin(7.3 * i + 1.1)) / n);
}
// vergelijkt twee rekenbomen numeriek
function vergelijk(sBoom, jBoom, dom, v = 'x') {
    let ok = 0, fout = 0, sNaN = 0;
    const S = [], J = [];
    for (const x of testPunten(dom)) {
        const env = { [v]: x };
        const j = Expr.waarde(jBoom, env);
        if (!Number.isFinite(j)) continue;
        const s = Expr.waarde(sBoom, env);
        if (!Number.isFinite(s)) { sNaN++; continue; }
        S.push(s); J.push(j);
        if (Math.abs(s - j) <= 1e-7 * (1 + Math.abs(s) + Math.abs(j))) ok++; else fout++;
    }
    return { gelijk: fout === 0 && sNaN <= 1 && ok >= 5, S, J, ok, fout, sNaN };
}

// 3. GRAFIEKEN (SVG) EN TEKENTABELLEN
// =====================================================================
let svgTeller = 0;
function grafiek(o) {
    const xmin = o.xmin ?? -5, xmax = o.xmax ?? 5, ymin = o.ymin ?? -5, ymax = o.ymax ?? 5, b = o.b ?? 330;
    const s = b / (xmax - xmin), h = Math.round((ymax - ymin) * s);
    const X = x => +((x - xmin) * s).toFixed(1), Y = y => +((ymax - y) * s).toFixed(1);
    const id = 'kp' + (++svgTeller) + '_' + Math.floor(Math.random() * 1e6);
    const fs = o.klein ? 10 : 11;
    let g = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -12 ${b + 28} ${h + 24}" width="${b + 28}" height="${h + 24}" class="grafiek" role="img" aria-label="${esc(o.aria || 'grafiek')}" style="font-family:system-ui,Segoe UI,Arial,sans-serif">`;
    g += `<defs><clipPath id="${id}"><rect x="0" y="0" width="${b}" height="${h}"/></clipPath></defs>`;
    g += `<rect x="0" y="0" width="${b}" height="${h}" fill="#ffffff" stroke="#cbd5e1"/>`;
    for (let x = Math.ceil(xmin); x <= xmax; x++) g += `<line x1="${X(x)}" y1="0" x2="${X(x)}" y2="${h}" stroke="#e2e8f0" stroke-width="1"/>`;
    for (let y = Math.ceil(ymin); y <= ymax; y++) g += `<line x1="0" y1="${Y(y)}" x2="${b}" y2="${Y(y)}" stroke="#e2e8f0" stroke-width="1"/>`;
    const xas = ymin < 0 && ymax > 0, yas = xmin < 0 && xmax > 0;
    if (xas) g += `<line x1="0" y1="${Y(0)}" x2="${b}" y2="${Y(0)}" stroke="#475569" stroke-width="1.4"/><polygon points="${b},${Y(0)} ${b - 7},${Y(0) - 4} ${b - 7},${Y(0) + 4}" fill="#475569"/><text x="${b - 4}" y="${Y(0) - 7}" font-size="${fs + 1}" fill="#334155" font-style="italic" text-anchor="end">x</text>`;
    if (yas) g += `<line x1="${X(0)}" y1="${h}" x2="${X(0)}" y2="0" stroke="#475569" stroke-width="1.4"/><polygon points="${X(0)},0 ${X(0) - 4},7 ${X(0) + 4},7" fill="#475569"/><text x="${X(0) + 8}" y="10" font-size="${fs + 1}" fill="#334155" font-style="italic">y</text>`;
    const stapX = (xmax - xmin) > 12 ? 2 : 1, stapY = (ymax - ymin) > 12 ? 2 : 1;
    if (!o.geenGetallen) {
        for (let x = Math.ceil(xmin / stapX) * stapX; x <= xmax; x += stapX) if (x !== 0 && x > xmin && x < xmax) g += `<text x="${X(x)}" y="${(xas ? Y(0) : h) + 13}" font-size="${fs}" fill="#64748b" text-anchor="middle">${x < 0 ? '−' + (-x) : x}</text>`;
        for (let y = Math.ceil(ymin / stapY) * stapY; y <= ymax; y += stapY) if (y !== 0 && y > ymin && y < ymax) g += `<text x="${(yas ? X(0) : 0) - 5}" y="${Y(y) + 4}" font-size="${fs}" fill="#64748b" text-anchor="end">${y < 0 ? '−' + (-y) : y}</text>`;
        if (xas && yas) g += `<text x="${X(0) - 5}" y="${Y(0) + 13}" font-size="${fs}" fill="#64748b" text-anchor="end">0</text>`;
    }
    for (const a of o.va || []) g += `<line x1="${X(a)}" y1="0" x2="${X(a)}" y2="${h}" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4"/>`;
    for (const c of o.ha || []) g += `<line x1="0" y1="${Y(c)}" x2="${b}" y2="${Y(c)}" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4"/>`;
    for (const k of o.krommen || []) {
        let d = '', aan = false, vorige = null;
        const marge = (ymax - ymin) * 1.5, n = 600;
        for (let i = 0; i <= n; i++) {
            const x = xmin + (xmax - xmin) * i / n, y = k.f(x);
            if (!Number.isFinite(y) || y > ymax + marge || y < ymin - marge || (vorige !== null && Math.abs(y - vorige) > (ymax - ymin))) { aan = false; vorige = Number.isFinite(y) ? y : null; continue; }
            d += (aan ? 'L' : 'M') + X(x) + ' ' + Y(y) + ' ';
            aan = true; vorige = y;
        }
        g += `<path d="${d}" fill="none" stroke="${k.kleur || '#2563eb'}" stroke-width="${k.dik || 2.4}" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#${id})"${k.stippel ? ' stroke-dasharray="6 4"' : ''}/>`;
        if (k.label) g += `<text x="${X(k.label[0])}" y="${Y(k.label[1])}" font-size="${fs + 2}" fill="${k.kleur || '#2563eb'}" font-style="italic" font-weight="700">${esc(k.label[2])}</text>`;
    }
    for (const l of o.lijnen || []) {
        const x1 = l.x1 ?? xmin, x2 = l.x2 ?? xmax;
        g += `<line x1="${X(x1)}" y1="${Y(l.m * x1 + l.q)}" x2="${X(x2)}" y2="${Y(l.m * x2 + l.q)}" stroke="${l.kleur || '#e11d48'}" stroke-width="${l.dik || 1.8}" clip-path="url(#${id})"/>`;
    }
    for (const p of o.punten || []) {
        g += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${p.r || 4}" fill="${p.leeg ? '#fff' : (p.kleur || '#0f172a')}" stroke="${p.kleur || '#0f172a'}" stroke-width="1.6"/>`;
        if (p.label) g += `<text x="${X(p.x) + (p.dx ?? 7)}" y="${Y(p.y) + (p.dy ?? -7)}" font-size="${fs + 2}" fill="#0f172a" font-weight="700">${esc(p.label)}</text>`;
    }
    if (o.titel) g += `<text x="6" y="${h - 6}" font-size="${fs + 2}" fill="#0f172a" font-weight="700">${esc(o.titel)}</text>`;
    return g + '</svg>';
}

// ---------- tekentabellen ----------
// xs: tex van de bijzondere waarden; rijen: [labelTex, cellen] met 2·k+1 cellen (interval, punt, interval, ...)
function tabel(xs, rijen, opt = {}) {
    const n = xs.length * 2 + 1;
    const kop = Array.from({ length: n }, (_, i) => i % 2 ? xs[(i - 1) / 2] : '');
    const lijn = opt.lijnVoor ?? rijen.length - 1;   // horizontale lijn voor de laatste rij(en)
    const body = rijen.map(([l, cel], i) => (i === lijn && lijn > 0 ? L`\hline ` : '') + l + ' & ' + cel.map(c => c === '|' ? L`\vert` : c).join(' & ')).join(L` \\ `);
    return L`\begin{array}{c|${'c'.repeat(n)}} x & ${kop.join(' & ')} \\ \hline ${body} \end{array}`;
}
const pijl = t => t === '+' ? L`\nearrow` : L`\searrow`;
const boog = t => t === '+' ? L`\cup` : L`\cap`;
const tk = v => v > 0 ? '+' : v < 0 ? '-' : '0';
// tekentabel opbouwen uit factoren: elke factor {tex, f(x) → getal, noemer?}
// xs: gesorteerde getallen (bijzondere waarden), xsTex: hun tex
function tekenTabel(xs, xsTex, factoren, eind) {
    const mid = [xs[0] - 1, ...xs.slice(1).map((x, i) => (xs[i] + x) / 2), xs[xs.length - 1] + 1];
    const rijen = factoren.map(fc => {
        const cel = [];
        mid.forEach((m, i) => { cel.push(tk(fc.f(m))); if (i < xs.length) { const v = fc.f(xs[i]); cel.push(Math.abs(v) < 1e-9 ? '0' : tk(v)); } });
        return [fc.tex, cel];
    });
    const cel = [];
    mid.forEach((m, i) => {
        cel.push(tk(factoren.reduce((p, fc) => p * Math.sign(fc.f(m)), 1)));
        if (i < xs.length) {
            const nulN = factoren.some(fc => fc.noemer && Math.abs(fc.f(xs[i])) < 1e-9);
            const nulT = factoren.some(fc => !fc.noemer && Math.abs(fc.f(xs[i])) < 1e-9);
            cel.push(nulN ? '|' : nulT ? '0' : tk(factoren.reduce((p, fc) => p * Math.sign(fc.f(xs[i])), 1)));
        }
    });
    rijen.push([eind.tex, cel]);
    if (eind.pijlen) {
        const pc = [];
        mid.forEach((m, i) => { pc.push(eind.pijlen === 'boog' ? boog(cel[2 * i]) : pijl(cel[2 * i])); if (i < xs.length) pc.push(eind.punten ? eind.punten[i] : ''); });
        rijen.push([eind.pijlTex || 'f(x)', pc]);
    }
    return tabel(xsTex, rijen, { lijnVoor: factoren.length > 1 ? factoren.length : 1 });
}

// 5. ANTWOORDEN LEZEN
// =====================================================================
const EENHEDEN = /\s*(km\/h|km\/u|m\/s²|m\/s\^2|m\/s|mmhg\/s|cm³|cm\^3|dm³|dm\^3|cm²|cm\^2|m²|m\^2|liter|euro|eur|€|cm|dm|mm|km|m|s|sec|seconden|uur|u|h|min|stuks|paar|l|°)\.?\s*$/i;
function leesGetal(str) {
    let s = String(str ?? '').trim();
    if (!s) throw new LeesFout('Vul een getal in.');
    s = s.replace(/^[a-zA-Z](?:'|′|″|'')?(?:\([^)]*\))?\s*=\s*/, '');            // "x = 3" of "f(2) = 5" mag
    s = s.replace(/(\d)\s+(?=\d{3}(?!\d))/g, '$1');                        // 72 250 → 72250
    s = s.replace(/^\s*≈\s*/, '');
    let boom;
    try { boom = Expr.ontleed(s, []); }
    catch (e) {
        const z = s.replace(EENHEDEN, '');
        if (z !== s && z.trim()) { boom = Expr.ontleed(z, []); s = z; } else throw e;
    }
    const v = Expr.waarde(boom, {});
    if (!Number.isFinite(v)) throw new LeesFout('Dit getal bestaat niet (bv. deling door 0 of ln van een negatief getal).');
    const kaal = Expr.voorbereid(s).replace(/\s/g, '');
    const m = kaal.match(/^[+-]?\d*\.(\d+)$/);
    const dec = m ? m[1].length : /^[+-]?\d+$/.test(kaal) ? 0 : null;
    const duizend = /^\d{1,3}(\.\d{3})+$/.test(kaal) ? +kaal.replace(/\./g, '') : null;
    return { v, dec, tex: Expr.tex(boom), duizend };
}
function minDecVoor(J, d) { return d.minDec ?? (Math.abs(J) >= 100 ? 0 : Math.abs(J) >= 10 ? 1 : 2); }
// 'exact' | 'afgerond' | 'grof' | false
function getalOK(g, J, d = {}) {
    const diff = Math.abs(g.v - J);
    if (diff <= 1e-9 * Math.max(1, Math.abs(J))) return 'exact';
    if (g.duizend !== null && g.duizend !== undefined && Math.abs(g.duizend - J) <= 1e-9 * Math.max(1, Math.abs(J))) return 'exact';
    if (d.tol && diff <= d.tol) return 'afgerond';
    if (g.dec !== null && g.dec !== undefined && diff <= 0.5 * Math.pow(10, -g.dec) + 1e-9 * Math.max(1, Math.abs(J))) return g.dec >= minDecVoor(J, d) ? 'afgerond' : 'grof';
    return false;
}
const bijnaGetal = (g, w) => Math.abs(g.v - w) <= 1e-9 * Math.max(1, Math.abs(w)) || (g.dec >= 1 && Math.abs(g.v - w) <= 0.5 * Math.pow(10, -g.dec) + 1e-12);
// waarde (Fr, getal of tekst zoals 'ln(3)') → { v, tex, txt }
function waardeVan(x) {
    if (x instanceof Fr) return { v: x.v, tex: x.tex(), txt: x.txt() };
    if (typeof x === 'number') return { v: x, tex: Number.isInteger(x) ? String(x) : isMooi(x) ? nlTex(x, 6) : L`\approx ` + nlTex(x, 2), txt: String(x) };
    const boom = Expr.ontleed(x, []);
    return { v: Expr.waarde(boom, {}), tex: Expr.tex(boom), txt: String(x) };
}
function leesLim(str) {
    const t = String(str ?? '').trim().toLowerCase();
    if (!t) throw new LeesFout('Vul je antwoord in: een getal, +inf, -inf of bestaat niet.');
    if (/bestaat\s*niet|^b\.?\s*n\.?$|^∄$/.test(t)) return { k: 'bn' };
    const u = t.replace(/[−–—]/g, '-').replace(/\s/g, '');
    if (/^(±|\+-|\+\/-)(∞|inf|oneindig)$/.test(u)) return { k: 'pm' };
    if (/^\+?(∞|inf|infinity|oneindig|plusoneindig)$/.test(u)) return { k: 'pinf' };
    if (/^(-(∞|inf|infinity|oneindig)|minoneindig)$/.test(u)) return { k: 'minf' };
    const g = leesGetal(str);
    return { k: 'num', ...g };
}
const limWoord = { pinf: L`+\infty`, minf: L`-\infty`, pm: L`\pm\infty`, bn: L`\text{bestaat niet}` };
function limAntwTex(a) { return a.k === 'num' ? a.tex : limWoord[a.k]; }
function leesLijst(str) {
    let s = String(str ?? '').trim();
    if (!s) throw new LeesFout('Vul de waarden in, gescheiden door ; (bv. -1 ; 3).');
    s = s.replace(/,\s+/g, ' ; ');
    const delen = s.split(/\s*(?:;|\ben\b|\bof\b|\||\bv\b|∨)\s*/i).map(x => x.trim()).filter(Boolean);
    if (!delen.length) throw new LeesFout('Vul de waarden in, gescheiden door ; (bv. -1 ; 3).');
    return delen.map(x => leesGetal(x));
}
function leesRechte(str) {
    let s = String(str ?? '').trim();
    if (!s) throw new LeesFout('Typ de vergelijking van de rechte, bv. y = 2x - 1.');
    s = s.replace(/^t\s*(<->|↔|<=>|⟺|:)\s*/i, '').replace(/↔|⟺/g, '=');
    const delen = s.split('=');
    if (delen.length > 2) throw new LeesFout('Gebruik maar één =-teken.');
    const Lb = delen.length === 2 ? Expr.ontleed(delen[0], ['x', 'y']) : { t: 'var', n: 'y' };
    const Rb = Expr.ontleed(delen.length === 2 ? delen[1] : delen[0], ['x', 'y']);
    const g = (x, y) => Expr.waarde(Lb, { x, y }) - Expr.waarde(Rb, { x, y });
    const xs = [-1.7, -0.6, 0.4, 1.3, 2.2];
    const ys = xs.map(x => {
        const a = g(x, 0), b = g(x, 1) - a, c = g(x, 2) - a;
        if (![a, b, c].every(Number.isFinite)) return NaN;
        if (Math.abs(c - 2 * b) > 1e-6 * (1 + Math.abs(c))) return 'nl';
        if (Math.abs(b) < 1e-12) return 'geenY';
        return -a / b;
    });
    if (ys.includes('geenY')) throw new LeesFout('In je vergelijking staat geen y (of de y valt weg). Schrijf bv. y = 2x - 1.');
    if (ys.includes('nl')) throw new LeesFout('Dit is geen vergelijking van een rechte: y komt niet in de eerste graad voor.');
    if (ys.some(y => !Number.isFinite(y))) throw new LeesFout('Ik kan deze vergelijking niet lezen.');
    const m = (ys[1] - ys[0]) / (xs[1] - xs[0]), q = ys[0] - m * xs[0];
    if (!xs.every((x, i) => Math.abs(ys[i] - (m * x + q)) < 1e-6 * (1 + Math.abs(ys[i])))) throw new LeesFout('Dit is geen vergelijking van een rechte: x komt niet in de eerste graad voor.');
    return { m, q, tex: (delen.length === 2 ? Expr.tex(Lb) + ' = ' : 'y = ') + Expr.tex(Rb) };
}

const OK = (msg = 'Juist!', x = {}) => Object.assign({ ok: true, msg }, x);
const NOK = (msg, code = 'onbekend', x = {}) => Object.assign({ ok: false, msg, code }, x);
const KNOP = {
    getal: [['√', 'sqrt('], ['/', '/'], ['(', '('], [')', ')'], ['π', 'π'], ['e', 'e'], ['ln', 'ln(']],
    expr: [['√', 'sqrt('], ['x²', '^2'], ['^', '^'], ['/', '/'], ['(', '('], [')', ')']],
    explog: [['eˣ', 'e^('], ['ln', 'ln('], ['log', 'log('], ['logₐ', 'log_']],
    gonio: [['sin', 'sin('], ['cos', 'cos('], ['tan', 'tan('], ['π', 'π']],
    lim: [['+∞', '+∞'], ['−∞', '-∞'], ['±∞', '±∞'], ['bestaat niet', 'bestaat niet'], ['/', '/'], ['√', 'sqrt(']],
    lijst: [[';', ' ; '], ['√', 'sqrt('], ['/', '/'], ['π', 'π']],
};
const TYPES = {};

TYPES.getal = {
    velden: d => [{ soort: 'tekst', key: 'g', label: d.label, ph: d.ph || 'bv. 3/4 of 2,5', smal: true, knoppen: d.knoppen || KNOP.getal, na: d.eenheid }],
    controleer(d, w) {
        const g = leesGetal(w.g);
        const st = getalOK(g, d.juist, d);
        if (st === 'exact') return OK(d.okMsg || 'Juist!');
        if (st === 'afgerond') return OK(`Juist (afgerond). Exacte waarde: $${d.juistTex}$`);
        if (d.ookAbs && ['exact', 'afgerond'].includes(getalOK({ ...g, v: -g.v }, d.juist, d))) return OK(d.absMsg || 'Juist, op het teken na: het minteken betekent dat het voorwerp naar beneden beweegt.');
        for (const f of d.fouten) if (bijnaGetal(g, waardeVan(f.w).v)) return NOK(f.msg, f.code);
        if (st === 'grof') return NOK(`Bijna, maar te ruw afgerond. Rond af op minstens ${minDecVoor(d.juist, d)} decimalen of geef de exacte waarde.`, 'afronding');
        if (Math.abs(d.juist) > 1e-9 && bijnaGetal(g, -d.juist)) return NOK('Je antwoord heeft het verkeerde teken.', 'teken');
        return NOK(d.tip || 'Dit is niet het juiste getal.', d.code || 'onbekend');
    },
    toon: (d, w) => (d.label ? d.label + ' ' : '') + leesGetal(w.g).tex + (d.eenheid ? L`\ \text{${d.eenheid}}` : ''),
    juist: d => (d.label ? d.label + ' ' : '') + d.juistTex + (d.eenheid ? L`\ \text{${d.eenheid}}` : ''),
    invoer: d => ({ g: d.juistTxt }),
};

TYPES.lim = {
    velden: d => [{ soort: 'tekst', key: 'g', label: d.label, ph: 'bv. 3, +inf, -inf of bestaat niet', smal: true, knoppen: KNOP.lim, preview: 'lim' }],
    controleer(d, w) {
        const a = leesLim(w.g), J = d.juist;
        if (J.k === 'num') {
            if (a.k !== 'num') return NOK(a.k === 'bn' ? 'Deze limiet bestaat wel: het is een reëel getal.' : 'Deze limiet is een reëel getal, niet oneindig.', d.code || 'onbekend');
            const st = getalOK(a, J.v, d);
            if (st === 'exact' || st === 'afgerond') return OK();
            for (const f of d.fouten) if (bijnaGetal(a, waardeVan(f.w).v)) return NOK(f.msg, f.code);
            if (st === 'grof') return NOK('Bijna, maar te ruw afgerond. Geef de exacte waarde (bv. als breuk).', 'afronding');
            return NOK(d.tip || 'Dit is niet de juiste limiet.', d.code || 'rekenen');
        }
        if (J.k === 'bn') {
            if (a.k === 'bn') return OK('Juist: LL ≠ RL, dus de limiet bestaat niet.');

        if (a.k === 'pinf' || a.k === 'minf') return NOK(d.tekenMsg || 'Het teken is verkeerd.', d.code === 'ht' ? 'ht' : d.code === 'llrl' ? 'llrl' : 'teken');

TYPES.lijst = {
    velden: d => [{ soort: 'tekst', key: 'g', label: d.label, ph: d.ph || 'bv. -1 ; 3', knoppen: d.knoppen || KNOP.lijst, preview: 'lijst', na: d.na }],
    controleer(d, w) {
        const lijst = leesLijst(w.g);
        for (const f of d.fouten) {
            const W = f.w.map(x => waardeVan(x).v);
            if (W.length === lijst.length && W.every(x => lijst.some(g => bijnaGetal(g, x)))) return NOK(f.msg, f.code);
        }
        const vrij = d.juist.map(() => true);
        let m = 0, grof = false;
        for (const g of lijst) {
            const i = d.juist.findIndex((J, k) => vrij[k] && ['exact', 'afgerond'].includes(getalOK(g, J.v, d)));
            if (i >= 0) { vrij[i] = false; m++; }
            else if (d.juist.some((J, k) => vrij[k] && getalOK(g, J.v, d) === 'grof')) grof = true;
        }
        const n = d.juist.length, extra = lijst.length - m;
        if (m === n && extra === 0) return OK(n > 1 ? 'Juist! Je vond alle waarden.' : 'Juist!');
        const score = d.punten * Math.max(0, m - extra) / n;
        if (grof) return NOK('Bijna: rond nauwkeuriger af (minstens 2 decimalen) of geef de exacte waarden.', 'afronding', { score });
        if (m === n) return NOK(`Je vond alle juiste waarden, maar je hebt er ${extra === 1 ? 'één' : extra} te veel.` + (d.teveelMsg ? ' ' + d.teveelMsg : ''), d.code || 'nulwaarden', { score });
        if (m > 0) return NOK(`${m} van de ${n} waarden ${m === 1 ? 'is' : 'zijn'} juist.` + (extra ? ` Je hebt ook ${extra === 1 ? 'een waarde' : extra + ' waarden'} die niet klopt.` : ` Er ontbreekt er nog ${n - m === 1 ? 'één' : n - m}.`) + (d.tip ? ' ' + d.tip : ''), d.code || 'nulwaarden', { score });
        return NOK((n > 1 ? 'Geen van je waarden is juist.' : 'Dit is niet juist.') + (d.tip ? ' ' + d.tip : ''), d.code || 'nulwaarden');
    },
    toon: (d, w) => (d.label ? d.label + ' ' : '') + leesLijst(w.g).map(g => g.tex).join(L`\ ;\ `),
    juist: d => (d.label ? d.label + ' ' : '') + d.juist.map(J => J.tex).join(L`\ ;\ `),
    invoer: d => ({ g: d.juist.map(J => J.txt).join(' ; ') }),

TYPES.punt = {
    velden: d => [{ soort: 'co', naam: d.naam || '' }],

        if (okx) return NOK(d.yMsg || 'De x-coördinaat is juist, maar de y-coördinaat niet. Vul de x-waarde in het voorschrift van f in.', 'fa', { score: d.punten / 2 });

TYPES.rechte = {
    velden: d => [{ soort: 'tekst', key: 'v', label: L`t \leftrightarrow`, ph: 'bv. y = 2x - 1', knoppen: d.knoppen || KNOP.expr, preview: 'rechte' }],
    controleer(d, w) {
        const { m, q } = leesRechte(w.v);

        const gelijk = (a, b, t = 1e-7) => Math.abs(a - b) <= t * Math.max(1, Math.abs(b));
        if (gelijk(m, M) && gelijk(q, Q)) return OK();
        if (Math.abs(m - M) <= 0.006 + 1e-4 * Math.abs(M) && Math.abs(q - Q) <= 0.006 + 1e-4 * Math.abs(Q)) return OK(`Juist (afgerond). Exact: $${d.juistTex}$`);

TYPES.keuze = {

TYPES.expr = {
    velden: d => [{ soort: 'tekst', key: 'e', label: d.label, ph: d.ph || 'typ je antwoord', vars: d.vars, knoppen: d.knoppen || KNOP.expr, preview: 'expr' }],

        const J = Expr.ontleed(d.juist, d.vars), v = d.vars[0];
        const c = vergelijk(boom, J, d.dom, v);
        if (c.gelijk) return OK(d.okMsg || (d.vereenvoudig ? 'Juist! Vergelijk je vereenvoudiging nog met de sleutel.' : 'Juist!'));
        for (const f of d.fouten) {
            let fb;
            try { fb = Expr.ontleed(f.e, d.vars); } catch (e) { continue; }
            if (vergelijk(boom, fb, d.dom, v).gelijk) return NOK(f.msg, f.code);
        }
        if (c.S.length >= 5) {
            const q = c.S.map((s, i) => s / c.J[i]).filter(Number.isFinite);
            if (q.length >= 5 && Math.abs(q[0]) > 1e-9 && q.every(x => Math.abs(x - q[0]) < 1e-6 * (1 + Math.abs(q[0])))) {
                if (Math.abs(q[0] + 1) < 1e-6) return NOK('Je antwoord heeft juist het omgekeerde teken van het juiste antwoord.', 'teken');
                return NOK(`Je antwoord is ${nl(q[0], 3)} keer het juiste antwoord: er klopt een constante factor niet.`, d.factorCode || 'factor');
            }
            const vs = c.S.map((s, i) => s - c.J[i]);
            if (vs.every(x => Math.abs(x - vs[0]) < 1e-6 * (1 + Math.abs(vs[0])))) return NOK(d.afgeleide ? 'Je antwoord verschilt een constante van het juiste antwoord. Let op: de afgeleide van een constante is 0.' : 'Je antwoord verschilt een constante van het juiste antwoord.', d.afgeleide ? 'constante' : 'rekenen');
        }
        if (c.sNaN > 1) return NOK('Je uitdrukking bestaat niet voor alle waarden waar het juiste antwoord bestaat. Controleer je haakjes.', 'rekenen');
        return NOK(d.tip || 'Dit is niet juist.', d.code || 'onbekend');
    },
    toon: (d, w) => (d.label ? d.label + ' ' : '') + Expr.tex(Expr.ontleed(w.e, d.vars)),
    juist: d => (d.label ? d.label + ' ' : '') + d.juistTex,
    invoer: d => ({ e: d.juist }),
};

    },
    rechte(vraag, m, q, o = {}) {

        return { type: 'expr', gg: o.gg, vraag, juist, juistTex, label: o.label ?? L`f'(x) =`, vars, dom, punten: o.punten ?? 1, fouten, tip: o.tip, code: o.code, afgeleide: o.afgeleide ?? true, vereenvoudig: o.vereenvoudig, knoppen: o.knoppen, ph: o.ph, factorCode: o.factorCode, van: o.van };
    },
};

function rPoly(r, deg, lead, b = 6) { const c = []; for (let i = 0; i < deg; i++) c.push(r.int(-b, b)); c.push(lead); return new Poly(c); }
const mono = (k, n) => { const c = Array(n).fill(0); c.push(k); return new Poly(c); };
const macht = (t, e) => e === 1 ? par(t) : L`\left(${t}\right)^{${e}}`;
const intv = (a, b) => L`\left]${a}, ${b}\right[`;
const MININF = L`-\infty`, PLUSINF = L`+\infty`;
const coefTex = k => { const t = Fr.of(k).tex(); return t === '1' ? '' : t === '-1' ? '-' : t; };
function primitief(dp, c0 = 0) { return new Poly([c0, ...dp.c.map((c, i) => c.door(i + 1))]); }
// langste deelinterval van [lo, hi] waar f(x) > min (voor het nakijken bij wortels en logaritmen)
function domPos(f, lo = -3, hi = 3, min = 0.15) {
    let best = null, start = null;
    const stap = 0.05;
    for (let x = lo; x <= hi + 1e-9; x += stap) {
        const y = f(x), ok = Number.isFinite(y) && y > min;
        if (ok && start === null) start = x;
        const laatste = x + stap > hi + 1e-9;
        if ((!ok || laatste) && start !== null) {
            const eind = ok ? x : x - stap;
            if (!best || eind - start > best[1] - best[0]) best = [start, eind];
            start = null;
        }
    }
    return best && best[1] - best[0] >= 1 ? [best[0] + 0.05, best[1] - 0.05] : null;
}
// de stappen van een raaklijn: a, fa, m zijn breuken
function raakStappen(a, fa, m) {
    const q = fa.min(m.maal(a));
    return [
        L`$t \leftrightarrow y - f(a) = f'(a)\,(x - a)$`,
        L`$t \leftrightarrow y - ${fa.texP()} = ${m.texP()}\left(x - ${Fr.of(a).texP()}\right)$`,
        L`!$t \leftrightarrow ${rechteTex(m, q)}$`,
    ];
}

            L`$${limTex(PLUSINF.replace('+', '\\pm '))} ${fr(t.tex(), n.tex())} \overset{\text{H.T.}}{=} ${limTex(PLUSINF.replace('+', '\\pm '))} ${fr(coefTex(p) + 'x', coefTex(c) + 'x')} = ${HA.tex()}$`,

            L`Net rechts van $${VA.tex()}$: teller $\approx ${t.at(VA).tex()}$ en de noemer is ${Math.sign(c) > 0 ? 'positief' : 'negatief'}, dus RL $= ${infTex(RL)}$.`,
        ],
    };
}));

    const LL = c > 0 ? '-inf' : '+inf', RL = c > 0 ? '+inf' : '-inf';

            D.lim(L`$${limTex(a, '>')} f(x)$`, RL, { punten: 0.5, code: 'llrl' }),
            D.lim(L`$${limTex(PLUSINF)} f(x)$`, k, { punten: 0.5, code: 'asymptoot' }),

G('lim-exp', 'lim', 1, 'Gedrag op oneindig van een exponentiële functie', r => {
    const A = r.pick([{ t: '2', v: 2 }, { t: '3', v: 3 }, { t: L`\left(0{,}5\right)`, v: 0.5 }, { t: L`\left(0{,}2\right)`, v: 0.2 }, { t: L`\left(\frac{1}{3}\right)`, v: 1 / 3 }]);
    const k = r.pick([1, 2, 3, -1, -2]), c = r.int(-4, 4);
    const ft = `${k === 1 ? '' : k === -1 ? '-' : k + L`\cdot `}${A.t}^{x}${c ? (c > 0 ? ' + ' + c : ' - ' + (-c)) : ''}`;
    const groot = A.v > 1;
    const inf = k > 0 ? '+inf' : '-inf';
    const Lp = groot ? inf : c, Lm = groot ? c : inf;
    return {
        opgave: L`Gegeven is de exponentiële functie $f(x) = ${ft}$.`,
        delen: [
            D.lim(L`$${limTex(PLUSINF)} f(x)$`, Lp, { code: 'asymptoot' }),
            D.lim(L`$${limTex(MININF)} f(x)$`, Lm, { code: 'asymptoot' }),
            D.getal('Noteer een vergelijking van de horizontale asymptoot.', c, { label: 'y =', code: 'asymptoot' }),
        ],
        hints: [groot ? 'Het grondtal is groter dan 1: de macht wordt heel groot voor x → +∞ en nadert 0 voor x → −∞.' : 'Het grondtal ligt tussen 0 en 1: de macht nadert 0 voor x → +∞ en wordt heel groot voor x → −∞.', 'Schets de grafiek: een exponentiële functie heeft een horizontale asymptoot.'],
        stappen: [
            groot ? L`Grondtal $${A.t} > 1$: $${A.t}^{x} \to +\infty$ als $x \to +\infty$ en $${A.t}^{x} \to 0$ als $x \to -\infty$.` : L`Grondtal $0 < ${A.t} < 1$: $${A.t}^{x} \to 0$ als $x \to +\infty$ en $${A.t}^{x} \to +\infty$ als $x \to -\infty$.`,
            L`$${limTex(PLUSINF)} f(x) = ${infTex(String(Lp))}$ en $${limTex(MININF)} f(x) = ${infTex(String(Lm))}$`,
            L`!H.A.: $y = ${c}$`,
        ],
    };
});

G('lim-horner', 'lim', 3, '0/0 bij een derdegraadsveelterm (Horner)', r => herhaal(() => {
    const a = r.zonder(-3, 3, 0);
    const q = Poly.hl(1, r.int(-4, 4), r.int(-6, 6));
    if (q.at(a).nul) return null;
    const t = Poly.lin(a).mul(q);
    const metKw = r.kans(0.5);
    const n = metKw ? Poly.hl(1, 0, -a * a) : Poly.lin(a);
    const rest = metKw ? Poly.lin(-a) : new Poly([1]);
    const lim = q.at(a).door(rest.at(a));
    const h = t.horner(a);
    const nF = metKw ? Poly.lin(a).texP() + Poly.lin(-a).texP() : Poly.lin(a).tex();
    const verv = metKw ? fr(q.tex(), Poly.lin(-a).tex()) : q.tex();
    return {
        opgave: L`Bereken $${limTex(a)} ${fr(t.tex(), n.tex())}$.`,
        delen: [D.lim('De limiet is:', lim, { punten: 2, code: 'ontbinden', fouten: [{ w: 0, code: 'ontbinden', msg: '0/0 is een onbepaaldheid, niet 0: ontbind eerst de teller met Horner.' }] })],
        hints: [L`Invullen geeft $\frac{0}{0}$.`, L`De teller is $0$ voor $x = ${a}$: deel hem met Horner door $${Poly.lin(a).tex()}$.`, metKw ? L`De noemer is een verschil van twee kwadraten: $${n.tex()} = ${nF}$.` : 'Schrap daarna de gemeenschappelijke factor en vul in.'],
        stappen: [
            L`Invullen geeft $\frac{0}{0}$. De teller deel je met Horner door $${Poly.lin(a).tex()}$:`,
            `$$${h.schema}$$`,
            L`dus $${t.tex()} = ${Poly.lin(a).texP()}${q.texP()}$`,
            L`$${limTex(a)} ${fr(t.tex(), n.tex())} = ${limTex(a)} ${fr(Poly.lin(a).texP() + q.texP(), nF)} = ${limTex(a)} ${verv}$`,
            L`!$= ${metKw ? fr(q.at(a).tex(), rest.at(a).tex()) + ' = ' : ''}${lim.tex()}$`,
        ],
    };
}));

G('pt-gemiddeld', 'punt', 1, 'Gemiddelde verandering (differentiequotiënt)', r => {
    const p = r.kans(0.6) ? Poly.hl(r.nz(-2, 2), r.int(-4, 4), r.int(-5, 5)) : Poly.hl(r.pick([1, -1]), r.int(-2, 2), r.int(-4, 4), r.int(-3, 3));
    const a = r.int(-3, 1), b = a + r.int(2, 4);
    const fa = p.at(a), fb = p.at(b), q = fb.min(fa).door(b - a);
    return {
        opgave: L`Gegeven is de functie $${fTex(p)}$.`,
        delen: [
            D.getal(L`Bereken de gemiddelde verandering van $f$ over het interval $\left[${a}, ${b}\right]$.`, q, { punten: 2, code: 'gemiddeld', fouten: [{ w: fb.min(fa), code: 'gemiddeld', msg: L`Je berekende enkel $\Delta f = f(${b}) - f(${a})$. Deel nog door $\Delta x = ${b} - ${texVP(a)}$.` }, { w: fb.plus(fa).door(2), code: 'gemiddeld', msg: 'Dit is het gemiddelde van de twee functiewaarden. De gemiddelde verandering is Δf/Δx.' }] }),
            D.keuze('Wat stelt dit getal grafisch voor?', [
                { t: L`de rico van de rechte door $\left(${a}, f(${a})\right)$ en $\left(${b}, f(${b})\right)$`, ok: true },
                { t: L`de rico van de raaklijn aan de grafiek in $x = ${a}$`, msg: 'De raaklijn hoort bij de ogenblikkelijke verandering (de afgeleide). Hier gaat het om de rechte door de twee eindpunten van het interval.', code: 'gemiddeld' },
                { t: 'de gemiddelde functiewaarde van $f$ op het interval', msg: 'De gemiddelde verandering zegt hoe sterk f stijgt of daalt, niet hoe groot f gemiddeld is.', code: 'gemiddeld' },
                { t: 'de oppervlakte onder de grafiek op het interval', msg: 'Neen: het is een rico, Δy/Δx.', code: 'gemiddeld' },
            ]),
        ],
        hints: [L`Gemiddelde verandering $= \dfrac{\Delta f}{\Delta x} = \dfrac{f(b) - f(a)}{b - a}$`, `Bereken eerst f(${a}) en f(${b}).`],
        stappen: [
            L`$f(${b}) = ${invulTex(p, b)} = ${fb.tex()}$ en $f(${a}) = ${invulTex(p, a)} = ${fa.tex()}$`,
            L`$\dfrac{\Delta f}{\Delta x} = \dfrac{f(${b}) - f(${a})}{${b} - ${texVP(a)}} = \dfrac{${fb.tex()} - ${fa.texP()}}{${b - a}} = ${q.tex()}$`,
            L`!De gemiddelde verandering is $${q.tex()}$: de rico van de rechte door $\left(${a}, ${fa.tex()}\right)$ en $\left(${b}, ${fb.tex()}\right)$.`,
        ],
    };
});

G('pt-delta', 'punt', 2, 'Afgeleide in een punt met de limietdefinitie (Δx)', r => {
    const p2 = r.nz(-3, 3), p1 = r.int(-5, 5), p0 = r.int(-6, 6), a = r.zonder(-3, 3, 0);
    const p = Poly.hl(p2, p1, p0), fa = p.at(a);
    const P = p.c.reduce((acc, c, i) => acc.add(new Poly([a, 1]).pow(i).scale(c)), new Poly([0]));   // f(a + Δx) als veelterm in Δx
    const teller = P.sub(new Poly([fa])), quot = new Poly(teller.c.slice(1));
    const k = quot.at(0);
    const DX = L`\Delta x`;
    const invul = (() => { let s = ''; for (let i = 2; i >= 0; i--) { const c = p.c[i]; if (!c || c.nul) continue; const neg = c.n < 0, ca = c.abs(); const m = i === 0 ? '' : i === 1 ? L`\left(${a} + \Delta x\right)` : L`\left(${a} + \Delta x\right)^{2}`; const t = i === 0 ? ca.tex() : (ca.n === 1 && ca.d === 1 ? '' : ca.tex()) + m; s += s ? (neg ? ' - ' : ' + ') + t : (neg ? '-' : '') + t; } return s; })();
    return {
        opgave: L`Gegeven is $${fTex(p)}$. We berekenen $f'(${a})$ met de limietdefinitie: $f'(${a}) = \lim\limits_{\Delta x \to 0} \dfrac{f(${a} + \Delta x) - f(${a})}{\Delta x}$.`,
        delen: [
            D.expr(L`Werk uit en vereenvoudig zo ver mogelijk: $\dfrac{f(${a} + \Delta x) - f(${a})}{\Delta x}$ (typ Δx als dx of met de knop).`, quot.txt('dx'), { label: '=', vars: ['dx'], dom: [-1.5, 1.5], punten: 2, afgeleide: false, code: 'definitie', juistTex: quot.tex(DX), knoppen: [['Δx', 'Δx'], ['^', '^'], ['(', '('], [')', ')'], ['/', '/']], fouten: [{ e: teller.txt('dx'), code: 'definitie', msg: 'Dit is de teller. Deel nog door Δx: zet Δx voorop in de teller en schrap.' }, { e: `(${P.txt('dx')})/dx`, code: 'definitie', msg: 'Je vergat f(a) af te trekken in de teller.' }] }),
            D.getal(L`Bereken $f'(${a})$.`, k, { label: L`f'(${a}) =`, code: 'definitie', fouten: [{ w: fa, code: 'definitie', msg: `Dit is f(${a}), niet f′(${a}).` }] }),
        ],
        hints: [L`Vul $${a} + \Delta x$ in op de plaats van $x$ en werk de haakjes uit: $(a + b)^2 = a^2 + 2ab + b^2$.`, L`Trek $f(${a}) = ${fa.tex()}$ af: alle termen zonder $\Delta x$ vallen weg.`, L`Zet $\Delta x$ voorop in de teller, schrap $\Delta x$ en laat daarna $\Delta x$ naar $0$ gaan.`],
        stappen: [
            L`$f(${a} + \Delta x) = ${invul} = ${P.tex(DX)}$`,
            L`$f(${a}) = ${invulTex(p, a)} = ${fa.tex()}$`,
            L`$\dfrac{f(${a} + \Delta x) - f(${a})}{\Delta x} = \dfrac{${teller.tex(DX)}}{\Delta x} = \dfrac{\Delta x \left(${quot.tex(DX)}\right)}{\Delta x} = ${quot.tex(DX)}$`,
            L`!$f'(${a}) = \lim\limits_{\Delta x \to 0} \left(${quot.tex(DX)}\right) = ${k.tex()}$`,
            L`>Dit is de rico van de raaklijn aan de grafiek van $f$ in $x = ${a}$.`,
        ],
    };
});

G('pt-raaklijn-gegeven', 'punt', 1, "Raaklijn als f′(a) gegeven is", r => {
    const p = r.kans(0.5) ? Poly.hl(r.nz(-2, 2), r.int(-3, 3), r.int(-3, 3), r.int(-5, 5)) : Poly.hl(r.nz(-3, 3), r.int(-5, 5), r.int(-6, 6));

        delen: [

});

G('pt-raaklijn', 'punt', 2, 'Vergelijking van de raaklijn berekenen', r => {
    const p = Poly.hl(r.nz(-3, 3), r.int(-4, 4), r.int(-4, 4), r.int(-5, 5)), a = r.zonder(-2, 2, 0);

G('pt-rico-punt', 'punt', 1, 'Raaklijn als raakpunt en rico gegeven zijn', r => {
    const mk = () => { const a = r.int(-4, 4); const fa = r.kans(0.3) ? F(r.nz(-7, 7), r.pick([2, 4])) : F(r.int(-8, 8)); const m = r.kans(0.3) ? F(r.nz(-5, 5), 2) : F(r.nz(-5, 5)); return { a, fa, m, q: fa.min(m.maal(a)) }; };
    const A = mk(), B = mk();
    const deel = (P, k) => D.rechte(L`Het raakpunt is $P${ptTex(P.a, P.fa)}$ en $f'(${P.a}) = ${P.m.tex()}$.`, P.m, P.q, { a: P.a, fa: P.fa, punten: 1 });
    return {
        opgave: 'Stel een vergelijking op van de raaklijn aan de grafiek van de functie $f$ in het punt $P$.',
        delen: [deel(A), deel(B)],
        hints: [L`$t \leftrightarrow y - f(a) = f'(a)\,(x - a)$ met $P(a, f(a))$.`, 'Vul de coördinaat van P en de rico in, werk de haakjes uit en zet y alleen.'],
        stappen: [L`a) $P${ptTex(A.a, A.fa)}$, rico $${A.m.tex()}$:`, ...raakStappen(A.a, A.fa, A.m).slice(1), L`b) $P${ptTex(B.a, B.fa)}$, rico $${B.m.tex()}$:`, ...raakStappen(B.a, B.fa, B.m).slice(1)],
    };
});

G('pt-helling', 'punt', 2, 'Punten met een gegeven helling', r => {
    const p = Poly.hl(r.nz(-3, 3), r.int(-6, 6), r.int(-5, 5)), dp = p.d();
    const a0 = F(r.int(-4, 4), r.pick([1, 1, 2]));
    const k = dp.at(a0);
    const c = r.pick([1, 2, -1]), x0 = r.int(1, 3), h = 3 * c * x0 * x0;
    const g = mono(c, 3);
    return {
        opgave: L`Gegeven zijn de functies $${fTex(p)}$ en $g(x) = ${g.tex()}$.`,
        delen: [
            D.getal(L`Bereken $a$ als $f'(a) = ${k.tex()}$.`, a0, { label: 'a =', code: 'rekenen' }),
            D.lijst(L`In welke punten heeft de grafiek van $g$ als helling $${h}$? Geef de $x$-waarden.`, [x0, -x0], { label: 'x =', code: 'nulwaarden', fouten: [{ w: [x0], code: 'nulwaarden', msg: L`Er is nog een tweede oplossing: $x^2 = ${x0 * x0}$ heeft twee oplossingen.` }, { w: [-x0], code: 'nulwaarden', msg: L`Er is nog een tweede oplossing: $x^2 = ${x0 * x0}$ heeft twee oplossingen.` }] }),
            D.getal(L`Wat is de $y$-coördinaat van het punt van de grafiek van $g$ met $x = ${x0}$?`, c * x0 ** 3, { label: 'y =', code: 'fa', fouten: [{ w: h, code: 'fa', msg: 'Dit is de helling g′(x). De y-coördinaat vind je met g(x).' }] }),
        ],
        hints: [L`Bereken eerst $f'(x)$ en stel $f'(a) = ${k.tex()}$.`, L`$g'(x) = ${g.d().tex()}$: stel dit gelijk aan $${h}$ en los op.`],
        stappen: [
            L`$f'(x) = ${dp.tex()}$, dus $f'(a) = ${k.tex()} \iff ${dp.tex('a')} = ${k.tex()} \iff a = ${a0.tex()}$`,
            L`$g'(x) = ${g.d().tex()} = ${h} \iff x^2 = ${x0 * x0} \iff x = ${x0}$ of $x = ${-x0}$`,
            L`!$g(${x0}) = ${c * x0 ** 3}$, dus het punt is $\left(${x0}, ${c * x0 ** 3}\right)$ (en ook $\left(${-x0}, ${-c * x0 ** 3}\right)$).`,
        ],
    };
});

G('pt-evenwijdig', 'punt', 3, 'Raaklijnen evenwijdig met een gegeven rechte', r => herhaal(() => {
    const r1 = r.int(-4, 1), r2 = r.int(r1 + 1, 4);
    const k = r.pick([F(-1, 2), F(1, 2), F(-1), F(1), F(-1, 3), F(1, 3)]);
    const m = r.nz(-6, 6), qr = r.int(-5, 5);
    const dp = Poly.wortels(k, [r1, r2]).add(new Poly([m]));
    const p = primitief(dp, F(r.int(-6, 6), r.pick([1, 3])));
    const vgl = dp.sub(new Poly([m]));                   // = k (x − r1)(x − r2)
    const noem = vgl.c.reduce((l, c) => l * c.d / ggd(l, c.d), 1);
    const vglG = vgl.scale(F(noem * Math.sign(vgl.lead.n), 1));
    return {
        opgave: L`De rechten $t_1$ en $t_2$ raken de grafiek van $${fTex(p)}$ in de punten $P(a, f(a))$ en $Q(b, f(b))$ en zijn allebei evenwijdig met de rechte $y = ${m}x ${qr < 0 ? '- ' + (-qr) : '+ ' + qr}$.`,
        delen: [D.lijst('Bereken $a$ en $b$ (de $x$-waarden van de raakpunten).', [r1, r2], { label: 'x =', punten: 2, code: 'rico', tip: 'Evenwijdige rechten hebben dezelfde rico.' })],
        hints: ['Evenwijdige rechten hebben dezelfde rico.', L`De rico van de raaklijn is $f'(x)$. Stel $f'(x) = ${m}$.`, 'Herleid op 0 en los de tweedegraadsvergelijking op (som en product of discriminant).'],
        stappen: [
            L`$f'(x) = ${dp.tex()}$ en de rico van de rechte is $${m}$.`,
            L`$f'(x) = ${m} \iff ${dp.tex()} = ${m} \iff ${vgl.tex()} = 0 \iff ${vglG.tex()} = 0$`,
            L`!$x = ${r1}$ of $x = ${r2}$, dus $a = ${r1}$ en $b = ${r2}$ (of omgekeerd).`,
        ],
    };
}));

G('pt-delta-raaklijn', 'punt', 3, 'Afgeleide met Δx en raaklijn', r => {
    const c = r.nz(-3, 3), d = r.int(-5, 5), a = r.zonder(-3, 3, 0);

// veelterm (2de of 3de graad) waarvan de grafiek mooi past, met roosterpunten waar ook f′ geheel is
function mooieVeelterm(r) {
    return herhaal(() => {
        let p;
        if (r.kans(0.45)) {
            const k = r.pick([F(1, 2), F(-1, 2), F(1), F(-1), F(1, 4), F(-1, 4)]), h = r.int(-2, 2), v = r.int(-3, 3);
            p = new Poly([k.maal(h * h).plus(v), k.maal(-2 * h), k]);
        } else {
            const k = r.pick([F(1, 2), F(-1, 2), F(1, 3), F(-1, 3), F(1, 4), F(-1, 4), F(1, 6), F(-1, 6)]);
            const w = r.schud([-4, -3, -2, -1, 0, 1, 2, 3, 4]).slice(0, 3).sort((x, y) => x - y);
            if (w[2] - w[0] < 4) return null;
            p = Poly.wortels(k, w).add(new Poly([r.int(-2, 2)]));
        }
        for (let x = -3; x <= 3; x += 0.25) if (Math.abs(p.num(x)) > 5.5) return null;
        const dp = p.d(), kand = [];
        for (let a = -4; a <= 4; a++) { const fa = p.at(a), m = dp.at(a); if (fa.geheel && m.geheel && Math.abs(fa.v) <= 5 && Math.abs(m.v) <= 4) kand.push({ a, fa, m }); }
        return kand.length >= 3 ? { p, dp, kand } : null;
    });
}

// derdegraadsfunctie met extrema in de gehele waarden x1 < x2 (voor de grafieken)
function derdeMetToppen(r, x1, x2, ks = [F(1), F(-1), F(1, 2), F(-1, 2), F(1, 3), F(-1, 3), F(1, 4), F(-1, 4)]) {
    for (const k of r.schud(ks)) {
        const dp = Poly.wortels(k, [x1, x2]);
        let p = primitief(dp);
        const h = Math.abs(p.num(x1) - p.num(x2));
        if (h < 1.5 || h > 8) continue;
        p = p.add(new Poly([Math.round(-(p.num(x1) + p.num(x2)) / 2)]));
        let past = true;
        for (let x = x1 - 1; x <= x2 + 1; x += 0.25) if (Math.abs(p.num(x)) > 5.5) past = false;
        if (past) return { p, dp: p.d(), k };
    }
    return null;
}

G('reg-product', 'regels', 2, 'Productregel', r => {

            { e: `(${t.d().txt()})/(${n.d().txt()})`, code: 'quotient', msg: 'D(f/g) ≠ Df/Dg. Gebruik D(f/g) = (g·Df − f·Dg)/g².' },
        ] })],

        stappen: [

G('ket-samengesteld', 'ketting', 1, 'Samengestelde functies', r => herhaal(() => {
    const f = Poly.hl(r.nz(-3, 3), r.int(-5, 5));
    const c = r.int(-3, 3), kw = r.kans(0.5);
    const g = kw ? { tex: Poly.hl(1, 0, c).tex(), txt: v => `(${v})^2+(${c})`, at: x => Fr.of(x).macht(2).plus(c) }
                 : { tex: fr(1, Poly.lin(-c).tex()), txt: v => `1/((${v})+(${c}))`, at: x => { if (Fr.of(x).plus(c).nul) throw new Error('pool'); return F(1).door(Fr.of(x).plus(c)); } };
    const a = r.int(-2, 3);
    let fga, gfa;
    try { fga = f.at(g.at(a)); gfa = g.at(f.at(a)); } catch (e) { return null; }
    const fog = `(${f.c[1].txt()})*(${g.txt('x')})+(${f.c[0].txt()})`, gof = g.txt(`(${f.txt()})`);
    const staart = (k) => k.nul ? '' : ` ${k.n < 0 ? '-' : '+'} ${k.abs().tex()}`;
    const fogTex = kw ? Poly.hl(1, 0, c).scale(f.c[1]).add(new Poly([f.c[0]])).tex() : fr(f.c[1].tex(), Poly.lin(-c).tex()) + staart(f.c[0]);
    const gofTex = kw ? macht(f.tex(), 2) + staart(F(c)) : fr(1, f.add(new Poly([c])).tex());
    return {
        opgave: L`Gegeven zijn de functies $${fTex(f)}$ en $g(x) = ${g.tex}$.`,
        delen: [
            D.getal(L`Bereken $f\left(g(${a})\right)$.`, fga, { punten: 0.5, code: 'samengesteld', fouten: [{ w: gfa, code: 'samengesteld', msg: `Dit is g(f(${a})). Bij f(g(${a})) bereken je eerst g(${a}).` }] }),
            D.getal(L`Bereken $\left(g \circ f\right)(${a})$.`, gfa, { punten: 0.5, code: 'samengesteld', fouten: [{ w: fga, code: 'samengesteld', msg: `Dit is f(g(${a})). (g∘f)(${a}) = g(f(${a})): eerst f.` }] }),
            D.expr(L`Stel het voorschrift op van $\left(f \circ g\right)(x)$.`, fog, { label: L`(f\circ g)(x) =`, afgeleide: false, code: 'samengesteld', juistTex: fogTex, fouten: [{ e: gof, code: 'samengesteld', msg: 'Je berekende g(f(x)). (f∘g)(x) = f(g(x)): vul g(x) in op de plaats van x in f.' }] }),
            D.expr(L`Stel het voorschrift op van $\left(g \circ f\right)(x)$.`, gof, { label: L`(g\circ f)(x) =`, afgeleide: false, code: 'samengesteld', juistTex: gofTex, fouten: [{ e: fog, code: 'samengesteld', msg: 'Je berekende f(g(x)). (g∘f)(x) = g(f(x)): vul f(x) in op de plaats van x in g.' }] }),
        ],
        hints: [L`$(f \circ g)(x) = f\left(g(x)\right)$: eerst $g$, daarna $f$ ("$f$ na $g$").`, 'Vul het voorschrift van de binnenste functie in op de plaats van x in de buitenste functie.'],
        stappen: [
            L`$g(${a}) = ${g.at(a).tex()}$, dus $f\left(g(${a})\right) = f\left(${g.at(a).tex()}\right) = ${fga.tex()}$`,
            L`$f(${a}) = ${f.at(a).tex()}$, dus $\left(g \circ f\right)(${a}) = g\left(${f.at(a).tex()}\right) = ${gfa.tex()}$`,
            L`$\left(f \circ g\right)(x) = f\left(g(x)\right) = ${fogTex}$`,
            L`!$\left(g \circ f\right)(x) = g\left(f(x)\right) = ${gofTex}$`,
        ],
    };
}));

function kettingDeel(u, n, naam = 'f') {
    const du = u.d();
    const juist = `${n}*(${u.txt()})^(${n - 1})*(${du.txt()})`;
    let tex;
    if (du.deg === 0) { const k = du.c[0].maal(n); tex = n - 1 > 0 ? `${coefTex(k)}${macht(u.tex(), n - 1)}` : fr(k.tex(), macht(u.tex(), 1 - n)); }
    else tex = n - 1 > 0 ? `${n}${macht(u.tex(), n - 1)}${du.texP()}` : fr(`${n}${du.texP()}`, macht(u.tex(), 1 - n));
    const fouten = [
        { e: `${n}*(${u.txt()})^(${n - 1})`, code: 'ketting', msg: L`Je vergat te vermenigvuldigen met de afgeleide van het binnenste: $D\left(${u.tex()}\right) = ${du.tex()}$.` },
        { e: `${n}*(${du.txt()})^(${n - 1})`, code: 'ketting', msg: 'Je verving het binnenste door zijn afgeleide. Laat het binnenste eerst staan (n·fⁿ⁻¹) en vermenigvuldig dán met Df.' },
        { e: `(${u.txt()})^(${n - 1})*(${du.txt()})`, code: 'macht', msg: 'De exponent n moet vooraan als factor komen: D fⁿ = n·fⁿ⁻¹·Df.' },
    ];
    if (n < 0) fouten.push({ e: `${n}*(${u.txt()})^(${n + 1})*(${du.txt()})`, code: 'macht', msg: `De exponent daalt met 1: ${n} − 1 = ${n - 1}.` });
    return { juist, tex, fouten, van: `(${u.txt()})^(${n})`, stap: L`$${naam}'(x) = ${n}${macht(u.tex(), n - 1)}\cdot ${du.texP()} = ${tex}$` };
}
G('ket-macht', 'ketting', 1, 'Kettingregel: D fⁿ = n · fⁿ⁻¹ · Df', r => {
    const u1 = Poly.hl(r.nz(-5, 5), r.nz(-6, 6)), n1 = r.int(2, 6);
    const u2 = Poly.hl(r.nz(-3, 3), r.int(-5, 5), r.nz(-6, 6)), n2 = r.pick([2, 3, 4, -2, -3, -4]);
    const A = kettingDeel(u1, n1, 'f'), B = kettingDeel(u2, n2, 'g');
    return {
        opgave: 'Bereken met de kettingregel.',
        delen: [
            D.expr(L`$f(x) = ${macht(u1.tex(), n1)}$`, A.juist, { van: A.van, juistTex: A.tex, code: 'ketting', fouten: A.fouten }),
            D.expr(L`$g(x) = ${macht(u2.tex(), n2)}$`, B.juist, { van: B.van, label: L`g'(x) =`, juistTex: B.tex, code: 'ketting', fouten: B.fouten, punten: 2 }),
        ],
        hints: [L`Machtregel: $D f^n = n\cdot f^{n-1}\cdot Df$.`, 'Leid eerst de macht af (buitenste functie) en vermenigvuldig dan met de afgeleide van wat tussen de haakjes staat.'],
        stappen: [L`$D f^n = n\cdot f^{n-1}\cdot Df$`, A.stap, B.stap, '!Vergeet nooit de factor Df (de afgeleide van het binnenste).'],
    };
});

G('ket-product', 'ketting', 2, 'Kettingregel en productregel', r => {
    const u = Poly.hl(1, r.nz(-4, 4), 0), v = Poly.hl(r.nz(-3, 3), r.nz(-6, 6));

    return {
        opgave: L`Bereken de afgeleide van $f(x) = ${macht(u.tex(), m)}${macht(v.tex(), n)}$ en vereenvoudig door gemeenschappelijke factoren voorop te plaatsen.`,
        delen: [D.expr('', juist, { van: `(${U})^${m}*(${V})^${n}`, punten: 3, vereenvoudig: true, code: 'ketting', juistTex: `${macht(u.tex(), m - 1)}${macht(v.tex(), n - 1)}${B.texP()}`, fouten: [
            { e: `${m}*(${U})^(${m - 1})*(${V})^${n}+(${U})^${m}*${n}*(${V})^(${n - 1})*(${dV})`, code: 'ketting', msg: L`Bij $D${macht(u.tex(), m)}$ vergat je de afgeleide van het binnenste.` },
            { e: `${m}*(${U})^(${m - 1})*(${dU})*(${V})^${n}+(${U})^${m}*${n}*(${V})^(${n - 1})`, code: 'ketting', msg: L`Bij $D${macht(v.tex(), n)}$ vergat je de afgeleide van het binnenste.` },
            { e: `${m}*(${U})^(${m - 1})*(${dU})*${n}*(${V})^(${n - 1})*(${dV})`, code: 'product', msg: 'Je vermenigvuldigde de afgeleiden van de twee factoren. Gebruik eerst de productregel: D(f·g) = g·Df + f·Dg.' },
        ] })],
        hints: [L`Productregel: $D(f\cdot g) = g\cdot Df + f\cdot Dg$ met $f = ${macht(u.tex(), m)}$ en $g = ${macht(v.tex(), n)}$.`, L`Voor $Df$ en $Dg$ heb je de kettingregel nodig: $D f^n = n\cdot f^{n-1}\cdot Df$.`, L`Zet $${macht(u.tex(), m - 1)}${macht(v.tex(), n - 1)}$ voorop.`],
        stappen: [
            L`$f'(x) = ${macht(v.tex(), n)}\cdot ${m}${macht(u.tex(), m - 1)}${u.d().texP()} + ${macht(u.tex(), m)}\cdot ${n}${macht(v.tex(), n - 1)}${v.d().texP()}$`,
            L`>$= ${macht(u.tex(), m - 1)}${macht(v.tex(), n - 1)}\left[${m}${u.d().texP()}${v.texP()} + ${n}${u.texP()}${v.d().texP()}\right]$`,
            L`!$f'(x) = ${macht(u.tex(), m - 1)}${macht(v.tex(), n - 1)}${B.texP()}$`,
        ],
    };
});

G('ket-quotmacht', 'ketting', 2, 'Een quotiënt tot een macht', r => herhaal(() => {
    const t = Poly.hl(r.nz(-3, 3), r.int(-5, 5));
    const n = r.kans(0.5) ? Poly.hl(r.nz(-3, 3), r.nz(-5, 5)) : Poly.hl(r.nz(-3, 3), r.int(-3, 3), r.nz(-4, 4));
    const k = r.int(2, 5);
    const Q = n.mul(t.d()).sub(t.mul(n.d()));
    if (Q.nul) return null;
    const T = t.txt(), N = n.txt();
    const juist = `${k}*((${T})/(${N}))^(${k - 1})*(${Q.txt()})/(${N})^2`;
    const teller = Q.deg === 0 ? `${coefTex(Q.c[0].maal(k))}${macht(t.tex(), k - 1)}` : `${k}${macht(t.tex(), k - 1)}${Q.texP()}`;
    return {
        opgave: L`Bereken de afgeleide van $f(x) = \left(${fr(t.tex(), n.tex())}\right)^{${k}}$. Vereenvoudig de teller en schrijf met één breukstreep.`,
        delen: [D.expr('', juist, { van: `((${T})/(${N}))^${k}`, punten: 3, vereenvoudig: true, code: 'ketting', juistTex: fr(teller, macht(n.tex(), k + 1)), fouten: [
            { e: `${k}*((${T})/(${N}))^(${k - 1})`, code: 'ketting', msg: 'Je vergat te vermenigvuldigen met de afgeleide van de breuk (quotiëntregel).' },
            { e: `${k}*((${T})/(${N}))^(${k - 1})*(${t.mul(n.d()).sub(n.mul(t.d())).txt()})/(${N})^2`, code: 'quotient', msg: 'In de quotiëntregel is de volgorde in de teller omgekeerd: g·Df − f·Dg.' },
            { e: `${k}*((${T})/(${N}))^(${k - 1})*(${Q.txt()})/(${N})`, code: 'noemer', msg: 'Bij de afgeleide van de breuk vergat je het kwadraat van de noemer.' },
        ] })],
        hints: [L`Kettingregel: $D f^n = n\cdot f^{n-1}\cdot Df$ met $f = ${fr(t.tex(), n.tex())}$.`, L`$Df$ vind je met de quotiëntregel: $\dfrac{g\cdot Df - f\cdot Dg}{g^2}$.`, L`Schrijf $\left(${fr(t.tex(), n.tex())}\right)^{${k - 1}} = ${fr(macht(t.tex(), k - 1), macht(n.tex(), k - 1))}$ en vermenigvuldig de breuken.`],
        stappen: [
            L`$f'(x) = ${k}\left(${fr(t.tex(), n.tex())}\right)^{${k - 1}}\cdot \dfrac{${n.texP()}\cdot ${t.d().texP()} - ${t.texP()}\cdot ${n.d().texP()}}{${macht(n.tex(), 2)}}$`,
            L`>$= ${k}\cdot ${fr(macht(t.tex(), k - 1), macht(n.tex(), k - 1))}\cdot ${fr(Q.tex(), macht(n.tex(), 2))}$`,
            L`!$f'(x) = ${fr(teller, macht(n.tex(), k + 1))}$`,
        ],
    };
}));

G('ket-quotmachten', 'ketting', 3, 'Quotiënt van machten', r => herhaal(() => {
    const u = Poly.hl(r.nz(-3, 3), r.nz(-5, 5));
    const v = r.kans(0.5) ? Poly.hl(r.nz(-3, 3), r.nz(-5, 5)) : Poly.hl(r.nz(-2, 2), 0, r.nz(-6, 6));
    const m = r.int(2, 4), n = r.int(2, 3);

// 7. OEFENINGEN (generatoren) — deel 2: grafieken, snelheid, verloop
// =====================================================================
// tekens van een functie op de intervallen en in de punten xs (gesorteerd)
function tekens(xs, f) {
    const mid = [xs[0] - 1, ...xs.slice(1).map((x, i) => (xs[i] + x) / 2), xs[xs.length - 1] + 1];
    const cel = [];
    mid.forEach((m, i) => {
        cel.push(tk(f(m)));
        if (i < xs.length) { const v = f(xs[i]); cel.push(!Number.isFinite(v) ? '|' : Math.abs(v) < 1e-9 ? '0' : tk(v)); }
    });
    return cel;
}
// rij met pijlen (f′) of bogen (f″) onder een tekenrij; labels in de punten
const pijlRij = (cel, labels = [], soort = 'pijl') => cel.map((c, i) => i % 2 === 0 ? (soort === 'pijl' ? pijl(c) : boog(c)) : (labels[(i - 1) / 2] ?? ''));
const VS = { '++': L`\overset{\cup}{\nearrow}`, '+-': L`\overset{\cap}{\nearrow}`, '-+': L`\overset{\cup}{\searrow}`, '--': L`\overset{\cap}{\searrow}` };
const VSNAAM = { '++': 'toenemende stijging', '+-': 'afnemende stijging', '-+': 'afnemende daling', '--': 'toenemende daling' };
const lbl = t => L`\scriptsize\text{${t}}`;
// veelterm met decimale coëfficiënten (Nederlandse notatie)
function polyDec(p, v = 'x') {
    let s = '';
    for (let i = p.c.length - 1; i >= 0; i--) {
        const k = p.c[i];
        if (k.nul) continue;
        const a = Math.abs(k.v), co = i > 0 && a === 1 ? '' : nlTex(a, 4);
        const t = co + (i === 0 ? '' : i === 1 ? v : `${v}^{${i}}`);
        s += s ? (k.v < 0 ? ' - ' : ' + ') + t : (k.v < 0 ? '-' : '') + t;
    }
    return s || '0';
}
const keuzeType = (vraag, juist, o = {}) => D.keuze(vraag, [
    { t: 'een maximum', ok: juist === 'max', msg: o.maxMsg || 'Kijk naar de tekens van f′ rond dit punt: + 0 − geeft een maximum, − 0 + een minimum.', code: 'maxmin' },
    { t: 'een minimum', ok: juist === 'min', msg: o.minMsg || 'Kijk naar de tekens van f′ rond dit punt: + 0 − geeft een maximum, − 0 + een minimum.', code: 'maxmin' },
    { t: 'geen extremum', ok: juist === 'geen', msg: o.geenMsg || 'f′ wisselt hier van teken, dus er is wel een extremum.', code: 'tekentabel' },
], { vast: true, punten: o.punten ?? 1 });
// tabel met de tekens van f′ en de pijlen van f
function f1Tabel(xs, xsTex, f1, labels, naam = 'f') {
    const cel = tekens(xs, f1);
    return tabel(xsTex, [[`${naam}'(x)`, cel], [`${naam}(x)`, pijlRij(cel, labels)]], { lijnVoor: 1 });
}
function f2Tabel(xs, xsTex, f2, labels, naam = 'f') {
    const cel = tekens(xs, f2);
    return tabel(xsTex, [[`${naam}''(x)`, cel], [`${naam}(x)`, pijlRij(cel, labels, 'boog')]], { lijnVoor: 1 });
}
const extLabel = (cel, i) => {
    const l = cel[2 * i], rr = cel[2 * i + 2];
    return l === '+' && rr === '-' ? 'MAX' : l === '-' && rr === '+' ? 'MIN' : (cel[2 * i + 1] === '0' ? 'H.R.' : '');
};

G('graf-hr', 'graf', 3, 'Tekenverloop van f′ met een horizontaal buigpunt', r => herhaal(() => {
    const a = r.int(-3, 3), b = a + r.pick([2, 3, 4]) * r.sign();

    const dp = Poly.wortels(k, [a, b, b]);
    let p = primitief(dp);
    let lo = 99, hi = -99;
    for (let x = Math.min(a, b) - 1.5; x <= Math.max(a, b) + 1.5; x += 0.1) { const y = p.num(x); lo = Math.min(lo, y); hi = Math.max(hi, y); }
    if (hi - lo < 2.5 || hi - lo > 10) return null;
    p = p.add(new Poly([Math.round(-(lo + hi) / 2)]));
    const xs = [Math.min(a, b), Math.max(a, b)];
    const cel = tekens(xs, x => dp.num(x));

    const wissel = cel.slice(); const j = xs[0] === b ? 0 : 4; wissel[j] = wissel[j] === '+' ? '-' : '+';

        ],
        hints: ['Zoek de punten met een horizontale raaklijn: daar is f′ = 0.', "Kijk of f vóór en na zo'n punt stijgt of daalt. Blijft f stijgen (of dalen), dan wisselt f′ daar niet van teken."],
        stappen: [

        'f₃ heeft twee toppen: f₃′ is een parabool met twee nulpunten (bij de toppen).',
        `f₄ heeft in x = ${b} een horizontale raaklijn zonder top: f₄′ is een parabool die de x-as raakt in x = ${b} en niet van teken wisselt.`,

    return {
        opgave: `Bovenaan zie je de grafieken van vier functies, onderaan de grafieken van hun afgeleiden (in een andere volgorde). Op beide assen is één hokje één eenheid.<div class="figuur">${boven}</div><div class="figuur">${onder}</div>`,
        delen: fs.map((_, fi) => D.keuze(`Welke grafiek is de afgeleide van $f_${fi + 1}$?`, opties(fi), { vast: true, punten: 0.5, janee: true })),
        hints: ['Zoek bij elke functie de toppen: daar is de raaklijn horizontaal en moet de afgeleide 0 zijn.', 'Stijgt de functie, dan ligt de grafiek van de afgeleide boven de x-as; daalt ze, dan eronder.'],
        stappen: [...uitleg.map((u, i) => `${u} Dat is grafiek ${LET[volgorde.indexOf(i)]}.`), `!$f_1 \\to$ ${LET[volgorde.indexOf(0)]}, $f_2 \\to$ ${LET[volgorde.indexOf(1)]}, $f_3 \\to$ ${LET[volgorde.indexOf(2)]}, $f_4 \\to$ ${LET[volgorde.indexOf(3)]}`],
    };
