// =================== 9.4 SNELHEID EN VERSNELLING ===================
G('snel-raket', 'snel', 1, 'Verticale worp: hoogte, snelheid en versnelling', r => herhaal(() => {
    const [a, bs] = r.pick([[5, [15, 25, 35, 45]], [4, [16, 24, 32, 40]], [10, [30, 50, 70, 90]]]);
    const b = r.pick(bs), top = b / (2 * a);
    const h = t => -a * t * t + b * t;
    const T = r.int(1, Math.max(1, Math.floor(b / a) - 1)), t0 = r.int(1, Math.max(1, Math.floor(top))), t1 = r.int(1, Math.max(1, Math.floor(b / a) - 1));
    if (h(T) <= 0) return null;
    const v0 = b - 2 * a * t0, vg = b - a * t1;
    const ding = r.pick([['Een volleybal wordt vanaf de grond recht omhoog geslagen.', 'de bal'], ['Een fontein spuit water recht omhoog. We volgen één druppel die vertrekt op grondhoogte.', 'de druppel'], ['Met een katapult wordt een knikker vanaf de grond recht omhoog geschoten.', 'de knikker']]);
    const ht = `${-a}t^2 + ${b}t`;
    return {
        opgave: L`${ding[0]} De hoogte (in m) na $t$ seconden is $h(t) = ${ht}$.`,
        delen: [
            D.getal(`Op welke hoogte is ${ding[1]} na ${T} seconden?`, h(T), { eenheid: 'm', code: 'rekenen', fouten: [{ w: b - 2 * a * T, code: 'snelheid', msg: `Dit is de snelheid h′(${T}). De hoogte is h(${T}).` }] }),
            D.getal(`Hoe snel gaat ${ding[1]} na ${t0} seconden (in m/s)?`, v0, { eenheid: 'm/s', code: 'snelheid', fouten: [{ w: h(t0), code: 'snelheid', msg: `Dit is de hoogte h(${t0}). De snelheid is de afgeleide: v(t) = h′(t).` }, { w: b - a * t0, code: 'snelheid', msg: `Leid nauwkeurig af: D(${-a}t²) = ${-2 * a}t.` }] }),
            D.getal('Geef die snelheid in km/h.', v0 * 3.6, { eenheid: 'km/h', code: 'eenheid', fouten: [{ w: v0 / 3.6, code: 'eenheid', msg: 'Van m/s naar km/h vermenigvuldig je met 3,6 (niet delen).' }, { w: v0 * 60, code: 'eenheid', msg: 'Van m/s naar km/h: maal 3600 (seconden in een uur) en gedeeld door 1000 (meter in een km), dus maal 3,6.' }] }),
            D.getal(`Met welke versnelling beweegt ${ding[1]} (in m/s²)?`, -2 * a, { eenheid: 'm/s²', code: 'snelheid', fouten: [{ w: 2 * a, code: 'teken', msg: 'Let op het teken: de snelheid neemt af, dus de versnelling is negatief.' }, { w: -a, code: 'snelheid', msg: `De versnelling is a(t) = v′(t) = h″(t). D(${-2 * a}t + ${b}) = ${-2 * a}.` }] }),
            D.getal(`Wat is de gemiddelde snelheid gedurende de eerste ${t1} seconden?`, vg, { eenheid: 'm/s', code: 'snelheid', fouten: [{ w: b - 2 * a * t1, code: 'snelheid', msg: `Dit is de ogenblikkelijke snelheid v(${t1}). De gemiddelde snelheid is Δh/Δt = (h(${t1}) − h(0)) / ${t1}.` }, { w: h(t1), code: 'gemiddeld', msg: `Je berekende Δh, maar deelde nog niet door Δt = ${t1}.` }] }),
        ],
        hints: ['Snelheid: v(t) = h′(t). Versnelling: a(t) = v′(t) = h″(t).', 'm/s → km/h: maal 3,6.', 'Gemiddelde snelheid = Δh/Δt (differentiequotiënt).'],
        stappen: [
            L`$h(${T}) = ${-a}\cdot ${T}^2 + ${b}\cdot ${T} = ${h(T)}$ m`,
            L`$v(t) = h'(t) = ${-2 * a}t + ${b}$, dus $v(${t0}) = ${-2 * a}\cdot ${t0} + ${b} = ${v0}$ m/s $= ${v0} \cdot 3{,}6 = ${nlTex(v0 * 3.6)}$ km/h`,
            L`$a(t) = v'(t) = ${-2 * a}$ m/s²`,
            L`$v_{gem} = \dfrac{h(${t1}) - h(0)}{${t1} - 0} = \dfrac{${h(t1)} - 0}{${t1}} = ${vg}$ m/s`,
            '!Snelheid is de afgeleide van de positie, versnelling is de afgeleide van de snelheid.',
        ],
    };
}));

G('snel-positie', 'snel', 2, 'Positie, snelheid en versnelling (derde graad)', r => herhaal(() => {
    const A = r.pick([F(-1, 3), F(1, 3), F(-1), F(1), F(-2, 3)]), ts = r.int(1, 4);
    const B = A.maal(-3 * ts), C = F(r.int(-3, 9));
    const x = new Poly([0, C, B, A]), v = x.d(), a = v.d();
    const T = r.int(1, 4), t0 = r.zonder(1, 5, ts);
    const vg = x.at(T).door(T);
    if (Math.abs(v.at(ts).v) > 60) return null;
    return {
        opgave: L`Een deeltje beweegt langs een rechte. Zijn positie (in m) na $t$ seconden is $x(t) = ${x.tex('t')}$.`,
        delen: [
            D.expr('Bepaal de snelheid $v(t)$.', v.txt('t'), { label: 'v(t) =', vars: ['t'], van: x.txt('t'), code: 'snelheid' }),
            D.expr('Bepaal de versnelling $a(t)$.', a.txt('t'), { label: 'a(t) =', vars: ['t'], van: v.txt('t'), code: 'snelheid', fouten: [{ e: v.txt('t'), code: 'snelheid', msg: 'Dit is de snelheid. De versnelling is de afgeleide van de snelheid.' }] }),
            D.getal(`Bereken de gemiddelde snelheid over het tijdsinterval $[0, ${T}]$.`, vg, { eenheid: 'm/s', code: 'gemiddeld', fouten: [{ w: v.at(T), code: 'gemiddeld', msg: `Dit is de ogenblikkelijke snelheid v(${T}). Gemiddeld = (x(${T}) − x(0)) / ${T}.` }] }),
            D.getal(`Bereken de versnelling op $t = ${t0}$.`, a.at(t0), { eenheid: 'm/s²', code: 'snelheid', fouten: [{ w: v.at(t0), code: 'snelheid', msg: `Dit is de snelheid v(${t0}).` }] }),
            D.getal('Op welk tijdstip is de versnelling 0?', ts, { label: 't =', eenheid: 's', code: 'nulwaarden' }),
        ],
        hints: ['v(t) = x′(t) en a(t) = v′(t) = x″(t).', L`Gemiddelde snelheid $= \dfrac{\Delta x}{\Delta t}$.`, 'Stel a(t) = 0 en los op naar t.'],
        stappen: [
            L`$v(t) = x'(t) = ${v.tex('t')}$`,
            L`$a(t) = v'(t) = ${a.tex('t')}$`,
            L`$v_{gem} = \dfrac{x(${T}) - x(0)}{${T}} = \dfrac{${x.at(T).tex()}}{${T}} = ${vg.tex()}$ m/s`,
            L`$a(${t0}) = ${a.at(t0).tex()}$ m/s²`,
            L`!$a(t) = 0 \iff ${a.tex('t')} = 0 \iff t = ${ts}$ s`,
        ],
    };
}));

G('snel-val', 'snel', 1, 'Vrije val', r => {

            D.getal('Met welke snelheid komt het op de grond (in km/h)?', rond(-9.8 * T * 3.6, 2), { gg: 'rekenwerk', eenheid: 'km/h', code: 'eenheid', ...abs, fouten: [{ w: rond(-9.8 * T, 2), code: 'eenheid', msg: 'Dit is de snelheid in m/s. Maal 3,6 voor km/h.' }, { w: rond(9.8 * T, 2), code: 'eenheid', msg: 'Dit is de snelheid in m/s. Maal 3,6 voor km/h.' }] }),

});

G('snel-kabel', 'snel', 3, 'Heteluchtballon: wanneer stijgt hij het traagst?', r => herhaal(() => {

// =================== 10.1 EXTREMA, STIJGEN EN DALEN ===================
G('ext-derde', 'extrema', 1, 'Extrema van een derdegraadsfunctie', r => herhaal(() => {
    const r1 = r.int(-4, 2), r2 = r1 + r.int(1, 5), k = r.pick([3, -3, 6, -6]);
    if (r2 > 5) return null;
    const dp = Poly.wortels(k, [r1, r2]), p = primitief(dp, r.int(-6, 6));
    if (!p.c.every(c => c.geheel)) return null;
    const f1 = p.at(r1), f2 = p.at(r2);
    if (Math.abs(f1.v) > 150 || Math.abs(f2.v) > 150) return null;
    const [xmax, xmin] = k > 0 ? [r1, r2] : [r2, r1];
    const cel = tekens([r1, r2], x => dp.num(x));
    return {
        opgave: L`Onderzoek het stijgen en dalen en bepaal de extrema van $${fTex(p)}$.`,
        delen: [
            D.expr("Bereken $f'(x)$.", dp.txt(), { van: p.txt(), code: 'macht' }),
            D.lijst("Bereken de nulwaarden van $f'$.", [r1, r2], { label: 'x =', code: 'nulwaarden' }),
            D.punt('Geef de coördinaat van het (relatief) maximum.', xmax, p.at(xmax), { naam: 'MAX', code: 'maxmin', fouten: [{ w: [xmin, p.at(xmin)], code: 'maxmin', msg: 'Dit is het minimum. Kijk in de tekentabel: + 0 − is een maximum.' }] }),
            D.punt('Geef de coördinaat van het (relatief) minimum.', xmin, p.at(xmin), { naam: 'MIN', code: 'maxmin', fouten: [{ w: [xmax, p.at(xmax)], code: 'maxmin', msg: 'Dit is het maximum. Kijk in de tekentabel: − 0 + is een minimum.' }] }),
        ],
        hints: ["Bereken f′(x) en stel f′(x) = 0.", 'Zet een factor voorop of gebruik som-product / de discriminant.', "Maak een tekentabel van f′: + 0 − is een maximum, − 0 + een minimum. Bereken de y-waarde met het voorschrift van f."],
        stappen: [
            L`$f'(x) = ${dp.tex()}$`,
            L`$f'(x) = 0 \iff ${dp.tex()} = 0 \iff ${coefTex(k)}${Poly.lin(r1).texP()}${Poly.lin(r2).texP()} = 0 \iff x = ${r1} \text{ of } x = ${r2}$`,
            `$$${tabel([String(r1), String(r2)], [[L`f'(x)`, cel], ['f(x)', pijlRij(cel, [`${extLabel(cel, 0) === 'MAX' ? '' : ''}${f1.tex()}`, f2.tex()])]], { lijnVoor: 1 })}$$`,
            L`$f(${r1}) = ${invulTex(p, r1)} = ${f1.tex()}$ en $f(${r2}) = ${f2.tex()}$`,
            L`!Maximum in $\left(${xmax}, ${p.at(xmax).tex()}\right)$ en minimum in $\left(${xmin}, ${p.at(xmin).tex()}\right)$.`,
        ],
    };
}));

G('ext-vierde', 'extrema', 2, 'Extremum en horizontale raaklijn (vierde graad)', r => herhaal(() => {
    const a = r.pick([1, -1, 3, -3, 2, -2]), b = r.nz(-8, 8), c = r.int(-4, 6);
    const p = new Poly([c, 0, 0, b, a]), dp = p.d();
    const x0 = F(-3 * b, 4 * a);
    if (!(x0.d <= 3) || Math.abs(x0.v) > 4) return null;
    const y0 = p.at(x0);
    const xs = [0, x0.v].sort((u, v) => u - v), xsT = (x0.v < 0 ? [x0.tex(), '0'] : ['0', x0.tex()]);
    const cel = tekens(xs, x => dp.num(x));
    const type = a < 0 ? 'max' : 'min';
    const labels = xs.map(x => Math.abs(x) < 1e-12 ? lbl('H.R.') : lbl(type === 'max' ? 'ABS MAX' : 'ABS MIN'));
    return {
        opgave: L`Gegeven is de functie $${fTex(p)}$.`,
        delen: [
            D.lijst("Bereken de nulwaarden van $f'$.", [0, x0], { label: 'x =', code: 'nulwaarden', fouten: [{ w: [x0], code: 'nulwaarden', msg: L`Ook $x = 0$ is een nulwaarde: zet $x^2$ voorop.` }] }),
            D.keuze(L`Wat gebeurt er in $x = 0$?`, [
                { t: 'geen extremum: de grafiek heeft er een horizontale raaklijn (buigpunt)', ok: true },
                { t: 'een maximum', msg: "x = 0 is een dubbele nulwaarde van f′: f′ wisselt daar niet van teken, dus er is geen extremum.", code: 'tekentabel' },
                { t: 'een minimum', msg: "x = 0 is een dubbele nulwaarde van f′: f′ wisselt daar niet van teken, dus er is geen extremum.", code: 'tekentabel' },
                { t: "$f$ is er niet afleidbaar", msg: 'Een veeltermfunctie is overal afleidbaar.', code: 'begrip' },
            ]),
            D.punt(L`Geef de coördinaat van het extremum.`, x0, y0, { code: 'maxmin', punten: 1 }),
            D.keuze('Wat voor extremum is dit?', [
                { t: 'een absoluut maximum', ok: type === 'max', msg: type === 'max' ? '' : 'Kijk naar de tekens van f′: − 0 + is een minimum.', code: 'maxmin' },
                { t: 'een absoluut minimum', ok: type === 'min', msg: type === 'min' ? '' : 'Kijk naar de tekens van f′: + 0 − is een maximum.', code: 'maxmin' },
                { t: 'een relatief maximum, maar geen absoluut', ok: false, msg: 'Er is maar één extremum en de grafiek gaat aan beide kanten naar ' + (type === 'max' ? '−∞' : '+∞') + ': het is dus absoluut.', code: 'maxmin' },
                { t: 'een relatief minimum, maar geen absoluut', ok: false, msg: 'Er is maar één extremum en de grafiek gaat aan beide kanten naar ' + (type === 'max' ? '−∞' : '+∞') + ': het is dus absoluut.', code: 'maxmin' },
            ], { vast: true }),
        ],
        hints: [L`$f'(x) = ${dp.tex()}$: zet $x^2$ voorop.`, 'Bij een dubbele nulwaarde wisselt het teken van f′ niet: dan is er geen extremum (wel een horizontale raaklijn).', 'Kijk naar het gedrag op oneindig om te zien of het extremum absoluut is.'],
        stappen: [
            L`$f'(x) = ${dp.tex()} = ${coefTex(4 * a)}x^2\left(x ${x0.v > 0 ? '-' : '+'} ${x0.abs().tex()}\right)$`,
            L`$f'(x) = 0 \iff x = 0 \text{ (dubbel) of } x = ${x0.tex()}$`,
            `$$${tabel(xsT, [[L`f'(x)`, cel], ['f(x)', pijlRij(cel, labels)]], { lijnVoor: 1 })}$$`,
            L`$f(${x0.tex()}) = ${y0.tex()}$ en $f(0) = ${c}$ (horizontale raaklijn, geen extremum)`,
            L`!${type === 'max' ? 'Absoluut maximum' : 'Absoluut minimum'} in $\left(${x0.tex()}, ${y0.tex()}\right)$.`,
        ],
    };
}));

G('ext-drie', 'extrema', 2, 'Vierdegraadsfunctie met drie extrema', r => herhaal(() => {
    const w = r.schud([-3, -2, -1, 0, 1, 2, 3]).slice(0, 3).sort((u, v) => u - v);
    const a = r.pick([1, -1, 3, -3]);
    const dp = Poly.wortels(4 * a, w), p = primitief(dp, r.int(-5, 5));
    if (!p.c.every(c => c.geheel) || p.c.some(c => Math.abs(c.v) > 60)) return null;
    const v = w.map(x => p.at(x));
    const cel = tekens(w, x => dp.num(x));
    const maxs = w.filter((x, i) => extLabel(cel, i) === 'MAX'), mins = w.filter((x, i) => extLabel(cel, i) === 'MIN');
    const groot = a > 0 ? mins : maxs;
    const absW = a > 0 ? Math.min(...groot.map(x => p.at(x).v)) : Math.max(...groot.map(x => p.at(x).v));
    if (groot.length === 2 && p.at(groot[0]).v === p.at(groot[1]).v) return null;
    return {
        opgave: L`Gegeven is de functie $${fTex(p)}$.`,
        delen: [
            D.lijst("Bereken de nulwaarden van $f'$.", w, { label: 'x =', code: 'nulwaarden', punten: 2 }),
            D.lijst('Voor welke $x$-waarde(n) bereikt $f$ een relatief maximum?', maxs, { label: 'x =', code: 'maxmin', fouten: [{ w: mins, code: 'maxmin', msg: 'Dit zijn de minima. Een maximum hoort bij + 0 − in de tekentabel van f′.' }] }),
            D.getal(`Wat is het absolute ${a > 0 ? 'minimum' : 'maximum'} van $f$?`, absW, { label: 'y =', code: 'maxmin' }),
        ],
        hints: [L`$f'(x) = ${dp.tex()}$: zet een factor voorop en ontbind verder (som en product of Horner).`, 'Maak een tekentabel van f′.', `Vergelijk de functiewaarden van de ${a > 0 ? 'minima' : 'maxima'} om het absolute ${a > 0 ? 'minimum' : 'maximum'} te vinden.`],
        stappen: [
            L`$f'(x) = ${dp.tex()} = ${coefTex(4 * a)}${w.map(x => Poly.lin(x).texP()).join('')}$`,
            L`$f'(x) = 0 \iff x = ${w.join(L` \text{ of } x = `)}$`,
            `$$${tabel(w.map(String), [[L`f'(x)`, cel], ['f(x)', pijlRij(cel, v.map((y, i) => y.tex()))]], { lijnVoor: 1 })}$$`,
            `Maxima in $x = ${maxs.join('$ en $x = ')}$; minima in $x = ${mins.join('$ en $x = ')}$.`,
            L`!Het absolute ${a > 0 ? 'minimum' : 'maximum'} is $${F(absW).tex()}$ (de ${a > 0 ? 'kleinste' : 'grootste'} van de waarden).`,
        ],
    };
}));

G('ext-rationaal', 'extrema', 2, 'Extrema van een rationale functie', r => herhaal(() => {
    const v = r.int(1, 3);
    if (v === 1) {
        const a = r.pick([1, 2, 3, -1, -2, -3]);
        const n = Poly.lin(a), T = new Poly([0, -2 * a, 1]);
        const xmax = Math.min(0, 2 * a), xmin = Math.max(0, 2 * a);
        const fw = x => x === 0 ? 0 : 4 * a;
        const xs = [2 * a, a, 0].sort((u, w) => u - w);
        return {
            opgave: L`Bepaal de extrema van $f(x) = ${fr('x^2', n.tex())}$.`,
            delen: [
                D.expr("Bereken $f'(x)$ en vereenvoudig de teller.", `(${T.txt()})/(${n.txt()})^2`, { van: `x^2/(${n.txt()})`, code: 'quotient', dom: a > 0 ? [a + 0.3, a + 3] : [a - 3, a - 0.3], juistTex: fr(T.tex(), macht(n.tex(), 2)) }),
                D.lijst("Bereken de nulwaarden van $f'$.", [0, 2 * a], { label: 'x =', code: 'nulwaarden', fouten: [{ w: [2 * a], code: 'nulwaarden', msg: 'Zet x voorop in de teller: ook x = 0 is een nulwaarde.' }] }),
                D.punt('Geef de coördinaat van het (relatief) maximum.', xmax, fw(xmax), { naam: 'MAX', code: 'maxmin', fouten: [{ w: [xmin, fw(xmin)], code: 'maxmin', msg: 'Dit is het minimum. Kijk in de tekentabel: + 0 − is een maximum.' }] }),
                D.punt('Geef de coördinaat van het (relatief) minimum.', xmin, fw(xmin), { naam: 'MIN', code: 'maxmin' }),
            ],
            hints: ['Quotiëntregel: (g·Df − f·Dg)/g².', 'De noemer is een kwadraat: het teken van f′ hangt enkel af van de teller. Zet x voorop.', `Vergeet x = ${a} niet in de tekentabel: daar bestaat f niet.`],
            stappen: [
                L`$f'(x) = \dfrac{${n.texP()}\cdot 2x - x^2\cdot 1}{${macht(n.tex(), 2)}} = ${fr(T.tex(), macht(n.tex(), 2))} = ${fr(L`x\left(${Poly.lin(2 * a).tex()}\right)`, macht(n.tex(), 2))}$`,
                L`$f'(x) = 0 \iff x = 0 \text{ of } x = ${2 * a}$; in $x = ${a}$ bestaat $f$ niet.`,
                `$$${f1Tabel(xs, xs.map(String), x => Math.abs(x - a) < 1e-12 ? NaN : T.num(x) / ((x - a) * (x - a)), xs.map(x => x === a ? '' : String(fw(x))))}$$`,
                L`!Relatief maximum in $\left(${xmax}, ${fw(xmax)}\right)$, relatief minimum in $\left(${xmin}, ${fw(xmin)}\right)$.`,
            ],
        };
    }
    if (v === 2) {
        const s = r.int(1, 5), c = s * s;
        const n = new Poly([0, 1]), t = new Poly([c, 0, 1]);
        return {
            opgave: L`Bepaal de extrema van $f(x) = ${fr(t.tex(), 'x')}$.`,
            delen: [
                D.expr("Bereken $f'(x)$.", `(x^2-${c})/x^2`, { van: `(${t.txt()})/x`, code: 'quotient', juistTex: fr(`x^2 - ${c}`, 'x^{2}'), dom: [0.3, 3] }),
                D.lijst("Bereken de nulwaarden van $f'$.", [s, -s], { label: 'x =', code: 'nulwaarden' }),
                D.punt('Geef de coördinaat van het (relatief) maximum.', -s, -2 * s, { naam: 'MAX', code: 'maxmin', fouten: [{ w: [s, 2 * s], code: 'maxmin', msg: 'Dit is het minimum: let op het teken van f′ rond x = ' + s + '.' }] }),
                D.punt('Geef de coördinaat van het (relatief) minimum.', s, 2 * s, { naam: 'MIN', code: 'maxmin' }),
            ],
            hints: ['Quotiëntregel, of splits eerst: f(x) = x + c/x.', 'Vergeet x = 0 niet in de tekentabel (daar bestaat f niet).'],
            stappen: [
                L`$f'(x) = \dfrac{x\cdot 2x - \left(x^2 + ${c}\right)\cdot 1}{x^2} = ${fr(`x^2 - ${c}`, 'x^2')}$`,
                L`$f'(x) = 0 \iff x^2 = ${c} \iff x = \pm ${s}$; in $x = 0$ bestaat $f$ niet.`,
                `$$${f1Tabel([-s, 0, s], [String(-s), '0', String(s)], x => Math.abs(x) < 1e-12 ? NaN : (x * x - c) / (x * x), [String(-2 * s), '', String(2 * s)])}$$`,
                L`!Relatief maximum in $\left(${-s}, ${-2 * s}\right)$ en relatief minimum in $\left(${s}, ${2 * s}\right)$.`,
            ],
        };
    }
    const a = r.nz(-4, 4), b = r.nz(-6, 6);
    const x0 = F(-3 * b, 2 * a);
    if (x0.d > 2 || Math.abs(x0.v) > 6) return null;
    const t = new Poly([b, a]), y0 = t.at(x0).door(x0.macht(3));
    const T1 = new Poly([-3 * b, -2 * a]);
    const type = a > 0 ? 'max' : 'min';
    return {
        opgave: L`Gegeven is de functie $f(x) = ${fr(t.tex(), 'x^3')}$.`,
        delen: [
            D.expr("Bereken $f'(x)$ en vereenvoudig.", `(${T1.txt()})/x^4`, { van: `(${t.txt()})/x^3`, code: 'quotient', dom: [0.3, 3], juistTex: fr(T1.tex(), 'x^4') }),
            D.getal("Voor welke $x$ is $f'(x) = 0$?", x0, { label: 'x =', code: 'nulwaarden' }),
            keuzeType('Wat bereikt $f$ in die waarde?', type),
            D.getal('Bereken de waarde van dat extremum.', y0, { label: 'y =', code: 'fa' }),
        ],
        hints: ['Quotiëntregel: (g·Df − f·Dg)/g² met g = x³; schrap daarna x².', 'Maak een tekentabel van f′ (vergeet x = 0 niet). De noemer x⁴ is nooit negatief.'],
        stappen: [
            L`$f'(x) = \dfrac{x^3\cdot ${a < 0 ? par(a) : a} - ${t.texP()}\cdot 3x^2}{x^6} = \dfrac{${new Poly([0, 0, -3 * b, -2 * a]).tex()}}{x^6} = ${fr(T1.tex(), 'x^4')}$`,
            L`$f'(x) = 0 \iff ${T1.tex()} = 0 \iff x = ${x0.tex()}$`,
            `$$${f1Tabel([0, x0.v].sort((u, w) => u - w), x0.v < 0 ? [x0.tex(), '0'] : ['0', x0.tex()], x => Math.abs(x) < 1e-12 ? NaN : T1.num(x) / (x ** 4), [0, x0.v].sort((u, w) => u - w).map(x => Math.abs(x) < 1e-12 ? '' : lbl(type === 'max' ? 'MAX' : 'MIN')))}$$`,
            L`!${type === 'max' ? 'Maximum' : 'Minimum'} in $x = ${x0.tex()}$ met waarde $f(${x0.tex()}) = ${y0.tex()}$.`,
        ],
    };
}));

G('ext-tabel', 'extrema', 1, 'Extrema uit het voorschrift van f′', r => herhaal(() => {
    const a = r.int(-4, 3), b = r.zonder(-4, 4, a), k = r.pick([1, -1, 2, -3]);
    const dubbel = r.kans(0.5) ? a : b, enkel = dubbel === a ? b : a;
    const dp = Poly.wortels(k, [dubbel, dubbel, enkel]);
    const xs = [a, b].sort((u, v) => u - v);
    const cel = tekens(xs, x => dp.num(x));
    const typeEnkel = extLabel(cel, xs.indexOf(enkel)) === 'MAX' ? 'max' : 'min';
    const stijg = [];
    for (let i = 0; i <= 2; i++) if (cel[2 * i] === '+') stijg.push(i);
    const intervallen = [L`\left]-\infty, ${xs[0]}\right[`, intv(xs[0], xs[1]), L`\left]${xs[1]}, +\infty\right[`];
    const dTex = `${coefTex(k)}${Poly.lin(dubbel).texP()}^{2}${Poly.lin(enkel).texP()}`;
    return {
        opgave: L`Van een functie $f$ is de afgeleide gegeven: $f'(x) = ${dTex}$.`,
        delen: [
            keuzeType(L`Wat bereikt $f$ in $x = ${enkel}$?`, typeEnkel),
            keuzeType(L`Wat bereikt $f$ in $x = ${dubbel}$?`, 'geen', { geenMsg: '', maxMsg: `x = ${dubbel} is een dubbele nulwaarde: f′ wisselt daar niet van teken, dus er is geen extremum.`, minMsg: `x = ${dubbel} is een dubbele nulwaarde: f′ wisselt daar niet van teken, dus er is geen extremum.` }),
            D.keuze('Waar is $f$ stijgend?', [
                { t: '$' + stijg.map(i => intervallen[i]).join(L` \text{ en } `) + '$', ok: true },
                { t: '$' + [0, 1, 2].filter(i => !stijg.includes(i)).map(i => intervallen[i]).join(L` \text{ en } `) + '$', msg: 'Daar is f′ negatief: f is daar dalend.', code: 'tekentabel' },
                { t: L`$\mathbb{R}$`, msg: 'f′ is niet overal positief.', code: 'tekentabel' },
            ]),
        ],
        hints: ['Maak een tekentabel van f′ met de nulwaarden.', 'Een kwadraat is nooit negatief: bij een dubbele nulwaarde wisselt het teken niet.', '+ 0 − is een maximum, − 0 + een minimum.'],
        stappen: [
            L`Nulwaarden: $x = ${dubbel}$ (dubbel) en $x = ${enkel}$.`,
            `$$${tabel(xs.map(String), [[L`f'(x)`, cel], ['f(x)', pijlRij(cel, xs.map(x => lbl(x === enkel ? (typeEnkel === 'max' ? 'MAX' : 'MIN') : 'H.R.')))]], { lijnVoor: 1 })}$$`,
            L`!In $x = ${enkel}$ een ${typeEnkel === 'max' ? 'maximum' : 'minimum'}; in $x = ${dubbel}$ geen extremum (horizontale raaklijn).`,
        ],
    };
}));

G('ext-param', 'extrema', 3, 'Parameter zodat f een extremum heeft in een gegeven punt', r => herhaal(() => {
    if (r.kans(0.5)) {
        const k = r.pick([-3, -2, -1, 1, 2, 3]), a = r.pick([F(1), F(2), F(-1), F(1, 3), F(-2), F(2, 3)]);
        const c = F(12 * k).min(a.maal(3 * k * k));
        const p = new Poly([0, c, -6, a]);
        const f2 = 6 * a.v * k - 12;
        if (Math.abs(f2) < 1e-9) return null;
        const k2 = F(4).door(a).min(k);
        if (k2.gelijk(k)) return null;
        return {
            opgave: L`De functie $f(x) = a x^3 - 6x^2 ${c.n < 0 ? '-' : '+'} ${c.abs().tex()}x$ heeft een extremum in $x = ${k}$.`,
            delen: [
                D.getal('Bereken $a$.', a, { label: 'a =', code: 'rekenen', punten: 2, tip: `Stel f′(${k}) = 0.` }),
                keuzeType(L`Is dat extremum in $x = ${k}$ een maximum of een minimum?`, f2 < 0 ? 'max' : 'min'),
                D.getal('Voor welke andere $x$-waarde heeft $f$ nog een extremum?', k2, { label: 'x =', code: 'nulwaarden' }),
            ],
            hints: [L`$f'(x) = 3a x^2 - 12x ${c.n < 0 ? '-' : '+'} ${c.abs().tex()}$`, `Een extremum in x = ${k} betekent f′(${k}) = 0: los op naar a.`, "Gebruik de tweede-afgeleidetest: f″(k) < 0 → maximum, f″(k) > 0 → minimum."],
            stappen: [
                L`$f'(x) = 3a x^2 - 12x ${c.n < 0 ? '-' : '+'} ${c.abs().tex()}$`,
                L`$f'(${k}) = 0 \iff ${3 * k * k}a ${-12 * k < 0 ? '-' : '+'} ${Math.abs(12 * k)} ${c.n < 0 ? '-' : '+'} ${c.abs().tex()} = 0 \iff a = ${a.tex()}$`,
                L`$f''(x) = 6a x - 12$, dus $f''(${k}) = ${nlTex(f2, 4)} ${f2 < 0 ? '< 0' : '> 0'}$: een ${f2 < 0 ? 'maximum' : 'minimum'}.`,
                L`!$f'(x) = ${p.d().tex()} = 0 \iff x = ${k} \text{ of } x = ${k2.tex()}$`,
            ],
        };
    }
    const x0 = r.pick([-3, -2, 2, 3]);
    const m = F(1 - x0 * x0, 2 * x0), y0 = m.plus(x0).door(x0 * x0 + 1), x1 = F(-1, x0);
    const echt = x0 > 0 ? 'max' : 'min';
    const T = new Poly([F(1), m.maal(-2), F(-1)]);
    return {
        opgave: L`De functie $f(x) = \dfrac{x + m}{x^2 + 1}$ heeft een extremum in $x = ${x0}$.`,
        delen: [
            D.getal('Bereken $m$.', m, { label: 'm =', code: 'rekenen', punten: 2, tip: `Stel f′(${x0}) = 0.` }),
            keuzeType(L`Is het extremum in $x = ${x0}$ een maximum of een minimum?`, echt),
            D.getal('Voor welke andere $x$-waarde heeft $f$ nog een extremum?', x1, { label: 'x =', code: 'nulwaarden' }),
            D.getal(L`Bereken $f(${x0})$.`, y0, { label: `f(${x0}) =`, code: 'fa' }),
        ],
        hints: [L`$f'(x) = \dfrac{(x^2 + 1)\cdot 1 - (x + m)\cdot 2x}{(x^2 + 1)^2} = \dfrac{-x^2 - 2mx + 1}{(x^2 + 1)^2}$`, `Stel f′(${x0}) = 0: de teller moet 0 zijn. Los op naar m.`, 'De noemer is altijd positief: maak een tekentabel van de teller (een bergparabool).'],
        stappen: [
            L`$f'(x) = \dfrac{-x^2 - 2mx + 1}{(x^2 + 1)^2}$`,
            L`$f'(${x0}) = 0 \iff ${-x0 * x0} ${-2 * x0 < 0 ? '-' : '+'} ${Math.abs(2 * x0)}m + 1 = 0 \iff m = ${m.tex()}$`,
            L`Teller: $${T.tex()} = 0 \iff x = ${x0} \text{ of } x = ${x1.tex()}$ (product van de wortels is $-1$).`,
            `$$${f1Tabel([x0, x1.v].sort((u, w) => u - w), x0 < x1.v ? [String(x0), x1.tex()] : [x1.tex(), String(x0)], x => T.num(x), [x0, x1.v].sort((u, w) => u - w).map(x => lbl(x === x0 ? (echt === 'max' ? 'MAX' : 'MIN') : (echt === 'max' ? 'MIN' : 'MAX'))))}$$`,
            L`!In $x = ${x0}$ een ${echt === 'max' ? 'maximum' : 'minimum'} met $f(${x0}) = ${y0.tex()}$; het andere extremum ligt in $x = ${x1.tex()}$.`,
        ],
    };
}));

// =================== 10.1.3 EXTREMUMPROBLEMEN ===================
G('prob-getallen', 'problemen', 1, 'Twee getallen met een extreem product', r => herhaal(() => {
    if (r.kans(0.5)) {
        const S = r.pick([12, 15, 18, 21, 24, 30]);
        const x0 = 2 * S / 3, y0 = S / 3, P = y0 * x0 * x0;
        const f = new Poly([0, 0, S, -1]);
        return {
            opgave: `De som van twee positieve getallen is ${S}. Voor welke twee getallen is het product van het eerste getal met het kwadraat van het tweede getal zo groot mogelijk?`,
            delen: [
                D.expr('Noem het tweede getal $x$. Stel het voorschrift op van dat product $f(x)$.', f.txt(), { label: 'f(x) =', afgeleide: false, code: 'vraagstuk', juistTex: f.tex() }),
                D.lijst('Geef de twee getallen (eerste ; tweede).', [y0, x0], { code: 'vraagstuk', punten: 2 }),
                D.getal('Hoe groot is dat maximale product?', P, { code: 'vraagstuk' }),
            ],
            hints: [`Het tweede getal is x, dan is het eerste ${S} − x.`, `f(x) = (${S} − x) · x². Werk uit, bereken f′(x) en stel f′(x) = 0.`, `Het praktisch domein is ]0, ${S}[. Controleer met een tekentabel dat het om een maximum gaat.`],
            stappen: [
                L`(1) $x$: tweede getal, $y$: eerste getal`,
                L`(2)–(3) $x + y = ${S} \Rightarrow y = ${S} - x$`,
                L`(4) $f(x) = \left(${S} - x\right)\cdot x^2 = ${f.tex()}$`,
                L`(5) $f'(x) = ${f.d().tex()} = -3x\left(x - ${x0}\right) = 0 \iff x = 0 \text{ of } x = ${x0}$`,
                `$$${f1Tabel([0, x0], ['0', String(x0)], x => f.d().num(x), ['', lbl('MAX')])}$$`,
                L`!(6) De getallen zijn $${y0}$ en $${x0}$; het maximale product is $${y0}\cdot ${x0}^2 = ${P}$.`,
            ],
        };
    }
    const d = r.pick([6, 8, 10, 12, 14, 20]);
    const f = new Poly([0, d, 1]);
    const x0 = -d / 2, P = -d * d / 4;
    return {
        opgave: `Het tweede van twee getallen is ${d} groter dan het eerste. Voor welke twee getallen is hun product zo klein mogelijk?`,
        delen: [
            D.expr('Noem het eerste getal $x$. Stel het voorschrift op van het product $f(x)$.', f.txt(), { label: 'f(x) =', afgeleide: false, code: 'vraagstuk', juistTex: f.tex() }),
            D.lijst('Geef de twee getallen (eerste ; tweede).', [x0, x0 + d], { code: 'vraagstuk', punten: 2 }),
            D.getal('Hoe groot is dat kleinste product?', P, { code: 'vraagstuk', fouten: [{ w: -P, code: 'teken', msg: 'Het product van een negatief en een positief getal is negatief.' }] }),
        ],
        hints: [`Het eerste getal is x, het tweede x + ${d}.`, 'Bereken f′(x) en stel f′(x) = 0.', 'Controleer met een tekentabel dat het een minimum is.'],
        stappen: [
            L`$f(x) = x\cdot\left(x + ${d}\right) = ${f.tex()}$`,
            L`$f'(x) = ${f.d().tex()} = 0 \iff x = ${x0}$`,
            `$$${f1Tabel([x0], [String(x0)], x => f.d().num(x), [lbl('MIN')])}$$`,

        ],

}));

G('prob-doos', 'problemen', 2, 'Open doos uit een rechthoekig stuk karton', r => herhaal(() => {
    const [a, b] = r.pick([[8, 3], [15, 8], [16, 6], [24, 9], [21, 16], [30, 16], [40, 15], [45, 24], [12, 12], [18, 18], [24, 24], [30, 30], [30, 20]]);
    const V = new Poly([0, a * b, -2 * (a + b), 4]);
    const D2 = (a + b) * (a + b) - 3 * a * b;
    const x0 = ((a + b) - Math.sqrt(D2)) / 6;
    const Vm = V.num(x0);
    const exact = isMooi(x0 * 6);
    return {
        opgave: `Uit een rechthoekig stuk karton van ${a} cm op ${b} cm knip je in elke hoek een vierkantje met zijde $x$ cm weg. Door de randen om te plooien krijg je een open doos (bakje).`,
        delen: [
            D.expr('Stel het voorschrift op van de inhoud $V(x)$ (in cm³).', `x*(${a}-2x)*(${b}-2x)`, { label: 'V(x) =', afgeleide: false, code: 'vraagstuk', juistTex: L`x\left(${a} - 2x\right)\left(${b} - 2x\right)`, dom: [0.3, Math.min(a, b) / 2 - 0.3] }),
            D.getal('Voor welke $x$ is de inhoud maximaal?', exact ? F(Math.round(x0 * 6), 6) : x0, { gg: exact ? undefined : 'rekenwerk', label: 'x =', eenheid: 'cm', code: 'vraagstuk', minDec: 2, tol: exact ? 0 : 0.006, fouten: [{ w: ((a + b) + Math.sqrt(D2)) / 6, code: 'vraagstuk', msg: `Deze oplossing ligt niet in het praktisch domein: x moet kleiner zijn dan ${Math.min(a, b) / 2} cm.` }] }),
            D.getal('Hoe groot is die maximale inhoud?', Vm, { gg: 'rekenwerk', eenheid: 'cm³', code: 'vraagstuk', tol: 0.6 }),
        ],
        hints: [`Na het wegknippen is de bodem (${a} − 2x) bij (${b} − 2x) en de hoogte x.`, "Werk V(x) uit, bereken V′(x) en stel V′(x) = 0 (discriminant).", `Het praktisch domein is ]0, ${Math.min(a, b) / 2}[.`],
        stappen: [
            L`$V(x) = x\left(${a} - 2x\right)\left(${b} - 2x\right) = ${V.tex()}$`,
            L`$V'(x) = ${V.d().tex()} = 0$`,
            L`>$D = ${(4 * (a + b)) ** 2} - 4\cdot 12\cdot ${a * b} = ${16 * D2}$ en $x = \dfrac{${4 * (a + b)} \pm \sqrt{${16 * D2}}}{24}$`,
            L`>Enkel $x = ${exact ? F(Math.round(x0 * 6), 6).tex() : L`\approx ` + nlTex(x0, 2)}$ ligt in het praktisch domein $\left]0, ${Math.min(a, b) / 2}\right[$; de tekentabel geeft daar een maximum.`,
            L`!Maximale inhoud: $V(${nlTex(x0, 2)}) \approx ${nlTex(Vm, 1)}$ cm³`,
        ],
    };
}));

G('prob-draad', 'problemen', 2, 'Open kist met zo weinig mogelijk materiaal', r => {
    const x0 = r.pick([2, 4, 6, 8, 10]), V = x0 ** 3 / 2, h0 = x0 / 2, Am = 3 * x0 * x0;
    const Ax = x => x * x + 4 * V / x;
    return {
        opgave: `Een schrijnwerker maakt een open kist (zonder deksel) met een vierkant grondvlak en een inhoud van ${V} liter (= ${V} dm³). Noem $x$ de zijde van het grondvlak en $h$ de hoogte (in dm). Voor welke afmetingen gebruikt hij zo weinig mogelijk hout?`,
        delen: [
            D.expr('Stel het voorschrift op van de totale oppervlakte $A(x)$ (bodem + 4 zijwanden), enkel in functie van $x$.', `x^2+${4 * V}/x`, { label: 'A(x) =', afgeleide: false, code: 'vraagstuk', dom: [0.5, 12], juistTex: L`x^2 + \dfrac{${4 * V}}{x}`, tip: `Uit de inhoud volgt h = ${V}/x².` }),
            D.lijst('Geef de afmetingen (zijde ; hoogte) in dm waarvoor de oppervlakte minimaal is.', [x0, h0], { code: 'vraagstuk', punten: 2 }),
            D.getal('Hoeveel dm² hout is er dan nodig?', Am, { eenheid: 'dm²', code: 'vraagstuk' }),
        ],
        hints: [`Inhoud: x² · h = ${V}, dus h = ${V}/x².`, `A = x² + 4·x·h = x² + ${4 * V}/x. Schrijf ${4 * V}/x als ${4 * V}x⁻¹ en leid af.`, `A′(x) = 0 geeft x³ = ${2 * V}. Het praktisch domein is ]0, +∞[.`],
        stappen: [
            L`(1)–(3) $x^2\cdot h = ${V} \Rightarrow h = \dfrac{${V}}{x^2}$`,
            L`(4) $A(x) = x^2 + 4\cdot x\cdot\dfrac{${V}}{x^2} = x^2 + \dfrac{${4 * V}}{x}$`,
            L`(5) $A'(x) = 2x - \dfrac{${4 * V}}{x^2} = \dfrac{2x^3 - ${4 * V}}{x^2} = 0 \iff x^3 = ${2 * V} \iff x = ${x0}$`,
            `$$${f1Tabel([0, x0], ['0', String(x0)], x => Math.abs(x) < 1e-12 ? NaN : 2 * x - 4 * V / (x * x), ['', lbl('MIN')], 'A')}$$`,
            L`!(6) Zijde $${x0}$ dm en hoogte $h = \dfrac{${V}}{${x0 * x0}} = ${nlTex(h0)}$ dm; er is $A(${x0}) = ${Am}$ dm² hout nodig.`,
        ],
    };
});

G('prob-stadion', 'problemen', 3, 'Grootste rechthoek onder een parabool', r => {

        delen: [

            D.getal('Voor welke $x$ is de oppervlakte maximaal?', k, { label: 'x =', code: 'vraagstuk', fouten: [{ w: -k, code: 'vraagstuk', msg: 'x moet positief zijn (praktisch domein).' }] }),
            D.lijst('Geef de afmetingen van die rechthoek (breedte ; hoogte).', [2 * k, 2 * k * k], { code: 'vraagstuk', tip: `De breedte is 2x, de hoogte is ${c} − x².` }),

        stappen: [

G('prob-winst', 'problemen', 2, 'Kosten en winst', r => herhaal(() => {
    const a = r.pick([2, 3, 4]), b = r.pick([24, 30, 36]), c = r.pick([90, 100, 120]), d = r.pick([50, 60, 100]);
    const K = new Poly([d, c, -b, a]), p = r.pick([90, 100, 150]);
    const W = new Poly([-d, p - c, b, -a]), dW = W.d();
    const disc = dW.co(1).v ** 2 - 4 * dW.co(2).v * dW.co(0).v;
    if (disc <= 0) return null;
    const x0 = (-dW.co(1).v - Math.sqrt(disc)) / (2 * dW.co(2).v);
    if (!(x0 > 0.5 && x0 < 15)) return null;
    const xk = r.int(2, 6), dK = K.d().at(xk);
    if (dK.v <= 0) return null;
    return {
        opgave: L`Een bakkerij bakt broden. De totale kosten (in euro) om $x$ keer 100 broden te bakken zijn $K(x) = ${K.tex()}$. De broden worden verkocht aan ${p} euro per 100 stuks.`,
        delen: [
            D.getal('Hoeveel kost het om 100 broden te bakken?', K.at(1), { eenheid: 'euro', code: 'rekenen', fouten: [{ w: d, code: 'rekenen', msg: '100 broden betekent x = 1 (x telt per 100 stuks).' }] }),
            D.getal(L`Bereken $K'(${xk})$.`, dK, { label: `K'(${xk}) =`, code: 'rekenen' }),
            D.keuze(L`Wat betekent $K'(${xk})$ concreet?`, [
                { t: `Bij een productie van ${xk * 100} broden stijgen de kosten met ongeveer ${dK.v} euro per 100 extra broden.`, ok: true },
                { t: `Het kost ${dK.v} euro om ${xk * 100} broden te bakken.`, msg: `Dat is K(${xk}), niet K′(${xk}). De afgeleide is een verandering (rico van de raaklijn).`, code: 'begrip' },
                { t: `De winst bij ${xk * 100} broden is ${dK.v} euro.`, msg: 'Het gaat om de kosten, en K′ is een verandering, geen bedrag.', code: 'begrip' },
                { t: `Eén brood kost ${dK.v} euro.`, msg: 'K′ geeft de kostenstijging per 100 extra broden bij die productie.', code: 'begrip' },
            ]),
            D.expr('Stel het voorschrift op van de winstfunctie $W(x)$.', W.txt(), { label: 'W(x) =', afgeleide: false, code: 'vraagstuk', juistTex: W.tex(), fouten: [{ e: K.sub(new Poly([0, p])).txt(), code: 'teken', msg: 'Winst = opbrengst − kosten, niet omgekeerd.' }] }),
            D.getal('Bepaal met GeoGebra bij hoeveel broden de winst maximaal is (op 1 brood nauwkeurig).', Math.round(x0 * 100), { gg: 'grafisch', eenheid: 'broden', code: 'vraagstuk', tol: 1, fouten: [{ w: rond(x0, 3), code: 'eenheid', msg: `x = ${nl(x0, 3)} betekent ${nl(x0, 3)} keer 100 broden.` }] }),
        ],
        hints: ['100 broden: x = 1.', "K′(a) is de rico van de raaklijn: de stijging van de kosten per extra 100 broden bij een productie van a·100 stuks.", `Winst = opbrengst − kosten: W(x) = ${p}x − K(x). Zoek het maximum met W′(x) = 0 of met GeoGebra.`],
        stappen: [
            L`$K(1) = ${K.at(1).tex()}$ euro`,
            L`$K'(x) = ${K.d().tex()}$, dus $K'(${xk}) = ${dK.tex()}$ euro per 100 broden (rico van de raaklijn).`,
            L`$W(x) = ${p}x - \left(${K.tex()}\right) = ${W.tex()}$`,
            L`$W'(x) = ${dW.tex()} = 0 \iff x \approx ${nlTex(x0, 3)}$ (maximum)`,
            L`!De winst is maximaal bij ongeveer $${Math.round(x0 * 100)}$ broden.`,
        ],
    };
}));

G('prob-gegeven', 'problemen', 1, 'Extremumprobleem met gegeven voorschrift', r => {
    const v = r.int(1, 3);
    if (v === 1) {
        const b = r.pick([4, 5, 6, 7, 8]), c = r.pick([10, 12, 14, 15]), Tm = b * b / 2 + c;
        const T = new Poly([c, b, F(-1, 2)]);
        return {
            opgave: L`De temperatuur (in °C) in een serre wordt op een zonnige dag benaderd door $T(t) = ${T.tex('t')}$, met $t$ het aantal uren na 6 uur 's morgens ($0 \le t \le 14$).`,
            delen: [
                D.getal('Na hoeveel uur is het het warmst in de serre?', b, { label: 't =', eenheid: 'uur', code: 'vraagstuk' }),
                D.getal('Hoe warm is het dan?', Tm, { eenheid: '°C', code: 'vraagstuk', fouten: [{ w: c, code: 'vraagstuk', msg: 'Dit is de temperatuur om 6 uur. Vul de gevonden t in in T(t).' }] }),
            ],
            hints: ["Op het warmste moment is T′(t) = 0.", 'Vul de gevonden t in in het voorschrift van T.'],
            stappen: [L`$T'(t) = ${T.d().tex('t')} = 0 \iff t = ${b}$ ($T'$ gaat van $+$ naar $-$: maximum), dus om ${6 + b} uur`, L`!$T(${b}) = ${nlTex(Tm)}$ °C`],
        };
    }
    if (v === 2) {
        const n = r.pick([60, 80, 100, 120]), s = 10, x0 = r.int(3, Math.floor(n / 4));
        const p0 = s * n - 2 * s * x0;
        const prijs = p0 + s * x0, aantal = n - x0;
        return {
            opgave: `Een reisbureau organiseert een citytrip. Bij een prijs van €${p0} per persoon schrijven er ${n} mensen in. Voor elke €${s} die de prijs stijgt, schrijft er één persoon minder in. Noem $x$ het aantal keer dat de prijs met €${s} verhoogd wordt.`,
            delen: [
                D.expr('Stel het voorschrift op van de opbrengst $O(x)$.', `(${p0}+${s}x)(${n}-x)`, { label: 'O(x) =', afgeleide: false, code: 'vraagstuk', dom: [0, 20] }),
                D.getal('Bij welke prijs per persoon is de opbrengst maximaal?', prijs, { eenheid: 'euro', code: 'vraagstuk', fouten: [{ w: x0, code: 'vraagstuk', msg: `x = ${x0} is het aantal verhogingen. De prijs is ${p0} + ${s}x.` }] }),
                D.getal('Hoeveel mensen schrijven dan in?', aantal, { code: 'vraagstuk' }),
                D.getal('Hoe groot is die maximale opbrengst?', prijs * aantal, { eenheid: 'euro', code: 'vraagstuk' }),
            ],
            hints: [`Prijs: ${p0} + ${s}x; aantal deelnemers: ${n} − x.`, "O(x) = prijs · aantal. Bereken O′(x) en stel O′(x) = 0."],
            stappen: [
                L`$O(x) = \left(${p0} + ${s}x\right)\left(${n} - x\right) = ${new Poly([p0 * n, s * n - p0, -s]).tex()}$`,
                L`$O'(x) = ${new Poly([s * n - p0, -2 * s]).tex()} = 0 \iff x = ${x0}$ (maximum)`,
                L`!Prijs €$${prijs}$ per persoon, $${aantal}$ deelnemers, opbrengst €$${prijs * aantal}$.`,
            ],
        };
    }
    const k = r.pick([F(-1, 2), F(-1, 4), F(-1, 5)]), x0 = r.pick([20, 30, 40, 50]), m = r.pick([200, 300, 150]);
    const W = new Poly([F(-m), k.maal(-2 * x0), k]);
    const Wm = W.at(x0);
    return {
        opgave: L`De dagelijkse winst (in euro) van een bakker bij een verkoop van $x$ taarten is $W(x) = ${W.tex()}$.`,
        delen: [
            D.getal('Bij hoeveel taarten is de winst maximaal?', x0, { code: 'vraagstuk' }),
            D.getal('Hoe groot is die maximale winst?', Wm, { eenheid: 'euro', code: 'vraagstuk' }),
        ],
        hints: ["Stel W′(x) = 0."],
        stappen: [L`$W'(x) = ${W.d().tex()} = 0 \iff x = ${x0}$ (maximum)`, L`!$W(${x0}) = ${Wm.tex()}$ euro`],
    };
});

G('prob-afstand', 'problemen', 2, 'Kleinste verticale afstand tussen twee grafieken', r => herhaal(() => {
    const a = r.pick([F(1, 2), F(1), F(2), F(1, 4)]), m = r.nz(-4, 4), q = r.int(-6, -1);
    const d = new Poly([F(-q), F(-m), a]);
    const x0 = F(m).door(a.maal(2));
    const dm = d.at(x0);
    if (dm.v <= 0) return null;
    const P = [x0, a.maal(x0.macht(2))], Q = [x0, F(m).maal(x0).plus(q)];
    return {
        opgave: L`Gegeven zijn de parabool $f(x) = ${new Poly([0, 0, a]).tex()}$ en de rechte $g(x) = ${new Poly([q, m]).tex()}$. Een verticale rechte snijdt de parabool in $A$ en de rechte in $B$. Voor welke ligging is de afstand $|AB|$ het kleinst?`,
        delen: [
            D.expr('Stel het voorschrift op van de afstand $d(x) = f(x) - g(x)$.', d.txt(), { label: 'd(x) =', afgeleide: false, code: 'vraagstuk' }),
            D.getal('Voor welke $x$ is de afstand het kleinst?', x0, { label: 'x =', code: 'vraagstuk' }),
            D.punt('Geef de coördinaat van $A$ (op de parabool).', P[0], P[1], { naam: 'A', code: 'fa' }),
            D.getal('Hoe groot is die kleinste afstand?', dm, { code: 'vraagstuk' }),
        ],
        hints: ['De parabool ligt overal boven de rechte, dus |AB| = f(x) − g(x).', "Stel d′(x) = 0."],
        stappen: [L`$d(x) = ${new Poly([0, 0, a]).tex()} - \left(${new Poly([q, m]).tex()}\right) = ${d.tex()}$`, L`$d'(x) = ${d.d().tex()} = 0 \iff x = ${x0.tex()}$ (minimum)`, L`!$A${ptTex(P[0], P[1])}$, $B${ptTex(Q[0], Q[1])}$ en $|AB| = ${dm.tex()}$`],
    };
}));

G('hb-derde', 'holbol', 1, 'Buigpunt van een derdegraadsfunctie', r => herhaal(() => {
    const a = r.nz(-3, 3), x0 = F(r.int(-3, 3), r.pick([1, 1, 3]));
    const b = a * -3 * x0.v;
    if (!Number.isInteger(b)) return null;
    const p = new Poly([r.int(-6, 6), r.int(-6, 6), b, a]), d2 = p.d().d();
    const y0 = p.at(x0);
    const cel = tekens([x0.v], x => d2.num(x));
    return {
        opgave: L`Gegeven is $${fTex(p)}$.`,
        delen: [
            D.expr("Bereken $f''(x)$.", d2.txt(), { label: L`f''(x) =`, code: 'rekenen', fouten: [{ e: p.d().txt(), code: 'rekenen', msg: "Dit is f′(x). Leid nog een keer af." }] }),
            D.keuze('Waar is de grafiek van $f$ hol?', [
                { t: `$${cel[0] === '+' ? L`\left]-\infty, ${x0.tex()}\right[` : L`\left]${x0.tex()}, +\infty\right[`}$`, ok: true },
                { t: `$${cel[0] === '+' ? L`\left]${x0.tex()}, +\infty\right[` : L`\left]-\infty, ${x0.tex()}\right[`}$`, msg: 'Daar is f″ negatief: de grafiek is daar bol (∩).', code: 'holbol' },
                { t: L`$\mathbb{R}$`, msg: 'f″ wisselt van teken: de grafiek is niet overal hol.', code: 'holbol' },
            ]),
            D.punt('Geef de coördinaat van het buigpunt.', x0, y0, { naam: 'B.P.', code: 'holbol', yMsg: "De x-coördinaat is juist. De y-coördinaat vind je in het voorschrift van f (niet in f′ of f″)." }),
        ],
        hints: ["f″ > 0: hol (∪); f″ < 0: bol (∩).", 'Een buigpunt ligt waar f″ = 0 en van teken wisselt.'],
        stappen: [
            L`$f'(x) = ${p.d().tex()}$ en $f''(x) = ${d2.tex()}$`,
            L`$f''(x) = 0 \iff x = ${x0.tex()}$`,
            `$$${f2Tabel([x0.v], [x0.tex()], x => d2.num(x), [y0.tex()])}$$`,
            L`!Buigpunt $\left(${x0.tex()}, ${y0.tex()}\right)$`,
        ],
    };
}));

G('hb-vierde', 'holbol', 2, 'Hol, bol en buigpunten (vierde graad)', r => herhaal(() => {
    const R = [F(-3), F(-2), F(-1), F(0), F(1), F(2), F(3), F(-1, 2), F(1, 2), F(-2, 3), F(2, 3), F(-1, 3), F(1, 3), F(3, 2), F(-3, 2)];
    const [r1, r2] = r.schud(R).slice(0, 2).sort((u, v) => u.v - v.v);
    if (r2.v - r1.v < 0.5) return null;
    const a = r.pick([1, -1, 2, -2, 3, -3]);
    const d2 = Poly.wortels(12 * a, [r1, r2]);
    const p = primitief(primitief(d2, r.int(-5, 5)), r.int(-4, 4));
    if (!p.c.every(c => c.geheel) || p.c.some(c => Math.abs(c.v) > 40)) return null;
    const y1 = p.at(r1), y2 = p.at(r2);
    if (y1.d > 81 || y2.d > 81) return null;
    const cel = tekens([r1.v, r2.v], x => d2.num(x));
    const holI = cel[0] === '+' ? [L`\left]-\infty, ${r1.tex()}\right[`, L`\left]${r2.tex()}, +\infty\right[`] : [intv(r1.tex(), r2.tex())];
    const bolI = cel[0] === '+' ? [intv(r1.tex(), r2.tex())] : [L`\left]-\infty, ${r1.tex()}\right[`, L`\left]${r2.tex()}, +\infty\right[`];
    return {
        opgave: L`Bepaal voor welke waarden van $x$ de grafiek van $${fTex(p)}$ hol of bol is en bereken de coördinaten van de buigpunten. Gebruik breuken waar nodig.`,
        delen: [
            D.expr("Bereken $f''(x)$.", d2.txt(), { label: L`f''(x) =`, code: 'rekenen', fouten: [{ e: p.d().txt(), code: 'rekenen', msg: "Dit is f′(x). Leid nog een keer af." }] }),
            D.lijst('Voor welke $x$-waarden heeft de grafiek een buigpunt?', [r1, r2], { label: 'x =', code: 'holbol' }),
            D.keuze('Waar is de grafiek bol?', [
                { t: '$' + bolI.join(L` \text{ en } `) + '$', ok: true },
                { t: '$' + holI.join(L` \text{ en } `) + '$', msg: "Daar is f″ positief: daar is de grafiek hol (∪).", code: 'holbol' },
            ], { vast: true }),
            D.punt(L`Geef de coördinaat van het buigpunt met $x = ${r1.tex()}$.`, r1, y1, { naam: 'B.P.', code: 'fa' }),
            D.punt(L`Geef de coördinaat van het buigpunt met $x = ${r2.tex()}$.`, r2, y2, { naam: 'B.P.', code: 'fa' }),
        ],
        hints: ["Bereken f″(x) en stel f″(x) = 0 (zet een factor voorop of gebruik de discriminant).", "Tekentabel van f″: + is hol (∪), − is bol (∩).", 'Bereken de y-coördinaat met het voorschrift van f; werk met breuken.'],
        stappen: [
            L`$f'(x) = ${p.d().tex()}$ en $f''(x) = ${d2.tex()}$`,
            L`$f''(x) = 0 \iff x = ${r1.tex()} \text{ of } x = ${r2.tex()}$`,
            `$$${f2Tabel([r1.v, r2.v], [r1.tex(), r2.tex()], x => d2.num(x), [y1.tex(), y2.tex()])}$$`,
            L`$f(${r1.tex()}) = ${y1.tex()}$ en $f(${r2.tex()}) = ${y2.tex()}$`,
            L`!Buigpunten $\left(${r1.tex()}, ${y1.tex()}\right)$ en $\left(${r2.tex()}, ${y2.tex()}\right)$.`,
        ],
    };
}));

G('hb-tweedetest', 'holbol', 2, 'Tweede-afgeleidetest', r => herhaal(() => {
    const r1 = r.int(-4, 2), r2 = r1 + r.int(1, 5), k = r.pick([3, -3, 6, -6]);
    const dp = Poly.wortels(k, [r1, r2]), p = primitief(dp, r.int(-5, 5));
    if (!p.c.every(c => c.geheel)) return null;
    const d2 = dp.d(), s1 = d2.at(r1), s2 = d2.at(r2);
    return {
        opgave: L`Bereken de relatieve extrema van $${fTex(p)}$ met de tweede-afgeleidetest (dus zonder tekentabel van $f'$).`,
        delen: [
            D.lijst("Los op: $f'(x) = 0$.", [r1, r2], { label: 'x =', code: 'nulwaarden' }),
            D.getal(L`Bereken $f''(${r1})$.`, s1, { label: `f''(${r1}) =`, code: 'rekenen' }),
            keuzeType(L`Wat bereikt $f$ in $x = ${r1}$?`, s1.v < 0 ? 'max' : 'min', { maxMsg: `f″(${r1}) ${s1.v < 0 ? '<' : '>'} 0. Tweede-afgeleidetest: f″ < 0 (∩) geeft een maximum, f″ > 0 (∪) een minimum.`, minMsg: `f″(${r1}) ${s1.v < 0 ? '<' : '>'} 0. Tweede-afgeleidetest: f″ < 0 (∩) geeft een maximum, f″ > 0 (∪) een minimum.` }),
            D.punt(L`Geef de coördinaat van het extremum in $x = ${r2}$.`, r2, p.at(r2), { code: 'fa' }),
        ],
        hints: ["Bereken f′(x) en f″(x).", "Tweede-afgeleidetest: als f′(a) = 0 en f″(a) < 0 → maximum; f″(a) > 0 → minimum."],
        stappen: [
            L`$f'(x) = ${dp.tex()} = 0 \iff x = ${r1} \text{ of } x = ${r2}$`,
            L`$f''(x) = ${d2.tex()}$`,
            L`$f''(${r1}) = ${s1.tex()} ${s1.v < 0 ? '< 0 \\;(\\cap)' : '> 0 \\;(\\cup)'}$: ${s1.v < 0 ? 'maximum' : 'minimum'} in $\left(${r1}, ${p.at(r1).tex()}\right)$`,
            L`!$f''(${r2}) = ${s2.tex()} ${s2.v < 0 ? '< 0 \\;(\\cap)' : '> 0 \\;(\\cup)'}$: ${s2.v < 0 ? 'maximum' : 'minimum'} in $\left(${r2}, ${p.at(r2).tex()}\right)$`,
        ],
    };
}));

G('hb-rationaal', 'holbol', 3, 'Tweede-afgeleidetest bij een rationale functie', r => herhaal(() => {
    const x0 = F(r.pick([-4, -2, 2, 4])), c = x0.macht(3).door(2);
    const t = new Poly([c, 0, 0, 1]), y0 = x0.maal(3).door(2);
    const f2 = c.maal(6).door(x0.macht(4));
    const T1 = new Poly([c.maal(-2), 0, 0, 1]);
    return {
        opgave: L`Gebruik de tweede-afgeleidetest om aan te tonen dat $f(x) = ${fr(t.tex(), 'x^2')}$ een relatief extremum heeft. Bepaal dit extremum.`,
        delen: [
            D.expr("Bereken $f'(x)$ en vereenvoudig.", `(${T1.txt()})/x^3`, { van: `(${t.txt()})/x^2`, code: 'quotient', dom: [0.3, 3], juistTex: fr(T1.tex(), 'x^3') }),
            D.getal("Los op: $f'(x) = 0$.", x0, { label: 'x =', code: 'nulwaarden' }),
            D.expr("Bereken $f''(x)$ en vereenvoudig.", `${c.maal(6).txtP()}/x^4`, { label: L`f''(x) =`, van: `(${T1.txt()})/x^3`, code: 'quotient', dom: [0.3, 3], juistTex: fr(c.maal(6).tex(), 'x^4') }),
            keuzeType(L`Wat bereikt $f$ in $x = ${x0.tex()}$?`, f2.v < 0 ? 'max' : 'min'),
            D.getal('Bereken de waarde van het extremum.', y0, { label: 'y =', code: 'fa' }),
        ],
        hints: ['Quotiëntregel met noemer x²; vereenvoudig door x te schrappen.', "f″ vind je opnieuw met de quotiëntregel (noemer x³).", "Vul de nulwaarde van f′ in in f″: negatief → maximum, positief → minimum."],
        stappen: [
            L`$f'(x) = \dfrac{3x^2\cdot x^2 - ${t.texP()}\cdot 2x}{x^4} = \dfrac{${new Poly([0, c.maal(-2), 0, 0, 1]).tex()}}{x^4} = ${fr(T1.tex(), 'x^3')}$`,
            L`$f'(x) = 0 \iff x^3 = ${c.maal(2).tex()} \iff x = ${x0.tex()}$`,
            L`$f''(x) = \dfrac{3x^2\cdot x^3 - \left(${T1.tex()}\right)\cdot 3x^2}{x^6} = \dfrac{${c.maal(6).tex()}x^2}{x^6} = ${fr(c.maal(6).tex(), 'x^4')}$`,
            L`$f''(${x0.tex()}) = ${f2.tex()} ${f2.v < 0 ? '< 0' : '> 0'}$`,
            L`!Bij $x = ${x0.tex()}$ een ${f2.v < 0 ? 'maximum' : 'minimum'} met waarde $${y0.tex()}$.`,
        ],
    };
}));

G('hb-param', 'holbol', 2, 'Parameters zodat er een buigpunt is', r => herhaal(() => {
    const v = r.int(1, 2);
    if (v === 1) {
        const k = r.zonder(-3, 3, 0), a = -2 * k, yk = -(k ** 4);
        return {
            opgave: L`De grafiek van $f(x) = x^4 + a x^3$ heeft een buigpunt in $x = ${k}$.`,
            delen: [
                D.getal('Bereken $a$.', a, { label: 'a =', code: 'holbol', punten: 2, tip: `Stel f″(${k}) = 0.` }),
                D.punt(L`Geef de coördinaat van het buigpunt met $x = ${k}$.`, k, yk, { naam: 'B.P.', code: 'fa' }),
                D.lijst("Voor welke $x$-waarden is $f''(x) = 0$?", [0, k], { label: 'x =', code: 'nulwaarden', fouten: [{ w: [k], code: 'nulwaarden', msg: "Zet 6x voorop in f″(x): ook x = 0 is een nulwaarde." }] }),
            ],
            hints: ["Een buigpunt in x = k: f″(k) = 0.", L`$f''(x) = 12x^2 + 6a x$`, 'Vul a in en bereken f(k) met het voorschrift van f.'],
            stappen: [L`$f'(x) = 4x^3 + 3a x^2$ en $f''(x) = 12x^2 + 6a x$`, L`$f''(${k}) = 0 \iff ${12 * k * k} ${6 * k < 0 ? '-' : '+'} ${Math.abs(6 * k)}a = 0 \iff a = ${a}$`, L`$f(x) = ${new Poly([0, 0, 0, a, 1]).tex()}$, dus $f(${k}) = ${yk}$`, L`!$f''(x) = 12x^2 ${a * 6 < 0 ? '-' : '+'} ${Math.abs(6 * a)}x = 12x\left(${Poly.lin(k).tex()}\right) = 0 \iff x = 0 \text{ of } x = ${k}$ (twee buigpunten)`],
        };
    }
    const k = r.pick([-2, -1, 1, 2]), a = r.nz(-2, 2);
    const b = -3 * a * k, y = -2 * a * k ** 3;
    return {
        opgave: L`Bereken $a$ en $b$ zodat $P(${k}, ${y})$ een buigpunt is van de grafiek van $f(x) = a x^3 + b x^2$.`,
        delen: [D.getal('Bereken $a$.', a, { label: 'a =', code: 'rekenen', punten: 1.5 }), D.getal('Bereken $b$.', b, { label: 'b =', code: 'rekenen', punten: 1.5 })],
        hints: [`Buigpunt in x = ${k}: f″(${k}) = 0. Dat geeft een verband tussen a en b.`, `P ligt op de grafiek: f(${k}) = ${y}. Dat geeft een tweede vergelijking.`, 'Los het stelsel op: vervang b in de tweede vergelijking.'],
        stappen: [
            L`$f''(x) = 6a x + 2b$, dus $f''(${k}) = 0 \iff ${6 * k}a + 2b = 0 \iff b = ${coefTex(-3 * k)}a$`,
            L`$f(${k}) = ${y} \iff ${coefTex(k ** 3)}a + ${coefTex(k * k)}b = ${y}$`,
            L`>$\Rightarrow ${coefTex(k ** 3)}a ${-3 * k ** 3 < 0 ? '-' : '+'} ${Math.abs(3 * k ** 3)}a = ${y} \iff ${-2 * k ** 3}a = ${y} \iff a = ${a}$`,
            L`!$a = ${a}$ en $b = ${b}$`,
        ],
    };
}));

G('hb-verloop', 'holbol', 3, 'Samenvattende tabel met gebogen pijltjes', r => herhaal(() => {
    const r1 = r.int(-3, 1), r2 = r1 + 2 * r.int(1, 2), k = r.pick([3, -3]);
    const dp = Poly.wortels(k, [r1, r2]), p = primitief(dp, r.int(-4, 4));
    if (!p.c.every(c => c.geheel)) return null;
    const d2 = dp.d(), xb = (r1 + r2) / 2;
    const xs = [r1, xb, r2];
    const c1 = tekens(xs, x => dp.num(x)), c2 = tekens(xs, x => d2.num(x));
    const sym = (s1, s2) => VS[s1 + s2];
    const rij = (A, B) => A.map((s, i) => i % 2 === 0 ? sym(s, B[i]) : [p.at(xs[(i - 1) / 2]).tex()][0]);
    const juist = rij(c1, c2);
    const vals = xs.map(x => p.at(x).tex());
    const tabelVan = cel => `$${tabel(xs.map(String), [['f(x)', cel.map((c, i) => i % 2 === 0 ? c : vals[(i - 1) / 2])]])}$`;
    const flipB = rij(c1, c2.map(s => s === '+' ? '-' : s === '-' ? '+' : s));
    const flipA = rij(c1.map(s => s === '+' ? '-' : s === '-' ? '+' : s), c2);
    const flipAB = rij(c1.map(s => s === '+' ? '-' : s === '-' ? '+' : s), c2.map(s => s === '+' ? '-' : s === '-' ? '+' : s));
    const iv = [L`\left]-\infty, ${r1}\right[`, intv(r1, xb), intv(xb, r2), L`\left]${r2}, +\infty\right[`];
    const soortI = [0, 1, 2, 3].map(i => c1[2 * i] + c2[2 * i]);
    const vraagSoort = r.pick(['-+', '+-', '--', '++'].filter(s => soortI.includes(s)));
    return {
        opgave: L`Gegeven is $${fTex(p)}$ met $f'(x) = ${dp.tex()}$ en $f''(x) = ${d2.tex()}$.`,
        delen: [
            D.keuze('Welke tabel geeft het verloop van $f$ juist weer? (∪ = hol, ∩ = bol)', [
                { t: tabelVan(juist), ok: true },
                { t: tabelVan(flipB), msg: "Het stijgen en dalen klopt, maar hol en bol zijn verwisseld: f″ > 0 is hol (∪).", code: 'holbol' },
                { t: tabelVan(flipA), msg: "Hol en bol kloppen, maar stijgen en dalen zijn verwisseld: kijk naar het teken van f′.", code: 'tekentabel' },
                { t: tabelVan(flipAB), msg: "Zowel stijgen/dalen als hol/bol zijn omgekeerd.", code: 'tekentabel' },
            ], { punten: 2 }),
            D.keuze(`Op welk interval vertoont de grafiek van $f$ een ${VSNAAM[vraagSoort]}?`, [0, 1, 2, 3].map(i => ({ t: `$${iv[i]}$`, ok: soortI[i] === vraagSoort, msg: `Op dit interval is er een ${VSNAAM[soortI[i]]} (f′ ${soortI[i][0] === '+' ? '> 0' : '< 0'} en f″ ${soortI[i][1] === '+' ? '> 0' : '< 0'}).`, code: 'holbol' })), { vast: true }),
        ],
        hints: ["Maak één tabel met de nulwaarden van f′ én f″ en zet het teken van f′ en f″ eronder.", "f′ > 0 en f″ > 0: toenemende stijging; f′ > 0 en f″ < 0: afnemende stijging; f′ < 0 en f″ > 0: afnemende daling; f′ < 0 en f″ < 0: toenemende daling."],
        stappen: [
            L`$f'(x) = 0 \iff x = ${r1} \text{ of } x = ${r2}$ en $f''(x) = 0 \iff x = ${xb}$`,
            `$$${tabel(xs.map(String), [[L`f'(x)`, c1], [L`f''(x)`, c2], ['f(x)', juist.map((c, i) => i % 2 === 0 ? c : vals[(i - 1) / 2] + L`\ ` + lbl(i === 3 ? 'B.P.' : extLabel(c1, (i - 1) / 2)))]], { lijnVoor: 2 })}$$`,
            L`!$\overset{\cup}{\nearrow}$ toenemende stijging, $\overset{\cap}{\nearrow}$ afnemende stijging, $\overset{\cup}{\searrow}$ afnemende daling, $\overset{\cap}{\searrow}$ toenemende daling.`,
        ],
    };
}));

G('hb-begrip', 'holbol', 1, 'Begrippen: hol, bol en buigpunt', r => {
    const pool = [
        D.keuze("Als $f''(x) > 0$ op een interval, dan is de grafiek van $f$ daar:", [{ t: 'hol (∪)', ok: true }, { t: 'bol (∩)', msg: "f″ > 0: f′ stijgt, de grafiek is hol (∪).", code: 'holbol' }, { t: 'stijgend', msg: "Stijgen hangt af van het teken van f′, niet van f″.", code: 'holbol' }, { t: 'dalend', msg: "Dalen hangt af van het teken van f′, niet van f″.", code: 'holbol' }]),
        D.keuze("Als $f'(x) < 0$ en $f''(x) > 0$ op een interval, dan vertoont de grafiek:", [{ t: 'een afnemende daling', ok: true }, { t: 'een toenemende daling', msg: 'f″ > 0: de grafiek is hol, de daling wordt minder steil (afnemend).', code: 'holbol' }, { t: 'een toenemende stijging', msg: 'f′ < 0: de functie daalt.', code: 'holbol' }, { t: 'een afnemende stijging', msg: 'f′ < 0: de functie daalt.', code: 'holbol' }]),
        D.keuze("Als $f'(x) > 0$ en $f''(x) < 0$ op een interval, dan vertoont de grafiek:", [{ t: 'een afnemende stijging', ok: true }, { t: 'een toenemende stijging', msg: 'f″ < 0: de grafiek is bol, de stijging wordt minder steil.', code: 'holbol' }, { t: 'een afnemende daling', msg: 'f′ > 0: de functie stijgt.', code: 'holbol' }, { t: 'een toenemende daling', msg: 'f′ > 0: de functie stijgt.', code: 'holbol' }]),
        D.janee("Als $f''(c) = 0$, dan heeft de grafiek altijd een buigpunt in $x = c$.", false, { msg: "Niet altijd: f″ moet ook van teken wisselen. Voorbeeld: f(x) = x⁴ heeft f″(0) = 0, maar geen buigpunt.", code: 'holbol' }),
        D.janee('In een buigpunt gaat de grafiek over van hol naar bol (of omgekeerd).', true, { msg: 'Dat is de definitie van een buigpunt (en er moet een raaklijn bestaan).', code: 'holbol' }),
        D.janee("Als $f'(a) = 0$ en $f''(a) < 0$, dan bereikt $f$ een minimum in $x = a$.", false, { msg: "f″(a) < 0 betekent bol (∩): een maximum.", code: 'maxmin' }),
        D.janee("Als $f'(a) = 0$ en $f''(a) > 0$, dan bereikt $f$ een minimum in $x = a$.", true, { msg: "f″(a) > 0: hol (∪), dus een minimum.", code: 'maxmin' }),
        D.janee("De grafiek van een tweedegraadsfunctie heeft nooit een buigpunt.", true, { msg: "f″ is een constante (≠ 0): de grafiek is overal hol of overal bol.", code: 'holbol' }),
        D.janee("De grafiek van een derdegraadsfunctie heeft altijd juist één buigpunt.", true, { msg: "f″ is van de eerste graad: één nulwaarde waar f″ van teken wisselt.", code: 'holbol' }),
        D.keuze("Als $f'(a) = 0$ en $f''(a) = 0$, dan:", [{ t: 'kan je met de tweede-afgeleidetest niets besluiten', ok: true }, { t: 'is er zeker een buigpunt', msg: 'Niet zeker: denk aan x⁴ in x = 0 (minimum).', code: 'holbol' }, { t: 'is er zeker een maximum', msg: 'Niet zeker: de test geeft dan geen besluit; maak een tekentabel van f′.', code: 'maxmin' }, { t: 'is er zeker een minimum', msg: 'Niet zeker: denk aan x³ in x = 0 (buigpunt).', code: 'maxmin' }]),
    ];
    return {
        opgave: 'Beantwoord de vragen over hol, bol, buigpunten en de tweede-afgeleidetest.',
        delen: r.schud(pool).slice(0, 4),
        hints: ["f″ > 0: hol (∪), f″ < 0: bol (∩).", "Buigpunt: f″ = 0 én f″ wisselt van teken.", "Tweede-afgeleidetest: f′(a) = 0 en f″(a) < 0 → maximum; f″(a) > 0 → minimum."],
        stappen: ["$f'' > 0 \\Rightarrow$ hol $\\cup$ ($f'$ stijgt), $f'' < 0 \\Rightarrow$ bol $\\cap$ ($f'$ daalt).", 'Een buigpunt: de grafiek gaat over van hol naar bol of omgekeerd (f″ wisselt van teken) en er is een raaklijn.', "!Tweede-afgeleidetest: $f'(a) = 0$ en $f''(a) < 0 \\Rightarrow$ maximum; $f''(a) > 0 \\Rightarrow$ minimum."],
    };
});

G('hb-graf', 'holbol', 2, 'Tekentabel van f″ uit een grafiek', r => herhaal(() => {
    const x1 = r.int(-4, 1), x2 = x1 + 2 * r.int(1, 2);
    if (x2 > 4) return null;
    const res = derdeMetToppen(r, x1, x2);
    if (!res) return null;
    const { p } = res, d2 = p.d().d(), xb = (x1 + x2) / 2;
    const cel = tekens([xb], x => d2.num(x));
    const tab = c => `$${tabel([String(xb)], [[L`f''(x)`, c]])}$`;
    const svg = grafiek({ xmin: -6, xmax: 6, ymin: -6, ymax: 6, krommen: [{ f: x => p.num(x) }], punten: [], aria: 'grafiek van een derdegraadsfunctie' });
    return {
        opgave: 'De grafiek van een derdegraadsfunctie $f$ is gegeven. Haar toppen liggen bij gehele $x$-waarden.' + opgFig(svg),
        delen: [
            D.getal('Wat is de $x$-coördinaat van het buigpunt?', xb, { label: 'x =', code: 'holbol', fouten: [{ w: x1, code: 'holbol', msg: 'Dit is een top (extremum), geen buigpunt. Bij een derdegraadsfunctie ligt het buigpunt midden tussen de toppen.' }, { w: x2, code: 'holbol', msg: 'Dit is een top (extremum), geen buigpunt. Bij een derdegraadsfunctie ligt het buigpunt midden tussen de toppen.' }] }),
            D.keuze("Welke tabel is het tekenverloop van $f''$?", [
                { t: tab(cel), ok: true },
                { t: tab(cel.map(c => c === '+' ? '-' : c === '-' ? '+' : c)), msg: 'Omgekeerd: waar de grafiek hol is (∪) is f″ positief.', code: 'holbol' },
            ], { vast: true }),
        ],
        hints: ['Kijk waar de grafiek hol (∪, als een dal) en waar ze bol (∩, als een berg) is.', 'Het buigpunt is het punt waar de grafiek overgaat van bol naar hol of omgekeerd.'],
        stappen: [`De grafiek is ${cel[0] === '+' ? 'hol' : 'bol'} links en ${cel[0] === '+' ? 'bol' : 'hol'} rechts van $x = ${xb}$.`, `!$$${f2Tabel([xb], [String(xb)], x => d2.num(x), [lbl('B.P.')])}$$`],
    };
}));

// =====================================================================
// 7. OEFENINGEN (generatoren) — deel 3: exponentiële, logaritmische
//    en goniometrische functies
// =====================================================================
// een "afgeleide berekenen"-deelvraag: f en f′ in invoernotatie, f′ ook als LaTeX
function afg(fTexS, fTxt, dTxt, dTex, o = {}) {
    return D.expr(L`$${o.naam || 'f'}(x) = ${fTexS}$`, dTxt, { van: fTxt, juistTex: dTex, label: L`${o.naam || 'f'}'(x) =`, dom: o.dom || [0.3, 2.4], code: o.code || 'onbekend', fouten: o.fouten || [], punten: o.punten ?? 1, knoppen: o.knoppen, vereenvoudig: o.vereenvoudig });
}
const KN_EL = [...KNOP.explog, ['√', 'sqrt('], ['^', '^'], ['/', '/'], ['(', '('], [')', ')']];
const KN_GO = [...KNOP.gonio, ['eˣ', 'e^('], ['ln', 'ln('], ['^', '^'], ['/', '/'], ['(', '('], [')', ')']];
function deelPool(r, pool, n) { return r.schud(pool).slice(0, n).map(f => f()); }
const lnT = a => L`\ln ${a}`;

// =================== 11.1 EXPONENTIËLE EN LOGARITMISCHE FUNCTIES ===================
G('el-logrekenen', 'explog', 1, 'Logaritmen berekenen zonder rekenmachine', r => {
    const pool = [
        () => { const a = r.pick([2, 3, 5]), k = r.int(2, a === 2 ? 6 : 4); return { v: L`\log_{${a}} ${a ** k}`, w: k, s: L`\log_{${a}} ${a ** k} = ${k}`, u: `want $${a}^{${k}} = ${a ** k}$` }; },
        () => { const k = r.int(2, 4); return { v: L`\log 0{,}${'0'.repeat(k - 1)}1`, w: -k, s: L`\log 10^{-${k}} = -${k}`, u: `want $0{,}${'0'.repeat(k - 1)}1 = 10^{-${k}}$` }; },
        () => { const a = r.pick([2, 3, 5]), k = r.int(2, 4); return { v: L`\log_{${a}} \dfrac{1}{${a ** k}}`, w: -k, s: L`\log_{${a}} ${a}^{-${k}} = -${k}`, u: `want $\\dfrac{1}{${a ** k}} = ${a}^{-${k}}$` }; },
        () => { const a = r.pick([2, 3]), m = r.int(1, 2), n = r.pick([3, 5]); return { v: L`\log_{${a}} \sqrt[${n}]{${a ** m}}`, w: F(m, n), s: L`\log_{${a}} ${a}^{\frac{${m}}{${n}}} = ${F(m, n).tex()}`, u: `want $\\sqrt[${n}]{${a ** m}} = ${a}^{\\frac{${m}}{${n}}}$` }; },
        () => { const [a, n] = r.pick([[4, 2], [5, 2], [25, 2], [8, 3], [40, 3], [2, 1]]), b = 10 ** n / a; return { v: L`\log ${a} + \log ${nlTex(b)}`, w: n, s: L`\log\left(${a}\cdot ${nlTex(b)}\right) = \log ${10 ** n} = ${n}`, u: 'rekenregel: $\\log a + \\log b = \\log (a\\cdot b)$' }; },
        () => { const k = r.int(2, 5); return { v: L`\ln e^{${k}}`, w: k, s: L`\ln e^{${k}} = ${k}`, u: 'want $\\ln$ en $e^x$ zijn inverse functies' }; },
        () => { const n = r.pick([2, 3]); return { v: L`\ln \sqrt[${n}]{e}`, w: F(1, n), s: L`\ln e^{\frac{1}{${n}}} = ${F(1, n).tex()}`, u: '' }; },
        () => { const a = r.pick([3, 5, 7]); return { v: L`e^{\ln ${a}}`, w: a, s: L`e^{\ln ${a}} = ${a}`, u: 'want $e^{\\ln x} = x$' }; },
        () => { const [b, x, w] = r.pick([[4, 8, F(3, 2)], [8, 4, F(2, 3)], [9, 27, F(3, 2)], [4, 2, F(1, 2)], [25, 125, F(3, 2)]]); return { v: L`\log_{${b}} ${x}`, w, s: L`\log_{${b}} ${x} = ${w.tex()}`, u: `want $${b}^{${w.tex()}} = ${x}$` }; },
        () => { const a = r.pick([2, 5]); return { v: L`\log_{${a}} 1`, w: 0, s: L`\log_{${a}} 1 = 0`, u: `want $${a}^0 = 1$` }; },
    ];
    const D3 = deelPool(r, pool, 3);
    return {
        opgave: 'Bereken zonder rekenmachine.',
        delen: D3.map(d => D.getal(`$${d.v}$`, d.w, { code: 'log', label: '=' })),
        hints: [L`$\log_a x = y \iff a^y = x$: zoek de exponent.`, 'Schrijf het getal als een macht van het grondtal (wortels als breuken, 1/a als a⁻¹).'],
        stappen: D3.map(d => `$${d.s}$ ${d.u}`).concat(['!$\\log_a\\left(a^k\\right) = k$ en $a^{\\log_a x} = x$']),
    };
});

G('el-basis', 'explog', 1, 'Afgeleiden: eᶠ, aᶠ, ln f en logₐ f', r => {
    const lin = () => Poly.hl(r.nz(-5, 5), r.int(-6, 6)), kw = () => Poly.hl(r.nz(-3, 3), r.int(-5, 5), r.nz(-3, 3));
    const pool = [
        () => { const u = kw(), du = u.d(); return afg(`e^{${u.tex()}}`, `e^(${u.txt()})`, `(${du.txt()})*e^(${u.txt()})`, `${du.texP()}\\,e^{${u.tex()}}`, { code: 'exp', dom: [-1, 1], fouten: [{ e: `e^(${u.txt()})`, code: 'exp', msg: L`Je vergat te vermenigvuldigen met de afgeleide van de exponent: $D\left(${u.tex()}\right) = ${du.tex()}$.` }, { e: `(${u.txt()})*e^(${u.txt()}-1)`, code: 'exp', msg: 'D(eᶠ) is geen machtsregel: eᶠ blijft eᶠ en je vermenigvuldigt met Df.' }] }); },
        () => { const a = r.pick([2, 3, 4, 6, 7, 10]), u = lin(), du = u.d(); return afg(`${a}^{${u.tex()}}`, `${a}^(${u.txt()})`, `${a}^(${u.txt()})*ln(${a})*(${du.txt()})`, `${du.c[0].tex()}\\cdot \\ln ${a}\\cdot ${a}^{${u.tex()}}`, { code: 'lna', dom: [-1, 1], fouten: [{ e: `${a}^(${u.txt()})*(${du.txt()})`, code: 'lna', msg: `Vergeet de factor ln ${a} niet: D(aᶠ) = aᶠ · ln a · Df.` }, { e: `${a}^(${u.txt()})*ln(${a})`, code: 'ketting', msg: `Vergeet niet te vermenigvuldigen met de afgeleide van de exponent (${du.tex()}).` }] }); },
        () => { const u = herhaal(() => { const p = Poly.hl(r.nz(-3, 3), 0, 0, r.nz(-6, 6)); return domPos(x => p.num(x), -1.5, 1.5) ? p : null; }), du = u.d(), a = r.pick([2, 3, 4, 7]), dom = domPos(x => u.num(x), -1.5, 1.5); return afg(`\\log_{${a}}\\left(${u.tex()}\\right)`, `log_${a}(${u.txt()})`, `(${du.txt()})/((${u.txt()})*ln(${a}))`, fr(du.tex(), `\\left(${u.tex()}\\right)\\ln ${a}`), { code: 'ln', dom, fouten: [{ e: `(${du.txt()})/(${u.txt()})`, code: 'lna', msg: `Vergeet de factor ln ${a} in de noemer niet: D(logₐ f) = Df / (f · ln a).` }, { e: `1/((${u.txt()})*ln(${a}))`, code: 'ketting', msg: 'Vergeet niet te vermenigvuldigen met de afgeleide van wat in de logaritme staat.' }] }); },
        () => { const k = r.pick([3, 4, 5, 7]), n = r.int(2, 4); return afg(`\\ln\\left(${k}x^{${n}}\\right)`, `ln(${k}x^${n})`, `${n}/x`, fr(n, 'x'), { code: 'ln', fouten: [{ e: `1/(${k}x^${n})`, code: 'ketting', msg: L`Vergeet niet te vermenigvuldigen met de afgeleide van $${k}x^{${n}}$.` }, { e: `${k * n}x^${n - 1}`, code: 'ln', msg: L`$D(\ln f) = \dfrac{Df}{f}$: je moet nog delen door $${k}x^{${n}}$.` }] }); },
        () => { const u = herhaal(() => { const p = Poly.hl(r.nz(-3, 3), r.int(-5, 5), r.int(1, 8)); return domPos(x => p.num(x), -1.5, 2) ? p : null; }), du = u.d(), dom = domPos(x => u.num(x), -1.5, 2); return afg(`\\ln\\left(${u.tex()}\\right)`, `ln(${u.txt()})`, `(${du.txt()})/(${u.txt()})`, fr(du.tex(), u.tex()), { code: 'ln', dom, fouten: [{ e: `1/(${u.txt()})`, code: 'ketting', msg: L`Vergeet niet te vermenigvuldigen met $D\left(${u.tex()}\right) = ${du.tex()}$.` }] }); },
        () => { const k = r.nz(-5, 5), c = r.nz(-4, 4); return afg(`${coefTex(c)}e^{${coefTex(k)}x}`, `${c}*e^(${k}x)`, `${c * k}*e^(${k}x)`, `${coefTex(c * k)}e^{${coefTex(k)}x}`, { code: 'exp', dom: [-1, 1], fouten: [{ e: `${c}*e^(${k}x)`, code: 'exp', msg: `Vergeet niet te vermenigvuldigen met de afgeleide van de exponent (${k}).` }] }); },
    ];
    return {
        opgave: 'Bereken de afgeleiden en vereenvoudig indien mogelijk.',
        delen: deelPool(r, pool, 3),
        hints: [L`$D\left(e^f\right) = e^f\cdot Df$ en $D\left(a^f\right) = a^f\cdot \ln a\cdot Df$`, L`$D(\ln f) = \dfrac{Df}{f}$ en $D(\log_a f) = \dfrac{Df}{f\cdot \ln a}$`],
        stappen: [L`$D\left(e^f\right) = e^f\cdot Df$ $\qquad D\left(a^f\right) = a^f\cdot \ln a\cdot Df$`, L`$D(\ln f) = \dfrac{Df}{f}$ $\qquad D(\log_a f) = \dfrac{Df}{f\cdot \ln a}$`, '!Vul in en vergeet nooit de factor Df (kettingregel).'],
    };
});

G('el-product', 'explog', 2, 'Product- en quotiëntregel met exp en log', r => {
    const pool = [
        () => afg(L`x^2\cdot \log(x + 1)`, 'x^2*log(x+1)', '2x*log(x+1)+x^2/((x+1)*ln(10))', L`2x\log(x + 1) + \dfrac{x^2}{(x + 1)\ln 10}`, { code: 'product', punten: 2, fouten: [{ e: '2x*log(x+1)+x^2/(x+1)', code: 'lna', msg: 'Vergeet ln 10 niet: D(log f) = Df / (f · ln 10).' }, { e: '2x/((x+1)*ln(10))', code: 'product', msg: 'Je vermenigvuldigde de afgeleiden. Gebruik de productregel: D(f·g) = Df·g + f·Dg.' }] }),
        () => afg(L`\dfrac{e^x}{x + 1}`, 'e^x/(x+1)', 'x*e^x/(x+1)^2', L`\dfrac{x\,e^x}{(x + 1)^2}`, { code: 'quotient', punten: 2, dom: [0.2, 2], fouten: [{ e: '-x*e^x/(x+1)^2', code: 'quotient', msg: 'De volgorde in de teller is omgekeerd: g·Df − f·Dg.' }, { e: 'e^x', code: 'quotient', msg: 'D(f/g) ≠ Df/Dg. Gebruik de quotiëntregel.' }] }),
        () => { const k = r.int(1, 3); return afg(`(x + ${k})e^{-x}`, `(x+${k})*e^(-x)`, `(${1 - k}-x)*e^(-x)`, L`\left(${new Poly([1 - k, -1]).tex()}\right)e^{-x}`, { code: 'product', punten: 2, dom: [-1, 1.5], fouten: [{ e: `(${1 + k}+x)*e^(-x)`, code: 'ketting', msg: L`$D\left(e^{-x}\right) = -e^{-x}$: vergeet de factor $-1$ niet.` }, { e: 'e^(-x)', code: 'product', msg: 'Productregel: er komen twee termen.' }] }); },
        () => { const k = r.pick([3, 4]); return afg(`x^{${k}}\\ln x`, `x^${k}*ln(x)`, `${k}x^${k - 1}*ln(x)+x^${k - 1}`, L`x^{${k - 1}}\left(${k}\ln x + 1\right)`, { code: 'product', punten: 2, fouten: [{ e: `${k}x^${k - 1}*ln(x)`, code: 'product', msg: 'Je vergat de tweede term van de productregel.' }, { e: `${k}x^${k - 2}`, code: 'product', msg: 'Je vermenigvuldigde de afgeleiden. Gebruik D(f·g) = Df·g + f·Dg.' }] }); },
        () => afg(L`\dfrac{\ln x}{x^2}`, 'ln(x)/x^2', '(1-2ln(x))/x^3', L`\dfrac{1 - 2\ln x}{x^3}`, { code: 'quotient', punten: 2, fouten: [{ e: '(2ln(x)-1)/x^3', code: 'quotient', msg: 'De volgorde in de teller is omgekeerd: g·Df − f·Dg.' }, { e: '(x-2x*ln(x))/x^2', code: 'noemer', msg: L`De noemer is $(x^2)^2 = x^4$. Schrap daarna een factor $x$.` }] }),
        () => { const a = r.pick([2, 3]); return afg(`x^2\\cdot ${a}^x`, `x^2*${a}^x`, `2x*${a}^x+x^2*${a}^x*ln(${a})`, L`x\cdot ${a}^x\left(2 + x\ln ${a}\right)`, { code: 'product', punten: 2, dom: [-1, 1.5], fouten: [{ e: `2x*${a}^x+x^2*${a}^x`, code: 'lna', msg: `D(${a}ˣ) = ${a}ˣ · ln ${a}.` }] }); },
        () => afg(L`\dfrac{e^{2x}}{x^2 + 1}`, 'e^(2x)/(x^2+1)', '2*e^(2x)*(x^2-x+1)/(x^2+1)^2', L`\dfrac{2e^{2x}\left(x^2 - x + 1\right)}{\left(x^2 + 1\right)^2}`, { code: 'quotient', punten: 2, dom: [-1, 1], vereenvoudig: true, fouten: [{ e: 'e^(2x)*(2x^2-2x+2)/(x^2+1)', code: 'noemer', msg: 'Vergeet het kwadraat in de noemer niet.' }, { e: 'e^(2x)*(x^2-2x+1)/(x^2+1)^2', code: 'ketting', msg: L`$D\left(e^{2x}\right) = 2e^{2x}$: vergeet de factor 2 niet.` }] }),
        () => afg(L`\sqrt{x}\,\ln x`, 'sqrt(x)*ln(x)', '(ln(x)+2)/(2*sqrt(x))', L`\dfrac{\ln x + 2}{2\sqrt{x}}`, { code: 'product', punten: 2, vereenvoudig: true, fouten: [{ e: '1/(2x*sqrt(x))', code: 'product', msg: 'Je vermenigvuldigde de afgeleiden. Gebruik de productregel.' }] }),
    ];
    return {

        delen: deelPool(r, pool, 2),
        hints: [L`Productregel: $D(f\cdot g) = Df\cdot g + f\cdot Dg$; quotiëntregel: $D\left(\dfrac{f}{g}\right) = \dfrac{g\cdot Df - f\cdot Dg}{g^2}$.`, L`$D(e^x) = e^x$, $D(\ln x) = \dfrac{1}{x}$, $D(\log x) = \dfrac{1}{x\ln 10}$, $D(a^x) = a^x \ln a$.`],
        stappen: [L`Productregel: $D(f\cdot g) = Df\cdot g + f\cdot Dg$`, L`Quotiëntregel: $D\left(\dfrac{f}{g}\right) = \dfrac{g\cdot Df - f\cdot Dg}{g^2}$`, '!Zet daarna gemeenschappelijke factoren voorop (bv. $e^x$) of schrap waar mogelijk.'],
    };

G('el-macht', 'explog', 2, 'Kettingregel met exp en log', r => {
    const pool = [
        () => { const n = r.int(2, 4), a = r.int(1, 3); return afg(L`\left(\ln x + ${a}\right)^{${n}}`, `(ln(x)+${a})^${n}`, `${n}*(ln(x)+${a})^${n - 1}/x`, fr(L`${n}\left(\ln x + ${a}\right)${n - 1 === 1 ? '' : `^{${n - 1}}`}`, 'x'), { code: 'ketting', punten: 2, fouten: [{ e: `${n}*(ln(x)+${a})^${n - 1}`, code: 'ketting', msg: L`Vergeet de afgeleide van het binnenste: $D\left(\ln x + ${a}\right) = \dfrac{1}{x}$.` }] }); },
        () => afg(L`\ln\left(e^x + 1\right)`, 'ln(e^x+1)', 'e^x/(e^x+1)', L`\dfrac{e^x}{e^x + 1}`, { code: 'ln', dom: [-1, 1.5], fouten: [{ e: '1/(e^x+1)', code: 'ketting', msg: L`Vergeet niet te vermenigvuldigen met $D\left(e^x + 1\right) = e^x$.` }] }),
        () => { const n = r.int(2, 4), k = r.pick([2, 3]); return afg(L`\left(e^{${k}x} - 1\right)^{${n}}`, `(e^(${k}x)-1)^${n}`, `${n}*(e^(${k}x)-1)^${n - 1}*${k}*e^(${k}x)`, L`${n * k}e^{${k}x}\left(e^{${k}x} - 1\right)${n - 1 === 1 ? '' : `^{${n - 1}}`}`, { code: 'ketting', dom: [0.2, 1], fouten: [{ e: `${n}*(e^(${k}x)-1)^${n - 1}*e^(${k}x)`, code: 'ketting', msg: L`$D\left(e^{${k}x}\right) = ${k}e^{${k}x}$: vergeet de factor ${k} niet.` }, { e: `${n}*(e^(${k}x)-1)^${n - 1}`, code: 'ketting', msg: 'Vergeet de afgeleide van het binnenste.' }] }); },
        () => afg(L`e^{\sqrt{x}}`, 'e^(sqrt(x))', 'e^(sqrt(x))/(2*sqrt(x))', L`\dfrac{e^{\sqrt{x}}}{2\sqrt{x}}`, { code: 'exp', fouten: [{ e: 'e^(sqrt(x))', code: 'exp', msg: L`Vergeet niet te vermenigvuldigen met $D\sqrt{x} = \dfrac{1}{2\sqrt{x}}$.` }] }),
        () => afg(L`\sqrt{\ln x}`, 'sqrt(ln(x))', '1/(2x*sqrt(ln(x)))', L`\dfrac{1}{2x\sqrt{\ln x}}`, { code: 'ketting', dom: [1.3, 3], fouten: [{ e: '1/(2*sqrt(ln(x)))', code: 'ketting', msg: L`Vergeet de afgeleide van $\ln x$: $\dfrac{1}{x}$.` }] }),
        () => { const k = r.int(2, 4); return afg(L`\ln^2\left(${k}x\right)`, `ln(${k}x)^2`, `2*ln(${k}x)/x`, L`\dfrac{2\ln\left(${k}x\right)}{x}`, { code: 'ketting', fouten: [{ e: `2*ln(${k}x)`, code: 'ketting', msg: L`Vergeet de afgeleide van $\ln\left(${k}x\right)$, namelijk $\dfrac{1}{x}$.` }, { e: `2*ln(${k}x)*${k}/x`, code: 'factor', msg: L`$D\ln\left(${k}x\right) = \dfrac{${k}}{${k}x} = \dfrac{1}{x}$: de ${k} valt weg.` }] }); },
        () => { const a = r.pick([2, 3]), b = r.int(1, 4); return afg(`\\log_{${a}}\\left(x^2 + ${b}x\\right)`, `log_${a}(x^2+${b}x)`, `(2x+${b})/((x^2+${b}x)*ln(${a}))`, fr(`2x + ${b}`, L`\left(x^2 + ${b}x\right)\ln ${a}`), { code: 'ln', punten: 2, dom: [0.3, 2.5], fouten: [{ e: `(2x+${b})/(x^2+${b}x)`, code: 'lna', msg: `Vergeet ln ${a} in de noemer niet: D(logₐ f) = Df / (f · ln a).` }] }); },
    ];
    return {
        opgave: 'Bereken de afgeleiden en vereenvoudig indien mogelijk.',
        delen: deelPool(r, pool, 2),
        hints: [L`$D f^n = n\cdot f^{n-1}\cdot Df$; $\ln^n f$ betekent $\left(\ln f\right)^n$.`, 'Werk van buiten naar binnen en vermenigvuldig telkens met de afgeleide van het binnenste.'],
        stappen: [L`$D f^n = n\cdot f^{n-1}\cdot Df$`, L`$D\left(e^f\right) = e^f\cdot Df$ en $D(\ln f) = \dfrac{Df}{f}$`, '!Eerst de buitenste functie afleiden, dan vermenigvuldigen met de afgeleide van het binnenste.'],
    };

G('el-vereenvoudig', 'explog', 2, 'Eerst vereenvoudigen met de rekenregels', r => {
    const pool = [
        () => { const n = r.int(2, 6); return { d: afg(`\\ln\\left(x^{${n}}\\right)`, `ln(x^${n})`, `${n}/x`, fr(n, 'x'), { code: 'ln' }), s: L`$\ln\left(x^{${n}}\right) = ${n}\ln x \Rightarrow f'(x) = \dfrac{${n}}{x}$` }; },
        () => { const k = r.nz(-5, 5); return { d: afg(`\\ln\\left(e^{${coefTex(k)}x}\\right)`, `ln(e^(${k}x))`, `${k}`, String(k), { code: 'ln', dom: [-1, 1] }), s: L`$\ln\left(e^{${coefTex(k)}x}\right) = ${coefTex(k)}x \Rightarrow f'(x) = ${k}$` }; },
        () => ({ d: afg(L`\ln\sqrt{x}`, 'ln(sqrt(x))', '1/(2x)', L`\dfrac{1}{2x}`, { code: 'ln', fouten: [{ e: '1/sqrt(x)', code: 'ln', msg: L`$\ln\sqrt{x} = \frac{1}{2}\ln x$, dus de afgeleide is $\frac{1}{2x}$.` }] }), s: L`$\ln\sqrt{x} = \frac{1}{2}\ln x \Rightarrow f'(x) = \dfrac{1}{2x}$` }),
        () => { const a = r.pick([2, 3, 5]); return { d: afg(`e^{\\ln\\left(x^{${a}}\\right)}`, `e^(ln(x^${a}))`, `${a}x^${a - 1}`, `${a}x^{${a - 1}}`, { code: 'exp' }), s: L`$e^{\ln\left(x^{${a}}\right)} = x^{${a}} \Rightarrow f'(x) = ${a}x^{${a - 1}}$` }; },
        () => { const a = r.int(2, 5); return { d: afg(L`\ln\left(\dfrac{x}{x + ${a}}\right)`, `ln(x/(x+${a}))`, `1/x-1/(x+${a})`, L`\dfrac{1}{x} - \dfrac{1}{x + ${a}}`, { code: 'ln', vereenvoudig: true }), s: L`$\ln\left(\dfrac{x}{x + ${a}}\right) = \ln x - \ln\left(x + ${a}\right) \Rightarrow f'(x) = \dfrac{1}{x} - \dfrac{1}{x + ${a}} = \dfrac{${a}}{x\left(x + ${a}\right)}$` }; },
        () => { const k = r.pick([9, 27, 3]); return { d: afg(`\\log_3\\left(${k}x\\right)`, `log_3(${k}x)`, '1/(x*ln(3))', L`\dfrac{1}{x\ln 3}`, { code: 'lna' }), s: L`$\log_3\left(${k}x\right) = \log_3 ${k} + \log_3 x \Rightarrow f'(x) = \dfrac{1}{x\ln 3}$` }; },
        () => { const k = r.int(2, 4); return { d: afg(`\\ln\\left(3^{${k}x^2}\\right)`, `ln(3^(${k}x^2))`, `${2 * k}x*ln(3)`, `${2 * k}x\\ln 3`, { code: 'log', dom: [-1, 1.5] }), s: L`$\ln\left(3^{${k}x^2}\right) = ${k}x^2\ln 3 \Rightarrow f'(x) = ${2 * k}x\ln 3$` }; },
    ];
    const D2 = deelPool(r, pool, 2);
    return {
        opgave: 'Vereenvoudig eerst met de rekenregels van logaritmen en bereken dan de afgeleide.',
        delen: D2.map(x => x.d),
        hints: [L`$\ln(a\cdot b) = \ln a + \ln b$, $\ln\dfrac{a}{b} = \ln a - \ln b$, $\ln a^n = n\ln a$.`, L`$\ln e^x = x$ en $e^{\ln x} = x$.`],
        stappen: [...D2.map(x => x.s), '!Rekenregels eerst toepassen maakt het afleiden veel eenvoudiger.'],
    };

G('el-inpunt', 'explog', 1, 'Afgeleide in een punt (exp en log)', r => {

        () => ({ f: L`\ln\left(x^2 + 1\right)`, a: '1', w: 1, s: L`$f'(x) = \dfrac{2x}{x^2 + 1}$, dus $f'(1) = \dfrac{2}{2} = 1$` }),
