        : { zin: 'Na een injectie daalt de hoeveelheid van een medicijn in het bloed (in mg) volgens', een: 'mg per uur', tijd: 'uren', tijd1: 'uur', wie: 'mg' };
    const kT = nlTex(k, 2);
    const T2 = Math.log(2) / Math.abs(k), dN = N0 * k * Math.exp(k * t1);
    const doel = groei ? 5 : 0.05, Td = Math.log(doel) / k;
    return {
        opgave: L`${ctx.zin} $N(t) = ${N0}\,e^{${kT}t}$, met $t$ de tijd in ${ctx.tijd}.`,
        delen: [
            D.getal(L`Bereken de groeisnelheid op $t = ${t1}$ (in ${ctx.een}, op 1 decimaal).`, dN, { gg: 'rekenwerk', label: `N'(${t1}) =`, code: 'exp', minDec: 1, tol: 0.06, fouten: [{ w: N0 * Math.exp(k * t1), code: 'snelheid', msg: `Dit is N(${t1}), niet de groeisnelheid. Vermenigvuldig nog met de afgeleide van de exponent (${nl(k)}): N′(t) = ${N0} · ${nl(k)} · e^(${nl(k)}t).` }] }),
            D.getal(`Bereken de ${groei ? 'verdubbelingstijd' : 'halveringstijd'} (in ${ctx.tijd}, op 2 decimalen).`, T2, { gg: 'rekenwerk', label: 't =', eenheid: ctx.tijd1, code: 'exp', minDec: 2, fouten: [{ w: Math.LN2 * Math.abs(k), code: 'rekenen', msg: 'Je vermenigvuldigde met k in plaats van te delen.' }] }),
            D.getal(groei ? 'Na hoeveel dagen zijn er vijf keer zoveel gebruikers (op 2 decimalen)?' : 'Na hoeveel uur is er nog maar 5 % van het medicijn over (op 2 decimalen)?', Td, { gg: 'rekenwerk', label: 't =', eenheid: ctx.tijd1, code: 'exp', minDec: 2, fouten: groei ? [] : [{ w: Math.log(0.95) / k, code: 'rekenen', msg: 'Er blijft 5 % over, dus e^(kt) = 0,05 (niet 0,95).' }] }),
        ],
        hints: [L`$N'(t) = ${N0}\cdot ${par(kT)}\, e^{${kT}t}$`, groei ? L`Verdubbelen: $e^{${kT}t} = 2$; neem de ln van beide leden.` : L`Halveren: $e^{${kT}t} = \frac{1}{2}$; neem de ln van beide leden.`, groei ? L`Vijf keer zoveel: $e^{${kT}t} = 5$.` : L`Nog 5 % over: $e^{${kT}t} = 0{,}05$.`],
        stappen: [
            L`$N'(t) = ${N0}\,e^{${kT}t}\cdot ${par(kT)} = ${nlTex(N0 * k, 2)}\,e^{${kT}t}$, dus $N'(${t1}) \approx ${nlTex(dN, 1)}$ ${ctx.een}`,
            groei ? L`$e^{${kT}t} = 2 \iff ${kT}t = \ln 2 \iff t = \dfrac{\ln 2}{${kT}} \approx ${nlTex(T2, 2)}$ dagen` : L`$e^{${kT}t} = \frac{1}{2} \iff ${kT}t = \ln\frac{1}{2} \iff t = \dfrac{\ln \frac{1}{2}}{${kT}} \approx ${nlTex(T2, 2)}$ uur`,
            L`!$e^{${kT}t} = ${nlTex(doel)} \iff t = \dfrac{\ln ${nlTex(doel)}}{${kT}} \approx ${nlTex(Td, 2)}$ ${ctx.tijd}`,
        ],
    };
});

G('et-kapitaal', 'exptoep', 1, 'Bevolkingsgroei', r => {
    const B0 = r.pick([12000, 25000, 40000, 8000]), rr = r.pick([0.012, 0.018, 0.025, 0.03]), n = r.int(3, 8), m = r.int(5, 15);
    const rT = nlTex(rr, 4);
    const Bn = B0 * Math.exp(rr * n), T2 = Math.log(2) / rr, dB = B0 * rr * Math.exp(rr * m);
    return {
        opgave: L`Een gemeente telt nu ${B0} inwoners. Het aantal inwoners na $t$ jaar wordt geschat door $B(t) = ${B0}\,e^{${rT}t}$.`,
        delen: [
            D.getal(`Hoeveel inwoners telt de gemeente na ${n} jaar (afgerond op 1 inwoner)?`, Math.round(Bn), { gg: 'rekenwerk', eenheid: 'inwoners', code: 'rekenen', tol: 1 }),
            D.getal('Na hoeveel jaar is het aantal inwoners verdubbeld (op 2 decimalen)?', T2, { gg: 'rekenwerk', label: 't =', eenheid: 'jaar', code: 'exp', minDec: 2 }),
            D.getal(`Aan welke snelheid groeit de bevolking na ${m} jaar (in inwoners per jaar, op 1 decimaal)?`, dB, { gg: 'rekenwerk', eenheid: 'inwoners/jaar', code: 'exp', minDec: 1, tol: 0.06, fouten: [{ w: B0 * Math.exp(rr * m), code: 'snelheid', msg: `Dit is het aantal inwoners B(${m}). De groeisnelheid is B′(${m}).` }] }),
        ],
        hints: ['Vul t in in het voorschrift.', L`Verdubbelen: $e^{${rT}t} = 2 \iff t = \dfrac{\ln 2}{${rT}}$.`, L`$B'(t) = ${B0}\cdot ${rT}\,e^{${rT}t}$`],
        stappen: [L`$B(${n}) = ${B0}\,e^{${rT}\cdot ${n}} \approx ${Math.round(Bn)}$ inwoners`, L`$e^{${rT}t} = 2 \iff t = \dfrac{\ln 2}{${rT}} \approx ${nlTex(T2, 2)}$ jaar`, L`!$B'(t) = ${nlTex(B0 * rr, 4)}\,e^{${rT}t}$, dus $B'(${m}) \approx ${nlTex(dB, 1)}$ inwoners per jaar`],
    };
});

G('et-griep', 'exptoep', 3, 'Bezoekers van een pretpark (ln-functie)', r => herhaal(() => {
    const A = r.pick([3000, 4000, 4500, 6000]), B = r.pick([100, 150, 200]);
    const ts = A / B - 1;
    if (!Number.isInteger(ts) || ts < 10 || ts > 50) return null;
    const t2 = r.int(ts + 2, Math.min(ts + 15, 60)), s2 = A / (t2 + 1) - B;
    const N = t => A * Math.log(t + 1) - B * t;
    return {
        opgave: L`Een nieuw pretpark opent zijn deuren. Het aantal bezoekers per dag wordt benaderd door $N(t) = ${A}\ln(t + 1) - ${B}t$, met $t$ het aantal dagen na de opening ($0 \le t \le 60$).`,
        delen: [
            D.expr("Bereken $N'(t)$.", `${A}/(t+1)-${B}`, { label: "N'(t) =", vars: ['t'], van: `${A}*ln(t+1)-${B}t`, dom: [0, 20], code: 'ln', juistTex: L`\dfrac{${A}}{t + 1} - ${B}`, fouten: [{ e: `${A}/t-${B}`, code: 'ln', msg: 'D ln(t + 1) = 1/(t + 1), niet 1/t.' }] }),
            D.getal('Na hoeveel dagen is het aantal bezoekers per dag maximaal?', ts, { label: 't =', eenheid: 'dagen', code: 'vraagstuk' }),
            D.getal('Hoeveel bezoekers zijn dat dan (afgerond op 1 bezoeker)?', Math.round(N(ts)), { gg: 'rekenwerk', code: 'fa', tol: 1 }),
            D.getal(`Met welke snelheid verandert het aantal bezoekers op $t = ${t2}$ (bezoekers per dag, op 1 decimaal)?`, s2, { gg: 'rekenwerk', label: `N'(${t2}) =`, code: 'rekenen', minDec: 1, tol: 0.06 }),
        ],
        hints: ["D ln f = Df / f.", "Het maximum: N′(t) = 0, los op naar t.", `Vul t = ${t2} in in N′(t). Een negatief getal betekent dat het aantal bezoekers afneemt.`],
        stappen: [
            L`$N'(t) = ${A}\cdot\dfrac{1}{t + 1} - ${B} = \dfrac{${A}}{t + 1} - ${B}$`,
            L`$N'(t) = 0 \iff \dfrac{${A}}{t + 1} = ${B} \iff t + 1 = ${A / B} \iff t = ${ts}$ (maximum: $N'$ gaat van $+$ naar $-$)`,
            L`$N(${ts}) = ${A}\ln ${ts + 1} - ${B * ts} \approx ${Math.round(N(ts))}$ bezoekers`,
            L`!$N'(${t2}) \approx ${nlTex(s2, 1)}$: het aantal bezoekers ${s2 < 0 ? 'neemt af' : 'neemt toe'} met ongeveer $${nlTex(Math.abs(s2), 1)}$ per dag.`,
        ],
    };
}));

G('go-basis', 'gonio', 1, 'Afgeleiden van sin, cos, tan en cot', r => {

        () => { const n = r.int(2, 5); return afg(`\\cos^{${n}} x`, `cos(x)^${n}`, `-${n}cos(x)^${n - 1}*sin(x)`, `-${n}\\cos^{${n - 1}} x\\,\\sin x`.replace('\\cos^{1}', '\\cos'), { code: 'ketting', dom: [0.2, 1.3], fouten: [{ e: `${n}cos(x)^${n - 1}*sin(x)`, code: 'gonio', msg: 'D(cos x) = −sin x: let op het minteken.' }, { e: `${n}cos(x)^${n - 1}`, code: 'ketting', msg: 'Vergeet niet te vermenigvuldigen met D(cos x) = −sin x.' }] }); },

        () => { const k = r.int(2, 9); return afg(`\\sin(${k}x)`, `sin(${k}x)`, `${k}cos(${k}x)`, `${k}\\cos(${k}x)`, { code: 'ketting', dom: [0.1, 1], fouten: [{ e: `cos(${k}x)`, code: 'ketting', msg: `Vergeet de afgeleide van het binnenste (${k}) niet.` }] }); },
        () => { const n = r.int(2, 4); return afg(`\\cos\\left(x^{${n}}\\right)`, `cos(x^${n})`, `-${n}x^${n - 1}*sin(x^${n})`, `-${n}x^{${n - 1}}\\sin\\left(x^{${n}}\\right)`, { code: 'ketting', dom: [0.2, 1.2], fouten: [{ e: `-sin(x^${n})`, code: 'ketting', msg: L`Vergeet niet te vermenigvuldigen met $D\left(x^{${n}}\right)$.` }] }); },

        () => { const a = r.int(2, 6); return afg(`\\tan(${a}x)`, `tan(${a}x)`, `${a}/cos(${a}x)^2`, fr(a, L`\cos^2(${a}x)`), { code: 'ketting', dom: [0.05, 0.25], fouten: [{ e: `1/cos(${a}x)^2`, code: 'ketting', msg: `Vergeet de factor ${a} (afgeleide van het binnenste).` }] }); },

        stappen: [L`$D\sin x = \cos x$ $\qquad D\cos x = -\sin x$`, L`$D\tan x = \dfrac{1}{\cos^2 x}$ $\qquad D\cot x = -\dfrac{1}{\sin^2 x}$`, '!Bij een samengestelde functie vermenigvuldig je met de afgeleide van het binnenste.'],

G('gv-adem', 'goniov', 2, 'Schommel: periode en afgeleide', r => herhaal(() => {
    const A = r.pick([1.2, 1.5, 2]), k = r.pick([0.4, 0.5, 0.25]), t0 = r.pick([1, 2, 3]);
    const per = 2 / k, perMin = 60 / per, dp = A * k * Math.PI * Math.cos(k * Math.PI * t0);
    if (Math.abs(dp) < 0.2) return null;
    const kT = nlTex(k, 2), AT = nlTex(A, 2);
    return {
        opgave: L`Een kind zit op een schommel. De horizontale afstand (in m) tot de evenwichtsstand is bij benadering $s(t) = ${AT}\sin(${kT}\pi t)$, met $t$ in seconden. Een positieve $s$ betekent dat het kind vóór de evenwichtsstand is.`,
        delen: [
            D.getal('Bereken de periode van deze functie.', per, { label: 'p =', eenheid: 's', code: 'periode' }),
            D.getal('Hoeveel keer schommelt het kind heen en terug per minuut?', perMin, { code: 'periode', fouten: [{ w: per, code: 'periode', msg: `Dat is de periode (${nl(per)} s). Per minuut: 60 gedeeld door de periode.` }] }),
            D.getal(L`Bereken $s'(${t0})$ (op 2 decimalen).`, dp, { gg: 'rekenwerk', label: `s'(${t0}) =`, eenheid: 'm/s', code: 'ketting', minDec: 2, fouten: [{ w: A * k * Math.cos(k * Math.PI * t0), code: 'ketting', msg: `Vergeet π niet: de afgeleide van ${kT}πt is ${kT}π.` }] }),
            D.keuze(`Beweegt het kind op $t = ${t0}$ naar voren of naar achteren?`, [{ t: 'naar achteren ($s$ daalt)', ok: dp < 0, msg: dp < 0 ? '' : `s′(${t0}) > 0: s stijgt, het kind beweegt naar voren.`, code: 'begrip' }, { t: 'naar voren ($s$ stijgt)', ok: dp > 0, msg: dp > 0 ? '' : `s′(${t0}) < 0: s daalt, het kind beweegt naar achteren.`, code: 'begrip' }], { vast: true, janee: true }),
        ],
        hints: [L`Periode: $p = \dfrac{2\pi}{b}$ met $b = ${kT}\pi$.`, `Aantal schommelingen per minuut: 60 / periode.`, L`$s'(t) = ${AT}\cos(${kT}\pi t)\cdot ${kT}\pi$`],
        stappen: [
            L`$p = \dfrac{2\pi}{${kT}\pi} = ${nlTex(per)}$ s, dus $\dfrac{60}{${nlTex(per)}} = ${nlTex(perMin)}$ keer per minuut`,
            L`$s'(t) = ${AT}\cos(${kT}\pi t)\cdot ${kT}\pi = ${nlTex(A * k, 3)}\pi\cos(${kT}\pi t)$`,
            L`!$s'(${t0}) \approx ${nlTex(dp)}$ m/s: ${dp < 0 ? 's daalt, het kind beweegt naar achteren' : 's stijgt, het kind beweegt naar voren'}.`,
        ],
    };
}));

G('gv-extrema', 'goniov', 2, 'Extrema van een goniometrische functie in [0, 2π]', r => {
    const pool = [
        () => ({ f: L`x + \sqrt{2}\sin x`, d1: L`1 + \sqrt{2}\cos x`, v: L`\cos x = -\frac{\sqrt{2}}{2}`, d2: L`-\sqrt{2}\sin x`, ext: [{ x: '3pi/4', t: 'max', s: L`f''\left(\frac{3\pi}{4}\right) = -1 < 0` }, { x: '5pi/4', t: 'min', s: L`f''\left(\frac{5\pi}{4}\right) = 1 > 0` }] }),

        () => ({ f: L`\sin x + \cos x`, d1: L`\cos x - \sin x`, v: L`\tan x = 1`, d2: L`-\sin x - \cos x`, ext: [{ x: 'pi/4', t: 'max', s: L`f''\left(\frac{\pi}{4}\right) = -\sqrt{2} < 0` }, { x: '5pi/4', t: 'min', s: L`f''\left(\frac{5\pi}{4}\right) = \sqrt{2} > 0` }] }),
        () => ({ f: L`x - \sqrt{2}\cos x`, d1: L`1 + \sqrt{2}\sin x`, v: L`\sin x = -\frac{\sqrt{2}}{2}`, d2: L`\sqrt{2}\cos x`, ext: [{ x: '5pi/4', t: 'max', s: L`f''\left(\frac{5\pi}{4}\right) = -1 < 0` }, { x: '7pi/4', t: 'min', s: L`f''\left(\frac{7\pi}{4}\right) = 1 > 0` }] }),

            D.getal('Voor welke $x$ bereikt $f$ een maximum?', mx.x, { label: 'x =', code: 'maxmin', knoppen: [['π', 'π'], ['/', '/']], fouten: [{ w: mn.x, code: 'maxmin', msg: "Daar is f″ > 0 (∪): een minimum." }] }),
            D.getal('Voor welke $x$ bereikt $f$ een minimum?', mn.x, { label: 'x =', code: 'maxmin', knoppen: [['π', 'π'], ['/', '/']], fouten: [{ w: mx.x, code: 'maxmin', msg: "Daar is f″ < 0 (∩): een maximum." }] }),
        ],
        hints: [L`$f'(x) = ${d.d1}$`, L`Los op: $${d.v}$ en kies de oplossingen in $[0, 2\pi]$.`, L`$f''(x) = ${d.d2}$: negatief → maximum, positief → minimum.`],
        stappen: [L`$f'(x) = ${d.d1} = 0 \iff ${d.v}$`, L`In $[0, 2\pi]$: $x = ${d.ext.map(e => waardeVan(e.x).tex).join(L` \text{ of } x = `)}$`, L`$f''(x) = ${d.d2}$`, ...d.ext.map(e => L`$${e.s}$: ${e.t === 'max' ? 'maximum' : 'minimum'}`), L`!Maximum in $x = ${waardeVan(mx.x).tex}$ en minimum in $x = ${waardeVan(mn.x).tex}$.`],
    };

G('gv-getij', 'goniov', 2, 'Temperatuur over een dag: hoe snel wordt het warmer?', r => {
    const A = r.pick([4, 5, 6]), c = r.pick([8, 9, 10]), d = r.pick([12, 15, 18]);

        delen: [
            D.expr("Noteer het voorschrift van $T'(t)$.", `${A}*pi/12*cos(pi/12*(t-${c}))`, { label: "T'(t) =", vars: ['t'], van: `${A}*sin(pi/12*(t-${c}))+${d}`, dom: [0, 20], code: 'ketting', juistTex: L`\frac{${A}\pi}{12}\cos\left(\frac{\pi}{12}\left(t - ${c}\right)\right)`, fouten: [{ e: `${A}*cos(pi/12*(t-${c}))`, code: 'ketting', msg: 'Vergeet de factor π/12 (afgeleide van het binnenste).' }] }),
            D.keuze("Wat betekent $T'(t)$?", [{ t: 'hoe snel de temperatuur verandert (in °C per uur)', ok: true }, { t: 'de temperatuur op tijdstip $t$', msg: 'Dat is T(t).', code: 'begrip' }, { t: 'de gemiddelde temperatuur van de dag', msg: `Dat is d = ${d} °C.`, code: 'begrip' }, { t: 'het verschil tussen de hoogste en de laagste temperatuur', msg: 'Dat is 2a.', code: 'begrip' }]),
            D.getal(`Hoe snel verandert de temperatuur om ${t0} uur (in °C per uur, op 2 decimalen)?`, dT, { gg: 'rekenwerk', label: `T'(${t0}) =`, eenheid: '°C/u', code: 'rekenen', minDec: 2 }),
            D.getal('Hoe groot is de grootste stijgsnelheid van de temperatuur (in °C per uur, op 2 decimalen)?', A * Math.PI / 12, { gg: 'rekenwerk', eenheid: '°C/u', code: 'vraagstuk', minDec: 2, fouten: [{ w: A, code: 'vraagstuk', msg: 'De grootste stijgsnelheid is de maximale waarde van T′(t) = a·b·cos(...): dat is a·π/12.' }] }),
        ],
        hints: [L`$D\sin f = \cos f\cdot Df$ en $D\left(\frac{\pi}{12}(t - ${c})\right) = \frac{\pi}{12}$`, "T′(t) is de veranderingssnelheid van de temperatuur.", "De cosinus is maximaal 1: de grootste waarde van T′ is a · π/12."],
        stappen: [L`$T'(t) = ${A}\cos\left(\frac{\pi}{12}\left(t - ${c}\right)\right)\cdot\frac{\pi}{12}$`, L`$T'(${t0}) \approx ${nlTex(dT)}$ °C per uur`, L`!De temperatuur stijgt het snelst als $\cos(\ldots) = 1$, dus om ${c} uur (buigpunt): $T' = \frac{${A}\pi}{12} \approx ${nlTex(A * Math.PI / 12)}$ °C per uur`],
    };
});

            L`$f'(x) = 0 \iff \sin x = 0 \iff x = 0,\ x = \pi \text{ of } x = 2\pi$`,

const THEORIE = {
    lim: [
        { titel: 'Notatie en linker- en rechterlimiet', html: L`<p>$\lim\limits_{x \to a} f(x)$ is de waarde die $f(x)$ nadert als $x$ naar $a$ nadert.</p>
<ul><li>Linkerlimiet (LL): $\lim\limits_{x \underset{<}{\to} a} f(x)$: $x$ nadert $a$ via waarden kleiner dan $a$.</li>
<li>Rechterlimiet (RL): $\lim\limits_{x \underset{>}{\to} a} f(x)$: $x$ nadert $a$ via waarden groter dan $a$.</li></ul>
<div class="formule-kader">Een limiet naar een getal bestaat pas als de linker- en de rechterlimiet hetzelfde resultaat geven.</div>`, gens: ['lim-grafiek'] },
        { titel: 'Limieten berekenen: eerst invullen', html: L`<ol><li><b>Invullen</b> geeft een getal: dat is de limiet. Bv. $\lim\limits_{x \to 5}(5x - 2) = 23$.</li>
<li><b>$\frac{0}{0}$</b> is een onbepaaldheid: ontbind teller en noemer (merkwaardig product, som-product of Horner) en schrap de gemeenschappelijke factor. Bv. $\lim\limits_{x \to 2}\dfrac{x^2 - 4}{x - 2} = \lim\limits_{x \to 2}\dfrac{(x-2)(x+2)}{x-2} = 4$. De grafiek heeft dan een <b>gat (perforatie)</b>.</li>
<li><b>$\frac{\text{getal}}{0}$</b>: de limiet is $\pm\infty$. Maak een tekentabel van teller en noemer om LL en RL te bepalen. De grafiek heeft dan een <b>verticale asymptoot</b>.</li></ol>`, gens: ['lim-invullen', 'lim-00', 'lim-getalnul', 'lim-horner'] },
        { titel: 'Gedrag op oneindig en asymptoten', html: L`<p>Voor $x \to \pm\infty$ hou je bij een veelterm of rationale functie enkel de <b>hoogstegraadstermen</b> (H.T.) over.</p>
<ul><li>graad teller &gt; graad noemer: $\pm\infty$</li><li>graad teller = graad noemer: quotiënt van de hoogstegraadscoëfficiënten</li><li>graad teller &lt; graad noemer: $0$</li></ul>
<div class="formule-kader">V.A. $x = a$ $\iff \lim\limits_{x \to a} f(x) = \pm\infty$ $\qquad$ H.A. $y = b$ $\iff \lim\limits_{x \to \pm\infty} f(x) = b$</div>
<p>Een exponentiële functie $f(x) = a^x + c$ heeft de H.A. $y = c$.</p>`, gens: ['lim-oneindig', 'lim-asymptoot', 'lim-exp'] },
    ],
    punt: [
        { titel: 'Differentiequotiënt (gemiddelde verandering)', html: L`<div class="formule-kader">$$\dfrac{\Delta f}{\Delta x} = \dfrac{f(b) - f(a)}{b - a}$$</div>
<p>Grafisch is dit de <b>rico van de rechte</b> door de punten $\left(a, f(a)\right)$ en $\left(b, f(b)\right)$.</p>`, gens: ['pt-gemiddeld', 'graf-gemiddeld'] },
        { titel: 'Afgeleide in een punt: limietdefinitie', html: L`<p>De ogenblikkelijke verandering is de limiet van de gemiddelde verandering:</p>
<div class="formule-kader">$$f'(a) = \lim\limits_{\Delta x \to 0} \dfrac{f(a + \Delta x) - f(a)}{\Delta x} \qquad \text{of} \qquad f'(a) = \lim\limits_{x \to a} \dfrac{f(x) - f(a)}{x - a}$$</div>
<p>$f'(a)$ is de <b>rico van de raaklijn</b> (de helling) aan de grafiek in $P\left(a, f(a)\right)$.</p>
<p>Werkwijze met $\Delta x$: vul $a + \Delta x$ in, werk de haakjes uit, trek $f(a)$ af, zet $\Delta x$ voorop, schrap $\Delta x$ en laat dan $\Delta x \to 0$.</p>`, gens: ['pt-delta', 'pt-delta-raaklijn'] },
        { titel: 'Vergelijking van de raaklijn', html: L`<div class="formule-kader">$$t \leftrightarrow y - f(a) = f'(a)\,(x - a)$$</div>
<ol><li>Bereken $f(a)$ (de $y$-coördinaat van het raakpunt).</li><li>Bereken $f'(a)$ (de rico).</li><li>Vul in, werk de haakjes uit en zet $y$ alleen.</li></ol>
<p>Voorbeeld: $f(x) = -x^3 + 2x^2 - 1$ in $x = 2$ met $f'(2) = -4$: $f(2) = -1$, dus $y + 1 = -4(x - 2) \iff y = -4x + 7$.</p>
<p>Evenwijdige rechten hebben dezelfde rico.</p>`, gens: ['pt-raaklijn-gegeven', 'pt-raaklijn', 'pt-rico-punt', 'pt-helling', 'pt-evenwijdig'] },
    ],
    graf: [
        { titel: 'Afgeleide functie en hellingsgrafiek', html: L`<p>De afgeleide functie $f'$ geeft voor elke $x$ de rico van de raaklijn aan de grafiek van $f$. Notaties: $f'(x)$, $Df(x)$, $\dfrac{df}{dx}$, $\dfrac{d}{dx}f(x)$. De grafiek van $f'$ heet de <b>hellingsgrafiek</b>.</p>
<ul><li>$f$ stijgt $\iff f'(x) > 0$ (de hellingsgrafiek ligt boven de $x$-as)</li><li>$f$ daalt $\iff f'(x) < 0$ (de hellingsgrafiek ligt onder de $x$-as)</li><li>horizontale raaklijn $\iff f'(x) = 0$</li></ul>
<p>Een rico aflezen: ga op de raaklijn 1 eenheid naar rechts en tel hoeveel eenheden ze stijgt ($+$) of daalt ($-$).</p>`, gens: ['graf-raaklijn', 'graf-helling', 'graf-koppel'] },
        { titel: 'Tekenverloop van f′ uit de grafiek van f', html: L`<ol><li>Zoek de punten met een horizontale raaklijn: daar is $f'(x) = 0$.</li><li>Kijk op elk interval of $f$ stijgt ($+$) of daalt ($-$).</li></ol>
<p>Let op: bij een <b>horizontaal buigpunt</b> is $f' = 0$ maar wisselt $f'$ niet van teken (bv. $+\ 0\ +$): daar is geen extremum.</p>`, gens: ['graf-teken', 'graf-hr', 'graf-uitspraken'] },
    ],
    regels: [
        { titel: 'Basisfuncties en lineariteit', html: L`<div class="formule-kader">$D(c) = 0 \qquad D(x) = 1 \qquad D\left(x^n\right) = n\,x^{n-1}$</div>
<div class="formule-kader">$\left(a\cdot f \pm b\cdot g\right)' = a\cdot f' \pm b\cdot g'$</div>
<p>Negatieve en gebroken exponenten: schrijf eerst als macht, bv. $\dfrac{5}{x^3} = 5x^{-3} \Rightarrow -15x^{-4} = -\dfrac{15}{x^4}$.</p>`, gens: ['reg-veelterm', 'reg-negexp'] },
        { titel: 'Productregel', html: L`<div class="formule-kader">$$D(f\cdot g) = g\cdot Df + f\cdot Dg$$</div>
<p>De afgeleide van een product is <b>niet</b> het product van de afgeleiden. Voorbeeld: $D\left[(2x^2 - 4x)(x^3 - 3x^2 + 1)\right] = (x^3 - 3x^2 + 1)(4x - 4) + (2x^2 - 4x)(3x^2 - 6x)$ en daarna uitwerken.</p>`, gens: ['reg-product', 'reg-inpunt'] },
        { titel: 'Quotiëntregel', html: L`<div class="formule-kader">$$D\left(\dfrac{f}{g}\right) = \dfrac{g\cdot Df - f\cdot Dg}{g^2}$$</div>
<p>Begin in de teller altijd met de <b>noemer</b> maal de afgeleide van de teller. Zet haakjes rond $f\cdot Dg$ voor je het minteken uitwerkt. Vergeet het kwadraat in de noemer niet.</p>`, gens: ['reg-quotient'] },
        { titel: 'Hogere afgeleiden', html: L`<p>$f''$ is de afgeleide van $f'$, $f'''$ de afgeleide van $f''$, ... Notatie: $f^{(n)}(x)$ of $\dfrac{d^n f}{dx^n}$.</p>`, gens: ['reg-hoger'] },
    ],
    ketting: [
        { titel: 'Samengestelde functies', html: L`<div class="formule-kader">$(f \circ g)(x) = f\left(g(x)\right)$ ("$f$ na $g$")</div>
<p>Eerst $g$ berekenen, dan $f$. Voorbeeld: $f(x) = \sin x$, $g(x) = 3x$: $(f\circ g)(x) = \sin(3x)$ maar $(g \circ f)(x) = 3\sin x$.</p>`, gens: ['ket-samengesteld'] },
        { titel: 'Kettingregel', html: L`<div class="formule-kader">$$(g \circ f)'(x) = g'\left(f(x)\right)\cdot f'(x) \qquad\qquad D f^n = n\cdot f^{n-1}\cdot Df$$</div>
<p>We leiden altijd eerst de buitenste functie af en leiden dan verder af naar binnen toe.</p>
<p>Bij producten en quotiënten van machten: zet daarna de gemeenschappelijke factoren <b>voorop</b> en schrap waar mogelijk, bv. $D\left[(x^2 - 3x)^5(2x + 6)^2\right] = (x^2 - 3x)^4(2x + 6)\left[5(2x - 3)(2x + 6) + 4(x^2 - 3x)\right]$.</p>`, gens: ['ket-macht', 'ket-inpunt', 'ket-product', 'ket-quotmacht', 'ket-quotmachten'] },
        { titel: 'Wortels als machten', html: L`<div class="formule-kader">$\sqrt[n]{x^m} = x^{\frac{m}{n}} \qquad D\left(x^q\right) = q\cdot x^{q-1} \qquad D\sqrt{f} = \dfrac{Df}{2\sqrt{f}}$</div>
<p>Voorbeeld: $D\sqrt{2x^2 + 3x} = \frac{1}{2}\left(2x^2 + 3x\right)^{-\frac{1}{2}}(4x + 3) = \dfrac{4x + 3}{2\sqrt{2x^2 + 3x}}$.</p>`, gens: ['ket-wortel', 'ket-wortelf'] },
    ],
    snel: [
        { titel: 'Snelheid en versnelling', html: L`<ul><li>Gemiddelde snelheid: $v_{gem} = \dfrac{\Delta x}{\Delta t}$ (differentiequotiënt)</li><li>Ogenblikkelijke snelheid: $v(t) = x'(t)$</li><li>Versnelling: $a(t) = v'(t) = x''(t)$</li></ul>
<div class="formule-kader">snelheid is de afgeleide van de positie, versnelling is de afgeleide van de snelheid</div>
<p>Eenheden: positie in m, snelheid in m/s, versnelling in m/s². Van m/s naar km/h: <b>maal 3,6</b>. Bij een vrije val is $a = -9{,}8$ m/s².</p>`, gens: ['snel-raket', 'snel-val', 'snel-positie', 'snel-kabel', 'snel-begrip'] },
    ],
    extrema: [
        { titel: 'Extrema', html: L`<p>Een extremum is een minimum of een maximum. Het grootste of kleinste extremum is een <b>absoluut</b> extremum (de grootste of kleinste functiewaarde in het domein), de andere zijn <b>relatief</b>.</p>`, gens: [] },
        { titel: 'Stijgen en dalen met de tekentabel van f′', html: L`<div class="formule-kader">$f'(x) > 0$ op een interval $\Rightarrow$ $f$ stijgt $\qquad f'(x) < 0 \Rightarrow f$ daalt</div>
<ol><li>Bereken $f'(x)$ en los $f'(x) = 0$ op (factor voorop, som en product, discriminant of Horner).</li><li>Maak een tekentabel van $f'$.</li><li>$+\ 0\ -$: maximum; $-\ 0\ +$: minimum. Bij een dubbele nulwaarde wisselt het teken niet: geen extremum, wel een horizontale raaklijn (H.R.).</li><li>Bereken de $y$-waarde met het voorschrift van $f$.</li></ol>
<p>Voorbeeld: $f(x) = 3x^4 + 4x^3 - 2$, $f'(x) = 12x^2(x + 1)$: abs. min $-3$ in $x = -1$, in $x = 0$ een H.R. (geen extremum).</p>`, gens: ['ext-derde', 'ext-vierde', 'ext-drie', 'ext-tabel', 'ext-rationaal', 'ext-param'] },
    ],
    problemen: [
        { titel: 'Stappenplan voor extremumproblemen', html: L`<ol><li>Kies de nodige veranderlijken $x, y, z, \ldots$ en vertaal de gegevens naar wiskunde.</li><li>Vraag je af WAT maximaal of minimaal moet zijn. Noem dat $f$.</li><li>Schrijf alle veranderlijken zoveel mogelijk in functie van $x$.</li><li>Stel het voorschrift van $f(x)$ op.</li><li>Onderzoek het stijgen en dalen van $f$ met $f'$.</li><li>Formuleer je antwoord (antwoordzin!). Hou rekening met het praktisch domein.</li></ol>
<p>Voorbeeld: drie getallen, het tweede dubbel zo groot als het eerste, som $45$, product maximaal: $f(x) = x\cdot 2x\cdot(45 - 3x)$ geeft $10$, $20$ en $15$ met product $3000$.</p>`, gens: ['prob-getallen', 'prob-weide', 'prob-doos', 'prob-draad', 'prob-afstand', 'prob-stadion'] },
        { titel: 'Kosten, opbrengst en winst', html: L`<p>Winst $=$ opbrengst $-$ kosten: $W(x) = p\cdot x - K(x)$.</p><p>$K'(a)$ is de rico van de raaklijn: bij een productie van $a$ eenheden stijgen de kosten met ongeveer $K'(a)$ per extra eenheid.</p>`, gens: ['prob-winst', 'prob-gegeven'] },
    ],

function maakOefening(g, seed) {
    const r = new Rnd(seed);
    const o = g.maak(r);
    if (!o || !Array.isArray(o.delen) || !o.delen.length) throw new Error('geen deelvragen');
    o.gen = g; o.seed = seed;
    o.hints = o.hints || []; o.stappen = o.stappen || [];
    const sr = new Rnd(seed ^ 0x5bd1e995);
    o.delen.forEach((d, i) => {
        d.letter = o.delen.length > 1 ? 'abcdefgh'[i] : '';
        if (!TYPES[d.type]) throw new Error('onbekend type ' + d.type);
        if (d.type === 'keuze' && !d.vast) d.opties = sr.schud(d.opties);
    });
    o.punten = o.delen.reduce((s, d) => s + d.punten, 0);
    return o;
}

// ===================== TOETS =====================
function gewogenKeuze(r, lijst, gewicht) {
    const w = lijst.map(gewicht), som = w.reduce((a, b) => a + b, 0);
    let x = r.r() * som;
    for (let i = 0; i < lijst.length; i++) { x -= w[i]; if (x <= 0) return lijst[i]; }
    return lijst[lijst.length - 1];
}
function kiesToets(cats, totaal, niveau, seed) {
    const r = new Rnd(seed);
    const vragen = [], gebruikt = new Set(), perCat = {};
    let rest = totaal;
    const GEWICHT = { 1: 0.3, 2: 0.45, 3: 0.25 };
    for (let poging = 0; rest > 0.25 && poging < 3000; poging++) {
        let pool = GEN.filter(g => cats.includes(g.cat) && !gebruikt.has(g.id));
        if (niveau) { const p = pool.filter(g => g.niveau === niveau); if (p.length) pool = p; else pool = []; }
        if (!pool.length) { if (gebruikt.size) { gebruikt.clear(); continue; } break; }
        if (cats.length > 1) { const min = Math.min(...cats.map(c => perCat[c] || 0)); const p = pool.filter(g => (perCat[g.cat] || 0) === min); if (p.length) pool = p; }
        const g = gewogenKeuze(r, pool, x => niveau ? 1 : GEWICHT[x.niveau] / pool.filter(y => y.niveau === x.niveau).length);
        let o;
        try { o = maakOefening(g, r.int(1, 2147483646)); } catch (e) { gebruikt.add(g.id); continue; }
        if (o.punten > rest + 0.5 && vragen.length) { gebruikt.add(g.id); continue; }
        vragen.push(o); rest -= o.punten; gebruikt.add(g.id);
        perCat[g.cat] = (perCat[g.cat] || 0) + 1;
    }
    // volgorde zoals in de cursus, binnen een hoofdstuk van eenvoudig naar moeilijk
    const volg = id => CATS.findIndex(c => c.id === id);
    vragen.sort((a, b) => volg(a.gen.cat) - volg(b.gen.cat) || a.gen.niveau - b.gen.niveau);
    return vragen;
}
function startToets() {
    const cats = catsVan(ST.toetsCat);
    const vragen = kiesToets(cats, ST.toetsPunten, ST.toetsNiveau, nieuwZaad());
    if (!vragen.length) { alert('Er zijn geen oefeningen gevonden voor deze keuze.'); return; }
    const totaal = vragen.reduce((s, v) => s + v.punten, 0);
    ST.toets = { vragen, waarden: vragen.map(v => v.delen.map(() => ({}))), huidig: 0, cat: ST.toetsCat, totaal, niveau: ST.toetsNiveau, start: new Date(), klaar: false, toonUitw: true };
    ST.scherm = 'toets';
    render();
    window.scrollTo({ top: 0 });
}
function bewaarToetsWaarden() {
    const t = ST.toets;
    if (!t || t.klaar) return;
    APP.querySelectorAll('[data-deel]').forEach(el => { t.waarden[t.huidig][+el.dataset.deel] = leesDeel(el); });
}
function renderToets() {
    const t = ST.toets, i = t.huidig, v = t.vragen[i], n = t.vragen.length;
    let s = `<div class="kaart"><div class="balk toets"><button class="terug" data-act="stoptoets">✕ Stoppen</button><h2>Toets · ${esc(catNaam(t.cat))} · op ${fmtPt(t.totaal)}</h2><span class="teller">Vraag ${i + 1} van ${n}</span></div>
        <div class="voortgang"><div style="width:${Math.round((i + 1) / n * 100)}%"></div></div><div class="kaart-binnen">`;
    s += opgaveHtml(v);
    v.delen.forEach((d, di) => { s += deelHtml(d, di, { waarden: t.waarden[i][di] }); });
    s += `<div class="actie-rij"><button class="knop knop-licht" data-act="vorige" ${i === 0 ? 'disabled' : ''}>← Vorige</button><button class="knop knop-donker" data-act="volgendevraag" ${i === n - 1 ? 'disabled' : ''}>Volgende →</button><button class="knop knop-rood" data-act="inleveren">Inleveren</button></div>`;
    s += `<div class="toets-nav">${t.vragen.map((q, qi) => `<button data-act="gaNaar" data-i="${qi}" class="${qi === i ? 'huidig' : ''} ${t.waarden[qi].some(w => !isLeeg(w)) ? 'ingevuld' : ''}" title="vraag ${qi + 1}">${qi + 1}</button>`).join('')}</div>`;
    s += typhulpHtml() + '</div></div>';
    APP.innerHTML = s;
    vernieuwAllePreviews();

function nakijkenToets() {
    const t = ST.toets;
    t.res = t.vragen.map((v, qi) => v.delen.map((d, di) => {
        const w = t.waarden[qi][di] || {};
        if (isLeeg(w)) return { ok: false, score: 0, msg: 'Niet beantwoord.', leeg: true, code: 'leeg' };
        const r = controleer(d, w);
        if (r.leesfout) return { ok: false, score: 0, msg: 'Je antwoord kon niet gelezen worden: ' + r.msg, lees: true, code: 'onbekend' };
        return { ...r, score: r.ok ? d.punten : Math.min(d.punten, r.score || 0) };

    t.behaald = t.res.flat().reduce((s, x) => s + x.score, 0);

    {

        const max = Number(t.totaal) || 0;
        portaalLogToets(max ? 100 * t.behaald / max : 0, (t.einde - t.start) / 1000, String(t.cat), { punten: max, behaald: Math.round(t.behaald * 10) / 10, niv: t.niveau, vragen: t.vragen.length, fouten });
    }

    render();

}
function antwoordHtml(d, w) {

// ---------- algemene feedback van de leerkracht bovenaan een rapport ----------
function leerkrachtSamenvatting(p, foutCodes, zwakkeCats, soort = 'toets') {
    const vn = voornaam(), aan = vn ? ', ' + esc(vn) : '';
    let opening;
    if (soort === 'oefen') opening = p >= 0.8 ? `Heel goed geoefend${aan}! De meeste oefeningen lukten je meteen.` : p >= 0.5 ? `Goed bezig${aan}. Je oefent flink door; kijk vooral naar de punten hieronder.` : `Goed dat je oefent${aan}! Neem rustig de tijd voor de uitwerkingen en de theorie: zo komt het zeker in orde.`;
    else if (p >= 0.9) opening = `Schitterend${aan}! Je beheerst deze leerstof heel goed. Zo ben je klaar voor het examen.`;
    else if (p >= 0.75) opening = `Heel goed gewerkt${aan}! Je kent de leerstof, op enkele kleine fouten na.`;
    else if (p >= 0.6) opening = `Goed bezig${aan}. De basis zit er, maar er zijn nog een paar dingen die beter kunnen.`;
    else if (p >= 0.45) opening = `Bijna voldoende${aan}. Met wat gerichte oefening kom je er zeker.`;
    else opening = `Dit loopt nog niet goed${aan}. Geen paniek: herhaal de theorie en oefen eerst op niveau eenvoudig, met de hints en de uitwerkingen erbij.`;
    const telling = {};
    foutCodes.filter(c => c && c !== 'onbekend').forEach(c => { telling[c] = (telling[c] || 0) + 1; });
    const lijst = Object.entries(telling).sort((a, b) => b[1] - a[1]);
    const foutLijst = lijst.length ? '<p>Dit ging er vooral mis:</p><ul class="lk-lijst">' + lijst.slice(0, 5).map(([c, k]) => `<li>${k}× ${esc(foutSoort(c).label)}</li>`).join('') + '</ul>' : '';
    const advies = lijst.filter(([c]) => c !== 'leeg').slice(0, 3).map(([c]) => foutSoort(c).tip);
    if (lijst.some(([c]) => c === 'leeg')) advies.push(FOUT.leeg.tip);
    const slot = zwakkeCats.length ? `<p>Oefen nog eens in de oefenzone: <b>${zwakkeCats.map(c => esc(CAT[c].naam)).join(', ')}</b>.</p>` : (p >= 0.9 && soort === 'toets' ? '<p>Klaar voor meer? Probeer eens een toets op niveau uitdagend of een gemengde toets over alles.</p>' : '');
    return `<div class="leerkracht lk-groot ${p >= 0.6 ? 'goed' : ''}"><div class="lk-kop">✍ Feedback van je leerkracht</div><p>${opening}</p>${foutLijst}${advies.length ? '<p>Mijn advies:</p><ul class="lk-lijst">' + advies.map(t => `<li>${esc(t)}</li>`).join('') + '</ul>' : ''}${slot}</div>`;
}
// rapport als een lijst blokken: dezelfde blokken op het scherm en in de PDF
function vraagBlokken(v, nr, delen, opt = {}) {
    const B = [];
    const sc = delen.reduce((s, x) => s + (x.res ? x.res.score : 0), 0);
    const cls = opt.cls || (sc >= v.punten - 1e-9 ? 'juist' : sc <= 0 ? 'fout' : 'deels');
    const stempel = opt.stempel || `${fmtPt(sc)} / ${fmtPt(v.punten)}`;
    B.push({ vast: true, html: `<div class="vk eerste ${cls}"><div class="vraag-kop"><h3>${nr} · ${esc(v.gen.titel)} <span class="label n${v.gen.niveau}">${NIVEAU[v.gen.niveau]}</span></h3><span class="stempel">${stempel}</span></div><div class="klein grijs">${esc(CAT[v.gen.cat].naam)}</div><div class="opgave-tekst">${wis(v.opgave)}</div></div>` });
    delen.forEach(({ d, w, res }) => {
        let fb = '';
        if (res && res.ok && res.msg && res.msg !== 'Juist!') fb = `<div class="fb">✔ ${wis(res.msg)}</div>`;
        else if (res && !res.ok && res.leeg) fb = `<div class="fb">✖ Niet beantwoord.</div>`;
        else if (res && !res.ok && res.msg) fb = leerkrachtMini(res, d, { kop: 'Feedback van je leerkracht' });
        B.push({ html: `<div class="vk ${cls}"><div class="antw-deel"><div class="klein">${d.letter ? `<b>${d.letter})</b> ` : ''}${wis(d.vraag)} ${ggLabel(d.gg)} <span class="grijs">(${fmtPt(res ? res.score : 0)}/${fmtPt(d.punten)} pt)</span></div><div class="antw-grid"><div><div class="tit">Jouw antwoord</div>${antwoordHtml(d, w)}</div><div><div class="tit">Juist antwoord</div>${juistHtml(d)}</div></div>${fb}</div></div>` });
    });
    const st = v.stappen.map(String);
    for (let i = 0; i < st.length; i += 4) {
        const stuk = { stappen: st.slice(i, i + 4) };
        B.push({ uitw: true, html: `<div class="vk vk-uitw ${cls} ${i + 4 >= st.length ? 'laatste' : ''}">${i === 0 ? '<div class="tit">Uitwerking</div>' : ''}${stappenHtml(stuk)}</div>` });
    }

}
function scoreKlasse(p) { return p >= 0.7 ? 'goed' : p >= 0.5 ? 'matig' : 'zwak'; }
function toetsBlokken() {

    const zwak = Object.entries(per).filter(([, x]) => x.b / x.m < 0.6).sort((a, b) => a[1].b / a[1].m - b[1].b / b[1].m).map(([c]) => c);
    const codes = t.res.flat().filter(x => !x.ok).map(x => x.code);

    B.push({ html: leerkrachtSamenvatting(p, codes, zwak) });

    t.vragen.forEach((v, qi) => B.push(...vraagBlokken(v, `Vraag ${qi + 1}`, v.delen.map((d, di) => ({ d, w: t.waarden[qi][di], res: t.res[qi][di] })))));

// ===================== PDF (rechtstreeks downloaden, zonder printer) =====================
const PDF_BREEDTE_PX = 700, PDF_BREEDTE_MM = 186, PDF_MARGE_MM = 12, PDF_NUTTIG_MM = 268;
async function downloadPdf(blokken, bestandsnaam) {
    const status = document.getElementById('pdf-status');
    const knoppen = [...APP.querySelectorAll('[data-act="toetsrapport"],[data-act="oefenrapport"]')];
    const zet = t => { if (status) status.textContent = t; };
    if (!window.html2canvas || !window.jspdf) { zet('Het PDF-rapport kan niet gemaakt worden: de PDF-bibliotheek is niet geladen. Controleer je internetverbinding en herlaad de pagina.'); return; }
    knoppen.forEach(k => { k.disabled = true; });
    const bron = document.getElementById('pdf-bron');
    try {
        zet('Rapport wordt gemaakt…');
        bron.className = 'pdf-bron rapport';
        bron.innerHTML = blokken.map((b, i) => `<div class="u" data-i="${i}">${b.html}</div>`).join('');
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        const eenheden = [...bron.children];
        const hoogtes = eenheden.map(u => u.getBoundingClientRect().height);
        const maxPx = Math.floor(PDF_NUTTIG_MM * PDF_BREEDTE_PX / PDF_BREEDTE_MM);
        // blokken die bij het volgende horen samenhouden
        const brokken = [];
        let huidig = [];
        eenheden.forEach((u, i) => { huidig.push(i); if (!blokken[i].vast) { brokken.push(huidig); huidig = []; } });
        if (huidig.length) brokken.push(huidig);
        const paginas = [];
        let pagina = [], h = 0;
        brokken.forEach(b => {
            const bh = b.reduce((s, i) => s + hoogtes[i], 0);
            if (pagina.length && h + bh > maxPx) { paginas.push(pagina); pagina = []; h = 0; }
            pagina.push(...b); h += bh;
        });
        if (pagina.length) paginas.push(pagina);
        const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
        for (let p = 0; p < paginas.length; p++) {
            zet(`Rapport wordt gemaakt… (pagina ${p + 1} van ${paginas.length})`);
            const pg = document.createElement('div');
            pg.className = 'pdf-pagina rapport';
            paginas[p].forEach(i => pg.appendChild(eenheden[i].cloneNode(true)));
            document.body.appendChild(pg);
            let canvas;
            try {
                canvas = await window.html2canvas(pg, { scale: 2, backgroundColor: '#ffffff', logging: false, x: 0, y: 0, scrollX: 0, scrollY: 0, ignoreElements: n => n.parentNode === document.body && n !== pg });
            } finally { document.body.removeChild(pg); }
            let b = PDF_BREEDTE_MM, hh = canvas.height / canvas.width * b;
            if (hh > PDF_NUTTIG_MM) { b *= PDF_NUTTIG_MM / hh; hh = PDF_NUTTIG_MM; }
            if (p > 0) pdf.addPage();
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', PDF_MARGE_MM, PDF_MARGE_MM, b, hh);
            pdf.setFontSize(8); pdf.setTextColor(113, 128, 150);
            pdf.text(`Pagina ${p + 1} van ${paginas.length}`, 105, 290, { align: 'center' });
            pdf.text('© T. Gaerdelen', 198, 290, { align: 'right' });
            if (leerlingCode()) pdf.text(leerlingCode(), 12, 290);
        }
        pdf.save(bestandsnaam);
        zet('Het rapport is gedownload (kijk bij je downloads).');
    } catch (e) {
        console.error(e);
        zet('Het rapport kon niet gemaakt worden. Probeer het opnieuw (controleer je internetverbinding).');
    } finally {
        bron.innerHTML = '';
        knoppen.forEach(k => { k.disabled = false; });
    }
}

        case 'uitwerking': bewaarOefenWaarden(); ST.oefen.uitwerking = !ST.oefen.uitwerking; render(); if (ST.oefen.uitwerking) { const u = APP.querySelector('.uitwerking'); if (u) u.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } break;
        case 'voorbeeld': bewaarOefenWaarden(); { const o = ST.oefen; o.voorbeeld = o.voorbeeld ? null : maakVoorbeeld(o.inst.gen); render(); const v = APP.querySelector('.voorbeeld-vak'); if (v) v.scrollIntoView({ behavior: 'smooth', block: 'start' }); } break;
        case 'theorie-van': bewaarOefenWaarden(); ST.terugNaarOefen = true; ST.theorieCat = b.dataset.cat; ST.tvb = null; ST.scherm = 'theorie'; render(); window.scrollTo({ top: 0 }); break;
        case 'volgende': {
            const o = ST.oefen;
            if (o.inst && !o.klaar && (o.pogingen || o.uitwerking || o.hints)) logOefening('f');
            nieuweOefening(); break;
        }
        case 'ins': {
            const deel = b.closest('.deel');
            let inp = laatsteVeld && deel.contains(laatsteVeld) && !laatsteVeld.disabled ? laatsteVeld : deel.querySelector('input.invoer:not([disabled])');
            if (!inp) break;
            const t = b.dataset.t, a = inp.selectionStart ?? inp.value.length, z = inp.selectionEnd ?? inp.value.length;
            inp.value = inp.value.slice(0, a) + t + inp.value.slice(z);
            inp.focus(); inp.setSelectionRange(a + t.length, a + t.length);
            inp.dispatchEvent(new Event('input', { bubbles: true }));
            break;
        }
        case 'oefenrapport': if (!ST.log.length) { const s = document.getElementById('pdf-status'); if (s) s.textContent = 'Er zijn nog geen afgewerkte oefeningen om in het rapport te zetten. Controleer eerst een oefening.'; break; } downloadPdf(oefenBlokken(), bestandsNaam('Oefenrapport')); break;
        case 'toetsrapport': downloadPdf(toetsBlokken(), bestandsNaam('Toets')); break;
        case 'vorige': bewaarToetsWaarden(); ST.toets.huidig--; render(); window.scrollTo({ top: 0 }); break;
        case 'volgendevraag': bewaarToetsWaarden(); ST.toets.huidig++; render(); window.scrollTo({ top: 0 }); break;
        case 'gaNaar': bewaarToetsWaarden(); ST.toets.huidig = +b.dataset.i; render(); window.scrollTo({ top: 0 }); break;
        case 'inleveren': {
            bewaarToetsWaarden();
            const t = ST.toets;
            const leeg = t.vragen.reduce((s, v, qi) => s + v.delen.filter((d, di) => isLeeg(t.waarden[qi][di])).length, 0);
            if (leeg && !window.confirm(`Je hebt nog ${leeg} deelvra${leeg === 1 ? 'ag' : 'gen'} niet ingevuld. Wil je toch inleveren?`)) break;
            nakijkenToets(); break;
        }
        case 'stoptoets': if (window.confirm('Wil je de toets stoppen? Je antwoorden gaan verloren.')) { ST.scherm = 'menu'; ST.toets = null; render(); } break;
        case 'opnieuwtoets': ST.scherm = 'menu'; ST.modus = 'toets'; render(); window.scrollTo({ top: 0 }); break;
        case 'tvoorbeeld': {
            e.preventDefault();
            const g = GEN.find(x => x.id === b.dataset.id);
            const inst = maakVoorbeeld(g);
            if (!inst) break;
            ST.tvb = { b: +b.dataset.b, inst };
            renderTheorie();
            const v = APP.querySelector('.voorbeeld-vak'); if (v) v.scrollIntoView({ behavior: 'smooth', block: 'start' });
            break;
        }
        case 'tvoorbeeld-opnieuw': { const inst = maakVoorbeeld(ST.tvb.inst.gen); if (inst) ST.tvb.inst = inst; renderTheorie(); const v = APP.querySelector('.voorbeeld-vak'); if (v) v.scrollIntoView({ block: 'start' }); break; }
        case 'spring': { e.preventDefault(); const el = document.getElementById('tb' + b.dataset.b); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
        case 'oefen-cat':
            if (ST.terugNaarOefen && ST.oefen && ST.oefen.inst && catsVan(ST.oefen.cat).includes(b.dataset.cat)) { ST.terugNaarOefen = false; ST.scherm = 'oefen'; render(); window.scrollTo({ top: 0 }); break; }
            ST.terugNaarOefen = false; startOefen(b.dataset.cat); break;
        case 'oefen-gen': { const g = GEN.find(x => x.id === b.dataset.id); ST.terugNaarOefen = false; startOefen(g.cat, g.id); break; }
    }
});
window.addEventListener('beforeunload', e => { if (ST.scherm === 'toets' && ST.toets && !ST.toets.klaar) { e.preventDefault(); e.returnValue = ''; } });
render();

</script>
<script>
// =====================================================================
// 10. ZELFTEST (in de console: AFG.zelftest())
//  - elke generator maakt veel oefeningen zonder fouten
//  - alle formules worden zonder LaTeX-fouten getoond
//  - het juiste antwoord wordt goedgekeurd, een fout antwoord afgekeurd
//  - de afgeleide in de sleutel is echt de afgeleide van de opgave
// =====================================================================
const AFG = (() => {
    function texStukken(s) {
        const uit = [];
        String(s ?? '').split('$$').forEach((deel, i) => { if (i % 2) uit.push(deel); else deel.split('$').forEach((d, j) => { if (j % 2) uit.push(d); }); });
        return uit;
    }
    function checkTex(t, waar, fouten) {
        if (!window.katex) return;
        try { katex.renderToString(String(t), { throwOnError: true, strict: 'ignore' }); }
        catch (e) { fouten.push(`${waar}: LaTeX-fout ${e.message.slice(0, 120)} in «${String(t).slice(0, 120)}»`); }
    }
    function checkTekst(s, waar, fouten) {
        if (/NaN|undefined|Infinity|\[object/.test(String(s))) fouten.push(`${waar}: verdachte tekst «${String(s).slice(0, 140)}»`);
        texStukken(s).forEach(t => checkTex(t, waar, fouten));
        const n = String(s).split('$$').map((x, i) => i % 2 ? '' : x).join('').split('$').length - 1;
        if (n % 2) fouten.push(`${waar}: oneven aantal $ in «${String(s).slice(0, 100)}»`);
    }
    function foutInvoer(d) {
        switch (d.type) {
            case 'getal': return { g: `(${d.juistTxt})+1.37` };
            case 'lim': return d.juist.k === 'num' ? { g: `(${d.juist.txt})+1.37` } : { g: d.juist.k === 'pinf' ? '-inf' : '+inf' };
            case 'lijst': return d.juist.length > 1 ? { g: d.juist.slice(1).map(j => j.txt).join(' ; ') } : { g: `(${d.juist[0].txt})+1.37` };
            case 'punt': return { x: `(${d.juist[0].txt})+1.37`, y: d.juist[1].txt };
            case 'rechte': return { v: `y = ${d.txt} + 1.37` };
            case 'keuze': return { k: String(d.opties.findIndex(o => !o.ok)) };
            case 'expr': return { e: `(${d.juist})+1.37*${d.vars[0]}` };
        }
        return {};
    }
    function afgeleideKlopt(d) {
        if (!d.van) return true;
        const v = d.vars[0], F = Expr.ontleed(d.van, d.vars), J = Expr.ontleed(d.juist, d.vars);
        let ok = 0;
        for (const x of testPunten(d.dom, 9)) {
            const h = 1e-5 * Math.max(1, Math.abs(x));
            const a = Expr.waarde(F, { [v]: x + h }), b = Expr.waarde(F, { [v]: x - h }), j = Expr.waarde(J, { [v]: x });
            if (![a, b, j].every(Number.isFinite)) continue;
            const num = (a - b) / (2 * h);
            if (Math.abs(num - j) > 1e-4 * (1 + Math.abs(j))) return false;
            ok++;
        }
        return ok >= 4;
    }
    function zelftest(n = 30, filter = null) {
        const fouten = [], tel = {};
        for (const g of GEN) {
            if (filter && !g.id.includes(filter)) continue;
            tel[g.id] = 0;
            for (let s = 1; s <= n; s++) {
                const waar = `${g.id} #${s}`;
                let o;
                try { o = maakOefening(g, hashTekst(g.id) ^ (s * 7919)); }
                catch (e) { fouten.push(`${waar}: maak faalt: ${e.message}`); continue; }
                tel[g.id]++;
                checkTekst(o.opgave, waar + ' opgave', fouten);
                o.hints.forEach((h, i) => checkTekst(h, `${waar} hint ${i + 1}`, fouten));
                o.stappen.forEach((h, i) => checkTekst(String(h).replace(/^[!>]/, ''), `${waar} stap ${i + 1}`, fouten));
                o.delen.forEach((d, i) => {
                    const w = `${waar} deel ${d.letter || i + 1}`;
                    checkTekst(d.vraag, w + ' vraag', fouten);
                    if (d.type === 'keuze') { d.opties.forEach((op, j) => checkTekst(op.t, `${w} optie ${j + 1}`, fouten)); if (d.opties.filter(op => op.ok).length !== 1) fouten.push(`${w}: ${d.opties.filter(op => op.ok).length} juiste opties`); }
                    else checkTex(TYPES[d.type].juist(d), w + ' sleutel', fouten);
                    if (!(d.punten > 0)) fouten.push(`${w}: geen punten`);
                    let r;
                    try { r = TYPES[d.type].controleer(d, TYPES[d.type].invoer(d)); } catch (e) { r = { ok: false, msg: 'fout: ' + e.message }; }
                    if (!r.ok) fouten.push(`${w}: juiste antwoord afgekeurd (${r.msg}) · ${JSON.stringify(TYPES[d.type].invoer(d)).slice(0, 120)}`);
                    try { const t = TYPES[d.type].toon ? TYPES[d.type].toon(d, TYPES[d.type].invoer(d)) : null; if (t) checkTex(t, w + ' toon', fouten); } catch (e) { fouten.push(`${w}: toon faalt ${e.message}`); }
                    let rf;
                    try { rf = TYPES[d.type].controleer(d, foutInvoer(d)); } catch (e) { rf = { ok: false }; }
                    if (rf.ok) fouten.push(`${w}: fout antwoord goedgekeurd · ${JSON.stringify(foutInvoer(d)).slice(0, 120)}`);
                    if (d.type === 'expr') { try { if (!afgeleideKlopt(d)) fouten.push(`${w}: sleutel ${d.juist} is niet de afgeleide van ${d.van}`); } catch (e) { fouten.push(`${w}: afgeleide-controle faalt ${e.message}`); } }
                    (d.fouten || []).forEach(f => { if (f.code && !FOUT[f.code]) fouten.push(`${w}: onbekende foutcode ${f.code}`); });
                    if (d.code && !FOUT[d.code]) fouten.push(`${w}: onbekende foutcode ${d.code}`);
                });
            }
        }
        const uniek = [...new Set(fouten)];
        console.log(`Zelftest: ${GEN.length} generatoren, ${Object.values(tel).reduce((a, b) => a + b, 0)} oefeningen, ${uniek.length} problemen.`);
        return { generatoren: GEN.length, tel, fouten: uniek };
    }
    return { zelftest, GEN, TYPES, maakOefening, kiesToets, Expr, ST };
})();

</script>
