<style>

  .kaart { background:#fff; border:1px solid var(--rand); border-radius:16px; box-shadow:0 4px 18px rgba(15,23,42,.06); padding:18px 20px; margin-bottom:16px; }
  .kaart.h1 { border-top:6px solid var(--h1); } .kaart.h2 { border-top:6px solid var(--h2); } .kaart.h3 { border-top:6px solid var(--h3); } .kaart.ex { border-top:6px solid var(--ex); }

  /* verklaren */

  .naam-app { position:fixed; right:12px; bottom:8px; font-size:11px; color:#94a3b8; pointer-events:none; }

  .advies { background:#eff6ff; border:1px solid #bfdbfe; border-radius:12px; padding:10px 14px; }
  .katex { white-space: nowrap; } /* een formule nooit over twee regels */
  .tabelwrap { overflow-x:auto; max-width:100%; }
  body { padding-bottom: 40px; overflow-x: hidden; }
  @media (max-width: 640px) { body { padding:10px 10px 40px; } .match { grid-template-columns: 1fr 1fr; gap:8px; } h1 { font-size:1.45rem; } .kaart { padding:14px; }
    .mitem { font-size:.8rem; padding:6px 4px; overflow-x:auto; } .mitem svg { width:100%; height:auto; }
    table.schema td { min-width:28px; padding:2px 3px; } .cel { min-width:30px; } table.schema input.veld { width:2.8em; } .vraag { font-size:1rem; } }

<!-- PORTAAL-KOPPELING (zelfde blok in elke app): terug naar het portaal en de leerlingcode.
     De apps vragen of bewaren geen naam; enkel de anonieme code van het portaal wordt getoond. -->
<style>
    .portaal-terug { display: inline-block; margin: 0 0 12px; padding: 6px 14px; border: 1px solid #cbd5e1; border-radius: 999px; background: #fff; color: #475569; font: 600 .85rem system-ui, -apple-system, 'Segoe UI', sans-serif; text-decoration: none; }
    .portaal-terug:hover { background: #f1f5f9; color: #1e293b; }
    .portaal-terug-rij { text-align: left; }
    .leerling-code { position: fixed; left: 14px; bottom: 10px; font: 11px system-ui, -apple-system, 'Segoe UI', sans-serif; color: #94a3b8; background: rgba(255,255,255,.85); padding: 2px 8px; border-radius: 6px; pointer-events: none; z-index: 50; }
    @media print { .portaal-terug-rij, .leerling-code { display: none !important; } }
</style>
<script>
    // Anonieme leerlingcode en klas, zoals ingesteld in het portaal (index.html)
    function leerlingCode() {
        try { return (localStorage.getItem('wisk_leerling_code') || '').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '').slice(0, 20); } catch (e) { return ''; }
    }
    function portaalKlas() {
        try { const k = (localStorage.getItem('wisk_leerling_klas') || '').trim(); return k === 'alle klassen' ? '' : k.replace(/[^\p{L}\p{N} _-]/gu, '').slice(0, 20); } catch (e) { return ''; }
    }
    // Resultaten doorgeven aan het dashboard (via tracker.js). Bewaart nooit wat de leerling intypte:
    // enkel welke oefening, juist of fout, en de soort fout.
    function portaalLogOpgave(juist, module, fout, details) {
        try { if (window.WiskundeTracker) WiskundeTracker.logOpgave({ isCorrect: !!juist, moduleId: module, foutCategorie: fout || null, details: details || {} }); } catch (e) { /* loggen mag de app nooit storen */ }
    }
    function portaalLogToets(procent, duur, module, details) {
        try { if (window.WiskundeTracker) WiskundeTracker.logToets({ scoreProcent: procent, duurSeconden: duur || 0, moduleId: module, details: details || {} }); } catch (e) { /* loggen mag de app nooit storen */ }
    }
    window.addEventListener('DOMContentLoaded', () => {
        const code = leerlingCode();
        if (!code || window.WiskundeTracker) return; // de tracker toont de code al zelf
        const el = document.createElement('div');
        el.className = 'leerling-code';
        el.setAttribute('data-html2canvas-ignore', '');
        el.textContent = code;
        document.body.appendChild(el);
    });
</script>

<script>
'use strict';
/* =====================================================================
   Reële functies (5du, semester 1): actief leren voor het kerstexamen.
   Werkvormen: sorteren, koppelen, stappen ordenen, fout zoeken, kijk & verklaar,
   schuifregelaars, tabellen aanklikken en invullen. Elke oefening wordt telkens
   opnieuw gemaakt met andere getallen (nooit de getallen van het examen).
   Id's van leerdoelen (DOELEN) en oefeningen (GEN) nooit hernoemen: het dashboard
   koppelt de logs eraan. Nieuwe id's mogen erbij.
   ===================================================================== */
const APP_ID = '5du_reele_functies_sem1';

/* ---------------- hulpfuncties ---------------- */
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const kies = arr => arr[Math.floor(Math.random() * arr.length)];
const schud = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rndNZ = (a, b) => { let x; do { x = rnd(a, b); } while (x === 0); return x; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function M(t) { try { return katex.renderToString(t, { throwOnError: false }); } catch (e) { return esc(t); } }
function MD(t) { try { return katex.renderToString(t, { throwOnError: false, displayMode: true }); } catch (e) { return esc(t); } }
const nul = x => Math.abs(x) < 1e-9 ? 0 : x;

function breuk(x) { for (let q = 1; q <= 12; q++) { const p = Math.round(x * q); if (Math.abs(p / q - x) < 1e-9) return [p, q]; } return null; }
// getal als TeX: decimale komma
function G(x) { x = nul(x); if (x === Infinity) return '+\\infty'; if (x === -Infinity) return '-\\infty';
  const s = String(Math.round(x * 1e6) / 1e6); return s.replace('.', '{,}'); }
// getal als TeX: breuk waar dat kan (½, ⅓ ...)
function F(x) { x = nul(x); const b = breuk(x); if (b && b[1] !== 1) return (b[0] < 0 ? '-' : '') + '\\frac{' + Math.abs(b[0]) + '}{' + b[1] + '}'; return G(x); }
function haak(x, fmt = G) { return x < 0 ? '(' + fmt(x) + ')' : fmt(x); }
function term(c, v, eerste, fmt) { if (Math.abs(c) < 1e-12) return ''; const neg = c < 0, ab = Math.abs(c);
  const cs = (v && Math.abs(ab - 1) < 1e-12) ? '' : fmt(ab); const s = cs + v; return eerste ? (neg ? '-' : '') + s : (neg ? ' - ' : ' + ') + s; }
function pol(a, b, c, fmt = G) { let s = '', eerste = true; for (const [k, v] of [[a, 'x^2'], [b, 'x'], [c, '']]) { const t = term(k, v, eerste, fmt); if (t) { s += t; eerste = false; } } return s || '0'; }
function pk(a, p, k, fmt = F) { let s = Math.abs(a - 1) < 1e-12 ? '' : Math.abs(a + 1) < 1e-12 ? '-' : fmt(a);
  s += p === 0 ? 'x^2' : '(x ' + (p > 0 ? '- ' : '+ ') + fmt(Math.abs(p)) + ')^2'; if (k) s += (k > 0 ? ' + ' : ' - ') + fmt(Math.abs(k)); return s; }
function xmin(p) { return p === 0 ? 'x' : '(x ' + (p > 0 ? '- ' : '+ ') + G(Math.abs(p)) + ')'; }

// invoer lezen: komma of punt, breuken (1/2), wortels (√3, 2√5), oneindig (∞, oo, inf)
function leesGetal(s) {
  if (s === null || s === undefined) return NaN;
  s = String(s).trim().replace(/\s+/g, '').replace(/[−–]/g, '-').replace(/,/g, '.').replace(/^\+/, '');
  if (s === '') return NaN;
  if (/^-?(∞|oo|inf|oneindig)$/i.test(s)) return s.startsWith('-') ? -Infinity : Infinity;
  let m = s.match(/^(-?)(\d*\.?\d*)?(?:√|v|sqrt)\(?(\d+(?:\.\d+)?)\)?$/i);
  if (m && (m[2] === undefined || m[2] === '' || !isNaN(parseFloat(m[2])))) { const f = (m[2] === undefined || m[2] === '') ? 1 : parseFloat(m[2]); return (m[1] ? -1 : 1) * f * Math.sqrt(parseFloat(m[3])); }
  m = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/); if (m) { const d = parseFloat(m[2]); return d ? parseFloat(m[1]) / d : NaN; }
  if (/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return parseFloat(s);
  return NaN;
}
// een getal zoals een leerling het zou intypen (voor het tonen van de oplossing)
function invoerTekst(x) { if (Number.isInteger(x)) return String(x); const b = breuk(x); if (b && b[1] <= 4) return b[0] + '/' + b[1];
  const k = Math.round(x * x * 1e6) / 1e6; if (Number.isInteger(k)) return (x < 0 ? '-' : '') + '√' + k; return String(Math.round(x * 1e4) / 1e4).replace('.', ','); }
const gelijk = (x, y) => x === y || (isFinite(x) && isFinite(y) && Math.abs(x - y) < 1e-6);

// getallen van het examen en het voorbeeldexamen nooit gebruiken (standaardvorm a, b, c, ook ×(−1))
const VERBODEN = [[2,4,-6],[-1,2,8],[0.5,-3,5],[5,0,-20],[3,0,12],[-2,10,0],[2,-16,14],[1,-6,9],[2,1,-3],[1,2,5],[-0.5,2,1],[3,12,7],[-1,8,-17],[0.5,-1,0.5],[-1,3,5],[1,2,-3],[0.5,-3,4],
  [-1,4,5],[1/3,-2,2],[1,4,-5],[2,0,-32],[3,-12,0],[3,6,-24],[1,-3,-10],[2,1,3],[-0.5,2,2.5],[1,-4,7]];
function verboden(a, b, c) { return VERBODEN.some(v => (gelijk(v[0], a) && gelijk(v[1], b) && gelijk(v[2], c)) || (gelijk(v[0], -a) && gelijk(v[1], -b) && gelijk(v[2], -c))); }

/* ---------------- grafieken (SVG) ----------------
   Rooster met getallen langs de assen, kromme op de voorgrond en tot de rand van het rooster
   (behalve bij een gegeven domein), geen dikke punten. */
function grafiek(o) {
  const W = o.w || 300, x0 = o.xmin, x1 = o.xmax, y0 = o.ymin, y1 = o.ymax;
  const sx = W / (x1 - x0), sy = o.h ? o.h / (y1 - y0) : sx, H = (y1 - y0) * sy;
  const X = x => (x - x0) * sx, Y = y => (y1 - y) * sy;
  const id = 'k' + Math.random().toString(36).slice(2, 9);
  const lst = o.lstap || ((x1 - x0) > 14 ? 2 : 1), lsty = o.lstapy || ((y1 - y0) > 14 ? 2 : 1);
  let s = `<svg viewBox="-16 -14 ${W + 32} ${H + 30}" width="${W + 32}" height="${H + 30}" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, Arial" font-size="${o.fs || 11}">`;
  s += `<defs><clipPath id="${id}"><rect x="0" y="0" width="${W}" height="${H}"/></clipPath>
        <marker id="${id}p" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1e293b"/></marker></defs>`;
  if (o.rooster !== false) {
    for (let x = Math.ceil(x0); x <= x1 + 1e-9; x++) s += `<line x1="${X(x)}" y1="0" x2="${X(x)}" y2="${H}" stroke="#e2e8f0" stroke-width="1"/>`;
    for (let y = Math.ceil(y0); y <= y1 + 1e-9; y++) s += `<line x1="0" y1="${Y(y)}" x2="${W}" y2="${Y(y)}" stroke="#e2e8f0" stroke-width="1"/>`;
  }
  const ax = (y0 <= 0 && y1 >= 0) ? Y(0) : null, ay = (x0 <= 0 && x1 >= 0) ? X(0) : null;
  if (ax !== null) s += `<line x1="0" y1="${ax}" x2="${W + 8}" y2="${ax}" stroke="#1e293b" stroke-width="1.3" marker-end="url(#${id}p)"/><text x="${W + 10}" y="${ax + 4}" font-style="italic">x</text>`;
  if (ay !== null) s += `<line x1="${ay}" y1="${H}" x2="${ay}" y2="-8" stroke="#1e293b" stroke-width="1.3" marker-end="url(#${id}p)"/><text x="${ay + 6}" y="-4" font-style="italic">y</text>`;
  if (o.getallen !== false) {
    const halo = 'stroke="#fff" stroke-width="3" paint-order="stroke"';
    if (ax !== null) for (let x = Math.ceil(x0 / lst) * lst; x <= x1 - 0.5; x += lst) { if (x === 0 || x <= x0) continue; s += `<line x1="${X(x)}" y1="${ax - 3}" x2="${X(x)}" y2="${ax + 3}" stroke="#1e293b"/><text x="${X(x)}" y="${ax + 14}" text-anchor="middle" ${halo}>${x < 0 ? '−' + (-x) : x}</text>`; }
    if (ay !== null) for (let y = Math.ceil(y0 / lsty) * lsty; y <= y1 - 0.5; y += lsty) { if (y === 0 || y <= y0) continue; s += `<line x1="${ay - 3}" y1="${Y(y)}" x2="${ay + 3}" y2="${Y(y)}" stroke="#1e293b"/><text x="${ay - 6}" y="${Y(y) + 4}" text-anchor="end" ${halo}>${y < 0 ? '−' + (-y) : y}</text>`; }
  }
  s += `<g clip-path="url(#${id})">`;
  (o.lijnen || []).forEach(l => { s += `<line x1="${X(l.x1)}" y1="${Y(l.y1)}" x2="${X(l.x2)}" y2="${Y(l.y2)}" stroke="${l.kleur || '#be123c'}" stroke-width="${l.dikte || 1.6}" ${l.stippel ? 'stroke-dasharray="6 4"' : ''}/>`; });
  (o.krommen || []).forEach(k => {
    const a = k.van !== undefined ? k.van : x0 - 0.5, b = k.tot !== undefined ? k.tot : x1 + 0.5, n = k.n || 260; let d = '';
    for (let i = 0; i <= n; i++) { const x = a + (b - a) * i / n; let y = k.f(x); if (!isFinite(y)) continue; y = Math.max(y0 - 50, Math.min(y1 + 50, y)); d += (d ? ' L' : 'M') + X(x).toFixed(2) + ',' + Y(y).toFixed(2); }
    s += `<path d="${d}" fill="none" stroke="${k.kleur || '#1e5aaa'}" stroke-width="${k.dikte || 2.6}" ${k.stippel ? 'stroke-dasharray="7 5"' : ''} stroke-linecap="round" stroke-linejoin="round"/>`;
  });
  (o.param || []).forEach(k => { let d = ''; const n = k.n || 260;
    for (let i = 0; i <= n; i++) { const t = k.t0 + (k.t1 - k.t0) * i / n; d += (d ? ' L' : 'M') + X(k.x(t)).toFixed(2) + ',' + Y(k.y(t)).toFixed(2); }
    s += `<path d="${d}" fill="none" stroke="${k.kleur || '#1e5aaa'}" stroke-width="${k.dikte || 2.6}" stroke-linecap="round"/>`; });
  s += `</g>`;
  (o.teksten || []).forEach(t => { s += `<text x="${X(t.x)}" y="${Y(t.y)}" text-anchor="${t.anker || 'middle'}" fill="${t.kleur || '#1e293b'}" font-size="${t.fs || 12}" stroke="#fff" stroke-width="3" paint-order="stroke">${t.t}</text>`; });
  return s + '</svg>';
}
// gladde kromme door knopen: in elke knoop een top (waarde precies de knoopwaarde)
function knoopFunctie(kn) {
  return x => {
    if (x <= kn[0][0]) return kn[0][1];
    for (let i = 0; i < kn.length - 1; i++) { const [xa, ya] = kn[i], [xb, yb] = kn[i + 1];
      if (x <= xb) { const t = (x - xa) / (xb - xa); return ya + (yb - ya) * (1 - Math.cos(Math.PI * t)) / 2; } }
    return kn[kn.length - 1][1];
  };
}
// kleine schets van een parabool zonder getallen (voor tekentabellen en koppelen)
function schetsParabool(a, k, w = 120) {
  return grafiek({ xmin: -3, xmax: 3, ymin: -3, ymax: 3, w, rooster: false, getallen: false, krommen: [{ f: x => a * (0.7 * x * x) + k, kleur: '#c85f14' }] });
}

/* ---------------- tabellen (statisch) ---------------- */
function statTeken(xs, tekens) {
  let r1 = '<td class="kop">x</td>', r2 = '<td class="kop">f(x)</td>';
  tekens.forEach((t, i) => { const punt = i % 2 === 1; r1 += `<td>${punt ? M(xs[(i - 1) / 2]) : ''}</td>`; r2 += `<td style="color:var(--opl);font-weight:700">${t}</td>`; });
  if (tekens.length === 1) { r1 += ''; }
  return `<table class="schema statisch"><tr class="r1">${r1}</tr><tr>${r2}</tr></table>`;
}

gen('db_lees', 'Domein en bereik aflezen', () => {

    const kn = knopenVerloop().slice(0, rnd(3, 4)); const n = kn.length, x = kn[n - 1][0];
    if (x > 6) continue;
    const soort = kies(['eindig', 'eindig', 'rechts', 'links']);
    const kn2 = kn.slice(); let domL = '[', domA = kn[0][0], domB = x, domR = ']';
    // naar oneindig: de grafiek keert in de laatste (eerste) knoop en loopt dan het rooster uit
    if (soort === 'rechts') { const op = kn[n - 1][1] > kn[n - 2][1] ? -1 : 1; kn2.push([x + 4, op * 14]); domB = Infinity; domR = '['; }
    if (soort === 'links') { const op = kn[0][1] > kn[1][1] ? -1 : 1; kn2.unshift([kn[0][0] - 4, op * 14]); domA = -Infinity; domL = ']'; }
    const ys = kn.map(k => k[1]); let berA = Math.min(...ys), berB = Math.max(...ys), berL = '[', berR = ']';
    if (soort === 'rechts') { if (kn2[kn2.length - 1][1] > 0) { berB = Infinity; berR = '['; } else { berA = -Infinity; berL = ']'; } }
    if (soort === 'links') { if (kn2[0][1] > 0) { berB = Infinity; berR = '['; } else { berA = -Infinity; berL = ']'; } }
    const f = knoopFunctie(kn2);
    const fig = grafiek({ xmin: -6, xmax: 7, ymin: -4, ymax: 5, w: 330, krommen: [{ f, van: soort === 'links' ? -7 : kn[0][0], tot: soort === 'rechts' ? 8 : x, kleur: '#38873c' }] });
    return { vorm: 'invul', werkvorm: 'Aflezen en noteren', vraag: 'Lees het domein en het bereik af. Loopt de grafiek tot de rand van het rooster, dan loopt ze verder.', figuur: fig,
      regels: [`${M('\\text{dom}\\, f =')} {0}`, `${M('\\text{ber}\\, f =')} {1}`],

/* ---------- H1: tekentabel ---------- */
function veeltermMetNulwaarden() {
  for (let poging = 0; poging < 100; poging++) {
    const soort = kies(['drie', 'drie', 'raak', 'twee']);
    let rts, mult;
    if (soort === 'drie') { rts = schud([-4, -3, -2, -1, 0, 1, 2, 3, 4]).slice(0, 3).sort((a, b) => a - b); mult = [1, 1, 1]; }
    else if (soort === 'raak') { rts = schud([-3, -2, -1, 0, 1, 2, 3]).slice(0, 2).sort((a, b) => a - b); mult = Math.random() < 0.5 ? [2, 1] : [1, 2]; }
    else { rts = schud([-4, -3, -2, -1, 1, 2, 3, 4]).slice(0, 2).sort((a, b) => a - b); mult = [1, 1]; }
    if (rts[rts.length - 1] - rts[0] < 3 || rts.some((r, i) => i > 0 && r - rts[i - 1] < 2)) continue;
    const g = x => rts.reduce((p, r, i) => p * Math.pow(x - r, mult[i]), 1);

function knopenVerloop() {
  // afwisselend stijgen en dalen, waarden tussen −3 en 4, telkens minstens 2 verschil
  for (;;) {
    const n = rnd(4, 5); let x = rnd(-5, -3), y = rnd(-2, 1); const kn = [[x, y]]; let op = Math.random() < 0.5 ? 1 : -1, ok = true;
    for (let i = 1; i < n; i++) { x += rnd(2, 3); const kandidaten = []; for (let v = -3; v <= 4; v++) if (op > 0 ? v >= y + 2 : v <= y - 2) kandidaten.push(v);
      if (!kandidaten.length) { ok = false; break; } y = kies(kandidaten); kn.push([x, y]); op = -op; }
    if (ok) return kn;
  }
}

  return { vorm: 'tabel', werkvorm: 'Tabel invullen', vraag: 'Vul het verloopschema in: de functiewaarden, de pijlen en MAX of MIN onder elke top. (Aan de randen van het domein hoeft er niets onder.)',

    uitleg: 'Bij een top waar de grafiek eerst stijgt en dan daalt hoort MAX; eerst dalen en dan stijgen: MIN.' };

/* ---------- H2: naar de standaardvorm ---------- */
function stdStappen(a, p, k) {
  const A = 'x', B = Math.abs(p), tm = p > 0 ? '-' : '+';
  const b = -2 * a * p, c = a * p * p + k;
  return { b, c, regels: [
    `f(x) = ${pk(a, p, k)}`,
    `= ${G(a)}(x^2 ${tm} 2\\cdot x\\cdot ${B} + ${B}^2) ${k < 0 ? '-' : '+'} ${Math.abs(k)}`,
    `= ${G(a)}(x^2 ${tm} ${2 * B}x + ${B * B}) ${k < 0 ? '-' : '+'} ${Math.abs(k)}`,
    `= ${pol(a, b, a * p * p)} ${k < 0 ? '-' : '+'} ${Math.abs(k)}`,
    `= ${pol(a, b, c)}`] };
}
function pkStd() { let a, p, k, s; do { a = kies([2, 3, -2, -3]); p = rndNZ(-4, 4); k = rndNZ(-6, 6); s = stdStappen(a, p, k); } while (verboden(a, s.b, s.c)); return { a, p, k, ...s }; }
