// vlakkenwaaier λ·E1 + σ·E2 = 0 door een gegeven punt B
function waaier(naam, v1, v2, B, puntNaam = 'B') {
    const w1 = vdot(v1.n, B).plus(v1.t), w2 = vdot(v2.n, B).plus(v2.t);
    zeker(!(w1.nul && w2.nul), 'punt ligt op de rechte');
    const g = Fr.of(ggd(w1.n * w2.d, w2.n * w1.d) || 1);
    let lam = w2.door(g), sig = w1.neg().door(g);
    if (lam.n < 0 || (lam.nul && sig.n < 0)) { lam = lam.neg(); sig = sig.neg(); }
    const n = vplus(vmaal(v1.n, lam), vmaal(v2.n, sig)), t = v1.t.maal(lam).plus(v2.t.maal(sig));
    const E1 = lin(v1.n, XYZ, v1.t), E2 = lin(v2.n, XYZ, v2.t);
    const st = [L`Vlakkenwaaier door de rechte: $${naam} \leftrightarrow \lambda\left(${E1}\right) + \sigma\left(${E2}\right) = 0 \quad \lambda, \sigma \in \mathbb{R}$`,
        L`$${puntNaam}${TX.co(B)} \in ${naam} \;\Leftrightarrow\; \lambda\left(${invulTex(v1.n, v1.t, B)}\right) + \sigma\left(${invulTex(v2.n, v2.t, B)}\right) = 0 \;\Leftrightarrow\; ${lin([w1, w2], [L`\lambda`, L`\sigma`])} = 0$`,
        L`Stel $\lambda = ${lam.tex()}$ en $\sigma = ${sig.tex()}$:`,
        L`>$${naam} \leftrightarrow ${somTermen([[lam, haak(E1)], [sig, haak(E2)]])} = 0$`,
        L`>$\Leftrightarrow\; ${TX.vlakVgl(n, t)}$`];
    const p = vlakPrim(n, t);
    if (!vgelijk(p.n, n)) st.push(L`>$\Leftrightarrow\; ${TX.vlakVgl(p.n, p.t)}$` + uitlegFactor(n, p.n));
    zeker(opVlak(B, p), 'waaier: punt');
    return { st, vl: p };
}

        if (!nietCollineair(Q, Rp, S)) continue;
        const QR = vmin(Rp, Q), QS = vmin(S, Q);
        if (QR.some(x => Math.abs(x.n) > 6) || QS.some(x => Math.abs(x.n) > 6)) continue;
        let P = vplus(vplus(Q, vmaal(QR, r.int(-1, 2))), vmaal(QS, r.int(-1, 2)));
        const copl = r.bool();
        if (!copl) P = P.map((x, i) => i === r.int(0, 2) ? x.plus(r.nz(-2, 2)) : x);
        const u = UW.det('QRS', Q, QR, QS);
        const w = vdot(u.n, P).plus(u.t);
        if (copl !== w.nul) continue;
        return {
            opgave: L`Gegeven: $${TX.pt('P', P)}$, $${TX.pt('Q', Q)}$, $${TX.pt('R', Rp)}$ en $${TX.pt('S', S)}$.`,
            delen: [D.janee('Zijn de vier punten coplanair (liggen ze in één vlak)?', copl, '', '')],
            hints: [L`Stel een vergelijking op van het vlak $QRS$.`, L`Gebruik $\vec Q$ als steunvector en $\overrightarrow{QR}${TX.co(QR)}$, $\overrightarrow{QS}${TX.co(QS)}$ als richtingsvectoren.`, L`Ga na of $P$ aan die vergelijking voldoet.`],
            stappen: [L`Vlak $QRS$: steunvector $\vec Q${TX.co(Q)}$, richtingsvectoren $\overrightarrow{QR}${TX.co(QR)}$ en $\overrightarrow{QS}${TX.co(QS)}$`, ...u.st.slice(1),
                L`Ligt $P$ in $QRS$? $\;${invulTex(u.n, u.t, P)} = ${w.tex()}$ ${w.nul ? '' : L`\neq 0`}`, copl ? '!Ja, $P$ ligt in het vlak $QRS$: de vier punten zijn coplanair.' : '!Nee, $P$ ligt niet in het vlak $QRS$: de punten zijn niet coplanair.'],
        };
    }
} });

regGen({ id: 'vl_k', cat: 'vlak', niveau: 1, titel: 'Ligt een punt in een vlak?', maak(r) {

            stappen: [L`$O(0,0,0)$ invullen: $${invulTex(N, t, V(0, 0, 0))} ${t.nul ? '=' : '\\neq'} 0$`, t.nul ? L`!Ja, $O \in ${n}$ (er is geen constante term).` : L`!Nee, $O \notin ${n}$.`],

    P = r.vec(-4, 4);

        delen: [D.janee(L`Ligt $P$ in $${n}$?`, w.nul, '', '')],
        hints: [L`Vul de coördinaat van $P$ in in de vergelijking van $${n}$.`],

    };
} });

<!-- =====================================================================
     6. OEFENINGEN — onderlinge ligging en loodrechte stand
     ===================================================================== -->
<script>
const rangnr = i => ['eerste', 'tweede', 'derde'][i];
// stelsel P_a + r·R_a = P_b + s·R_b oplossen (twee vergelijkingen) en controleren in de derde
function stelselRechten(Pa, Ra, Pb, Rb, na, nb, pa = 'r', pb = 's') {
    const rijen = [0, 1, 2].map(i => `${linCF(Pa[i], [[Ra[i], pa]])} = ${linCF(Pb[i], [[Rb[i], pb]])}`);
    let paar = null;
    for (const [i, j] of [[0, 1], [0, 2], [1, 2]]) {
        const det = Ra[i].maal(Rb[j].neg()).min(Rb[i].neg().maal(Ra[j]));
        if (!det.nul) { paar = [i, j, det]; break; }
    }
    zeker(paar, 'stelsel rechten: evenwijdig');
    const [i, j, det] = paar, k = 3 - i - j;
    const ci = Pb[i].min(Pa[i]), cj = Pb[j].min(Pa[j]);
    const rv = ci.maal(Rb[j].neg()).min(Rb[i].neg().maal(cj)).door(det);
    const sv = Ra[i].maal(cj).min(ci.maal(Ra[j])).door(det);
    const links = Pa[k].plus(Ra[k].maal(rv)), rechts = Pb[k].plus(Rb[k].maal(sv));
    const klopt = links.gelijk(rechts);
    const st = [L`Los het stelsel $\vec{P_{${na}}} + ${pa}\,${TX.rv(na)} = \vec{P_{${nb}}} + ${pb}\,${TX.rv(nb)}$ op: $\;${TX.stelsel(rijen)}$`,
        L`>Uit de ${rangnr(i)} en de ${rangnr(j)} vergelijking volgt $${pa} = ${rv.tex()}$ en $${pb} = ${sv.tex()}$ (of met het GRM: rref).`,
        L`>Controle in de ${rangnr(k)} vergelijking: $${links.tex()} ${klopt ? '=' : '\\neq'} ${rechts.tex()}$` + (klopt ? ' (klopt)' : ' (vals)')];
    return { st, klopt, r: rv, s: sv, S: vplus(Pa, vmaal(Ra, rv)) };
}
// ligt Q op de rechte P + par·R?
function puntOpRechteSt(Q, qNaam, P, R, par, rNaam) {
    const rijen = [0, 1, 2].map(i => `${Q[i].tex()} = ${linCF(P[i], [[R[i], par]])}`);
    const opl = [0, 1, 2].map(i => R[i].nul ? `${Q[i].tex()} ${Q[i].gelijk(P[i]) ? '=' : '\\neq'} ${P[i].tex()}` : `${par} = ${Q[i].min(P[i]).door(R[i]).tex()}`);
    const op = visNul(vmin(Q, P)) || vpar(vmin(Q, P), R);
    return { st: [L`Ligt $${qNaam}${TX.co(Q)}$ op $${rNaam}$? $\;${TX.stelsel(rijen)} \;\Leftrightarrow\; ${TX.stelsel(opl)}$`, op ? L`>Telkens dezelfde waarde: $${qNaam} \in ${rNaam}$.` : L`>Geen gemeenschappelijke oplossing: $${qNaam} \notin ${rNaam}$.`], op };
}
const LIG_RECHTEN = ['samenvallend', 'strikt evenwijdig', 'snijdend', 'kruisend'];

// ===================== ONDERLINGE LIGGING =====================
regGen({ id: 'li_ev_AB_CD', cat: 'ligging', niveau: 1, titel: 'Zijn twee rechten AB en CD evenwijdig?', maak(r) {
    const A = r.vec(-5, 5), R = r.richting(-4, 4, 1);
    const B = vplus(A, vmaal(R, r.pick([1, 2, -1])));
    const C = r.vec(-5, 5);
    const ja = r.bool();
    let CD = vmaal(R, r.pick([2, -2, 3, -1, -3]));
    if (!ja) { const i = r.int(0, 2); CD = CD.map((x, j) => j === i ? x.plus(r.nz(-2, 2)) : x); if (visNul(CD)) CD = V(1, 1, 1); }
    const Dp = vplus(C, CD), AB = vmin(B, A);
    const ev = vpar(AB, CD);
    const kf = ev ? CD[[0, 1, 2].find(i => !AB[i].nul)].door(AB[[0, 1, 2].find(i => !AB[i].nul)]) : null;
    return {
        opgave: L`Gegeven: $${TX.pt('A', A)}$, $${TX.pt('B', B)}$, $${TX.pt('C', C)}$ en $${TX.pt('D', Dp)}$.`,
        delen: [D.janee(L`Zijn de vectoren $\overrightarrow{AB}$ en $\overrightarrow{CD}$ (en dus de rechten $AB$ en $CD$) evenwijdig?`, ev, '', '')],
        hints: [L`Bereken $co(\overrightarrow{AB})$ en $co(\overrightarrow{CD})$.`, L`Evenwijdige rechten hebben evenredige richtingsgetallen: $\overrightarrow{CD} = k\cdot\overrightarrow{AB}$ voor één getal $k$.`],
        stappen: [L`$\overrightarrow{AB}${TX.co(AB)}$ en $\overrightarrow{CD}${TX.co(CD)}$`, ev ? L`!$\overrightarrow{CD} = ${kf.tex()}\,\overrightarrow{AB}$, dus $AB \parallel CD$.` : L`!Er bestaat geen $k \in \mathbb{R}$ met $\overrightarrow{CD} = k\,\overrightarrow{AB}$ (de verhoudingen van de coördinaten zijn niet gelijk), dus $AB \nparallel CD$.`],
    };
} });

function genLiggingRechten(niveau) {
    return function (r) {
        for (;;) {
            const soort = r.pick(['samenvallend', 'strikt', 'strikt', 'snijdend', 'snijdend', 'snijdend', 'kruisend', 'kruisend', 'kruisend']);
            const Ra = r.richting(-4, 4, 1);
            let Pa, Pb, Rb;
            if (soort === 'samenvallend' || soort === 'strikt') {
                Rb = vmaal(Ra, r.pick([1, -1, 2, -2]));
                Pa = r.vec(-4, 4); Pb = vplus(Pa, vmaal(Ra, r.nz(-2, 2)));
                if (soort === 'strikt') { const w = r.vecNZ(-2, 2); if (vpar(w, Ra)) continue; Pb = vplus(Pb, w); }
            } else {
                Rb = r.richting(-4, 4, 1);
                if (vpar(Ra, Rb)) continue;
                const S = r.vec(-4, 4);
                Pa = vplus(S, vmaal(Ra, r.int(-2, 2))); Pb = vplus(S, vmaal(Rb, r.int(-2, 2)));
                if (soort === 'kruisend') { Pb = vplus(Pb, r.vecNZ(-2, 2)); if (det3(vmin(Pb, Pa), Ra, Rb).nul) continue; }
            }
            if ([...Pa, ...Pb].some(x => Math.abs(x.n) > 9)) continue;
            const vormen = niveau === 3 ? r.shuffle(['stelsel', r.pick(['param', 'cart'])]) : [r.pick(['param', 'cart']), r.pick(['param', 'cart'])];
            const ta = rechteTekst('a', Pa, Ra, vormen[0], r, 'r'), tb = rechteTekst('b', Pb, Rb, vormen[1], r, 's');
            const la = leesRechteUit('a', ta, Pa, Ra, 'r'), lb = leesRechteUit('b', tb, Pb, Rb, 's');
            const par = vpar(la.R, lb.R);
            const st = [...la.st, ...lb.st];
            let juist, S = null, ptOp = false, opl = false;
            if (par) {
                st.push(L`$${TX.rv('a')}$ en $${TX.rv('b')}$ zijn veelvouden: $a \parallel b$ of $a = b$. Samenvallend of strikt evenwijdig?`);
                const q = puntOpRechteSt(la.P, L`\vec{P_a}`, lb.P, lb.R, 's', 'b');
                st.push(...q.st);
                ptOp = q.op;
                juist = ptOp ? 0 : 1;
            } else {
                st.push(L`$${TX.rv('a')}$ en $${TX.rv('b')}$ zijn geen veelvouden: $a$ en $b$ zijn snijdend of kruisend.`);
                const q = stelselRechten(la.P, la.R, lb.P, lb.R, 'a', 'b');
                st.push(...q.st);
                opl = q.klopt;
                if (opl) { S = q.S; st.push(L`Snijpunt: vul $r = ${q.r.tex()}$ in in de vergelijking van $a$: $${TX.pt('S', S)}$`); }
                juist = opl ? 2 : 3;
            }
            const verwacht = { samenvallend: 0, strikt: 1, snijdend: 2, kruisend: 3 }[soort];
            zeker(juist === verwacht, 'ligging rechten ' + soort);
            st.push(L`!De rechten $a$ en $b$ zijn ${LIG_RECHTEN[juist]}` + (S ? L` en snijden elkaar in $${TX.pt('S', S)}$.` : '.'));
            const parMsg = 'De richtingsvectoren zijn veelvouden van elkaar: de rechten zijn evenwijdig of samenvallend.';
            const nietPar = 'De richtingsvectoren zijn geen veelvouden van elkaar: de rechten zijn niet evenwijdig en vallen niet samen.';
            const opties = [
                { t: 'samenvallend', uitleg: !par ? nietPar : (ptOp ? 'Veelvouden én een punt van $a$ ligt op $b$.' : 'De richtingsvectoren zijn wel veelvouden, maar het steunpunt van $a$ ligt niet op $b$.') },
                { t: 'strikt evenwijdig', uitleg: !par ? nietPar : (ptOp ? 'Het steunpunt van $a$ ligt ook op $b$: de rechten vallen samen.' : 'Veelvouden, en het steunpunt van $a$ ligt niet op $b$.') },
                { t: 'snijdend', uitleg: par ? parMsg : (opl ? 'Geen veelvouden en het stelsel heeft juist één oplossing.' : 'Het stelsel heeft geen oplossing (de controle in de derde vergelijking is vals): er is geen snijpunt.') },
                { t: 'kruisend', uitleg: par ? parMsg : (opl ? 'Het stelsel heeft een oplossing: de rechten snijden elkaar.' : 'Geen veelvouden en het stelsel is vals.') },
            ];
            return {
                opgave: L`Onderzoek of de rechten $a$ en $b$ samenvallend, strikt evenwijdig, snijdend of kruisend zijn. Bereken het snijpunt als ze elkaar snijden. $$${ta.tex} \qquad ${tb.tex}$$`,
                delen: [D.ligging('Onderlinge ligging van $a$ en $b$:', opties, juist, 2, 'S', S, { tip: 'Vul de gevonden parameterwaarde in in de parametervergelijking.' })],
                hints: ['Stap 1: bepaal de richtingsvectoren van $a$ en $b$. Zijn ze veelvouden van elkaar?', 'Stap 2 (veelvouden): ligt een punt van $a$ op $b$? Ja → samenvallend, nee → strikt evenwijdig.', L`Stap 2 (geen veelvouden): los het stelsel $\vec{P_a} + r\,${TX.rv('a')} = \vec{P_b} + s\,${TX.rv('b')}$ op. Eén oplossing → snijdend, vals → kruisend.`],
                stappen: st,
            };
        }
    };
}
regGen({ id: 'li_rechten', cat: 'ligging', niveau: 2, titel: 'Onderlinge ligging van twee rechten', maak: genLiggingRechten(2) });
regGen({ id: 'li_rechten_stelsel', cat: 'ligging', niveau: 3, titel: 'Onderlinge ligging van twee rechten (één als snijlijn)', maak: genLiggingRechten(3) });

regGen({ id: 'li_vlakken', cat: 'ligging', niveau: 1, titel: 'Onderlinge ligging van twee vlakken', maak(r) {
    let N1, t1; do { N1 = vlakPrim(r.vecNZ(-5, 5), F(0)).n; } while (N1.filter(x => x.nul).length > 1);
    t1 = F(r.int(-8, 8));
    const soort = r.pick([0, 1, 1, 2, 2]);
    const c = r.pick([2, -2, 3, -1, -3]);
    let N2, t2;
    if (soort === 0) { N2 = vmaal(N1, c); t2 = t1.maal(c); }
    else if (soort === 1) { N2 = vmaal(N1, c); t2 = t1.maal(c).plus(r.nz(-4, 4)); }
    else { do { N2 = r.vecNZ(-5, 5); } while (vpar(N1, N2)); t2 = F(r.int(-8, 8)); }
    const par = vpar(N1, N2);
    const k = par ? N2[[0, 1, 2].find(i => !N1[i].nul)].door(N1[[0, 1, 2].find(i => !N1[i].nul)]) : null;
    const juist = !par ? 2 : (t2.gelijk(t1.maal(k)) ? 0 : 1);
    zeker(juist === soort, 'ligging vlakken');
    const st = [L`$${TX.nv(L`\alpha`)}${TX.co(N1)}$ en $${TX.nv(L`\beta`)}${TX.co(N2)}$`];
    if (!par) st.push(L`!De coëfficiënten van de onbekenden zijn niet evenredig: $\alpha$ en $\beta$ snijden elkaar (volgens een rechte).`);
    else {
        st.push(L`De coëfficiënten zijn evenredig: $${TX.nv(L`\beta`)} = ${k.tex()}\cdot${TX.nv(L`\alpha`)}$.`);
        st.push(L`Constante termen: $${k.tex()}\cdot ${t1.n < 0 ? haak(t1.tex()) : t1.tex()} = ${t1.maal(k).tex()}$ ${juist === 0 ? '=' : '\\neq'} $${t2.tex()}$`);
        st.push(juist === 0 ? '!Ook de constanten zijn evenredig: $\\alpha = \\beta$ (samenvallend).' : '!De constanten zijn niet evenredig: $\\alpha \\parallel \\beta$ (strikt evenwijdig).');
    }
    const opties = [
        { t: 'samenvallend ($\\alpha = \\beta$)', uitleg: !par ? 'De coëfficiënten van $x$, $y$, $z$ zijn niet evenredig.' : (juist === 0 ? '' : 'De constante termen zijn niet evenredig met de coëfficiënten.') },
        { t: 'strikt evenwijdig', uitleg: !par ? 'De coëfficiënten van $x$, $y$, $z$ zijn niet evenredig.' : (juist === 0 ? 'Ook de constante termen zijn evenredig: de vlakken vallen samen.' : '') },
        { t: 'snijdend (volgens een rechte)', uitleg: par ? 'De coëfficiënten van $x$, $y$, $z$ zijn evenredig: de vlakken zijn evenwijdig of samenvallend.' : '' },
    ];
    return {
        opgave: L`Bepaal de onderlinge ligging van $$${TX.vlak(L`\alpha`, N1, t1)} \quad\text{en}\quad ${TX.vlak(L`\beta`, N2, t2)}$$`,
        delen: [D.keuze('Onderlinge ligging:', opties, juist)],
        hints: [L`Vergelijk de coëfficiënten: is er een $k$ met $u_1 = k\,u_2$, $v_1 = k\,v_2$ en $w_1 = k\,w_2$?`, L`Zo ja: geldt ook $t_1 = k\,t_2$? Dan vallen ze samen, anders zijn ze strikt evenwijdig.`],
        stappen: st,
    };
} });

    };

regGen({ id: 'li_rechte_vlak', cat: 'ligging', niveau: 2, titel: 'Onderlinge ligging van een rechte en een vlak', maak(r) {
    for (;;) {
        const N = vlakPrim(r.vecNZ(-4, 4), F(0)).n;
        const soort = r.pick(['snijdend', 'snijdend', 'evenwijdig', 'ligtin']);
        let P, R, t;
        if (soort === 'snijdend') {
            R = r.richting(-4, 4, 1); if (vdot(N, R).nul) continue;
            const S = r.vec(-4, 4); t = vdot(N, S).neg();
            P = vplus(S, vmaal(R, r.nz(-2, 2)));
        } else {
            R = vprim(vcross(N, r.vecNZ(-2, 2)), false); if (visNul(R) || R.some(x => Math.abs(x.n) > 6)) continue;
            P = r.vec(-4, 4); t = vdot(N, P).neg();
            if (soort === 'evenwijdig') t = t.plus(r.nz(-5, 5));
        }
        if (Math.abs(t.n) > 20) continue;
        const vl = { n: N, t };
        const vorm = r.pick(['param', 'cart']);
        const rt = rechteTekst('d', P, R, vorm, r);
        const NR = vdot(N, R), w = vdot(N, P).plus(t);
        const st = [L`$${TX.rv('d')}${TX.co(R)}$ en $${TX.nv(L`\alpha`)}${TX.co(N)}$`, L`Is $${TX.rv('d')} \in \alpha_0$? $\;${TX.nv(L`\alpha`)} \cdot ${TX.rv('d')} = ${invulTex(N, undefined, R)} = ${NR.tex()}$` + (NR.nul ? L` $= 0$: $d \parallel \alpha$ (strikt evenwijdig of $d$ ligt in $\alpha$).` : L` $\neq 0$: $d$ snijdt $\alpha$.`)];
        let juist, S = null;
        if (!NR.nul) {
            const u = UW.snij(P, R, vl, 'k', 'S', L`\alpha`);
            st.push(...u.st); S = u.S; juist = 0;
        } else {
            st.push(L`Ligt het steunpunt $\vec P${TX.co(P)}$ in $\alpha$? $\;${invulTex(N, t, P)} = ${w.tex()}$`);
            juist = w.nul ? 2 : 1;
        }

function genProjectie(spiegel) {
    return function (r) {
        for (;;) {
            const N = vlakPrim(r.vecNZ(-3, 3), F(0)).n;
            let P, Pp, t;
            if (r.bool(0.75)) { Pp = r.vec(-4, 4); t = vdot(N, Pp).neg(); P = vplus(Pp, vmaal(N, r.nz(-2, 2))); }
            else { t = F(r.int(-6, 6)); P = r.vec(-4, 4); const k = vdot(N, P).plus(t).neg().door(vkwad(N)); if (k.nul || k.d > 12) continue; Pp = vplus(P, vmaal(N, k)); }
            if (P.some(x => Math.abs(x.n) > 10) || Math.abs(t.n) > 25) continue;
            const vl = { n: N, t };
            const s = UW.snij(P, N, vl, 'k', "P'", L`\alpha`);
            zeker(vgelijk(s.S, Pp), 'projectie');
            const Q = vmin(vmaal(Pp, 2), P);
            const st = [L`Loodlijn $m$ uit $P$ op $\alpha$: $${TX.sv('m')}: \vec P${TX.co(P)}$ en $${TX.rv('m')}: ${TX.nv(L`\alpha`)}${TX.co(N)}$`, L`$${TX.rechteParam('m', P, N)}$`, L`$P' = m \cap \alpha$:`, ...s.st];
            const delen = [D.punt(L`Bepaal de loodrechte projectie $P'$ van $P$ op $\alpha$.`, "P'", Pp)];
            if (spiegel) {
                delen.push(D.punt(L`Bepaal het spiegelbeeld $Q$ van $P$ ten opzichte van $\alpha$.`, 'Q', Q, { fouten: [{ w: Pp, msg: "Dat is de projectie $P'$. Het spiegelbeeld ligt even ver aan de andere kant van het vlak." }] }));
                st.push(L`$P'$ hoort bij $k = ${s.k.tex()}$; het spiegelbeeld $Q$ ligt twee keer zo ver: $k = ${s.k.maal(2).tex()}$ (of: $P'$ is het midden van $[PQ]$, dus $\vec Q = 2\vec{P'} - \vec P$).`);
                st.push(L`!$${TX.pt("P'", Pp)}$ en $${TX.pt('Q', Q)}$`);
            } else st.push(L`!$${TX.pt("P'", Pp)}$`);
            return {
                opgave: L`Gegeven: het punt $${TX.pt('P', P)}$ en het vlak $${TX.vlak(L`\alpha`, N, t)}$.`,
                delen,
                hints: [L`Stel eerst de loodlijn $m$ uit $P$ op $\alpha$ op: richtingsvector $${TX.nv(L`\alpha`)}${TX.co(N)}$.`, L`$P'$ is het snijpunt van $m$ met $\alpha$: vul de parametervergelijking van $m$ in in de vergelijking van $\alpha$.`, ...(spiegel ? [L`$P'$ is het midden van $[PQ]$. Of: neem de dubbele parameterwaarde.`] : [])],
                stappen: st,
            };
        }
    };
}

regGen({ id: 'lo_rechthoek', cat: 'loodrecht', niveau: 3, titel: 'Punten C op een rechte zodat ABC rechthoekig is in C', maak(r) {

        const w = vcross(R, r.vecNZ(-1, 1));
        const M = vplus(vdoor(vplus(C1, C2), 2), vmaal(w, r.int(0, 1)));

        const kand = [];
        for (let a = -7; a <= 7; a++) for (let b = -7; b <= 7; b++) { const c2 = rho - a * a - b * b; if (c2 < 0) continue; const c = Math.round(Math.sqrt(c2)); if (c * c === c2) { kand.push(V(a, b, c)); if (c) kand.push(V(a, b, -c)); } }

        const rt = rechteTekst('a', P0, R, 'param', r);

            stappen: [L`$C \in a$: $C(${XYZ.map((c, i) => linCF(P0[i], [[R[i], 'k']])).join(',\\,')})$`, L`$\overrightarrow{AC}(${ACt.join(',\\,')})$ en $\overrightarrow{BC}(${BCt.join(',\\,')})$`,
                L`$\overrightarrow{AC} \cdot \overrightarrow{BC} = 0 \;\Leftrightarrow\; ${[0, 1, 2].map(i => haak(ACt[i]) + haak(BCt[i])).join(' + ')} = 0$`,
                L`>$\Leftrightarrow\; ${lin([qa, qb], ['k^2', 'k'], qc)} = 0` + (g > 1 ? L` \;\Leftrightarrow\; ${lin([qa2, qb2], ['k^2', 'k'], qc2)} = 0$` : '$'),
                L`>$\Leftrightarrow\; k = ${kk1} \;\vee\; k = ${kk2}$`, L`!$${TX.pt('C_1', vplus(P0, vmaal(R, kk1)))}$ en $${TX.pt('C_2', vplus(P0, vmaal(R, kk2)))}$`],
            punten: 2,
        };
    }

} });

regGen({ id: 'lo_parameter', cat: 'loodrecht', niveau: 2, titel: 'Parameter bepalen voor loodrechte stand', maak(r) {
    for (;;) {
        const U = r.vecVol(-4, 4);
        const i = r.int(0, 2);
        const W = r.vecVol(-4, 4);
        const rest = vdot(U, W).min(U[i].maal(W[i]));
        const p = rest.neg().door(U[i]);
        if (p.d > 3 || Math.abs(p.v) > 12) continue;
        const co = [0, 1, 2].map(j => j === i ? 'p' : W[j].tex()).join(',\\,');
        const vlakken = r.bool();
        const naamU = vlakken ? TX.nv(L`\alpha`) : TX.rv('a'), naamW = vlakken ? TX.nv(L`\beta`) : TX.rv('b');
        let bTex = '';
        for (let j = 0; j < 3; j++) {
            if (j === i) { bTex += (bTex === '' ? '' : ' + ') + 'p' + XYZ[j]; continue; }
            const c = W[j], neg = c.n < 0, a = c.abs(), body = (a.gelijk(1) ? '' : a.tex()) + XYZ[j];
            bTex += bTex === '' ? (neg ? '-' : '') + body : (neg ? ' - ' : ' + ') + body;
        }
        const t2 = F(r.nz(-5, 5));
        bTex += (t2.n < 0 ? ' - ' : ' + ') + t2.abs().tex();
        const opg = vlakken ? L`Gegeven: $${TX.vlak(L`\alpha`, U, F(r.int(-5, 5)))}$ en $\beta \leftrightarrow ${bTex} = 0$.` : L`De rechte $a$ heeft richtingsvector $${TX.rv('a')}${TX.co(U)}$ en de rechte $b$ heeft richtingsvector $${TX.rv('b')}(${co})$.`;
        return {
            opgave: opg,
            delen: [D.getal(vlakken ? 'Bepaal $p$ zodat $\\alpha \\perp \\beta$.' : 'Bepaal $p$ zodat $a \\perp b$.', p.v, p.tex(), p.txt(), { label: 'p =' })],
            hints: [L`Loodrecht $\Leftrightarrow$ $${naamU} \cdot ${naamW} = 0$.`, L`Schrijf het scalair product uit: je krijgt een eerstegraadsvergelijking in $p$.`],
            stappen: [L`$${naamU}${TX.co(U)}$ en $${naamW}(${co})$`, L`$${naamU} \cdot ${naamW} = 0 \;\Leftrightarrow\; ${lin([U[i]], ['p'], rest)} = 0$`, L`!$p = ${p.tex()}$`],
        };
    }
} });

regGen({ id: 'lo_gem_loodlijn', cat: 'loodrecht', niveau: 3, titel: 'Gemeenschappelijke loodlijn van twee kruisende rechten', maak(r) {
    for (;;) {
        const A = r.vec(-3, 3), nAB = r.vecNZ(-3, 3);
        const B = vplus(A, nAB);
        const Ra = vprim(vcross(nAB, r.vecNZ(-1, 1)), false), Rb = vprim(vcross(nAB, r.vecNZ(-1, 1)), false);
        if (visNul(Ra) || visNul(Rb) || vpar(Ra, Rb) || [...Ra, ...Rb].some(x => Math.abs(x.n) > 6)) continue;
        const i0 = r.nz(-2, 2), j0 = r.nz(-2, 2);
        const Pa = vmin(A, vmaal(Ra, i0)), Pb = vmin(B, vmaal(Rb, j0));
        if ([...Pa, ...Pb].some(x => Math.abs(x.n) > 10)) continue;
        // AB(s, k) = Pb + s Rb - Pa - k Ra
        const D0 = vmin(Pb, Pa);
        const a11 = vdot(Ra, Ra).neg(), a12 = vdot(Rb, Ra), c1 = vdot(D0, Ra).neg();
        const a21 = vdot(Ra, Rb).neg(), a22 = vdot(Rb, Rb), c2 = vdot(D0, Rb).neg();
        zeker(a11.maal(i0).plus(a12.maal(j0)).gelijk(c1) && a21.maal(i0).plus(a22.maal(j0)).gelijk(c2), 'gem. loodlijn: stelsel');
        zeker(vdot(nAB, Ra).nul && vdot(nAB, Rb).nul && !det3(vmin(Pb, Pa), Ra, Rb).nul, 'gem. loodlijn: kruisend');
        const ABt = XYZ.map((c, i) => linCF(D0[i], [[Rb[i], 's'], [Ra[i].neg(), 'k']]));
        const NR = vprim(nAB, false);
        const ta = rechteTekst('a', Pa, Ra, r.pick(['param', 'cart']), r), tb = rechteTekst('b', Pb, Rb, 'param', r, 's');
        return {
            opgave: L`Gegeven: de kruisende rechten $$${ta.tex} \qquad ${tb.tex}$$`,
            delen: [D.punten(L`Bepaal de voetpunten $A \in a$ en $B \in b$ van de gemeenschappelijke loodlijn.`, [['A', A], ['B', B]], { deelscore: true }), D.rechteCart(L`Bepaal een stel cartesiaanse vergelijkingen van de gemeenschappelijke loodlijn $\ell$.`, L`\ell`, A, NR)],
            hints: [L`Neem een willekeurig punt $A$ van $a$ (parameter $k$) en $B$ van $b$ (parameter $s$).`, L`$\overrightarrow{AB} \perp a$ en $\overrightarrow{AB} \perp b$: $\overrightarrow{AB} \cdot ${TX.rv('a')} = 0$ en $\overrightarrow{AB} \cdot ${TX.rv('b')} = 0$.`, 'Los het stelsel in $k$ en $s$ op; vul in om $A$ en $B$ te vinden.'],
            stappen: [L`$A \in a$: $A(${XYZ.map((c, i) => linCF(Pa[i], [[Ra[i], 'k']])).join(',\\,')})$ en $B \in b$: $B(${XYZ.map((c, i) => linCF(Pb[i], [[Rb[i], 's']])).join(',\\,')})$`,
                L`$\overrightarrow{AB}(${ABt.join(',\\,')})$`,
                L`$\left\{\begin{array}{l} \overrightarrow{AB} \cdot ${TX.rv('a')} = 0 \\ \overrightarrow{AB} \cdot ${TX.rv('b')} = 0 \end{array}\right. \;\Leftrightarrow\; \left\{\begin{array}{l} ${lin([a11, a12], ['k', 's'])} = ${c1.tex()} \\ ${lin([a21, a22], ['k', 's'])} = ${c2.tex()} \end{array}\right. \;\Leftrightarrow\; \left\{\begin{array}{l} k = ${i0} \\ s = ${j0} \end{array}\right.$`,
                L`$${TX.pt('A', A)}$ en $${TX.pt('B', B)}$, $\;\overrightarrow{AB}${TX.co(nAB)}$`, L`!$${TX.rechteCart(L`\ell`, A, NR)}$`],
        };
    }
} });
</script>

<!-- =====================================================================

<script>
// ---------- hulpjes ----------
function afstandPuntVlakSt(Ptex, P, vl, naamVlak) {
    const tel = vdot(vl.n, P).plus(vl.t), nk = vkwad(vl.n);
    const d = new Wortel(tel.abs().door(nk), nk.n);   // |tel|/√nk = |tel|·√nk/nk
    const st = [L`$d(${Ptex}, ${naamVlak}) = \dfrac{|u x_1 + v y_1 + w z_1 + t|}{\sqrt{u^2 + v^2 + w^2}} = \dfrac{|${invulTex(vl.n, vl.t, P)}|}{\sqrt{${vl.n.map(kwT).join(' + ')}}} = \dfrac{${tel.abs().tex()}}{\sqrt{${nk.tex()}}} = ${d.tex()}$`];
    return { st, d, tel, nk };
}
const getalInvoer = w => ({ v: w.v, tex: w.tex(), txt: w.txt() });
function hoekGraden(c) { return Math.acos(Math.max(-1, Math.min(1, c))) * 180 / Math.PI; }
const gr = g => g.toFixed(2).replace('.', '{,}');

// ===================== AFSTANDEN =====================
regGen({ id: 'af_punten', cat: 'afstand', niveau: 1, titel: 'Afstand tussen twee punten', maak(r) {
    let A, B; do { A = r.vec(-6, 6); B = r.vec(-6, 6); } while (vgelijk(A, B));
    const v = vmin(B, A), k = vkwad(v), d = Wortel.uitFr(k);
    return {
        opgave: L`Bereken de afstand tussen $${TX.pt('A', A)}$ en $${TX.pt('B', B)}$.`,
        delen: [D.getal('Bereken $d(A, B)$.', d.v, d.tex(), d.txt(), { label: '|AB| =', fouten: [{ w: k.v, msg: 'Vergeet de vierkantswortel niet.' }] })],
        hints: [L`$d(A, B) = |AB| = \sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2 + (z_2 - z_1)^2}$`, L`$co(\overrightarrow{AB}) = ${TX.co(v)}$`],
        stappen: [L`$|AB| = \sqrt{${v.map(kwT).join(' + ')}} = \sqrt{${k.tex()}}$`, L`!$|AB| = ${d.tex()}$`],
    };
} });

regGen({ id: 'af_punt_vlak', cat: 'afstand', niveau: 1, titel: 'Afstand van een punt tot een vlak', maak(r) {
    const N = r.bool(0.6) ? pythVec(r).v : vlakPrim(r.vecNZ(-4, 4), F(0)).n;
    const t = F(r.int(-9, 9)), P = r.vec(-5, 5);
    const vl = { n: N, t };
    if (vdot(N, P).plus(t).nul) return this.maak(r);
    const u = afstandPuntVlakSt('P', P, vl, L`\alpha`);
    return {
        opgave: L`Bepaal de afstand van het punt $${TX.pt('P', P)}$ tot het vlak $${TX.vlak(L`\alpha`, N, t)}$.`,
        delen: [D.getal('Bereken $d(P, \\alpha)$.', u.d.v, u.d.tex(), u.d.txt(), { label: L`d(P,\alpha) =`, fouten: [{ w: u.tel.abs().v / u.nk.v, msg: 'Vergeet de vierkantswortel in de noemer niet.' }, { w: Math.abs(vdot(N, P).v) / Math.sqrt(u.nk.v), msg: 'Vergeet de constante term $t$ niet in de teller.' }] })],
        hints: [L`$d(P, \alpha) = \dfrac{|u x_1 + v y_1 + w z_1 + t|}{\sqrt{u^2 + v^2 + w^2}}$`, L`Teller: vul $P$ in in het linkerlid van de vergelijking en neem de absolute waarde: $|${invulTex(N, t, P)}|$.`],
        stappen: [...u.st, L`!$d(P, \alpha) = ${u.d.tex()}$`],
    };
} });

regGen({ id: 'af_ev_vlakken', cat: 'afstand', niveau: 2, titel: 'Afstand tussen twee evenwijdige vlakken', maak(r) {
    for (;;) {
        const N = r.bool(0.6) ? pythVec(r).v : vlakPrim(r.vecNZ(-3, 3), F(0)).n;
        const A = r.vec(-3, 3), t1 = vdot(N, A).neg();
        const c = r.pick([1, 2, -2, 3]);
        const N2 = vmaal(N, c), t2 = F(r.int(-12, 12));
        if (t2.gelijk(t1.maal(c)) || Math.abs(t1.n) > 20) continue;
        const i = [0, 1, 2].find(j => Math.abs(N[j].n) === 1);
        let Ap = A;
        if (i !== undefined) { Ap = [F(0), F(0), F(0)]; Ap[i] = t1.neg().door(N[i]); }
        const u = afstandPuntVlakSt('A', Ap, { n: N2, t: t2 }, L`\beta`);
        const fout = Math.abs(t2.min(t1).v) / Math.sqrt(vkwad(N).v);
        return {
            opgave: L`Bepaal de afstand tussen de evenwijdige vlakken $$${TX.vlak(L`\alpha`, N, t1)} \quad\text{en}\quad ${TX.vlak(L`\beta`, N2, t2)}$$`,
            delen: [D.getal('Bereken $d(\\alpha, \\beta)$.', u.d.v, u.d.tex(), u.d.txt(), { label: L`d(\alpha,\beta) =`, fouten: c !== 1 && !bijna(fout, u.d.v) ? [{ w: fout, msg: 'Je trok de constante termen van elkaar af, maar de vergelijkingen hebben niet dezelfde coëfficiënten. Neem liever een punt van $\\alpha$ en bereken de afstand tot $\\beta$.' }] : [] })],
            hints: [L`$d(\alpha, \beta) = d(A, \beta)$ met $A$ een willekeurig punt van $\alpha$.`, L`Een punt van $\alpha$: bv. $${TX.pt('A', Ap)}$ (controleer: het voldoet aan de vergelijking van $\alpha$).`, L`Gebruik de afstandsformule met de vergelijking van $\beta$.`],
            stappen: [L`Kies $${TX.pt('A', Ap)} \in \alpha$ (want $${invulTex(N, t1, Ap)} = 0$).`, ...u.st, L`!$d(\alpha, \beta) = ${u.d.tex()}$`],
        };
    }
} });

regGen({ id: 'af_punt_rechte', cat: 'afstand', niveau: 2, titel: 'Afstand van een punt tot een rechte', maak(r) {
    for (;;) {
        const Lp = r.vec(-4, 4), R = r.richting(-3, 3, 1);
        const w = vprim(vcross(R, r.vecNZ(-2, 2)), false);
        if (visNul(w) || w.some(x => Math.abs(x.n) > 5)) continue;
        const P = vplus(Lp, w);
        const k0 = r.nz(-2, 2), P0 = vmin(Lp, vmaal(R, k0));
        if ([...P, ...P0].some(x => Math.abs(x.n) > 9)) continue;
        const d = Wortel.uitFr(vkwad(w));
        const methode = r.bool() ? 'loodvlak' : 'scalair';
        const rt = rechteTekst(L`\ell`, P0, R, r.pick(['param', 'cart']), r);
        const st = [L`$${TX.rechteParam(L`\ell`, P0, R)}$`];
        if (methode === 'loodvlak') {
            const c = UW.constante(L`\pi`, R, P, 'P');
            st.push(L`Methode 1: loodvlak $\pi$ uit $P$ op $\ell$: $\;${TX.nv(L`\pi`)} = ${TX.rv(L`\ell`)}${TX.co(R)}$`, ...c.st);
            const s = UW.snij(P0, R, c.vl, 'k', "P'", L`\pi`);
            st.push(L`$P' = \ell \cap \pi$:`, ...s.st);
        } else {
            const PL = XYZ.map((c, i) => linCF(P0[i].min(P[i]), [[R[i], 'k']]));
            const NR = vkwad(R), cst = vdot(vmin(P0, P), R);
            st.push(L`Methode 2 (scalair product): $P' \in \ell$, dus $P'(${XYZ.map((c, i) => linCF(P0[i], [[R[i], 'k']])).join(',\\,')})$ en $\overrightarrow{PP'}(${PL.join(',\\,')})$`,
                L`$\overrightarrow{PP'} \perp ${TX.rv(L`\ell`)} \;\Leftrightarrow\; \overrightarrow{PP'} \cdot ${TX.rv(L`\ell`)} = 0 \;\Leftrightarrow\; ${lin([NR], ['k'], cst)} = 0 \;\Leftrightarrow\; k = ${F(k0).tex()}$`, L`$${TX.pt("P'", Lp)}$`);
        }
        st.push(L`$d(P, \ell) = |PP'| = \sqrt{${vmin(Lp, P).map(kwT).join(' + ')}} = ${d.tex()}$`, L`!$${TX.pt("P'", Lp)}$ en $d(P, \ell) = ${d.tex()}$`);
        return {
            opgave: L`Gegeven: het punt $${TX.pt('P', P)}$ en de rechte $$${rt.tex}$$`,
            delen: [D.punt(L`Bepaal het voetpunt $P'$ van de loodlijn uit $P$ op $\ell$ (de loodrechte projectie van $P$ op $\ell$).`, "P'", Lp), D.getal(L`Bereken $d(P, \ell)$.`, d.v, d.tex(), d.txt(), { label: L`d(P,\ell) =` })],
            hints: ['Er is geen directe formule voor de afstand van een punt tot een rechte.', L`Methode 1: bepaal het loodvlak $\pi$ uit $P$ op $\ell$; $P' = \ell \cap \pi$.`, L`Methode 2: neem $P'$ willekeurig op $\ell$ (met parameter $k$) en druk uit dat $\overrightarrow{PP'} \cdot ${TX.rv(L`\ell`)} = 0$.`, L`$d(P, \ell) = |PP'|$`],
            stappen: st,
        };
    }
} });

regGen({ id: 'af_ev_rechten', cat: 'afstand', niveau: 2, titel: 'Afstand tussen twee evenwijdige rechten', maak(r) {
    for (;;) {
        const Lp = r.vec(-4, 4), R = r.richting(-3, 3, 1);

            stappen: [L`$M${TX.co(M)} \in m$; $\;L \in \ell$: $L(${XYZ.map((c, i) => linCF(P0[i], [[R[i], 'k']])).join(',\\,')})$`, L`$\overrightarrow{ML}(${LM.join(',\\,')})$ en $\overrightarrow{ML} \cdot ${TX.rv(L`\ell`)} = 0 \;\Leftrightarrow\; ${lin([NR], ['k'], cst)} = 0 \;\Leftrightarrow\; k = ${k0.tex()}$`,
                L`$${TX.pt('L', Lp)}$`, L`$d(\ell, m) = |ML| = \sqrt{${vmin(Lp, M).map(kwT).join(' + ')}}$`, L`!$d(\ell, m) = ${d.tex()}$`],
        };
    }
} });

regGen({ id: 'af_kruisende', cat: 'afstand', niveau: 3, titel: 'Afstand tussen twee kruisende rechten', maak(r) {

            stappen: [L`Hulpvlak $\beta$ door $b$, evenwijdig met $a$: $\;\vec{P_b}${TX.co(Pb)}$, $${TX.rv('a')}${TX.co(Ra)}$, $${TX.rv('b')}${TX.co(Rb)}$`, ...hv.st, L`$A${TX.co(Pa)} \in a$:`, ...u.st, L`!$d(a, b) = d(A, \beta) = ${d.tex()}$`],
        };

function hoekSt(u, v, nu, nv, abs) {
    const d = vdot(u, v), ku = vkwad(u), kv = vkwad(v);
    const c = (abs ? Math.abs(d.v) : d.v) / Math.sqrt(ku.v * kv.v);
    const tel = abs ? `|${invulTex(u, undefined, v)}|` : invulTex(u, undefined, v);
    return { c, d, ku, kv, tex: L`\dfrac{${tel}}{\sqrt{${ku.tex()}}\cdot\sqrt{${kv.tex()}}} = \dfrac{${abs ? d.abs().tex() : d.tex()}}{\sqrt{${ku.tex()}}\,\sqrt{${kv.tex()}}}` };
}

function genHoek(soort) {
    return function (r) {
        for (;;) {
            let u, v, opg, st0 = [], label, naam;
            if (soort === 'rechten') {
                u = r.richting(-4, 4, 1); v = r.richting(-4, 4, 1);
                if (vpar(u, v) || vdot(u, v).nul) continue;
                opg = L`Bereken de hoek tussen de rechten $$${TX.rechteParam(L`\ell`, r.vec(-4, 4), u, 'r')} \quad\text{en}\quad ${TX.rechteParam('m', r.vec(-4, 4), v, 's')}$$`;
                st0 = [L`$${TX.rv(L`\ell`)}${TX.co(u)}$ en $${TX.rv('m')}${TX.co(v)}$`]; naam = L`\widehat{\ell, m}`;
            } else if (soort === 'vlakken') {
                u = vlakPrim(r.vecNZ(-4, 4), F(0)).n; v = vlakPrim(r.vecNZ(-4, 4), F(0)).n;
                if (vpar(u, v) || vdot(u, v).nul) continue;
                opg = L`Bereken de hoek tussen de vlakken $$${TX.vlak(L`\alpha`, u, F(r.int(-6, 6)))} \quad\text{en}\quad ${TX.vlak(L`\beta`, v, F(r.int(-6, 6)))}$$`;
                st0 = [L`$${TX.nv(L`\alpha`)}${TX.co(u)}$ en $${TX.nv(L`\beta`)}${TX.co(v)}$`]; naam = L`\widehat{\alpha, \beta}`;
            } else {
                u = r.richting(-4, 4, 1); v = vlakPrim(r.vecNZ(-4, 4), F(0)).n;
                if (vpar(u, v) || vdot(u, v).nul) continue;
                opg = L`Bereken de hoek tussen de rechte $${TX.rechteParam(L`\ell`, r.vec(-4, 4), u, 'r')}$ en het vlak $${TX.vlak(L`\alpha`, v, F(r.int(-6, 6)))}$.`;
                st0 = [L`$${TX.rv(L`\ell`)}${TX.co(u)}$ en $${TX.nv(L`\alpha`)}${TX.co(v)}$`]; naam = L`\widehat{\ell, \alpha}`;
            }
            const h = hoekSt(u, v, '', '', true);
            let g = hoekGraden(h.c);
            const st = [...st0];
            const fouten = [{ w: 180 - g, msg: 'Neem de absolute waarde van het scalair product: de hoek ligt tussen 0° en 90°.' }];
            if (soort === 'rechtevlak') {
                const gn = g; g = 90 - gn;
                st.push(L`Hoek tussen de rechte en de loodlijn $m$ op het vlak: $\cos(\widehat{\ell, m}) = ${h.tex}$, dus $\widehat{\ell, m} \approx ${gr(gn)}^\circ$`);
                st.push(L`!$\widehat{\ell, \alpha} = 90^\circ - \widehat{\ell, m} = 90^\circ - \mathrm{Bgcos}\left(${h.c.toFixed(4).replace('.', '{,}')}\right) = ${dmsTex(g)} \approx ${gr(g)}^\circ$`);
                fouten.push({ w: gn, msg: L`Dat is de hoek tussen de rechte en de normaal (loodlijn) op het vlak. De hoek met het vlak is het complement: $90^\circ - $ die hoek.` });
                fouten.push({ w: 90 + gn, msg: 'Neem de absolute waarde van het scalair product.' });
            } else {
                st.push(L`$\cos(${naam}) = ${h.tex}$`);
                st.push(L`!$${naam} = \mathrm{Bgcos}\left(${h.c.toFixed(4).replace('.', '{,}')}\right) = ${dmsTex(g)} \approx ${gr(g)}^\circ$`);
            }
            const formule = soort === 'rechten' ? L`$\cos(\widehat{a,b}) = \dfrac{|a_1 a_2 + b_1 b_2 + c_1 c_2|}{\sqrt{a_1^2 + b_1^2 + c_1^2}\,\sqrt{a_2^2 + b_2^2 + c_2^2}}$: de hoek van de richtingsvectoren.` : soort === 'vlakken' ? L`$\cos(\widehat{\alpha,\beta}) = \dfrac{|u_1 u_2 + v_1 v_2 + w_1 w_2|}{\sqrt{u_1^2 + v_1^2 + w_1^2}\,\sqrt{u_2^2 + v_2^2 + w_2^2}}$: de hoek van de normaalvectoren.` : L`De hoek van een rechte met een vlak is het complement van de hoek tussen de rechte en de loodlijn op het vlak: $\widehat{\ell,\alpha} = 90^\circ - \widehat{\ell, m}$ met $\cos(\widehat{\ell, m}) = \dfrac{|a u + b v + c w|}{\sqrt{a^2 + b^2 + c^2}\,\sqrt{u^2 + v^2 + w^2}}$.`;
            return {
                opgave: opg,
                delen: [D.hoek('Bereken de hoek in graden.', g, { label: naam + ' =', fouten })],
                hints: [formule, st0[0].replace(/^\$/, 'Lees af: $'), 'Bgcos (cos⁻¹) op je rekentoestel in graden.'],
                stappen: st,
            };
        }
    };
}

function bolAlgTex(M, r2, k = 1) {
    const c = [M[0].maal(-2 * k), M[1].maal(-2 * k), M[2].maal(-2 * k)], e = vkwad(M).min(r2).maal(k);
    const kw = k === 1 ? 'x^2 + y^2 + z^2' : `${k}x^2 + ${k}y^2 + ${k}z^2`;
    const rest = lin(c, XYZ, e);
    return kw + (rest === '0' ? '' : (rest[0] === '-' ? ' - ' + rest.slice(1) : ' + ' + rest)) + ' = 0';
}
function bolMidTex(M, r2) {
    return XYZ.map((c, i) => M[i].nul ? `${c}^2` : haak(xMin(c, M[i])) + '^2').join(' + ') + ` = ${Fr.of(r2).tex()}`;
}
function kwadraatSt(M, r2, k = 1) {
    const st = [];
    if (k !== 1) st.push(L`Deel beide leden door $${k}$: $\;${bolAlgTex(M, r2)}$`);
    const termen = XYZ.map((c, i) => M[i].nul ? `${c}^2` : L`\left(${xMin(c, M[i])}\right)^2 - ${kwT(M[i])}`);
    st.push(L`Kwadraatafsplitsing: $\;${termen.join(' + ')} ${vkwad(M).min(r2).nul ? '' : (vkwad(M).min(r2).n < 0 ? '- ' + vkwad(M).min(r2).abs().tex() : '+ ' + vkwad(M).min(r2).tex())} = 0$`);
    st.push(L`>$\Leftrightarrow\; ${bolMidTex(M, r2)}$`);
    return st;
}

// ===================== LEERPAD: oefeningen met en zonder tussenstappen =====================
// Elke soort bestaat in twee versies met dezelfde opgave:
//   <id>_b  begeleid: de tussenstappen zijn aparte deelvragen (in het leerpad verschijnen ze één voor één);
//   <id>_z  zelfstandig: enkel het eindantwoord.
// Deze oefeningen (lp: true) verschijnen alleen in het leerpad, niet bij vrij oefenen of in de toets.
function lpPaar(id, cat, niveau, titel, bouw) {
    regGen({ id: id + '_b', cat, niveau, titel: titel + ' (met tussenstappen)', lp: true, maak(r) { const o = bouw(r); return { opgave: o.opgave, figuur: o.figuur, delen: [...o.tussen, ...o.eind], hints: o.hintsB || o.hints, stappen: o.stappen }; } });
    regGen({ id: id + '_z', cat, niveau, titel, lp: true, maak(r) { const o = bouw(r); return { opgave: o.opgaveZ || o.opgave, figuur: o.figuur, delen: o.eind, hints: o.hints, stappen: o.stappen }; } });
}
// getal-deelvraag met een melding als enkel het teken fout is
function lpGetal(vraag, x, label, tekenMsg) {
    x = Fr.of(x);
    return D.getal(vraag, num(x), x.tex(), x.txt(), { label, ph: 'bv. -5 of 3/2', fouten: x.nul || !tekenMsg ? [] : [{ w: -num(x), msg: tekenMsg }] });
}
// melding "dat is de steunvector" enkel als die vector echt verschilt van de juiste richting
const lpFoutSv = (P, R, msg) => (visNul(P) || vpar(P, R)) ? [] : [{ w: P, msg }];

lpPaar('lp_ab', 'rechte', 1, 'Rechte door twee punten', r => {
    let A, B; do { A = r.vec(-6, 6); B = r.vec(-6, 6); } while (vgelijk(A, B) || vmin(B, A).filter(x => x.nul).length > 1);

        eind: [D.rechteParam(L`Bepaal een parametervergelijking van $${n}$.`, n, A, R)],

        stappen: [L`$${TX.sv(n)}: \vec A${TX.co(A)}$`, L`$${TX.rv(n)}: \overrightarrow{AB} = \vec B - \vec A = ${TX.co(AB)}` + (vgelijk(R, AB) ? '$' : L` \;\rightarrow\; ${TX.co(R)}$ (vereenvoudigd)`), L`!$${TX.rechteParam(n, A, R)}$`],

});

lpPaar('lp_waaier', 'vlak', 3, 'Vlak door een rechte en een punt (vlakkenwaaier)', r => {

        const [v1, v2] = rt.vlakken;
        const w1 = vdot(v1.n, B).plus(v1.t), w2 = vdot(v2.n, B).plus(v2.t);
        if (w1.nul || w2.nul) continue;
        const w = waaier(L`\alpha`, v1, v2, B);
        zeker(opVlak(Pa, w.vl) && vdot(w.vl.n, R).nul, 'waaier lp');
        const g = Fr.of(ggd(w1.n * w2.d, w2.n * w1.d) || 1);
        let lam = w2.door(g), sig = w1.neg().door(g);
        if (lam.n < 0) { lam = lam.neg(); sig = sig.neg(); }
        const E1 = lin(v1.n, XYZ, v1.t), E2 = lin(v2.n, XYZ, v2.t);
        const goed = (l, s) => Fr.of(l).maal(w1).plus(Fr.of(s).maal(w2)).nul;
        const keuzeTekst = (l, s) => L`$\lambda = ${Fr.of(l).tex()}$ en $\sigma = ${Fr.of(s).tex()}$`;
        const kand = [[sig, lam], [lam, sig.neg()], [F(1), F(1)], [w1, w2]].filter(([l, s]) => !goed(l, s) && !(Fr.of(l).nul && Fr.of(s).nul));
        const uniek = [];
        kand.forEach(k => { if (!uniek.some(u2 => u2[0].gelijk(k[0]) && u2[1].gelijk(k[1]))) uniek.push(k); });
        const opties = r.shuffle([{ t: keuzeTekst(lam, sig), ok: true, uitleg: L`Controle: $${lam.tex()} \cdot ${haak(w1.tex())} + ${haak(sig.tex())} \cdot ${haak(w2.tex())} = 0$.` },
            ...uniek.slice(0, 2).map(([l, s]) => ({ t: keuzeTekst(l, s), uitleg: L`Vul in: $${Fr.of(l).tex()} \cdot ${haak(w1.tex())} + ${haak(Fr.of(s).tex())} \cdot ${haak(w2.tex())} \neq 0$.` }))]);
        return {
            opgave: L`Gegeven: $$${rt.tex}$$ en het punt $${TX.pt('B', B)}$. Het vlak $\alpha$ omvat $a$ en gaat door $B$. De vlakkenwaaier door $a$ is $$\lambda\left(${E1}\right) + \sigma\left(${E2}\right) = 0 \qquad \lambda, \sigma \in \mathbb{R}$$`,
            opgaveZ: L`Gegeven: $$${rt.tex}$$ en het punt $${TX.pt('B', B)}$.`,
            tussen: [lpGetal(L`Vul $B$ in in de eerste haakjes: hoeveel is $${E1}$ in $B$?`, w1, '', ''),

                D.keuze(L`Je krijgt $${lin([w1, w2], [L`\lambda`, L`\sigma`])} = 0$. Welke keuze voor $\lambda$ en $\sigma$ past?`, opties, opties.findIndex(o => o.ok))],
            eind: [D.vlak(L`Bepaal met een vlakkenwaaier een cartesiaanse vergelijking van het vlak $\alpha$ dat $a$ omvat en door $B$ gaat.`, L`\alpha`, w.vl, { punten: [['B', B], [L`\vec P`, Pa]], rv: [[TX.rv('a'), R]] })],
            hints: [L`Vlakkenwaaier: $\alpha \leftrightarrow \lambda\,(\text{vgl. 1}) + \sigma\,(\text{vgl. 2}) = 0$.`, L`Vul $B$ in; je krijgt een verband tussen $\lambda$ en $\sigma$.`, L`Kies $\lambda$ en $\sigma$ zodat dat verband klopt, vul ze in en werk de haakjes uit.`],
            stappen: [...w.st.slice(0, -1), '!' + w.st[w.st.length - 1].replace(/^>/, '')],
        };
    }

lpPaar('lp_projectie', 'loodrecht', 2, 'Loodrechte projectie van een punt op een vlak', r => {
    for (;;) {
        const N = vlakPrim(r.vecNZ(-3, 3), F(0)).n, Pp = r.vec(-4, 4), k0 = r.nz(-2, 2);
        const t = vdot(N, Pp).neg(), P = vplus(Pp, vmaal(N, k0));
        if (P.some(x => Math.abs(x.n) > 10) || Math.abs(t.n) > 25) continue;
        const s = UW.snij(P, N, { n: N, t }, 'k', "P'", L`\alpha`);
        zeker(vgelijk(s.S, Pp) && s.k.gelijk(-k0), 'projectie lp');
        return {
            opgave: L`Gegeven: het punt $${TX.pt('P', P)}$ en het vlak $${TX.vlak(L`\alpha`, N, t)}$. De loodrechte projectie $P'$ van $P$ op $\alpha$ is het snijpunt van de loodlijn $m$ uit $P$ op $\alpha$ met $\alpha$.`,
            opgaveZ: L`Gegeven: het punt $${TX.pt('P', P)}$ en het vlak $${TX.vlak(L`\alpha`, N, t)}$.`,
            tussen: [D.rechteParam(L`Stel een parametervergelijking op van de loodlijn $m$ uit $P$ op $\alpha$.`, 'm', P, N),
                lpGetal(L`Neem $${TX.rechteParam('m', P, N)}$. Vul in in de vergelijking van $\alpha$ en bereken $k$.`, F(-k0), 'k =', '')],
            eind: [D.punt(L`Bepaal de loodrechte projectie $P'$ van $P$ op $\alpha$.`, "P'", Pp, { fouten: [{ w: P, msg: 'Dat is $P$ zelf. Vul de gevonden $k$ in in de parametervergelijking van de loodlijn.' }] })],
            hints: [L`Loodlijn $m$: steunvector $\vec P$, richtingsvector $${TX.nv(L`\alpha`)}${TX.co(N)}$.`, L`$P' = m \cap \alpha$: vul de parametervergelijking van $m$ in in de vergelijking van $\alpha$.`, 'Vul de gevonden $k$ in in de parametervergelijking van $m$.'],
            stappen: [L`Loodlijn $m$ uit $P$ op $\alpha$: $${TX.sv('m')}: \vec P${TX.co(P)}$ en $${TX.rv('m')}: ${TX.nv(L`\alpha`)}${TX.co(N)}$`, L`$${TX.rechteParam('m', P, N)}$`, L`$P' = m \cap \alpha$:`, ...s.st, L`!$${TX.pt("P'", Pp)}$`],
        };
    }
});

lpPaar('lp_lr2', 'loodrecht', 2, 'Vlak door een punt, loodrecht op twee vlakken', r => {
    let N1, N2; do { N1 = vlakPrim(r.vecNZ(-3, 3), F(0)).n; N2 = vlakPrim(r.vecNZ(-3, 3), F(0)).n; } while (vpar(N1, N2));
    const t1 = F(r.int(-6, 6)), t2 = F(r.int(-6, 6)), P = r.vec(-4, 4);
    const u = UW.det(L`\pi`, P, N1, N2);

        { t: L`$${na}$ en $${nb}$ zijn richtingsvectoren van $\pi$.`, ok: true, uitleg: 'Staan twee vlakken loodrecht, dan is een normaalvector van het ene een richtingsvector van het andere.' },
        { t: L`$${na}$ is een normaalvector van $\pi$.`, uitleg: L`Dan zou $\pi$ evenwijdig zijn met $\alpha$, niet loodrecht.` },
        { t: L`$\vec P$ en $${na}$ zijn richtingsvectoren van $\pi$.`, uitleg: L`$\vec P$ is de steunvector, geen richtingsvector.` },
    ]);
    return {

        hints: ['Staan twee vlakken loodrecht, dan is een normaalvector van het ene een richtingsvector van het andere.', L`Dus: steunvector $\vec P$, richtingsvectoren $${na}${TX.co(N1)}$ en $${nb}${TX.co(N2)}$.`, HINT_DET],

        ['Het middelpunt van de snijcirkel van een bol met een vlak is het middelpunt van de bol.', false, 'Het is de loodrechte projectie van $M$ op het vlak (tenzij het vlak door $M$ gaat).'],

const INZICHT_TITEL = { ligging: 'Inzichtsvragen onderlinge ligging', loodrecht: 'Inzichtsvragen loodrechte stand', afstand: 'Inzichtsvragen afstanden', hoek: 'Inzichtsvragen scalair product en hoeken', bol: 'Inzichtsvragen bollen' };

// ---------- meerkeuze: normaalvector, richtingsvector, loodrecht ----------
regGen({ id: 'lo_inzicht_mc', cat: 'loodrecht', niveau: 1, titel: 'Normaalvector en richtingsvector herkennen', maak(r) {
    for (;;) {
        let N; do { N = vlakPrim(r.vecNZ(-4, 4), F(0)).n; } while (N.filter(x => x.nul).length > 1);
        const t = F(r.nz(-7, 7));
        const soort = r.int(0, 3);
        const loodr = () => { for (;;) { const w = vprim(vcross(N, r.vecNZ(-2, 2)), false); if (!visNul(w) && w.every(x => Math.abs(x.n) <= 7)) return w; } };
        const willek = () => { for (;;) { const w = r.vecNZ(-4, 4); if (!vpar(w, N) && !vdot(w, N).nul) return w; } };
        let vraag, juistV, fout = [];
        if (soort === 0 || soort === 1) {
            if (soort === 0) { juistV = vmaal(N, r.pick([1, 1, -1, 2])); fout = [loodr(), willek(), V(N[1], N[2], t)]; vraag = L`Welke vector is een normaalvector van $${TX.vlak(L`\alpha`, N, t)}$?`; }
            else { juistV = loodr(); fout = [N, willek(), vmaal(N, 2)]; vraag = L`Welke vector is een richtingsvector van $${TX.vlak(L`\alpha`, N, t)}$?`; }
            const alle = [juistV, ...fout];
            const goedeIdx = alle.map((v, i) => i).filter(i => soort === 0 ? vpar(alle[i], N) && !visNul(alle[i]) : vdot(alle[i], N).nul && !visNul(alle[i]));
            if (goedeIdx.length !== 1 || alle.some(v => visNul(v))) continue;
            const teksten = alle.map(v => `$${TX.co(v)}$`);
            if (new Set(teksten).size !== 4) continue;
            const volgorde = r.shuffle([0, 1, 2, 3]);
            const opties = volgorde.map(i => ({ t: teksten[i], uitleg: i === 0 ? '' : (soort === 0 ? (vdot(alle[i], N).nul ? 'Deze vector staat loodrecht op de normaalvector: het is een richtingsvector van het vlak.' : 'De coëfficiënten van $x$, $y$ en $z$ vormen de normaalvector (de constante term hoort er niet bij).') : (vpar(alle[i], N) ? 'Dat is (een veelvoud van) de normaalvector: die staat loodrecht op het vlak.' : 'Het scalair product met de normaalvector is niet $0$.')) }));
            return {
                opgave: vraag,
                delen: [D.keuze('Kies het juiste antwoord.', opties, volgorde.indexOf(0))],
                hints: [L`$\alpha \leftrightarrow ux + vy + wz + t = 0$ heeft normaalvector $${TX.nv(L`\alpha`)}(u, v, w)$.`, 'Een richtingsvector van het vlak staat loodrecht op de normaalvector: scalair product $0$.'],
                stappen: [L`$${TX.nv(L`\alpha`)}${TX.co(N)}$`, soort === 0 ? L`!Een normaalvector is een veelvoud van $${TX.co(N)}$: $${TX.co(juistV)}$.` : L`!$${TX.co(juistV)} \cdot ${TX.co(N)} = ${invulTex(juistV, undefined, N)} = 0$: dit is een richtingsvector.`],
            };
        }
        // soort 2: welk vlak staat loodrecht op de rechte a / soort 3: welke rechte staat loodrecht op het vlak
        const R = N;
        const P = r.vec(-3, 3);
        const opts = soort === 2
            ? [{ v: R, t: L`$${TX.vlakVgl(R, F(r.int(-6, 6)))}$` }, { v: loodr(), t: null }, { v: willek(), t: null }, { v: V(R[2], R[0], R[1]), t: null }]
            : [{ v: vmaal(R, r.pick([1, -1, 2])), t: null }, { v: loodr(), t: null }, { v: willek(), t: null }, { v: V(R[1], R[0], R[2]), t: null }];
        if (opts.slice(1).some(o => vpar(o.v, R) || visNul(o.v))) continue;
        opts.forEach(o => { if (!o.t) o.t = soort === 2 ? L`$${TX.vlakVgl(o.v, F(r.int(-6, 6)))}$` : L`$${TX.rechteCart('', P, o.v).replace(/^ \\leftrightarrow /, '')}$`; });
        if (new Set(opts.map(o => o.t)).size !== 4) continue;
        const volgorde = r.shuffle([0, 1, 2, 3]);
        const opties = volgorde.map(i => ({ t: opts[i].t, uitleg: i === 0 ? '' : (vdot(opts[i].v, R).nul ? (soort === 2 ? 'Dit vlak is evenwijdig met de rechte (normaalvector ⊥ richtingsvector).' : 'Deze rechte is evenwijdig met het vlak.') : (soort === 2 ? 'De normaalvector van dit vlak is geen veelvoud van de richtingsvector van $a$.' : 'De richtingsvector is geen veelvoud van de normaalvector.')) }));
        return {
            opgave: soort === 2 ? L`Welk vlak staat loodrecht op de rechte $a$ met richtingsvector $${TX.rv('a')}${TX.co(R)}$?` : L`Welke rechte staat loodrecht op het vlak $${TX.vlak(L`\alpha`, R, t)}$?`,
            delen: [D.keuze('Kies het juiste antwoord.', opties, volgorde.indexOf(0))],
            hints: [L`$e \perp \alpha \;\Leftrightarrow\; \overrightarrow{RV_e} = k\cdot\overrightarrow{N_\alpha}$.`, 'Vergelijk de normaalvector van het vlak met de richtingsvector van de rechte.'],
            stappen: [soort === 2 ? L`!Het gevraagde vlak heeft als normaalvector een veelvoud van $${TX.co(R)}$: ${opts[0].t}` : L`!De gevraagde rechte heeft als richtingsvector een veelvoud van $${TX.co(R)}$: ${opts[0].t}`],
        };
    }
} });
</script>

        { titel: 'Rechte als snijlijn van twee vlakken: determinantenmethode', gens: ['re_rv_stelsel', 're_param_uit_stelsel', 're_ev_stelsel'], html:

            + KADER(L`$\left|\begin{array}{rrr} 2 & -3 & 6 \\ 1 & 1 & 1 \end{array}\right| \;\Rightarrow\; \vec R\left(\begin{vmatrix} -3 & 6 \\ 1 & 1 \end{vmatrix},\; -\begin{vmatrix} 2 & 6 \\ 1 & 1 \end{vmatrix},\; \begin{vmatrix} 2 & -3 \\ 1 & 1 \end{vmatrix}\right) = (-9, 4, 5)$`)

            L`<ul><li>Ligt $Q$ op de rechte? Vul de coördinaat in: bij een parametervergelijking moet je drie keer dezelfde $k$ vinden; bij een cartesiaanse vergelijking moeten de breuken gelijk zijn.</li><li>Een punt met een voorwaarde (bv. snijpunt met het $xz$-vlak, of som van de coördinaten $= 10$): neem een willekeurig punt $(x_1 + ka,\, y_1 + kb,\, z_1 + kc)$, druk de voorwaarde uit en los op naar $k$.</li><li>Toepassing: bij een beweging met constante snelheid is de tijd de parameter.</li></ul>` },

        { titel: 'Vlakkenwaaier', gens: ['vl_waaier'], html:

        { titel: 'Punten in een vlak, coplanaire punten', gens: ['vl_k', 'vl_coplanair'], html:

        { titel: 'Onderlinge ligging van twee rechten', gens: ['li_ev_AB_CD', 'li_rechten', 'li_rechten_stelsel', 'li_parameter'], html:
            L`<table class="samenvatting-tabel"><tr><th>Ligging</th><th>Richtingsvectoren</th><th>Stelsel</th></tr><tr><td>snijdend (snijpunt $S$)</td><td>geen veelvouden</td><td>juist één oplossing</td></tr><tr><td>samenvallend</td><td>veelvouden</td><td>onbepaald</td></tr><tr><td>strikt evenwijdig</td><td>veelvouden</td><td>vals</td></tr><tr><td>kruisend</td><td>geen veelvouden</td><td>vals</td></tr></table>`
            + KADER(L`<b>Algemene methode</b><br>1) Bepaal de richtingsgetallen van $a$ en $b$.<br>2) Veelvouden $\Rightarrow a \parallel b$ of $a = b$: neem een punt van de ene rechte en controleer of het voldoet aan de vergelijking van de andere (ja: samenvallend, nee: strikt evenwijdig).<br>3) Geen veelvouden $\Rightarrow$ snijdend of kruisend: los het stelsel $\vec{P_a} + r\,\vec{R_a} = \vec{P_b} + s\,\vec{R_b}$ op (eventueel met het GRM, rref). Eén oplossing: snijdend (en je vindt het snijpunt); vals: kruisend.`) },

function werkPreviewBij(inp) {
    const deel = inp.closest('[data-deel], .deel');
    if (!deel) return;
    if (inp.dataset.pre !== undefined) {
        const pre = inp.dataset.pre;
        const vak = deel.querySelector(`[data-prev="${pre}co"]`);
        if (!vak) return;
        const waarden = XYZ.map(c => deel.querySelector(`[data-k="${pre}${c}"]`).value);
        if (waarden.every(x => !x.trim())) { vak.innerHTML = ''; return; }
        try {
            const t = waarden.map(x => x.trim() ? leesGetal(x).tex : '?');
            vak.innerHTML = kt(inp.dataset.naam ? '' : '') + kt(L`\left(${t.join(L`,\,`)}\right)`);
        } catch (e) { vak.innerHTML = `<span class="lees-fout">${esc(e.leesfout ? e.message : 'Kan dit niet lezen.')}</span>`; }
        return;
    }
    // parametervergelijking: één voorbeeld met accolade voor de drie vakjes samen
    if (inp.dataset.stelsel) {
        const vak = deel.querySelector('[data-prev="stelsel"]');
        if (!vak) return;
        const velden = [...deel.querySelectorAll('input[data-stelsel]')];
        if (velden.every(v => !v.value.trim())) { vak.innerHTML = ''; return; }
        let fout = null;
        const rijen = velden.map(v => {
            const c = v.dataset.k;
            if (!v.value.trim()) return L`${c} = \ldots`;
            try {
                let d = Ontleder.ontleed(v.value);
                if (d.length === 2 && d[0].t === 'var' && d[0].n === c) d = [d[1]];
                return `${c} = ${d.map(a => Ontleder.tex(a)).join(' = ')}`;
            } catch (e) { fout = fout || `${c}: ${e.leesfout ? e.message : 'kan dit niet lezen.'}`; return `${c} = ?`; }
        });
        vak.innerHTML = kt((vak.dataset.naam || '') + TX.stelsel(rijen)) + (fout ?`<div class="lees-fout">${esc(fout)}</div>` : '');
        return;
    }
    const vak = deel.querySelector(`[data-prev="${inp.dataset.k}"]`);
    if (!vak) return;
    const s = inp.value;
    if (!s.trim()) { vak.innerHTML = ''; return; }
    try { vak.innerHTML = kt((inp.dataset.label ? inp.dataset.label + ' ' : '') + Ontleder.ontleed(s).map(a => Ontleder.tex(a)).join(' = ')); }
    catch (e) { vak.innerHTML = `<span class="lees-fout">${esc(e.leesfout ? e.message : 'Kan dit niet lezen.')}</span>`; }
}
function splitsCo(inp) {
    if (inp.dataset.pre === undefined) return false;
    const m = inp.value.match(/^\s*\(?\s*([^;,()]+?)\s*[;,]\s*([^;,()]+?)\s*[;,]\s*([^;,()]+?)\s*\)?\s*$/) || inp.value.match(/^\s*\(\s*([^;]+?)\s*;\s*([^;]+?)\s*;\s*([^;]+?)\s*\)\s*$/);
    if (!m) return false;
    const deel = inp.closest('.deel'), pre = inp.dataset.pre;
    XYZ.forEach((c, i) => { deel.querySelector(`[data-k="${pre}${c}"]`).value = m[i + 1]; });
    deel.querySelector(`[data-k="${pre}z"]`).focus();
    return true;
}

// controle voor de zelftest: bestaan alle oefeningen, lukt de LaTeX van de kernideeën, kloppen de overgangen?
function lpControle(fouten) {
    for (const x of LP) {
        [x.B, ...x.Z].forEach(id => { if (!GEN.some(g => g.id === id)) fouten.push(['leerpad', x.id, 'oefening ontbreekt', id]); });
        if (!LP_ETAPPES.some(e => e.id === x.etappe)) fouten.push(['leerpad', x.id, 'etappe', x.etappe]);
        try { wis(x.kern); } catch (e) { fouten.push(['leerpad', x.id, 'latex kernidee', e.message]); }
    }
    const nieuw = () => ({ fase: 'B', klaar: false, wankel: false, bH: 0, zH: 0, n: 0, g: 0 });
    const reeks = (stappen) => { const s = nieuw(); let fase = 'B'; const uit = []; for (const [soort, st] of stappen) { const og = lpOvergang(s, soort === 'herhaal' || soort === 'snel' ? 'Z' : fase, soort, st); uit.push(og.uit); if (og.fase) fase = og.fase; } return { s, uit }; };
    const verwacht = [
        [[['leer', 'g'], ['leer', 'g']], ['b-ok', 'z-ok'], s => s.klaar && !s.wankel],
        [[['leer', 'h'], ['leer', 'h'], ['leer', 'g']], ['b-hulp', 'b-hulp-door', 'z-ok'], s => s.klaar],
        [[['leer', 'f'], ['leer', 'g'], ['leer', 'f'], ['leer', 'g'], ['leer', 'g']], ['b-fout', 'b-ok', 'z-fout', 'b-ok', 'z-ok'], s => s.klaar],
        [[['leer', 'g'], ['leer', 'h'], ['leer', 'h']], ['b-ok', 'z-hulp', 'z-hulp-door'], s => s.klaar && s.wankel],
        [[['snel', 'g']], ['snel-ok'], s => s.klaar],
        [[['snel', 'f']], ['z-fout'], s => !s.klaar && s.fase === 'B'],
        [[['leer', 'g'], ['leer', 'g'], ['herhaal', 'f']], ['b-ok', 'z-ok', 'herhaal-fout'], s => !s.klaar && s.fase === 'B'],
    ];
    verwacht.forEach(([stappen, uit, check], i) => {
        const r = reeks(stappen);
        if (JSON.stringify(r.uit) !== JSON.stringify(uit) || !check(r.s)) fouten.push(['leerpad', 'overgang ' + i, JSON.stringify(r.uit), JSON.stringify(r.s)]);
    });
    Object.keys(LP_TEKST).forEach(k => { try { wis(LP_TEKST[k][2]); } catch (e) { fouten.push(['leerpad', 'tekst ' + k, e.message]); } });
}

// ===================== TOETS =====================
function gewogenKeuze(r, lijst, gewicht) {
    const w = lijst.map(gewicht), som = w.reduce((a, b) => a + b, 0);
    let x = r.r() * som;
    for (let i = 0; i < lijst.length; i++) { x -= w[i]; if (x <= 0) return lijst[i]; }
    return lijst[lijst.length - 1];
}
function kiesToets(cats, totaal, niveau, seed) {
    const r = new Rnd(seed);
    const vragen = [], gebruikt = new Set(), perCat = {};
    let rest = totaal, inzicht = 0;
    const maxInzicht = Math.max(1, Math.floor(totaal / 5));
    const GEWICHT = { 1: 0.35, 2: 0.45, 3: 0.2 };
    for (let poging = 0; rest > 0 && poging < 3000; poging++) {
        let pool = GEN.filter(g => !g.lp && cats.includes(g.cat) && !gebruikt.has(g.id));
        if (inzicht >= maxInzicht) pool = pool.filter(g => !g.inzicht);
        if (niveau) { const p = pool.filter(g => g.niveau === niveau); if (p.length) pool = p; }
        if (!pool.length) { gebruikt.clear(); continue; }
        if (cats.length > 1) { const min = Math.min(...cats.map(c => perCat[c] || 0)); const p = pool.filter(g => (perCat[g.cat] || 0) === min); if (p.length) pool = p; }
        const g = gewogenKeuze(r, pool, x => niveau ? 1 : GEWICHT[x.niveau] / pool.filter(y => y.niveau === x.niveau).length);
        let o;
        try { o = maakOefening(g, r.int(1, 2147483646)); } catch (e) { gebruikt.add(g.id); continue; }
        if (o.punten > rest) { gebruikt.add(g.id); continue; }
        vragen.push(o); rest -= o.punten; gebruikt.add(g.id);
        perCat[g.cat] = (perCat[g.cat] || 0) + 1;
        if (g.inzicht) inzicht++;
    }
    vragen.sort((a, b) => a.gen.niveau - b.gen.niveau);
    return vragen;
}
function startToets() {
    const cats = ST.toetsCat === 'mix' ? CATS.map(c => c.id) : [ST.toetsCat];
    const vragen = kiesToets(cats, ST.toetsPunten, ST.toetsNiveau, nieuwZaad());
    ST.toets = { vragen, waarden: vragen.map(v => v.delen.map(() => ({}))), huidig: 0, cat: ST.toetsCat, totaal: ST.toetsPunten, niveau: ST.toetsNiveau, start: new Date(), klaar: false, toonUitw: true };

    });

// ===================== PDF (rechtstreeks downloaden) =====================
const PDF_BREEDTE_PX = 700, PDF_BREEDTE_MM = 186, PDF_MARGE_MM = 12, PDF_NUTTIG_MM = 268;
async function downloadPdf(blokken, bestandsnaam) {
    const status = document.getElementById('pdf-status');
    const knoppen = [...APP.querySelectorAll('[data-act="toetsrapport"],[data-act="oefenrapport"]')];
    const zet = t => { if (status) status.textContent = t; };
    if (!window.html2canvas || !window.jspdf) { zet('Het PDF-rapport kan niet gemaakt worden: de PDF-bibliotheek is niet geladen. Controleer je internetverbinding en herlaad de pagina.'); return; }
    knoppen.forEach(k => { k.disabled = true; });
    const bron = document.getElementById('pdf-bron');
    try {
        zet('Rapport wordt gemaakt…');
        bron.className = 'pdf-bron rapport';
        bron.innerHTML = blokken.map((b, i) => `<div class="u" data-i="${i}">${b.html}</div>`).join('');
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        const eenheden = [...bron.children];
        const hoogtes = eenheden.map(u => u.getBoundingClientRect().height);
        const maxPx = Math.floor(PDF_NUTTIG_MM * PDF_BREEDTE_PX / PDF_BREEDTE_MM);
        // blokken die bij het volgende horen samenhouden
        const brokken = [];
        let huidig = [];
        eenheden.forEach((u, i) => { huidig.push(i); if (!blokken[i].vast) { brokken.push(huidig); huidig = []; } });
        if (huidig.length) brokken.push(huidig);
        const paginas = [];
        let pagina = [], h = 0;
        brokken.forEach(b => {
            const bh = b.reduce((s, i) => s + hoogtes[i], 0);
            if (pagina.length && h + bh > maxPx) { paginas.push(pagina); pagina = []; h = 0; }
            pagina.push(...b); h += bh;
        });
        if (pagina.length) paginas.push(pagina);
        const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
        for (let p = 0; p < paginas.length; p++) {
            zet(`Rapport wordt gemaakt… (pagina ${p + 1} van ${paginas.length})`);
            const pg = document.createElement('div');
            pg.className = 'pdf-pagina rapport';
            paginas[p].forEach(i => pg.appendChild(eenheden[i].cloneNode(true)));
            // een nieuwe pagina die midden in een vraag begint: bovenaan geen afgeronde hoek nodig
            document.body.appendChild(pg);
            let canvas;
            try {
                canvas = await window.html2canvas(pg, { scale: 2, backgroundColor: '#ffffff', logging: false, x: 0, y: 0, scrollX: 0, scrollY: 0, ignoreElements: n => n.parentNode === document.body && n !== pg });
            } finally { document.body.removeChild(pg); }
            let b = PDF_BREEDTE_MM, hh = canvas.height / canvas.width * b;
            if (hh > PDF_NUTTIG_MM) { b *= PDF_NUTTIG_MM / hh; hh = PDF_NUTTIG_MM; }
            if (p > 0) pdf.addPage();
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', PDF_MARGE_MM, PDF_MARGE_MM, b, hh);
            pdf.setFontSize(8); pdf.setTextColor(113, 128, 150);
            pdf.text(`Pagina ${p + 1} van ${paginas.length}`, 105, 290, { align: 'center' });
            pdf.text('© T. Gaerdelen', 198, 290, { align: 'right' });
            if (leerlingCode()) pdf.text(leerlingCode(), 12, 290);
        }
        pdf.save(bestandsnaam);
        zet('Het rapport is gedownload (kijk bij je downloads).');
    } catch (e) {
        console.error(e);
        zet('Het rapport kon niet gemaakt worden. Probeer het opnieuw (controleer je internetverbinding).');
    } finally {
        bron.innerHTML = '';
        knoppen.forEach(k => { k.disabled = false; });
    }
}

function renderTheorie() {
