    let s = `<div class="kaart"><div class="balk theorie"><button class="terug" data-act="menu">← Menu</button><h2>Theorie &amp; voorbeelden · ${esc(CAT[cat].naam)}</h2><button class="terug" data-act="oefen-cat" data-cat="${cat}">Oefenen →</button></div><div class="kaart-binnen">
        <p class="grijs">Hieronder vind je de werkwijze uit de cursus. Klik op een voorbeeldknop: de app maakt telkens een nieuw voorbeeld en werkt het volledig uit.</p>`;
    blokken.forEach((b, bi) => {
        s += `<div class="theorie-blok" id="tb${bi}"><h3>${b.titel}</h3>${wis(b.html)}<div class="voorbeeld-knoppen">${b.gens.filter(id => GEN.some(g => g.id === id)).map(id => `<button class="knop knop-klein knop-blauw-licht" data-act="tvoorbeeld" data-b="${bi}" data-id="${id}">Voorbeeld: ${esc(GEN.find(g => g.id === id).titel)}</button>`).join('')}</div>${ST.tvb && ST.tvb.b === bi ? voorbeeldHtml(ST.tvb.inst, true) : ''}</div>`;
    });
    APP.innerHTML = s + '</div></div>';
}

// ===================== hoofdweergave en gebeurtenissen =====================
function render() {
    switch (ST.scherm) {
        case 'oefen': renderOefen(); break;
        case 'toets': renderToets(); break;
        case 'uitslag': renderUitslag(); break;
        case 'theorie': renderTheorie(); break;
        default: renderMenu();
    }
}
let laatsteVeld = null;
APP.addEventListener('focusin', e => { if (e.target.matches('input.invoer')) laatsteVeld = e.target; });
APP.addEventListener('input', e => {
    const inp = e.target;
    if (inp.matches('input.invoer')) {
        if (!splitsCo(inp)) werkPreviewBij(inp); else werkPreviewBij(inp);
        if (ST.scherm === 'toets') bewaarToetsWaarden();
        const deel = inp.closest('.deel');
        if (deel && ST.scherm === 'oefen') { deel.querySelectorAll('.fb-plek').forEach(f => { if (f.firstChild && f.firstChild.classList.contains('info')) f.innerHTML = ''; }); }
    }
});
APP.addEventListener('change', e => {
    const inp = e.target;
    if (inp.type === 'radio') {
        const deel = inp.closest('.deel');
        deel.querySelectorAll('.optie').forEach(o => o.classList.toggle('gekozen', o.contains(inp) ));
        deel.querySelectorAll('[data-als]').forEach(blok => blok.classList.toggle('verborgen', String(inp.value) !== blok.dataset.als));
        if (ST.scherm === 'toets') bewaarToetsWaarden();
    }
    if (inp.type === 'checkbox' && inp.dataset.act === 'type') {
        const o = ST.oefen; o.typesOpen = true;
        if (inp.checked) o.uit.delete(inp.dataset.id); else o.uit.add(inp.dataset.id);
        bewaarOefenWaarden();
        if (!o.inst || o.uit.has(o.inst.gen.id)) nieuweOefening(); else render();
    }
    if (inp.type === 'checkbox' && inp.dataset.act === 'toonuitw') { ST.toets.toonUitw = inp.checked; APP.querySelector('.rapport').classList.toggle('verberg-uitw', !inp.checked); }
});
APP.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches('input.invoer') && ST.scherm === 'oefen' && ST.oefen && !ST.oefen.klaar) { e.preventDefault(); controleerOefening(); }
});
APP.addEventListener('toggle', e => {
    if (e.target.matches && e.target.matches('details[data-types]') && ST.oefen) ST.oefen.typesOpen = e.target.open;
    if (e.target.matches && e.target.matches('details[data-kern]') && ST.oefen && ST.oefen.lp) ST.oefen.lp.kernOpen = e.target.open;
}, true);
APP.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled || b.type === 'checkbox') return;
    const act = b.dataset.act;
    switch (act) {
        case 'modus': ST.modus = b.dataset.m; opslag.schrijf('modus', ST.modus); renderMenu(); break;
        case 'cat': {
            const c = b.dataset.cat;
            if (ST.modus === 'theorie') { ST.theorieCat = c; ST.tvb = null; ST.scherm = 'theorie'; render(); window.scrollTo({ top: 0 }); }
            else if (ST.modus === 'oefen') startOefen(c);
            else { ST.toetsCat = c; renderMenu(); const k = APP.querySelector('[data-act="starttoets"]'); if (k) k.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
            break;
        }
        case 'tpunten': ST.toetsPunten = +b.dataset.p; renderMenu(); break;
        case 'tniveau': ST.toetsNiveau = +b.dataset.n; renderMenu(); break;
        case 'starttoets': startToets(); break;
        case 'menu':
            if (ST.scherm === 'oefen' && ST.oefen && ST.oefen.inst && !ST.oefen.klaar && (ST.oefen.pogingen || ST.oefen.uitwerking)) logOefening('f');
            ST.scherm = 'menu'; render(); window.scrollTo({ top: 0 }); break;
        case 'niveau': bewaarOefenWaarden(); ST.oefen.niveau = +b.dataset.n; nieuweOefening(); break;
        case 'types-alle': ST.oefen.uit.clear(); ST.oefen.typesOpen = true; render(); break;
        case 'types-geen': GEN.filter(g => !g.lp && (ST.oefen.cat === 'mix' || g.cat === ST.oefen.cat)).forEach(g => ST.oefen.uit.add(g.id)); ST.oefen.typesOpen = true; nieuweOefening(); break;
        case 'controleer': controleerOefening(); break;
        case 'hint': bewaarOefenWaarden(); ST.oefen.hints++; render(); { const hl = APP.querySelector('.hulp'); if (hl) hl.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } break;
        case 'uitwerking': bewaarOefenWaarden(); ST.oefen.uitwerking = !ST.oefen.uitwerking; render(); if (ST.oefen.uitwerking) { const u = APP.querySelector('.uitwerking'); if (u) u.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } break;
        case 'voorbeeld': bewaarOefenWaarden(); { const o = ST.oefen; o.voorbeeld = o.voorbeeld ? null : maakOefening(o.inst.gen, nieuwZaad()); render(); const v = APP.querySelector('.voorbeeld-vak'); if (v) v.scrollIntoView({ behavior: 'smooth', block: 'start' }); } break;
        case 'volgende': {
            const o = ST.oefen;
            if (o.inst && !o.klaar && (o.pogingen || o.uitwerking || o.hints)) logOefening('f');
            nieuweOefening(); break;
        }
        case 'ins': {
            const deel = b.closest('.deel');
            let inp = laatsteVeld && deel.contains(laatsteVeld) && !laatsteVeld.disabled ? laatsteVeld : deel.querySelector('input.invoer:not([disabled])');
            if (!inp) break;
            const t = b.dataset.t, a = inp.selectionStart ?? inp.value.length, z = inp.selectionEnd ?? inp.value.length;
            inp.value = inp.value.slice(0, a) + t + inp.value.slice(z);
            inp.focus(); inp.setSelectionRange(a + t.length, a + t.length);
            inp.dispatchEvent(new Event('input', { bubbles: true }));
            break;
        }
        case 'oefenrapport': if (!ST.log.length) { const s = document.getElementById('pdf-status'); if (s) s.textContent = 'Er zijn nog geen afgewerkte oefeningen om in het rapport te zetten.'; break; } downloadPdf(oefenBlokken(), bestandsNaam('Oefenrapport')); break;
        case 'toetsrapport': downloadPdf(toetsBlokken(), bestandsNaam('Toets')); break;
        case 'vorige': bewaarToetsWaarden(); ST.toets.huidig--; render(); window.scrollTo({ top: 0 }); break;
        case 'volgendevraag': bewaarToetsWaarden(); ST.toets.huidig++; render(); window.scrollTo({ top: 0 }); break;
        case 'gaNaar': bewaarToetsWaarden(); ST.toets.huidig = +b.dataset.i; render(); window.scrollTo({ top: 0 }); break;
        case 'inleveren': {
            bewaarToetsWaarden();
            const t = ST.toets;
            const leeg = t.vragen.reduce((s, v, qi) => s + v.delen.filter((d, di) => isLeeg(t.waarden[qi][di])).length, 0);
            if (leeg && !window.confirm(`Je hebt nog ${leeg} deelvra${leeg === 1 ? 'ag' : 'gen'} niet ingevuld. Wil je toch inleveren?`)) break;
            nakijkenToets(); break;
        }
        case 'stoptoets': if (window.confirm('Wil je de toets stoppen? Je antwoorden gaan verloren.')) { ST.scherm = 'menu'; ST.toets = null; render(); } break;
        case 'opnieuwtoets': ST.scherm = 'menu'; ST.modus = 'toets'; render(); break;
        case 'tvoorbeeld': {
            const g = GEN.find(x => x.id === b.dataset.id);
            ST.tvb = { b: +b.dataset.b, inst: maakOefening(g, nieuwZaad()) };
            renderTheorie();
            const v = APP.querySelector('.voorbeeld-vak'); if (v) v.scrollIntoView({ behavior: 'smooth', block: 'start' });
            break;
        }
        case 'tvoorbeeld-opnieuw': ST.tvb.inst = maakOefening(ST.tvb.inst.gen, nieuwZaad()); renderTheorie(); { const v = APP.querySelector('.voorbeeld-vak'); if (v) v.scrollIntoView({ block: 'start' }); } break;
        case 'lp-start': bewaarOefenWaarden(); lpStart(b.dataset.id); break;
        case 'lp-snel': lpStart(ST.oefen.lp.id, 'snel'); break;
        case 'lp-herhaal': {
            const d = lpLees();
            const klaar = LP.filter(x => d.st[x.id] && d.st[x.id].klaar), wankel = klaar.filter(x => d.st[x.id].wankel);
            const pool = wankel.length ? wankel : klaar;
            if (pool.length) lpStart(pool[Math.floor(Math.random() * pool.length)].id, 'herhaal');
            break;
        }
        case 'lp-verder': {
            const o = ST.oefen;
            if (!o.klaar) { bewaarOefenWaarden(); o.klaar = true; logOefening('f'); lpVerwerk('f'); render(); { const f = APP.querySelector('.actie-rij'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'center' }); } break; }
            const v = o.lp.na && o.lp.na.volg;
            if (!v) { ST.scherm = 'menu'; ST.modus = 'leerpad'; render(); window.scrollTo({ top: 0 }); break; }
            if (v.id === o.lp.id && v.fase) {
                if (o.lp.fase !== v.fase) o.lp.vorigeZ = null;
                o.lp.fase = v.fase; o.lp.soort = 'leer'; o.lp.kernOpen = false;
                lpNieuweOefening();
            } else lpStart(v.id, v.soort === 'herhaal' ? 'herhaal' : null);
            break;
        }
        case 'lp-kaart':
            if (ST.oefen && ST.oefen.inst && !ST.oefen.klaar && (ST.oefen.pogingen || ST.oefen.uitwerking)) logOefening('f');
            ST.scherm = 'menu'; ST.modus = 'leerpad'; opslag.schrijf('modus', 'leerpad'); render(); window.scrollTo({ top: 0 }); break;
        case 'lp-reset':
            if (window.confirm('Wil je het leerpad opnieuw beginnen? Je voortgang in het leerpad wordt gewist.')) { opslag.schrijf(lpSleutel(), null); renderMenu(); }
            break;
        case 'oefen-cat': startOefen(b.dataset.cat); break;
        case 'oefen-gen': { const g = GEN.find(x => x.id === b.dataset.id); startOefen(g.cat, g.id); break; }
    }
});
window.addEventListener('beforeunload', e => { if (ST.scherm === 'toets' && ST.toets && !ST.toets.klaar) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('DOMContentLoaded', () => render());
if (document.readyState !== 'loading') render();
</script>

<!-- =====================================================================
     10. ZELFTEST (in de console: RM.zelftest())
     ===================================================================== -->
<script>
// De zelftest maakt van elke soort oefening veel exemplaren en controleert:
//  - dat de opgave, hints, uitwerking en antwoorden zonder LaTeX-fouten getoond worden,
//  - dat het juiste antwoord (in verschillende gelijkwaardige vormen) goedgekeurd wordt,
//  - dat foute antwoorden afgekeurd worden,
//  - dat de gegevens van de opgave voldoen aan de voorwaarden van het antwoord.
const RM = (() => {
    function variaties(d, r) {
        const goed = [], fout = [];
        const co = v => ({ x: v[0], y: v[1], z: v[2] });
        switch (d.type) {
            case 'punt': case 'vector': {
                const J = d.juistTxt;
                if (d.juist.some(x => !Number.isInteger(x))) goed.push(co(d.juist.map(x => x.toFixed(4))));
                const f = [...J]; const i = r.int(0, 2); f[i] = `(${f[i]})+1`; fout.push(co(f));
                break;
            }
            case 'richting': {
                const R = d.juist; goed.push(co(R.map(x => String(-2 * x)))); goed.push(co(R.map(x => `(${x})/3`)));
                const f = [...R]; f[r.int(0, 2)] += 1; if (!nPar(f, R)) fout.push(co(f.map(String)));
                fout.push(co(['0', '0', '0']));
                break;
            }
            case 'puntOpRechte': {
                const t = TXT.co(vmin(d.P, vmaal(d.R, 3))); goed.push(co(t));
                const w = vprim(vcross(d.R, EEN[[0, 1, 2].find(i => !vpar(d.R, EEN[i]))]));
                fout.push(co(TXT.co(vplus(d.P, w))));
                break;
            }
            case 'punten': {
                const o = {}; const n = d.lijst.length;
                d.lijst.forEach((p, j) => XYZ.forEach((k, i) => { o['p' + ((j + 1) % n) + k] = p.juistTxt[i]; }));
                const verwisseld = d.lijst.length === 2 && !d.lijst[0].juist.every((x, i) => bijna(x, d.lijst[1].juist[i]));
                if (!d.orde) goed.push(o); else if (verwisseld) fout.push(o);
                const f = TYPES.punten.invoer(d); f.p0x = `(${f.p0x})+1`; fout.push(f);
                break;
            }
            case 'getal': {
                if (!Number.isInteger(d.juist)) goed.push({ g: d.juist.toFixed(4) });
                fout.push({ g: String(d.juist + 1.37) });
                if (Math.abs(-d.juist - 0.5 - d.juist) > 1e-6) fout.push({ g: String(-d.juist - 0.5) });
                break;
            }
            case 'hoek': goed.push({ g: dmsTex(d.juist).replace(/\^\\circ/, '°').replace(/''/, '"') }); fout.push({ g: (d.juist + 2).toFixed(2) }); break;
            case 'vlak': {
                goed.push({ v: TXT.vlak(vmaal(d.n, -2), d.t.maal(-2)) });
                goed.push({ v: TXT.vlak(vmaal(d.n, F(3, 2)), d.t.maal(F(3, 2))) });
                goed.push({ v: `${linTxt(d.n, XYZ)} = ${d.t.neg().txt()}` });
                fout.push({ v: TXT.vlak(d.n, d.t.plus(1)) });
                const n2 = [...d.n]; n2[r.int(0, 2)] = n2[0].plus(1); if (!vpar(n2, d.n)) fout.push({ v: TXT.vlak(n2, d.t) });
                break;
            }
            case 'vlakken': {
                if (d.lijst.length === 2) goed.push({ v0: TXT.vlak(d.lijst[1].n, d.lijst[1].t), v1: TXT.vlak(vmaal(d.lijst[0].n, 2), d.lijst[0].t.maal(2)) });
                fout.push({ v0: TXT.vlak(d.lijst[0].n, d.lijst[0].t.plus(1)), v1: TXT.vlak(d.lijst[1].n, d.lijst[1].t.plus(1)) });
                break;
            }
            case 'rechteParam': {
                const t = TXT.param(vplus(d.P, vmaal(d.R, 2)), vmaal(d.R, -3), 't'); goed.push(co(t));
                const w = vprim(vcross(d.R, EEN[[0, 1, 2].find(i => !vpar(d.R, EEN[i]))]));
                fout.push(co(TXT.param(vplus(d.P, w), d.R)));
                fout.push(co(TXT.param(d.P, vplus(d.R, w))));
                break;
            }
            case 'rechteCart': {
                const t = TXT.cart(vmin(d.P, d.R), vmaal(d.R, 2)); goed.push({ r1: t[0], r2: t[1] || '' });
                const nn = [0, 1, 2].map(i => vprim(vcross(d.R, EEN[i]))).filter(v => !visNul(v));
                const a = nn[0], b = nn.find(v => !vpar(v, a));
                goed.push({ r1: TXT.vlak(a, vdot(a, d.P).neg()), r2: TXT.vlak(b, vdot(b, d.P).neg()) });
                const w = vprim(vcross(d.R, EEN[[0, 1, 2].find(i => !vpar(d.R, EEN[i]))]));
                const f = TXT.cart(vplus(d.P, w), d.R); fout.push({ r1: f[0], r2: f[1] || '' });
                fout.push({ r1: TXT.vlak(a, vdot(a, d.P).neg()), r2: '' });
                break;
            }
            case 'vlakParam': {
                const t = TXT.vlakParam(vmin(vplus(d.P0, d.R0), d.S0), vplus(d.R0, d.S0), vmin(d.R0, vmaal(d.S0, 2))); goed.push(co(t));
                fout.push(co(TXT.vlakParam(vplus(d.P0, d.n), d.R0, d.S0)));
                fout.push(co(TXT.vlakParam(d.P0, d.n, d.S0)));
                break;
            }
            case 'bol': {
                const alg = `x^2 + y^2 + z^2 + ${linTxt(vmaal(d.M, -2), XYZ, vkwad(d.M).min(d.r2))} = 0`.replace('+ -', '- ');
                goed.push({ v: alg });
                goed.push({ v: `2x^2 + 2y^2 + 2z^2 + ${linTxt(vmaal(d.M, -4), XYZ, vkwad(d.M).min(d.r2).maal(2))} = 0` });
                fout.push({ v: TYPES.bol.invoer(d).v.replace(/= [^=]+$/, `= ${d.r2.plus(1).txt()}`) });
                break;
            }
            case 'keuze': d.opties.forEach((o, i) => { if (i !== d.juist) fout.push({ k: String(i) }); }); break;
            case 'ligging': d.opties.forEach((o, i) => { if (i !== d.juist) fout.push({ k: String(i), px: '0', py: '0', pz: '0' }); }); break;
        }
        return { goed, fout };
    }
    function gegevensKloppen(d) {
        if (d.type === 'vlak' && d.vw) {
            const m = vlakMeldingen(num(d.n), num(d.t), d.vw);
            if (m.length) return 'voorwaarden vlak: ' + m.join(' | ');
        }
        return null;
    }
    function zelftest(n = 40, filter = null) {
        KATEX_STRIKT = true;
        const fouten = [], tellers = {};
        const t0 = performance.now();
        for (const g of GEN) {
            if (filter && !g.id.includes(filter)) continue;
            tellers[g.id] = 0;
            for (let s = 1; s <= n; s++) {
                const seed = (hashTekst(g.id) + s * 7919) >>> 0;
                let o;
                try { o = maakOefening(g, seed); } catch (e) { fouten.push([g.id, seed, 'maak', e.message]); continue; }
                tellers[g.id]++;
                try {
                    wis(o.opgave); o.hints.forEach(h => wis(h)); o.stappen.forEach(x => wis(String(x).replace(/^[!>]/, '')));
                    o.delen.forEach(d => { wis(d.vraag); if (d.juistTex) kt(d.juistTex, true); (d.opties || []).forEach(op => { wis(op.t); wis(op.uitleg); }); });
                } catch (e) { fouten.push([g.id, seed, 'latex', e.message]); }
                const r = new Rnd(seed ^ 0x5bd1e995);
                o.delen.forEach((d, j) => {
                    if (!TYPES[d.type]) { fouten.push([g.id, seed, 'type', d.type]); return; }
                    const gk = gegevensKloppen(d);
                    if (gk) fouten.push([g.id, seed, 'gegevens' + j, gk]);
                    const proef = (w, moet, wat) => {
                        let res;
                        try { res = TYPES[d.type].controleer(d, w); } catch (e) { res = { ok: false, msg: 'FOUT: ' + e.message, leesfout: !!e.leesfout }; }
                        if (res.ok !== moet) fouten.push([g.id, seed, `${wat} deel ${j} (${d.type})`, res.msg, JSON.stringify(w)]);
                        if (res.ok && moet) { try { const t = TYPES[d.type].toon(d, w); if (t) kt(t); else TYPES[d.type].toonHtml(d, w); } catch (e) { fouten.push([g.id, seed, 'toon' + j, e.message]); } }
                    };
                    proef(TYPES[d.type].invoer(d), true, 'juist');
                    const v = variaties(d, r);
                    v.goed.forEach(w => proef(w, true, 'variant-juist'));
                    v.fout.forEach(w => proef(w, false, 'variant-fout'));
                });
            }
        }
        if (!filter || filter === 'leerpad') lpControle(fouten);
        KATEX_STRIKT = false;
        const tijd = Math.round(performance.now() - t0);
        console.log(`Zelftest: ${GEN.length} soorten, ${n} exemplaren per soort, ${fouten.length} problemen, ${tijd} ms`);
        return { fouten, tellers, tijd };
    }
    return { zelftest, variaties };
})();
</script>
