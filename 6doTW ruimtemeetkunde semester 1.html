<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6doTW ruimtemeetkunde semester 1</title>
<!-- Externe bibliotheken (vaste versies):
     KaTeX voor de wiskundige weergave, html2canvas + jsPDF voor het PDF-rapport.
     Zonder internet werkt de app ook, maar dan worden formules als tekst getoond
     en kan het rapport enkel afgedrukt worden. -->
<link rel="stylesheet" href="lib/katex/katex.min.css">
<script src="lib/katex/katex.min.js"></script>
<script defer src="lib/html2canvas-1.4.1.min.js"></script>
<script defer src="lib/jspdf-2.5.1.umd.min.js"></script>
<style>
    :root {
        --bg: #f1f5f9; --kaart: #ffffff; --rand: #e2e8f0; --tekst: #1e293b; --zacht: #64748b; --heel-zacht: #94a3b8;
        --blauw: #1e3a8a; --blauw-licht: #eff6ff; --blauw-rand: #bfdbfe;
        --groen: #059669; --groen-donker: #047857; --groen-licht: #ecfdf5; --groen-rand: #a7f3d0;
        --rood: #e11d48; --rood-donker: #be123c; --rood-licht: #fff1f2; --rood-rand: #fecdd3;
        --oranje-licht: #fffbeb; --oranje-rand: #fde68a; --oranje-tekst: #92400e;
        --paars: #4f46e5; --paars-licht: #eef2ff; --paars-rand: #c7d2fe;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--tekst); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.45; }
    #app { max-width: 960px; margin: 0 auto; padding: 16px 16px 56px; }
    button { font: inherit; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
    p { margin: 0 0 8px; }
    .kaart { background: var(--kaart); border: 1px solid var(--rand); border-radius: 16px; box-shadow: 0 4px 18px rgba(15, 23, 42, .06); }
    .kaart-binnen { padding: 20px; }
    .grijs { color: var(--zacht); }
    .klein { font-size: .85rem; }
    .verborgen { display: none !important; }
    .katex { font-size: 1.08em; }
    .katex-display { margin: .5em 0; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }

    /* ---------- knoppen ---------- */
    .knop { border: none; border-radius: 12px; padding: 11px 16px; font-weight: 700; transition: background .15s, transform .05s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .knop:active:not(:disabled) { transform: translateY(1px); }
    .knop-groen { background: var(--groen); color: #fff; } .knop-groen:hover:not(:disabled) { background: var(--groen-donker); }
    .knop-rood { background: var(--rood); color: #fff; } .knop-rood:hover:not(:disabled) { background: var(--rood-donker); }
    .knop-blauw { background: var(--blauw); color: #fff; } .knop-blauw:hover:not(:disabled) { background: #172554; }
    .knop-donker { background: #1e293b; color: #fff; } .knop-donker:hover:not(:disabled) { background: #0f172a; }
    .knop-licht { background: #fff; color: var(--tekst); border: 1px solid var(--rand); } .knop-licht:hover:not(:disabled) { background: #f8fafc; }
    .knop-blauw-licht { background: var(--blauw-licht); color: var(--blauw); border: 1px solid var(--blauw-rand); } .knop-blauw-licht:hover:not(:disabled) { background: #dbeafe; }
    .knop-geel { background: #fef9c3; color: #854d0e; border: 1px solid #fde047; } .knop-geel:hover:not(:disabled) { background: #fef08a; }
    .knop-groot { padding: 15px 22px; font-size: 1.08rem; }
    .knop-klein { padding: 7px 11px; font-size: .88rem; border-radius: 9px; }
    .knop-rij { display: flex; flex-wrap: wrap; gap: 10px; }
    .linkknop { background: none; border: none; padding: 0; color: #2563eb; font-weight: 600; text-decoration: underline; }

    /* ---------- menu ---------- */
    .kop { text-align: center; padding: 24px 20px 6px; }
    .kop h1 { color: var(--blauw); font-size: 1.95rem; font-weight: 800; }
    .kop p { margin: 6px 0 0; color: var(--zacht); }
    .naam-rij { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .naam-rij .veld { flex: 1 1 200px; }
    .veld { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; font-weight: 600; color: #475569; }
    .veld input, .veld select { font: inherit; font-weight: 500; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; }
    .modus-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 18px; }
    @media (max-width: 900px) { .modus-grid { grid-template-columns: repeat(2, 1fr); } }
    .modus { border-radius: 14px; padding: 16px; border: 2px solid var(--rand); background: #fff; text-align: left; display: flex; flex-direction: column; gap: 4px; }
    .modus b { font-size: 1.08rem; }
    .modus span { font-size: .86rem; color: var(--zacht); font-weight: 500; }
    .modus.theorie { border-color: var(--paars-rand); background: var(--paars-licht); } .modus.theorie b { color: var(--paars); }
    .modus.oefen { border-color: var(--groen-rand); background: var(--groen-licht); } .modus.oefen b { color: var(--groen-donker); }
    .modus.toets { border-color: var(--rood-rand); background: var(--rood-licht); } .modus.toets b { color: var(--rood-donker); }
    .modus.aan { box-shadow: 0 0 0 3px rgba(30, 58, 138, .25); }
    /* leerpad */
    .modus.leerpad { border-color: #99f6e4; background: #f0fdfa; } .modus.leerpad b { color: #0f766e; }
    .balk.leerpad { background: #0f766e; }
    .lp-intro { margin-top: 18px; padding: 14px 16px; border-radius: 14px; background: #f0fdfa; border: 1px solid #99f6e4; }
    .lp-intro p { margin: 0; }
    .lp-voortgang { height: 10px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin: 12px 0 4px; }
    .lp-voortgang > span { display: block; height: 100%; background: #0f766e; border-radius: 99px; }
    .lp-etappe h3 { font-size: 1rem; margin: 20px 0 8px; color: #334155; }
    .lp-stap { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: #fff; border: 2px solid var(--rand); border-radius: 12px; padding: 9px 12px; margin-bottom: 8px; }
    .lp-stap:hover { border-color: #94a3b8; }
    .lp-stap.volgende { border-color: #0f766e; box-shadow: 0 0 0 3px rgba(15, 118, 110, .15); }
    .lp-nr { flex: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; background: #e2e8f0; color: #475569; }
    .lp-stap.klaar .lp-nr { background: var(--groen); color: #fff; }
    .lp-stap.wankel .lp-nr { background: #f59e0b; color: #fff; }
    .lp-stap.bezig .lp-nr { background: #ccfbf1; color: #0f766e; }
    .lp-stap b { display: block; font-size: .96rem; }
    .lp-stap small { display: block; color: var(--zacht); font-size: .8rem; margin-top: 1px; }
    .lp-badge { margin-left: auto; font-size: .76rem; font-weight: 700; color: var(--zacht); text-align: right; }
    .lp-stap.klaar .lp-badge { color: var(--groen-donker); } .lp-stap.wankel .lp-badge { color: #b45309; }
    .lp-fasen { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 16px; background: #f0fdfa; border-bottom: 1px solid var(--rand); font-size: .84rem; }
    .lp-fase { padding: 3px 10px; border-radius: 99px; background: #fff; border: 1px solid #cbd5e1; color: #64748b; font-weight: 600; }
    .lp-fase.aan { background: #0f766e; border-color: #0f766e; color: #fff; }
    .lp-fase.ok { background: var(--groen-licht); border-color: var(--groen-rand); color: var(--groen-donker); }
    .kern { margin: 0 0 14px; border: 1px solid #99f6e4; background: #f0fdfa; border-radius: 12px; padding: 10px 14px; }
    .kern summary { cursor: pointer; font-weight: 800; color: #0f766e; }
    .kern ul { margin: 8px 0 0 18px; padding: 0; } .kern li { margin: 5px 0; }
    .lp-slot { margin-top: 10px; padding: 8px 12px; border: 1px dashed #cbd5e1; border-radius: 10px; color: var(--zacht); font-size: .88rem; }
    .sectie-titel { font-size: 1.05rem; color: #334155; margin: 20px 0 10px; font-weight: 800; }
    .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .cat { display: flex; gap: 12px; align-items: flex-start; text-align: left; background: #fff; border: 2px solid var(--rand); border-radius: 14px; padding: 12px 14px; }
    .cat:hover { border-color: #94a3b8; }
    .cat.aan { border-color: var(--blauw); background: var(--blauw-licht); }
    .cat .ico { flex: none; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 800; color: #fff; }
    .cat b { display: block; font-size: .98rem; }
    .cat small { display: block; color: var(--zacht); font-size: .8rem; margin-top: 2px; }
    .cat .stat { display: block; color: var(--groen-donker); font-size: .76rem; margin-top: 4px; font-weight: 700; }
    .keuze-rij { display: flex; flex-wrap: wrap; gap: 8px; }
    .keuze { flex: 1 1 120px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--rand); background: #fff; font-weight: 700; color: #334155; text-align: center; }
    .keuze small { display: block; font-weight: 500; color: var(--zacht); margin-top: 2px; font-size: .78rem; }
    .keuze.aan { border-color: var(--blauw); background: var(--blauw-licht); color: var(--blauw); }
    .instel { background: #f8fafc; border: 1px solid var(--rand); border-radius: 14px; padding: 14px 16px; margin-top: 14px; }
    .instel h3 { font-size: .98rem; color: #334155; margin-bottom: 8px; }
    .types-lijst { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 6px; }
    .type-optie { display: flex; gap: 8px; align-items: flex-start; font-size: .88rem; background: #fff; border: 1px solid var(--rand); border-radius: 10px; padding: 7px 10px; cursor: pointer; }
    .type-optie input { margin-top: 3px; accent-color: var(--groen); }
    .type-optie .niv { margin-left: auto; flex: none; }
    .melding { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--oranje-licht); border: 1px solid var(--oranje-rand); color: var(--oranje-tekst); font-size: .92rem; }

    /* ---------- labels ---------- */
    .label { font-size: .72rem; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: #e2e8f0; color: #334155; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
    .label.n1 { background: #dcfce7; color: #166534; } .label.n2 { background: #fef9c3; color: #854d0e; } .label.n3 { background: #fee2e2; color: #991b1b; }
    .label.pt { background: #e0e7ff; color: #3730a3; }

    /* ---------- oefen- en toetsscherm ---------- */
    .balk { display: flex; align-items: center; gap: 10px; padding: 12px 16px; color: #fff; border-radius: 16px 16px 0 0; flex-wrap: wrap; }
    .balk.oefen { background: #065f46; } .balk.toets { background: #881337; } .balk.theorie { background: #3730a3; }
    .balk h2 { font-size: 1.05rem; flex: 1 1 auto; }
    .balk .terug { background: rgba(255,255,255,.14); color: #fff; border: none; border-radius: 10px; padding: 8px 12px; font-weight: 600; }
    .balk .terug:hover { background: rgba(255,255,255,.25); }
    .teller { background: rgba(255,255,255,.14); border-radius: 999px; padding: 4px 12px; font-size: .86rem; font-weight: 600; white-space: nowrap; }
    .voortgang { height: 6px; background: #fecdd3; }
    .voortgang div { height: 100%; background: var(--rood); transition: width .3s; }
    .niveau-balk { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 16px; background: #f8fafc; border-bottom: 1px solid var(--rand); font-size: .88rem; }
    .niveau-balk .keuze { flex: 0 0 auto; padding: 5px 12px; font-size: .85rem; }
    .opgave { background: #f8fafc; border: 1px solid var(--rand); border-radius: 14px; padding: 14px 16px 16px; }
    .opgave-labels { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
    .opgave-titel { font-weight: 800; color: #334155; margin-right: 4px; }
    .opgave-tekst { font-size: 1.04rem; }
    .opgave-tekst .katex-display { text-align: left; }
    .opgave-tekst .katex-display > .katex { text-align: left; }
    .formule-rij { display: flex; flex-wrap: wrap; align-items: center; column-gap: 34px; row-gap: 0; }
    .formule-deel { min-width: 0; max-width: 100%; }
    .formule-deel .katex-display { margin: .35em 0; text-align: left; }
    .formule-deel .katex-display > .katex { text-align: left; }
    .formule-en { color: var(--zacht); font-style: italic; }
    .figuur { display: flex; justify-content: center; margin: 6px 0; }
    .figuur svg { max-width: 100%; height: auto; }
    .deel { margin-top: 14px; border: 1px solid var(--rand); border-radius: 14px; padding: 12px 14px; background: #fff; }
    .deel.juist { border-color: var(--groen-rand); background: #fbfffd; }
    .deel.fout { border-color: var(--rood-rand); }
    .deel-kop { display: flex; gap: 8px; align-items: baseline; margin-bottom: 8px; }
    .deel-kop .letter { font-weight: 800; color: var(--blauw); flex: none; }
    .deel-kop .vraag { flex: 1; }
    .deel-kop .ptn { flex: none; font-size: .78rem; color: var(--zacht); font-weight: 700; }
    .invoer { padding: 10px 12px; font-size: 1.05rem; font-family: ui-monospace, Consolas, monospace; border: 2px solid #cbd5e1; border-radius: 10px; outline: none; background: #fff; min-width: 0; }
    .invoer:focus { border-color: #3b82f6; }
    .invoer:disabled { background: #f1f5f9; color: var(--zacht); }
    .invoer.breed { width: 100%; }
    .invoer.co { width: 92px; text-align: center; }
    .rij { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
    .rij .lbl { font-family: "Times New Roman", serif; font-style: italic; font-size: 1.15rem; font-weight: 700; white-space: nowrap; min-width: 34px; }
    .rij .lbl.normaal { font-style: normal; font-family: inherit; font-size: .95rem; min-width: 0; }
    .rij .haak { font-size: 1.4rem; color: #475569; }
    .rij.vgl .invoer { flex: 1 1 260px; }
    .preview { min-height: 30px; margin-top: 4px; padding: 4px 10px; border: 1px dashed #cbd5e1; border-radius: 10px; background: #fcfdff; font-size: 1.02rem; overflow-x: auto; overflow-y: hidden; }
    .preview:empty { display: none; }
    .preview .lees-fout { color: #b45309; font-size: .88rem; }
    .opties { display: flex; flex-direction: column; gap: 6px; }
    .optie { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border: 2px solid var(--rand); border-radius: 10px; cursor: pointer; background: #fff; }
    .optie:hover { border-color: #94a3b8; }
    .optie input { margin-top: 4px; accent-color: var(--blauw); flex: none; }
    .optie.gekozen { border-color: var(--blauw); background: var(--blauw-licht); }
    .opties.janee { flex-direction: row; flex-wrap: wrap; }
    .opties.janee .optie { flex: 1 1 140px; }
    .feedback { margin-top: 10px; padding: 10px 14px; border-radius: 10px; display: flex; gap: 10px; align-items: flex-start; font-size: .96rem; }
    .feedback .ico { font-size: 1.15rem; line-height: 1.2; flex: none; }
    .feedback.juist { background: var(--groen-licht); border: 1px solid var(--groen-rand); color: #065f46; }
    .feedback.fout { background: var(--rood-licht); border: 1px solid var(--rood-rand); color: #9f1239; }
    .feedback.info { background: var(--oranje-licht); border: 1px solid var(--oranje-rand); color: var(--oranje-tekst); }
    .hulp { margin-top: 14px; background: var(--blauw-licht); border: 1px solid var(--blauw-rand); border-radius: 12px; padding: 12px 16px; overflow-x: auto; }
    .hulp h3 { font-size: .98rem; color: var(--blauw); margin-bottom: 6px; }
    .hulp ol { margin: 0; padding-left: 22px; }
    .hulp li { margin: 6px 0; }
    .uitwerking { margin-top: 14px; background: #fff; border: 1px solid var(--paars-rand); border-radius: 12px; padding: 12px 16px; overflow-x: auto; }
    .uitwerking h3 { font-size: .98rem; color: var(--paars); margin-bottom: 6px; }
    .stappen { margin: 0; padding-left: 0; list-style: none; }
    .stappen li { margin: 6px 0; line-height: 1.55; }
    .stappen li.sub { padding-left: 18px; }
    .stappen li.kader { border-top: 1px solid var(--paars-rand); padding-top: 8px; margin-top: 10px; font-weight: 700; color: var(--blauw); }
    .stappen .katex-display { margin: .25em 0; text-align: left; }
    .stappen .katex-display > .katex { text-align: left; }
    .actie-rij { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .actie-rij .knop { flex: 1 1 140px; }
    .werkbalk { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .werkbalk button { border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 7px; padding: 3px 9px; font-size: .9rem; font-family: ui-monospace, Consolas, monospace; color: #334155; }
    .werkbalk button:hover { background: var(--blauw-licht); }
    details.typhulp { margin-top: 14px; border: 1px solid var(--rand); border-radius: 12px; background: #fff; }
    details.typhulp summary { cursor: pointer; padding: 9px 14px; font-weight: 700; color: #334155; font-size: .92rem; }
    details.typhulp .inhoud { padding: 0 14px 12px; font-size: .88rem; }
    .typtabel { width: 100%; border-collapse: collapse; }
    .typtabel td { padding: 4px 6px; border-top: 1px solid #f1f5f9; vertical-align: middle; }
    .typtabel code { background: #f1f5f9; padding: 2px 6px; border-radius: 6px; font-size: .86rem; }
    .sessie { display: flex; gap: 6px; flex-wrap: wrap; font-size: .85rem; color: var(--zacht); margin-top: 12px; align-items: center; }
    .bolletje { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .bolletje.g { background: #10b981; } .bolletje.h { background: #f59e0b; } .bolletje.f { background: #f43f5e; }
    .toets-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .toets-nav button { width: 36px; height: 36px; border-radius: 9px; border: 2px solid var(--rand); background: #fff; font-weight: 700; color: #334155; }
    .toets-nav button.ingevuld { background: #e0e7ff; border-color: #a5b4fc; }
    .toets-nav button.huidig { border-color: var(--rood); }

    /* ---------- theorie ---------- */
    .theorie-blok { margin-top: 14px; border: 1px solid var(--rand); border-radius: 14px; padding: 14px 16px; background: #fff; overflow-x: auto; }
    .theorie-blok h3 { font-size: 1.04rem; color: var(--paars); margin-bottom: 8px; }
    .theorie-blok ul, .theorie-blok ol { margin: 4px 0 8px; padding-left: 22px; }
    .theorie-blok li { margin: 4px 0; }
    .formule-kader { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px; padding: 8px 12px; margin: 8px 0; overflow-x: auto; }
    .voorbeeld-knoppen { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .voorbeeld-vak { margin-top: 12px; border: 2px dashed var(--paars-rand); border-radius: 12px; padding: 12px 14px; background: #fafaff; }

    /* ---------- rapport ---------- */
    .rapport-kop { text-align: center; }
    .rapport-kop h2 { font-size: 1.7rem; font-weight: 800; }
    .rapport-info { color: var(--zacht); margin-top: 6px; font-size: .95rem; }
    .score { display: inline-block; margin-top: 14px; padding: 10px 26px; border-radius: 999px; background: #f1f5f9; font-size: 1.45rem; font-weight: 800; }
    .score.goed { color: #047857; } .score.matig { color: #b45309; } .score.zwak { color: #be123c; }
    .vraag-kaart { margin-top: 14px; border-radius: 12px; padding: 12px 16px; border-left: 8px solid; background: #f8fafc; overflow-x: auto; }
    .vraag-kaart.juist { background: var(--groen-licht); border-color: #10b981; }
    .vraag-kaart.fout { background: var(--rood-licht); border-color: #f43f5e; }
    .vraag-kaart.deels { background: var(--oranje-licht); border-color: #f59e0b; }
    .vraag-kop { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
    .vraag-kop h3 { font-size: 1rem; }
    .stempel { font-size: .75rem; font-weight: 800; padding: 3px 10px; border-radius: 6px; white-space: nowrap; }
    .juist .stempel { background: #a7f3d0; color: #065f46; } .fout .stempel { background: #fecdd3; color: #9f1239; } .deels .stempel { background: #fde68a; color: #92400e; }
    .antw-deel { background: rgba(255,255,255,.8); border-radius: 10px; padding: 8px 12px; margin-top: 8px; }
    .antw-deel .tit { font-size: .74rem; font-weight: 800; color: var(--zacht); text-transform: uppercase; letter-spacing: .04em; }

    vlak: (naam, n, t) => L`${naam} \leftrightarrow ${lin(n, XYZ, t)} = 0`,
    // vlak in de vorm ux + vy + wz = -t
    vlakRechts: (naam, n, t) => L`${naam} \leftrightarrow ${lin(n, XYZ)} = ${Fr.of(t).neg().tex()}`,
    stelsel: rijen => L`\left\{\begin{array}{l} ${rijen.join(L` \\ `)} \end{array}\right.`,
    rechteParam(naam, P, R, par = 'k') {
        const r = XYZ.map((c, i) => `${c} = ${linCF(P[i], [[R[i], par]])}`);
        return L`${naam} \leftrightarrow ${TX.stelsel(r)} \quad ${par} \in \mathbb{R}`;
    },
    vlakParam(naam, P, R, S, pars = ['k', 'm']) {
        const r = XYZ.map((c, i) => `${c} = ${linCF(P[i], [[R[i], pars[0]], [S[i], pars[1]]])}`);
        return L`${naam} \leftrightarrow ${TX.stelsel(r)} \quad ${pars[0]}, ${pars[1]} \in \mathbb{R}`;
    },
    // cartesiaanse vergelijking(en) van een rechte; R best primitief en geheel
    cartDelen(P, R) {
        const nz = [0, 1, 2].filter(i => !R[i].nul), nul = [0, 1, 2].filter(i => R[i].nul);
        const breuk = i => R[i].gelijk(1) ? xMin(XYZ[i], P[i]) : L`\frac{${xMin(XYZ[i], P[i])}}{${R[i].tex()}}`;
        const delen = [];
        if (nz.length >= 2) delen.push(nz.map(breuk).join(' = '));
        nul.forEach(i => delen.push(`${XYZ[i]} = ${P[i].tex()}`));
        return delen;
    },
    rechteCart(naam, P, R) {
        const d = TX.cartDelen(P, R);
        return d.length === 1 ? L`${naam} \leftrightarrow ${d[0]}` : L`${naam} \leftrightarrow ${TX.stelsel(d)}`;
    },
    rechteStelsel(naam, vlakken, rechts = false) {
        const r = vlakken.map(([n, t]) => rechts ? `${lin(n, XYZ)} = ${Fr.of(t).neg().tex()}` : `${lin(n, XYZ, t)} = 0`);
        return L`${naam} \leftrightarrow ${TX.stelsel(r)}`;
    },
    // determinanten met tabelranden i.p.v. rekbare strepen: die komen ook correct in het PDF-rapport
    det2: (a, b, c, d) => L`\begin{array}{|rr|} ${Fr.of(a).tex()} & ${Fr.of(b).tex()} \\ ${Fr.of(c).tex()} & ${Fr.of(d).tex()} \end{array}`,
    mat23: (r1, r2) => L`\begin{array}{|rrr|} ${r1.map(x => Fr.of(x).tex()).join(' & ')} \\ ${r2.map(x => Fr.of(x).tex()).join(' & ')} \end{array}`,
    det3: (r1, r2, r3) => L`\begin{array}{|ccc|} ${r1.join(' & ')} \\ ${r2.map(x => Fr.of(x).tex()).join(' & ')} \\ ${r3.map(x => Fr.of(x).tex()).join(' & ')} \end{array}`,
};
// invoernotatie (voor de zelftest)
const TXT = {
    co: v => v.map(x => Fr.of(x).txt()),
    vlak: (n, t) => linTxt(n, XYZ, t) + ' = 0',
    param: (P, R, par = 'k') => XYZ.map((c, i) => linCFTxt(P[i], [[R[i], par]])),
    vlakParam: (P, R, S) => XYZ.map((c, i) => linCFTxt(P[i], [[R[i], 'k'], [S[i], 'm']])),
    cart(P, R) {
        const nz = [0, 1, 2].filter(i => !R[i].nul), nul = [0, 1, 2].filter(i => R[i].nul);
        const t = i => `(${linTxt([F(1)], [XYZ[i]], P[i].neg())})/(${R[i].txt()})`;
        const delen = [];
        if (nz.length >= 2) delen.push(nz.map(t).join(' = '));
        nul.forEach(i => delen.push(`${XYZ[i]} = ${P[i].txt()}`));
        return delen;
    },
};

// HTML met $...$ (inline) en $$...$$ (display) omzetten naar KaTeX
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
let KATEX_STRIKT = false;     // tijdens de zelftest: fouten in LaTeX melden
function kt(tex, disp = false) {
    if (window.katex) {
        try { return katex.renderToString(tex, { displayMode: disp, throwOnError: KATEX_STRIKT, strict: 'ignore' }); }
        catch (e) { if (KATEX_STRIKT) throw e; }
    }
    return `<code>${esc(tex)}</code>`;
}
// Een displayformule met meerdere objecten naast elkaar (gescheiden door \qquad of "\quad\text{en}\quad")
// wordt in losse stukken gezet, zodat ze op een smal scherm onder elkaar komen.
const SCHEIDERS = [L`\quad\text{en}\quad`, L`\qquad`];
function splitsFormule(tex) {
    const delen = [];
    let diepte = 0, omg = 0, start = 0;
    for (let i = 0; i < tex.length; i++) {
        const c = tex[i];
        if ((c === '{' || c === '}') && tex[i - 1] === '\\') continue;
        if (c === '{') diepte++;
        else if (c === '}') diepte--;
        else if (tex.startsWith('\\begin', i)) omg++;
        else if (tex.startsWith('\\end', i)) omg--;
        else if (diepte === 0 && omg === 0) {
            const s = SCHEIDERS.find(x => tex.startsWith(x, i));
            if (s) { delen.push({ tex: tex.slice(start, i) }); if (s !== L`\qquad`) delen.push({ en: true }); i += s.length - 1; start = i + 1; }
        }
    }
    delen.push({ tex: tex.slice(start) });
    return delen.filter(d => d.en || d.tex.trim());
}
function ktDisplay(tex) {
    const delen = splitsFormule(tex);
    if (delen.length < 2) return kt(tex, true);
    return '<div class="formule-rij">' + delen.map(d => d.en ? '<span class="formule-en">en</span>' : `<div class="formule-deel">${kt(d.tex, true)}</div>`).join('') + '</div>';
}
function wis(s) {
    if (s == null) return '';
    s = String(s);
    let out = '', i = 0;
    while (i < s.length) {
        const j = s.indexOf('$', i);
        if (j < 0) { out += s.slice(i); break; }
        out += s.slice(i, j);
        const disp = s[j + 1] === '$';
        const w = disp ? 2 : 1;
        const k = s.indexOf(disp ? '$$' : '$', j + w);
        if (k < 0) { out += s.slice(j); break; }
        out += disp ? ktDisplay(s.slice(j + w, k)) : kt(s.slice(j + w, k));
        i = k + w;
    }
    return out;
}
</script>

<!-- =====================================================================
     2. ONTLEDER: wat de leerling typt omzetten naar een rekenboom
     ===================================================================== -->
<script>
const Ontleder = (() => {
    class LeesFout extends Error { constructor(m) { super(m); this.leesfout = true; } }
    class DelingDoorNul extends Error { constructor() { super('deling door 0'); this.deling = true; } }

    function normaliseer(s) {
        return String(s)
            .replace(/[−–—‒]/g, '-')
            .replace(/\*\*/g, '^')
            .replace(/[·×⋅∙•]/g, '*')
            .replace(/[÷:]/g, '/')
            .replace(/√/g, ' sqrt ')
            .replace(/²/g, '^2').replace(/³/g, '^3')
            .replace(/π/g, ' pi ')
            .replace(/[\[{]/g, '(').replace(/[\]}]/g, ')')
            .replace(/[A-Z]/g, c => c.toLowerCase());
    }
    function tokens(s0) {
        const s = normaliseer(s0);
        const out = [];
        let i = 0;
        while (i < s.length) {
            const c = s[i];
            if (/\s/.test(c)) { i++; continue; }
            const rest = s.slice(i);
            let m;
            if ((m = /^(\d+(?:[.,]\d+)?|[.,]\d+)/.exec(rest))) { out.push({ t: 'num', v: parseFloat(m[0].replace(',', '.')), s: m[0] }); i += m[0].length; continue; }
            if ((m = /^(sqrt|wortel|wrt)/.exec(rest))) { out.push({ t: 'fn' }); i += m[0].length; continue; }
            if (/^pi/.test(rest)) { out.push({ t: 'pi' }); i += 2; continue; }
            if (/[a-zα-ω]/.test(c)) { out.push({ t: 'id', v: c }); i++; continue; }
            if ('+-*/^()='.includes(c)) { out.push({ t: c }); i++; continue; }
            if (c === ',' || c === ';') throw new LeesFout('Een komma mag enkel als decimaalteken gebruikt worden (bv. 2,5). Elke coördinaat krijgt een eigen vakje.');
            throw new LeesFout(`Onbekend teken: "${c}"`);
        }
        return out;
    }
    function ontleed(s) {
        const tk = tokens(s);
        if (!tk.length) throw new LeesFout('Er is niets ingevuld.');
        let p = 0;
        const kijk = () => tk[p], neem = () => tk[p++];
        const begintAtoom = k => k && (k.t === 'num' || k.t === 'id' || k.t === 'fn' || k.t === 'pi' || k.t === '(');
        function expr() {
            let a = term();
            while (kijk() && (kijk().t === '+' || kijk().t === '-')) {
                const op = neem().t; const b = term();
                a = { t: op === '+' ? 'add' : 'sub', a, b };
            }
            return a;
        }
        function term() {
            let a = unair();
            for (;;) {
                const k = kijk();
                if (!k) break;
                if (k.t === '*' || k.t === '/') { neem(); const b = unair(); a = { t: k.t === '*' ? 'mul' : 'div', a, b }; continue; }
                if (begintAtoom(k)) { const b = macht(); a = { t: 'mul', a, b, impl: true }; continue; }
                break;
            }
            return a;
        }
        function unair() {
            const k = kijk();
            if (k && (k.t === '-' || k.t === '+')) { neem(); const a = unair(); return k.t === '-' ? { t: 'neg', a } : a; }
            return macht();
        }
        function macht() {
            const a = atoom();
            if (kijk() && kijk().t === '^') { neem(); const b = unair(); return { t: 'pow', a, b }; }
            return a;
        }
        function atoom() {
            const k = neem();
            if (!k) throw new LeesFout('De uitdrukking is onvolledig.');
            switch (k.t) {
                case 'num': return { t: 'num', v: k.v, s: k.s };
                case 'pi': return { t: 'num', v: Math.PI, s: 'π' };
                case 'id': return { t: 'var', n: k.v };
                case 'fn': { if (!begintAtoom(kijk())) throw new LeesFout('Na sqrt (√) moet een getal of een haakje volgen, bv. sqrt(14).'); const a = atoom(); return { t: 'sqrt', a }; }
                case '(': {
                    if (kijk() && kijk().t === ')') throw new LeesFout('Er staan lege haakjes.');
                    const a = expr();
                    if (!kijk() || kijk().t !== ')') throw new LeesFout('Er ontbreekt een haakje ")".');
                    neem();
                    return { t: 'par', a };
                }
                case ')': throw new LeesFout('Er staat een haakje ")" te veel (of op een verkeerde plaats).');
                case '=': throw new LeesFout('Er staat niets vóór het =-teken.');
                default: throw new LeesFout(`Het teken "${k.t}" staat op een verkeerde plaats.`);
            }
        }
        const delen = [expr()];
        while (kijk() && kijk().t === '=') {
            neem();
            if (!kijk()) throw new LeesFout('Er staat niets na het =-teken.');
            delen.push(expr());
        }
        if (p < tk.length) {
            const k = kijk();
            throw new LeesFout(k.t === ')' ? 'Er staat een haakje ")" te veel.' : `Het teken "${k.t === 'num' ? k.s : (k.v || k.t)}" staat op een verkeerde plaats.`);
        }
        return delen;
    }
    function letters(n, set = new Set()) {
        if (n.t === 'var') set.add(n.n);
        if (n.a) letters(n.a, set);
        if (n.b) letters(n.b, set);
        return set;
    }
    function waarde(n, env) {
        switch (n.t) {
            case 'num': return n.v;
            case 'var': if (!(n.n in env)) throw new LeesFout(`De letter "${n.n}" hoort hier niet.`); return env[n.n];
            case 'par': return waarde(n.a, env);
            case 'neg': return -waarde(n.a, env);
            case 'add': return waarde(n.a, env) + waarde(n.b, env);
            case 'sub': return waarde(n.a, env) - waarde(n.b, env);
            case 'mul': return waarde(n.a, env) * waarde(n.b, env);
            case 'div': {
                const b = waarde(n.b, env);
                if (b === 0 && letters(n.b).size === 0) throw new DelingDoorNul();
                return waarde(n.a, env) / b;
            }
            case 'pow': return Math.pow(waarde(n.a, env), waarde(n.b, env));
            case 'sqrt': return Math.sqrt(waarde(n.a, env));
        }
        throw new Error('onbekende knoop');
    }
    const ontpar = n => (n.t === 'par' ? n.a : n);
    function tex(n) {
        const omhul = (m, soorten) => soorten.includes(m.t) ? L`\left(${tex(m)}\right)` : tex(m);
        switch (n.t) {
            case 'num': return n.s === 'π' ? L`\pi` : n.s.replace(/[.,]/, '{,}');
            case 'var': return n.n;
            case 'par': return L`\left(${tex(n.a)}\right)`;
            case 'neg': return '-' + omhul(n.a, ['add', 'sub']);
            case 'add': return `${tex(n.a)} + ${tex(n.b)}`;
            case 'sub': return `${tex(n.a)} - ${omhul(n.b, ['add', 'sub'])}`;
            case 'mul': {
                const A = omhul(n.a, ['add', 'sub']), B = omhul(n.b, ['add', 'sub', 'neg']);
                const impliciet = n.impl && n.b.t !== 'num' && !(n.b.t === 'pow' && n.b.a.t === 'num');
                return impliciet ? `${A}${B}` : L`${A} \cdot ${B}`;
            }
            case 'div': return L`\frac{${tex(ontpar(n.a))}}{${tex(ontpar(n.b))}}`;
            case 'pow': return `${omhul(n.a, ['add', 'sub', 'neg', 'mul', 'div', 'pow'])}^{${tex(ontpar(n.b))}}`;
            case 'sqrt': return L`\sqrt{${tex(ontpar(n.a))}}`;
        }
        return '?';
    }
    return { ontleed, letters, waarde, tex, LeesFout, DelingDoorNul };
})();
const { LeesFout } = Ontleder;

// ---------- lezen van getallen, vergelijkingen, ... ----------
function aantalDecimalen(str) {
    const m = String(str).match(/\d[.,](\d+)/g);
    return m ? Math.max(...m.map(x => x.split(/[.,]/)[1].length)) : 0;
}
function leesGetal(str) {
    if (str == null || !String(str).trim()) throw new LeesFout('Vul alle vakjes in.');
    const delen = Ontleder.ontleed(str);
    if (delen.length !== 1) throw new LeesFout('Hier hoort enkel een getal, zonder =-teken.');
    const Lt = Ontleder.letters(delen[0]);
    if (Lt.size) throw new LeesFout(`Hier hoort een getal, zonder letters (${[...Lt].join(', ')}).`);
    let v;
    try { v = Ontleder.waarde(delen[0], {}); } catch (e) { if (e.deling) throw new LeesFout('Je deelt door 0.'); throw e; }
    if (!Number.isFinite(v)) throw new LeesFout('Dit getal kan ik niet berekenen (wortel uit een negatief getal?).');
    return { v, dec: aantalDecimalen(str), tex: Ontleder.tex(delen[0]) };
}
// 'exact', 'afgerond' of false
function getalOK(g, juist) {
    if (Math.abs(g.v - juist) <= 1e-9 * Math.max(1, Math.abs(juist))) return 'exact';
    if (g.dec >= 2 && Math.abs(g.v - juist) <= 0.5 * Math.pow(10, -g.dec) + 1e-9 * Math.max(1, Math.abs(juist))) return 'afgerond';
    return false;
}
// affiene (eerstegraads) uitdrukking in de opgegeven letters → {c0, c} of null
const TESTPUNTEN = [[0.37, -1.21, 2.53, 0.77], [-2.11, 0.59, -0.83, 1.93], [3.07, 2.41, -1.66, -0.45], [-0.73, -2.9, 1.18, 2.6]];
function affien(ast, vars) {
    const f = env => Ontleder.waarde(ast, env);
    const env0 = Object.fromEntries(vars.map(v => [v, 0]));
    const c0 = f(env0);
    const c = vars.map(v => f({ ...env0, [v]: 1 }) - c0);
    if (![c0, ...c].every(Number.isFinite)) return null;
    for (const tp of TESTPUNTEN) {
        const env = Object.fromEntries(vars.map((v, i) => [v, tp[i]]));
        const echt = f(env);
        const voorspeld = c0 + c.reduce((s, ci, i) => s + ci * tp[i], 0);
        const schaal = 1 + Math.abs(echt) + Math.abs(c0) + c.reduce((s, ci, i) => s + Math.abs(ci * tp[i]), 0);
        if (!Number.isFinite(echt) || Math.abs(echt - voorspeld) > 1e-9 * schaal) return null;
    }
    return { c0, c };
}
function evenredig(S, J) {
    let i = 0;
    J.forEach((x, k) => { if (Math.abs(x) > Math.abs(J[i])) i = k; });
    if (Math.abs(J[i]) < 1e-12) return false;
    const lam = S[i] / J[i];
    if (Math.abs(lam) < 1e-12) return false;
    const schaal = Math.max(...S.map(Math.abs));
    return S.every((s, k) => Math.abs(s - lam * J[k]) <= 1e-9 * Math.max(1, schaal));
}
function controleerLetters(ast, toegelaten, wat) {
    const vreemd = [...Ontleder.letters(ast)].filter(l => !toegelaten.includes(l));
    if (vreemd.length) throw new LeesFout(`De letter${vreemd.length > 1 ? 's' : ''} ${vreemd.join(', ')} ${vreemd.length > 1 ? 'horen' : 'hoort'} niet in ${wat}. Gebruik enkel ${toegelaten.join(', ')}.`);
}
// één vergelijking in x, y, z → {n:[u,v,w], c} (numeriek); gooit LeesFout bij leesproblemen
function leesVlakVgl(str) {
    if (!str || !str.trim()) throw new LeesFout('Typ een vergelijking.');
    const d = Ontleder.ontleed(str);
    if (d.length === 1) throw new LeesFout('Schrijf een vergelijking met een =-teken, bv. 2x + y - z + 3 = 0.');
    if (d.length > 2) throw new LeesFout('Een vlak heeft één vergelijking met één =-teken.');
    d.forEach(a => controleerLetters(a, XYZ, 'de vergelijking van een vlak'));
    let aff;
    try { aff = affien({ t: 'sub', a: d[0], b: d[1] }, XYZ); }
    catch (e) { if (e.deling) throw new LeesFout('Je deelt door 0.'); throw e; }
    return { aff, tex: `${Ontleder.tex(d[0])} = ${Ontleder.tex(d[1])}` };
}
</script>

<!-- =====================================================================
     3. DEELVRAGEN: soorten antwoorden, invoervelden en nakijken
     Elke deelvraag heeft een type; het type bepaalt de invoervelden,
     de controle en hoe het antwoord in het rapport getoond wordt.
     ===================================================================== -->
<script>
const OK = (msg = 'Juist!', extra = {}) => Object.assign({ ok: true, msg }, extra);
const NOK = (msg, extra = {}) => Object.assign({ ok: false, msg }, extra);
const nTex = (naam, P) => `${naam}${TX.co(P)}`;

// waarden van een puntveld lezen: [{v,dec,tex},...]
function leesCo(w, pre = '') { return XYZ.map(k => leesGetal(w[pre + k])); }
function coTex(g) { return L`\left(${g.map(x => x.tex).join(L`,\,`)}\right)`; }

const TYPES = {};

// ---------- exacte coördinaat van een punt of vector ----------
TYPES.punt = {
    velden: d => [{ soort: 'co', pre: '', naam: d.naam }],
    controleer(d, w) {
        const g = leesCo(w);
        const v = g.map(x => x.v);
        const st = g.map((x, i) => getalOK(x, d.juist[i]));
        if (st.every(Boolean)) return OK(st.includes('afgerond') ? `Juist (afgerond). Exacte waarde: $${d.juistTex}$` : 'Juist!');
        for (const f of d.fouten || []) if (f.w.every((x, i) => bijna(v[i], num(x)))) return NOK(f.msg);
        if (d.type === 'vector' && !nNul(v) && nPar(v, d.juist)) return NOK('Je vector is wel evenwijdig met de juiste vector, maar hier wordt de coördinaat van precies deze vector gevraagd (geen veelvoud).');
        if (v.every((x, i) => bijna(x, -d.juist[i])) && !nNul(v)) return NOK('Alle tekens zijn omgekeerd. ' + (d.tegenMsg || 'Controleer de volgorde: eindpunt min beginpunt.'));
        const fouteCo = [0, 1, 2].filter(i => !st[i]).map(i => XYZ[i]);
        return NOK(`Niet juist: controleer de ${fouteCo.join(' en de ')}-coördinaat.` + (d.tip ? ' ' + d.tip : ''));
    },
    toon: (d, w) => d.naam + coTex(leesCo(w)),
    invoer: d => ({ x: d.juistTxt[0], y: d.juistTxt[1], z: d.juistTxt[2] }),
};
TYPES.vector = TYPES.punt;

// ---------- richting (elk veelvoud ≠ 0 is goed) ----------
TYPES.richting = {
    velden: d => [{ soort: 'co', pre: '', naam: d.naam }],
    controleer(d, w) {
        const g = leesCo(w), v = g.map(x => x.v);
        if (nNul(v)) return NOK('De nulvector is nooit een richtings- of normaalvector.');
        if (nPar(v, d.juist)) {
            const zelfde = v.every((x, i) => bijna(x, d.juist[i]));
            return OK(zelfde ? 'Juist!' : 'Juist! (Elk veelvoud ≠ 0 van de vector is ook goed.)');
        }
        for (const f of d.fouten || []) if (nPar(v, num(f.w))) return NOK(f.msg);
        return NOK('Deze vector is niet evenwijdig met de juiste vector.' + (d.tip ? ' ' + d.tip : ''));
    },
    toon: (d, w) => d.naam + coTex(leesCo(w)),
    invoer: d => ({ x: d.juistTxt[0], y: d.juistTxt[1], z: d.juistTxt[2] }),
};

// ---------- een willekeurig punt van een rechte ----------
TYPES.puntOpRechte = {
    velden: d => [{ soort: 'co', pre: '', naam: d.naam }],
    controleer(d, w) {
        const v = leesCo(w).map(x => x.v);
        const P = num(d.P), R = num(d.R);
        if (nPar(nMin(v, P), R) || nNul(nMin(v, P))) return OK('Juist! Dit punt ligt op de rechte.');
        return NOK('Dit punt ligt niet op de rechte. ' + (d.tip || ''));
    },
    toon: (d, w) => d.naam + coTex(leesCo(w)),
    invoer: d => { const t = TXT.co(vplus(d.P, vmaal(d.R, 2))); return { x: t[0], y: t[1], z: t[2] }; },
};

// ---------- meerdere punten (op volgorde of in willekeurige volgorde) ----------
TYPES.punten = {
    velden: d => d.lijst.map((p, j) => ({ soort: 'co', pre: 'p' + j, naam: p.naam })),
    controleer(d, w) {
        const g = d.lijst.map((p, j) => leesCo(w, 'p' + j).map(x => x.v));
        const passt = (v, J) => v.every((x, i) => bijna(x, J[i]));
        const J = d.lijst.map(p => p.juist);
        let aantal = 0;
        if (d.orde) { aantal = g.filter((v, j) => passt(v, J[j])).length; }
        else if (g.length === 2) {
            const a = (passt(g[0], J[0]) ? 1 : 0) + (passt(g[1], J[1]) ? 1 : 0);
            const b = (passt(g[0], J[1]) ? 1 : 0) + (passt(g[1], J[0]) ? 1 : 0);
            aantal = Math.max(a, b);
        } else aantal = g.filter(v => J.some(Jj => passt(v, Jj))).length;
        if (!d.orde && g.length === 2 && passt(g[0], g[1])) aantal = Math.min(aantal, 1);
        const n = d.lijst.length;
        if (aantal === n) return OK('Juist!');
        const s = d.deelscore ? (d.punten * aantal / n) : 0;
        if (aantal > 0) return NOK(`${aantal} van de ${n} punten ${aantal === 1 ? 'is' : 'zijn'} juist.` + (d.tip ? ' ' + d.tip : ''), { score: s });
        return NOK('Geen van de punten is juist.' + (d.tip ? ' ' + d.tip : ''));
    },
    toon: (d, w) => d.lijst.map((p, j) => p.naam + coTex(leesCo(w, 'p' + j))).join(L`,\quad `),
    invoer: d => { const o = {}; d.lijst.forEach((p, j) => XYZ.forEach((k, i) => { o['p' + j + k] = p.juistTxt[i]; })); return o; },
};

// ---------- getal (exact of voldoende nauwkeurig afgerond) ----------
TYPES.getal = {
    velden: d => [{ soort: 'tekst', key: 'g', label: d.label || '', ph: d.ph || 'bv. 2sqrt(14)/7 of 3/4', smal: true }],
    controleer(d, w) {
        const g = leesGetal(w.g);
        const st = getalOK(g, d.juist);
        if (st === 'exact') return OK('Juist!');
        if (st === 'afgerond') return OK(`Juist (afgerond). Exacte waarde: $${d.juistTex}$`);
        for (const f of d.fouten || []) if (Math.abs(g.v - f.w) <= 1e-9 * Math.max(1, Math.abs(f.w)) || (g.dec >= 2 && Math.abs(g.v - f.w) <= 0.5 * Math.pow(10, -g.dec))) return NOK(f.msg);
        if (g.dec === 1 && Math.abs(g.v - d.juist) < 0.05) return NOK('Bijna, maar te ruw afgerond. Geef de exacte waarde of minstens 2 decimalen.');
        return NOK('Niet juist.' + (d.tip ? ' ' + d.tip : ''));
    },
    toon: (d, w) => (d.label ? d.label + ' ' : '') + leesGetal(w.g).tex,
    invoer: d => ({ g: d.juistTxt }),
};

// ---------- hoek in graden ----------
function leesHoek(str) {
    if (!str || !str.trim()) throw new LeesFout('Vul de hoek in.');
    let s = str.trim().replace(/,/g, '.').replace(/\s+/g, ' ');
    s = s.replace(/(''|"|″|’’|′′|“|”)/g, 's').replace(/['’′`´]/g, 'm').replace(/[°º]/g, 'd').replace(/graden/g, 'd');
    let m = s.match(/^(\d+(?:\.\d+)?) ?d?$/);
    if (m) return { g: +m[1], tol: Math.max(0.05, 0.5 * Math.pow(10, -((m[1].split('.')[1] || '').length))), tex: m[1].replace('.', '{,}') + '^\\circ' };
    m = s.match(/^(\d+) ?d ?(?:(\d+(?:\.\d+)?) ?m)? ?(?:(\d+(?:\.\d+)?) ?s?)?$/) || s.match(/^(\d+) (\d+(?:\.\d+)?)(?: (\d+(?:\.\d+)?))?$/);
    if (m) {
        const g = +m[1] + (m[2] ? +m[2] / 60 : 0) + (m[3] ? +m[3] / 3600 : 0);
        if ((m[2] && +m[2] >= 60) || (m[3] && +m[3] >= 60)) throw new LeesFout('Minuten en seconden moeten kleiner zijn dan 60.');
        const tol = m[3] ? 0.0015 : m[2] ? 0.5 / 60 + 0.0005 : 0.5;
        return { g, tol, tex: `${m[1]}^\\circ` + (m[2] ? `${m[2]}'` : '') + (m[3] ? `${m[3]}''` : '') };
    }
    throw new LeesFout('Typ de hoek in graden, bv. 37,4 of 37°22\'16".');
}
function dmsTex(g) {
    let s = Math.round(g * 3600);
    const d = Math.floor(s / 3600); s -= d * 3600;
    const m = Math.floor(s / 60); s -= m * 60;
    return `${d}^\\circ${m}'${s}''`;
}
TYPES.hoek = {
    velden: d => [{ soort: 'tekst', key: 'g', label: d.label || '', ph: 'bv. 37,37 of 37°22\'16"', smal: true, geenPreview: true }],
    controleer(d, w) {
        const h = leesHoek(w.g);
        if (Math.abs(h.g - d.juist) <= h.tol) return OK(`Juist! (exact: $${dmsTex(d.juist)} \\approx ${d.juist.toFixed(2).replace('.', '{,}')}^\\circ$)`);
        for (const f of d.fouten || []) if (Math.abs(h.g - f.w) <= Math.max(h.tol, 0.05)) return NOK(f.msg);
        return NOK('Niet juist.' + (d.tip ? ' ' + d.tip : ''));
    },
    toon: (d, w) => (d.label ? d.label + ' ' : '') + leesHoek(w.g).tex,
    invoer: d => ({ g: d.juist.toFixed(4) }),
};

// ---------- cartesiaanse vergelijking van een vlak ----------
function vlakMeldingen(n, c, vw) {
    const m = [];
    for (const [naam, P] of vw.punten || []) {
        const p = num(P);
        if (Math.abs(nDot(n, p) + c) > 1e-9 * (1 + nNorm(n) * nNorm(p) + Math.abs(c))) m.push(`Het punt $${naam}${TX.co(P)}$ ligt niet in jouw vlak.`);
    }
    for (const [naam, R] of vw.rv || []) {
        const r = num(R);
        if (Math.abs(nDot(n, r)) > 1e-9 * nNorm(n) * nNorm(r)) m.push(`$${naam}${TX.co(R)}$ is geen richtingsvector van jouw vlak (het scalair product met jouw normaalvector is niet $0$).`);
    }
    if (vw.normaal) {
        const [naam, N] = vw.normaal;
        if (!nPar(n, num(N))) m.push(`Jouw normaalvector $${mooiCo(mooiVecSchaal(n))}$ is geen veelvoud van $${naam}${TX.co(N)}$.`);
    }
    for (const [naam, N] of vw.loodrecht || []) {
        const r = num(N);
        if (Math.abs(nDot(n, r)) > 1e-9 * nNorm(n) * nNorm(r)) m.push(`Jouw vlak staat niet loodrecht op het vlak met normaalvector $${naam}${TX.co(N)}$.`);
    }
    return m;
}
function controleVlak(juistN, juistT, vw, aff) {
    const n = aff.c, c = aff.c0;
    if (nNul(n)) return NOK('In jouw vergelijking komen $x$, $y$ en $z$ niet (meer) voor: dat is geen vlak.');
    const J = [...num(juistN), num(juistT)];
    if (evenredig([...n, c], J)) return OK('Juist!');
    const m = [];
    if (nPar(n, num(juistN))) m.push('De coëfficiënten van $x$, $y$ en $z$ (je normaalvector) zijn goed, maar de constante term niet.');
    m.push(...vlakMeldingen(n, c, vw || {}));
    if (!m.length) m.push('Dit is niet het gevraagde vlak.');
    return NOK(m.join('<br>'));
}
TYPES.vlak = {
    velden: d => [{ soort: 'tekst', key: 'v', label: d.naamTex ? d.naamTex + L` \leftrightarrow` : '', ph: 'bv. 2x + y - 3z + 5 = 0', vgl: true }],
    controleer(d, w) {
        const { aff } = leesVlakVgl(w.v);
        if (!aff) return NOK('Dit is geen vergelijking van de eerste graad in $x$, $y$ en $z$, dus geen vlak.');
        return controleVlak(d.n, d.t, d.vw, aff);
    },
    toon: (d, w) => (d.naamTex ? d.naamTex + L` \leftrightarrow ` : '') + leesVlakVgl(w.v).tex,
    invoer: d => ({ v: TXT.vlak(d.n, d.t) }),
};

// ---------- twee (of meer) vlakken in willekeurige volgorde ----------
TYPES.vlakken = {
    velden: d => d.lijst.map((v, j) => ({ soort: 'tekst', key: 'v' + j, label: v.naamTex + L` \leftrightarrow`, ph: 'bv. 2x - 3y + 6z + 7 = 0', vgl: true })),
    controleer(d, w) {
        const affs = d.lijst.map((v, j) => leesVlakVgl(w['v' + j]).aff);
        const passt = (a, v) => a && !nNul(a.c) && evenredig([...a.c, a.c0], [...num(v.n), num(v.t)]);
        const J = d.lijst;
        let aantal;
        if (J.length === 2) aantal = Math.max((passt(affs[0], J[0]) ? 1 : 0) + (passt(affs[1], J[1]) ? 1 : 0), (passt(affs[0], J[1]) ? 1 : 0) + (passt(affs[1], J[0]) ? 1 : 0));
        else aantal = affs.filter(a => J.some(v => passt(a, v))).length;
        if (J.length === 2 && affs[0] && affs[1] && evenredig([...affs[0].c, affs[0].c0], [...affs[1].c, affs[1].c0])) aantal = Math.min(aantal, 1);
        if (aantal === J.length) return OK('Juist!');
        const s = d.deelscore ? d.punten * aantal / J.length : 0;
        if (aantal > 0) return NOK(`${aantal} van de ${J.length} vlakken ${aantal === 1 ? 'is' : 'zijn'} juist.` + (d.tip ? ' ' + d.tip : ''), { score: s });
        return NOK('Geen van de vlakken is juist.' + (d.tip ? ' ' + d.tip : ''));
    },
    toon: (d, w) => d.lijst.map((v, j) => `${v.naamTex} \\leftrightarrow ${leesVlakVgl(w['v' + j]).tex}`).join(L`\qquad `),
    invoer: d => Object.fromEntries(d.lijst.map((v, j) => ['v' + j, TXT.vlak(v.n, v.t)])),

// ---------- parametervergelijking (rechte: 1 parameter, vlak: 2 parameters) ----------
function leesParam(w, aantal) {
    const asts = XYZ.map(c => {
        const s = w[c];
        if (!s || !s.trim()) throw new LeesFout(`Vul de vergelijking voor ${c} in.`);
        let d = Ontleder.ontleed(s);
        if (d.length === 2 && d[0].t === 'var' && d[0].n === c) d = [d[1]];
        if (d.length !== 1) throw new LeesFout(`Typ bij ${c} enkel het rechterlid, bv. 1 + 2k (zonder =-teken).`);
        return d[0];
    });
    const lt = new Set();
    asts.forEach(a => Ontleder.letters(a).forEach(x => lt.add(x)));
    for (const c of XYZ) if (lt.has(c)) throw new LeesFout(`In het rechterlid hoort geen ${c}: gebruik enkel de parameter${aantal > 1 ? 's' : ''}.`);
    const pars = [...lt].sort();
    if (pars.length === 0) throw new LeesFout(aantal === 1 ? 'Er staat geen parameter in je vergelijkingen (gebruik bv. k).' : 'Er staan geen parameters in je vergelijkingen (gebruik bv. k en m).');
    if (pars.length !== aantal) throw new LeesFout(aantal === 1 ? `Een rechte heeft één parameter, jij gebruikt er ${pars.length} (${pars.join(', ')}).` : `Een vlak heeft twee parameters, jij gebruikt er ${pars.length} (${pars.join(', ')}).`);
    const affs = asts.map(a => { try { return affien(a, pars); } catch (e) { if (e.deling) throw new LeesFout('Je deelt door 0.'); throw e; } });
    if (affs.some(a => !a)) return { nietLineair: true };
    return { P: affs.map(a => a.c0), R: pars.map((p, j) => affs.map(a => a.c[j])), pars, tex: XYZ.map((c, i) => `${c} = ${Ontleder.tex(asts[i])}`) };
}
function rechteMeldingen(P, R, d) {
    const m = [];
    const JP = num(d.P), JR = num(d.R);
    if (!nPar(R, JR)) m.push(`Je richtingsvector $${mooiCo(mooiVecSchaal(R))}$ is niet evenwijdig met de rechte.`);
    else m.push('Je richtingsvector is goed.');
    if (!(nNul(nMin(P, JP)) || nPar(nMin(P, JP), JR))) m.push(`Je steunpunt $${mooiCo(P)}$ ligt niet op de gevraagde rechte.`);
    else if (!nPar(R, JR)) m.push('Je steunpunt is goed.');
    return m;
}
TYPES.rechteParam = {
    velden: d => XYZ.map(c => ({ soort: 'tekst', key: c, label: `${c} =`, ph: c === 'x' ? 'bv. 1 + 2k' : '', vgl: true, smalLabel: true, stelsel: true, geenPreview: true })),
    notitie: () => 'Gebruik één parameter, bv. $k$ (met $k \\in \\mathbb{R}$).',
    controleer(d, w) {
        const p = leesParam(w, 1);
        if (p.nietLineair) return NOK('Een parametervergelijking van een rechte is van de eerste graad in de parameter.');
        const R = p.R[0];
        if (nNul(R)) return NOK('Je richtingsvector is de nulvector: dat is geen rechte maar een punt.');
        const JP = num(d.P), JR = num(d.R);
        if (nPar(R, JR) && (nNul(nMin(p.P, JP)) || nPar(nMin(p.P, JP), JR))) return OK('Juist!');
        return NOK(rechteMeldingen(p.P, R, d).join(' '));
    },
    toon: (d, w) => { const p = leesParam(w, 1); return (d.naamTex ? d.naamTex + L` \leftrightarrow ` : '') + TX.stelsel(p.tex || XYZ.map(c => `${c} = ${w[c]}`)); },
    invoer: d => { const t = TXT.param(d.P, d.R); return { x: t[0], y: t[1], z: t[2] }; },
};
TYPES.vlakParam = {
    velden: d => XYZ.map(c => ({ soort: 'tekst', key: c, label: `${c} =`, ph: c === 'x' ? 'bv. 2 + k - 3m' : '', vgl: true, smalLabel: true, stelsel: true, geenPreview: true })),
    notitie: () => 'Gebruik twee parameters, bv. $k$ en $m$ (met $k, m \\in \\mathbb{R}$).',
    controleer(d, w) {
        const p = leesParam(w, 2);
        if (p.nietLineair) return NOK('Een parametervergelijking van een vlak is van de eerste graad in de parameters.');
        const [R1, R2] = p.R;
        if (nNul(R1) || nNul(R2)) return NOK('Eén van je richtingsvectoren is de nulvector.');
        if (nPar(R1, R2)) return NOK(`Je twee richtingsvectoren $${mooiCo(mooiVecSchaal(R1))}$ en $${mooiCo(mooiVecSchaal(R2))}$ zijn evenwijdig: zo krijg je geen vlak, maar een rechte.`);
        const N = num(d.n), c = num(d.t);
        const m = [];
        if (Math.abs(nDot(N, R1)) > 1e-9 * nNorm(N) * nNorm(R1)) m.push(`$${mooiCo(mooiVecSchaal(R1))}$ is geen richtingsvector van het vlak.`);
        if (Math.abs(nDot(N, R2)) > 1e-9 * nNorm(N) * nNorm(R2)) m.push(`$${mooiCo(mooiVecSchaal(R2))}$ is geen richtingsvector van het vlak.`);
        if (Math.abs(nDot(N, p.P) + c) > 1e-9 * (1 + nNorm(N) * nNorm(p.P) + Math.abs(c))) m.push(`Je steunpunt $${mooiCo(p.P)}$ ligt niet in het vlak.`);
        if (!m.length) return OK('Juist!');
        return NOK(m.join(' '));
    },
    toon: (d, w) => { const p = leesParam(w, 2); return (d.naamTex ? d.naamTex + L` \leftrightarrow ` : '') + TX.stelsel(p.tex || XYZ.map(c => `${c} = ${w[c]}`)); },
    invoer: d => { const t = TXT.vlakParam(d.P0, d.R0, d.S0); return { x: t[0], y: t[1], z: t[2] }; },
};

// ---------- cartesiaanse vergelijking(en) van een rechte ----------
function leesCart(w) {
    const vgln = [], texs = [];
    for (const key of ['r1', 'r2']) {
        const s = w[key];
        if (!s || !s.trim()) continue;
        const d = Ontleder.ontleed(s);
        if (d.length < 2) throw new LeesFout('Elke regel moet minstens één =-teken bevatten.');
        d.forEach(a => controleerLetters(a, XYZ, 'cartesiaanse vergelijkingen'));
        texs.push(d.map(a => Ontleder.tex(a)).join(' = '));
        for (let i = 0; i + 1 < d.length; i++) {
            let aff;
            try { aff = affien({ t: 'sub', a: d[i], b: d[i + 1] }, XYZ); }
            catch (e) { if (e.deling) return { deling: true }; throw e; }
            if (!aff) return { nietLineair: true };
            vgln.push(aff);
        }
    }
    if (!vgln.length) throw new LeesFout('Typ minstens één vergelijking.');
    return { vgln, texs };
}
function rang(normalen) {
    const ns = normalen.filter(n => !nNul(n));
    if (!ns.length) return 0;
    let r = 1, paar = null;
    for (let i = 0; i < ns.length; i++) for (let j = i + 1; j < ns.length; j++) if (!nPar(ns[i], ns[j])) { r = 2; paar = [ns[i], ns[j]]; }
    if (r === 2) for (const n of ns) { const c = nCross(paar[0], paar[1]); if (Math.abs(nDot(c, n)) > 1e-9 * nNorm(c) * nNorm(n)) return 3; }
    return r;
}
TYPES.rechteCart = {
    velden: () => [
        { soort: 'tekst', key: 'r1', label: '', ph: 'bv. (x-1)/2 = (y+3)/(-1) = z', vgl: true },
        { soort: 'tekst', key: 'r2', label: '', ph: '(eventueel) tweede vergelijking, bv. y = 3', vgl: true },
    ],
    notitie: () => 'Typ de doorlopende vorm op de eerste regel, óf een stelsel van twee vergelijkingen (één per regel).',
    controleer(d, w) {
        const r = leesCart(w);
        if (r.deling) return NOK('Je deelt door 0. Is een richtingsgetal gelijk aan 0? Dan splits je het stelsel: de overeenkomstige teller is 0 (zie de opmerking in de cursus).');
        if (r.nietLineair) return NOK('Cartesiaanse vergelijkingen van een rechte zijn van de eerste graad in $x$, $y$ en $z$.');
        const vg = r.vgln.filter(a => !(nNul(a.c) && Math.abs(a.c0) < 1e-12));
        if (vg.some(a => nNul(a.c))) return NOK('Eén van je vergelijkingen is altijd vals (bv. 0 = 3): dat stelsel heeft geen oplossingen.');
        const rg = rang(vg.map(a => a.c));
        if (rg < 2) return NOK('Dit is maar één onafhankelijke vergelijking: die stelt een vlak voor, geen rechte. Een rechte heeft twee vergelijkingen nodig (doorlopend: … = … = …).');
        const JP = num(d.P), JR = num(d.R), JQ = nPlus(JP, JR);
        const bevat = a => Math.abs(nDot(a.c, JP) + a.c0) <= 1e-9 * (1 + nNorm(a.c) * nNorm(JP) + Math.abs(a.c0)) && Math.abs(nDot(a.c, JQ) + a.c0) <= 1e-9 * (1 + nNorm(a.c) * nNorm(JQ) + Math.abs(a.c0));
        if (rg === 2 && vg.every(bevat)) return OK('Juist!');
        if (rg === 3) return NOK('Je stelsel heeft hoogstens één oplossing (een punt): dat is geen rechte.');
        // richting en een punt van de rechte van de leerling
        let paar = null;
        for (let i = 0; i < vg.length && !paar; i++) for (let j = i + 1; j < vg.length && !paar; j++) if (!nPar(vg[i].c, vg[j].c)) paar = [vg[i], vg[j]];
        const Rl = nCross(paar[0].c, paar[1].c);
        const m = [];
        if (nPar(Rl, JR)) m.push('De richting van je rechte is goed, maar je rechte gaat niet door de juiste punten (controleer de tellers: $x - x_1$, $y - y_1$, $z - z_1$).');
        else m.push(`De richting van jouw rechte $${mooiCo(mooiVecSchaal(Rl))}$ is niet evenwijdig met de gevraagde rechte (controleer de noemers).`);
        return NOK(m.join(' '));
    },
    toon: (d, w) => { const r = leesCart(w); const t = r.texs || []; return (d.naamTex ? d.naamTex + L` \leftrightarrow ` : '') + (t.length === 1 ? t[0] : TX.stelsel(t)); },
    invoer: d => { const t = TXT.cart(d.P, d.R); return { r1: t[0], r2: t[1] || '' }; },
};

// ---------- bol ----------
function leesBol(str) {
    if (!str || !str.trim()) throw new LeesFout('Typ een vergelijking.');
    const d = Ontleder.ontleed(str);
    if (d.length !== 2) throw new LeesFout('Een bol heeft één vergelijking met één =-teken.');
    d.forEach(a => controleerLetters(a, XYZ, 'de vergelijking van een bol'));
    const ast = { t: 'sub', a: d[0], b: d[1] };
    const f = (x, y, z) => Ontleder.waarde(ast, { x, y, z });
    let e, a = [], b = [];
    try {
        e = f(0, 0, 0);
        const p = [f(1, 0, 0), f(0, 1, 0), f(0, 0, 1)], q = [f(-1, 0, 0), f(0, -1, 0), f(0, 0, -1)];
        a = p.map((v, i) => (v + q[i]) / 2 - e); b = p.map((v, i) => (v - q[i]) / 2);
    } catch (er) { if (er.deling) throw new LeesFout('Je deelt door 0.'); throw er; }
    let vorm = [e, ...a, ...b].every(Number.isFinite);
    if (vorm) for (const tp of TESTPUNTEN) {
        const [x, y, z] = tp, echt = f(x, y, z);
        const voor = a[0] * x * x + a[1] * y * y + a[2] * z * z + b[0] * x + b[1] * y + b[2] * z + e;
        if (!Number.isFinite(echt) || Math.abs(echt - voor) > 1e-9 * (1 + Math.abs(echt) + Math.abs(voor))) { vorm = false; break; }
    }

TYPES.bol = {

    toon: (d, w) => null,

// ---------- onderlinge ligging (+ snijpunt als ze snijden) ----------

// ---------- bouwers voor deelvragen ----------

    vector(vraag, naam, P, opt = {}) { const c = coInfo(P); return { type: 'vector', vraag, naam, juist: c.juist, juistTxt: c.juistTxt, juistTex: naam + c.co, punten: 1, ...opt }; },
    richting(vraag, naam, R, opt = {}) { return { type: 'richting', vraag, naam, juist: num(R), juistTxt: TXT.co(R), juistTex: naam + TX.co(R) + L`\ \text{(of een veelvoud)}`, punten: 1, ...opt }; },
    puntOpRechte(vraag, naam, P, R, opt = {}) { return { type: 'puntOpRechte', vraag, naam, P, R, juistTex: naam + TX.co(P) + L`\ \text{(of een ander punt van de rechte)}`, punten: 1, ...opt }; },
    punten(vraag, lijst, opt = {}) { return { type: 'punten', vraag, lijst: lijst.map(([naam, P]) => ({ naam, juist: num(P), juistTxt: TXT.co(P), tex: naam + TX.co(P) })), juistTex: lijst.map(([naam, P]) => naam + TX.co(P)).join(L`,\quad `), orde: true, punten: 1, ...opt }; },

    vlakken(vraag, lijst, opt = {}) { const l = lijst.map(([naamTex, vl]) => { const p = vlakPrim(vl.n, vl.t); return { naamTex, n: p.n, t: p.t }; }); return { type: 'vlakken', vraag, lijst: l, juistTex: l.map(v => TX.vlak(v.naamTex, v.n, v.t)).join(L`\qquad `), punten: 1, ...opt }; },
    rechteParam(vraag, naamTex, P, R, opt = {}) { const Rp = vprim(R, false); return { type: 'rechteParam', vraag, naamTex, P, R: Rp, juistTex: TX.rechteParam(naamTex, P, Rp), punten: 1, ...opt }; },
    rechteCart(vraag, naamTex, P, R, opt = {}) { const Rp = vprim(R, false); return { type: 'rechteCart', vraag, naamTex, P, R: Rp, juistTex: TX.rechteCart(naamTex, P, Rp), punten: 1, ...opt }; },
    vlakParam(vraag, naamTex, P, R, S, opt = {}) { const vl = vlakPrim(vcross(R, S), vdot(vcross(R, S), P).neg()); return { type: 'vlakParam', vraag, naamTex, n: vl.n, t: vl.t, P0: P, R0: R, S0: S, juistTex: TX.vlakParam(naamTex, P, R, S), punten: 1, ...opt }; },
    bol(vraag, naamTex, M, r2, opt = {}) {

        return { type: 'bol', vraag, naamTex, M, r2: r2f, juistTex: `${naamTex ? naamTex + L` \leftrightarrow ` : ''}${kw} = ${r2f.tex()}` + L`\quad\text{of}\quad ` + algT, punten: 1, ...opt };

// ---------- oefeningenbank ----------
const GEN = [];

<script>
// ===================== hulpfuncties voor de uitwerkingen =====================
const EEN = [V(1, 0, 0), V(0, 1, 0), V(0, 0, 1)];
// u·x1 + v·y1 + w·z1 (+ t) met de producten al uitgerekend, zoals in de cursus: "9 - 18 + 4 + t"
function invulTex(n, t, P) {
    const w = [];
    for (let i = 0; i < 3; i++) if (!n[i].nul) { const p = n[i].maal(P[i]); if (!p.nul) w.push(p); }
    if (t !== undefined && t !== null && !Fr.of(t).nul) w.push(Fr.of(t));
    if (!w.length) return '0';
    return w.map((x, i) => i === 0 ? x.tex() : (x.n < 0 ? ' - ' + x.abs().tex() : ' + ' + x.tex())).join('');
}
function uitlegFactor(oud, nieuw) {
    const i = [0, 1, 2].find(k => !nieuw[k].nul);
    const f = oud[i].door(nieuw[i]);
    if (f.gelijk(1)) return '';
    if (f.gelijk(-1)) return ' (beide leden maal $-1$)';
    return L` (beide leden gedeeld door $${f.tex()}$)`;
}
function coefVec(k, vt) { k = Fr.of(k); if (k.gelijk(1)) return vt; if (k.gelijk(-1)) return '-' + vt; return k.tex() + vt; }
// u(x1 + ak) + v(y1 + bk) + w(z1 + ck) + t
function substTex(n, P, R, par, t) {

    t = Fr.of(t || 0);

const UW = {
    // cartesiaanse vergelijking uit steunvector P en richtingsvectoren R en S (determinant, ontwikkeld naar de eerste rij)
    det(naam, P, R, S) {
        const n = vcross(R, S);
        zeker(!visNul(n), 'richtingsvectoren evenwijdig');
        const rij1 = XYZ.map((c, i) => xMin(c, P[i]));

        st.push(L`>$\Leftrightarrow\; ${somTermen([[n[0], xMinH('x', P[0])], [n[1], xMinH('y', P[1])], [n[2], xMinH('z', P[2])]])} = 0$`);

    },
    // richtingsvector van de snijlijn van twee vlakken (determinantenmethode)

        const st = [L`$${TX.mat23(n1, n2)} \;\Rightarrow\; ${label}\left(${TX.det2(n1[1], n1[2], n2[1], n2[2])},\; -${TX.det2(n1[0], n1[2], n2[0], n2[2])},\; ${TX.det2(n1[0], n1[1], n2[0], n2[1])}\right) = ${TX.co(R)}$`];

    // een punt van de snijlijn van twee vlakken (stel één onbekende gelijk aan 0)

        const st = [L`Kies een punt: stel $${XYZ[keuze.nulIdx]} = 0$: $\;\left\{\begin{array}{l} ${eq(v1)} \\ ${eq(v2)} \end{array}\right. \;\Rightarrow\; ${XYZ[keuze.i]} = ${P[keuze.i].tex()},\; ${XYZ[keuze.j]} = ${P[keuze.j].tex()}$`,

        const k = c.neg().door(NR);
        const S = vplus(P, vmaal(R, k));
        st.push(L`>$\Leftrightarrow\; ${par} = ${k.tex()}$`);
        st.push(L`Vul $${par} = ${k.tex()}$ in in de parametervergelijking: $${label}${TX.co(S)}$`);

    },
    // constante term t bepalen als de normaalvector gekend is
    constante(naam, n, P, puntNaam) {

        const st = [L`$${naam} \leftrightarrow ${lin(n, XYZ)} + t = 0$`,
            L`$${puntNaam}${TX.co(P)} \in ${naam} \;\Leftrightarrow\; ${invulTex(n, undefined, P)} + t = 0 \;\Leftrightarrow\; t = ${t.tex()}$`];
        const p = vlakPrim(n, t);
        st.push(L`$${TX.vlak(naam, n, t)}$`);
        if (!vgelijk(p.n, n)) st.push(L`>$\Leftrightarrow\; ${TX.vlakVgl(p.n, p.t)}$` + uitlegFactor(n, p.n));

    },
    // doorlopende cartesiaanse vorm omzetten naar een stelsel van twee vergelijkingen
    cartNaarStelsel(naam, P, R) {

            kruis.push(`${somTermen([[R[j], xMinH(XYZ[i], P[i])]])} = ${somTermen([[R[i], xMinH(XYZ[j], P[j])]])}`);
            const n = [F(0), F(0), F(0)]; n[i] = R[j]; n[j] = R[i].neg();
            vl.push(vlakPrim(n, R[i].maal(P[j]).min(R[j].maal(P[i])), false));
        };

    paramUitStelsel(naam, v1, v2, par = 'k') {

// twee vlakken door de rechte (P, R) met eenvoudige coëfficiënten

    const a = kand[0];
    let b = kand.find(v => !vpar(v, a));

    const vl = r.shuffle([a, b]).map(n => ({ n, t: vdot(n, P).neg() }));
    vl.forEach(v => zeker(opVlak(P, v) && vdot(v.n, R).nul, 'stelselVoor'));

}
// een rechte in een gevraagde vorm tonen
function rechteTekst(naam, P, R, vorm, r, par = 'k') {
    if (vorm === 'param') return { tex: TX.rechteParam(naam, P, R, par), vorm };
    if (vorm === 'cart') return { tex: TX.rechteCart(naam, P, R), vorm };
    const vl = stelselVoor(P, R, r);
    return { tex: TX.rechteStelsel(naam, vl.map(v => [v.n, v.t]), r.bool()), vorm, vlakken: vl };

// uitleg: steunvector en richtingsvector aflezen of berekenen, afhankelijk van de vorm
function leesRechteUit(naam, rt, P, R, par = 'k') {
    if (rt.vorm === 'param') return { st: [L`Lees af: $${TX.sv(naam)}: \vec P${TX.co(P)}$ en $${TX.rv(naam)}${TX.co(R)}$`], P, R };
    if (rt.vorm === 'cart') return { st: [L`Lees af uit de cartesiaanse vergelijking(en): $${TX.sv(naam)}: \vec P${TX.co(P)}$ en $${TX.rv(naam)}${TX.co(R)}$`], P, R };
    const u = UW.paramUitStelsel(naam, rt.vlakken[0], rt.vlakken[1], par);
    return { st: [L`$${naam}$ is gegeven als snijlijn van twee vlakken.`, ...u.st], P: u.P, R: u.R };
}
function assegTex(a, b, c) {
    const d = (v, x) => { v = Fr.of(v); return { neg: v.n < 0, t: L`\frac{${x}}{${v.abs().tex()}}` }; };
    const ts = [d(a, 'x'), d(b, 'y'), d(c, 'z')];
    return ts.map((q, i) => (i === 0 ? (q.neg ? '-' : '') : (q.neg ? ' - ' : ' + ')) + q.t).join('') + ' = 1';
}

// ---------- figuur: balk in een orthonormaal assenstelsel ----------
function balkPunten(a, b, c) { return { A: V(0, 0, 0), B: V(a, 0, 0), C: V(0, b, 0), D: V(a, b, 0), E: V(0, 0, c), F: V(a, 0, c), G: V(a, b, c), H: V(0, b, c) }; }
const BALK_RIBBEN = ['AB', 'AC', 'AE', 'BD', 'BF', 'CD', 'CH', 'DG', 'EF', 'EH', 'FG', 'GH'];
function svgBalk(a, b, c) {
    const s = 26;
    const pr = ([x, y, z]) => [y * s - x * s * 0.62, -z * s + x * s * 0.46];
    const P = balkPunten(a, b, c);
    const pn = Object.fromEntries(Object.entries(P).map(([k, v]) => [k, pr(vnum(v))]));
    const assen = { x: [[-1, 0, 0], [a + 2, 0, 0]], y: [[0, -1.3, 0], [0, b + 2.2, 0]], z: [[0, 0, -1.3], [0, 0, c + 1.8]] };
    const alle = [...Object.values(pn), ...Object.values(assen).flat().map(pr)];
    const minX = Math.min(...alle.map(p => p[0])) - 24, maxX = Math.max(...alle.map(p => p[0])) + 24;
    const minY = Math.min(...alle.map(p => p[1])) - 22, maxY = Math.max(...alle.map(p => p[1])) + 22;
    let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${minX.toFixed(1)} ${minY.toFixed(1)} ${(maxX - minX).toFixed(1)} ${(maxY - minY).toFixed(1)}" width="${Math.round(maxX - minX)}" font-family="Arial, sans-serif">`;
    svg += '<defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>';
    // plaats van de letters bij de hoekpunten (middelpunt), om botsingen met de getallen op de assen te vermijden
    const mid = pr([a / 2, b / 2, c / 2]);
    const letters = Object.entries(pn).map(([k, p]) => {
        let dx = p[0] - mid[0], dy = p[1] - mid[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
        return { k, p, lx: p[0] + dx * 13 - 5, ly: p[1] + dy * 13 + 5 };
    });
    const botst = (x, y) => letters.some(L => Math.abs(L.lx + 5 - x) < 12 && Math.abs(L.ly - 5 - y) < 14);
    for (const [as, [p0, p1]] of Object.entries(assen)) {
        const [x0, y0] = pr(p0), [x1, y1] = pr(p1);
        svg += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#pijl)"/>`;
        svg += `<text x="${x1 + (as === 'x' ? -10 : as === 'y' ? 4 : 8)}" y="${y1 + (as === 'x' ? 14 : as === 'y' ? -6 : 4)}" font-size="14" font-style="italic" fill="#475569">${as}</text>`;
        const max = as === 'x' ? a + 1 : as === 'y' ? b + 1 : c + 1;
        // streepje loodrecht op de as; het getal staat er recht naast (niet verschoven langs de as),
        // standaard: x-as linksboven, y-as eronder, z-as links
        const e = [0, 0, 0]; e['xyz'.indexOf(as)] = 1;
        const [ux, uy] = pr(e), lu = Math.hypot(ux, uy);
        const nx = -uy / lu, ny = ux / lu; // loodrecht op de as (scherm)
        const zij = as === 'x' ? [-0.6, -0.8] : as === 'y' ? [0, 1] : [-1, 0];
        const t = Math.sign(nx * zij[0] + ny * zij[1]) || 1;
        const ox = nx * t, oy = ny * t;
        for (let i = 1; i <= max; i++) {
            const q = [0, 0, 0]; q['xyz'.indexOf(as)] = i;
            const [tx, ty] = pr(q);
            svg += `<line x1="${(tx - ox * 4).toFixed(1)}" y1="${(ty - oy * 4).toFixed(1)}" x2="${(tx + ox * 4).toFixed(1)}" y2="${(ty + oy * 4).toFixed(1)}" stroke="#94a3b8" stroke-width="1"/>`;
            const k = botst(tx + ox * 11, ty + oy * 11) ? -11 : 11; // botst met een letter → andere kant van de as
            svg += `<text x="${(tx + ox * k).toFixed(1)}" y="${(ty + oy * k + 3.2).toFixed(1)}" font-size="9" text-anchor="middle" fill="#94a3b8">${i}</text>`;
        }
    }
    for (const rib of BALK_RIBBEN) {
        const [p, q] = [pn[rib[0]], pn[rib[1]]];
        const verborgen = rib.includes('A');
        svg += `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="#1e293b" stroke-width="${verborgen ? 1.5 : 2.2}" ${verborgen ? 'stroke-dasharray="5 4"' : ''}/>`;
    }
    for (const { k, p, lx, ly } of letters) {
        svg += `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="#1e3a8a"/>`;
        svg += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="14" font-weight="bold" fill="#1e3a8a">${k}</text>`;
    }
    return svg + '</svg>';
}

regGen({ id: 'vec_deelpunt', cat: 'vec', niveau: 2, titel: 'Punt dat aan een vectorbetrekking voldoet', maak(r) {

            const k = r.pick([2, 3, 4, -1, -2, -3]);
            const A = vplus(P, vmaal(vmin(B, P), k));

                opgave: L`Gegeven: $${TX.pt('A', A)}$ en $${TX.pt('B', B)}$. Bepaal de coördinaat van het punt $P$ waarvoor $\overrightarrow{PA} = ${coefVec(k, L`\overrightarrow{PB}`)}$.`,
                delen: [D.punt('Het punt $P$:', 'P', P)],

                    L`>$\Leftrightarrow\; ${coefVec(k - 1, L`\vec P`)} = ${coefVec(k, L`\vec B`)} - \vec A \;\Leftrightarrow\; \vec P = \dfrac{${coefVec(k, L`\vec B`)} - \vec A}{${k - 1}}$`,
                    L`$co(\vec P) = \left(${[0, 1, 2].map(i => L`\frac{${maalT(k, B[i])} - ${A[i].n < 0 ? haak(A[i].tex()) : A[i].tex()}}{${k - 1}}`).join(L`,\; `)}\right)$`,
                    L`!$${TX.pt('P', P)}$`],
            };
        }
        if (soort === 2) {           // PA = k BP  ⇒  P = (A + kB)/(1 + k)
            const k = r.pick([2, 3, 4, 5, -2, -3]);
            const A = vmin(vmaal(P, 1 + k), vmaal(B, k));
            if (vgelijk(A, B) || A.some(x => Math.abs(x.n) > 15)) continue;
            return {
                opgave: L`Gegeven: $${TX.pt('A', A)}$ en $${TX.pt('B', B)}$. Bepaal de coördinaat van het punt $P$ waarvoor $\overrightarrow{PA} = ${coefVec(k, L`\overrightarrow{BP}`)}$.`,
                delen: [D.punt('Het punt $P$:', 'P', P)],
                hints: [L`$\overrightarrow{PA} = \vec A - \vec P$ en $\overrightarrow{BP} = \vec P - \vec B$ (eindpunt min beginpunt).`, L`$\vec A - \vec P = ${k}(\vec P - \vec B)$. Zet alle termen met $\vec P$ aan één kant.`, L`$${coefVec(1 + k, L`\vec P`)} = \vec A ${k < 0 ? '-' : '+'} ${coefVec(Math.abs(k), L`\vec B`)}$`],
                stappen: [L`$\overrightarrow{PA} = ${coefVec(k, L`\overrightarrow{BP}`)} \;\Leftrightarrow\; \vec A - \vec P = ${k}\left(\vec P - \vec B\right)$`,
                    L`>$\Leftrightarrow\; \vec A - \vec P = ${coefVec(k, L`\vec P`)} ${k < 0 ? '+' : '-'} ${coefVec(Math.abs(k), L`\vec B`)}$`,
                    L`>$\Leftrightarrow\; ${coefVec(1 + k, L`\vec P`)} = \vec A ${k < 0 ? '-' : '+'} ${coefVec(Math.abs(k), L`\vec B`)} \;\Leftrightarrow\; \vec P = \dfrac{\vec A ${k < 0 ? '-' : '+'} ${coefVec(Math.abs(k), L`\vec B`)}}{${1 + k}}$`,
                    L`$co(\vec P) = \left(${[0, 1, 2].map(i => L`\frac{${A[i].tex()} ${k < 0 ? '-' : '+'} ${maalT(Math.abs(k), B[i])}}{${1 + k}}`).join(L`,\; `)}\right)$`,
                    L`!$${TX.pt('P', P)}$`],
            };
        }
        // AP = (p/q) AB
        const q = r.pick([2, 3, 4]), p = r.pick([1, 2, 3, 5, -1]);
        if (ggd(p, q) !== 1) continue;
        const A = r.vec(-5, 5);
        const AB = vmaal(r.vecNZ(-2, 2), q);
        const B2 = vplus(A, AB);
        const c = F(p, q);
        const P2 = vplus(A, vmaal(AB, c));
        return {
            opgave: L`Gegeven: $${TX.pt('A', A)}$ en $${TX.pt('B', B2)}$. Bepaal de coördinaat van het punt $P$ waarvoor $\overrightarrow{AP} = ${coefVec(c, L`\overrightarrow{AB}`)}$.`,
            delen: [D.punt('Het punt $P$:', 'P', P2, { fouten: [{ w: vmaal(AB, c), msg: L`Je berekende $\overrightarrow{AP}$. Het punt $P$ zelf is $\vec P = \vec A + \overrightarrow{AP}$.` }] })],
            hints: [L`$\overrightarrow{AP} = \vec P - \vec A$, dus $\vec P = \vec A + ${coefVec(c, L`\overrightarrow{AB}`)}$.`, L`Bereken eerst $co(\overrightarrow{AB}) = ${TX.co(AB)}$.`],
            stappen: [L`$\overrightarrow{AP} = ${coefVec(c, L`\overrightarrow{AB}`)} \;\Leftrightarrow\; \vec P - \vec A = ${coefVec(c, L`\overrightarrow{AB}`)} \;\Leftrightarrow\; \vec P = \vec A + ${coefVec(c, L`\overrightarrow{AB}`)}$`,
                L`$co(\overrightarrow{AB}) = ${TX.co(AB)}$, dus $co(${coefVec(c, L`\overrightarrow{AB}`)}) = ${TX.co(vmaal(AB, c))}$`,
                L`!$${TX.pt('P', P2)}$`],
        };
    }
} });

regGen({ id: 'vec_deelpunt3', cat: 'vec', niveau: 3, titel: 'Vectorbetrekking met drie punten', maak(r) {

<script>
const naamR = r => r.pick(['a', 'b', 'r', 'm', 'd']);
const naamV = r => r.pick([L`\alpha`, L`\beta`, L`\pi`]);
const HINT_DET = L`Cartesiaanse vergelijking: $\begin{vmatrix} x - x_1 & y - y_1 & z - z_1 \\ a_1 & b_1 & c_1 \\ a_2 & b_2 & c_2 \end{vmatrix} = 0$ met $\vec{P_1}(x_1, y_1, z_1)$ als steunvector en $(a_1, b_1, c_1)$, $(a_2, b_2, c_2)$ als richtingsvectoren. Ontwikkel naar de eerste rij.`;
const HINT_RVDET = L`Determinantenmethode: schrijf de coëfficiënten van $x, y, z$ van beide vergelijkingen onder elkaar. De richtingsvector is $\left(\begin{vmatrix} b_1 & c_1 \\ b_2 & c_2 \end{vmatrix},\, -\begin{vmatrix} a_1 & c_1 \\ a_2 & c_2 \end{vmatrix},\, \begin{vmatrix} a_1 & b_1 \\ a_2 & b_2 \end{vmatrix}\right)$ (vergeet het minteken in het midden niet).`;
const HINT_CART = L`Stelsel cartesiaanse vergelijkingen: $\dfrac{x - x_1}{a} = \dfrac{y - y_1}{b} = \dfrac{z - z_1}{c}$. Is een noemer $0$, dan splits je: die teller is $0$ en de andere gelijkheid blijft.`;
function nietCollineair(A, B, C) { return !visNul(vcross(vmin(B, A), vmin(C, A))); }

// ===================== VERGELIJKINGEN VAN RECHTEN =====================
regGen({ id: 're_param', cat: 'rechte', niveau: 1, titel: 'Parametervergelijking uit steunvector en richtingsvector', maak(r) {
    const n = naamR(r), P = r.vec(-5, 5), R = r.richting(-5, 5, 1);
    return {
        opgave: L`Bepaal een parametervergelijking van de rechte $${n}$ door het punt $${TX.pt('P', P)}$ met richtingsvector $\vec R${TX.co(R)}$.`,
        delen: [D.rechteParam(L`Parametervergelijking van $${n}$:`, n, P, R)],
        hints: [L`Vectoriële vergelijking: $\vec P = \vec{P_1} + k\,\vec R$ met $k \in \mathbb{R}$.`, L`In coördinaten: $x = x_1 + k\,a$, $y = y_1 + k\,b$, $z = z_1 + k\,c$.`, L`Steunvector $\vec P${TX.co(P)}$ en richtingsvector $\vec R${TX.co(R)}$: bv. $x = ${linCF(P[0], [[R[0], 'k']])}$.`],
        stappen: [L`$${TX.sv(n)}: \vec P${TX.co(P)}$ en $${TX.rv(n)}: \vec R${TX.co(R)}$`, L`!$${TX.rechteParam(n, P, R)}$`],
    };
} });

function genCart(nullen) {
    return function (r) {
        const n = naamR(r), P = r.vec(-5, 5);
        let R; do { R = r.richting(-5, 5, nullen); } while (R.filter(x => x.nul).length !== nullen);
        const st = [L`$${TX.sv(n)}: \vec P${TX.co(P)}$ en $${TX.rv(n)}${TX.co(R)}$`, L`$\dfrac{x - x_1}{a} = \dfrac{y - y_1}{b} = \dfrac{z - z_1}{c}$`];
        if (nullen) st.push(L`Opmerking: de noemer bij $${XYZ[R.findIndex(x => x.nul)]}$ is $0$. Dan splits je het stelsel: die teller stel je gelijk aan $0$ en de andere gelijkheid blijft.`);
        st.push(L`!$${TX.rechteCart(n, P, R)}$`);
        return {
            opgave: L`Bepaal een stel cartesiaanse vergelijkingen van de rechte $${n}$ door het punt $${TX.pt('P', P)}$ met richtingsvector $\vec R${TX.co(R)}$.`,
            delen: [D.rechteCart(L`Cartesiaanse vergelijking(en) van $${n}$:`, n, P, R)],
            hints: [HINT_CART, nullen ? L`Hier is een richtingsgetal $0$: delen door $0$ mag niet!` : L`Vul in: $x_1 = ${P[0].tex()}$, $a = ${R[0].tex()}$, ...`],
            stappen: st,
        };
    };
}
regGen({ id: 're_cart', cat: 'rechte', niveau: 1, titel: 'Cartesiaanse vergelijkingen uit steunvector en richtingsvector', maak: genCart(0) });
regGen({ id: 're_cart_nul', cat: 'rechte', niveau: 2, titel: 'Cartesiaanse vergelijkingen met een richtingsgetal 0', maak: genCart(1) });

regGen({ id: 're_twee_punten', cat: 'rechte', niveau: 1, titel: 'Rechte door twee punten', maak(r) {
    let A, B; do { A = r.vec(-6, 6); B = r.vec(-6, 6); } while (vgelijk(A, B) || vmin(B, A).filter(x => x.nul).length > 1);
    const AB = vmin(B, A), R = vprim(AB, false), n = r.pick(['AB', 'a']);
    const st = [L`$${TX.sv(n)}: \vec A${TX.co(A)}$`, L`$${TX.rv(n)}: \overrightarrow{AB}${TX.co(AB)}` + (vgelijk(R, AB) ? '$' : L` \;\rightarrow\; ${TX.co(R)}$ (vereenvoudigd)`)];
    st.push(L`a) $${TX.rechteParam(n, A, R)}$`, L`b) $${TX.rechteCart(n, A, R)}$`);
    return {
        opgave: L`Gegeven: $${TX.pt('A', A)}$ en $${TX.pt('B', B)}$.`,
        delen: [D.rechteParam(L`Bepaal een parametervergelijking van de rechte $AB$.`, n, A, R), D.rechteCart(L`Bepaal een stel cartesiaanse vergelijkingen van de rechte $AB$.`, n, A, R)],
        hints: [L`Kies $\vec A$ als steunvector en $\overrightarrow{AB} = \vec B - \vec A$ als richtingsvector.`, L`$co(\overrightarrow{AB}) = ${TX.co(AB)}$` + (vgelijk(R, AB) ? '' : L`; je mag vereenvoudigen tot $${TX.co(R)}$`), HINT_CART],
        stappen: st,
    };
} });

regGen({ id: 're_aflezen', cat: 'rechte', niveau: 2, titel: 'Steunvector en richtingsvector aflezen (strikvragen)', maak(r) {
    for (;;) {
        const c = [0, 1, 2].map(() => r.pick([1, 1, 1, -1, -1, 2, 3, -2]));
        if (c.every(x => x === 1)) continue;
        const b = [0, 1, 2].map(() => r.nz(-4, 4));
        for (let i = 0; i < 3; i++) if (b[i] < 0 && r.bool(0.6)) { b[i] = -b[i]; c[i] = -c[i]; }
        const q = [0, 1, 2].map(() => r.int(-5, 5));
        const P = [0, 1, 2].map(i => F(q[i], c[i])), R = [0, 1, 2].map(i => F(b[i], c[i]));
        if (P.some(x => x.d > 3)) continue;
        const delen = [0, 1, 2].map(i => {
            const tel = c[i] < 0 ? linCF(F(-q[i]), [[F(c[i]), XYZ[i]]]) : lin([F(c[i])], [XYZ[i]], F(-q[i]));
            return b[i] === 1 ? tel : L`\frac{${tel}}{${b[i]}}`;
        });
        const n = naamR(r), Rp = vprim(R, false);
        const herschrijf = [0, 1, 2].filter(i => c[i] !== 1).map(i => L`$${b[i] === 1 ? delen[i] : delen[i]} = \dfrac{${xMin(XYZ[i], P[i])}}{${R[i].tex()}}$` + (c[i] === -1 ? ' (teller en noemer maal $-1$)' : L` (teller en noemer gedeeld door $${c[i]}$)`));

function rvPaar(r, bereik = 4) {
    for (;;) {
        const R = r.vecNZ(-bereik, bereik), S = r.vecNZ(-bereik, bereik);
        if (visNul(vcross(R, S))) continue;
        if (!vgelijk(vprim(R, false), R) || !vgelijk(vprim(S, false), S)) continue;
        return [R, S];
    }
}
