<script>
// =====================================================================
// FORMULE-LEZER EN NAKIJKMOTOR
// Het antwoord wordt één keer ontleed tot een boom. Die boom wordt zowel
// voor de live weergave als voor het nakijken gebruikt, zodat de leerling
// altijd ziet hoe de app zijn antwoord leest.
// =====================================================================
const Wiskunde = (() => {
    const FUNCTIES = {
        sin:   { tex: '\\sin', f: Math.sin },
        cos:   { tex: '\\cos', f: Math.cos },
        tan:   { tex: '\\tan', f: Math.tan },
        cot:   { tex: '\\cot', f: x => 1 / Math.tan(x) },
        bgsin: { tex: '\\operatorname{Bgsin}', f: Math.asin, cyclo: true },
        bgcos: { tex: '\\operatorname{Bgcos}', f: Math.acos, cyclo: true },
        bgtan: { tex: '\\operatorname{Bgtan}', f: Math.atan, cyclo: true },
        bgcot: { tex: '\\operatorname{Bgcot}', f: x => Math.PI / 2 - Math.atan(x), cyclo: true },
        ln:    { tex: '\\ln', f: Math.log },
        log:   { tex: '\\log', f: Math.log10 },
        exp:   { tex: '\\exp', f: Math.exp },
        sqrt:  { tex: null, f: Math.sqrt },
        abs:   { tex: null, f: Math.abs }
    };
    const SYNONIEMEN = {
        arcsin: 'bgsin', asin: 'bgsin', arccos: 'bgcos', acos: 'bgcos', arctan: 'bgtan', atan: 'bgtan', bgtg: 'bgtan',
        arccot: 'bgcot', acot: 'bgcot', bgcotg: 'bgcot', tg: 'tan', cotg: 'cot', wortel: 'sqrt'
    };
    // Langste naam eerst, zodat "xcos" als x·cos en "exp" niet als e·x·p gelezen wordt.
    const NAMEN = [...Object.keys(FUNCTIES), ...Object.keys(SYNONIEMEN), 'pi', 'x', 'e'].sort((a, b) => b.length - a.length);

    class LeesFout extends Error {
        constructor(boodschap, onvolledig) { super(boodschap); this.onvolledig = !!onvolledig; }
    }

    function voorbereid(invoer) {
        let s = String(invoer == null ? '' : invoer);
        s = s.replace(/^\s*(f\s*['’′]\s*\(\s*x\s*\)|f\s*['’′]|y\s*['’′])\s*=\s*/i, '');
        // n-demachtswortel zoals op papier: ³√(x), ∛x → ((x)^(1/3)) (zie wortel.js; tex toont het weer als wortel)
        if (window.WORTEL) s = WORTEL.omzetten(s, (n, a) => n === 2 ? `sqrt(${a})` : `((${a})^(1/${n}))`);
        s = s.replace(/[−–—]/g, '-').replace(/[·×∙⋅]/g, '*').replace(/÷/g, '/').replace(/π/g, 'pi').replace(/√/g, 'sqrt')
             .replace(/²/g, '^2').replace(/³/g, '^3').replace(/\*\*/g, '^').replace(/,/g, '.')
             .replace(/[\[{]/g, '(').replace(/[\]}]/g, ')');
        return s;
    }

    function naamTekst(naam) {
        const t = { bgsin: 'Bgsin', bgcos: 'Bgcos', bgtan: 'Bgtan', bgcot: 'Bgcot' };
        return t[naam] || naam;
    }

    function tokens(s) {
        const t = [];
        let i = 0;
        while (i < s.length) {
            const c = s[i];
            if (/\s/.test(c)) { i++; continue; }
            if (/[0-9.]/.test(c)) {
                const m = s.slice(i).match(/^(\d+\.?\d*|\.\d+)/);
                if (!m) throw new LeesFout('Er staat een los punt of een losse komma in je antwoord.');
                i += m[1].length;
                if (s[i] === '.') throw new LeesFout('Een getal in je antwoord heeft twee kommatekens.');
                t.push({ k: 'num', v: parseFloat(m[1]) });
                continue;
            }
            if ('+-*/^'.includes(c)) { t.push({ k: 'op', v: c }); i++; continue; }
            if (c === '(' || c === ')') { t.push({ k: c }); i++; continue; }
            if (/[a-z]/i.test(c)) {
                const rest = s.slice(i).toLowerCase();
                const naam = NAMEN.find(n => rest.startsWith(n));
                if (!naam) {
                    const woord = rest.match(/^[a-z]+/)[0];
                    if (woord === 'f') throw new LeesFout('Typ enkel het voorschrift van de afgeleide (wat na "f\'(x) =" komt).');
                    throw new LeesFout(woord.length === 1
                        ? `Ik ken «${woord}» niet. Gebruik x als veranderlijke.`
                        : `Ik ken «${woord}» niet. Kijk bij "Hoe typ ik mijn antwoord?" welke functies je kan gebruiken.`);
                }
                i += naam.length;
                if (naam === 'x') t.push({ k: 'x' });
                else if (naam === 'e' || naam === 'pi') t.push({ k: 'const', v: naam });
                else {
                    const echt = SYNONIEMEN[naam] || naam;
                    const tok = { k: 'fn', v: echt };
                    if (echt === 'log' && s[i] === '_') {
                        const m = s.slice(i + 1).match(/^\d+(\.\d+)?/);
                        if (!m) throw new LeesFout('Schrijf het grondtal direct na log_, bijvoorbeeld log_2(x).');
                        tok.grond = parseFloat(m[0]);
                        if (tok.grond <= 0 || tok.grond === 1) throw new LeesFout('Het grondtal van een logaritme moet positief zijn en verschillend van 1.');
                        i += 1 + m[0].length;
                    }
                    t.push(tok);
                }
                continue;
            }
            if ("'’′".includes(c)) throw new LeesFout('Typ enkel het voorschrift van de afgeleide, zonder accent.');
            if (c === '=') throw new LeesFout('Typ enkel wat na "f\'(x) =" komt, zonder extra gelijkheidsteken.');
            throw new LeesFout(`Het teken «${c}» kan ik niet lezen.`);
        }
        return t;
    }

    function ontleed(invoer) {
        const s = voorbereid(invoer);
        if (!s.trim()) throw new LeesFout('Er is nog geen antwoord.', true);
        if (s.length > 400) throw new LeesFout('Je antwoord is te lang.');
        const t = tokens(s);
        let i = 0;
        const kijk = () => t[i];
        const isOp = (tk, ...ops) => !!tk && tk.k === 'op' && ops.includes(tk.v);
        const startFactor = tk => !!tk && ['num', 'x', 'const', 'fn', '('].includes(tk.k);

        // som := metTeken (('+'|'-') metTeken)*
        function som() {
            let a = metTeken();
            while (isOp(kijk(), '+', '-')) {
                const o = t[i++].v;
                const b = metTeken();
                a = { t: o === '+' ? 'add' : 'sub', a, b };
            }
            return a;
        }
        // Een minteken vooraan geldt voor de hele term: -2x/3 = -(2x/3).
        function metTeken() {
            if (isOp(kijk(), '-')) { i++; return { t: 'neg', a: metTeken() }; }
            if (isOp(kijk(), '+')) { i++; return metTeken(); }
            return product();
        }
        // product := macht (('*'|'/') macht | macht)*  — een weggelaten maalteken telt als gewoon maal
        function product() {
            let a = macht();
            for (;;) {
                const tk = kijk();
                if (isOp(tk, '*', '/')) {
                    i++;
                    let negatief = false;
                    while (isOp(kijk(), '-', '+')) { if (t[i].v === '-') negatief = !negatief; i++; }
                    let b = macht();
                    if (negatief) b = { t: 'neg', a: b };
                    a = { t: tk.v === '*' ? 'mul' : 'div', a, b };
                } else if (startFactor(tk)) {
                    const b = macht();
                    a = { t: 'mul', a, b, imp: true };
                } else break;
            }
            return a;
        }
        function macht() {
            const grond = basis();
            if (isOp(kijk(), '^')) { i++; return { t: 'pow', a: grond, b: exponent() }; }
            return grond;
        }
        function exponent() {
            if (isOp(kijk(), '-')) { i++; return { t: 'neg', a: exponent() }; }
            if (isOp(kijk(), '+')) { i++; return exponent(); }
            return macht();
        }
        function korteExponent(naam) {
            if (isOp(kijk(), '-')) { i++; return { t: 'neg', a: korteExponent(naam) }; }
            const tk = kijk();
            if (tk && (tk.k === 'num' || tk.k === '(')) return basis();
            throw new LeesFout(`Na ${naamTekst(naam)}^ verwacht ik een getal, bijvoorbeeld ${naamTekst(naam)}^2(x).`, !tk);
        }
        function basis() {
            const tk = t[i++];
            if (!tk) throw new LeesFout('Je antwoord stopt te vroeg: er ontbreekt nog iets op het einde.', true);
            if (tk.k === 'num') return { t: 'num', v: tk.v };
            if (tk.k === 'x') return { t: 'x' };
            if (tk.k === 'const') return { t: 'const', v: tk.v };
            if (tk.k === '(') {
                if (kijk() && kijk().k === ')') throw new LeesFout('Er staan lege haakjes () in je antwoord.');
                const e = som();
                const sl = t[i++];
                if (!sl) throw new LeesFout('Er ontbreekt nog een sluitend haakje ).', true);
                if (sl.k !== ')') throw new LeesFout('Er klopt iets niet met de haakjes.');
                return e;
            }
            if (tk.k === 'fn') {
                const naam = tk.v;
                let exp = null;
                if (isOp(kijk(), '^') && naam !== 'sqrt' && naam !== 'abs') { i++; exp = korteExponent(naam); }
                let arg;
                if (!kijk()) throw new LeesFout(`Na ${naamTekst(naam)} moet nog iets komen, bijvoorbeeld ${naamTekst(naam)}(x).`, true);
                if (kijk().k === '(') arg = basis();
                else arg = macht();
                let knoop = { t: 'fn', v: naam, a: arg };
                if (tk.grond) knoop.grond = tk.grond;
                if (exp) knoop = { t: 'pow', a: knoop, b: exp };
                return knoop;
            }
            if (tk.k === ')') throw new LeesFout('Er staat een haakje ) te veel of op een verkeerde plaats.');
            if (tk.k === 'op') throw new LeesFout(`Het teken ${tk.v} staat op een plaats waar ik een getal, x of een functie verwacht.`);
            throw new LeesFout('Dit kan ik niet lezen.');
        }

        const boom = som();
        if (i < t.length) {
            if (t[i].k === ')') throw new LeesFout('Er staat een haakje ) te veel.');
            throw new LeesFout('Ik begrijp je antwoord niet helemaal. Controleer de tekens.');
        }
        return boom;
    }

    // Voor de live weergave tijdens het typen: een onaf antwoord tijdelijk aanvullen
    // (sluithaakjes toevoegen, een laatste losse bewerking of functienaam weglaten).
    function leesVoorbeeld(invoer) {
        try { return { boom: ontleed(invoer) }; }
        catch (e) {
            if (!(e instanceof LeesFout)) throw e;
            if (e.onvolledig) {
                let s = voorbereid(invoer), ingekort = false;
                for (let k = 0; k < 6; k++) {
                    const t = s.replace(/[+\-*/^\s(]+$/, '').replace(/(bgsin|bgcos|bgtan|bgcot|arcsin|arccos|arctan|sqrt|sin|cos|tan|cot|ln|log(_\d*)?|exp|abs)$/i, '');
                    if (t === s) break;
                    s = t; ingekort = true;
                }
                const open = (s.match(/\(/g) || []).length - (s.match(/\)/g) || []).length;
                if (s.trim() && open >= 0) {
                    try { return { boom: ontleed(s + ')'.repeat(open)), aangevuld: open > 0 && !ingekort, bezig: ingekort }; }
                    catch (e2) { /* toon de originele melding */ }
                }
            }
            return { fout: e.message, onvolledig: e.onvolledig };
        }
    }

    // ---------- waarde berekenen ----------
    function machtWaarde(a, b) {
        if (a < 0 && !Number.isInteger(b)) {
            for (const q of [3, 5, 7, 9]) {
                const p = b * q;
                if (Math.abs(p - Math.round(p)) < 1e-9) return Math.pow(-Math.pow(-a, 1 / q), Math.round(p));
            }
            return NaN;
        }
        return Math.pow(a, b);
    }
    function waarde(n, x) {
        switch (n.t) {
            case 'num': return n.v;
            case 'x': return x;
            case 'const': return n.v === 'e' ? Math.E : Math.PI;
            case 'neg': return -waarde(n.a, x);
            case 'add': return waarde(n.a, x) + waarde(n.b, x);
            case 'sub': return waarde(n.a, x) - waarde(n.b, x);
            case 'mul': return waarde(n.a, x) * waarde(n.b, x);
            case 'div': return waarde(n.a, x) / waarde(n.b, x);
            case 'pow': return machtWaarde(waarde(n.a, x), waarde(n.b, x));
            case 'fn': {
                const a = waarde(n.a, x);
                if (n.v === 'log' && n.grond) return Math.log(a) / Math.log(n.grond);
                return FUNCTIES[n.v].f(a);
            }
        }
        return NaN;
    }

    // ---------- LaTeX maken ----------
    function getal(v) {
        if (Number.isInteger(v)) return String(v);
        return String(+v.toPrecision(12)).replace('.', '{,}');
    }
    // Gewone haakjes, behalve rond hoge inhoud (breuken, wortels): daar groeien ze mee.
    const haak = s => /\\frac|\\sqrt|\\left/.test(s) ? '\\left(' + s + '\\right)' : '(' + s + ')';
    const factor = n => ['add', 'sub', 'neg'].includes(n.t) ? haak(tex(n)) : tex(n);
    const fnNaam = n => (n.v === 'log' && n.grond) ? '\\log_{' + getal(n.grond) + '}' : FUNCTIES[n.v].tex;
    function tex(n) {
        switch (n.t) {
            case 'num': return getal(n.v);
            case 'x': return 'x';
            case 'const': return n.v === 'e' ? 'e' : '\\pi';
            case 'add': return tex(n.a) + ' + ' + (n.b.t === 'neg' ? haak(tex(n.b)) : tex(n.b));
            case 'sub': return tex(n.a) + ' - ' + (['add', 'sub', 'neg'].includes(n.b.t) ? haak(tex(n.b)) : tex(n.b));
            case 'neg': return '-' + (['add', 'sub', 'neg'].includes(n.a.t) ? haak(tex(n.a)) : tex(n.a));
            case 'mul': {
                const A = factor(n.a), B = factor(n.b);
                if (!n.imp) return A + ' \\cdot ' + B;
                const punt = /^[0-9]/.test(B) || (n.b.t === 'div' && n.a.t === 'num') || (n.b.t === 'pow' && n.b.a.t === 'num');
                return A + (punt ? ' \\cdot ' : ' ') + B;
            }
            case 'div': return '\\frac{' + tex(n.a) + '}{' + tex(n.b) + '}';
            case 'pow': {
                if (n.a.t === 'fn' && !['sqrt', 'abs'].includes(n.a.v) && n.b.t === 'num' && Number.isInteger(n.b.v) && n.b.v > 0)
                    return fnNaam(n.a) + '^{' + getal(n.b.v) + '}' + haak(tex(n.a.a));
                if (n.b.t === 'div' && n.b.a.t === 'num' && n.b.a.v === 1 && n.b.b.t === 'num' && Number.isInteger(n.b.b.v) && n.b.b.v >= 3)
                    return '\\sqrt[' + n.b.b.v + ']{' + tex(n.a) + '}';
                const atoom = ['x', 'const'].includes(n.a.t) || (n.a.t === 'num' && Number.isInteger(n.a.v)) || (n.a.t === 'fn' && ['sqrt', 'abs'].includes(n.a.v));
                return (atoom ? tex(n.a) : haak(tex(n.a))) + '^{' + tex(n.b) + '}';
            }
            case 'fn': {
                if (n.v === 'sqrt') return '\\sqrt{' + tex(n.a) + '}';
                if (n.v === 'abs') return '\\left|' + tex(n.a) + '\\right|';
                return fnNaam(n) + haak(tex(n.a));
            }
        }
        return '?';
    }
    function texVan(invoer) {
        try { return tex(ontleed(invoer)); }
        catch (e) { console.warn('Kan niet omzetten naar LaTeX:', invoer, e.message); return '\\text{?}'; }
    }
    // In uitwerkingen mag [[...]] gebruikt worden: dat wordt in invoer-notatie gelezen en als formule getoond.
    const vulIn = regel => String(regel).replace(/\[\[(.+?)\]\]/g, (_, e) => texVan(e));

    function bevatCyclo(n) {
        if (!n || typeof n !== 'object') return false;
        if (n.t === 'fn' && FUNCTIES[n.v].cyclo) return true;
        return bevatCyclo(n.a) || bevatCyclo(n.b);
    }

    // ---------- nakijken ----------
    function punten(dom, aantal = 12) {
        const [a, b] = dom, p = [];
        for (let k = 0; k < aantal; k++) p.push(a + (b - a) * (k + 0.5 + 0.35 * Math.sin(k * 12.9898 + 1.7)) / aantal);
        return p;
    }
    const dichtbij = (u, c, tol = 1e-6) => Math.abs(u - c) <= tol * Math.max(1, Math.abs(c), Math.abs(u));

    function vergelijk(u, c, dom) {
        let geldig = 0, gelijk = 0, bijna = 0, userOngeldig = false;
        const ratios = [];
        for (const x of punten(dom, 12)) {
            const vc = waarde(c, x);
            if (!Number.isFinite(vc) || Math.abs(vc) > 1e7) continue;
            geldig++;
            const vu = waarde(u, x);
            if (!Number.isFinite(vu)) { userOngeldig = true; continue; }
            if (dichtbij(vu, vc)) gelijk++;
            if (dichtbij(vu, vc, 5e-3)) bijna++;
            ratios.push(Math.abs(vc) > 1e-9 ? vu / vc : (Math.abs(vu) < 1e-9 ? 1 : NaN));
        }
        return { gelijk: geldig >= 4 && gelijk === geldig, bijna: geldig >= 4 && bijna === geldig, geldig, ratios, userOngeldig };
    }
    function constanteFactor(ratios) {
        if (ratios.length < 4 || ratios.some(r => !Number.isFinite(r))) return null;
        const r0 = ratios[0];
        if (Math.abs(r0) < 1e-9) return null;
        return ratios.every(r => Math.abs(r - r0) <= 1e-6 * Math.max(1, Math.abs(r0))) ? r0 : null;
    }

    // ---------- soorten fouten (voor de leerkrachtfeedback en het rapport) ----------
    const FOUTSOORTEN = {
        kettingbinnen: { label: 'Kettingregel: afgeleide van de binnenste functie fout', tip: 'Leid de binnenste functie apart af: schrijf u = … en u′ = … op en controleer u′ voor je vermenigvuldigt.' },
        kettingbuiten: { label: 'Kettingregel: afgeleide van de buitenste functie fout', tip: 'Leid eerst de buitenste functie af alsof de binnenste functie gewoon u is, bv. (ln u)′ = 1/u, (cos u)′ = −sin u, (tan u)′ = 1/cos²u.' },
        kettingarg:   { label: 'Kettingregel: binnenste functie niet ingevuld', tip: 'In de afgeleide van de buitenste functie blijft de binnenste functie staan: (tan u)′ = 1/cos²u · u′, dus bij tan(2x) is dat 1/cos²(2x), niet 1/cos²(x).' },
        ketting:      { label: 'Kettingregel: afgeleide van de binnenste functie vergeten', tip: 'Schrijf bij een samengestelde functie eerst de binnenste functie u en haar afgeleide u′ op. Vermenigvuldig op het einde altijd met u′.' },
        invullen:     { label: 'Fout bij het invullen in de formule', tip: 'Vul de binnenste functie volledig en met haakjes in, bijvoorbeeld u² = (3x)² = 9x².' },
        product:      { label: 'Productregel niet juist toegepast', tip: 'Bij een product geldt (u·v)′ = u′v + uv′. Schrijf u, u′, v en v′ eerst apart op en vul dan pas in.' },
        quotient:     { label: 'Quotiëntregel niet juist toegepast', tip: 'Onthoud: (u/v)′ = (u′v − uv′)/v². Let op de volgorde in de teller en vergeet het kwadraat in de noemer niet.' },

        }
        const paren = [];
        const k = enkel.slice(0, 30);
        for (let i = 0; i < k.length; i++) for (let j = i + 1; j < k.length; j++) {
            const kaart = k[i].node === k[j].node
                ? new Map([[k[i].node, k[i].soort + '|' + k[j].soort]])
                : new Map([[k[i].node, k[i].soort], [k[j].node, k[j].soort]]);
            paren.push({ fouten: [k[i], k[j]], d: afleiden(oef.fBoom, kaart) });
        }
        return (oef._mutaties = { enkel, paren });
    }
    function mutatieAnalyse(boom, oef) {
        if (!oef.fBoom) return null;
        const m = mutaties(oef);
        for (const e of m.enkel) if (vergelijk(boom, e.d, oef.dom).gelijk) return { codes: [CODE_VAN[e.soort]], delen: [beschrijf(e)] };
        for (const p of m.paren) {
            if (vergelijk(boom, p.d, oef.dom).gelijk && !vergelijk(p.d, oef.dBoom, oef.dom).gelijk)
                return { codes: p.fouten.map(e => CODE_VAN[e.soort]), delen: p.fouten.map(beschrijf) };
        }
        return null;
    }

    // Ontbrekende term of factor zoeken in de oplossing uit de sleutel.
    function termen(n, teken = 1, uit = []) {
        if (n.t === 'add') { termen(n.a, teken, uit); termen(n.b, teken, uit); }
        else if (n.t === 'sub') { termen(n.a, teken, uit); termen(n.b, -teken, uit); }
        else uit.push(teken === 1 ? n : tgst(n));
        return uit;
    }
    function factoren(n, uit = []) {
        if (n.t === 'mul') { factoren(n.a, uit); factoren(n.b, uit); } else uit.push(n);
        return uit;
    }
    function structuurAnalyse(boom, oef) {
        const d = oef.dBoom, dom = oef.dom;
        const ts = termen(d);
        if (ts.length >= 2 && ts.length <= 8) {
            for (let k = 0; k < ts.length; k++) {
                const rest = ts.filter((_, j) => j !== k).reduce((s, t) => opt(s, t));
                if (vergelijk(boom, rest, dom).gelijk) return { code: 'term', tekst: `Er ontbreekt een term in je antwoord: $${mooi(ts[k])}$.` };
                if (vergelijk(boom, opt(rest, tgst(ts[k])), dom).gelijk) return { code: 'teken', tekst: `De term $${mooi(ts[k])}$ staat in jouw antwoord met het verkeerde teken.` };
            }
        }
        let kern = d, negatief = false;
        if (kern.t === 'neg') { kern = kern.a; negatief = true; }
        const fs = factoren(kern);
        if (fs.length >= 2 && fs.length <= 6) {
            for (let k = 0; k < fs.length; k++) {
                if (fs[k].t === 'num') continue;
                const rest = fs.filter((_, j) => j !== k).reduce((s, t) => mul(s, t));
                if (vergelijk(boom, negatief ? tgst(rest) : rest, dom).gelijk) return { code: 'factor', tekst: `Er ontbreekt een factor $${mooi(fs[k])}$ in je antwoord.` };
            }
        }
        return null;
    }

    // ---------- kettinganalyse (2026-11-20): welk deel van de afgeleide klopt, en welk niet? ----------
    // De afgeleide van een samengestelde functie is (afgeleide buitenste functie) · (afgeleide binnenste functie).
    // We splitsen het antwoord van de leerling in factoren en zoeken welke factoren samen de afgeleide van de
    // buitenste functie vormen. Klopt die, dan bekijken we de rest als afgeleide van de binnenste functie (laag per laag).
    function metX(t, u) {
        if (t === u) return { t: 'x' };
        if (!t || typeof t !== 'object') return t;
        const k = Object.assign({}, t);
        if (t.a) k.a = metX(t.a, u);
        if (t.b) k.b = metX(t.b, u);
        return k;
    }
    function binnenVan(n) {
        if (n.t === 'fn' && hangtAf(n.a) && n.a.t !== 'x') return n.a;
        if (n.t === 'pow' && !hangtAf(n.b) && hangtAf(n.a) && n.a.t !== 'x') return n.a;
        if (n.t === 'pow' && !hangtAf(n.a) && hangtAf(n.b) && n.b.t !== 'x') return n.b;
        return null;
    }
    function factorLijst(n, uit = []) {
        if (n.t === 'mul') { factorLijst(n.a, uit); factorLijst(n.b, uit); }
        else if (n.t === 'neg') { uit.push(N(-1)); factorLijst(n.a, uit); }
        else if (n.t === 'div') { if (!isNum(n.a, 1)) factorLijst(n.a, uit); factorLijst(n.b, []).forEach(f => uit.push(isNum(f, -1) ? f : dv(EEN, f))); }
        else uit.push(n);
        return uit;
    }
    const prodBoom = fs => fs.length ? fs.reduce((s, f) => mul(s, f)) : EEN;
    function vecVan(n, pts) { return pts.map(x => waarde(n, x)); }
    function gelijkVec(a, b) {
        let geldig = 0;
        for (let i = 0; i < a.length; i++) {
            const c = b[i], u = a[i];
            if (!Number.isFinite(c) || Math.abs(c) > 1e7) continue;
            if (!Number.isFinite(u) || !dichtbij(u, c)) return false;
            geldig++;
        }
        return geldig >= 4;
    }
    function deelverzamelingen(m, test) {     // eerst de kleinste
        const maskers = [];
        for (let k = 1; k < (1 << m); k++) maskers.push(k);
        maskers.sort((p, q) => bits(p) - bits(q));
        for (const k of maskers) if (test(k)) return k;
        return 0;
        function bits(x) { let c = 0; while (x) { c += x & 1; x >>= 1; } return c; }
    }
    // Vergelijk een stuk van het antwoord (factoren fs) met de afgeleide van deel n. Geeft { code, tekst } of null.
    function deelAnalyse(n, fs, pts) {
        const u = binnenVan(n);
        const juist = afleiden(n, null);
        const vfs = fs.map(f => vecVan(f, pts));
        const prod = k => { const r = pts.map(() => 1); vfs.forEach((v, i) => { if (k & (1 << i)) v.forEach((x, j) => { r[j] *= x; }); }); return r; };
        const alle = (1 << fs.length) - 1;
        if (fs.length > 10) return null;
        if (gelijkVec(prod(alle), vecVan(juist, pts))) return { ok: true };
        if (!u) {
            // geen kettingknoop: misschien een typische fout bij dit deel
            const vR = prod(alle);
            for (const [node, soort] of kandidaten(n)) {
                if (gelijkVec(vR, vecVan(afleiden(n, new Map([[node, soort]])), pts))) return { code: CODE_VAN[soort] || 'onbekend', tekst: beschrijf({ node, soort }) };
            }
            return null;
        }
        const B = afleiden(n, new Map([[n, 'binnenste']])), dU = afleiden(u, null);
        const vB = vecVan(B, pts), vU = vecVan(dU, pts);
        const wat = n.t === 'pow' && hangtAf(n.b) ? 'de exponent' : 'de binnenste functie';
        // 1. afgeleide van de buitenste functie juist?
        const kB = deelverzamelingen(fs.length, k => gelijkVec(prod(k), vB));
        if (kB) {
            const rest = fs.filter((_, i) => !(kB & (1 << i)));
            const vR = prod(alle & ~kB);
            const begin = `Bij $${mooi(n)}$ heb je de afgeleide van de buitenste functie juist: $${mooi(B)}$. `;
            if (!rest.length) return { code: 'ketting', tekst: begin + `Maar je vergat te vermenigvuldigen met de afgeleide van ${wat} $${mooi(u)}$, namelijk $${mooi(dU)}$.` };
            const dieper = deelAnalyse(u, rest, pts);
            if (dieper && dieper.ok) return null;
            if (dieper) return { code: dieper.code, tekst: begin + dieper.tekst };
            if (gelijkVec(vR, vU.map(v => -v))) return { code: 'teken', tekst: begin + `Bij de afgeleide van ${wat} $${mooi(u)}$ klopt het teken niet: het is $${mooi(dU)}$.` };
            return { code: 'kettingbinnen', tekst: begin + `Maar de afgeleide van ${wat} $${mooi(u)}$ klopt niet: jij schreef $${mooi(prodBoom(rest))}$, het moet $${mooi(dU)}$ zijn.` };
        }
        // 2. afgeleide van de binnenste functie juist, buitenste fout?
        if (!vU.every(v => Math.abs(v - 1) < 1e-9)) {
            const kU = deelverzamelingen(fs.length, k => gelijkVec(prod(k), vU));
            if (kU) {
                const rest = fs.filter((_, i) => !(kU & (1 << i)));
                const vR = prod(alle & ~kU);
                const begin = `Bij $${mooi(n)}$ heb je de afgeleide van ${wat} $${mooi(u)}$ juist: $${mooi(dU)}$. `;
                const Bx = metX(B, u);
                if (gelijkVec(vR, vecVan(Bx, pts))) return { code: 'kettingarg', tekst: begin + `Maar in de afgeleide van de buitenste functie moet ${wat} $${mooi(u)}$ blijven staan: het is $${mooi(B)}$, niet $${mooi(Bx)}$.` };
                if (gelijkVec(vR, vB.map(v => -v))) return { code: 'teken', tekst: begin + `Maar bij de afgeleide van de buitenste functie klopt het teken niet: het is $${mooi(B)}$.` };
                return { code: 'kettingbuiten', tekst: begin + `Maar de afgeleide van de buitenste functie klopt niet: jij schreef $${mooi(prodBoom(rest))}$, het moet $${mooi(B)}$ zijn.` };
            }
        }
        return null;
    }
    // Ingang: de hele functie, of per term (som) of per factor (productregel).
    function kettingAnalyse(boom, oef) {
        const pts = punten(oef.dom, 12), f = oef.fBoom;
        if (binnenVan(f)) { const r = deelAnalyse(f, factorLijst(boom), pts); return r && !r.ok ? r : null; }
        const sT = termen(boom);
        if (f.t === 'add' || f.t === 'sub') {
            const fT = termen(f).filter(t => hangtAf(t));
            const verwacht = fT.map(t => vecVan(afleiden(t, null), pts));
            const vrij = sT.filter(s => !verwacht.some(v => gelijkVec(vecVan(s, pts), v)));
            for (let i = 0; i < fT.length; i++) {
                if (sT.some(s => gelijkVec(vecVan(s, pts), verwacht[i]))) continue;
                for (const s of vrij) {
                    const r = deelAnalyse(fT[i], factorLijst(s), pts);
                    if (r && !r.ok) return { code: r.code, tekst: `Bij de term $${mooi(fT[i])}$: ` + r.tekst };
                }
            }
            return null;
        }
        if (f.t === 'mul' && hangtAf(f.a) && hangtAf(f.b) && sT.length === 2) {
            const { a: u, b: v } = f;
            const vu = vecVan(u, pts), vv = vecVan(v, pts);
            const rollen = [{ hele: v, deel: u, naam: "u'\\cdot v" }, { hele: u, deel: v, naam: "u\\cdot v'" }];
            for (const s of sT) {
                const fs = factorLijst(s), vfs = fs.map(g => vecVan(g, pts));
                for (const rol of rollen) {
                    const doel = rol.hele === v ? vv : vu;
                    const prod = k => { const r = pts.map(() => 1); vfs.forEach((w, i) => { if (k & (1 << i)) w.forEach((x, j) => { r[j] *= x; }); }); return r; };
                    if (fs.length > 10) continue;
                    const k = deelverzamelingen(fs.length, m => gelijkVec(prod(m), doel));
                    if (!k) continue;
                    const rest = fs.filter((_, i) => !(k & (1 << i)));
                    const r = deelAnalyse(rol.deel, rest.length ? rest : [EEN], pts);
                    if (r && !r.ok) return { code: r.code, tekst: `In de productregel $(u\\cdot v)' = u'v + uv'$ met $u = ${mooi(u)}$ en $v = ${mooi(v)}$ klopt de term $${rol.naam}$ niet. ` + r.tekst };
                }
            }
        }
        return null;
    }

    // oef: { fBoom, dBoom, dom, fouten: [{ boom, tekst, code }] }
    // Resultaat: { status: 'juist'|'fout'|'onleesbaar', boom, boodschap, code, codes, delen, onvereenvoudigd }
    function beoordeel(invoer, oef) {
        let boom;
        try { boom = ontleed(invoer); }
        catch (e) { if (e instanceof LeesFout) return { status: 'onleesbaar', boodschap: e.message }; throw e; }
        const v = vergelijk(boom, oef.dBoom, oef.dom);
        if (v.gelijk) return { status: 'juist', boom, onvereenvoudigd: grootte(boom) > 1.6 * grootte(oef.dBoom) + 4 };
        const fout = (code, boodschap, extra) => Object.assign({ status: 'fout', boom, code, codes: [code], boodschap }, extra || {});
        for (const fo of oef.fouten || []) {
            if (vergelijk(boom, fo.boom, oef.dom).gelijk) return fout(fo.code || codeVoorTekst(fo.tekst), fo.tekst);
        }
        if (oef.fBoom && vergelijk(boom, oef.fBoom, oef.dom).gelijk)
            return fout('functie', "Dit is de functie f(x) zelf. Je moet de afgeleide f'(x) berekenen.");
        if (v.userOngeldig)
            return fout('domein', "Je antwoord bestaat niet voor alle x waar f'(x) wel bestaat (bv. een wortel of logaritme van een negatief getal, of delen door 0).");
        const m = mutatieAnalyse(boom, oef);
        if (m) return fout(m.codes[0], m.delen.length === 1 ? m.delen[0] : 'Je maakte twee fouten: ' + m.delen.join(' '), { codes: m.codes, delen: m.delen });
        let ka = null;
        try { ka = kettingAnalyse(boom, oef); } catch (e) { ka = null; } // de analyse mag het nakijken nooit breken
        if (ka) return fout(ka.code, ka.tekst);
        const r = constanteFactor(v.ratios);
        if (r !== null && Math.abs(r + 1) < 1e-6)
            return fout('teken', 'Bijna! Je antwoord is precies het tegengestelde van de afgeleide. Ergens staat een minteken te veel of te weinig.');
        if (v.bijna)
            return fout('afronding', 'Je antwoord ligt heel dicht bij de afgeleide, maar is niet exact. Gebruik exacte waarden (zoals 1/3, ln(2) of sqrt(2)) in plaats van afgeronde kommagetallen.');
        const s = structuurAnalyse(boom, oef);
        if (s) return fout(s.code, s.tekst);
        if (r !== null) {
            const rg = alsGetal(r), ig = alsGetal(1 / r);
            let zin = 'Je antwoord heeft de goede vorm, maar verschilt een constante factor van de juiste afgeleide.';
            if (r > 0 && r < 1 && ig) zin = `Je antwoord heeft de goede vorm, maar is maar $${tex(rg || ig)}$ keer de juiste afgeleide: er ontbreekt een factor $${tex(ig)}$.`;
            else if (r > 1 && rg) zin = `Je antwoord heeft de goede vorm, maar is $${tex(rg)}$ keer te groot: er staat ergens een factor $${tex(rg)}$ te veel.`;
            else if (r < 0) zin = 'Je antwoord heeft de goede vorm, maar zowel het teken als een constante factor kloppen niet.';
            return fout('factor', zin + ' Kijk vooral naar de afgeleide van de binnenste functie en naar de exponent die vooraan komt.');
        }
        return fout('onbekend', null);
    }

    // Controle van de oplossingssleutel: vergelijkt d met de numerieke afgeleide van f.
    function controleerAfgeleide(fBoom, dBoom, dom) {
        let ok = 0;
        const problemen = [];
        for (const x of punten(dom, 14)) {
            const h = 1e-5 * Math.max(1, Math.abs(x));
            const f1 = waarde(fBoom, x + h), f0 = waarde(fBoom, x - h), d = waarde(dBoom, x);
            if (![f1, f0, d].every(Number.isFinite) || Math.abs(d) > 1e7) continue;
            const num = (f1 - f0) / (2 * h);
            if (Math.abs(num - d) > 1e-4 * Math.max(1, Math.abs(d))) problemen.push(`x = ${x.toFixed(3)}: numeriek ${num.toPrecision(6)}, sleutel ${d.toPrecision(6)}`);
            else ok++;
        }
        return { ok, problemen };
    }

    return { ontleed, leesVoorbeeld, waarde, tex, texVan, vulIn, bevatCyclo, punten, vergelijk, beoordeel, controleerAfgeleide, LeesFout, FUNCTIES,
             FOUTSOORTEN, codeVoorTekst, afleiden, vereenvoudig, mooi, kandidaten, mutaties };
})();
</script>

<script>
// =====================================================================
// GENERATOREN: sjablonen die met willekeurige getallen telkens een nieuwe
// oefening maken (met uitwerking en typische fouten). Elke gemaakte
// oefening wordt vóór gebruik nog numeriek gecontroleerd.
// =====================================================================
const Generatoren = (() => {
    const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    const rnz = (a, b) => { let v; do { v = ri(a, b); } while (v === 0); return v; };
    const kies = arr => arr[Math.floor(Math.random() * arr.length)];
    // c maal s in invoer-notatie: co(1,'x') = 'x', co(-1,'x') = '-x', co(3,'x^2') = '3x^2'
    const co = (c, s) => c === 1 ? s : c === -1 ? '-' + s : (/^[0-9]/.test(s) ? c + '*' + s : c + s);
    const plus = s => { s = String(s); return s.startsWith('-') ? ' - ' + s.slice(1) : ' + ' + s; };
    const xm = n => n === 0 ? '1' : n === 1 ? 'x' : 'x^' + n;
    const mon = (c, n) => n === 0 ? String(c) : co(c, xm(n));
    const lin = (a, b) => co(a, 'x') + (b === 0 ? '' : plus(b));
    const par = a => a < 0 ? `(${a})` : String(a);
    const T = s => '[[' + s + ']]';

    const lijst = [
        { id: 'veelterm', cat: 'basis', niveau: 1, voor: [5, 8], maak() {
            const n = ri(3, 6), m = ri(2, n - 1), a = rnz(-5, 5), b = rnz(-6, 6), c = rnz(-9, 9), k = rnz(-9, 9);
            const f = mon(a, n) + plus(mon(b, m)) + plus(mon(c, 1)) + plus(k);
            const d = mon(a * n, n - 1) + plus(mon(b * m, m - 1)) + plus(c);
            return { f, d, dom: [-2, 2], regel: "Somregel en machtsregel: $(x^n)' = n\\,x^{n-1}$",
                s: ['Leid elke term apart af met de machtsregel. Een constante factor blijft staan.',
                    `$\\left(${T(mon(a, n))}\\right)' = ${T(mon(a * n, n - 1))}$, $\\;\\left(${T(mon(b, m))}\\right)' = ${T(mon(b * m, m - 1))}$ en $\\left(${T(mon(c, 1))}\\right)' = ${c}$`,
                    `De afgeleide van de constante $${k}$ is $0$.`],
                fout: [`${d}${plus(k)} | De afgeleide van een constante is 0.`] };
        } },
        { id: 'machten', cat: 'basis', niveau: 2, voor: [5, 8], maak() {
            const a = rnz(-6, 6), n = ri(1, 3), b = ri(2, 8), p = -a * n;
            const f = `${a}/${xm(n)}` + plus(co(b, 'sqrt(x)'));
            const t2 = b % 2 === 0 ? (b === 2 ? '1/sqrt(x)' : `${b / 2}/sqrt(x)`) : `${b}/(2sqrt(x))`;
            const d = `${p}/${xm(n + 1)}` + plus(t2);
            return { f, d, dom: [0.3, 3], regel: 'Schrijf elke term als macht van $x$ en gebruik de machtsregel.',
                s: [`Als machten: $${T(co(a, `x^(-${n})`) + plus(co(b, 'x^(1/2)')))}$`,
                    `$\\left(${T(co(a, `x^(-${n})`))}\\right)' = ${T(co(p, `x^(-${n + 1})`))} = ${T(`${p}/${xm(n + 1)}`)}$`,
                    `$\\left(${T(co(b, 'x^(1/2)'))}\\right)' = ${T(`${b}/2 x^(-1/2)`)} = ${T(t2)}$`],
                fout: [`${p}/${xm(n)}${plus(t2)} | Bij $x^{-${n}}$ daalt de exponent met 1: hij wordt $-${n + 1}$.`] };
        } },
        { id: 'linmacht', cat: 'ketting', niveau: 1, voor: [5, 8], maak() {
            const a = kies([2, 3, 4, 5, -2, -3]), b = rnz(-5, 5), n = ri(3, 7), u = lin(a, b);
            const d = `${n * a}(${u})^${n - 1}`;
            return { f: `(${u})^${n}`, d, dom: [-0.5, 0.5], regel: "Kettingregel: $\\left(u^n\\right)' = n\\,u^{n-1}\\cdot u'$",
                s: [`Buitenste functie: $u^{${n}}$, binnenste functie: $u = ${T(u)} \\Rightarrow u' = ${a}$`,
                    `$f'(x) = ${n}\\left(${T(u)}\\right)^{${n - 1}}\\cdot ${par(a)} = ${T(d)}$`],
                fout: [`${n}(${u})^${n - 1} | Vergeet de afgeleide van de binnenste functie niet: $\\left(${T(u)}\\right)' = ${a}$.`] };
        } },
        { id: 'kwadmacht', cat: 'ketting', niveau: 2, voor: [5, 8], maak() {
            const a = kies([1, 2, 3, -1, -2]), c = rnz(-5, 5), n = ri(2, 5);
            const u = mon(a, 2) + plus(c), du = mon(2 * a, 1);
            const pw = n - 1 === 1 ? '' : `^${n - 1}`;
            const d = `${2 * a * n}x(${u})${pw}`;
            return { f: `(${u})^${n}`, d, dom: [-1.5, 1.5], regel: "Kettingregel: $\\left(u^n\\right)' = n\\,u^{n-1}\\cdot u'$",
                s: [`$u = ${T(u)} \\Rightarrow u' = ${T(du)}$`,
                    `$f'(x) = ${n}\\left(${T(u)}\\right)${pw ? `^{${n - 1}}` : ''}\\cdot ${T(du)} = ${T(d)}$`],
                fout: [`${n}(${u})${pw} | Vergeet de afgeleide van de binnenste functie niet: $\\left(${T(u)}\\right)' = ${T(du)}$.`] };
        } },
        { id: 'wortel', cat: 'ketting', niveau: 2, voor: [5, 8], maak() {
            const a = ri(1, 3), b = ri(1, 5), c = ri(1, 6);
            const u = mon(a, 2) + plus(mon(b, 1)) + plus(c), du = mon(2 * a, 1) + plus(b);
            const d = `(${du})/(2sqrt(${u}))`;
            return { f: `sqrt(${u})`, d, dom: [0.1, 3], regel: "Kettingregel: $\\left(\\sqrt{u}\\right)' = \\frac{u'}{2\\sqrt{u}}$",
                s: [`$u = ${T(u)} \\Rightarrow u' = ${T(du)}$`, `$f'(x) = \\frac{u'}{2\\sqrt{u}} = ${T(d)}$`],
                fout: [`1/(2sqrt(${u})) | Vergeet de afgeleide van de binnenste functie niet: $\\left(${T(u)}\\right)' = ${T(du)}$.`] };

            const a = kies([1, 2, 3, -1]), b = kies([2, 3, 4]), fn = kies(['sin', 'cos']);
            const E = `e^(${co(a, 'x')})`, bx = `${b}x`, S = `sin(${bx})`, C = `cos(${bx})`, V = fn === 'sin' ? S : C;
            const dV = fn === 'sin' ? `${b}${C}` : `-${b}${S}`;
            const haak = fn === 'sin' ? co(a, S) + plus(`${b}${C}`) : co(a, C) + plus(`-${b}${S}`);
            const d = `${E}(${haak})`;
            return { f: `${E} ${V}`, d, dom: [-1, 1], regel: "Productregel $(u\\cdot v)' = u'v + uv'$, met de kettingregel voor beide factoren",
                s: [`$u = ${T(E)} \\Rightarrow u' = ${T(co(a, E))}$ en $v = ${T(V)} \\Rightarrow v' = ${T(dV)}$`,
                    `$f'(x) = ${T(`${co(a, E)} ${V}`)} + ${T(E)}\\cdot ${T(dV.startsWith('-') ? '(' + dV + ')' : dV)}$`,
                    `$= ${T(d)}$`],
                fout: [`${a}*${E}*${dV.startsWith('-') ? '(' + dV + ')' : dV} | $(u\\cdot v)' \\neq u'\\cdot v'$. Gebruik de productregel.`] };
        } },
        { id: 'expgonio3', cat: 'expgonio', niveau: 3, voor: [5, 8], maak() {
            if (Math.random() < 0.5) {
                const a = kies([1, 2, 3]), fn = kies(['sin', 'cos']), u = mon(a, 2), du = mon(2 * a, 1), U = `${fn}(${u})`;
                const dU = fn === 'sin' ? `${du} cos(${u})` : `-${du} sin(${u})`;
                const d = `${dU} e^(${U})`;
                return { f: `e^(${U})`, d, dom: [-1, 1], regel: 'Kettingregel in drie lagen: exponentiële functie, ' + (fn === 'sin' ? 'sinus' : 'cosinus') + ', veelterm',
                    s: [`$\\left(e^v\\right)' = e^v\\cdot v'$ met $v = ${T(U)}$`,
                        `$v' = ${fn === 'sin' ? T(`cos(${u})`) : T(`-sin(${u})`)}\\cdot\\left(${T(u)}\\right)' = ${T(dU)}$`,
                        `$f'(x) = ${T(d)}$`],
                    fout: [`${fn === 'sin' ? '' : '-'}${fn === 'sin' ? 'cos' : 'sin'}(${u}) e^(${U}) | Vergeet de binnenste laag niet: $\\left(${T(u)}\\right)' = ${T(du)}$.`] };
            }
            const a = kies([1, 2, 3]), fn = kies(['sin', 'cos']), L = `ln(${co(a, 'x')})`, S = `sin(${L})`, C = `cos(${L})`, U = fn === 'sin' ? S : C;
            const d = fn === 'sin' ? `2${S}${C}/x` : `-2${C}${S}/x`;
            return { f: `${U}^2`, d, dom: [0.3, 4], regel: 'Kettingregel in drie lagen: kwadraat, ' + (fn === 'sin' ? 'sinus' : 'cosinus') + ', logaritme',
                s: [`Buitenste laag: $\\left(u^2\\right)' = 2u\\cdot u'$ met $u = ${T(U)}$`,
                    `Middelste laag: $\\left(${T(U)}\\right)' = ${fn === 'sin' ? T(C) : T('-' + S)}\\cdot\\left(${T(L)}\\right)'$`,
                    `Binnenste laag: $\\left(${T(L)}\\right)' = \\frac{${a === 1 ? '1' : a}}{${a === 1 ? 'x' : a + 'x'}} = \\frac{1}{x}$`,
                    `$f'(x) = ${T(d)}$`],
                fout: [`${fn === 'sin' ? '2' + S + C : '-2' + C + S} | Vergeet de binnenste laag niet: $\\left(${T(L)}\\right)' = \\frac{1}{x}$.`] };
        } },
    ];
    return { lijst };
})();
</script>

<script>
// =====================================================================
// APP: menu, oefenen, toets en rapport
// =====================================================================
const Afgeleiden = (() => {
    'use strict';
    const W = Wiskunde;

    // ---------- hulpfuncties ----------
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const kies = arr => arr[Math.floor(Math.random() * arr.length)];
    function schud(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
        return a;
    }
    function wiskunde(tex, groot = false) {
        if (window.katex) {
            try { return katex.renderToString(tex, { throwOnError: false, displayMode: groot, strict: 'ignore' }); }
            catch (e) { /* val terug op gewone tekst */ }
        }
        return '<code>' + esc(tex) + '</code>';
    }
    // Tekst met $...$ (LaTeX) en [[...]] (invoer-notatie) omzetten naar HTML.
    function rijkeTekst(regel) {
        return W.vulIn(regel).split('$').map((d, i) => i % 2 ? wiskunde('\\displaystyle ' + d) : esc(d)).join('');
    }
    const isAanraak = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

    // ---------- hoofdstukken en niveaus ----------
    const HOOFDSTUKKEN = [
        { id: 'basis', naam: 'Rekenregels, veeltermen en machten', uitleg: 'som, veelvoud, xⁿ, wortels als machten' },
        { id: 'prodquot', naam: 'Product- en quotiëntregel', uitleg: 'veeltermen en rationale functies' },
        { id: 'ketting', naam: 'Kettingregel', uitleg: 'machten en wortels van functies' },
        { id: 'gonio', naam: 'Goniometrische functies', uitleg: 'sin, cos, tan en cot' },
        { id: 'explog', naam: 'Exponentiële en logaritmische functies', uitleg: 'eˣ, aˣ, ln, log' },
        { id: 'expgonio', naam: 'Exp, log en goniometrie gemengd', uitleg: 'kettingregel met eˣ, ln, sin, cos, tan door elkaar' },
        { id: 'cyclo', naam: 'Cyclometrische functies', uitleg: 'Bgsin, Bgcos, Bgtan, Bgcot', enkel8: true },
        { id: 'mix', naam: 'Gemengde uitdagingen', uitleg: 'alles door elkaar, vaak in meerdere stappen' }
    ];
    const NIVEAUS = { 1: 'Basis', 2: 'Gemiddeld', 3: 'Uitdaging' };
    // Verdeling bij "Gemengd": 8 uur krijgt vooral moeilijke, maar ook af en toe makkelijke oefeningen.
    const MENGING = { 5: { 1: 0.35, 2: 0.45, 3: 0.20 }, 8: { 1: 0.15, 2: 0.40, 3: 0.45 } };
    const KANS_GENERATOR = 0.3;
    const hoofdstukNaam = id => (HOOFDSTUKKEN.find(h => h.id === id) || { naam: id }).naam;
    const sterren = n => '★'.repeat(n) + ' ' + NIVEAUS[n];

    // ---------- oefeningenbank inlezen en controleren ----------
    function leesBank() {
        const ruw = [];
        document.querySelectorAll('script.oefendata').forEach(blok => {
            const std = { cat: 'basis', niveau: '1', voor: '5 8' };
            let huidig = null;
            blok.textContent.split(/\r?\n/).forEach(r => {
                const regel = r.trim();
                if (!regel || regel.startsWith('//')) return;
                if (regel.startsWith('@')) {
                    const m = regel.match(/^@(\w+)\s+(.+)$/);
                    if (m) std[m[1]] = m[2].trim();
                    return;
                }
                const m = regel.match(/^(\w+)\s*:\s*(.*)$/);
                if (!m) { console.warn('Onbekende regel in de oefeningenbank:', regel); return; }
                const [, k, v] = m;
                if (k === 'f') { huidig = { cat: std.cat, niveau: std.niveau, voor: std.voor, f: v, s: [], fout: [] }; ruw.push(huidig); return; }
                if (!huidig) return;
                if (k === 's') huidig.s.push(v);
                else if (k === 'fout') huidig.fout.push(v);
                else huidig[k] = v;
            });
        });
        return ruw;
    }

    function bouwOefening(r, id, gen) {
        const voor = Array.isArray(r.voor) ? r.voor : String(r.voor).split(/[\s,]+/).filter(Boolean).map(Number);
        const dom = Array.isArray(r.dom) ? r.dom : String(r.dom || '0.3 2.5').trim().split(/\s+/).map(Number);
        const o = { id, gen: !!gen, cat: r.cat, niveau: +r.niveau, voor, f: r.f, d: r.d, dom,
                    regel: r.regel || '', stappen: r.s || [], fouten: [], problemen: [], waarschuwingen: [] };
        try { o.fBoom = W.ontleed(r.f); } catch (e) { o.problemen.push('f onleesbaar: ' + e.message); }
        try { o.dBoom = W.ontleed(r.d); } catch (e) { o.problemen.push('d onleesbaar: ' + e.message); }
        for (const fo of r.fout || []) {
            const i = fo.indexOf('|');
            if (i < 0) { o.waarschuwingen.push('fout zonder |: ' + fo); continue; }
            try { const tekst = fo.slice(i + 1).trim(); o.fouten.push({ boom: W.ontleed(fo.slice(0, i)), tekst, bron: fo.slice(0, i).trim(), code: W.codeVoorTekst(tekst) }); }
            catch (e) { o.waarschuwingen.push('fout onleesbaar: ' + fo); }
        }
        if (dom.length !== 2 || dom.some(v => !Number.isFinite(v)) || dom[0] >= dom[1]) o.problemen.push('ongeldig domein: ' + r.dom);
        if (o.fBoom && o.dBoom && !o.problemen.length) {
            const c = W.controleerAfgeleide(o.fBoom, o.dBoom, dom);
            if (c.problemen.length) o.problemen.push('oplossing klopt niet (' + c.problemen[0] + ')');
            if (c.ok < 6) o.problemen.push('te weinig geldige testpunten (' + c.ok + ')');
            o.fouten = o.fouten.filter(fo => {
                const gelijk = W.vergelijk(fo.boom, o.dBoom, dom).gelijk;
                if (gelijk) o.waarschuwingen.push('"fout" is eigenlijk juist: ' + fo.bron);
                return !gelijk;
            });
            if (voor.includes(5) && (W.bevatCyclo(o.fBoom) || W.bevatCyclo(o.dBoom))) o.problemen.push('cyclometrische functie in een oefening voor 5 uur');
            o.fTex = W.tex(o.fBoom);
            o.dTex = W.tex(o.dBoom);
        }
        if (!HOOFDSTUKKEN.some(h => h.id === o.cat)) o.problemen.push('onbekend hoofdstuk: ' + o.cat);
        if (![1, 2, 3].includes(o.niveau)) o.problemen.push('onbekend niveau: ' + r.niveau);
        if (!voor.length || voor.some(v => v !== 5 && v !== 8)) o.problemen.push('onbekende richting: ' + r.voor);
        return o;
    }

    const BANK = [], AFGEKEURD = [];
    function laadBank() {
        BANK.length = 0; AFGEKEURD.length = 0;
        leesBank().forEach((r, i) => {
            if (r.uit) return; // uitgeschakeld ("uit:"), maar het id blijft gereserveerd voor het dashboard
            const o = bouwOefening(r, 'h' + (i + 1), false);
            (o.problemen.length ? AFGEKEURD : BANK).push(o);
            if (o.waarschuwingen.length) console.warn('Waarschuwing bij', o.f, o.waarschuwingen);
        });
        if (AFGEKEURD.length) console.warn('Afgekeurde oefeningen (worden niet gebruikt):', AFGEKEURD.map(o => o.f + ' → ' + o.problemen.join('; ')));
    }

    let genTeller = 0;
    function maakGegenereerd(g) {
        for (let poging = 0; poging < 8; poging++) {
            let r;
            try { r = g.maak(); } catch (e) { console.warn('Generator', g.id, e); continue; }
            const o = bouwOefening({ ...r, cat: g.cat, niveau: g.niveau, voor: g.voor }, 'g' + (++genTeller) + '-' + g.id, true);
            if (!o.problemen.length) return o;
            console.warn('Generator', g.id, 'maakte een ongeldige oefening:', r.f, o.problemen);
        }
        return null;
    }

    // ---------- instellingen ----------
    const STANDAARD = { richting: 8, cats: HOOFDSTUKKEN.map(h => h.id), niveau: 'mix', toetsN: 10, naam: '', eigenKlavier: false };
    const S = Object.assign({}, STANDAARD);
    try {
        const b = JSON.parse(localStorage.getItem('afgeleiden.v2') || 'null');
        if (b && typeof b === 'object') {
            if (b.richting === 5 || b.richting === 8) S.richting = b.richting;
            if (Array.isArray(b.cats)) S.cats = b.cats.filter(c => HOOFDSTUKKEN.some(h => h.id === c));
            if (['mix', '1', '2', '3'].includes(b.niveau)) S.niveau = b.niveau;
            if ([5, 10, 15, 20].includes(b.toetsN)) S.toetsN = b.toetsN;
            S.eigenKlavier = !!b.eigenKlavier;
        }
    } catch (e) { /* geen opslag beschikbaar */ }
    function bewaar() { try { localStorage.setItem('afgeleiden.v2', JSON.stringify(S)); } catch (e) { /* geen opslag */ } }
    bewaar(); // een vroeger bewaarde naam meteen overschrijven

    // ---------- selectie ----------
    const actieveCats = () => S.cats.filter(c => HOOFDSTUKKEN.some(h => h.id === c && !(h.enkel8 && S.richting === 5)));
    // Veiligheidsnet: in 5 uur komt nooit een cyclometrische functie voor.
    // Welke soorten functies komen in een oefening (of haar afgeleide) voor? Zo krijgt een leerling die enkel
    // "exponentiële en logaritmische functies" aanvinkt geen oefening met sin of cos.
    function nodigeHoofdstukken(o) {
        if (o._nodig) return o._nodig;
        const heeft = (n, test) => !!n && typeof n === 'object' && (test(n) || heeft(n.a, test) || heeft(n.b, test));
        const metX = n => heeft(n, k => k.t === 'x');
        const gonio = n => n.t === 'fn' && ['sin', 'cos', 'tan', 'cot'].includes(n.v);
        const explog = n => (n.t === 'fn' && ['ln', 'log', 'exp'].includes(n.v)) || (n.t === 'const' && n.v === 'e') || (n.t === 'pow' && metX(n.b));
        const cyclo = n => n.t === 'fn' && W.FUNCTIES[n.v].cyclo;
        const nodig = [];
        [['gonio', gonio], ['explog', explog], ['cyclo', cyclo]].forEach(([cat, test]) => {
            // "Exp, log en goniometrie gemengd" dekt zelf goniometrie en exp/log.
            if (o.cat === 'expgonio' && (cat === 'gonio' || cat === 'explog')) return;
            if (cat !== o.cat && (heeft(o.fBoom, test) || heeft(o.dBoom, test))) nodig.push(cat);
        });
        return (o._nodig = nodig);
    }
    // De gemengde uitdagingen volgen de andere aangevinkte hoofdstukken; staat "gemengd" alleen aangevinkt, dan mag alles.
    function hoofdstukkenOk(o) {
        const act = actieveCats();
        if (o.cat === 'mix' && act.every(c => c === 'mix')) return true;
        return nodigeHoofdstukken(o).every(c => act.includes(c));
    }
    const magGebruiken = o => o.voor.includes(S.richting) && !(S.richting === 5 && (W.bevatCyclo(o.fBoom) || W.bevatCyclo(o.dBoom))) && hoofdstukkenOk(o);
    const vaste = (niveau, cats = actieveCats()) => BANK.filter(o => magGebruiken(o) && cats.includes(o.cat) && (niveau == null || o.niveau === niveau));
    const gens = (niveau, cats = actieveCats()) => Generatoren.lijst.filter(g => g.voor.includes(S.richting) && cats.includes(g.cat) && (niveau == null || g.niveau === niveau));
    function niveausBeschikbaar() {
        const lv = S.niveau === 'mix' ? [1, 2, 3] : [+S.niveau];
        return lv.filter(l => vaste(l).length || gens(l).length);
    }
    function kiesNiveau(lv) {
        if (lv.length === 1) return lv[0];
        const w = MENGING[S.richting];
        let r = Math.random() * lv.reduce((s, l) => s + w[l], 0);
        for (const l of lv) { r -= w[l]; if (r <= 0) return l; }
        return lv[lv.length - 1];
    }
    function maakVoor(o) {
        if (!o) return null;
        if (S.richting === 5 && (W.bevatCyclo(o.fBoom) || W.bevatCyclo(o.dBoom))) return null;
        if (!hoofdstukkenOk(o)) return null;
        return o;
    }

    // ---------- gedeelde stukken ----------
    function typHulpHTML() {
        const voorbeelden = ['3x^2 - 5x + 1', '2x cos(x^2)', 'e^(2x)', 'sqrt(x^2+1)', '³√(x^2+1)', 'ln(x^2+1)', 'log_2(x)', 'sin(x)^2', 'sin^2(x)', '1/(2x)', '1/2x', '-x^2'];
        if (S.richting === 8) voorbeelden.push('Bgsin(2x)', 'Bgtan(x)^2');
        const rijen = voorbeelden.map(v => `<tr><td><code>${esc(v)}</code></td><td>${wiskunde(W.texVan(v))}</td></tr>`).join('');
        return `<details class="uitleg geen-print"><summary>❓ Hoe typ ik mijn antwoord?</summary><div class="inhoud">
            <p>Typ met het schermtoetsenbord of met je eigen toetsenbord. Onder het invoervak zie je meteen hoe de app je antwoord leest: kijk dat altijd even na.</p>
            <table class="typtabel"><tr><td class="grijs klein">Je typt</td><td class="grijs klein">De app leest</td></tr>${rijen}</table>
            <p>Een maalteken mag je weglaten: <code>2x</code>, <code>x sin(x)</code> en <code>(x+1)(x-1)</code> werken. Zet haakjes rond tellers en noemers: <code>1/(2x)</code> is iets anders dan <code>1/2x</code>.
            Je antwoord hoeft niet vereenvoudigd te zijn: elke juiste vorm wordt goedgekeurd. Je mag ook een komma gebruiken (<code>0,5</code>). Een derdemachtswortel of een andere wortel kies je met de toets <b>ⁿ√</b>.</p>
            </div></details>`;
    }

    function opgaveHTML(o) {
        return `<div class="opgave">
            <div class="opgave-labels"><span class="label">${esc(hoofdstukNaam(o.cat))}</span><span class="label n${o.niveau}">${sterren(o.niveau)}</span>${o.gen ? '<span class="label">nieuw gegenereerd</span>' : ''}</div>
            <div class="opgave-vraag">Bereken de afgeleide van</div>
            <div class="formule-groot">${wiskunde('f(x) = ' + o.fTex, true)}</div>
        </div>`;
    }

    function klavierHTML() {
        const k = (label, ins, cls = '', aria = label) => `<button type="button" class="toets-k ${cls}" data-ins="${esc(ins)}" aria-label="${esc(aria)}">${label}</button>`;
        const a = (label, actie, cls, aria) => `<button type="button" class="toets-k ${cls}" data-k="${actie}" aria-label="${aria}">${label}</button>`;
        const rijen = [
            [k('7', '7'), k('8', '8'), k('9', '9'), k('+', '+'), k('−', '-', '', 'min'), k('x', 'x'), k('(', '('), k(')', ')')],
            [k('4', '4'), k('5', '5'), k('6', '6'), k('·', '*', '', 'maal'), k('/', '/', '', 'gedeeld door'), k('^', '^', '', 'tot de macht'), k('x²', '^2', '', 'kwadraat'), k('eˣ', 'e^(', 'fn', 'e tot de macht')],
            [k('1', '1'), k('2', '2'), k('3', '3'), k('√', 'sqrt(', 'fn', 'vierkantswortel'), a('ⁿ√', 'wortel', 'fn', 'n-demachtswortel: kies 3, 4, 5, …'), k('ln', 'ln(', 'fn'), k('sin', 'sin(', 'fn'), k('cos', 'cos(', 'fn'), k('tan', 'tan(', 'fn')],
            [k('0', '0'), k(',', ',', '', 'komma'), k('π', 'pi', '', 'pi'), a('←', 'links', 'nav', 'cursor naar links'), a('→', 'rechts', 'nav', 'cursor naar rechts'), a('⌫', 'wis', 'wis', 'wis het teken voor de cursor'), a('C', 'leeg', 'wis', 'alles wissen'), k('log', 'log(', 'fn')]
        ];
        // 9 kolommen (rij 3 heeft ook ⁿ√); in de andere rijen is de laatste toets dubbel zo breed
        let html = rijen.map(r => `<div class="klavier-rij r9">${(r.length < 9 ? r.slice(0, -1).concat(r[r.length - 1].replace('class="toets-k ', 'class="toets-k breed ')) : r).join('')}</div>`).join('');
        if (S.richting === 8) html += `<div class="klavier-rij bg">${['Bgsin', 'Bgcos', 'Bgtan', 'Bgcot'].map(n => k(n, n + '(', 'fn bgk')).join('')}</div>`;
        const wissel = isAanraak ? `<button type="button" class="linkknop" data-actie="klavier-wissel">${S.eigenKlavier ? 'Schermtoetsenbord gebruiken' : '⌨ Eigen toetsenbord gebruiken'}</button>` : '';
        return `<div class="klavier geen-print" id="klavier">${html}<div class="klavier-voet"><span>Tip: met Enter controleer je je antwoord.</span>${wissel}</div></div>`;
    }

    function invoerHTML(uit = false) {
        const im = isAanraak && !S.eigenKlavier ? 'inputmode="none"' : '';
        return `<div class="invoer-rij"><label for="antwoord">f′(x) =</label>
            <input id="antwoord" class="invoer" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="typ hier de afgeleide" ${im} ${uit ? 'disabled' : ''}></div>
            <div class="voorbeeld" id="voorbeeld" aria-live="polite"></div>
            ${uit ? '' : klavierHTML()}`;
    }

    function uitwerkingHTML(o, aantal = Infinity) {
        let html = '', n = 0;
        if (o.regel && n < aantal) { html += `<p class="regel">💡 ${rijkeTekst(o.regel)}</p>`; n++; }
        const stappen = [];
        for (const s of o.stappen) { if (n >= aantal) break; stappen.push(`<li>${rijkeTekst(s)}</li>`); n++; }
        if (n < aantal) { stappen.push(`<li class="eind">Eindoplossing: ${wiskunde("\\displaystyle f'(x) = " + o.dTex)}</li>`); n++; }
        if (stappen.length) html += `<ol class="stappen">${stappen.join('')}</ol>`;
        return html;
    }
    const aantalHintDelen = o => (o.regel ? 1 : 0) + o.stappen.length + 1;
    const uitwerkingKnop = (o, open = false) => `<details class="uitwerking-details"${open ? ' open' : ''}><summary>📖 Bekijk de uitwerking stap voor stap</summary><div class="hulp">${uitwerkingHTML(o)}</div></details>`;

    // ---------- feedback van de leerkracht ----------
    const LOF = ['Goed gedaan!', 'Prima!', 'Knap gewerkt!', 'Helemaal juist!', 'Mooi zo!'];
    const soortVan = c => W.FOUTSOORTEN[c] || W.FOUTSOORTEN.onbekend;
    // r = resultaat van Wiskunde.beoordeel (of { status: 'fout', code: 'overgeslagen' })
    // opties: metJij (antwoord van de leerling tonen), metSleutel (juiste antwoord tonen), slot (extra zin op het einde)
    function leerkrachtHTML(r, o, opties = {}) {
        const { metJij = true, metSleutel = false, slot = '' } = opties;
        if (r.status === 'juist') {
            const zin = r.onvereenvoudigd ? 'Je antwoord is juist, maar je kan het nog eenvoudiger schrijven. Vergelijk met de oplossing uit de sleutel.' : 'Je antwoord is juist.';
            return `<div class="leerkracht goed"><div class="lk-kop">✍ ${kies(LOF)}</div><p>${zin}</p>
                ${metSleutel ? `<div class="lk-rij"><span class="lk-wie">Sleutel:</span> <span class="lk-juist">${wiskunde("f'(x) = " + o.dTex, true)}</span></div>` : ''}${slot ? `<p>${slot}</p>` : ''}</div>`;
        }
        const codes = [...new Set(r.codes && r.codes.length ? r.codes : [r.code || 'onbekend'])];
        let uitleg;
        if (r.delen && r.delen.length > 1) uitleg = '<p>Je maakte twee fouten:</p><ol class="lk-lijst">' + r.delen.map(d => `<li>${rijkeTekst(d)}</li>`).join('') + '</ol>';
        else if (r.boodschap) uitleg = `<p>${rijkeTekst(r.boodschap)}</p>`;
        else if (r.code === 'overgeslagen') uitleg = '<p>Je hebt deze vraag overgeslagen. Bekijk de uitwerking en probeer de oefening later nog eens in de oefenzone.</p>';
        else uitleg = `<p>Ik zie niet meteen één duidelijke fout. ${metSleutel ? 'Vergelijk je berekening stap voor stap met de uitwerking.' : 'Vraag een stap van de uitwerking en vergelijk die met je eigen berekening.'}</p>`;
        const jij = metJij && r.boom ? `<div class="lk-rij"><span class="lk-wie">Jij schreef:</span> <span class="lk-omcirkeld">${wiskunde("f'(x) = " + W.tex(r.boom), true)}</span></div>` : '';
        const juist = metSleutel ? `<div class="lk-rij"><span class="lk-wie">Juist is:</span> <span class="lk-juist">${wiskunde("f'(x) = " + o.dTex, true)}</span></div>` : '';
        return `<div class="leerkracht"><div class="lk-kop">✍ Feedback van je leerkracht</div>
            <div class="lk-fout">Gemaakte fout: <b>${esc(codes.map(c => soortVan(c).label).join(' + '))}</b></div>
            ${uitleg}${jij}${juist}
            <p class="lk-tip">💡 Tip: ${esc(soortVan(codes[0]).tip)}</p>${slot ? `<p>${slot}</p>` : ''}</div>`;
    }
