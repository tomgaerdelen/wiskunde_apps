    // ---------- toestand ----------
    let scherm = 'menu';
    let OEF = null;    // lopende oefensessie
    let TOETS = null;  // lopende toets

    // ---------- live weergave en schermtoetsenbord ----------
    function opInvoer() {
        const inp = document.getElementById('antwoord'), vb = document.getElementById('voorbeeld');
        if (!inp || !vb) return;
        const v = inp.value;
        if (!v.trim()) { vb.innerHTML = '<span class="grijs klein">Hier zie je hoe de app je antwoord leest.</span>'; return; }
        const r = W.leesVoorbeeld(v);
        if (r.boom) vb.innerHTML = wiskunde("f'(x) = " + W.tex(r.boom), true)
            + (r.aangevuld ? '<span class="grijs klein">(er ontbreekt nog een sluitend haakje)</span>' : r.bezig ? '<span class="grijs klein">(je antwoord is nog niet af)</span>' : '');
        else vb.innerHTML = `<span class="${r.onvolledig ? 'grijs klein' : 'lees-fout'}">${esc(r.fout)}</span>`;
    }
    const magFocussen = () => !isAanraak || !S.eigenKlavier;
    function klavierActie(knop) {
        const inp = document.getElementById('antwoord');
        if (!inp || inp.disabled) return;
        const v = inp.value;
        let s = inp.selectionStart == null ? v.length : inp.selectionStart;
        let e = inp.selectionEnd == null ? s : inp.selectionEnd;
        if (knop.dataset.ins != null) {
            const t = knop.dataset.ins;
            inp.value = v.slice(0, s) + t + v.slice(e);
            s = e = s + t.length;
        } else {
            switch (knop.dataset.k) {
                case 'wortel': if (window.WORTEL) WORTEL.kiesIndex(knop, n => WORTEL.voegIn(inp, n)); return;
                case 'links': s = e = Math.max(0, s === e ? s - 1 : s); break;
                case 'rechts': s = e = Math.min(v.length, s === e ? e + 1 : e); break;
                case 'leeg': inp.value = ''; s = e = 0; break;
                case 'wis':
                    if (s !== e) { inp.value = v.slice(0, s) + v.slice(e); e = s; }
                    else if (s > 0) {
                        const m = v.slice(0, s).match(/(bgsin\(|bgcos\(|bgtan\(|bgcot\(|sqrt\(|sin\(|cos\(|tan\(|log\(|ln\(|e\^\(|pi)$/i);
                        const n = m ? m[0].length : 1;
                        inp.value = v.slice(0, s - n) + v.slice(s);
                        s = e = s - n;
                    }
                    break;
            }
        }
        if (magFocussen()) inp.focus({ preventScroll: true });
        try { inp.setSelectionRange(s, e); } catch (err) { /* sommige browsers */ }
        inp.dispatchEvent(new Event('input', { bubbles: true }));
    }
    function wisselKlavier() {
        S.eigenKlavier = !S.eigenKlavier; bewaar();
        const inp = document.getElementById('antwoord');
        if (inp) {
            if (S.eigenKlavier) inp.removeAttribute('inputmode'); else inp.setAttribute('inputmode', 'none');
            inp.blur(); inp.focus();
        }
        const knop = document.querySelector('[data-actie="klavier-wissel"]');
        if (knop) knop.textContent = S.eigenKlavier ? 'Schermtoetsenbord gebruiken' : '⌨ Eigen toetsenbord gebruiken';
    }
    function toonFeedback(soort, html) {
        const fb = document.getElementById('feedback');
        if (!fb) return;
        const ico = { juist: '✔', fout: '✘', info: 'ℹ' }[soort];
        fb.innerHTML = html ? `<div class="feedback ${soort}"><div class="ico">${ico}</div><div>${html}</div></div>` : '';
        if (html && fb.scrollIntoView) fb.scrollIntoView({ block: 'nearest' });
    }

    // ---------- oefenen ----------
    function startOefenen() {
        OEF = { stapels: {}, huidig: null, juist: 0, reeks: 0, status: null };
        volgendeOefening(true);
    }
    function trekOefening() {
        const lv = niveausBeschikbaar();
        for (let poging = 0; poging < 12; poging++) {
            const n = kiesNiveau(lv);
            const g = gens(n), v = vaste(n);
            if (g.length && (!v.length || Math.random() < KANS_GENERATOR)) {
                const o = maakVoor(maakGegenereerd(kies(g)));
                if (o) return o;
            }
            if (v.length) {
                let st = OEF.stapels[n];
                if (!st || !st.length) st = OEF.stapels[n] = schud(v);
                let o = st.pop();
                if (o && OEF.huidig && o.id === OEF.huidig.id && st.length) { st.unshift(o); o = st.pop(); }
                if (o) return o;
            }
        }
        return null;
    }
    // dashboard: één rij per oefening, op het moment dat ze opgelost is (of verlaten wordt na een fout of hint)
    function logKettingOefening(o, st, opgelost) {
        if (!o || !st || st.gelogd) return;
        st.gelogd = true;
        const meteen = opgelost && !st.fout && !st.uitwerking && !st.hint;
        portaalLogOpgave(meteen, o.cat, st.code || (opgelost ? null : 'niet_opgelost'), { oef: String(o.id || '').slice(0, 40), niv: o.niveau, st: meteen ? 'g' : opgelost ? 'h' : 'f', hints: st.hint, ...(meteen ? { opg: '$f(x) = ' + o.fTex + '$' } : { opg: '$f(x) = ' + o.fTex + '$', jst: "$f'(x) = " + o.dTex + '$', ...(st.f1 || {}) }) }); // portaalFoutDetails
    }
    function volgendeOefening(eerste) {
        if (!eerste && OEF.status && !OEF.status.opgelost && (OEF.status.fout || OEF.status.hint)) logKettingOefening(OEF.huidig, OEF.status, false);
        if (!eerste && OEF.status && !OEF.status.opgelost) OEF.reeks = 0;
        const o = trekOefening();
        if (!o) { scherm = 'menu'; toon(); alert('Er zijn geen oefeningen gevonden voor deze keuze.'); return; }
        OEF.huidig = o;
        OEF.status = { opgelost: false, fout: false, hint: 0, uitwerking: false };
        scherm = 'oefen';
        toon();
    }
    const tellerTekst = () => `✔ ${OEF.juist} opgelost · 🔥 reeks ${OEF.reeks}`;
    function oefenHTML() {
        return `<div class="kaart">
          <div class="balk oefen"><button class="terug" data-actie="menu">← Menu</button><h2>Oefenen · ${S.richting} uur</h2><span class="teller" id="teller">${tellerTekst()}</span></div>
          <div class="kaart-binnen">
            ${opgaveHTML(OEF.huidig)}
            ${invoerHTML()}
            <div class="actie-rij">
              <button class="knop knop-groen" data-actie="controleer">Controleer</button>
              <button class="knop knop-blauw-licht" data-actie="hint" id="hintknop">🪜 Stap voor stap</button>
              <button class="knop knop-donker" data-actie="volgende" id="volgendeknop">Volgende →</button>
            </div>
            <div id="feedback"></div>
            <div id="hulp"></div>
            ${typHulpHTML()}
          </div>
        </div>`;
    }
    function controleerOefening() {
        const inp = document.getElementById('antwoord'), o = OEF.huidig, st = OEF.status;
        if (!inp.value.trim()) return toonFeedback('info', 'Typ eerst je antwoord in het vak.');
        const r = W.beoordeel(inp.value, o);
        if (r.status === 'onleesbaar') return toonFeedback('info', 'Ik kan je antwoord nog niet lezen: ' + esc(r.boodschap));
        if (r.status === 'juist') {
            if (!st.opgelost) {
                st.opgelost = true;
                OEF.juist++;
                if (!st.fout && !st.uitwerking) OEF.reeks++;
                logKettingOefening(o, st, true);
            }
            zetFeedback(leerkrachtHTML(r, o, { metSleutel: true, slot: 'Klik op “Volgende” voor een nieuwe oefening.' }) + uitwerkingKnop(o));
            const vk = document.getElementById('volgendeknop');
            if (vk && !isAanraak) vk.focus();
        } else {
            st.fout = true;
            if (!st.code) st.code = r.code || (r.codes && r.codes[0]) || null;
            // dashboard: eerste foute antwoord en de feedback die de leerling toen zag
            if (!st.f1) { try { st.f1 = { fs: soortVan(st.code || 'onbekend').label, fb: W.vulIn(r.boodschap || (r.delen || []).join(' / ') || soortVan(st.code || 'onbekend').tip), ant: r.boom ? "$f'(x) = " + W.tex(r.boom) + '$' : String(inp.value).slice(0, 80) }; } catch (e) { st.f1 = {}; } }
            OEF.reeks = 0;
            zetFeedback(leerkrachtHTML(r, o, { slot: 'Pas je antwoord aan en controleer opnieuw, of klik op “🪜 Stap voor stap”.' }));
        }
        const t = document.getElementById('teller');
        if (t) t.textContent = tellerTekst();
    }
    function toonHint(alles) {
        const o = OEF.huidig, st = OEF.status, max = aantalHintDelen(o);
        st.hint = alles ? max : Math.min(max, st.hint + 1);
        if (st.hint >= max) st.uitwerking = true;
        document.getElementById('hulp').innerHTML = `<div class="hulp"><h3>${st.hint >= max ? 'Volledige uitwerking' : 'Stap ' + st.hint + ' van ' + max}</h3>${uitwerkingHTML(o, st.hint)}
            ${st.hint < max ? '<p class="klein" style="margin:10px 0 0"><button class="linkknop" data-actie="alles">Toon meteen de volledige uitwerking</button></p>' : ''}</div>`;
        const hk = document.getElementById('hintknop');
        if (hk) { hk.textContent = st.hint >= max ? '✔ Volledig uitgewerkt' : `🪜 Volgende stap (${st.hint + 1}/${max})`; hk.disabled = st.hint >= max; }
        if (!alles) document.getElementById('hulp').scrollIntoView({ block: 'nearest' });
    }

    // ---------- toets ----------
    function stelToetsSamen(n) {
        const lv = niveausBeschikbaar(), cats = actieveCats();
        const gekozen = [], gebruikt = new Set(), perCat = {};
        for (let i = 0; i < n; i++) {
            let o = null;
            for (let poging = 0; poging < 25 && !o; poging++) {
                const niv = kiesNiveau(lv);
                const kand = schud(cats.filter(c => vaste(niv, [c]).some(x => !gebruikt.has(x.id)) || gens(niv, [c]).length));
                if (!kand.length) continue;
                kand.sort((a, b) => (perCat[a] || 0) - (perCat[b] || 0));   // spreiden over de hoofdstukken
                const cat = kand[0];
                const v = vaste(niv, [cat]).filter(x => !gebruikt.has(x.id)), g = gens(niv, [cat]);
                if (g.length && (!v.length || Math.random() < KANS_GENERATOR)) o = maakVoor(maakGegenereerd(kies(g)));
                else if (v.length) o = kies(v);
                if (o && gebruikt.has('f:' + o.f)) o = null;
                if (o) perCat[cat] = (perCat[cat] || 0) + 1;
            }
            if (!o) break;
            gebruikt.add(o.id); gebruikt.add('f:' + o.f);
            gekozen.push(o);
        }
        // Rustig beginnen: van makkelijk naar moeilijk.
        return gekozen.map((o, k) => [o, k]).sort((a, b) => a[0].niveau - b[0].niveau || a[1] - b[1]).map(x => x[0]);
    }
    function startToets() {
        const vragen = stelToetsSamen(S.toetsN);
        if (!vragen.length) { alert('Er zijn geen oefeningen gevonden voor deze keuze.'); return; }
        TOETS = { vragen, i: 0, fase: 'antwoord', antwoorden: [], naam: S.naam.trim(), start: new Date(), invoer: '', minder: vragen.length < S.toetsN,
                  instellingen: { richting: S.richting, niveau: S.niveau, cats: actieveCats() } };
        scherm = 'toets';
        toon();
    }
    function toetsHTML() {
        const T = TOETS, o = T.vragen[T.i], klaar = T.fase === 'feedback', a = T.antwoorden[T.i];
        const fb = klaar ? leerkrachtHTML(a.resultaat, o, { metSleutel: true }) + uitwerkingKnop(o) : '';
        const laatste = T.i === T.vragen.length - 1;
        const knoppen = klaar
            ? `<button class="knop knop-donker knop-groot" data-actie="volgende-vraag" id="volgendevraag">${laatste ? 'Bekijk je rapport' : 'Volgende vraag →'}</button>`
            : '<button class="knop knop-rood knop-groot" data-actie="controleer-toets">Controleer</button><button class="knop knop-licht" data-actie="overslaan">Overslaan</button>';
        return `<div class="kaart">
          <div class="balk toets"><button class="terug" data-actie="stop">✕ Stoppen</button><h2>Toets · vraag ${T.i + 1} van ${T.vragen.length}</h2><span class="teller">${T.antwoorden.filter(x => x && x.juist).length} juist</span></div>
          <div class="voortgang"><div style="width:${Math.round(100 * (T.i + (klaar ? 1 : 0)) / T.vragen.length)}%"></div></div>
          <div class="kaart-binnen">
            ${T.minder && T.i === 0 && !klaar ? `<div class="melding" style="margin:0 0 12px">Voor deze keuze zijn er maar ${T.vragen.length} verschillende oefeningen, dus de toets telt ${T.vragen.length} vragen. Kies meer hoofdstukken of een ander niveau voor een langere toets.</div>` : ''}
            ${opgaveHTML(o)}
            ${invoerHTML(klaar)}
            <div id="feedback">${fb}</div>
            <div class="actie-rij">${knoppen}</div>
          </div>
        </div>`;
    }
    function controleerToets() {
        const T = TOETS, inp = document.getElementById('antwoord'), o = T.vragen[T.i];
        if (!inp.value.trim()) return toonFeedback('info', 'Typ eerst je antwoord, of kies “Overslaan”.');
        const r = W.beoordeel(inp.value, o);
        if (r.status === 'onleesbaar') return toonFeedback('info', 'Ik kan je antwoord nog niet lezen: ' + esc(r.boodschap) + ' Pas het aan en controleer opnieuw.');
        T.antwoorden[T.i] = { invoer: inp.value, tex: W.tex(r.boom), juist: r.status === 'juist', boodschap: r.boodschap, resultaat: r };
        T.invoer = inp.value;
        T.fase = 'feedback';
        toon(false);
    }
    function overslaan() {
        const T = TOETS;
        T.antwoorden[T.i] = { invoer: '', tex: '', juist: false, overgeslagen: true, boodschap: null,
                              resultaat: { status: 'fout', code: 'overgeslagen', codes: ['overgeslagen'], boodschap: null } };
        T.invoer = '';
        T.fase = 'feedback';
        toon(false);
    }
    // dashboard: één rij per toets
    function logKettingToets(T) {
        if (!T || T.gelogd || !T.vragen.length) return;
        T.gelogd = true;
        const fouten = {};
        T.vragen.forEach((o, i) => { const a = T.antwoorden[i]; const c = a && !a.juist && a.resultaat && (a.resultaat.code || (a.resultaat.codes || [])[0]); if (typeof c === 'string' && c && (fouten[c] || Object.keys(fouten).length < 8)) fouten[c] = (fouten[c] || 0) + 1; });
        const juist = T.antwoorden.filter(a => a && a.juist).length;
        portaalLogToets(100 * juist / T.vragen.length, (new Date() - T.start) / 1000, 'toets', { vragen: T.vragen.length, juist, niv: T.instellingen.niveau, uren: T.instellingen.richting, fouten });
    }
    function volgendeVraag() {
        const T = TOETS;
        if (T.i >= T.vragen.length - 1) { logKettingToets(T); scherm = 'rapport'; toon(); return; }
        T.i++;
        T.fase = 'antwoord';
        T.invoer = '';
        toon();
    }
    function stopToets() {
        const T = TOETS, n = T.antwoorden.length;
        if (!confirm(n ? 'Wil je de toets stoppen? Je krijgt een rapport van de vragen die je al beantwoord hebt.' : 'Wil je de toets stoppen?')) return;
        if (!n) { scherm = 'menu'; toon(); return; }
        T.vragen = T.vragen.slice(0, n);
        logKettingToets(T);
        scherm = 'rapport';
        toon();
    }

    // ---------- rapport ----------
    // Algemene feedback van de leerkracht bovenaan het rapport.
    function samenvattingHTML(T) {
        const n = T.antwoorden.length, juist = T.antwoorden.filter(a => a.juist).length;
        const pct = n ? Math.round(100 * juist / n) : 0;
        const voornaam = T.naam ? T.naam.split(/\s+/)[0] : '';
        const aan = voornaam ? ', ' + esc(voornaam) : '';
        let opening;
        if (pct === 100) opening = `Schitterend${aan}! Alles juist. Je beheerst de rekenregels voor afgeleiden heel goed.`;
        else if (pct >= 80) opening = `Heel goed gewerkt${aan}! Je beheerst de leerstof, op een paar kleine foutjes na.`;
        else if (pct >= 60) opening = `Goed bezig${aan}. De basis zit er, maar er zijn nog een paar dingen die je moet verbeteren.`;
        else if (pct >= 40) opening = `Dit is nog niet voldoende${aan}. Geen paniek: met wat extra oefening komt het zeker in orde.`;
        else opening = `Dit loopt nog niet goed${aan}. Herhaal de rekenregels en oefen eerst rustig in de oefenzone, met de stap-voor-stap uitwerkingen.`;
        const telling = {};
        T.antwoorden.forEach(a => {
            if (a.juist) return;
            const r = a.resultaat || { code: 'onbekend' };
            [...new Set(r.codes && r.codes.length ? r.codes : [r.code || 'onbekend'])].forEach(c => { telling[c] = (telling[c] || 0) + 1; });
        });
        const lijst = Object.entries(telling).sort((x, y) => y[1] - x[1]);
        const foutLijst = lijst.length ? '<p>Dit ging er mis:</p><ul class="lk-lijst">' + lijst.map(([c, k]) => `<li>${k}× ${esc(soortVan(c).label)}</li>`).join('') + '</ul>' : '';
        const advies = lijst.filter(([c]) => c !== 'onbekend').slice(0, 2).map(([c]) => soortVan(c).tip);
        const zwak = [...new Set(T.vragen.filter((o, i) => T.antwoorden[i] && !T.antwoorden[i].juist).map(o => hoofdstukNaam(o.cat)))];
        let slot = '';
        if (zwak.length) slot = `<p>Oefen nog eens in de oefenzone: <b>${zwak.map(esc).join(', ')}</b>.</p>`;
        else if (pct === 100 && T.instellingen.niveau !== '3') slot = '<p>Klaar voor meer? Probeer eens een toets op niveau Uitdaging!</p>';
        return `<div class="leerkracht lk-groot ${pct >= 60 ? 'goed' : ''}">
            <div class="lk-kop">✍ Feedback van je leerkracht</div>
            <p>${opening}</p>
            ${foutLijst}
            ${advies.length ? '<p>Mijn advies:</p><ul class="lk-lijst">' + advies.map(t => `<li>${esc(t)}</li>`).join('') + '</ul>' : ''}
            ${slot}
        </div>`;
    }
    function rapportHTML() {
        const T = TOETS, n = T.antwoorden.length, juist = T.antwoorden.filter(a => a.juist).length;
        const pct = n ? Math.round(100 * juist / n) : 0;
        const klas = pct >= 70 ? 'goed' : pct >= 50 ? 'matig' : 'zwak';
        const st = T.instellingen;
        const datum = T.start.toLocaleDateString('nl-BE', { day: 'numeric', month: 'long', year: 'numeric' }) + ', ' + T.start.toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' });
        const niveau = st.niveau === 'mix' ? 'gemengd niveau' : 'niveau ' + NIVEAUS[st.niveau].toLowerCase();
        const kaarten = T.vragen.slice(0, n).map((o, i) => {
            const a = T.antwoorden[i];
            return `<div class="vraag-kaart ${a.juist ? 'juist' : 'fout'}">
                <div class="vraag-kop"><h3>Vraag ${i + 1} · <span class="grijs">${esc(hoofdstukNaam(o.cat))} · ${sterren(o.niveau)}</span></h3><span class="stempel">${a.juist ? 'JUIST' : a.overgeslagen ? 'OVERGESLAGEN' : 'FOUT'}</span></div>
                <div class="formule-groot">${wiskunde('f(x) = ' + o.fTex, true)}</div>
                <div class="antwoorden">
                    <div><div class="tit">Jouw antwoord</div>${a.invoer ? wiskunde("f'(x) = " + a.tex, true) : '<i class="grijs">geen antwoord</i>'}</div>
                    <div><div class="tit">Juiste antwoord</div>${wiskunde("f'(x) = " + o.dTex, true)}</div>
                </div>
                ${!a.juist ? leerkrachtHTML(a.resultaat || { status: 'fout', code: 'onbekend' }, o, { metJij: false })
                           : (a.resultaat && a.resultaat.onvereenvoudigd ? leerkrachtHTML(a.resultaat, o) : '')}
                <details><summary>📖 Bekijk de uitwerking stap voor stap</summary><div class="hulp" style="margin-top:8px">${uitwerkingHTML(o)}</div></details>
            </div>`;
        }).join('');
        return `<div class="kaart"><div class="kaart-binnen">
            <div class="rapport-kop"><h2>Toetsrapport</h2>
              <div class="rapport-info">${portaalKlas() ? esc(portaalKlas()) + ' · ' : ''}${datum} · ${st.richting} uur wiskunde · ${niveau}<br>${st.cats.length === HOOFDSTUKKEN.filter(h => !(h.enkel8 && st.richting === 5)).length ? 'alle hoofdstukken' : st.cats.map(hoofdstukNaam).map(esc).join(' · ')}</div>
              <div class="score ${klas}">${juist} / ${n} <span class="klein">(${pct}%)</span></div>
            </div>
            ${samenvattingHTML(T)}
            ${kaarten}
            <div class="actie-rij geen-print">
              <button class="knop knop-licht" data-actie="pdf" id="pdfknop">⬇ Download als PDF</button>
              <button class="knop knop-rood" data-actie="nieuwe-toets">Nieuwe toets</button>
              <button class="knop knop-donker" data-actie="menu">Terug naar het menu</button>
            </div>
            <div class="rapport-credit">© T. Gaerdelen</div>
        </div></div>`;
    }
    const openDetails = () => document.querySelectorAll('.vraag-kaart.fout details').forEach(d => { d.open = true; });

    // ---------- rapport als PDF downloaden ----------
    // De PDF-bibliotheek wordt pas geladen als iemand op de knop klikt, zodat de app snel start.
    let pdfBibliotheek = null;
    function laadPdfBibliotheek() {
        if (window.html2pdf) return Promise.resolve();
        if (pdfBibliotheek) return pdfBibliotheek;
        pdfBibliotheek = new Promise((ok, nok) => {
            const s = document.createElement('script');
            s.src = 'lib/html2pdf-0.10.1.bundle.min.js';
            s.onload = () => ok();
            s.onerror = () => { pdfBibliotheek = null; nok(new Error('PDF-bibliotheek niet geladen')); };
            document.head.appendChild(s);
        });
        return pdfBibliotheek;
    }
    // Rapport zonder knoppen; bij foute vragen staat de uitwerking open, bij juiste vragen valt ze weg.
    function pdfInhoud() {
        const doos = document.createElement('div');
        doos.className = 'pdf-rapport';
        doos.innerHTML = rapportHTML();
        doos.querySelectorAll('.geen-print').forEach(e => e.remove());
        doos.querySelectorAll('.vraag-kaart').forEach(k => {
            const d = k.querySelector('details');
            if (!d) return;
            const h = d.querySelector('.hulp');
            if (k.classList.contains('fout') && h) { h.insertAdjacentHTML('afterbegin', '<h3>Uitwerking stap voor stap</h3>'); d.replaceWith(h); }
            else d.remove();
        });
        return doos;
    }
    function pdfNaam() {
        const T = TOETS, d = T.start;
        const datum = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const naam = leerlingCode() || 'leerling';
        return `Toetsrapport 6do afgeleiden en de kettingregel - ${naam} - ${datum}.pdf`;
    }
    function pdfOpdracht() {
        return html2pdf().set({
            margin: [12, 10, 14, 10],
            filename: pdfNaam(),
            image: { type: 'jpeg', quality: 0.95 },
            html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0, logging: false },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            // Niet midden in een vraag, een feedbackkaart of een regel tekst naar een nieuwe pagina springen.
            pagebreak: { mode: ['css'], avoid: ['.vraag-kaart', '.leerkracht', '.rapport-kop', '.antwoorden', '.formule-groot', '.lk-rij', 'li', 'p', 'h3'] }
        }).from(pdfInhoud()).toPdf().get('pdf').then(pdf => {
            const n = pdf.internal.getNumberOfPages();
            for (let i = 1; i <= n; i++) {
                pdf.setPage(i);
                pdf.setFontSize(8);
                pdf.setTextColor(148, 163, 184);
                pdf.text(`pagina ${i} van ${n}`, 10, 290);
                pdf.text('© T. Gaerdelen', 200, 290, { align: 'right' });
                if (leerlingCode()) pdf.text(leerlingCode(), 105, 290, { align: 'center' });
            }
        });
    }
    async function downloadPdf() {
        const knop = document.getElementById('pdfknop'), tekst = knop ? knop.textContent : '';
        if (knop) { knop.disabled = true; knop.textContent = 'PDF wordt gemaakt…'; }
        try {
            await laadPdfBibliotheek();
            if (document.fonts && document.fonts.ready) await document.fonts.ready;
            await pdfOpdracht().save();
        } catch (e) {
            console.warn('PDF maken mislukt', e);
            alert('De PDF kon niet gemaakt worden (is er internet?). Het afdrukvenster wordt geopend: kies daar "Opslaan als PDF".');
            openDetails();
            window.print();
        } finally {
            if (knop) { knop.disabled = false; knop.textContent = tekst; }
        }
    }

    // ---------- tekenen ----------
    function toon(naarBoven = true) {
        const app = document.getElementById('app');
        app.innerHTML = scherm === 'menu' ? menuHTML() : scherm === 'oefen' ? oefenHTML() : scherm === 'toets' ? toetsHTML() : rapportHTML();
        const inp = document.getElementById('antwoord');
        if (inp) {
            if (scherm === 'toets') inp.value = TOETS.fase === 'feedback' ? TOETS.invoer : '';
            opInvoer();
            if (!inp.disabled && magFocussen()) inp.focus({ preventScroll: true });
        }
        if (naarBoven) window.scrollTo(0, 0);
        if (scherm === 'toets' && TOETS.fase === 'feedback') {
            const fb = document.getElementById('feedback');
            if (fb && fb.scrollIntoView) fb.scrollIntoView({ block: 'nearest' });
            const b = document.getElementById('volgendevraag');
            if (b && !isAanraak) b.focus({ preventScroll: true });
        }
    }

    // ---------- bediening ----------
    document.addEventListener('pointerdown', e => { if (e.target.closest('.toets-k')) e.preventDefault(); });
    document.addEventListener('click', e => {
        const knop = e.target.closest('button');
        if (!knop || !document.getElementById('app').contains(knop)) return;
        if (knop.classList.contains('toets-k')) { klavierActie(knop); return; }
        if (knop.dataset.richting) { S.richting = +knop.dataset.richting; bewaar(); toon(false); return; }
        if (knop.dataset.niveau) { S.niveau = knop.dataset.niveau; bewaar(); toon(false); return; }
        if (knop.dataset.alle) { S.cats = knop.dataset.alle === '1' ? HOOFDSTUKKEN.map(h => h.id) : []; bewaar(); toon(false); return; }
        if (knop.id === 'start-oefen') { startOefenen(); return; }
        if (knop.id === 'start-toets') { startToets(); return; }
        switch (knop.dataset.actie) {
            case 'menu': scherm = 'menu'; toon(); break;
            case 'controleer': controleerOefening(); break;
            case 'hint': toonHint(false); break;
            case 'alles': toonHint(true); break;
            case 'volgende': volgendeOefening(false); break;
            case 'controleer-toets': controleerToets(); break;
            case 'overslaan': overslaan(); break;
            case 'volgende-vraag': volgendeVraag(); break;
            case 'stop': stopToets(); break;
            case 'pdf': downloadPdf(); break;
            case 'print': openDetails(); window.print(); break;
            case 'nieuwe-toets': startToets(); break;
            case 'klavier-wissel': wisselKlavier(); break;
        }
    });
    document.addEventListener('change', e => {
        const t = e.target;
        if (t.matches('input[data-cat]')) {
            const c = t.dataset.cat;
            S.cats = t.checked ? [...new Set([...S.cats, c])] : S.cats.filter(x => x !== c);
            bewaar(); toon(false);
        } else if (t.id === 'toetsN') { S.toetsN = +t.value; bewaar(); }
    });
    document.addEventListener('input', e => {
        if (e.target.id === 'antwoord') {
            opInvoer();
            const fb = document.getElementById('feedback');
            if (fb && fb.querySelector('.feedback.info, .leerkracht:not(.goed)') && !(scherm === 'toets' && TOETS.fase === 'feedback')) fb.innerHTML = '';
        }
    });
    document.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        if (e.target.id === 'antwoord') {
            e.preventDefault();
            if (scherm === 'oefen') { if (OEF.status.opgelost) volgendeOefening(false); else controleerOefening(); }
            else if (scherm === 'toets' && TOETS.fase === 'antwoord') controleerToets();
        } else if (scherm === 'toets' && TOETS && TOETS.fase === 'feedback' && e.target.tagName !== 'BUTTON') {
            e.preventDefault();
            volgendeVraag();
        }
    });
    window.addEventListener('beforeprint', openDetails);

    laadBank();
    toon();

    // Voor controle en testen in de console.
    return { BANK, AFGEKEURD, S, bouwOefening, maakGegenereerd, stelToetsSamen, vaste, gens, actieveCats, niveausBeschikbaar,
             laadPdfBibliotheek, pdfInhoud, pdfOpdracht, pdfNaam,
             get scherm() { return scherm; }, get OEF() { return OEF; }, get TOETS() { return TOETS; } };
})();
</script>
<script src="wortel.js"></script>
<script src="tracker.js"></script>
<script>
  WiskundeTracker.init({ appId: "6do_kettingregel" });
</script>
</body>
