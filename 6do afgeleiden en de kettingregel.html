<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6do afgeleiden en de kettingregel</title>
<!-- Enige externe bibliotheek: KaTeX (vaste versie) voor de wiskundige weergave.
     Zonder internet werkt de app ook, maar dan worden formules als tekst getoond. -->
<link rel="stylesheet" href="lib/katex/katex.min.css">
<!-- Handschrift-lettertype voor de feedback van de leerkracht (zonder internet: gewoon handschrift-lettertype van het toestel) -->
<link rel="stylesheet" href="lib/patrick-hand/patrick-hand.css">
<script src="lib/katex/katex.min.js"></script>
<style>
    :root {
        --bg: #f1f5f9; --kaart: #ffffff; --rand: #e2e8f0; --tekst: #1e293b; --zacht: #64748b; --heel-zacht: #94a3b8;
        --blauw: #1e3a8a; --blauw-licht: #eff6ff; --blauw-rand: #bfdbfe;
        --groen: #059669; --groen-donker: #047857; --groen-licht: #ecfdf5; --groen-rand: #a7f3d0;
        --rood: #e11d48; --rood-donker: #be123c; --rood-licht: #fff1f2; --rood-rand: #fecdd3;
        --oranje-licht: #fffbeb; --oranje-rand: #fde68a; --oranje-tekst: #92400e;
        --paars: #4f46e5;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--tekst); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.45; }
    #app { max-width: 920px; margin: 0 auto; padding: 16px 16px 56px; }
    button { font: inherit; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    h1, h2, h3 { margin: 0; line-height: 1.2; }
    .kaart { background: var(--kaart); border: 1px solid var(--rand); border-radius: 16px; box-shadow: 0 4px 18px rgba(15, 23, 42, .06); }
    .kaart-binnen { padding: 20px; }
    .grijs { color: var(--zacht); }
    .klein { font-size: .85rem; }
    .verborgen { display: none !important; }

    /* ---------- knoppen ---------- */
    .knop { border: none; border-radius: 12px; padding: 12px 18px; font-weight: 700; transition: background .15s, transform .05s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .knop:active:not(:disabled) { transform: translateY(1px); }
    .knop-groen { background: var(--groen); color: #fff; } .knop-groen:hover:not(:disabled) { background: var(--groen-donker); }
    .knop-rood { background: var(--rood); color: #fff; } .knop-rood:hover:not(:disabled) { background: var(--rood-donker); }
    .knop-donker { background: #1e293b; color: #fff; } .knop-donker:hover:not(:disabled) { background: #0f172a; }
    .knop-licht { background: #fff; color: var(--tekst); border: 1px solid var(--rand); } .knop-licht:hover:not(:disabled) { background: #f8fafc; }
    .knop-blauw-licht { background: var(--blauw-licht); color: var(--blauw); border: 1px solid var(--blauw-rand); } .knop-blauw-licht:hover:not(:disabled) { background: #dbeafe; }
    .knop-groot { padding: 16px 22px; font-size: 1.1rem; }
    .knop-rij { display: flex; flex-wrap: wrap; gap: 10px; }
    .knop-rij > .knop { flex: 1 1 140px; }
    .linkknop { background: none; border: none; padding: 0; color: #2563eb; font-weight: 600; text-decoration: underline; }

    /* ---------- menu ---------- */
    .kop { text-align: center; padding: 26px 20px 8px; }
    .kop h1 { color: var(--blauw); font-size: 1.9rem; font-weight: 800; }
    .kop p { margin: 6px 0 0; color: var(--zacht); }
    .menu-blok { background: #f8fafc; border: 1px solid var(--rand); border-radius: 14px; padding: 16px; margin-top: 14px; }
    .menu-blok h2 { font-size: 1.05rem; color: #334155; margin-bottom: 10px; }
    .keuze-rij { display: flex; flex-wrap: wrap; gap: 8px; }
    .keuze { flex: 1 1 140px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--rand); background: #fff; font-weight: 700; color: #334155; text-align: center; }
    .keuze small { display: block; font-weight: 500; color: var(--zacht); margin-top: 2px; }
    .keuze.aan { border-color: var(--blauw); background: var(--blauw-licht); color: var(--blauw); }
    .keuze.aan small { color: #1d4ed8; }
    .hoofdstuk-lijst { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
    .hoofdstuk { display: flex; align-items: flex-start; gap: 10px; background: #fff; border: 2px solid var(--rand); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
    .hoofdstuk.aan { border-color: var(--groen); background: var(--groen-licht); }
    .hoofdstuk input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--groen); flex: none; }
    .hoofdstuk b { display: block; }
    .hoofdstuk span { font-size: .82rem; color: var(--zacht); }
    .snel { margin-top: 8px; font-size: .9rem; display: flex; gap: 14px; }
    .start-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
    .start-blok { border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .start-blok.oefen { background: var(--groen-licht); border: 1px solid var(--groen-rand); }
    .start-blok.toets { background: var(--rood-licht); border: 1px solid var(--rood-rand); }
    .start-blok h2 { font-size: 1.1rem; }
    .start-blok p { margin: 0; font-size: .9rem; color: #475569; }
    .veld { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; font-weight: 600; color: #475569; }
    .veld input, .veld select { font: inherit; font-weight: 500; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; }
    .veld-rij { display: flex; gap: 10px; flex-wrap: wrap; }
    .veld-rij .veld { flex: 1 1 140px; }
    .melding { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--oranje-licht); border: 1px solid var(--oranje-rand); color: var(--oranje-tekst); font-size: .92rem; }

    /* ---------- oefen- en toetsscherm ---------- */
    .balk { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #fff; border-radius: 16px 16px 0 0; flex-wrap: wrap; }
    .balk.oefen { background: #065f46; } .balk.toets { background: #881337; }
    .balk h2 { font-size: 1.05rem; flex: 1 1 auto; }
    .balk .terug { background: rgba(255,255,255,.12); color: #fff; border: none; border-radius: 10px; padding: 8px 12px; font-weight: 600; }
    .balk .terug:hover { background: rgba(255,255,255,.22); }
    .teller { background: rgba(255,255,255,.14); border-radius: 999px; padding: 4px 12px; font-size: .88rem; font-weight: 600; white-space: nowrap; }
    .voortgang { height: 6px; background: #fecdd3; }
    .voortgang div { height: 100%; background: var(--rood); transition: width .3s; }
    .opgave { background: #f8fafc; border: 1px solid var(--rand); border-radius: 14px; padding: 16px 16px 20px; text-align: center; }
    .opgave-labels { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .label { font-size: .75rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #e2e8f0; color: #334155; text-transform: uppercase; letter-spacing: .03em; }
    .label.n1 { background: #dcfce7; color: #166534; } .label.n2 { background: #fef9c3; color: #854d0e; } .label.n3 { background: #fee2e2; color: #991b1b; }
    .opgave-vraag { font-size: .82rem; font-weight: 700; color: var(--zacht); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
    .formule-groot { font-size: 1.35rem; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
    .invoer-rij { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
    .invoer-rij label { font-weight: 700; font-size: 1.15rem; white-space: nowrap; font-family: "Times New Roman", serif; font-style: italic; }
    .invoer { flex: 1; min-width: 0; padding: 14px; font-size: 1.15rem; font-family: ui-monospace, Consolas, monospace; border: 2px solid #cbd5e1; border-radius: 12px; outline: none; background: #fff; }
    .invoer:focus { border-color: #3b82f6; }
    .invoer:disabled { background: #f1f5f9; color: var(--zacht); }
    .voorbeeld { height: 96px; margin-top: 8px; padding: 8px 12px; border: 1px dashed #cbd5e1; border-radius: 12px; background: #fcfdff; display: flex; flex-direction: column; align-items: center; justify-content: center; justify-content: safe center; overflow: auto; font-size: 1.15rem; }
    .voorbeeld .klein { font-size: .8rem; }
    .lees-fout { color: #b45309; font-size: .95rem; text-align: center; }

    /* ---------- schermtoetsenbord ---------- */
    .klavier { margin-top: 10px; background: #e2e8f0; border-radius: 14px; padding: 8px; user-select: none; -webkit-user-select: none; }
    .klavier-rij { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-bottom: 6px; }
    .klavier-rij:last-child { margin-bottom: 0; }
    .klavier-rij.bg { grid-template-columns: repeat(4, 1fr); }
    .klavier-rij.r9 { grid-template-columns: repeat(9, 1fr); }
    .klavier-rij.r9 > .breed { grid-column: span 2; }
    .toets-k { padding: 11px 2px; border-radius: 9px; border: 1px solid #cbd5e1; background: #fff; font-weight: 700; font-size: 1rem; color: #334155; min-width: 0; touch-action: manipulation; }
    .toets-k:hover { background: var(--blauw-licht); }
    .toets-k.fn { font-size: .9rem; color: #1d4ed8; }
    .toets-k.bgk { color: #6d28d9; }
    .toets-k.wis { background: #fee2e2; color: #b91c1c; border-color: #fecaca; }
    .toets-k.nav { background: #f8fafc; }
    .klavier-voet { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: .8rem; color: var(--zacht); gap: 10px; flex-wrap: wrap; }

    /* ---------- feedback, hints, uitwerking ---------- */
    .feedback { margin-top: 14px; padding: 14px 16px; border-radius: 12px; display: flex; gap: 12px; align-items: flex-start; }
    .feedback .ico { font-size: 1.3rem; line-height: 1; flex: none; margin-top: 2px; }
    .feedback.juist { background: var(--groen-licht); border: 1px solid var(--groen-rand); color: #065f46; }
    .feedback.fout { background: var(--rood-licht); border: 1px solid var(--rood-rand); color: #9f1239; }
    .feedback.info { background: var(--oranje-licht); border: 1px solid var(--oranje-rand); color: var(--oranje-tekst); }
    .feedback .formule-groot { font-size: 1.1rem; text-align: left; }
    .hulp { margin-top: 14px; background: var(--blauw-licht); border: 1px solid var(--blauw-rand); border-radius: 12px; padding: 14px 16px; overflow-x: auto; }
    .hulp h3 { font-size: 1rem; color: var(--blauw); margin-bottom: 8px; }
    .stappen { margin: 0; padding-left: 24px; }
    .stappen li { margin: 10px 0; line-height: 1.6; }
    .regel { line-height: 1.6; }
    .stappen li.eind { list-style: none; margin-left: -22px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--blauw-rand); font-weight: 700; color: var(--blauw); }
    .regel { font-weight: 600; }
    .actie-rij { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .actie-rij .knop { flex: 1 1 130px; }
    details.uitleg { margin-top: 16px; border: 1px solid var(--rand); border-radius: 12px; background: #fff; }
    details.uitleg summary { cursor: pointer; padding: 10px 14px; font-weight: 700; color: #334155; }
    details.uitleg .inhoud { padding: 0 14px 12px; font-size: .92rem; }
    .typtabel { width: 100%; border-collapse: collapse; }
    .typtabel td { padding: 5px 6px; border-top: 1px solid #f1f5f9; vertical-align: middle; }
    .typtabel code { background: #f1f5f9; padding: 2px 6px; border-radius: 6px; font-size: .9rem; }

    /* ---------- rapport ---------- */
    .rapport-kop { text-align: center; }
    .rapport-kop h2 { font-size: 1.8rem; font-weight: 800; }
    .rapport-info { color: var(--zacht); margin-top: 6px; font-size: .95rem; }
    .score { display: inline-block; margin-top: 14px; padding: 10px 26px; border-radius: 999px; background: #f1f5f9; font-size: 1.4rem; font-weight: 800; }
    .score.goed { color: #047857; } .score.matig { color: #b45309; } .score.zwak { color: #be123c; }
    .vraag-kaart { margin-top: 14px; border-radius: 12px; padding: 14px 16px; border-left: 8px solid; }
    .vraag-kaart.juist { background: var(--groen-licht); border-color: #10b981; }
    .vraag-kaart.fout { background: var(--rood-licht); border-color: #f43f5e; }
    .vraag-kop { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
    .vraag-kop h3 { font-size: 1rem; }
    .stempel { font-size: .75rem; font-weight: 800; padding: 3px 10px; border-radius: 6px; }
    .juist .stempel { background: #a7f3d0; color: #065f46; } .fout .stempel { background: #fecdd3; color: #9f1239; }
    .antwoorden { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: rgba(255,255,255,.75); border-radius: 10px; padding: 10px 12px; margin-top: 8px; }
    .antwoorden > div { min-width: 0; overflow-x: auto; overflow-y: hidden; }
    .antwoorden .katex-display { margin: 4px 0 2px; }
    .antwoorden .katex-display > .katex { text-align: left; }
    .antwoorden .tit { font-size: .72rem; font-weight: 800; color: var(--zacht); text-transform: uppercase; letter-spacing: .04em; }
    .vraag-kaart details { margin-top: 8px; background: #fff; border-radius: 10px; padding: 8px 12px; }
    .vraag-kaart summary { cursor: pointer; font-weight: 700; color: #334155; }
    .rapport-credit { display: none; }

    /* ---------- feedback van de leerkracht (handgeschreven stijl) ---------- */
    .leerkracht { margin-top: 14px; padding: 12px 18px 10px; border-radius: 12px; background: #fffdf4; border: 1px solid #f2e6c4; border-left: 6px solid #dc2626;
        font-family: 'Patrick Hand', 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive; color: #b91c1c; font-size: 1.15rem; line-height: 1.45; overflow-x: auto; }
    .leerkracht.goed { border-left-color: #059669; color: #047857; }
    .leerkracht p { margin: 6px 0; }
    .lk-kop { font-size: 1.35rem; font-weight: 700; }
    .lk-fout { margin: 2px 0 6px; }
    .lk-fout b { text-decoration: underline wavy #ef4444; text-underline-offset: 5px; text-decoration-thickness: 1px; }
    .lk-rij { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 8px 0; }
    .lk-wie { min-width: 96px; }
    .lk-omcirkeld { display: inline-block; border: 2px solid #ef4444; border-radius: 46% 54% 50% 50% / 60% 48% 52% 40%; padding: 8px 18px 4px; transform: rotate(-1deg); color: #1e293b; max-width: 100%; overflow-x: auto; }
    .lk-juist { display: inline-block; color: #1e293b; padding: 0 10px 2px; border-bottom: 2px solid #10b981; max-width: 100%; overflow-x: auto; }
    .leerkracht .katex-display { margin: 0; }
    .leerkracht .katex { color: #1e293b; }
    .lk-tip { color: #1d4ed8; }
    .lk-lijst { margin: 4px 0 6px; padding-left: 24px; }
    .lk-lijst li { margin: 3px 0; }
    .lk-groot { font-size: 1.22rem; margin: 18px 0 4px; }
    .pdf-rapport { background: #fff; color: var(--tekst); }
    .pdf-rapport .kaart { box-shadow: none; border: none; }
    .pdf-rapport .kaart-binnen { padding: 0 4px; }
    .pdf-rapport .vraag-kaart, .pdf-rapport .leerkracht { break-inside: avoid; }
    /* In de PDF altijd de opmaak van een groot scherm, ook als je de PDF op een gsm maakt. */
    .pdf-rapport .antwoorden { grid-template-columns: 1fr 1fr; }
    .pdf-rapport .formule-groot { font-size: 1.25rem; }
    .pdf-rapport .rapport-kop h2 { font-size: 1.7rem; }
    .pdf-rapport .leerkracht { font-size: 1.05rem; }
    .pdf-rapport .lk-groot { font-size: 1.1rem; }
    .uitwerking-details { margin-top: 12px; border: 1px solid var(--blauw-rand); border-radius: 12px; background: #fff; }
    .uitwerking-details > summary { cursor: pointer; padding: 10px 14px; font-weight: 700; color: var(--blauw); }
    .uitwerking-details > .hulp { margin: 0 10px 10px; }

    /* ---------- naamvermelding ---------- */
    .maker-credit { position: fixed; right: 14px; bottom: 10px; font-size: 12px; color: var(--heel-zacht); background: rgba(255,255,255,.85); padding: 2px 8px; border-radius: 6px; pointer-events: none; z-index: 50; }

    @media (max-width: 640px) {
        #app { padding: 10px 10px 48px; }
        .kaart-binnen { padding: 14px; }
        .kop h1 { font-size: 1.5rem; }
        .start-grid { grid-template-columns: 1fr; }
        .antwoorden { grid-template-columns: 1fr; }
        .formule-groot { font-size: 1.15rem; }
        .toets-k { padding: 12px 0; font-size: .95rem; }
        .toets-k.fn { font-size: .78rem; }
        .klavier-rij { gap: 4px; }
        .invoer-rij label { font-size: 1rem; }
        .maker-credit { position: static; display: block; text-align: right; background: none; margin: -40px 12px 14px; }
    }

    @media print {
        body { background: #fff; }
        #app { max-width: none; padding: 0; }
        .geen-print, .maker-credit { display: none !important; }
        .kaart { box-shadow: none; border: none; }
        .vraag-kaart, .leerkracht { break-inside: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .rapport-credit { display: block; text-align: right; font-size: 11px; color: #94a3b8; margin-top: 16px; }
    }
</style>
</head>
<body>

<!-- PORTAAL-KOPPELING (zelfde blok in elke app): terug naar het portaal en de leerlingcode.
     De apps vragen of bewaren geen naam; enkel de anonieme code van het portaal wordt getoond. -->
<style>
    .portaal-terug { display: inline-block; margin: 0 0 12px; padding: 6px 14px; border: 1px solid #cbd5e1; border-radius: 999px; background: #fff; color: #475569; font: 600 .85rem system-ui, -apple-system, 'Segoe UI', sans-serif; text-decoration: none; }
    .portaal-terug:hover { background: #f1f5f9; color: #1e293b; }
    .portaal-terug-rij { text-align: left; }
    .leerling-code { position: fixed; left: 14px; bottom: 10px; font: 11px system-ui, -apple-system, 'Segoe UI', sans-serif; color: #94a3b8; background: rgba(255,255,255,.85); padding: 2px 8px; border-radius: 6px; pointer-events: none; z-index: 50; }
    @media print { .portaal-terug-rij, .leerling-code { display: none !important; } }
</style>
<script>
    // Anonieme leerlingcode en klas, zoals ingesteld in het portaal (index.html)
    function leerlingCode() {
        try { return (localStorage.getItem('wisk_leerling_code') || '').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '').slice(0, 20); } catch (e) { return ''; }
    }
    function portaalKlas() {
        try { const k = (localStorage.getItem('wisk_leerling_klas') || '').trim(); return k === 'alle klassen' ? '' : k.replace(/[^\p{L}\p{N} _-]/gu, '').slice(0, 20); } catch (e) { return ''; }
    }
    // Resultaten doorgeven aan het dashboard (via tracker.js). Bewaart nooit wat de leerling intypte:
    // enkel welke oefening, juist of fout, en de soort fout.
    function portaalLogOpgave(juist, module, fout, details) {
        try { if (window.WiskundeTracker) WiskundeTracker.logOpgave({ isCorrect: !!juist, moduleId: module, foutCategorie: fout || null, details: details || {} }); } catch (e) { /* loggen mag de app nooit storen */ }
    }
    function portaalLogToets(procent, duur, module, details) {
        try { if (window.WiskundeTracker) WiskundeTracker.logToets({ scoreProcent: procent, duurSeconden: duur || 0, moduleId: module, details: details || {} }); } catch (e) { /* loggen mag de app nooit storen */ }
    }
    window.addEventListener('DOMContentLoaded', () => {
        const code = leerlingCode();
        if (!code || window.WiskundeTracker) return; // de tracker toont de code al zelf
        const el = document.createElement('div');
        el.className = 'leerling-code';
        el.setAttribute('data-html2canvas-ignore', '');
        el.textContent = code;
        document.body.appendChild(el);
    });
</script>
<div id="app"></div>
<div class="maker-credit">© T. Gaerdelen</div>

<!-- =====================================================================
     OEFENINGENBANK
     Formaat (één oefening per blok, begint altijd met "f:"):
       @cat, @niveau, @voor  = standaardwaarden voor de volgende oefeningen
       f:     functie in invoer-notatie (zoals een leerling typt)
       d:     afgeleide (oplossing) in invoer-notatie
       dom:   interval waarop nagekeken wordt (f en f' moeten er bestaan)
       regel: eerste hint (welke regel?)
       s:     stap van de uitwerking; $...$ = LaTeX, [[...]] = invoer-notatie als formule
       fout:  veelgemaakte fout | gerichte feedback
     De app controleert bij het opstarten elke oplossing numeriek (zie console).
     ===================================================================== -->
<script type="text/plain" class="oefendata">
// ---------------- REKENREGELS, VEELTERMEN EN MACHTEN ----------------
@cat basis
@voor 5 8
@niveau 1

f: 4x^3 - 5x^2 + 2x - 9
d: 12x^2 - 10x + 2
dom: -2 2
regel: Somregel en machtsregel: $(x^n)' = n\,x^{n-1}$
s: Leid elke term apart af (somregel). Een constante factor blijft staan.
s: $(4x^3)' = 4\cdot 3x^2 = 12x^2$, $\;(-5x^2)' = -10x$ en $(2x)' = 2$
s: De afgeleide van de constante $-9$ is $0$.
fout: 12x^2 - 10x + 2 - 9 | De afgeleide van een constante (hier −9) is 0.
fout: 12x^2 - 10x | De afgeleide van 2x is 2, niet 0.

f: x^7 + 3x^5 - x
d: 7x^6 + 15x^4 - 1
dom: -1.5 1.5
regel: Somregel en machtsregel: $(x^n)' = n\,x^{n-1}$
s: $(x^7)' = 7x^6$ en $(3x^5)' = 3\cdot 5x^4 = 15x^4$
s: $(-x)' = -1$
fout: 7x^6 + 15x^4 | De afgeleide van −x is −1, niet 0.
fout: 7x^6 + 15x^4 - x | De afgeleide van −x is −1.

f: 2/3 x^6 - 1/2 x^4 + 5
d: 4x^5 - 2x^3
dom: -1.5 1.5
regel: Somregel en machtsregel: $(x^n)' = n\,x^{n-1}$
s: $\left(\frac{2}{3}x^6\right)' = \frac{2}{3}\cdot 6x^5 = 4x^5$
s: $\left(-\frac{1}{2}x^4\right)' = -\frac{1}{2}\cdot 4x^3 = -2x^3$
s: De constante $5$ heeft als afgeleide $0$.
fout: 4x^5 - 2x^3 + 5 | De afgeleide van een constante is 0.

f: 1/x
d: -1/x^2
dom: 0.3 3
regel: Schrijf als macht: $\frac{1}{x} = x^{-1}$
s: $\frac{1}{x} = x^{-1}$
s: $(x^{-1})' = -1\cdot x^{-2} = -\frac{1}{x^2}$
fout: ln(x) | Opgelet: ln(x) heeft 1/x als afgeleide, niet omgekeerd.

f: sqrt(x)
d: 1/(2sqrt(x))
dom: 0.2 4
regel: Schrijf als macht: $\sqrt{x} = x^{\frac12}$
s: $\sqrt{x} = x^{\frac12}$
s: $\left(x^{\frac12}\right)' = \frac12\, x^{-\frac12} = \frac{1}{2\sqrt{x}}$
fout: 1/sqrt(x) | Vergeet de factor ½ niet: $(x^{\frac12})' = \frac12 x^{-\frac12}$.

f: 5/x^3
d: -15/x^4
dom: 0.3 3
regel: Schrijf als macht: $\frac{5}{x^3} = 5x^{-3}$
s: $\frac{5}{x^3} = 5x^{-3}$
s: $(5x^{-3})' = 5\cdot(-3)\,x^{-4} = -\frac{15}{x^4}$
fout: -15/x^2 | De exponent daalt met 1: $-3 - 1 = -4$ (niet $-2$).

f: 3sqrt(x) - 2x
d: 3/(2sqrt(x)) - 2
dom: 0.2 4
regel: Somregel en $(\sqrt{x})' = \frac{1}{2\sqrt{x}}$
s: $(3\sqrt{x})' = 3\cdot\frac{1}{2\sqrt{x}} = \frac{3}{2\sqrt{x}}$
s: $(-2x)' = -2$

f: (2x+1)^2
d: 8x + 4
dom: -2 2
regel: Werk eerst uit (of gebruik de kettingregel).
s: $(2x+1)^2 = 4x^2 + 4x + 1$
s: $(4x^2 + 4x + 1)' = 8x + 4$
fout: 2(2x+1) | Met de kettingregel moet je nog vermenigvuldigen met de afgeleide van 2x+1, namelijk 2.

f: x^4 - 3/x
d: 4x^3 + 3/x^2
dom: 0.3 3
regel: Somregel; schrijf $\frac{3}{x} = 3x^{-1}$
s: $(x^4)' = 4x^3$
s: $\left(-3x^{-1}\right)' = -3\cdot(-1)\,x^{-2} = \frac{3}{x^2}$
fout: 4x^3 - 3/x^2 | Let op het teken: $(-3x^{-1})' = +3x^{-2}$.

@niveau 2
f: x^2 sqrt(x)
d: 5/2 x sqrt(x)
dom: 0.2 3
regel: Schrijf als één macht van $x$.
s: $x^2\sqrt{x} = x^2\cdot x^{\frac12} = x^{\frac52}$
s: $\left(x^{\frac52}\right)' = \frac52\, x^{\frac32} = \frac52\, x\sqrt{x}$

f: 1/sqrt(x)
d: -1/(2x sqrt(x))
dom: 0.3 3
regel: Schrijf als macht: $\frac{1}{\sqrt{x}} = x^{-\frac12}$
s: $\frac{1}{\sqrt{x}} = x^{-\frac12}$
s: $\left(x^{-\frac12}\right)' = -\frac12\, x^{-\frac32} = -\frac{1}{2x\sqrt{x}}$

f: (x^3 - 2x)/x^2
d: 1 + 2/x^2
dom: 0.3 3
regel: Splits eerst de breuk (of gebruik de quotiëntregel).
s: $\frac{x^3 - 2x}{x^2} = x - \frac{2}{x} = x - 2x^{-1}$
s: $(x - 2x^{-1})' = 1 + 2x^{-2} = 1 + \frac{2}{x^2}$

f: x^(2/3)
d: 2/(3x^(1/3))
dom: 0.3 3
regel: Machtsregel met een breuk als exponent
s: $\left(x^{\frac23}\right)' = \frac23\, x^{\frac23 - 1} = \frac23\, x^{-\frac13}$
s: $= \frac{2}{3x^{\frac13}} = \frac{2}{3\sqrt[3]{x}}$
fout: 2/3 x^(5/3) | De exponent daalt met 1: $\frac23 - 1 = -\frac13$.

f: x sqrt(x) + 4/sqrt(x)
d: 3/2 sqrt(x) - 2/(x sqrt(x))
dom: 0.3 3
regel: Schrijf elke term als macht van $x$.
s: $x\sqrt{x} + \frac{4}{\sqrt{x}} = x^{\frac32} + 4x^{-\frac12}$
s: $\left(x^{\frac32}\right)' = \frac32\, x^{\frac12} = \frac32\sqrt{x}$
s: $\left(4x^{-\frac12}\right)' = -2x^{-\frac32} = -\frac{2}{x\sqrt{x}}$

@niveau 3
f: (2x^2 - 3)^2/x^3
d: 4 + 12/x^2 - 27/x^4
dom: 0.4 3
regel: Werk de teller uit en splits de breuk.
s: $\frac{(2x^2-3)^2}{x^3} = \frac{4x^4 - 12x^2 + 9}{x^3} = 4x - 12x^{-1} + 9x^{-3}$
s: $(4x - 12x^{-1} + 9x^{-3})' = 4 + 12x^{-2} - 27x^{-4}$
s: $= 4 + \frac{12}{x^2} - \frac{27}{x^4}$

f: (sqrt(x) + 1)^2/sqrt(x)
d: 1/(2sqrt(x)) - 1/(2x sqrt(x))
dom: 0.3 3
regel: Werk de teller uit, splits de breuk en schrijf als machten.
s: $\frac{(\sqrt{x}+1)^2}{\sqrt{x}} = \frac{x + 2\sqrt{x} + 1}{\sqrt{x}} = x^{\frac12} + 2 + x^{-\frac12}$
s: $\left(x^{\frac12} + 2 + x^{-\frac12}\right)' = \frac12\, x^{-\frac12} - \frac12\, x^{-\frac32}$
s: $= \frac{1}{2\sqrt{x}} - \frac{1}{2x\sqrt{x}}$

// ---------------- PRODUCT- EN QUOTIËNTREGEL ----------------
@cat prodquot
@niveau 1

f: (x^2+1)(3x-2)
d: 9x^2 - 4x + 3
dom: -2 2
regel: Productregel: $(u\cdot v)' = u'v + uv'$
s: $u = x^2+1 \Rightarrow u' = 2x$ en $v = 3x-2 \Rightarrow v' = 3$
s: $f'(x) = 2x(3x-2) + (x^2+1)\cdot 3$
s: $= 6x^2 - 4x + 3x^2 + 3 = 9x^2 - 4x + 3$
fout: 6x | $(u\cdot v)' \neq u'\cdot v'$. Gebruik de productregel $(u\cdot v)' = u'v + uv'$.

f: x^3(2x+5)
d: 8x^3 + 15x^2
dom: -2 2
regel: Productregel: $(u\cdot v)' = u'v + uv'$ (of eerst uitwerken)
s: $u = x^3 \Rightarrow u' = 3x^2$ en $v = 2x+5 \Rightarrow v' = 2$
s: $f'(x) = 3x^2(2x+5) + x^3\cdot 2 = 6x^3 + 15x^2 + 2x^3 = 8x^3 + 15x^2$
fout: 6x^2 | $(u\cdot v)' \neq u'\cdot v'$. Gebruik de productregel.

f: (x+1)/(x-1)
d: -2/(x-1)^2
dom: 1.3 4
regel: Quotiëntregel: $\left(\frac{u}{v}\right)' = \frac{u'v - uv'}{v^2}$
s: $u = x+1 \Rightarrow u' = 1$ en $v = x-1 \Rightarrow v' = 1$
s: $f'(x) = \frac{1\cdot(x-1) - (x+1)\cdot 1}{(x-1)^2} = \frac{-2}{(x-1)^2}$
fout: -2/(x-1) | Vergeet het kwadraat in de noemer niet: $\left(\frac{u}{v}\right)' = \frac{u'v-uv'}{v^2}$.
fout: 1 | $\left(\frac{u}{v}\right)' \neq \frac{u'}{v'}$. Gebruik de quotiëntregel.

f: 3x/(x^2+1)
d: (3 - 3x^2)/(x^2+1)^2
dom: -2 2
regel: Quotiëntregel: $\left(\frac{u}{v}\right)' = \frac{u'v - uv'}{v^2}$
s: $u = 3x \Rightarrow u' = 3$ en $v = x^2+1 \Rightarrow v' = 2x$
s: $f'(x) = \frac{3(x^2+1) - 3x\cdot 2x}{(x^2+1)^2} = \frac{3 - 3x^2}{(x^2+1)^2}$
fout: (3x^2 - 3)/(x^2+1)^2 | In de teller van de quotiëntregel staat $u'v - uv'$: let op de volgorde.
fout: 3/(2x) | $\left(\frac{u}{v}\right)' \neq \frac{u'}{v'}$. Gebruik de quotiëntregel.

f: (2x-3)/(x+4)
d: 11/(x+4)^2
dom: -3 3
regel: Quotiëntregel: $\left(\frac{u}{v}\right)' = \frac{u'v - uv'}{v^2}$
s: $u = 2x-3 \Rightarrow u' = 2$ en $v = x+4 \Rightarrow v' = 1$
s: $f'(x) = \frac{2(x+4) - (2x-3)\cdot 1}{(x+4)^2} = \frac{2x + 8 - 2x + 3}{(x+4)^2} = \frac{11}{(x+4)^2}$
fout: 5/(x+4)^2 | Let op het minteken voor de haakjes: $-(2x-3) = -2x + 3$.

f: (x^2-4)(x^2+4)
d: 4x^3
dom: -2 2
regel: Productregel (of eerst uitwerken met een merkwaardig product)
s: $u = x^2-4 \Rightarrow u' = 2x$ en $v = x^2+4 \Rightarrow v' = 2x$
s: $f'(x) = 2x(x^2+4) + (x^2-4)\cdot 2x = 2x^3 + 8x + 2x^3 - 8x = 4x^3$
s: Controle: $(x^2-4)(x^2+4) = x^4 - 16$ en $(x^4 - 16)' = 4x^3$.
fout: 4x^2 | $(u\cdot v)' \neq u'\cdot v'$. Gebruik de productregel.

f: (x^3+1)/x^2
d: 1 - 2/x^3
dom: 0.3 3
regel: Quotiëntregel, of splits eerst de breuk.
s: Splitsen: $\frac{x^3+1}{x^2} = x + x^{-2}$
s: $(x + x^{-2})' = 1 - 2x^{-3} = 1 - \frac{2}{x^3}$
s: Met de quotiëntregel: $\frac{3x^2\cdot x^2 - (x^3+1)\cdot 2x}{x^4} = \frac{x^4 - 2x}{x^4} = 1 - \frac{2}{x^3}$
fout: 3x^2/(2x) | $\left(\frac{u}{v}\right)' \neq \frac{u'}{v'}$. Gebruik de quotiëntregel.

@niveau 2
f: (x^2+3x)/(x-2)
d: (x^2 - 4x - 6)/(x-2)^2
dom: 2.3 5
regel: Quotiëntregel: $\left(\frac{u}{v}\right)' = \frac{u'v - uv'}{v^2}$
s: $u = x^2+3x \Rightarrow u' = 2x+3$ en $v = x-2 \Rightarrow v' = 1$
s: $f'(x) = \frac{(2x+3)(x-2) - (x^2+3x)}{(x-2)^2}$
s: $= \frac{2x^2 - x - 6 - x^2 - 3x}{(x-2)^2} = \frac{x^2 - 4x - 6}{(x-2)^2}$

f: (x^2-1)/(x^2+1)
d: 4x/(x^2+1)^2
dom: -2 2
regel: Quotiëntregel: $\left(\frac{u}{v}\right)' = \frac{u'v - uv'}{v^2}$
s: $u = x^2-1 \Rightarrow u' = 2x$ en $v = x^2+1 \Rightarrow v' = 2x$
s: $f'(x) = \frac{2x(x^2+1) - (x^2-1)\cdot 2x}{(x^2+1)^2} = \frac{4x}{(x^2+1)^2}$
fout: 1 | $\left(\frac{u}{v}\right)' \neq \frac{u'}{v'}$. Gebruik de quotiëntregel.

f: sqrt(x)(x^2+1)
d: (5x^2+1)/(2sqrt(x))
dom: 0.2 3
regel: Productregel: $(u\cdot v)' = u'v + uv'$
s: $u = \sqrt{x} \Rightarrow u' = \frac{1}{2\sqrt{x}}$ en $v = x^2+1 \Rightarrow v' = 2x$
s: $f'(x) = \frac{x^2+1}{2\sqrt{x}} + 2x\sqrt{x}$
s: Op gelijke noemer: $\frac{x^2 + 1 + 4x^2}{2\sqrt{x}} = \frac{5x^2+1}{2\sqrt{x}}$

f: 1/(x^2+2x+3)
d: -(2x+2)/(x^2+2x+3)^2
dom: -3 2
regel: Quotiëntregel met teller $1$ (of de kettingregel)
s: $u = 1 \Rightarrow u' = 0$ en $v = x^2+2x+3 \Rightarrow v' = 2x+2$
s: $f'(x) = \frac{0\cdot v - 1\cdot(2x+2)}{(x^2+2x+3)^2} = -\frac{2x+2}{(x^2+2x+3)^2}$
fout: 1/(2x+2) | $\left(\frac{1}{v}\right)' \neq \frac{1}{v'}$. Gebruik de quotiëntregel: $\left(\frac{1}{v}\right)' = -\frac{v'}{v^2}$.

f: x/(x^2-4)
d: -(x^2+4)/(x^2-4)^2
dom: -1.5 1.5
regel: Quotiëntregel: $\left(\frac{u}{v}\right)' = \frac{u'v - uv'}{v^2}$
s: $u = x \Rightarrow u' = 1$ en $v = x^2-4 \Rightarrow v' = 2x$
s: $f'(x) = \frac{(x^2-4) - x\cdot 2x}{(x^2-4)^2} = \frac{-x^2-4}{(x^2-4)^2} = -\frac{x^2+4}{(x^2-4)^2}$

f: (x^2+1)/(x^2-x+1)
d: (1-x^2)/(x^2-x+1)^2
dom: -2 2
regel: Quotiëntregel: $\left(\frac{u}{v}\right)' = \frac{u'v - uv'}{v^2}$
s: $u = x^2+1 \Rightarrow u' = 2x$ en $v = x^2-x+1 \Rightarrow v' = 2x-1$
s: $f'(x) = \frac{2x(x^2-x+1) - (x^2+1)(2x-1)}{(x^2-x+1)^2}$
s: Teller: $2x^3 - 2x^2 + 2x - (2x^3 - x^2 + 2x - 1) = 1 - x^2$
s: $f'(x) = \frac{1-x^2}{(x^2-x+1)^2}$

f: x^3/(x^2+3)
d: (x^4 + 9x^2)/(x^2+3)^2
dom: -2 2
regel: Quotiëntregel: $\left(\frac{u}{v}\right)' = \frac{u'v - uv'}{v^2}$
s: $u = x^3 \Rightarrow u' = 3x^2$ en $v = x^2+3 \Rightarrow v' = 2x$
s: $f'(x) = \frac{3x^2(x^2+3) - x^3\cdot 2x}{(x^2+3)^2} = \frac{x^4 + 9x^2}{(x^2+3)^2}$

f: (x^2-3x)(x^2+2)
d: 4x^3 - 9x^2 + 4x - 6
dom: -2 2
regel: Productregel: $(u\cdot v)' = u'v + uv'$
s: $u = x^2-3x \Rightarrow u' = 2x-3$ en $v = x^2+2 \Rightarrow v' = 2x$
s: $f'(x) = (2x-3)(x^2+2) + (x^2-3x)\cdot 2x$
s: $= 2x^3 - 3x^2 + 4x - 6 + 2x^3 - 6x^2 = 4x^3 - 9x^2 + 4x - 6$
fout: (2x-3)2x | $(u\cdot v)' \neq u'\cdot v'$. Gebruik de productregel.

@niveau 3
f: (3x+1)(x^2-x)(x+2)
uit: product van drie functies (doet Tom niet)
d: 12x^3 + 12x^2 - 10x - 2
dom: -2 2
regel: Productregel voor drie factoren: $(uvw)' = u'vw + uv'w + uvw'$
s: $u = 3x+1,\ v = x^2-x,\ w = x+2$ met $u' = 3,\ v' = 2x-1,\ w' = 1$
s: $f'(x) = 3(x^2-x)(x+2) + (3x+1)(2x-1)(x+2) + (3x+1)(x^2-x)$
s: De drie termen: $3x^3 + 3x^2 - 6x$, $\;6x^3 + 11x^2 - 3x - 2$ en $3x^3 - 2x^2 - x$
s: Samen: $f'(x) = 12x^3 + 12x^2 - 10x - 2$

f: x^2/(x+1)^2
d: 2x/(x+1)^3
dom: 0 3
regel: Quotiëntregel, met de kettingregel voor $(x+1)^2$
s: $u = x^2 \Rightarrow u' = 2x$ en $v = (x+1)^2 \Rightarrow v' = 2(x+1)$
s: $f'(x) = \frac{2x(x+1)^2 - x^2\cdot 2(x+1)}{(x+1)^4}$
s: Zet $2x(x+1)$ voorop: $\frac{2x(x+1)\left[(x+1) - x\right]}{(x+1)^4} = \frac{2x}{(x+1)^3}$

f: sqrt(x)/(x+1)
d: (1-x)/(2sqrt(x)(x+1)^2)
dom: 0.2 3
regel: Quotiëntregel: $\left(\frac{u}{v}\right)' = \frac{u'v - uv'}{v^2}$
s: $u = \sqrt{x} \Rightarrow u' = \frac{1}{2\sqrt{x}}$ en $v = x+1 \Rightarrow v' = 1$
s: $f'(x) = \frac{\frac{x+1}{2\sqrt{x}} - \sqrt{x}}{(x+1)^2}$
s: Teller en noemer maal $2\sqrt{x}$: $\frac{x + 1 - 2x}{2\sqrt{x}\,(x+1)^2} = \frac{1-x}{2\sqrt{x}\,(x+1)^2}$

f: (2x+1)^2(x-3)
d: (2x+1)(6x-11)
dom: -2 3
regel: Productregel, met de kettingregel voor $(2x+1)^2$
s: $u = (2x+1)^2 \Rightarrow u' = 2(2x+1)\cdot 2 = 4(2x+1)$ en $v = x-3 \Rightarrow v' = 1$
s: $f'(x) = 4(2x+1)(x-3) + (2x+1)^2$
s: Zet $(2x+1)$ voorop: $(2x+1)\left[4(x-3) + (2x+1)\right] = (2x+1)(6x-11)$
fout: 2(2x+1)(x-3) + (2x+1)^2 | Bij $u = (2x+1)^2$ vergeet je de afgeleide van de binnenste functie (2).

f: (x^2+2x)/(x^2-2x)
d: -4/(x-2)^2
dom: 2.3 5
regel: Quotiëntregel; vereenvoudig eerst de breuk.
s: Vereenvoudig: $\frac{x^2+2x}{x^2-2x} = \frac{x(x+2)}{x(x-2)} = \frac{x+2}{x-2}$ (voor $x \neq 0$)
s: $f'(x) = \frac{1\cdot(x-2) - (x+2)\cdot 1}{(x-2)^2} = \frac{-4}{(x-2)^2}$
</script>

// ---------------- KETTINGREGEL (MACHTEN EN WORTELS) ----------------
@cat ketting
@voor 5 8
@niveau 1

f: (2x-5)^4
d: 8(2x-5)^3
dom: -1 4
regel: Kettingregel: $\left(u^n\right)' = n\,u^{n-1}\cdot u'$
s: Buitenste functie: $u^4$, binnenste functie: $u = 2x-5 \Rightarrow u' = 2$
s: $f'(x) = 4(2x-5)^3\cdot 2 = 8(2x-5)^3$
fout: 4(2x-5)^3 | Vergeet de afgeleide van de binnenste functie niet: $(2x-5)' = 2$.

f: (3x+1)^5
d: 15(3x+1)^4
dom: -1 1
regel: Kettingregel: $\left(u^n\right)' = n\,u^{n-1}\cdot u'$
s: $u = 3x+1 \Rightarrow u' = 3$
s: $f'(x) = 5(3x+1)^4\cdot 3 = 15(3x+1)^4$
fout: 5(3x+1)^4 | Vergeet de afgeleide van de binnenste functie niet: $(3x+1)' = 3$.

f: sqrt(4x+1)
d: 2/sqrt(4x+1)
dom: 0 3
regel: Kettingregel: $\left(\sqrt{u}\right)' = \frac{u'}{2\sqrt{u}}$
s: $u = 4x+1 \Rightarrow u' = 4$
s: $f'(x) = \frac{4}{2\sqrt{4x+1}} = \frac{2}{\sqrt{4x+1}}$
fout: 1/(2sqrt(4x+1)) | Vergeet de afgeleide van de binnenste functie niet: $(4x+1)' = 4$.

f: (x^2+1)^3
d: 6x(x^2+1)^2
dom: -2 2
regel: Kettingregel: $\left(u^n\right)' = n\,u^{n-1}\cdot u'$
s: $u = x^2+1 \Rightarrow u' = 2x$
s: $f'(x) = 3(x^2+1)^2\cdot 2x = 6x(x^2+1)^2$
fout: 3(x^2+1)^2 | Vergeet de afgeleide van de binnenste functie niet: $(x^2+1)' = 2x$.

f: 1/(2x+3)
d: -2/(2x+3)^2
dom: -1 3
regel: Schrijf als macht $(2x+3)^{-1}$ en gebruik de kettingregel.
s: $f(x) = (2x+3)^{-1}$ met $u = 2x+3 \Rightarrow u' = 2$
s: $f'(x) = -1\cdot(2x+3)^{-2}\cdot 2 = -\frac{2}{(2x+3)^2}$
fout: -1/(2x+3)^2 | Vergeet de afgeleide van de binnenste functie niet: $(2x+3)' = 2$.

f: (1-x)^6
d: -6(1-x)^5
dom: -1 2
regel: Kettingregel: $\left(u^n\right)' = n\,u^{n-1}\cdot u'$
s: $u = 1-x \Rightarrow u' = -1$
s: $f'(x) = 6(1-x)^5\cdot(-1) = -6(1-x)^5$
fout: 6(1-x)^5 | De afgeleide van de binnenste functie 1−x is −1: er komt dus een minteken bij.

f: (5 - 2x^3)^2
d: -12x^2(5-2x^3)
dom: -1.5 1.5
regel: Kettingregel: $\left(u^2\right)' = 2u\cdot u'$
s: $u = 5-2x^3 \Rightarrow u' = -6x^2$
s: $f'(x) = 2(5-2x^3)\cdot(-6x^2) = -12x^2(5-2x^3)$
fout: 2(5-2x^3) | Vergeet de afgeleide van de binnenste functie niet: $(5-2x^3)' = -6x^2$.

@niveau 2
f: sqrt(x^2+3x)
d: (2x+3)/(2sqrt(x^2+3x))
dom: 0.2 3
regel: Kettingregel: $\left(\sqrt{u}\right)' = \frac{u'}{2\sqrt{u}}$
s: $u = x^2+3x \Rightarrow u' = 2x+3$
s: $f'(x) = \frac{2x+3}{2\sqrt{x^2+3x}}$
fout: 1/(2sqrt(x^2+3x)) | Vergeet de afgeleide van de binnenste functie niet: $(x^2+3x)' = 2x+3$.

f: (x^2-3x+1)^4
d: 4(2x-3)(x^2-3x+1)^3
dom: -1 3
regel: Kettingregel: $\left(u^n\right)' = n\,u^{n-1}\cdot u'$
s: $u = x^2-3x+1 \Rightarrow u' = 2x-3$
s: $f'(x) = 4(x^2-3x+1)^3\cdot(2x-3)$
fout: 4(x^2-3x+1)^3 | Vergeet de afgeleide van de binnenste functie niet: $(x^2-3x+1)' = 2x-3$.

f: 1/(x^2+1)^2
d: -4x/(x^2+1)^3
dom: -2 2
regel: Schrijf als macht $(x^2+1)^{-2}$ en gebruik de kettingregel.
s: $f(x) = (x^2+1)^{-2}$ met $u = x^2+1 \Rightarrow u' = 2x$
s: $f'(x) = -2(x^2+1)^{-3}\cdot 2x = -\frac{4x}{(x^2+1)^3}$
fout: -2/(x^2+1)^3 | Vergeet de afgeleide van de binnenste functie niet: $(x^2+1)' = 2x$.

f: sqrt(1-x^2)
d: -x/sqrt(1-x^2)
dom: -0.9 0.9
regel: Kettingregel: $\left(\sqrt{u}\right)' = \frac{u'}{2\sqrt{u}}$
s: $u = 1-x^2 \Rightarrow u' = -2x$
s: $f'(x) = \frac{-2x}{2\sqrt{1-x^2}} = -\frac{x}{\sqrt{1-x^2}}$
fout: 1/(2sqrt(1-x^2)) | Vergeet de afgeleide van de binnenste functie niet: $(1-x^2)' = -2x$.

f: (x^2+4)^(3/2)
d: 3x sqrt(x^2+4)
dom: -2 2
regel: Kettingregel met een gebroken exponent: $\left(u^{\frac32}\right)' = \frac32 u^{\frac12}\cdot u'$
s: $u = x^2+4 \Rightarrow u' = 2x$
s: $f'(x) = \frac32 (x^2+4)^{\frac12}\cdot 2x = 3x\sqrt{x^2+4}$

f: 3/sqrt(2x+1)
d: -3/((2x+1)sqrt(2x+1))
dom: 0 3
regel: Schrijf als macht $3(2x+1)^{-\frac12}$ en gebruik de kettingregel.
s: $f(x) = 3(2x+1)^{-\frac12}$ met $u = 2x+1 \Rightarrow u' = 2$
s: $f'(x) = 3\cdot\left(-\frac12\right)(2x+1)^{-\frac32}\cdot 2 = -3(2x+1)^{-\frac32}$
s: $= -\frac{3}{(2x+1)\sqrt{2x+1}}$

f: x sqrt(x^2+1)
d: (2x^2+1)/sqrt(x^2+1)
dom: -2 2
regel: Productregel, met de kettingregel voor de wortel
s: $u = x \Rightarrow u' = 1$ en $v = \sqrt{x^2+1} \Rightarrow v' = \frac{2x}{2\sqrt{x^2+1}} = \frac{x}{\sqrt{x^2+1}}$
s: $f'(x) = \sqrt{x^2+1} + \frac{x^2}{\sqrt{x^2+1}}$
s: Op gelijke noemer: $\frac{x^2+1+x^2}{\sqrt{x^2+1}} = \frac{2x^2+1}{\sqrt{x^2+1}}$

f: (x^3 - 1/x)^2
d: 2(x^3 - 1/x)(3x^2 + 1/x^2)
dom: 0.4 2
regel: Kettingregel: $\left(u^2\right)' = 2u\cdot u'$
s: $u = x^3 - x^{-1} \Rightarrow u' = 3x^2 + x^{-2}$
s: $f'(x) = 2\left(x^3 - \frac{1}{x}\right)\left(3x^2 + \frac{1}{x^2}\right)$

@niveau 3
f: sqrt(x + sqrt(x))
d: (2sqrt(x)+1)/(4sqrt(x)sqrt(x+sqrt(x)))
dom: 0.2 3
regel: Kettingregel, twee keer na elkaar
s: $u = x + \sqrt{x} \Rightarrow u' = 1 + \frac{1}{2\sqrt{x}} = \frac{2\sqrt{x}+1}{2\sqrt{x}}$
s: $f'(x) = \frac{u'}{2\sqrt{u}} = \frac{2\sqrt{x}+1}{2\sqrt{x}}\cdot\frac{1}{2\sqrt{x+\sqrt{x}}}$
s: $= \frac{2\sqrt{x}+1}{4\sqrt{x}\,\sqrt{x+\sqrt{x}}}$

f: ((x+1)/(x-1))^3
d: -6(x+1)^2/(x-1)^4
dom: 1.3 4
regel: Kettingregel, met de quotiëntregel voor de binnenste functie
s: $u = \frac{x+1}{x-1} \Rightarrow u' = \frac{(x-1)-(x+1)}{(x-1)^2} = \frac{-2}{(x-1)^2}$
s: $f'(x) = 3\left(\frac{x+1}{x-1}\right)^2\cdot\frac{-2}{(x-1)^2}$
s: $= -\frac{6(x+1)^2}{(x-1)^4}$

f: ((x^2+1)^3 + 1)^2
d: 12x(x^2+1)^2((x^2+1)^3 + 1)
dom: -1 1
regel: Kettingregel in drie lagen
s: Buitenste laag: $\left(u^2\right)' = 2u\cdot u'$ met $u = (x^2+1)^3 + 1$
s: Daarbinnen: $u' = 3(x^2+1)^2\cdot 2x = 6x(x^2+1)^2$
s: $f'(x) = 2\left((x^2+1)^3+1\right)\cdot 6x(x^2+1)^2 = 12x(x^2+1)^2\left((x^2+1)^3+1\right)$

f: (2x-1)^4(x+1)^3
d: (2x-1)^3(x+1)^2(14x+5)
dom: -1 2
regel: Productregel, met de kettingregel voor beide factoren
s: $u = (2x-1)^4 \Rightarrow u' = 8(2x-1)^3$ en $v = (x+1)^3 \Rightarrow v' = 3(x+1)^2$
s: $f'(x) = 8(2x-1)^3(x+1)^3 + 3(2x-1)^4(x+1)^2$
s: Zet $(2x-1)^3(x+1)^2$ voorop: $(2x-1)^3(x+1)^2\left[8(x+1) + 3(2x-1)\right] = (2x-1)^3(x+1)^2(14x+5)$

f: sqrt((x^2+1)/x)
d: (x^2-1)/(2x^2 sqrt((x^2+1)/x))
dom: 0.3 3
regel: Kettingregel; schrijf de binnenste functie eerst als $x + \frac{1}{x}$.
s: $u = \frac{x^2+1}{x} = x + x^{-1} \Rightarrow u' = 1 - \frac{1}{x^2} = \frac{x^2-1}{x^2}$
s: $f'(x) = \frac{u'}{2\sqrt{u}} = \frac{x^2-1}{2x^2\sqrt{\frac{x^2+1}{x}}}$

// ---------------- GONIOMETRISCHE FUNCTIES ----------------
@cat gonio
@niveau 1

f: sin(x^2)
d: 2x cos(x^2)
dom: -2 2
regel: Kettingregel: $(\sin u)' = \cos u\cdot u'$
s: $u = x^2 \Rightarrow u' = 2x$
s: $f'(x) = \cos(x^2)\cdot 2x = 2x\cos(x^2)$
fout: cos(x^2) | Vergeet de afgeleide van de binnenste functie niet: $(x^2)' = 2x$.
fout: cos(2x) | Neem cos van dezelfde binnenste functie $x^2$ en vermenigvuldig dan met $(x^2)' = 2x$.

f: 3cos(2x)
d: -6sin(2x)
dom: -2 2
regel: Kettingregel: $(\cos u)' = -\sin u\cdot u'$
s: $u = 2x \Rightarrow u' = 2$
s: $f'(x) = 3\cdot(-\sin(2x))\cdot 2 = -6\sin(2x)$
fout: 6sin(2x) | Let op: $(\cos u)' = -\sin u\cdot u'$ (met minteken).
fout: -3sin(2x) | Vergeet de afgeleide van de binnenste functie niet: $(2x)' = 2$.

f: tan(3x)
d: 3/cos(3x)^2
dom: -0.4 0.4
regel: Kettingregel: $(\tan u)' = \frac{u'}{\cos^2 u}$
s: $u = 3x \Rightarrow u' = 3$
s: $f'(x) = \frac{3}{\cos^2(3x)}$ (of ook $3\left(1 + \tan^2(3x)\right)$)
fout: 1/cos(3x)^2 | Vergeet de afgeleide van de binnenste functie niet: $(3x)' = 3$.

f: sin(x) + cos(x)
d: cos(x) - sin(x)
dom: -3 3
regel: $(\sin x)' = \cos x$ en $(\cos x)' = -\sin x$
s: $(\sin x)' = \cos x$
s: $(\cos x)' = -\sin x$
fout: cos(x) + sin(x) | Let op: $(\cos x)' = -\sin x$ (met minteken).

f: x^2 - 4sin(x)
d: 2x - 4cos(x)
dom: -3 3
regel: Somregel en $(\sin x)' = \cos x$
s: Leid elke term apart af (somregel). De constante factor $-4$ blijft staan.
s: $(x^2)' = 2x$ en $(-4\sin x)' = -4\cos x$
s: Samen: $f'(x) = 2x - 4\cos x$

f: cos(5x - 1)
d: -5sin(5x-1)
dom: -2 2
regel: Kettingregel: $(\cos u)' = -\sin u\cdot u'$
s: $u = 5x - 1 \Rightarrow u' = 5$
s: $f'(x) = -\sin(5x-1)\cdot 5 = -5\sin(5x-1)$
fout: -sin(5x-1) | Vergeet de afgeleide van de binnenste functie niet: $(5x-1)' = 5$.

f: 2sin(x/2)
d: cos(x/2)
dom: -3 3
regel: Kettingregel: $(\sin u)' = \cos u\cdot u'$
s: $u = \frac{x}{2} \Rightarrow u' = \frac12$
s: $f'(x) = 2\cos\left(\frac{x}{2}\right)\cdot\frac12 = \cos\left(\frac{x}{2}\right)$
fout: 2cos(x/2) | Vergeet de afgeleide van de binnenste functie niet: $\left(\frac{x}{2}\right)' = \frac12$.

@niveau 2
f: x sin(x)
d: sin(x) + x cos(x)
dom: -3 3
regel: Productregel: $(u\cdot v)' = u'v + uv'$
s: $u = x \Rightarrow u' = 1$ en $v = \sin x \Rightarrow v' = \cos x$
s: $f'(x) = \sin x + x\cos x$
fout: cos(x) | $(u\cdot v)' \neq u'\cdot v'$. Gebruik de productregel.

f: sin(x)^2
d: 2sin(x)cos(x)
dom: -3 3
regel: Kettingregel: $\left(u^2\right)' = 2u\cdot u'$ met $u = \sin x$
s: $u = \sin x \Rightarrow u' = \cos x$
s: $f'(x) = 2\sin x\cos x$ (en dat is ook gelijk aan $\sin(2x)$)
fout: 2sin(x) | Vergeet de afgeleide van de binnenste functie niet: $(\sin x)' = \cos x$.
fout: cos(x)^2 | $\left(\sin^2 x\right)'$ is niet $\cos^2 x$: gebruik de kettingregel $\left(u^2\right)' = 2u\cdot u'$.

f: sin(x)cos(x)
d: cos(x)^2 - sin(x)^2
dom: -3 3
regel: Productregel: $(u\cdot v)' = u'v + uv'$
s: $u = \sin x \Rightarrow u' = \cos x$ en $v = \cos x \Rightarrow v' = -\sin x$
s: $f'(x) = \cos x\cdot\cos x + \sin x\cdot(-\sin x) = \cos^2 x - \sin^2 x$
s: Dat is ook gelijk aan $\cos(2x)$.
fout: -sin(x)cos(x) | $(u\cdot v)' \neq u'\cdot v'$. Gebruik de productregel.

f: sin(x)/x
d: (x cos(x) - sin(x))/x^2
dom: 0.3 3
regel: Quotiëntregel: $\left(\frac{u}{v}\right)' = \frac{u'v - uv'}{v^2}$
s: $u = \sin x \Rightarrow u' = \cos x$ en $v = x \Rightarrow v' = 1$
s: $f'(x) = \frac{x\cos x - \sin x}{x^2}$
fout: cos(x) | $\left(\frac{u}{v}\right)' \neq \frac{u'}{v'}$. Gebruik de quotiëntregel.

f: cos(x)^3
d: -3cos(x)^2 sin(x)
dom: -3 3
regel: Kettingregel: $\left(u^3\right)' = 3u^2\cdot u'$ met $u = \cos x$
s: $u = \cos x \Rightarrow u' = -\sin x$
s: $f'(x) = 3\cos^2 x\cdot(-\sin x) = -3\cos^2 x\,\sin x$
fout: 3cos(x)^2 | Vergeet de afgeleide van de binnenste functie niet: $(\cos x)' = -\sin x$.
fout: -3sin(x)^2 | Leid eerst de macht af ($3\cos^2 x$) en vermenigvuldig dan met $(\cos x)' = -\sin x$.

f: tan(x^2)
d: 2x/cos(x^2)^2
dom: -1 1
regel: Kettingregel: $(\tan u)' = \frac{u'}{\cos^2 u}$
s: $u = x^2 \Rightarrow u' = 2x$
s: $f'(x) = \frac{2x}{\cos^2(x^2)}$
fout: 1/cos(x^2)^2 | Vergeet de afgeleide van de binnenste functie niet: $(x^2)' = 2x$.

f: sqrt(sin(x))
d: cos(x)/(2sqrt(sin(x)))
dom: 0.2 2.8
regel: Kettingregel: $\left(\sqrt{u}\right)' = \frac{u'}{2\sqrt{u}}$
s: $u = \sin x \Rightarrow u' = \cos x$
s: $f'(x) = \frac{\cos x}{2\sqrt{\sin x}}$
fout: 1/(2sqrt(sin(x))) | Vergeet de afgeleide van de binnenste functie niet: $(\sin x)' = \cos x$.

f: x^2 cos(3x)
d: 2x cos(3x) - 3x^2 sin(3x)
dom: -2 2
regel: Productregel, met de kettingregel voor $\cos(3x)$
s: $u = x^2 \Rightarrow u' = 2x$ en $v = \cos(3x) \Rightarrow v' = -3\sin(3x)$
s: $f'(x) = 2x\cos(3x) - 3x^2\sin(3x)$
fout: 2x cos(3x) - x^2 sin(3x) | Bij $\cos(3x)$ vergeet je de afgeleide van de binnenste functie: $(3x)' = 3$.

f: 1/cos(x)
d: sin(x)/cos(x)^2
dom: -1.2 1.2
regel: Schrijf als macht $(\cos x)^{-1}$ (of gebruik de quotiëntregel).
s: $f(x) = (\cos x)^{-1}$
s: $f'(x) = -1\cdot(\cos x)^{-2}\cdot(-\sin x) = \frac{\sin x}{\cos^2 x}$
fout: -1/sin(x) | $\left(\frac{1}{v}\right)' \neq \frac{1}{v'}$. Gebruik de quotiëntregel: $\left(\frac{1}{v}\right)' = -\frac{v'}{v^2}$.

f: cot(2x)
d: -2/sin(2x)^2
dom: 0.2 1.4
regel: Kettingregel: $(\cot u)' = -\frac{u'}{\sin^2 u}$
s: $u = 2x \Rightarrow u' = 2$
s: $f'(x) = -\frac{2}{\sin^2(2x)}$
fout: -1/sin(2x)^2 | Vergeet de afgeleide van de binnenste functie niet: $(2x)' = 2$.
fout: 2/sin(2x)^2 | Let op: $(\cot u)' = -\frac{u'}{\sin^2 u}$ (met minteken).

f: x tan(x)
d: tan(x) + x/cos(x)^2
dom: -1 1
regel: Productregel: $(u\cdot v)' = u'v + uv'$
s: $u = x \Rightarrow u' = 1$ en $v = \tan x \Rightarrow v' = \frac{1}{\cos^2 x}$
s: $f'(x) = \tan x + \frac{x}{\cos^2 x}$

@niveau 3
f: sin(x)/(1+cos(x))
d: 1/(1+cos(x))
dom: -2 2
regel: Quotiëntregel; vereenvoudig daarna met $\sin^2 x + \cos^2 x = 1$.
s: $u = \sin x \Rightarrow u' = \cos x$ en $v = 1 + \cos x \Rightarrow v' = -\sin x$
s: $f'(x) = \frac{\cos x\,(1+\cos x) + \sin^2 x}{(1+\cos x)^2} = \frac{\cos x + \cos^2 x + \sin^2 x}{(1+\cos x)^2}$
s: $= \frac{\cos x + 1}{(1+\cos x)^2} = \frac{1}{1+\cos x}$

f: tan(2x)^3
d: 6tan(2x)^2/cos(2x)^2
dom: -0.6 0.6
regel: Kettingregel in drie lagen: macht, tangens, veelterm
s: Buitenste laag: $\left(u^3\right)' = 3u^2\cdot u'$ met $u = \tan(2x)$
s: $u' = \frac{1}{\cos^2(2x)}\cdot 2$
s: $f'(x) = 3\tan^2(2x)\cdot\frac{2}{\cos^2(2x)} = \frac{6\tan^2(2x)}{\cos^2(2x)}$
fout: 3tan(2x)^2/cos(2x)^2 | Vergeet de binnenste laag niet: $(2x)' = 2$.

f: cos(sin(x))
d: -sin(sin(x))cos(x)
dom: -3 3
regel: Kettingregel: $(\cos u)' = -\sin u\cdot u'$ met $u = \sin x$
s: $u = \sin x \Rightarrow u' = \cos x$
s: $f'(x) = -\sin(\sin x)\cdot\cos x$
fout: -sin(cos(x)) | Neem −sin van de binnenste functie zelf (sin x) en vermenigvuldig dan met $(\sin x)' = \cos x$.
fout: -sin(sin(x)) | Vergeet de afgeleide van de binnenste functie niet: $(\sin x)' = \cos x$.

f: sin(x^2)^3
d: 6x sin(x^2)^2 cos(x^2)
dom: -1.5 1.5
regel: Kettingregel in drie lagen
s: $\left(\sin^3(x^2)\right)' = 3\sin^2(x^2)\cdot\left(\sin(x^2)\right)'$
s: $\left(\sin(x^2)\right)' = \cos(x^2)\cdot 2x$
s: $f'(x) = 3\sin^2(x^2)\cdot\cos(x^2)\cdot 2x = 6x\sin^2(x^2)\cos(x^2)$

f: (1 - cos(x))/(1 + cos(x))
d: 2sin(x)/(1+cos(x))^2
dom: -2 2
regel: Quotiëntregel: $\left(\frac{u}{v}\right)' = \frac{u'v - uv'}{v^2}$
s: $u = 1 - \cos x \Rightarrow u' = \sin x$ en $v = 1 + \cos x \Rightarrow v' = -\sin x$
s: $f'(x) = \frac{\sin x\,(1+\cos x) + (1-\cos x)\sin x}{(1+\cos x)^2}$
s: $= \frac{2\sin x}{(1+\cos x)^2}$
</script>

<script type="text/plain" class="oefendata">
// ---------------- EXPONENTIËLE EN LOGARITMISCHE FUNCTIES ----------------
@cat explog
@voor 5 8
@niveau 1

f: e^(4x+1)
d: 4e^(4x+1)
dom: -1 1
regel: Kettingregel: $\left(e^u\right)' = e^u\cdot u'$
s: $u = 4x+1 \Rightarrow u' = 4$
s: $f'(x) = e^{4x+1}\cdot 4 = 4e^{4x+1}$
fout: e^(4x+1) | Vergeet de afgeleide van de exponent niet: $(4x+1)' = 4$.
fout: (4x+1)e^(4x) | Dit is geen macht van x: gebruik $\left(e^u\right)' = e^u\cdot u'$.

f: ln(x^2+1)
d: 2x/(x^2+1)
dom: -2 2
regel: Kettingregel: $(\ln u)' = \frac{u'}{u}$
s: $u = x^2+1 \Rightarrow u' = 2x$
s: $f'(x) = \frac{2x}{x^2+1}$
fout: 1/(x^2+1) | Vergeet de afgeleide van de binnenste functie niet: $(x^2+1)' = 2x$.

f: 3e^x - 2ln(x)
d: 3e^x - 2/x
dom: 0.3 3
regel: $(e^x)' = e^x$ en $(\ln x)' = \frac{1}{x}$
s: $(3e^x)' = 3e^x$
s: $(-2\ln x)' = -\frac{2}{x}$
fout: 3x e^(x-1) - 2/x | $e^x$ is geen macht van x: $(e^x)' = e^x$.

f: ln(5x)
d: 1/x
dom: 0.2 3
regel: Kettingregel $(\ln u)' = \frac{u'}{u}$ (of de rekenregel $\ln(5x) = \ln 5 + \ln x$)
s: $u = 5x \Rightarrow u' = 5$
s: $f'(x) = \frac{5}{5x} = \frac{1}{x}$
s: Of: $\ln(5x) = \ln 5 + \ln x$, en $\ln 5$ is een constante.
fout: 1/(5x) | Vergeet de afgeleide van de binnenste functie niet: $(5x)' = 5$.
fout: 5/x | $(\ln u)' = \frac{u'}{u}$: deel door de binnenste functie zelf (5x), niet door x.

f: 2^x
d: 2^x ln(2)
dom: -2 2
regel: Exponentiële functie met grondtal $a$: $\left(a^x\right)' = a^x\ln a$
s: De $x$ staat in de exponent en het grondtal is $a = 2$: dit is een exponentiële functie, geen macht van $x$.
s: $\left(2^x\right)' = 2^x\ln 2$
fout: x 2^(x-1) | $2^x$ is geen macht van x (de x staat in de exponent): $(a^x)' = a^x \ln a$.
fout: 2^x | Vergeet de factor ln 2 niet: enkel $e^x$ is zijn eigen afgeleide.

f: e^(-x^2)
d: -2x e^(-x^2)
dom: -2 2
regel: Kettingregel: $\left(e^u\right)' = e^u\cdot u'$
s: $u = -x^2 \Rightarrow u' = -2x$
s: $f'(x) = e^{-x^2}\cdot(-2x) = -2x\,e^{-x^2}$
fout: e^(-x^2) | Vergeet de afgeleide van de exponent niet: $(-x^2)' = -2x$.

f: log_2(x)
d: 1/(x ln(2))
dom: 0.3 3
regel: Logaritme met grondtal $a$: $\left(\log_a x\right)' = \frac{1}{x\ln a}$
s: $\log_2 x = \frac{\ln x}{\ln 2}$
s: $f'(x) = \frac{1}{\ln 2}\cdot\frac{1}{x} = \frac{1}{x\ln 2}$
fout: 1/x | Vergeet de factor $\frac{1}{\ln 2}$ niet: $(\log_a x)' = \frac{1}{x\ln a}$.

f: e^(3x) - e^(-x)
d: 3e^(3x) + e^(-x)
dom: -1 1
regel: Kettingregel: $\left(e^u\right)' = e^u\cdot u'$
s: $\left(e^{3x}\right)' = 3e^{3x}$
s: $\left(-e^{-x}\right)' = -e^{-x}\cdot(-1) = e^{-x}$
fout: 3e^(3x) - e^(-x) | Let op het minteken: $\left(e^{-x}\right)' = -e^{-x}$, dus $\left(-e^{-x}\right)' = +e^{-x}$.

@niveau 2
f: x^3 ln(x)
d: 3x^2 ln(x) + x^2
dom: 0.3 3
regel: Productregel: $(u\cdot v)' = u'v + uv'$
s: $u = x^3 \Rightarrow u' = 3x^2$ en $v = \ln x \Rightarrow v' = \frac{1}{x}$
s: $f'(x) = 3x^2\ln x + x^3\cdot\frac{1}{x} = 3x^2\ln x + x^2$
fout: 3x^2/x | $(u\cdot v)' \neq u'\cdot v'$. Gebruik de productregel.

f: x e^(-x)
d: (1-x)e^(-x)
dom: -1 3
regel: Productregel, met de kettingregel voor $e^{-x}$
s: $u = x \Rightarrow u' = 1$ en $v = e^{-x} \Rightarrow v' = -e^{-x}$
s: $f'(x) = e^{-x} - x\,e^{-x} = (1-x)\,e^{-x}$
fout: (1+x)e^(-x) | $\left(e^{-x}\right)' = -e^{-x}$: let op het minteken.
fout: -e^(-x) | $(u\cdot v)' \neq u'\cdot v'$. Gebruik de productregel.

f: e^(-2x)cos(4x)
d: -e^(-2x)(2cos(4x) + 4sin(4x))
dom: -1 1
regel: Productregel, met de kettingregel voor beide factoren
s: $u = e^{-2x} \Rightarrow u' = -2e^{-2x}$ en $v = \cos(4x) \Rightarrow v' = -4\sin(4x)$
s: $f'(x) = -2e^{-2x}\cos(4x) - 4e^{-2x}\sin(4x)$
s: $= -e^{-2x}\left(2\cos(4x) + 4\sin(4x)\right)$
fout: 8e^(-2x)sin(4x) | $(u\cdot v)' \neq u'\cdot v'$. Gebruik de productregel.

f: ln(x)/x
d: (1 - ln(x))/x^2
dom: 0.3 4
regel: Quotiëntregel: $\left(\frac{u}{v}\right)' = \frac{u'v - uv'}{v^2}$
s: $u = \ln x \Rightarrow u' = \frac{1}{x}$ en $v = x \Rightarrow v' = 1$
s: $f'(x) = \frac{\frac{1}{x}\cdot x - \ln x}{x^2} = \frac{1 - \ln x}{x^2}$
fout: 1/x | $\left(\frac{u}{v}\right)' \neq \frac{u'}{v'}$. Gebruik de quotiëntregel.

f: e^x/(e^x+1)
d: e^x/(e^x+1)^2
dom: -2 2
regel: Quotiëntregel: $\left(\frac{u}{v}\right)' = \frac{u'v - uv'}{v^2}$
s: $u = e^x \Rightarrow u' = e^x$ en $v = e^x+1 \Rightarrow v' = e^x$
s: $f'(x) = \frac{e^x(e^x+1) - e^x\cdot e^x}{(e^x+1)^2} = \frac{e^x}{(e^x+1)^2}$
fout: 1 | $\left(\frac{u}{v}\right)' \neq \frac{u'}{v'}$. Gebruik de quotiëntregel.

f: ln(sin(x))
d: cos(x)/sin(x)
dom: 0.3 2.8
regel: Kettingregel: $(\ln u)' = \frac{u'}{u}$
s: $u = \sin x \Rightarrow u' = \cos x$
s: $f'(x) = \frac{\cos x}{\sin x} = \cot x$
fout: 1/sin(x) | Vergeet de afgeleide van de binnenste functie niet: $(\sin x)' = \cos x$.

f: e^(sqrt(x))
d: e^(sqrt(x))/(2sqrt(x))
dom: 0.2 3
regel: Kettingregel: $\left(e^u\right)' = e^u\cdot u'$
s: $u = \sqrt{x} \Rightarrow u' = \frac{1}{2\sqrt{x}}$
s: $f'(x) = \frac{e^{\sqrt{x}}}{2\sqrt{x}}$
fout: e^(sqrt(x)) | Vergeet de afgeleide van de exponent niet: $(\sqrt{x})' = \frac{1}{2\sqrt{x}}$.

f: 3^(2x-1)
d: 2ln(3) 3^(2x-1)
dom: -1 1.5
regel: Kettingregel: $\left(a^u\right)' = a^u\ln a\cdot u'$
s: $u = 2x - 1 \Rightarrow u' = 2$
s: $f'(x) = 3^{2x-1}\cdot\ln 3\cdot 2 = 2\ln 3\cdot 3^{2x-1}$
fout: 2*3^(2x-1) | Vergeet de factor ln 3 niet: $(a^u)' = a^u \ln a\cdot u'$.
fout: (2x-1)3^(2x-2) | Dit is geen macht van x: de x staat in de exponent. Gebruik $(a^u)' = a^u\ln a\cdot u'$.

f: ln(x^2 - 4x + 5)
d: (2x-4)/(x^2-4x+5)
dom: -1 4
regel: Kettingregel: $(\ln u)' = \frac{u'}{u}$
s: $u = x^2-4x+5 \Rightarrow u' = 2x-4$
s: $f'(x) = \frac{2x-4}{x^2-4x+5}$
fout: 1/(x^2-4x+5) | Vergeet de afgeleide van de binnenste functie niet: $(x^2-4x+5)' = 2x-4$.

f: x^2 e^(3x)
d: x(3x+2)e^(3x)
dom: -1 1
regel: Productregel, met de kettingregel voor $e^{3x}$
s: $u = x^2 \Rightarrow u' = 2x$ en $v = e^{3x} \Rightarrow v' = 3e^{3x}$
s: $f'(x) = 2x\,e^{3x} + 3x^2e^{3x} = x(3x+2)\,e^{3x}$
fout: 2x e^(3x) + x^2 e^(3x) | Vergeet bij $e^{3x}$ de afgeleide van de exponent niet: $(3x)' = 3$.

f: ln(sqrt(x^2+1))
d: x/(x^2+1)
dom: -2 2
regel: Rekenregel $\ln\sqrt{u} = \frac12\ln u$, daarna de kettingregel
s: $\ln\sqrt{x^2+1} = \frac12\ln(x^2+1)$
s: $f'(x) = \frac12\cdot\frac{2x}{x^2+1} = \frac{x}{x^2+1}$

f: e^(sin(2x))
d: 2cos(2x)e^(sin(2x))
dom: -2 2
regel: Kettingregel: $\left(e^u\right)' = e^u\cdot u'$
s: $u = \sin(2x) \Rightarrow u' = 2\cos(2x)$
s: $f'(x) = e^{\sin(2x)}\cdot 2\cos(2x) = 2\cos(2x)\,e^{\sin(2x)}$
fout: e^(sin(2x)) | Vergeet de afgeleide van de exponent niet: $(\sin(2x))' = 2\cos(2x)$.
fout: cos(2x)e^(sin(2x)) | Bij $\sin(2x)$ vergeet je de afgeleide van $2x$.

f: ln(x)^2
d: 2ln(x)/x
dom: 0.3 3
regel: Kettingregel: $\left(u^2\right)' = 2u\cdot u'$ met $u = \ln x$
s: $u = \ln x \Rightarrow u' = \frac{1}{x}$
s: $f'(x) = 2\ln x\cdot\frac{1}{x} = \frac{2\ln x}{x}$
fout: 2ln(x) | Vergeet de afgeleide van de binnenste functie niet: $(\ln x)' = \frac{1}{x}$.

f: x^2 log(x)
d: 2x log(x) + x/ln(10)
dom: 0.3 3
regel: Productregel; $(\log x)' = \frac{1}{x\ln 10}$ ($\log$ is de logaritme met grondtal 10)
s: $u = x^2 \Rightarrow u' = 2x$ en $v = \log x \Rightarrow v' = \frac{1}{x\ln 10}$
s: $f'(x) = 2x\log x + x^2\cdot\frac{1}{x\ln 10} = 2x\log x + \frac{x}{\ln 10}$

f: e^x ln(x)
d: e^x ln(x) + e^x/x
dom: 0.3 3
regel: Productregel: $(u\cdot v)' = u'v + uv'$
s: $u = e^x \Rightarrow u' = e^x$ en $v = \ln x \Rightarrow v' = \frac{1}{x}$
s: $f'(x) = e^x\ln x + \frac{e^x}{x}$
fout: e^x/x | $(u\cdot v)' \neq u'\cdot v'$. Gebruik de productregel.

f: 2^(x^2)
d: 2x ln(2) 2^(x^2)
dom: -1.5 1.5
regel: Kettingregel: $\left(a^u\right)' = a^u\ln a\cdot u'$
s: $u = x^2 \Rightarrow u' = 2x$
s: $f'(x) = 2^{x^2}\cdot\ln 2\cdot 2x = 2x\ln 2\cdot 2^{x^2}$
fout: 2^(x^2) ln(2) | Vergeet de afgeleide van de exponent niet: $(x^2)' = 2x$.

@niveau 3
f: e^x/sin(x)
d: e^x(sin(x) - cos(x))/sin(x)^2
dom: 0.3 2.8
regel: Quotiëntregel: $\left(\frac{u}{v}\right)' = \frac{u'v - uv'}{v^2}$
s: $u = e^x \Rightarrow u' = e^x$ en $v = \sin x \Rightarrow v' = \cos x$
s: $f'(x) = \frac{e^x\sin x - e^x\cos x}{\sin^2 x} = \frac{e^x(\sin x - \cos x)}{\sin^2 x}$
fout: e^x/cos(x) | $\left(\frac{u}{v}\right)' \neq \frac{u'}{v'}$. Gebruik de quotiëntregel.

f: ln(3x)/(x^2+1)
d: (x^2 + 1 - 2x^2 ln(3x))/(x(x^2+1)^2)
dom: 0.3 3
regel: Quotiëntregel, met de kettingregel voor $\ln(3x)$
s: $u = \ln(3x) \Rightarrow u' = \frac{3}{3x} = \frac{1}{x}$ en $v = x^2+1 \Rightarrow v' = 2x$
s: $f'(x) = \frac{\frac{1}{x}(x^2+1) - 2x\ln(3x)}{(x^2+1)^2}$
s: Teller en noemer maal $x$: $\frac{x^2 + 1 - 2x^2\ln(3x)}{x\,(x^2+1)^2}$

f: ln((x-1)/(x+1))
d: 2/(x^2-1)
dom: 1.3 4
regel: Rekenregel $\ln\frac{a}{b} = \ln a - \ln b$, daarna afleiden
s: $\ln\frac{x-1}{x+1} = \ln(x-1) - \ln(x+1)$
s: $f'(x) = \frac{1}{x-1} - \frac{1}{x+1} = \frac{(x+1) - (x-1)}{(x-1)(x+1)} = \frac{2}{x^2-1}$

f: ln(ln(x))
d: 1/(x ln(x))
dom: 1.5 5
regel: Kettingregel: $(\ln u)' = \frac{u'}{u}$ met $u = \ln x$
s: $u = \ln x \Rightarrow u' = \frac{1}{x}$
s: $f'(x) = \frac{\frac{1}{x}}{\ln x} = \frac{1}{x\ln x}$
fout: 1/ln(x) | Vergeet de afgeleide van de binnenste functie niet: $(\ln x)' = \frac{1}{x}$.

f: (1 + ln(x))/(1 - ln(x))
d: 2/(x(1-ln(x))^2)
dom: 0.3 2.2
regel: Quotiëntregel: $\left(\frac{u}{v}\right)' = \frac{u'v - uv'}{v^2}$
s: $u = 1 + \ln x \Rightarrow u' = \frac{1}{x}$ en $v = 1 - \ln x \Rightarrow v' = -\frac{1}{x}$
s: $f'(x) = \frac{\frac{1}{x}(1-\ln x) + \frac{1}{x}(1+\ln x)}{(1-\ln x)^2} = \frac{\frac{2}{x}}{(1-\ln x)^2}$
s: $= \frac{2}{x\,(1-\ln x)^2}$
fout: -1 | $\left(\frac{u}{v}\right)' \neq \frac{u'}{v'}$. Gebruik de quotiëntregel.

f: e^(x^2) ln(x^2+1)
d: 2x e^(x^2) ln(x^2+1) + 2x e^(x^2)/(x^2+1)
dom: -1.5 1.5
regel: Productregel, met de kettingregel voor beide factoren
s: $u = e^{x^2} \Rightarrow u' = 2x\,e^{x^2}$ en $v = \ln(x^2+1) \Rightarrow v' = \frac{2x}{x^2+1}$
s: $f'(x) = 2x\,e^{x^2}\ln(x^2+1) + \frac{2x\,e^{x^2}}{x^2+1}$
</script>

<script type="text/plain" class="oefendata">
// ---------------- CYCLOMETRISCHE FUNCTIES (ENKEL 8 UUR) ----------------
@cat cyclo
@voor 8
@niveau 1

f: Bgsin(3x)
d: 3/sqrt(1-9x^2)
dom: -0.3 0.3
regel: Kettingregel: $\left(\operatorname{Bgsin} u\right)' = \frac{u'}{\sqrt{1-u^2}}$
s: $u = 3x \Rightarrow u' = 3$ en $u^2 = 9x^2$
s: $f'(x) = \frac{3}{\sqrt{1-9x^2}}$
fout: 1/sqrt(1-9x^2) | Vergeet de afgeleide van de binnenste functie niet: $(3x)' = 3$.
fout: 3/sqrt(1-3x^2) | Let op: $u^2 = (3x)^2 = 9x^2$.

f: Bgtan(2x)
d: 2/(1+4x^2)
dom: -2 2
regel: Kettingregel: $\left(\operatorname{Bgtan} u\right)' = \frac{u'}{1+u^2}$
s: $u = 2x \Rightarrow u' = 2$ en $u^2 = 4x^2$
s: $f'(x) = \frac{2}{1+4x^2}$
fout: 1/(1+4x^2) | Vergeet de afgeleide van de binnenste functie niet: $(2x)' = 2$.
fout: 2/(1+2x^2) | Let op: $u^2 = (2x)^2 = 4x^2$.

f: Bgcos(x^2)
d: -2x/sqrt(1-x^4)
dom: -0.9 0.9
regel: Kettingregel: $\left(\operatorname{Bgcos} u\right)' = \frac{-u'}{\sqrt{1-u^2}}$
s: $u = x^2 \Rightarrow u' = 2x$ en $u^2 = x^4$
s: $f'(x) = \frac{-2x}{\sqrt{1-x^4}}$
fout: 2x/sqrt(1-x^4) | Let op: $\left(\operatorname{Bgcos} u\right)' = \frac{-u'}{\sqrt{1-u^2}}$ (met minteken).
fout: -1/sqrt(1-x^4) | Vergeet de afgeleide van de binnenste functie niet: $(x^2)' = 2x$.

f: Bgtan(e^x)
d: e^x/(1+e^(2x))
dom: -2 2
regel: Kettingregel: $\left(\operatorname{Bgtan} u\right)' = \frac{u'}{1+u^2}$
s: $u = e^x \Rightarrow u' = e^x$ en $u^2 = \left(e^x\right)^2 = e^{2x}$
s: $f'(x) = \frac{e^x}{1+e^{2x}}$
fout: 1/(1+e^(2x)) | Vergeet de afgeleide van de binnenste functie niet: $(e^x)' = e^x$.

f: Bgcot(x/2)
d: -2/(4+x^2)
dom: -3 3
regel: Kettingregel: $\left(\operatorname{Bgcot} u\right)' = \frac{-u'}{1+u^2}$
s: $u = \frac{x}{2} \Rightarrow u' = \frac12$ en $u^2 = \frac{x^2}{4}$
s: $f'(x) = \frac{-\frac12}{1+\frac{x^2}{4}} = -\frac{2}{4+x^2}$ (teller en noemer maal 4)
fout: 2/(4+x^2) | Let op: $\left(\operatorname{Bgcot} u\right)' = \frac{-u'}{1+u^2}$ (met minteken).

f: Bgsin(x/3)
d: 1/sqrt(9-x^2)
dom: -2.5 2.5
regel: Kettingregel: $\left(\operatorname{Bgsin} u\right)' = \frac{u'}{\sqrt{1-u^2}}$
s: $u = \frac{x}{3} \Rightarrow u' = \frac13$
s: $f'(x) = \frac{\frac13}{\sqrt{1-\frac{x^2}{9}}} = \frac{\frac13}{\frac13\sqrt{9-x^2}} = \frac{1}{\sqrt{9-x^2}}$

f: 3Bgtan(x) - Bgsin(x)
d: 3/(1+x^2) - 1/sqrt(1-x^2)
dom: -0.9 0.9
regel: $\left(\operatorname{Bgtan} x\right)' = \frac{1}{1+x^2}$ en $\left(\operatorname{Bgsin} x\right)' = \frac{1}{\sqrt{1-x^2}}$
s: $\left(3\operatorname{Bgtan} x\right)' = \frac{3}{1+x^2}$
s: $\left(-\operatorname{Bgsin} x\right)' = -\frac{1}{\sqrt{1-x^2}}$

@niveau 2
f: x Bgtan(x)
d: Bgtan(x) + x/(1+x^2)
dom: -2 2
regel: Productregel: $(u\cdot v)' = u'v + uv'$
s: $u = x \Rightarrow u' = 1$ en $v = \operatorname{Bgtan} x \Rightarrow v' = \frac{1}{1+x^2}$
s: $f'(x) = \operatorname{Bgtan} x + \frac{x}{1+x^2}$
fout: 1/(1+x^2) | $(u\cdot v)' \neq u'\cdot v'$. Gebruik de productregel.

f: Bgcos(x)^2
d: -2Bgcos(x)/sqrt(1-x^2)
dom: -0.9 0.9
regel: Kettingregel: $\left(u^2\right)' = 2u\cdot u'$ met $u = \operatorname{Bgcos} x$
s: $u = \operatorname{Bgcos} x \Rightarrow u' = \frac{-1}{\sqrt{1-x^2}}$
s: $f'(x) = 2\operatorname{Bgcos} x\cdot\frac{-1}{\sqrt{1-x^2}} = -\frac{2\operatorname{Bgcos} x}{\sqrt{1-x^2}}$
fout: 2Bgcos(x) | Vergeet de afgeleide van de binnenste functie niet: $(\operatorname{Bgcos} x)' = \frac{-1}{\sqrt{1-x^2}}$.

f: Bgsin(sqrt(x))
d: 1/(2sqrt(x-x^2))
dom: 0.1 0.9
regel: Kettingregel: $\left(\operatorname{Bgsin} u\right)' = \frac{u'}{\sqrt{1-u^2}}$
s: $u = \sqrt{x} \Rightarrow u' = \frac{1}{2\sqrt{x}}$ en $u^2 = x$
s: $f'(x) = \frac{1}{\sqrt{1-x}}\cdot\frac{1}{2\sqrt{x}} = \frac{1}{2\sqrt{x-x^2}}$
fout: 1/sqrt(1-x) | Vergeet de afgeleide van de binnenste functie niet: $(\sqrt{x})' = \frac{1}{2\sqrt{x}}$.

f: ln(Bgtan(x))
d: 1/((1+x^2)Bgtan(x))
dom: 0.2 3
regel: Kettingregel: $(\ln u)' = \frac{u'}{u}$ met $u = \operatorname{Bgtan} x$
s: $u = \operatorname{Bgtan} x \Rightarrow u' = \frac{1}{1+x^2}$
s: $f'(x) = \frac{\frac{1}{1+x^2}}{\operatorname{Bgtan} x} = \frac{1}{(1+x^2)\operatorname{Bgtan} x}$
fout: 1/Bgtan(x) | Vergeet de afgeleide van de binnenste functie niet: $(\operatorname{Bgtan} x)' = \frac{1}{1+x^2}$.

f: Bgtan(1/x)
d: -1/(1+x^2)
dom: 0.3 3
regel: Kettingregel: $\left(\operatorname{Bgtan} u\right)' = \frac{u'}{1+u^2}$
s: $u = \frac{1}{x} \Rightarrow u' = -\frac{1}{x^2}$ en $u^2 = \frac{1}{x^2}$
s: $f'(x) = \frac{-\frac{1}{x^2}}{1+\frac{1}{x^2}} = \frac{-1}{x^2+1}$ (teller en noemer maal $x^2$)
fout: 1/(1+1/x^2) | Vergeet de afgeleide van de binnenste functie niet: $\left(\frac1x\right)' = -\frac{1}{x^2}$.

f: Bgsin(2x-1)
d: 1/sqrt(x-x^2)
dom: 0.1 0.9
regel: Kettingregel: $\left(\operatorname{Bgsin} u\right)' = \frac{u'}{\sqrt{1-u^2}}$
s: $u = 2x-1 \Rightarrow u' = 2$ en $1 - u^2 = 1 - (4x^2 - 4x + 1) = 4x - 4x^2$
s: $f'(x) = \frac{2}{\sqrt{4x-4x^2}} = \frac{2}{2\sqrt{x-x^2}} = \frac{1}{\sqrt{x-x^2}}$
fout: 1/sqrt(1-(2x-1)^2) | Vergeet de afgeleide van de binnenste functie niet: $(2x-1)' = 2$.

f: e^(Bgtan(x))
d: e^(Bgtan(x))/(1+x^2)
dom: -2 2
regel: Kettingregel: $\left(e^u\right)' = e^u\cdot u'$
s: $u = \operatorname{Bgtan} x \Rightarrow u' = \frac{1}{1+x^2}$
s: $f'(x) = \frac{e^{\operatorname{Bgtan} x}}{1+x^2}$
fout: e^(Bgtan(x)) | Vergeet de afgeleide van de exponent niet: $(\operatorname{Bgtan} x)' = \frac{1}{1+x^2}$.

f: Bgtan(sqrt(x))
d: 1/(2sqrt(x)(1+x))
dom: 0.2 3
regel: Kettingregel: $\left(\operatorname{Bgtan} u\right)' = \frac{u'}{1+u^2}$
s: $u = \sqrt{x} \Rightarrow u' = \frac{1}{2\sqrt{x}}$ en $u^2 = x$
s: $f'(x) = \frac{1}{1+x}\cdot\frac{1}{2\sqrt{x}} = \frac{1}{2\sqrt{x}\,(1+x)}$

f: Bgsin(x)/x
d: (x/sqrt(1-x^2) - Bgsin(x))/x^2
dom: 0.1 0.9
regel: Quotiëntregel: $\left(\frac{u}{v}\right)' = \frac{u'v - uv'}{v^2}$
s: $u = \operatorname{Bgsin} x \Rightarrow u' = \frac{1}{\sqrt{1-x^2}}$ en $v = x \Rightarrow v' = 1$
s: $f'(x) = \frac{\frac{x}{\sqrt{1-x^2}} - \operatorname{Bgsin} x}{x^2}$

@niveau 3
f: x^2 Bgsin(sqrt(x))
d: 2x Bgsin(sqrt(x)) + x^2/(2sqrt(x-x^2))
dom: 0.1 0.9
regel: Productregel, met een geneste kettingregel
s: $u = x^2 \Rightarrow u' = 2x$
s: $v = \operatorname{Bgsin}\sqrt{x} \Rightarrow v' = \frac{1}{\sqrt{1-x}}\cdot\frac{1}{2\sqrt{x}} = \frac{1}{2\sqrt{x-x^2}}$
s: $f'(x) = 2x\operatorname{Bgsin}\sqrt{x} + \frac{x^2}{2\sqrt{x-x^2}}$

f: Bgtan((1+x)/(1-x))
d: 1/(1+x^2)
dom: -0.8 0.8
regel: Kettingregel, met de quotiëntregel voor de binnenste functie
s: $u = \frac{1+x}{1-x} \Rightarrow u' = \frac{(1-x) + (1+x)}{(1-x)^2} = \frac{2}{(1-x)^2}$
s: $1 + u^2 = \frac{(1-x)^2 + (1+x)^2}{(1-x)^2} = \frac{2 + 2x^2}{(1-x)^2}$
s: $f'(x) = \frac{u'}{1+u^2} = \frac{2}{2+2x^2} = \frac{1}{1+x^2}$

f: Bgsin((x^2-1)/(x^2+1))
d: 2/(x^2+1)
dom: 0.2 3
regel: Kettingregel, met de quotiëntregel voor de binnenste functie
s: $u = \frac{x^2-1}{x^2+1} \Rightarrow u' = \frac{2x(x^2+1) - (x^2-1)\cdot 2x}{(x^2+1)^2} = \frac{4x}{(x^2+1)^2}$
s: $1 - u^2 = \frac{(x^2+1)^2 - (x^2-1)^2}{(x^2+1)^2} = \frac{4x^2}{(x^2+1)^2}$, dus $\sqrt{1-u^2} = \frac{2x}{x^2+1}$ (voor $x > 0$)
s: $f'(x) = \frac{4x}{(x^2+1)^2}\cdot\frac{x^2+1}{2x} = \frac{2}{x^2+1}$

f: Bgcos(sqrt(1-x^2))
d: 1/sqrt(1-x^2)
dom: 0.1 0.9
regel: Kettingregel: $\left(\operatorname{Bgcos} u\right)' = \frac{-u'}{\sqrt{1-u^2}}$
s: $u = \sqrt{1-x^2} \Rightarrow u' = \frac{-x}{\sqrt{1-x^2}}$ en $1 - u^2 = x^2$
s: $f'(x) = \frac{\frac{x}{\sqrt{1-x^2}}}{\sqrt{x^2}} = \frac{x}{x\sqrt{1-x^2}} = \frac{1}{\sqrt{1-x^2}}$ (voor $x > 0$)

f: x Bgsin(x) + sqrt(1-x^2)
d: Bgsin(x)
dom: -0.9 0.9
regel: Productregel en kettingregel; vereenvoudig daarna.
s: $\left(x\operatorname{Bgsin} x\right)' = \operatorname{Bgsin} x + \frac{x}{\sqrt{1-x^2}}$
s: $\left(\sqrt{1-x^2}\right)' = \frac{-x}{\sqrt{1-x^2}}$
s: Samen: $f'(x) = \operatorname{Bgsin} x$

f: Bgtan(x) + Bgtan(1/x)
d: 0
dom: 0.3 3
regel: Leid elke term af en vereenvoudig.
s: $\left(\operatorname{Bgtan} x\right)' = \frac{1}{1+x^2}$
s: $\left(\operatorname{Bgtan}\frac{1}{x}\right)' = \frac{-\frac{1}{x^2}}{1+\frac{1}{x^2}} = -\frac{1}{x^2+1}$
s: Samen: $f'(x) = 0$. De functie is dus constant (voor $x > 0$ is ze gelijk aan $\frac{\pi}{2}$).

f: sqrt(1-x^2) Bgsin(x)
d: 1 - x Bgsin(x)/sqrt(1-x^2)
dom: -0.9 0.9
regel: Productregel: $(u\cdot v)' = u'v + uv'$
s: $u = \sqrt{1-x^2} \Rightarrow u' = \frac{-x}{\sqrt{1-x^2}}$ en $v = \operatorname{Bgsin} x \Rightarrow v' = \frac{1}{\sqrt{1-x^2}}$
s: $f'(x) = \frac{-x\operatorname{Bgsin} x}{\sqrt{1-x^2}} + \sqrt{1-x^2}\cdot\frac{1}{\sqrt{1-x^2}}$
s: $= 1 - \frac{x\operatorname{Bgsin} x}{\sqrt{1-x^2}}$

f: (x^2+1)Bgtan(x) - x
d: 2x Bgtan(x)
dom: -2 2
regel: Productregel; vereenvoudig daarna.
s: $\left((x^2+1)\operatorname{Bgtan} x\right)' = 2x\operatorname{Bgtan} x + (x^2+1)\cdot\frac{1}{1+x^2} = 2x\operatorname{Bgtan} x + 1$
s: $(-x)' = -1$
